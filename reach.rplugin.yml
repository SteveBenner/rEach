schema: rplugin/v1
id: reach
name: Reach
version: 0.16.24
rplugin: ">= 1.2.0"
description: "rEach, the student's academic assistant for a Teach-run course: greets and gets to know the student, keeps course rules, checks work, submits it and shows receipts."
ports:
  required: [secrets, state, events]
  optional: [corpus, schedule]
extensions:
  enabled: [claude-code, codex, os]
corpora:
  owns: { id: reach, reads_kinds: [note, tip, attempt, receipt, qualification, source, finding], writes_kinds: [note, tip, attempt, receipt, qualification, source, finding], kinds_file: specs/kinds.yml, tiers_split: true }
  consumes: []
contents:
  skills:
    - { id: reach-course, path: skills/reach-course/SKILL.md }
    - { id: reach-submit, path: skills/reach-submit/SKILL.md }
    - { id: reach-help, path: skills/reach-help/SKILL.md }
    - { id: reach-assistant, path: skills/reach-assistant/SKILL.md }
    - { id: reach-build, path: skills/reach-build/SKILL.md }
    - { id: reach-fix, path: skills/reach-fix/SKILL.md }
    - { id: reach-feature, path: skills/reach-feature/SKILL.md }
    - { id: reach-bug, path: skills/reach-bug/SKILL.md }
    - { id: reach-checkpoint, path: skills/reach-checkpoint/SKILL.md }
    - { id: design-taste-frontend, path: skills/design-taste-frontend/SKILL.md }
  agents:
    - { id: reach, path: agents/reach.md }
  specs:
    - { path: specs/app.yml }
  hooks: hooks/reach.hooks.yml
  mcp:
    - { id: reach, command: ruby, args: ["${PLUGIN_ROOT}/exe/reach", "mcp"] }
  docs:
    - { path: docs/student-guide.md }
    - { path: docs/INSTALLATION-AND-SETUP-GUIDE.docx }
    - { path: INSTALL.md }
native:
  claude_agent: "reach:reach"
  interface:
    display_name: rEach
    short_description: Your academic assistant for a Teach-run course
    developer_name: PatḗrasAI
    category: Education
    default_prompt: ["Hi rEach"]
  keywords: [education, course, students, assistant]
  author: { name: PatḗrasAI }
compatibility:
  ruby: ">= 2.6"
  harnesses: { claude-code: supported, codex: supported, hermes: unsupported }
repository:
  remote: "git@github.com:SteveBenner/rEach.git"
  store_path: reach
