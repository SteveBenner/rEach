---
schema: rplugin.config/v1
corpus:
  id: reach
teach:
  url: https://sven-f1l1.tail062fd2.ts.net
enrollment:
  lockout_refusals: 5
  lockout_minutes: 15
  fingerprint_match: binding
instructor:
  keyring_refresh_s: 900
updates:
  repository: https://github.com/SteveBenner/rEach
  interval_s: 3600
  jitter_s: 600
  max_attempts: 5
runtime:
  auto_install: true
  interval_s: 3600
  jitter_s: 600
  max_attempts: 5
brain:
  enabled: true
  capture_min_chars: 1
  sources_per_hour: 120
  duplicate: 0.85
  related: 0.5
  per_hour: 30
  per_day: 150
  max_record_bytes: 4096
  nudge_every_turns: 3
  nudge_max_turns: 24
  session_budget_bytes: 1500
  prompt_budget_bytes: 800
  prompt_k: 4
  prompt_min_score: 0.2
  admit_interval_s: 300
  admit_max_backoff_s: 3600
  max_spool_bytes: 20971520
  course_recall: true
  course_k: 3
  course_budget_bytes: 600
  course_min_score: 0.2
debug:
  render: auto
  spool_max_bytes: 5242880
  batch_max_events: 500
  show_max_rows: 40
link:
  hiccup_quiet_minutes: 15
  fault_max_per_hour: 60
rstack:
  backup:
    schema: rplugin.plugin-backup/v1
    plugin: reach
    status: pending-activation
    source:
      roots:
      - name: corpus
        path: "~/.corpora/reach"
    policy:
      copies: 3
      off_disk_copies: 2
    mirrors: []
submit:
  archive_max_mb: 256
live:
  enabled: true
  wake: true
  notify: true
  blocked: true
issues:
  enabled: true
  repeat_threshold: 3
  window_h: 24
  max_per_day: 3
  max_queued: 10
storage:
  warn_mb:
  - 512
  - 1024
  - 2048
  demand_mb: 4096
  check_interval_s: 3600
import:
  next_max_bytes: 12000
  progress_every: 500
late_work:
  allow: true
  notice_every: 10
hooks:
  lock_wait_s: 2
  require: true
codex:
  setup: true
  sandbox: auto
  heal: true
  probe_timeout_s: 20
transcripts:
  auto_export: true
agent_control:
  render: true
  controls: true
  test_mode: true
