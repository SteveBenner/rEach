---
schema: rplugin.config/v1
corpus:
  id: reach
course:
  timezone: America/Los_Angeles
teach:
  url:
enrollment:
  institution_name: La Sierra
  username_domain: lasierra.edu
  username_pattern: "^[a-z]{4}[0-9]{3}$"
  student_id_pattern: "^[0-9]{7}$"
  lockout_refusals: 5
  lockout_minutes: 15
  fingerprint_match: binding
updates:
  repository: https://github.com/SteveBenner/rEach
  interval_s: 3600
  jitter_s: 600
  max_attempts: 5
runtime:
  auto_install: true
  interval_s: 3600
  jitter_s: 600
  max_attempts: 5
brain:
  enabled: true
  capture_min_chars: 40
  sources_per_hour: 120
  duplicate: 0.85
  related: 0.5
  per_hour: 30
  per_day: 150
  max_record_bytes: 4096
  nudge_every_turns: 3
  nudge_max_turns: 24
  session_budget_bytes: 1500
  prompt_budget_bytes: 800
  prompt_k: 4
  prompt_min_score: 0.2
  admit_interval_s: 300
  admit_max_backoff_s: 3600
  max_spool_bytes: 20971520
rstack:
  backup:
    schema: rplugin.plugin-backup/v1
    plugin: reach
    status: pending-activation
    source:
      roots:
      - name: corpus
        path: "~/.corpora/reach"
    policy:
      copies: 3
      off_disk_copies: 2
    mirrors:
    - name: pcloud
      require_mount: "~/pCloudDrive"
      encrypt: true
      path: "~/pCloudDrive/corpora/rstack-plugins/reach-mirror"
    - name: sven-b1
      require_mount: "/run/media/${USER}/SVEN-B1"
      encrypt: true
      path: "/run/media/${USER}/SVEN-B1/corpora/rstack-plugins/reach-mirror"
