---
schema: rplugin.config/v1
corpus:
  id: reach
course:
  timezone: America/Los_Angeles
teach:
  url:
enrollment:
  institution_name: school
  username_domain: school.example
  username_pattern: "^[a-z][a-z0-9._-]{1,31}$"
  student_id_pattern: "^[0-9]{5,10}$"
  lockout_refusals: 5
  lockout_minutes: 15
  fingerprint_match: binding
updates:
  repository: https://github.com/SteveBenner/rEach
  interval_s: 3600
  jitter_s: 600
  max_attempts: 5
runtime:
  auto_install: true
  interval_s: 3600
  jitter_s: 600
  max_attempts: 5
rstack:
  backup:
    schema: rplugin.plugin-backup/v1
    plugin: reach
    status: pending-activation
    source:
      roots:
      - name: corpus
        path: "~/.corpora/reach"
    policy:
      copies: 3
      off_disk_copies: 2
    mirrors:
    - name: pcloud
      require_mount: "~/CloudDrive"
      encrypt: true
      path: "~/CloudDrive/corpora/rstack-plugins/reach-mirror"
    - name: backup-drive
      require_mount: "/run/media/${USER}/BACKUP-DRIVE"
      encrypt: true
      path: "/run/media/${USER}/BACKUP-DRIVE/corpora/rstack-plugins/reach-mirror"
