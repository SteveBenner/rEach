schema: reach.greetings/v1
locale: en-US
greetings:
  G-LOGIN: "Hi, I'm rEach, your academic assistant. Before we start, please type your student ID so I know who I'm working with."
  G-UPDATING: "Before we start: rEach is installing an update (version {version}). You need it to keep using rEach. It takes about a minute, and your work is safe."
  G-INSTALLED: "rEach is installed and ready."
  G-INSTALLED-ENROLL: "Hi, I'm rEach, your academic assistant. Before anything else, connect rEach to your course."
  G-FIRST-RUN: "Hi, I'm rEach, your academic assistant! Since I don't know anything about you yet, let's start with a brief interview. It takes about five minutes, and you can skip any question. What I save about you stays on this computer: I use it to explain things in ways that suit you, and it never affects your grade.\n\nFirst question: what would you like me to call you?"
  G-RESUME: "Welcome back, {name}! We didn't finish getting to know each other last time. Want to pick up where we left off, or jump straight into your work?"
  G-RESUME-NONAME: "Welcome back! We didn't finish getting to know each other last time. Want to pick up where we left off, or jump straight into your work?"
  G-NOT-ENROLLED: "Hi {name}, rEach here. I'm not connected to your course yet. Paste the course passkey your instructor gave you and I'll set everything up."
  G-RETURNING: "Welcome back, {name}! {assignment} is due {due}, and your {slice} work is {state}. What would you like to work on?"
  G-RETURNING-MANY: "Welcome back, {name}! {assignment} is due {due}. Your work: {slices}. What would you like to work on?"
  G-RETURNING-PLAIN: "Welcome back, {name}! What would you like to work on?"
  G-COURSE-QUESTION: "One more question from your course, whenever you're ready: {question}"
  G-BANNER-FIRST: "rEach is ready. Say hi to get started."
  G-CLOSE-READBACK: "Here's what I'll remember:"
  G-CLOSE-ASK: "Anything you'd like to change or leave out?"
  G-CLOSE-SAVED: "Saved. Ask me 'what do you know about me?' anytime to see or change it, or say 'forget my profile' to delete it. Want to see your first assignment?"
  G-MEMORY-NOTICE: "I also keep a private memory of what I learn about you and your work. It stays on this computer. It is never sent to your instructors. You can ask me what I remember, or ask me to forget it, any time."
  G-REACH-OUT: "One more thing: you can always reach your instructors through me. There are two ways.\n\n✋ Raising your hand is just like raising your hand in class. When you're stuck, something isn't working, or you want a real person to help, tell me \"raise my hand\" or \"I need help from my teacher\". I'll send them a note about what's going on, and their answer shows up right here in our chat. No special words needed.\n\n💬 Sending feedback is like dropping a note in a suggestion box. It's for things that can wait. Say \"I have feedback\" and tell me what's on your mind; I'll help you pick the kind:\n 💬 General: how the course is going for you\n 🌟 Praise: something that worked well\n 💡 Idea: a way to make the course better\n 🙋 Request: asking for something\n ❓ Question: one that can wait\n 😤 Complaint: something frustrating or unfair\n 🐞 Problem: something broken, like a typo\n ⏱ Pace: too fast, too slow, too much\n\nYou can send it with your name or without it, and I'll show you exactly what I send first."
