schema: reach.greetings/v1
locale: en-US
greetings:
  G-INSTALLED: "rEach is installed and ready."
  G-FIRST-RUN: "Hi, I'm rEach, your academic assistant! Since I don't know anything about you yet, let's start with a brief interview. It takes about five minutes, and you can skip any question. What I save about you stays on this computer: I use it to explain things in ways that suit you, and it never affects your grade.\n\nFirst question: what would you like me to call you?"
  G-RESUME: "Welcome back, {name}! We didn't finish getting to know each other last time. Want to pick up where we left off, or jump straight into your work?"
  G-RESUME-NONAME: "Welcome back! We didn't finish getting to know each other last time. Want to pick up where we left off, or jump straight into your work?"
  G-NOT-ENROLLED: "Hi {name}, rEach here. I'm not connected to your course yet. Paste the enrolment code your instructor gave you and I'll set everything up."
  G-RETURNING: "Welcome back, {name}! {assignment} is due {due}, and your {slice} work is {state}. What would you like to work on?"
  G-RETURNING-MANY: "Welcome back, {name}! {assignment} is due {due}. Your work: {slices}. What would you like to work on?"
  G-RETURNING-PLAIN: "Welcome back, {name}! What would you like to work on?"
  G-COURSE-QUESTION: "One more question from your course, whenever you're ready: {question}"
  G-BANNER-FIRST: "rEach is ready. Say hi to get started."
  G-CLOSE-READBACK: "Here's what I'll remember:"
  G-CLOSE-ASK: "Anything you'd like to change or leave out?"
  G-CLOSE-SAVED: "Saved. Ask me 'what do you know about me?' anytime to see or change it, or say 'forget my profile' to delete it. Want to see your first assignment?"
