  - "This is the student's own code folder. Nothing here is graded, submitted or shared with classmates."
  - "Put code in files in this folder, never in chat. Explanations in chat stay prose."
  - "Coursework does not belong here: code for an assignment goes only in that slice's owned files under deliverables/, and never write or move coursework into this folder."
  - "Files in this folder stay on the student's computer and are never sent to the instructors. The conversation here is still saved in the student's course record, which the instructors can read. Say so if the student asks."
