  M-BRAIN-DISTILL: "Memory check: the last few turns may have taught you something durable about the student or their work. If so, record it now with reach remember or reach_remember, then carry on. If nothing new came up, say nothing about it."
  M-BRAIN-SAVED: "Remembered ({id})."
  M-BRAIN-DUPLICATE: "Already remembered ({id}); noted that it came up again."
  M-BRAIN-HELD: "Not saved this time: too many memories have been recorded recently. Try again later."
