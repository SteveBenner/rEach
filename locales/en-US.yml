schema: reach.locale/v1
locale: en-US
messages:
  M-GATE-NOENROLL: "rEach is locked until you enroll in your course. Type anything in a chat with your AI partner and rEach will walk you through it, or run reach enroll in a terminal."
  M-GATE-NOGUARD: "Your course rules haven't arrived yet, so rEach can't start on course work. Run reach sync, and if that doesn't work, tell your instructor."
  M-GATE-OLDGUARD: "Your course rules have an update. Run reach sync to get it, then try again."
  M-GATE-REVOKED: "This computer's rEach was switched off by your instructor. Ask them for a new course passkey."
  M-GATE-STALE: "rEach hasn't been able to check in with your course for over a day. Connect to the internet and run reach sync."
  M-UPDATE-INSTALLING: "rEach is installing an update (version {version}) that you need to keep using it. Give it a minute, then try again; your work is safe."
  M-UPDATE-READY: "A rEach update (version {version}) is ready. It installs the next time you start a session, so nothing changes in the middle of your work."
  M-UPDATE-DONE: "rEach is up to date (version {version}). Start a new session when it suits you to load everything."
  M-UPDATE-RETRY: "rEach couldn't finish installing an update (version {version}) just now. You can keep working; it will try again on its own."
  M-REACH-OUTDATED: "This version of rEach ({version}) is too old for your course, which needs {minimum} or newer. Update rEach, then try again."
  M-AUTH-FAILED: "Your course server didn't accept rEach's signature. Check that your computer's clock is right, then run reach sync. If it keeps happening, tell your instructor."
  M-ENROLL-REFUSED: "That course passkey wasn't accepted. Check it's typed correctly, or ask your instructor for a new one."
  M-ENROLL-DONE: "You're connected to {course}. rEach is fetching your course materials now."
  M-ENR-WELCOME: "Welcome to rEach. Before anything else, connect rEach to your course. Please type the course passkey your instructor gave you. It looks like BUS101-K7QX-94TD."
  M-ENR-ASK-CODE: "Please type the course passkey your instructor gave you. It looks like BUS101-K7QX-94TD."
  M-ENR-CODE-FORMAT: "That doesn't look like a course passkey. It starts with the course, like BUS101, followed by eight letters and numbers, like BUS101-K7QX-94TD. Please type it again."
  M-ENR-CODE-COURSE-ONLY: "That's the course, {course_id}. The course passkey is longer: the course followed by eight letters and numbers, like {course_id}-K7QX-94TD. Please type the whole passkey."
  M-ENR-CODE-UNKNOWN: "That course passkey wasn't recognized. Check it against the one your instructor shared and type it again."
  M-ENR-CODE-SUGGEST: "That course passkey wasn't recognized. Did you mean a passkey for {course_id}? Check the passkey your instructor shared and type it again."
  M-ENR-CODE-EXPIRED: "That course passkey belongs to a course that has ended, so it can't be used anymore. Ask your instructor for the current passkey."
  M-ENR-CODE-OLD: "That course passkey has expired. Ask your instructor for the current passkey."
  M-ENR-MOVE-PENDING: "You're already enrolled on another computer, so your instructor needs to approve this one. They've been asked. Once they say it's approved, type yes here."
  M-ENR-MOVE-DENIED: "Your instructor didn't approve enrolling this computer: {reason} If you think that's a mistake, talk to them, then type your course passkey to try again."
  M-ENR-ASK-USERNAME: "That's the passkey for {course_title} ({course_id}, {term}). Now please type your {institution} username. It's your university email, like jsmi123@{domain}."
  M-ENR-USERNAME-FORMAT: "That doesn't look like a {institution} username. It's your university email: the first letter of your first name, the first three letters of your last name, then three numbers, like jsmi123@{domain}. Please type it again."
  M-ENR-ASK-ID: "Thanks. Now please type your {institution} student ID, the number on your student card."
  M-ENR-ID-FORMAT: "That doesn't look like a {institution} student ID. It's the number on your student card, like 1234567. Please type it again."
  M-ENR-CONFIRM: "Please check: enroll {username}, student ID {student_id}, in {course_title} ({course_id}, {term})? Type yes to enroll, or no to start over."
  M-ENR-ASK-PASSWORD: "Last step: choose a password for rEach, at least 8 characters, and type it here. Write it down somewhere safe now; you will need it, and nobody can look it up for you. Only you and the course server get it, and the AI never sees what you type."
  M-ENR-ASK-PASSWORD-AGAIN: "Please type the same password again, to make sure it is right."
  M-ENR-PASSWORD-SHORT: "That password is too short. Please choose one with at least 8 characters (and no more than 256)."
  M-ENR-PASSWORD-MISMATCH: "The two passwords didn't match. Please choose your password again."
  M-ENR-PASSWORD-TERMINAL: "To choose your password privately, finish enrolling in a terminal: run {command} and answer its questions there. Your typing stays hidden and the AI never sees it."
  M-ENR-PASSWORD-RETRY-FAILED: "rEach couldn't finish enrolling you: {reason} To try again, type your password again, or type start over to begin again."
  M-ENR-PASSWORD-RETRY-OFFLINE: "rEach couldn't reach your course server just now. Check your internet connection, then type your password again to try again."
  M-ENR-PASSWORD-REMINDER: "Keep the password you chose written down somewhere safe."
  M-ENR-RESTART: "No problem, let's start over. Please type the course passkey your instructor gave you."
  M-ENR-REFUSED: "Your course server couldn't match that username and student ID to the class list for {course_id}. Please type your username again, carefully. If it still doesn't work, ask your instructor to check the class list."
  M-INSTRUCTOR-UNLOCKED: "Instructor unlock accepted. rEach no longer blocks your prompts on this computer. To undo it, run reach instructor lock in a terminal."
  M-INSTRUCTOR-REFUSED: "That is not a valid instructor code. Check that it was copied whole, that it has not been revoked, and that this release of rEach knows its key."
  M-INSTRUCTOR-CONTEXT: "rEach is in instructor mode on this computer. It is not enrolled in a course, so course commands will say so."
  M-INSTRUCTOR-STATUS: "Instructor unlock is on. Code {code_id}, label {label}, key {key_id}, unlocked {unlocked_at}."
  M-INSTRUCTOR-STATUS-OFF: "Instructor unlock is off."
  M-INSTRUCTOR-LOCKED: "Instructor unlock is off. rEach is locked until you enroll or paste an instructor code."
  M-INSTRUCTOR-NO-KEY: "No instructor key was found at {path}. Run reach instructor keygen first, or pass --key with the path of your key."
  M-INSTRUCTOR-KEY-UNPINNED: "Key {key_id} is not pinned in config.yml under enrollment.instructor_keys, so no install would accept its codes. Add the entry that reach instructor keygen printed, release it, then mint again."
  M-INSTRUCTOR-KEY-EXISTS: "A key already exists at {path}, so rEach will not overwrite it. Pass --out with a new path, or move the old key aside."
  M-INSTRUCTOR-KEYGEN: "New instructor key written to {path} (key id {key_id}). Keep it out of chats and repositories. Add this entry to config.yml and ship it in a release:\n\n{entry}"
  M-INSTRUCTOR-USAGE: "usage: reach instructor keygen [--out PATH] | code [--label TEXT] [--key PATH] | status [--format text|json] | lock | dummy [--course ID] | as USERNAME [--course ID] | exit"
  M-PERSONA-STARTED: "You are now {display_name} in {course_id}. rEach on this computer works exactly as a student's does, in {workspace}. When rEach asks for a student ID to sign in, type {student_id}. Run reach instructor exit to go back to instructor mode."
  M-PERSONA-EXITED: "{display_name} is retired and moved to a .backup folder. rEach on this computer is back in instructor mode."
  M-PERSONA-ACTIVE: "This computer is already running {display_name} (persona {id}). Run reach instructor exit first."
  M-PERSONA-NONE: "No test student is active on this computer."
  M-PERSONA-NEEDS-UNLOCK: "Test students need the instructor unlock. Paste your instructor code into a prompt, or run reach instructor status to see where this computer stands."
  M-PERSONA-CODE-REFUSED: "The course server did not accept your instructor code ({reason}). Check that this release of rEach and the course server both know its key, and that the code has not been revoked."
  M-PERSONA-COURSE-NEEDED: "The course server needs to know which course to use. Run the command again with --course followed by one of: {courses}."
  M-PERSONA-NO-STUDENT: "No active student in that course has the username {username}. Check the spelling against the course roster."
  M-PERSONA-TEACH-OLD: "The course server is too old to run test students. Update the course server first, then try again."
  M-PERSONA-LOCKED: "This computer's test student was switched off because the instructor code behind it is no longer valid. Paste a valid instructor code, or run reach instructor exit."
  M-PERSONA-STATUS: "Persona: {display_name} (persona {id}, {kind}, username {username}, student ID {student_id}) in {course_id}, started {started_at}. Workspace: {workspace}."
  M-PERSONA-ENROLLED: "This computer is enrolled as a student, so it cannot also run a test student. Use a computer that is not enrolled."
  M-PERSONA-NO-SERVER: "This copy of rEach has no course server configured. Run reach update, then try again."
  M-DEBUG-TITLE: "rEach debug ({reason}): {count} events"
  M-DEBUG-COL-TIME: "time"
  M-DEBUG-COL-KIND: "kind"
  M-DEBUG-COL-WHAT: "what"
  M-DEBUG-COL-RESULT: "result"
  M-DEBUG-COL-MS: "ms"
  M-DEBUG-MORE: "+{count} more"
  M-DEBUG-NONE: "No debug events yet."
  M-DEBUG-NOTICE: "Your instructor switched rEach into debug mode on this computer. It records what rEach did (hooks, checks, requests, timings), never your prompts, replies, files or passwords, and sends it to the course server. Run reach debug status to see it, or ask your instructor to switch it off."
  M-DEBUG-ON: "Debug mode is on until you run reach debug off."
  M-DEBUG-ON-UNTIL: "Debug mode is on until {until}. Run reach debug off to stop sooner."
  M-DEBUG-OFF: "Debug mode is off on this computer."
  M-DEBUG-REMOTE-STILL: "Your instructor has also asked for debug mode, so it stays on until they switch it off."
  M-DEBUG-PERSONA: "Debug mode is always on while a test student is active. Run reach instructor exit to end the test student."
  M-DEBUG-STATUS-ON: "Debug mode is on ({reason}), until {until}. Events: {queued} waiting to send, {sent} sent, {dropped} dropped."
  M-DEBUG-STATUS-OFF: "Debug mode is off. Events: {queued} waiting to send, {sent} sent."
  M-DEBUG-FLUSHED: "Debug events sent: {sent}. Stopped: {stopped}."
  M-DEBUG-USAGE: "usage: reach debug on [--for MINUTES] | off | status [--format text|json] | show [--last N] [--format ascii|markdown|json] | flush"
  M-ENR-LOCKED: "Too many tries. Please wait {minutes} minutes and try again, or ask your instructor for help."
  M-ENR-OFFLINE: "rEach couldn't reach your course server just now. Check your internet connection, then type yes to try again."
  M-ENR-FAILED: "rEach couldn't finish enrolling you: {reason} Type yes to try again, or start over to begin again."
  M-ENR-DONE: "You're enrolled in {course_title}, {first_name}. rEach is fetching your course materials now. Keep the password you chose written down somewhere safe. To start on course work, run: {launch}"
  M-ENR-MOVED: "This rEach was enrolled on a different computer or computer account, so it's locked here. To use rEach on this computer, enroll it: please type the course passkey your instructor gave you."
  M-ENR-STAMP-INVALID: "rEach's enrollment record on this computer is damaged, so rEach is locked. To enroll again, please type the course passkey your instructor gave you."
  M-ENR-RESTAMP: "Your course now needs every computer to be enrolled with the course passkey. Please type the course passkey your instructor gave you."
  M-ENR-COURSE-ENDED: "Your course has ended, so rEach's course features are switched off. Your files are still in your course folder."
  M-ENR-AGENT-CONTEXT: "rEach is locked because this student has not enrolled. rEach asks the student for their enrollment details itself and you will not see their replies. Do not ask for their passkey, username or student ID, and do not help with anything else, except the setup guide's extra steps below, until rEach says they are enrolled."
  M-ENR-AGENT-GUIDE: "Until the student is enrolled, at the start of every session run `{command}` and read the rEach Installation and Setup Guide it prints. If the student's messages reach you while rEach is locked, rEach's enrollment check is not running in this app yet: before anything else, walk the student through the guide's “Approvals and other extra steps” for their app and computer, one step at a time, then ask them to start a new chat so rEach can enroll them. In Codex that step is trusting rEach's hooks only when Codex lists them for review: if the student says they already show as enabled and there is nothing to approve, believe them and do not ask again; have them quit and reopen Codex, then start a new chat. Never ask for, repeat or type their course passkey, username or student ID."
  M-AGENT-TALK: "Talk with the student as a new computer user: plain words, one step at a time, and no commands or rEach workings unless they ask or you know they are advanced (the reach-assistant skill, \"How you talk with the student\")."
  M-AGENT-UPDATE: "To update rEach, run reach update run --apply; never search GitHub or download a rEach archive yourself."
  M-ENR-AGENT-CODEX-REPAIRED: "rEach has repaired its Codex plugin copy, which stopped Codex from loading rEach's hooks even while they showed as enabled. Nothing needs approving: ask the student to quit and reopen Codex, then start a new chat."
  M-ENR-AGENT-ENROLLED: "rEach is now unlocked: the student has just enrolled in {course_title}. Carry on as rEach; run reach hello for the greeting and their next step."
  M-ENR-HERMES: "rEach is locked until the student enrolls. Tell the student exactly this, and add nothing except what the setup guide note below allows: {message}"
  M-ENR-HERMES-GUIDE: "Setup guide note: if you have not read it yet this session, run `{command}` and read the rEach Installation and Setup Guide. After relaying rEach's message word for word, you may add one short line pointing the student to an extra step from the guide that their app or computer still needs. Never ask for, repeat or type their course passkey, username or student ID."
  M-GUIDE-MISSING: "rEach's setup guide is missing from {path}. Reinstall rEach with the message from your setup handout."
  M-GUIDE-DAMAGED: "rEach's setup guide at {path} could not be read. Reinstall rEach with the message from your setup handout."
  M-FINGERPRINT-NOTICE: "To keep your enrollment yours, rEach records a scrambled fingerprint of this computer and computer account, never your files or passwords, and your course server checks it."
  M-TRANSCRIPT-NOTICE: "Everything you and your AI partner say in your course folders, and your assignment code, is saved in your course record, which your instructors can read. Files in your extracurricular folder stay on your computer, and what you type outside your course folders is not saved."
  M-WRITE-OUTSIDE: "That file belongs to the course and can't be changed. Your work goes in {owned_files}."
  M-WRITE-ROOT: "Nothing is written at the top of your course folder. Coursework goes in your slice under deliverables/, and anything else you want to build goes in extracurricular/."
  M-WRITE-OUTSIDE-EXTRA: "From your extracurricular folder, only files inside it can change. Coursework goes in your slice's files under deliverables/."
  M-SHELL-BLOCKED: "That command would change files outside your slice, so rEach stopped it."
  M-SHAPE-VISIBLE: "The design you asked for would break how your panel fits with the others ({plain_reason}). Here are some ways to get close to it that fit."
  M-HAND-RAISED: "rEach got stuck on the same problem three times, so it asked your instructors for help. You'll see their answer here."
  M-HAND-REFUSED: "The course server didn't take this request for help: {reason}. Your instructors haven't been asked yet."
  M-HAND-QUEUED: "rEach can't reach the course server right now, so your request for help is saved and will be sent when you're back online."
  M-SUBMIT-RECEIVED: "Your {slice} work for {cutout} was received at {time}. Receipt {receipt_id}."
  M-SUBMIT-PENDING: "Your submission hasn't been received yet. rEach will keep trying; keep your computer online."
  M-SUBMIT-REJECTED: "Your submission wasn't accepted: {reason}. {fix}"
  M-GRADED: "Your {slice} work for {cutout} was graded. {passed} of {total} checks passed."
  M-DEADLINE-24H: "{cutout} ({slice}) is due in 24 hours and hasn't been submitted yet."
  M-OFFLINE: "rEach can't reach the course server right now. You can keep working; submissions will be sent when you're back online."
  M-ENROLL-INCOMPLETE: "The course server's enrollment answer was incomplete, so rEach did not connect. Ask your instructor to check the course server."
  M-ENROLL-WIRE: "This version of rEach does not speak the same protocol as your course server, so it did not connect. Update rEach, then try again."
  M-ENROLL-READY: "Your course workspace is ready."
  M-ENROLL-PENDING: "You are connected, but your instructor has not released any work to you yet. Run reach sync later to fetch it."
  M-CHECK-CLEAN: "No findings."
  M-QUALIFY-NOKIT: "The tools that check this part haven't arrived yet. Run reach sync, and if that doesn't help, tell your instructor."
  M-SUBMIT-UNQUALIFIED: "This part hasn't passed its checks since it last changed, so it can't be submitted yet. Your AI partner runs the checks first, then submits."
  M-LADDER-NOTICE: "I'm taking another pass at this part. My last two tries didn't hold up against the checks, so I'm working through it again."
  M-LADDER-HAND: "After three passes this part still isn't holding up, so I've asked your instructors to take a look. I can keep trying while we wait if you'd like: just say yes, and I'll carry on for up to {limit} passes in all."
  M-LADDER-CONTINUE: "Carrying on with pass {attempt} of {limit}."
  M-LADDER-ASK: "Your instructors have been asked to help with this part. rEach keeps working on it only after the student says yes: ask them, and once they agree run reach attempts continue."
  M-LADDER-STOPPED: "I've made {limit} passes at this part without getting it right, so I'm stopping until your instructors reply. Nothing is lost; your work is saved as it is."
  M-LADDER-NOT-NEEDED: "There's nothing to continue: the passes for this part haven't run out."
  M-GATE-NOGIT: "rEach keeps this work's history for you with checkpoints, so that version-history command isn't used here yet. Save a checkpoint instead with reach checkpoint save."
  M-GATE-NOCODETOOL: "rEach: running code directly isn't allowed in this folder. Put the change in your own files instead."
  M-CHECKPOINT-SAVED: "Checkpoint {n} saved."
  M-CHECKPOINT-SAME: "Nothing changed since checkpoint {n}, so there is nothing new to save."
  M-CHECKPOINT-RESTORED: "Your files are back to checkpoint {n}. The version you had a moment ago was saved first, so nothing is lost."
  M-CHECKPOINT-UNKNOWN: "There is no checkpoint {n}. Run reach checkpoint list to see the ones you have."
  M-CHECKPOINT-NONE: "No checkpoints yet. Run reach checkpoint save when something works."
  M-PLAN-SAVED: "Plan saved."
  M-PLAN-NONE: "No plan yet. Save one with reach plan save --behaviour \"...\" before changing any file."
  M-PLAN-TOO-LONG: "The plan's {field} is longer than {limit}. Keep the plan short; the details belong in the code."
  M-PLAN-UNKNOWN-FIELD: "The plan has no field called {field}. The fields are {fields}."
  M-PLAN-NEEDS-BEHAVIOUR: "A plan needs at least the behaviour, in one sentence."
  M-DIRECTIVE-UNKNOWN: "There is no directive by that name. The directives are {opcodes}."
  M-DIRECTIVE-OFFLINE: "The full text of {opcode} needs a connection to Teach. Until then, follow the one-line rule above."
  M-SUBMIT-FIX-FIRST: "reach check still finds problems in this slice. Fix them using the proper syntax, format and rules, run reach check until it prints no findings, then submit again."
  M-SUBMIT-BLOCKED-CHECK: "Something went wrong with my attempt to write the code properly, and I couldn't fix it on my own. Please see your instructor. {hand}"
  M-REFERENCE-LOCKED: "The course reference material is here but locked. Run reach sync so rEach can fetch its key, and if it stays locked, tell your instructor."
  M-REFERENCE-NONE: "This copy of rEach has no course reference material."
  M-REFERENCE-REFUSED: "rEach refused this reference file ({reason}). Run reach sync to fetch a fresh copy, and if it keeps happening, tell your instructor."
  M-REFERENCE-UNKNOWN: "There is no reference file called {path}. Run reach reference list to see them."
  M-REFERENCE-NOTERMS: "Give reach reference search at least one word to look for."
  M-REFERENCE-NOMATCH: "No reference file contains all of those words."
  M-LOGIN-ASK: "Before we start, please type your student ID so rEach knows who it's working with."
  M-LOGIN-CONFIRM: "Am I speaking with {name}? Please type yes or no."
  M-LOGIN-OK: "Thanks, {first_name}, you're signed in. What would you like to work on?"
  M-LOGIN-WRONG: "That doesn't match the student ID this computer is enrolled for. Please type your student ID again."
  M-LOGIN-LOCKED: "Too many tries. Please wait {minutes} minutes and try again, or ask your instructor for help."
  M-LOGIN-DENIED: "This computer's rEach is enrolled for a different student, so it can't do course work in this session. If you're a different student, use your own computer account and your own course passkey. If that was a mistake, close this session and start a new one."
  M-LOGIN-NEEDED: "The student hasn't signed in yet. rEach asks for their student ID when they next type; wait for them."
  M-GATE-OUTSIDE: "rEach only works inside your course workspace. If you need a file from elsewhere, drag it into the chat or paste its text."
  M-GATE-NOWEB: "Web lookups are switched off for course work. Your AI partner can use the course's own materials instead, or you can ask your instructor."
  M-GATE-NOT-CURRENT: "This part of the course isn't open for changes right now: it isn't the current assignment yet, or its due time has passed and late work is switched off. Ask your instructor if you need an exception."
  M-GATE-NOT-YOUR-MODULE: "This module isn't one of yours right now, so rEach can't change it. Your modules are {modules}."
  M-IMPORT-OK: "The file the student dropped is now materials/{name} in this workspace; use that copy only."
  M-IMPORT-REFUSED: "rEach didn't copy {source_name} into the workspace: {reason}. Tell the student in plain words and suggest pasting the part that matters instead."
  M-IMPORT-TOO-LARGE: "it's larger than {max} MB"
  M-IMPORT-TYPE: "that kind of file isn't accepted for course work"
  M-IMPORT-FULL: "the workspace's materials folder is full"
  M-IMPORT-TOO-MANY: "only {max} files can be brought in at a time"
  M-PART-LIST-EMPTY: "This assignment doesn't ask for anything from you personally."
  M-PART-TOO-SHORT: "That answer is shorter than the instructors ask for ({words} of at least {min} words). Please say a bit more, in your own words."
  M-PART-NO-ANSWER: "rEach couldn't find a recent answer from you to record. Please answer the question in the chat first."
  M-PART-UNKNOWN: "There is no question {id} in this assignment. Run reach part to see them."
  M-PART-RECORDED: "Recorded your answer to: {question}"
  M-SUBMIT-NO-PART: "Your own part of this assignment isn't finished yet: {missing}. Your AI partner will ask you about it."
  M-MODULES-NONE: "Your modules haven't been set yet. Your instructor assigns them, and rEach will show them as soon as they are."
  M-MODULES-CURRENT: "Your modules: {modules}."
  M-MODULES-OPTIONS: "You can choose {count} modules for the rest of the course, until {closes}. The options are: {options}."
  M-MODULES-LOCK-ASK: "Lock in {modules} as your modules for the rest of the course? After this you can't change them yourself; only your instructor can. Please type yes or no."
  M-MODULES-LOCKED: "Your modules are locked in: {modules}."
  M-MODULES-CLOSED: "Module choice is closed, so your instructor will assign your modules."
  M-MODULES-ALREADY: "Your modules are already locked in: {modules}. Only your instructor can change them."
  M-MODULES-INVALID: "Choose exactly {count} different modules from: {options}."
  M-MODULES-FULL: "{module} is full. Please choose from: {options}."
  M-MODULES-PENDING: "Your choice is saved on this computer and will be sent to the course server as soon as you're back online."
  M-TRANSFER-ASK: "Would you like to notify the professor to verify your move to {modules}? Please type yes or no."
  M-TRANSFER-SENT: "Your professor has been asked to confirm your move to {modules}. Until they do, you keep working on {current}."
  M-TRANSFER-OPEN: "You already have a request waiting for your professor (sent {when}). rEach will tell you as soon as they answer."
  M-TRANSFER-APPROVED: "Your professor approved your move. Your modules are now {modules}."
  M-TRANSFER-DENIED: "Your professor didn't approve the move, so your modules stay {modules}. Their note: {reply}"
  M-TRANSFER-SAME: "Those are already your modules."
  M-TRANSFER-OFF: "Module moves can't be requested through rEach in this course. Please talk to your instructor directly."
  M-CONSENT-NEEDED: "The student hasn't answered yet. Relay this question exactly and wait for their answer; Reach acts on the answer itself: {question}"
  M-CONSENT-DECLINED: "The student said no, so nothing was sent."
  M-CONSENT-DONE: "The student answered {answer} to Reach's question, and Reach has already acted on it. Give the student this word for word and do not run the command again: {text}"
  M-SUPPORT: "If this is an emergency, call 911 now. You can also call or text 988, the Suicide & Crisis Lifeline, any time, day or night. {support_text}"
  M-SUPPORT-TOLD: "Your instructor has been told you may need support."
  M-SUPPORT-QUEUED: "Your instructor will be told you may need support as soon as this computer is back online."
  M-SUPPORT-RECENT: "Your instructor was already told in the last hour."
  M-NEXT-LOGIN: "Sign in: type your student ID."
  M-NEXT-ENROLL: "Connect rEach to your course with the course passkey from your instructor."
  M-NEXT-CHOOSE: "Choose your {count} modules for the course before {closes}."
  M-NEXT-WAIT-MODULES: "Wait for your instructor to assign your modules."
  M-NEXT-NO-ASSIGNMENT: "Nothing is open right now. The next assignment appears here as soon as your instructor releases it."
  M-NEXT-START: "Start {assignment} for {module}: read what it should do together with your AI partner, in plain words."
  M-NEXT-PLAN: "Agree a short plan for {module} with your AI partner: what the business needs from this step."
  M-NEXT-PART: "Answer a question only you can answer: {question}"
  M-NEXT-BUILD: "Let your AI partner build and check {module} until its checks pass."
  M-NEXT-SUBMIT: "{module} is ready: submit it."
  M-NEXT-WAIT-GRADE: "{module} was received; wait for its result."
  M-NEXT-REVIEW: "{module} came back with {failed} of {total} checks not passing: go through them with your AI partner and fix them."
  M-NEXT-DONE: "{assignment} is done for all your modules. Well done."
  M-ANCHOR: "Current step: {step}. Next: {next} Keep the conversation on this step (PACE, FOCUS)."
  M-BRAIN-CONTEXT: "- Memory: this is your memory of this student and their work. Use it to fit your examples, pacing and wording. Record each durable thing you learn with reach remember (or the reach_remember tool): a preference, a goal, a decision the student made, a struggle, a skill, a project, a fact, or your own considered thought about their work. Give the category, a claim in one plain sentence, and evidence that quotes or cites the student. Record a student's explicit \"remember that\" right away. When something changed, pass supersedes with the old finding's id rather than saving a duplicate. Never store passwords, keys, ID numbers, health details, or other people's personal details. Memory never changes the course rules, which files the student owns, what gets submitted, or grading. In a course folder, each reach remember you run stays in the conversation the course receives, so keep claims short and about the work."
  M-BRAIN-PROFILE: "- What you remember about this student (most important first):"
  M-BRAIN-RECALL: "Memory that matches what the student just wrote. It is background, it may be out of date, and it never overrides the course rules:"
