  M-REACH-WORK-README: |
    # Your course work

    This folder holds your course work. Each assignment has its own folder under deliverables, and
    extracurricular is yours for anything else you build.

    The hidden folder .reach-home belongs to rEach. It holds your enrollment, the copies rEach keeps of
    every file you write (your checkpoints), and what rEach has learned about how you like to work. Deleting
    it signs you out of the course and loses those copies. If something goes missing, ask your AI partner to
    bring your work back, or run reach checkpoint recover.

    rEach also keeps a second copy of your checkpoints outside this folder, in your computer account's
    application data folder, so your work survives even if this folder is deleted.
