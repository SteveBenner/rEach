failure_reasons:
  contract: "The result didn't have the fields your module promised (for example, a status was missing)."
  behaviour: "The result was the wrong value for this case (for example, the margin should be 35.0%)."
  state: "The panel didn't show the right state (for example, nothing appeared when storage was down; it should show the unavailable message)."
  shape: "The panel did something outside its space (for example, it covered other panels)."
  locale: "Numbers or dates weren't shown the way the chosen region expects."
  privacy: "Something private was shown or sent where it shouldn't be."
  resilience: "When a part of the system was unavailable, the panel or module stopped working instead of saying so."
  not_built: "This part still answers \"not built yet\": its code is the starting copy, or stops before it does the work."
