  M-QUALIFY-UNCOVERED: "Assistant action: {count} required case(s) still need assistant-authored qualification scenarios. Follow the current attempt ladder and its stop conditions. Write one scenario under {dir} for each name in steps.coverage.rows, with exactly that name and the {tag} tag, using the agreed plan and course contract. Ask the student only for a missing business expectation; keep their explanations and contributions in their own words. Run reach qualify again after the repair. Continue this work instead of ending with a readiness summary. Coverage stopped this run before behavior checks, so it provides no behavior result."
