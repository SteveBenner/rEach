  M-SANDBOX-AGENT: "Codex ran this rEach command inside its sandbox, which blocks the internet and rEach's folder on this computer, so it could not finish. The course server is fine. Use rEach's reach_ tools instead (for example reach_update, reach_debug, reach_doctor and reach_sync), because Codex runs them outside its sandbox. To fix it for good, call reach_setup with action configure and relay rEach's question to the student word for word. If no tool does what you need, tell the student: {student}"
