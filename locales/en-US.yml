  M-IMPORT-ASK-BRAIN: "Bring this {vendor} export ({size_mb} MB, about {conversations} conversations) into what rEach learns about you? rEach keeps a short index of each conversation and learns from them over time; it can take a long time. Without a full copy, deleting the export later loses its full text. Say yes to import, or no to skip.{note}"
