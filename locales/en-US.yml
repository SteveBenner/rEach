schema: reach.locale/v1
locale: en-US
messages:
  M-GATE-NOENROLL: "rEach is locked until you enroll in your course. Type anything in a chat with your AI partner and rEach will walk you through it, or run reach enroll in a terminal."
  M-ENROLL-NO-HOOK: "rEach can't enroll you in this chat yet, because Codex isn't running rEach's hooks on this computer. Please don't type your course passkey, email, student ID or password in this chat. Quit Codex completely and open it again. If Codex shows a notice about hooks to review or trust, open it and allow rEach's hooks, then start a new chat and say hi. Or open a terminal window, run reach enroll, and type your answers there. If neither works, tell your instructor."
  M-ENROLL-ALREADY: "rEach is already connected to your course, so there is nothing to enroll. {next}"
  M-ENROLL-POSITIONAL: "rEach asks for the course passkey itself, so it doesn't take one here. Run reach enroll on its own and type your answers when it asks, or say hi in a chat with your AI partner and type the passkey when rEach asks for it."
  M-GATE-NOGUARD: "Your course rules haven't arrived yet, so rEach can't start on course work. Run reach sync, and if that doesn't work, tell your instructor."
  M-GATE-OLDGUARD: "Your course rules have an update. Run reach sync to get it, then try again."
  M-GATE-REVOKED: "This computer's rEach was switched off by your instructor. Ask them for a new course passkey."
  M-GATE-STALE: "rEach hasn't been able to check in with your course for over a day. Connect to the internet and run reach sync."
  M-UPDATE-INSTALLING: "rEach is installing an update (version {version}) that you need to keep using it. Give it a minute, then try again; your work is safe."
  M-UPDATE-READY: "A rEach update (version {version}) is ready. It installs the next time you start a session, so nothing changes in the middle of your work."
  M-UPDATE-DONE: "rEach is up to date (version {version}). Start a new session when it suits you to load everything."
  M-SUBSCRIBE-UPDATES: "rEach picked up new course updates since your last message: {updates}. Tell the student in plain words if it helps their work."
  M-ANNOUNCE-NOTICE: "{title}\n{body}"
  M-ANNOUNCE-LINE: "{sent}: {title}\n{body}"
  M-ANNOUNCE-LINE-EXPIRED: "{sent}: {title} (shown until {until})\n{body}"
  M-ANNOUNCE-NONE: "No announcements from your instructors."
  M-CONTROL-PAUSED: "Course work is paused by your instructors until {ends}. Your own extracurricular folder still works, and reach support is always here.\n{support}"
  M-CONTROL-HOLD: "Submitting is on hold until {ends}. You can keep working and running checks; submit after that time."
  M-CONTROL-TEST-LOCKED: "A test is open until {ends}, so everything except the test is locked right now. Only the test, reach support and reach status work until it ends."
  M-TEST-NONE: "There is no test open for you right now."
  M-TEST-OPENED: "Your test \"{title}\" is open. You have {minutes} minutes, and the test closes at {deadline} either way. Answer each question in your own words, one at a time."
  M-TEST-CLOCK: "Time left on your test: {minutes} minutes. It ends at {deadline}."
  M-TEST-NEEDS-ANSWER: "Type your answer to question {number} yourself first, then ask for it to be recorded. rEach records only what you type."
  M-TEST-RECORDED: "Recorded your answer to question {number}."
  M-TEST-SUBMITTED: "Your test is submitted: {answered} of {total} questions answered. Your instructors will read your answers."
  M-TEST-ENDED: "Your test has ended. Your instructors will read what you recorded."
  M-TEST-USAGE: "usage: reach test [status | open | questions | record QUESTION | submit]"
  M-DUE-CHANGED: "The due time for {assignment} changed. It was {before}. It is now {after}. Tell the student now, in plain words."
  M-UPDATE-HOOKS-NOTICE: "rEach's next update (version {version}) changes the hooks Codex runs, so after it installs Codex will ask you to approve rEach's hooks again. That is expected: approve them, then start a new chat."
  M-UPDATE-RETRY: "rEach couldn't finish installing an update (version {version}) just now. You can keep working; it will try again on its own."
  M-UPDATE-APP-ONLY: "rEach can't update itself from here. Tell the student, in plain words, to open the Plugins page in their app, find rEach there and update it, then start a new chat. Don't try anything else to update it."
  M-REACH-OUTDATED: "This version of rEach ({version}) is too old for your course, which needs {minimum} or newer. Update rEach, then try again."
  M-AUTH-FAILED: "Your course server didn't accept rEach's signature. Check that your computer's clock is right, then run reach sync. If it keeps happening, tell your instructor."
  M-ENROLL-DONE: "You're connected to {course}. rEach is fetching your course materials now."
  M-ENR-WELCOME: "Welcome to rEach. Before anything else, connect rEach to your course. Please type the course passkey your instructor gave you. It is the course code followed by eight letters and numbers, like ABCD123-XXXX-XXXX."
  M-ENR-ASK-CODE: "Please type the course passkey your instructor gave you. It is the course code followed by eight letters and numbers, like ABCD123-XXXX-XXXX."
  M-ENR-CODE-FORMAT: "That doesn't look like a course passkey. It is the course code followed by eight letters and numbers, like ABCD123-XXXX-XXXX. Please type it again."
  M-ENR-CODE-COURSE-ONLY: "That's the course, {course_id}. The course passkey is longer: the course followed by eight letters and numbers, like {course_id}-K7QX-94TD. Please type the whole passkey."
  M-ENR-CODE-UNKNOWN: "That course passkey wasn't recognized. Check it against the one your instructor shared and type it again."
  M-ENR-CODE-SUGGEST: "That course passkey wasn't recognized. Did you mean a passkey for {course_id}? Check the passkey your instructor shared and type it again."
  M-ENR-CODE-EXPIRED: "That course passkey belongs to a course that has ended, so it can't be used anymore. Ask your instructor for the current passkey."
  M-ENR-CODE-OLD: "That course passkey has expired. Ask your instructor for the current passkey."
  M-ENR-MOVE-PENDING: "You're already enrolled on another computer, so your instructor needs to approve this one. They've been asked. Once they say it's approved, type yes here."
  M-ENR-MOVE-DENIED: "Your instructor didn't approve enrolling this computer: {reason} If you think that's a mistake, talk to them, then type your course passkey to try again."
  M-ENR-ASK-USERNAME: "That's the passkey for {course_title} ({course_id}, {term}). Now please type your {institution} email.{hint}"
  M-ENR-SCHOOL: "school"
  M-ENR-EMAIL-DOMAIN: "It ends in @{domain}."
  M-ENR-USERNAME-FORMAT: "That doesn't look like your {institution} email.{hint} Please type it again."
  M-ENR-ASK-ID: "Thanks. Now please type your {institution} student ID.{hint}"
  M-ENR-ID-FORMAT: "That doesn't look like your {institution} student ID.{hint} Please type it again."
  M-ENR-CONFIRM: "Please check: enroll {username}, student ID {student_id}, in {course_title} ({course_id}, {term})? Type yes to enroll, or no to start over."
  M-ENR-ASK-PASSWORD: "Last step: choose a password for rEach, at least 8 characters, and type it here. Write it down somewhere safe now; you will type it every time you sign in, and nobody can look it up for you. If you forget it, your instructor can let you choose a new one. Only you and the course server get it, and the AI never sees what you type."
  M-ENR-ASK-PASSWORD-REENROLL: "Last step: choose a password for rEach, at least 8 characters, and type it here. If you enrolled before, type the password you already chose; a password chosen before October 5, 2026 was reset, so choose a new one. Write it down somewhere safe now; you will type it every time you sign in, and nobody can look it up for you. If you forget it, your instructor can let you choose a new one. Only you and the course server get it, and the AI never sees what you type."
  M-ENR-PASSWORD-WRONG: "That isn't the password you chose when you enrolled before. Please type your password again. If you forgot it, ask your instructor to allow a password reset for you; once they have, the password you type here becomes your new one."
  M-ENR-PASSWORD-WRONG-TERMINAL: "That isn't the password you chose when you enrolled before. Run reach enroll again and type your password. If you forgot it, ask your instructor to allow a password reset for you; once they have, the password you type becomes your new one."
  M-ENR-ASK-PASSWORD-AGAIN: "Please type the same password again, to make sure it is right."
  M-ENR-PASSWORD-SHORT: "That password is too short. Please choose one with at least 8 characters (and no more than 256)."
  M-ENR-PASSWORD-MISMATCH: "The two passwords didn't match. Please choose your password again."
  M-ENR-PASSWORD-TERMINAL: "To choose your password privately, finish enrolling in a terminal: run {command} and answer its questions there. Your typing stays hidden and the AI never sees it."
  M-ENR-PASSWORD-RETRY-FAILED: "rEach couldn't finish enrolling you: {reason} To try again, type your password again, or type start over to begin again."
  M-ENR-PASSWORD-RETRY-OFFLINE: "rEach couldn't reach your course server just now. Check your internet connection, then type your password again to try again."
  M-ENR-PASSWORD-REMINDER: "Keep the password you chose written down somewhere safe."
  M-ENR-RESTART: "No problem, let's start over. Please type the course passkey your instructor gave you."
  M-ENR-REFUSED: "Your course server couldn't match that username and student ID to the class list for {course_id}. Please type your username again, carefully. If it still doesn't work, ask your instructor to check the class list."
  M-INSTRUCTOR-UNLOCKED: "Instructor unlock accepted. rEach no longer blocks your prompts on this computer. To undo it, run reach instructor lock in a terminal."
  M-INSTRUCTOR-SIGNED-IN: "Instructor code accepted for this chat only. This chat is signed in as {name}, and rEach's sign-in lockouts on this computer are cleared. Nothing stays unlocked on this computer, and a new chat asks for sign-in as usual."
  M-INSTRUCTOR-TERMINAL-OK: "Instructor code accepted. rEach's sign-in lockouts on this computer are cleared, and the chat that was waiting for sign-in, if there was one, is signed in. Nothing stays unlocked on this computer, and a new chat asks for sign-in as usual. Go back to your AI app and continue."
  M-INSTRUCTOR-UNLOCK-NO-ARG: "Do not type the instructor code on the command line, where it stays in your shell history and the process list. Run reach instructor unlock with no argument and paste the code when asked. Your typing stays hidden."
  M-INSTRUCTOR-REFUSED: "That is not a valid instructor code. Check that it was copied whole, that it has not been revoked, and that it came from the current instructor key."
  M-INSTRUCTOR-CONTEXT: "rEach is in instructor mode on this computer. It is not enrolled in a course, so course commands will say so. To find a rEach problem on this computer together with the instructors' side, start a diagnosis session: call the reach_live tool with action diagnose, or run reach instructor diagnose."
  M-INSTRUCTOR-STATUS: "Instructor unlock is on. Code {code_id}, label {label}, key {key_id}, unlocked {unlocked_at}."
  M-INSTRUCTOR-STATUS-OFF: "Instructor unlock is off."
  M-INSTRUCTOR-LOCKED: "Instructor unlock is off. rEach is locked until you enroll or paste an instructor code."
  M-INSTRUCTOR-KEY-UNPINNED: "Key {key_id} is not in the instructor keyring this computer holds, so its codes would not be accepted."
  M-INSTRUCTOR-KEYRING-UNAVAILABLE: "rEach could not reach the course server to check that instructor code. Try again when you are online."
  M-INSTRUCTOR-MINT-IN-TEACH: "Instructor codes are made in Teach now. Open the Instructor codes page of the Teach console to mint, revoke and rotate codes."
  M-INSTRUCTOR-KEYRING-STATUS: "Instructor keyring {revision}, fetched {age} seconds ago, keys {keys}."
  M-INSTRUCTOR-KEYRING-STATUS-NONE: "No instructor keyring has been fetched on this computer yet."
  M-INSTRUCTOR-USAGE: "usage: reach instructor status [--format text|json] | unlock | lock | dummy [--course ID] | as USERNAME [--course ID] | diagnose [--course ID] | exit"
  M-PERSONA-STARTED: "You are now {display_name} in {course_id}. rEach on this computer works exactly as a student's does, in {workspace}. When rEach asks for a student ID to sign in, type {student_id}. Run reach instructor exit to go back to instructor mode."
  M-PERSONA-EXITED: "{display_name} is retired and moved to a .backup folder. rEach on this computer is back in instructor mode."
  M-PERSONA-ACTIVE: "This computer is already running {display_name} (persona {id}). Run reach instructor exit first."
  M-PERSONA-NONE: "No test student is active on this computer."
  M-PERSONA-NEEDS-UNLOCK: "Test students need the instructor unlock. Paste your instructor code into a prompt, or run reach instructor status to see where this computer stands."
  M-PERSONA-CODE-REFUSED: "The course server did not accept your instructor code ({reason}). Check that this release of rEach and the course server both know its key, and that the code has not been revoked."
  M-PERSONA-COURSE-NEEDED: "The course server needs to know which course to use. Run the command again with --course followed by one of: {courses}."
  M-PERSONA-NO-STUDENT: "No active student in that course has the username {username}. Check the spelling against the course roster."
  M-PERSONA-TEACH-OLD: "The course server is too old to run test students. Update the course server first, then try again."
  M-PERSONA-LOCKED: "This computer's test student was switched off because the instructor code behind it is no longer valid. Paste a valid instructor code, or run reach instructor exit."
  M-PERSONA-STATUS: "Persona: {display_name} (persona {id}, {kind}, username {username}, student ID {student_id}) in {course_id}, started {started_at}. Workspace: {workspace}."
  M-PERSONA-ENROLLED: "This computer is enrolled as a student, so it cannot also run a test student. Use a computer that is not enrolled."
  M-PERSONA-NO-SERVER: "This copy of rEach has no course server configured. Run reach update, then try again."
  M-DEBUG-TITLE: "rEach debug ({reason}): {count} events"
  M-DEBUG-COL-TIME: "time"
  M-DEBUG-COL-KIND: "kind"
  M-DEBUG-COL-WHAT: "what"
  M-DEBUG-COL-RESULT: "result"
  M-DEBUG-COL-MS: "ms"
  M-DEBUG-MORE: "+{count} more"
  M-DEBUG-NONE: "No debug events yet."
  M-DEBUG-NOTICE: "Your instructor switched rEach into debug mode on this computer. It records what rEach did (hooks, checks, requests, timings), never your prompts, replies, files or passwords, and sends it to the course server. Run reach debug status to see it, or ask your instructor to switch it off."
  M-DEBUG-ON: "Debug mode is on until you run reach debug off."
  M-DEBUG-ON-UNTIL: "Debug mode is on until {until}. Run reach debug off to stop sooner."
  M-DEBUG-SAID-ON: "Debug mode is on. rEach now records what it does, with details about this computer's operating system, and shows a debug summary at the end of each turn. Say \"turn debug off\" to stop."
  M-DEBUG-SAID-OFF: "Debug mode is off on this computer."
  M-DEBUG-RELAY: "The person asked to switch rEach's debug mode, and rEach has already done it. Give them this word for word and run no command for it: {text}"
  M-DEBUG-OFF: "Debug mode is off on this computer."
  M-DEBUG-REMOTE-STILL: "Your instructor has also asked for debug mode, so it stays on until they switch it off."
  M-DEBUG-PERSONA: "Debug mode is always on while a test student is active. Run reach instructor exit to end the test student."
  M-DEBUG-STATUS-ON: "Debug mode is on ({reason}), until {until}. Events: {queued} waiting to send, {sent} sent, {dropped} dropped."
  M-DEBUG-STATUS-OFF: "Debug mode is off. Events: {queued} waiting to send, {sent} sent."
  M-DEBUG-FLUSHED: "Debug events sent: {sent}. Stopped: {stopped}."
  M-DEBUG-USAGE: "usage: reach debug on [--for MINUTES] | off | status [--format text|json] | show [--last N] [--format ascii|markdown|json] | flush | export [--format text|json]"
  M-SETUP-REPORT-SAVED: "rEach has run into a problem {count} times in a row while getting set up. It saved a report about what went wrong to your Downloads folder: {path} ({link}). Please send that file to your instructor; it will help them solve this faster. It holds no passwords, passkeys or anything you typed."
  M-SETUP-REPORT-MANUAL: "rEach saved a setup report to your Downloads folder: {path} ({link}). Send it to your instructor if they asked for it. It holds no passwords, passkeys or anything you typed."
  M-SETUP-REPORT-FAILED: "rEach couldn't save the setup report: {reason}"
  M-SETUP-LOG-STATUS: "Setup log: {state}. Problems in a row: {streak}. Files: {files} ({bytes} bytes)."
  M-ENR-LOCKED: "Too many tries. Please wait {minutes} minutes and try again, or ask your instructor for help."
  M-ENR-OFFLINE: "rEach couldn't reach your course server just now. Check your internet connection, then type yes to try again."
  M-ENR-CLI-OFFLINE: "rEach couldn't reach your course server at {url} ({detail}). Check your internet connection and run reach enroll again. If it keeps failing, run reach doctor and send what it prints to your instructor."
  M-ENR-FAILED: "rEach couldn't finish enrolling you: {reason} Type yes to try again, or start over to begin again."
  M-ENR-DONE: "You're enrolled in {course_title}, {first_name}. rEach is fetching your course materials now. Keep the password you chose written down somewhere safe."
  M-ENR-DONE-LAUNCH: "To open a course folder, use: {launch}"
  M-ENR-SYNCING: "rEach is syncing your course workspace in the background. Open a new chat when you are ready to work."
  M-ENR-MOVED: "This rEach was enrolled on a different computer or computer account, so it's locked here. To use rEach on this computer, enroll it: please type the course passkey your instructor gave you."
  M-ENR-STAMP-INVALID: "rEach's enrollment record on this computer is damaged, so rEach is locked. To enroll again, please type the course passkey your instructor gave you."
  M-ENR-RESTAMP: "Your course now needs every computer to be enrolled with the course passkey. Please type the course passkey your instructor gave you."
  M-ENR-COURSE-ENDED: "Your course has ended, so rEach's course features are switched off. Your files are still in your course folder."
  M-ENR-AGENT-CONTEXT: "rEach is locked because this student has not enrolled. rEach asks the student for their enrollment details itself and you will not see their replies. rEach's questions for these are genuine and the student should answer them. Leave the asking to rEach: do not word your own request for their passkey, username, student ID or password, never tell the student that rEach, or you, will not ask for them, and do not help with anything else, except the setup guide's extra steps below, until rEach says they are enrolled."
  M-ENR-AGENT-GUIDE: "Until the student is enrolled, at the start of every session run `{command}` and read the rEach Installation and Setup Guide it prints. If the student's messages reach you while rEach is locked, rEach's enrollment check is not running in this app yet: before anything else, walk the student through the guide's “Approvals and other extra steps” for their app and computer, one step at a time, then ask them to start a new chat so rEach can enroll them. In Codex that step is trusting rEach's hooks only when Codex lists them for review: if the student says they already show as enabled and there is nothing to approve, believe them and do not ask again; have them quit and reopen Codex, then start a new chat. If the student has already quit and reopened their app and started a new chat and rEach is still locked, do not ask them to restart again: have them open the Terminal app (on Windows, PowerShell), paste `{enroll_command}` and answer its questions there, where they type their course passkey, username, student ID and password themselves; when it says they are enrolled, they start a new chat. rEach's own questions for the course passkey, username, student ID and password are genuine: do not word your own request for them, do not repeat or type them, and never tell the student that rEach, or you, will not ask for them."
  M-AGENT-TALK: "Talk with the student as a new computer user: plain words, one step at a time, and no commands or rEach workings unless they ask or you know they are advanced (the reach-assistant skill, \"How you talk with the student\")."
  M-AGENT-UPDATE: "To update rEach, run reach update run --apply or call the reach_update tool with action run; never search GitHub or download a rEach archive yourself."
  M-ENR-NOHOOK-STUDENT: "Welcome to rEach. Before anything else, rEach needs to connect to your course. In this app that takes one short step outside the chat, and your AI partner will walk you through it now."
  M-ENR-AGENT-NOHOOK-CONTEXT: "rEach is locked because this student has not enrolled. This app gives rEach no way to ask the student for their enrollment details in the chat, so the student enrolls in a terminal window, where they type the details themselves. Do not ask for their passkey, username or student ID, do not let them type those into this chat, and do not help with anything else until rEach says they are enrolled."
  M-ENR-AGENT-NOHOOK-GUIDE: "Nothing is broken and nothing needs approving or restarting, so do not ask the student to restart their app and do not send them to their instructor for this. Run `{window_command}` now: it opens a terminal window for the student with the enrollment command already in it. Then tell the student, in plain words: \"I opened a terminal window for you. Paste the command I put there, then answer its questions: your course passkey, your school email, your student ID, and a password typed twice. Tell me when it says you are connected.\" If the window does not open, walk them through it instead, one step at a time: on Windows, click Start, type PowerShell and open Windows PowerShell; on a Mac, press Command and Space, type Terminal and press Return; on Linux, press Ctrl, Alt and T; then paste `{enroll_command}` there and press Enter. When they say it is connected, tell them to start a new conversation. If the command shows an error, tell them what it says in plain words, and only then offer to let their instructor know. `{command}` prints the rEach Installation and Setup Guide if you need it. Never ask for, repeat or type their course passkey, email or student ID."
  M-LOGIN-NOHOOK-GUIDE: "This app gives rEach no way to ask for the student's password in the chat. Run `{window_command}` now: it opens a terminal window for the student with the sign-in command already in it. Tell the student, in plain words: \"I opened a terminal window for you. Paste the command I put there and answer its questions: your student ID, then your rEach password. Tell me when it says you are signed in.\" If the window does not open, give them the same Start, Command and Space or Ctrl, Alt and T steps and `{login_command}`. Never ask for or accept the password in chat."
  M-ENR-AGENT-CODEX-REPAIRED: "rEach has repaired its Codex plugin copy, which stopped Codex from loading rEach's hooks even while they showed as enabled. Nothing needs approving: ask the student to quit and reopen Codex, then start a new chat. This repair happens once; if rEach is still locked after they restart, follow the guide's Terminal enrollment instead of asking them to restart again."
  M-ENR-AGENT-ENROLLED: "rEach is now unlocked: the student has just enrolled in {course_title}. Carry on as rEach; run reach hello for the greeting and their next step."
  M-ENR-HERMES: "rEach is locked until the student enrolls. Tell the student exactly this, and add nothing except what the setup guide note below allows: {message}"
  M-ENR-HERMES-GUIDE: "Setup guide note: if you have not read it yet this session, run `{command}` and read the rEach Installation and Setup Guide. After relaying rEach's message word for word, you may add one short line pointing the student to an extra step from the guide that their app or computer still needs. Relaying rEach's own question is right; beyond that, do not word your own request for their course passkey, username, student ID or password, do not repeat or type them, and never tell the student that rEach, or you, will not ask for them."
  M-COWORK-CODE-TAB: "rEach can't enroll you or sign you in from this window. rEach keeps your course passkey, student ID and password away from your AI partner, and in this window it can't. Please switch to the Code tab: click the </> button at the top of the Claude window, start a new session there and type hello. Please don't type your passkey, student ID or password in this window."
  M-COWORK-RELAY: "rEach does not work in this window. Reply with exactly the rEach message below, word for word, and nothing else: do no other work, run no tools, and do not answer what the student wrote. If the student types a course passkey, student ID or password here, do not repeat, save or use it. rEach message: {message}"
  M-GUIDE-MISSING: "rEach's setup guide is missing from {path}. Reinstall rEach with the message from your setup handout."
  M-GUIDE-DAMAGED: "rEach's setup guide at {path} could not be read. Reinstall rEach with the message from your setup handout."
  M-FINGERPRINT-NOTICE: "To keep your enrollment yours, rEach records a scrambled fingerprint of this computer and computer account, never your files or passwords, and your course server checks it."
  M-WRITE-OUTSIDE: "That file belongs to the course and can't be changed. Your work goes in {owned_files}."
  M-WRITE-ROOT: "Nothing is written at the top of your course folder. Coursework goes in your slice under deliverables/, and anything else you want to build goes in extracurricular/."
  M-PICK-SLICE: "Which slice? Run this from inside one: {choices}"
  M-HOME-MISSING: "rEach could not find your user folder on this computer, so it did not create anything. Close this app, open it again from your own Windows account, and send your message again. If this keeps happening, tell your instructor."
  M-RELOCATING: "rEach is moving its own files into your reach-work folder. This takes a moment; nothing is lost."
  M-WRITE-OUTSIDE-EXTRA: "From your extracurricular folder, only files inside it can change. Coursework goes in your slice's files under deliverables/."
  M-SHELL-BLOCKED: "That command would change files outside your slice, so rEach stopped it."
  M-SHAPE-VISIBLE: "The design you asked for would break how your panel fits with the others ({plain_reason}). Here are some ways to get close to it that fit."
  M-HAND-RAISED: "rEach got stuck on the same problem three times, so it asked your instructors for help. You'll see their answer here."
  M-HAND-REFUSED: "The course server didn't take this request for help: {reason}. Your instructors haven't been asked yet.{contact}"
  M-HAND-QUEUED: "rEach can't reach the course server right now, so your request for help is saved and will be sent when you're back online.{contact}"
  M-HAND-SENT: "Hand raised: {hand_id}. Your instructors have your rEach version, the last step that worked and what you saw. Passwords and passkeys were left out. Their answer will appear here in rEach."
  M-HAND-CONTACT: " To reach a person now, {contact_text}."
  M-SUBMIT-RECEIVED: "Your {slice} work for {cutout} was received at {time}."
  M-SUBMIT-PENDING: "Your submission hasn't been received yet. rEach will keep trying; keep your computer online."
  M-SUBMIT-REJECTED: "Your submission wasn't accepted: {reason}. {fix}"
  M-GRADED: "Your {slice} work for {cutout} was graded. {passed} of {total} checks passed."
  M-DEADLINE-24H: "{cutout} ({slice}) is due in 24 hours and hasn't been submitted yet."
  M-OFFLINE: "rEach can't reach the course server right now. You can keep working; submissions will be sent when you're back online."
  M-ENROLL-INCOMPLETE: "The course server's enrollment answer was incomplete, so rEach did not connect. Ask your instructor to check the course server."
  M-ENROLL-INSTALL-UNREADABLE: "rEach can't read its enrollment record ({file}), so it can't tell whether this computer is connected. Run reach enroll again to reconnect, or ask your instructor."
  M-ENROLL-READY: "Your course workspace is ready."
  M-ENROLL-PENDING: "You are connected, but your instructor has not released any work to you yet. Run reach sync later to fetch it."
  M-CHECK-CLEAN: "No findings."
  M-QUALIFY-UNCOVERED: "Your own scenarios do not cover {count} graded name(s) yet. Write one scenario under {dir} for each name in steps.coverage.rows, with exactly that name and the {tag} tag, then run reach qualify again. Writing them is your work: do not raise a hand for this, and do not stop to wait for the instructors."
  M-QUALIFY-README: "README.md isn't finished: {count} section(s) need more writing, at least {min} words each. Ask the student for anything missing and write it from their own answers; never invent a reflection or contributions for them. Then run reach qualify again. This is not a failed try at the code."
