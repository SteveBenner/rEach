  M-LIVE-ASK: "Would you like to ask your instructors for a live session? While it is open they can see what rEach records on this computer in debug mode: what rEach did, never your prompts, your assistant's replies, your code or your files. Your assistant and your instructor's assistant may also write to each other. rEach asks you before it runs any check they request and before your assistant sends them anything. You can end it at any time. Please type yes or no."
