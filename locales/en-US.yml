  M-QUALIFY-EXPORT: "The checks could not run, so the scenarios never got to test the student's work. Tell the student they can still hand it in: submit it as partial work with reach submit --partial (or the reach_submit tool with partial true), which goes to their instructor for review, or save a ZIP of all their work for {assignment} with reach submit archive --assignment {assignment} (or the reach_submit tool with archive true and assignment {assignment}) to send it themselves. Either way only on the student's yes."
  M-QUALIFY-UNREADABLE: "Assistant action: rEach could not safely read some of this part's files, so no check ran and this run does not count as a try: {list}. Do not rewrite the student's work for it. If a file named here is a link or shortcut, put a plain file in its place, then run reach qualify again. If the same files are named again, tell the student rEach has a technical problem reading their work, and raise a technical_issue hand that quotes this message."
  M-QUALIFY-HIDDEN: "Assistant action: the course's graded case(s) {names} failed on the course's own data, although your scenario of the same name passed with your fakes. Your fakes probably assume something the real port does not return, such as its keys, its scale or its shape. Before you change code, re-read the contract, the brief and the port adapters under qualify/kit/modules, and make your fakes match what they say. Each finding says whether, on the course's data, the call raised an error or a value differed. Running reach qualify again on unchanged files gives the same result; the course server does not count such a rerun as another try, but it does not help either. The course server never shows the graded steps; do not try to learn them. If the course materials do not say what the port returns, tell the student so plainly instead of guessing; rEach asks the instructors for help by itself at the third failed try."
  M-QUALIFY-IDENTICAL: "Assistant action: this run sent the same files and scenarios as {earlier}, which already failed, so the course server ran it again but did not count it as a try. Change the code or the scenarios for a reason you can explain before you run reach qualify again."
