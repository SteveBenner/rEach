---
schema: reach.spec/v1
name: reach
version: 0.35.0
status: draft
recorded: '2026-09-29'
licence: undecided
repository: github.com/SteveBenner/rEach (canonical since 0.7.2; the Bitbucket checkout was archived)
summary: >
  Reach is the student's side of the course software. It is an rplugin plugin that installs into Claude Code or
  Codex and turns the student's own AI agent into a bounded course partner. It enrolls with Teach, receives the student's
  protected materials, refuses to let the agent work until the instructors' guardrails are installed, keeps the
  agent inside the student's slice, checks every change against the Dovetail shape, has the agent prove each slice with
  scenarios of its own on this computer and on Teach before submitting (qualification), submits work and waits for
  Teach's receipt, and raises a hand to the instructors by itself after three failed qualifications (attempt_ladder).
decisions:
- date: '2026-09-26'
  round: 2
  decision: >-
    Guardrails and directives from the instructors are required before the agent works, injected by default, enforced
    in Reach's code; packages arrive encrypted and are unpacked opaquely.
- date: '2026-09-26'
  round: 3
  decision: >-
    Student-side floor Ruby 2.6.10 (macOS 10.15 to 26); Windows and Linux get a pinned Ruby from Reach's installer;
    the local suite is for tips only (superseded 2026-09-29 by qualification: no graded suite reaches the student).
- date: '2026-09-26'
  round: 3
  decision: >-
    Reach is built on the rplugin concept and ships as a compatible rplugin plugin with its own library of Ruby
    scripts and agent skills.
- date: '2026-09-26'
  round: 4
  decision: >-
    Reach depends on rplugin-compat (rplugin rewritten for Ruby 2.6); harnesses are Claude Code and Codex, using
    the rSlides harness-over-harness pattern; after a submission the agent expects a receipt and tells the student
    at once.
- date: '2026-09-26'
  round: 9
  decision: >-
    Shape findings are fixed automatically when invisible; visible ones pause for the student with alternatives;
    three failed attempts raise a hand.
- date: '2026-09-26'
  round: 14
  decision: >-
    Students work through their harness; reach status shows enrollment, cutouts, results and receipts; students see
    scenario names with pass or fail and plain reasons.
- date: '2026-09-26'
  after_round: 15
  decision: The graded unit is a slice; rcorpus gets a pure-Ruby fallback so Reach can keep its own corpus on Ruby
    2.6.
- date: '2026-09-28'
  decision: >-
    Reach and Teach speak one contract, specs/wire.yml (protocol 1), pinned byte for byte in both repositories: Teach's
    specified wire as the base, plus Reach's query-inclusive request signing, per-file submission manifest and per-slice
    owned-file manifest.
- date: '2026-09-28'
  decision: >-
    Reach installs by pasting its repository link into Claude Code, Claude Cowork, Codex or Antigravity (the Gemini
    harness); INSTALL.md is the installing agent's directive and reach setup does the harness-specific work. rplugin is
    optional; Reach runs from a harness's own plugin copy on the Mac's built-in Ruby 2.6.
- date: '2026-09-28'
  decision: >-
    The plugin's agent is rEach. It introduces itself when it comes online and runs a short, bounded interview whose
    answers are saved on the student's computer only (persona, interview). DeepSeek Harness is not supported yet.
- date: '2026-09-28'
  decision: >-
    Course times are course times: due dates and receipt times are shown in the course's timezone with its PDT/PST
    label, whatever zone the student's computer is in. Since 0.33.0 the zone comes only from Teach; with none, times
    are shown in UTC and labeled UTC (course_time).
- date: '2026-09-28'
  decision: >-
    Releases that change what a student sees are smoke-tested first with tools/smoke: real Claude sessions in a Docker
    sandbox, played by scripted or model-played students (smoke_test).
- date: '2026-09-28'
  decision: >-
    Every interview question asks one thing, so the two that asked two (studies and year; work times and deadline
    reminders) are split and the interview has at most twelve main questions (interview).
- date: '2026-09-28'
  decision: >-
    rEach is an engineer as well as a partner. Every workspace AGENTS.md ends with a directive table in the fleet's
    opcode form; public engineering directives ship in this repo, course directives only inside the encrypted
    guardrails package. One checker (reach check) serves the hooks, the attempt gate and the submit gate; plans and
    checkpoints are Reach's own, with no git in the workspace; every owned file carries an invisible seal and every
    session a witness ledger that Teach reads for provenance, silently (directives, check, checkpoints, seal).
- date: '2026-09-29'
  decision: >-
    Reach abstracts coding away from the student. The agent writes the code and its own scenarios, qualifies them
    here and on Teach before any submission, and iterates out of the student's sight; the student hears a notice from
    the second failed pass, the third raises a structured agent hand (reach.hand/v2) and needs the student's yes to go
    on, and the tenth stops until an instructor replies (qualification, attempt_ladder). The tips suite is gone.
- date: '2026-09-29'
  decision: >-
    Split qualification: the agent's scenarios run locally against Grokit's answer-free qualify kit when the slice
    allows it, and always on Teach against the reference build, the starting copy and the hidden graded scenarios. No
    reference code leaves Teach; Teach answers with scenario names, results, the agent's own step text and a
    whitelisted error class only.
- date: '2026-09-29'
  decision: >-
    When writing code the agent must follow the reach-feature or reach-bug flow (directive FLOW). Git is not supported
    yet: the gate refuses it in slice and root spaces, files are overwritten in place and checkpoints are the history.
    Git support is planned for Reach 2.0 (ROADMAP.md).
wire_contract: specs/wire.yml (normative for every byte between Reach and Teach; where this file and it differ, it wins)
runtime:
  ruby: 2.6.10 to 4.0.x; standard library only; no native gems.
  sdk: >-
    Optional. When rplugin (Ruby 3.3+) is installed at ~/.rplugin, exe/reach loads it and Reach reaches its ports
    through Reach.ports; otherwise Reach keeps its own records under ~/.reach. rplugin-compat (the Ruby 2.6 rewrite)
    is no longer required to run.
  browser: >-
    Chromium for panel qualification runs, found in this order - REACH_CHROME, Google Chrome, Chromium, Microsoft Edge; Reach
    offers to download a pinned Chromium build into its own directory when none is found.
  platforms:
    macos: 10.15 or newer, system Ruby 2.6.10
    windows: >-
      10 or 11, Ruby 4.0.x from RubyInstaller pinned by Reach's installer (the same Ruby column the instructors
      grade on), or WSL2 with the Linux path
    linux: Any distribution with a packaged Ruby 2.6 to 4.0; otherwise Reach's installer offers a pinned Ruby 4.0.x
      build
  lockfile_selection: >-
    Ruby 2.6 to 3.1 uses Gemfile.ruby26.lock; Ruby 3.2 and newer uses Gemfile.lock. Reach picks by RUBY_VERSION
    and installs the gems into its own directory, never the system gem path.
plugin_manifest:
  file: reach.rplugin.yml
  content:
    schema: rplugin/v1
    id: reach
    name: Reach
    version: 0.16.23
    rplugin: ">= 1.2.0"
    description: >-
      rEach, the student's academic assistant for a Teach-run course: greets and gets to know the student, keeps course rules,
      checks work, submits it and shows receipts.
    ports:
      required:
      - secrets
      - state
      - events
      optional:
      - corpus
      - schedule
    extensions:
      enabled:
      - claude-code
      - codex
      - os
    corpora:
      owns:
        id: reach
        reads_kinds:
        - note
        - tip
        - attempt
        - receipt
        - qualification
        writes_kinds:
        - note
        - tip
        - attempt
        - receipt
        - qualification
        kinds_file: specs/kinds.yml
        tiers_split: true
      consumes: []
    contents:
      skills:
      - id: reach-course
        path: skills/reach-course/SKILL.md
      - id: reach-submit
        path: skills/reach-submit/SKILL.md
      - id: reach-help
        path: skills/reach-help/SKILL.md
      - id: reach-assistant
        path: skills/reach-assistant/SKILL.md
      - id: reach-build
        path: skills/reach-build/SKILL.md
      - id: reach-fix
        path: skills/reach-fix/SKILL.md
      - id: reach-feature
        path: skills/reach-feature/SKILL.md
      - id: reach-bug
        path: skills/reach-bug/SKILL.md
      - id: reach-checkpoint
        path: skills/reach-checkpoint/SKILL.md
      - id: reach-storage
        path: skills/reach-storage/SKILL.md
      - id: reach-import
        path: skills/reach-import/SKILL.md
      - id: design-taste-frontend
        path: skills/design-taste-frontend/SKILL.md
      agents:
      - id: reach
        path: agents/reach.md
      specs:
      - path: specs/app.yml
      hooks: hooks/reach.hooks.yml
      mcp:
      - id: reach
        command: ruby
        args:
        - "${PLUGIN_ROOT}/exe/reach"
        - mcp
      docs:
      - path: docs/student-guide.md
      - path: docs/INSTALLATION-AND-SETUP-GUIDE.docx
      - path: INSTALL.md
    native:
      claude_agent: reach:reach
      interface:
        display_name: rEach
        short_description: Your academic assistant for a Teach-run course
        developer_name: PatḗrasAI
        category: Education
        default_prompt:
        - Hi rEach
      keywords:
      - education
      - course
      - students
      - assistant
      author:
        name: PatḗrasAI
    compatibility:
      ruby: ">= 2.6"
      harnesses:
        claude-code: supported
        codex: supported
        hermes: unsupported
    repository:
      remote: git@github.com:SteveBenner/rEach.git
      store_path: reach
layout:
  install_root: "~/.rplugins/reach (the plugin) and ~/.reach (the student's data)"
  data:
  - path: "~/.reach/install.yml"
    content: install id, student id, course id, Teach URL, public keys; mode 0600
  - path: "~/.reach/keys/install.pem"
    content: The install's private key, mode 0600, never transmitted
  - path: "~/.reach/keys/teach/<key_id>.pem"
    content: Teach's signing public keys from install.yml, written for dovetail check to verify shape signatures
  - path: "~/.reach/packages/<kind>/<version>.pkg"
    content: Encrypted packages as received
  - path: "~/.reach/vault/"
    content: >-
      Decrypted guardrails, plus the shape package's Dovetail checker
      (vault/shape/dovetail/, exe/dovetail, lib/**, VERSION) when the package carries one; mode 0700; recreated
      from packages on demand and wiped on reach lock
  - path: "~/.reach/outbox/"
    content: Signed submission and hand packages awaiting upload
  - path: "~/.reach/state/part/pending.json"
    content: >-
      The latest gate-allowed prompt typed in a slice or the workspace root that is long enough to answer an own-part
      question and is not a consent yes or no (0600); reach part record takes it and deletes it. No other prompt text
      is kept outside the microbrain
  - path: "~/.reach/brain/"
    content: >-
      The microbrain's own state (since 0.16.15): state.json (write budgets, local reinforcements, admit backoff,
      memory-notice flag), sessions/<session>.json (nudge counters, last source, recent injections)
      and index.json (a rebuildable cache of the spool's findings); directory 0700, files 0600
  - path: "~/.reach/receipts/"
    content: Receipts as received, verified
  - path: "~/.reach/logs/"
    content: Reach's own logs, rotated at 5 MB x 5 (requests.jsonl holds method, route, status, latency, retries; never bodies)
  - path: "~/.reach/profile.yml"
    content: The student's interview profile (reach.profile/v1), mode 0600, on this computer only
  - path: "~/.reach/state/status.json"
    content: The last GET /status response with fetched_at; the gate's freshness and update checks read it
  - path: "~/.reach/state/bucket.json"
    content: The request token bucket every Reach process shares, under an exclusive file lock
  - path: "~/.reach/bin/reach and ~/.reach/bin/root"
    content: >-
      A stable shim that runs the most recently used Reach install, so workspace hooks keep working when a harness
      moves its plugin copy on update
  workspace_root:
    path: "~/reach-work (REACH_WORKSPACE_ROOT chooses another)"
    content:
    - deliverables/<course>/<assignment>/<cutout>-<slice>/ - one slice workspace per assigned slice (below); all assignment code lives here
    - extracurricular/ - the student's own code folder (extracurricular)
    - AGENTS.md, CLAUDE.md, GEMINI.md and the harness configuration for the root space, where writes are refused (M-WRITE-ROOT)
    layout_detail: workspace_layout (below)
  workspace:
    path: "~/reach-work/deliverables/<course>/<assignment>/<cutout>-<slice>/"
    content:
    - The slice's owned files (the only writable course files)
    - api/ - instructor API signatures (read-only)
    - contract/ - contract.rb, generated types and client (read-only)
    - shape/ - the brief (read-only; the signed shape stays in the vault)
    - README.md - the slice's behaviour, inputs, outputs and what to do
    - AGENTS.md, CLAUDE.md and GEMINI.md - generated by Reach from the guardrails package's directives (read-only; specs/wire.yml W-RENDER-1)
    - ".claude/settings.json, .mcp.json, .codex/config.toml and .codex/hooks.json - the workspace-level harness configuration, calling Reach through the ~/.reach/bin/reach shim"
    - ".reach/ - the workspace marker with the slice id, the owned-path list, the delivered digests, the qualify marker and qualification.json (the latest qualification record)"
    - qualify/kit/ - Grokit's answer-free qualify kit from the slice API (read-only; since 0.11.0)
    - qualify/features/ and qualify/step_definitions/ - the agent's own scenarios and steps (writable; since 0.11.0)
    permissions: Everything except the owned files and the two qualify folders is made read-only on disk; Reach restores permissions if they
      change.
library:
  namespace: Reach
  modules:
  - name: Reach::CLI
    role: The reach command and its subcommands
  - name: Reach::Enroll
    role: Key generation and the enrollment call, shape v1 (single-use code) and shape v2 (course code, username, student id; since 0.16.0)
  - name: Reach::Identity
    role: Normalizes course codes, course ids, institutional usernames and student ids (W-ENR-1..3); since 0.16.0
  - name: Reach::Fingerprint
    role: The salted, hashed computer, account and install-key fingerprint (W-ENR-4); since 0.16.0
  - name: Reach::Stamp
    role: Verifies and stores Teach's signed enrollment stamp (W-ENR-5); since 0.16.0
  - name: Reach::EnrollmentLock
    role: Decides whether Reach is locked and why (W-ENR-6); since 0.16.0
  - name: Reach::EnrollFlow
    role: The in-chat enrollment state machine run by the plugin-level prompt hook (W-ENR-7); since 0.16.0
  - name: Reach::Instructor
    role: >-
      Instructor unlock since 0.16.17 (STD-INSTRUCTOR-UNLOCK). Keygen, RINS1 code minting and verification against the keys pinned in config.yml, the stored code in instructor.json, relock and the once-per-session instructor context.
  - name: Reach::Persona
    role: >-
      Instructor personas since 0.16.23 (STD-INSTRUCTOR-PERSONA). start! enrolls the install as a test student through W-API-ENROLL-INSTRUCTOR into root/personas/<id>/ (workspace under workspace_base/personas/<id>/), writes root/persona.json last and moves a half-made persona to .backup on any failure; exit! moves the pointer, home and workspace to .backup; status names the active persona. Reach::Paths.root and workspace_base are the shared locations, Paths.home and workspace_root follow the active persona.
  - name: Reach::Debug
    role: >-
      Debug mode since 0.16.23 (STD-DEBUG-MODE). on? and reason are cheap and never touch the network: persona, then the local switch debug/switch.json, then the cached status.debug.requested. emit(kind, fields) returns at once when off, scrubs by W-DBG-SCRUB, stamps id, at, seq and persona_id, and appends one line to debug/spool.jsonl (0700 directory, 0600 files) under a flock, capped by config.yml debug.spool_max_bytes with a dropped counter carried by the next session event. flush posts the spool to W-API-DEBUG through Reach::Client in batches, moves sent lines to debug/sent-<date>.jsonl and keeps everything queued on a failure (a quick flush backs off 60 seconds after one); events Teach refuses (invalid_request, too_large) move to debug/rejected-<date>.jsonl.
  - name: Reach::DebugRender
    role: >-
      W-DBG-RENDER. detect picks tui or gui from the harness environment (Claude Code CLAUDE_CODE_ENTRYPOINT and CLAUDE_CODE_DESKTOP_APP_VERSION, Codex CODEX_DESKTOP_APP and CODEX_IDE_*, Hermes always tui, unknown tui); config.yml debug.render (auto, ascii, markdown) overrides it for display. table renders time, kind, what, result and ms as an ASCII table of at most 100 columns or a Markdown pipe table, at most debug.show_max_rows rows then the M-DEBUG-MORE line, with every label from locales/en-US.yml.
  - name: Reach::SetupLog
    role: >-
      Setup log since 0.35.0 (STD-SETUP-LOG). active? while the current home has no install file and instructor mode is off and REACH_SETUP_LOG is not 0. record(kind, fields) appends a redacted line to <home>/setup-log/log-<date>.jsonl under a flock; Reach::Debug's emit, command, hook, request, response and fault and Reach::Messages.text feed it whether or not debug mode is on. redact drops secret-named fields, turns typed text into its length and line count and cuts strings at setup_log.string_max_bytes. outcome! keeps the failure streak in setup-log/state.json; at each multiple of setup_log.threshold export! writes reach-setup-report-<time>.json to Downloads and take_offer! returns M-SETUP-REPORT-SAVED once. Never sends anything, never raises.
  - name: Reach::Guide
    role: >-
      Reads the text of docs/INSTALLATION-AND-SETUP-GUIDE.docx with the standard library (Reach::Unzip and Zlib),
      one line per paragraph, a table row per line with its cells joined by " | ", and [Screenshot] where a picture
      stands; since 0.16.13
  - name: Reach::Client
    role: Signed HTTPS requests to Teach with timeouts, retries and a circuit breaker
  - name: Reach::Crypto
    role: RSA-PSS verification and signing, RSA-OAEP unwrapping, AES-256-GCM, from the standard-library OpenSSL
  - name: Reach::GCM
    role: >-
      AES-256-GCM for a library whose GCM refuses additional authenticated data (macOS's built-in Ruby with LibreSSL
      3.3.6): AES-256-CTR from the library plus GHASH in Ruby, byte-identical to OpenSSL's GCM; Reach::Crypto uses it
      only when a one-time probe of the native cipher fails (since 0.20.6)
  - name: Reach::Packages
    role: Fetch, verify, store and unpack packages into the vault or the workspace
  - name: Reach::Guardrails
    role: Loads the guardrails package, renders AGENTS.md and CLAUDE.md, and answers the gate
  - name: Reach::Gate
    role: The code-level checks the harness hooks call - may the agent run, may this path be written
  - name: Reach::Workspace
    role: Creates, locks and verifies slice workspaces
  - name: Reach::Shape
    role: Runs Dovetail's checker against the signed shape and classifies findings
  - name: Reach::Attempts
    role: reach attempts show and continue over the attempt ladder (settle is a no-op kept for old hooks)
  - name: Reach::Ladder
    role: The attempt ladder per slice - notice, agent hand, consent, hard stop, reset
  - name: Reach::Qualify
    role: reach qualify - check, coverage, local passes, the Teach qualification, judging and the record
  - name: Reach::Suite
    role: Installs the qualify kit's gems per lock digest and runs Cucumber with a timeout; parses its JSON report
  - name: Reach::Submit
    role: Packs, signs, encrypts, uploads and waits for the receipt
  - name: Reach::Receipts
    role: Verifies and stores receipts; announces them
  - name: Reach::Hands
    role: Builds context bundles and raises hands; delivers replies
  - name: Reach::Transcript
    role: Records signed-in assignment work (prompts, AI output, code) in ~/.reach/transcripts and sends it to Teach; capturing? holds the bounds (STD-TRANSCRIPT)
  - name: Reach::TranscriptIngest
    role: Reads the harness's own session transcript from where it last stopped (replies, reasoning, actions); skip moves that place forward without recording
  - name: Reach::TranscriptExport
    role: Saves the student's own recorded conversations as a ZIP in Downloads; the one automatic export at course end (STD-TRANSCRIPT-EXPORT)
  - name: Reach::LateWork
    role: Late-work detection, notices and the once-per-assignment late_work and late_submission hands; since 0.19.0 (STD-LATE-WORK)
  - name: Reach::Grades
    role: The points Teach has recorded for the student (W-API-GRADES); since 0.19.0 (STD-GRADE-VIEW)
  - name: Reach::MCPBridge
    role: >-
      A local stdio MCP server the harness connects to, proxying the permitted Teach tools with the install's credentials
  - name: Reach::Harness
    role: Detects Claude Code and Codex, installs hooks and configuration, and launches them
  - name: Reach::Status
    role: The status summary
  - name: Reach::Corpus
    role: Notes, tips, attempts, qualifications and receipts as brain-spool lines, admitted into Reach's own corpus when rcorpus loads (Reach::BrainSpool)
  - name: Reach::Brain
    role: >-
      The microbrain, since 0.16.15: captures each gate-allowed prompt the student types, in any folder, as a
      private source (capture_prompt, called from the prompt hook), takes the findings the agent distils (reach remember), gates them for novelty and budget,
      injects a profile at session start and matching memories on each prompt, and forgets on request. Hooks never
      raise; every record stays on this computer.
  - name: Reach::BrainIndex
    role: >-
      The read model over every brain-spool line (pending and admitted, latest line per id, tombstones hide):
      BM25 search and term-frequency cosine similarity over active findings, decay and reinforcement salience, and a
      cache in ~/.reach/brain/index.json keyed by each spool file's inode, size and mtime; since 0.17.1 also course
      sources split into passages of at most 600 bytes, with search_course over them
  - name: Reach::CourseCorpus
    role: >-
      Since 0.17.1, the course reference corpus into the microbrain (STD-COURSE-CORPUS): fingerprints the delivered
      blobs and keys, decrypts them on a change, spools each file as a private source under course/<course>/<path>,
      tombstones replaced ones and records ~/.reach/brain/course-ingest.json. Runs after reach sync, at session start
      (no forced admission) and from reach reference ingest; never raises to a hook.
  - name: Reach::Directives
    role: The public directive files, the private rows from the vault, the AGENTS.md table and reach directive (a private body fetched from Teach per call)
  - name: Reach::Check
    role: The one checker the hooks, the attempt gate and the submit gate run; findings with rule ids and a fix
  - name: Reach::Checkpoint
    role: Snapshots of the slice's owned files under ~/.reach/checkpoints, saved and restored without git
  - name: Reach::Plan
    role: The slice plan at <workspace>/.reach/plan.yml
  - name: Reach::Seal
    role: Stamps, verifies and classifies the invisible per-install mark on every owned file
  - name: Reach::Ledger
    role: The HMAC-chained witness ledger of sessions, prompts, writes, checks, checkpoints and submits
  - name: Reach::Sidecar
    role: The per-computer state file that ties installs together
  - name: Reach::Integrity
    role: Silent integrity reports to Teach (vault, marks, ledger, sidecar), deduplicated and queued offline
  style: >-
    Every module is plain Ruby 2.6 - no refinements beyond 2.6, no endless methods, no pattern matching, no numbered
    parameters, no Hash shorthand.
harness_integration:
  supported:
  - claude-code (terminal, desktop Code tab, VS Code)
  - claude-cowork (Claude desktop; plugin added from Customize > Plugins)
  - codex (CLI, IDE, desktop app)
  - antigravity (Google's agent app and CLI, which replaced Gemini CLI in 2026)
  - hermes (Nous Research's Hermes Agent CLI, through a dedicated Hermes profile named reach)
  not_supported:
  - deepseek-harness (developer preview; plugin installation undocumented; no official desktop app)
  - the Gemini consumer app (no plugin system)
  packaging:
    principle: >-
      One repository that each harness reads as its own kind of plugin; the repository is its own marketplace. Every
      file below except skills/, agents/ and rules/ is generated by rplugin package (rplugin 1.2.0; 1.6.5 since 0.21.14) from
      reach.rplugin.yml and checked by rplugin check; none is edited by hand.
    files:
      .claude-plugin/plugin.json and .claude-plugin/marketplace.json: Claude Code and Cowork (/plugin install reach --marketplace <link>, or Customize > Plugins > Add marketplace).
      .codex-plugin/plugin.json and .agents/plugins/marketplace.json: Codex (codex plugin marketplace add <link>, codex plugin add reach@reach).
      plugin.json: >-
        The Agent Plugins 1.0 manifest, read by Antigravity. Codex 0.156 and newer takes a root plugin.json over
        .codex-plugin/plugin.json and then loads no plugin hooks (openai/codex#47925), so since 0.16.16 Reach sets it
        aside as plugin.json.agent-plugins in Codex's own cached copy of rEach ($CODEX_HOME/plugins/cache/*/reach/*/,
        only where .codex-plugin/plugin.json is present) after reach setup and every update, and when Codex starts
        reach mcp. The repository and the install folder keep it, so Antigravity is unaffected.
      skills/: Every harness.
      agents/reach.md and settings.json: The rEach persona as Claude's main session agent.
      rules/reach.md: Antigravity's always-on pointer to reach hello and the persona.
      hooks/reach.hooks.yml: The harness-neutral hook source (rplugin.hooks/v1), SessionStart only, running reach hello.
      hooks/hooks.json: Claude's rendering of it (${CLAUDE_PLUGIN_ROOT}).
      hooks/codex.json: Codex's rendering, named by .codex-plugin/plugin.json (${PLUGIN_ROOT}, which Codex sets for plugin hooks).
      .mcp.json: Claude's and Cowork's MCP bridge (runs on the student's computer).
      mcp.json: The Agent Plugins MCP bridge, read by Codex from its plugin cache; ${PLUGIN_ROOT} expands to that copy. It runs ruby, not sh, since 0.21.12, because Codex on Windows has no sh.
    no_top_level_bin: Claude Cowork refuses a plugin with a top-level bin/ directory, so the executable is exe/reach.
    enforcement_scope: >-
      Plugin-level hooks only greet. Course enforcement (gate, shape check, attempts) lives in each slice workspace's own
      harness configuration, so the student's other sessions are never blocked.
  install_from_link:
    directive: INSTALL.md, read by the agent the student pasted the link into.
    command: reach setup --harness claude-code|codex|antigravity|hermes (runs the harness's own install commands, or links the plugin into Antigravity's plugin directories)
    ends_with: A NEXT block the installing agent speaks word for word - "rEach is installed and ready." and the greeting.
  pattern: >
    A harness over a harness, as in rSlides: Reach detects the agent CLIs installed on the machine, the student
    picks one, and Reach configures it and launches it in the slice workspace. Reach never falls back to another
    harness or model on its own.
  detection:
    claude_code: The claude executable on PATH; its version from claude --version.
    codex: The codex executable on PATH; its version from codex --version.
    antigravity: The agy executable on PATH; its version from agy --version.
    hermes: The hermes executable on PATH; its version from hermes --version.
    catalogue: A dated harness-models.json listing each harness's models and default, updated with Reach releases.
  launch:
    command: reach work [--harness claude-code|codex|antigravity|hermes] [--slice <cutout>-<slice>]
    initial_prompt: '"Hi rEach", so a terminal harness starts with rEach speaking first.'
    steps:
    - Run the gate (below); stop with a plain message if it fails.
    - Regenerate AGENTS.md, CLAUDE.md and GEMINI.md in the workspace from the current guardrails.
    - >-
      Verify the harness configuration Reach installed is intact (hooks, MCP bridge entry, sandbox settings); repair
      it if not.
    - Start the harness in the workspace directory.
  plugin_level:
    hooks:
    - event: SessionStart
      command: reach hello --format hook
      effect: >-
        Adds the "rEach session context" (the right greeting and the persona pointer) to every session, so rEach
        introduces itself first; it never blocks, so the student's other sessions are untouched. Since 0.19.1 it
        answers at once from local files and starts one detached reach hello --background (status refresh, course
        reference ingest, storage and import session start, late retry), which stores a refreshed context that the
        session's next prompt carries once. Since 0.22.0 the same background run keeps the Teach subscription's operating
        system job current (Reach::Subscribe.ensure!, STD-TEACH-SUBSCRIBE), and the session's MCP server checks Teach for
        changes about every 60 seconds (subscription).
    session_agent: >-
      settings.json {"agent": "reach:reach"} makes rEach the main session agent in Claude Code. A plugin agent's
      initialPrompt is ignored, so rEach speaks first through the hello context, not an automatic turn.
  claude_code:
    configuration: >-
      A project-level .claude/settings.json in each slice workspace, written by Reach and made read-only, plus a
      workspace .mcp.json for the bridge. Every hook command calls the ~/.reach/bin/reach shim.
    hooks:
    - event: SessionStart
      command: reach gate session --harness claude-code
      effect: >-
        Exits 2 with a message when the guardrails are missing, expired or unverifiable, so the session carries
        the message and Reach's skills refuse to proceed; on success injects the guardrail summary into the context.
    - event: UserPromptSubmit
      command: reach gate prompt --harness claude-code
      effect: >-
        Records the prompt for the local microbrain, the own-part answer and the attempt ladder (nothing is written to a
        transcript), then blocks prompts while the gate fails, so a missing guardrail stops all work, not only the first turn.
    - event: PreToolUse (Write, Edit, MultiEdit, NotebookEdit)
      command: reach gate write (reads the tool input from standard input)
      effect: Exits 2 for any path that is not one of the slice's owned files, with the reason.
    - event: PreToolUse (Bash)
      command: reach gate shell (reads the tool input from standard input)
      effect: >-
        Refuses commands that would write outside the owned files (redirection, cp, mv, rm, sed -i, git checkout
        of read-only files), that reach the vault, or that read the suite or reference build; allows read-only commands
        and reach itself.
    - event: PostToolUse (Write, Edit, MultiEdit)
      command: reach shape check --changed <path> --format agent
      effect: Returns shape findings to the agent immediately after each edit.
    - event: Stop
      command: reach attempts settle
      effect: Records whether the turn resolved or left open findings, for the attempt gate (slice space only).
    - event: Stop
      command: reach hook stop --harness claude-code
      effect: >-
        Flushes debug events, shows the Teach link notice and the debug block; never blocks and always exits 0.
    - event: SessionEnd
      command: reach hook stop --final --harness claude-code
      effect: >-
        The same at session end, without the spacing of the Stop flush; never blocks and always exits 0. Codex has no
        SessionEnd, so its tail waits for the next turn, session or reach sync.
    spaces: >-
      Since 0.10.0 the same hooks are written in every slice workspace, in extracurricular/ and in the workspace root
      (Reach::Harness.claude_settings_content(space)); the extracurricular and root spaces have no shape check and no
      attempts hook, and their gate follows extracurricular.gate.
    mcp: The Reach MCP bridge registered as a stdio server (reach mcp) in the workspace .mcp.json, enabled by enableAllProjectMcpServers.
    permissions: Deny rules for reading ~/.reach/vault and ~/.reach/keys.
  codex:
    configuration: >-
      A workspace .codex/config.toml written by Reach and made read-only, with sandbox_mode workspace-write,
      [sandbox_workspace_write] writable_roots [~/.reach] and network_access true, the bridge under [mcp_servers.reach],
      and a read-only .codex/hooks.json with the same hooks as Claude's (PreToolUse matching apply_patch, Write,
      Edit and the shell tools; UserPromptSubmit as reach gate prompt --harness codex with a 60 second timeout;
      SessionStart as reach gate session --harness codex with 10 seconds, the plugin's own limits; Stop reach hook stop
      --harness codex); AGENTS.md carries the
      guardrails. Reach rewrites these files, and so picks up a changed timeout, whenever it configures a workspace
      (sync, update, the session start).
      Written in every space (slice, extracurricular, root) as for Claude Code.
    launcher_gate: >-
      reach work runs the gate before starting Codex and refuses to start it when the gate fails; Codex is always
      started through reach work for course workspaces.
    write_scope: >-
      Enforced by Codex's sandbox (writable roots) and re-checked by Reach at submit time (any change outside the
      owned files blocks the submission).
    mcp: The Reach MCP bridge registered in the workspace configuration.
    sandbox_outside_course_folders: >-
      Codex applies a course folder's .codex/config.toml only when the student trusts that folder; elsewhere its own
      sandbox blocks the network and the Reach home for every shell command. Since 0.21.8 (STD-CODEX-SANDBOX) Reach
      says so in plain words (M-SANDBOX-AGENT, M-SANDBOX-STUDENT) instead of reporting a lost connection or a hiccup,
      and the agent reaches debug mode and the health check through reach_debug and reach_doctor. Since 0.28.2
      M-SANDBOX-STUDENT names the course folder by its path on this computer (Reach::Paths.workspace_root, with the
      computer's own path separator) and says it holds deliverables and extracurricular, so the student opens that
      folder itself. Since 0.31.0
      (codex_setup, STD-CODEX-SETUP): after the student's yes Reach writes the sandbox settings it needs into the
      student's own user-level Codex configuration, which every Codex chat on the computer uses.
    limits_stated_honestly: >-
      Codex now has PreToolUse hooks; file writes arrive as apply_patch with the patch text, and reach gate write reads
      the patch's file headers. Codex runs a project's .codex/hooks.json and the plugin's hooks only after the student
      trusts them (the plugin's two hooks reach the trust review only once Reach has set the cached root plugin.json
      aside, see packaging.files); until then enforcement is the read-only file permissions plus the submit-time check, and reach watch
      stays the shape-check backstop.
  antigravity:
    configuration: >-
      reach setup runs agy plugin install, or links the repository into ~/.gemini/config/plugins/reach (and the CLI's
      plugin directory when present). rules/reach.md, the skills and each workspace's GEMINI.md carry the persona and the
      course rules.
    limits_stated_honestly: >-
      Antigravity's hook format is undocumented, so Reach installs no Antigravity hooks; enforcement there is the
      read-only file permissions plus the submit-time check, and nothing from it reaches the course record. Since 0.9.0 a
      submission from it is sealed hooked false with harness antigravity, and Teach notes it as unwitnessed rather than
      flagging it for review, unless the instructors set TEACH_UNHOOKED_HARNESS_POLICY=review. Its desktop app installs only curated plugins from its own
      interface, which is why setup links the plugin directory.
  hermes:
    profile: >-
      Hermes keeps hooks and MCP servers in a profile's config.yaml, never per folder, so Reach gives course work its
      own Hermes profile named reach and leaves the student's other profiles untouched. reach setup --harness hermes
      runs hermes profile create reach --clone --no-alias (so the student's model and keys carry over and no
      ~/.local/bin/reach wrapper shadows Reach's own reach command), then links skills/reach-assistant and
      skills/reach-course into the profile's skills directory. The profile's config file is found with
      hermes -p reach config path, never guessed.
    configuration: >-
      On every configure (reach work, reach hello and workspace setup) Reach loads the profile's config.yaml, backs it
      up once as config.yaml.reach-backup, sets only the keys it owns and writes the rest back unchanged: hooks
      (on_session_start reach gate session --harness hermes; pre_llm_call reach gate prompt --harness hermes;
      pre_tool_call matching write_file|patch|execute_code as reach gate write --harness hermes and matching terminal
      as reach gate shell --harness hermes, both fail_closed, execute_code refused outside extracurricular;
      post_llm_call reach hook stop --harness
      hermes; on_session_end reach hook stop --final --harness hermes; pre_verify reach check --format
      hermes in a slice), mcp_servers.reach for the bridge, and agent.disabled_toolsets gaining code_execution. Every
      hook command calls the ~/.reach/bin/reach shim; each command answers only inside a course folder and is a no-op
      elsewhere.
    launch: >-
      reach work --harness hermes runs the gate, rewrites the rules files and the profile configuration, then execs
      hermes -p reach --accept-hooks chat -q "Hi rEach" in the workspace. --accept-hooks is Hermes' documented bypass of
      its first-use hook prompt; Reach passes it only on launches it makes itself, and it persists nothing. Hermes
      reads the workspace's AGENTS.md as its project context. The installer puts nothing on the student's PATH, so
      since 0.11.4 setup prints the launch as the full command (the Ruby interpreter and the absolute ~/.reach/bin/reach
      shim, as the hooks use), and the docs give ~/.reach/bin/reach work --harness hermes, never a bare reach.
    greeting: >-
      Hermes has no session-start context injection, so reach gate prompt --harness hermes returns the rEach session
      context (reach hello's text) as pre_llm_call context on the session's first turn (extra.is_first_turn).
    limits_stated_honestly: >-
      Hermes' pre_llm_call cannot refuse a prompt, so a prompt the gate blocks is still sent to the model; Reach
      records it as blocked and returns the refusal as context telling the agent to stop. Writes and shell commands are
      refused for real (pre_tool_call exit 2). execute_code runs Python the shell gate cannot read, so its toolset is
      off in the reach profile and the gate refuses it in a slice. Hermes started any other way than reach work, or
      under another profile, carries none of this; the submit-time check still holds.
  skills:
    reach-assistant:
      purpose: >-
        The rEach persona, loaded in every session: greet first, run the intake interview, keep every conversation on
        the course, and save the profile only on this computer. Its body is identical to agents/reach.md.
      contents:
      - Start of every session - follow the rEach session context, or run reach hello
      - The intake interview and its guardrails (see persona below)
      - Staying on course and redirecting off-topic requests
      - Profile show, save and forget
    reach-course:
      purpose: Loaded in every course session; tells the agent how to work in a slice.
      contents:
      - The guardrail directives
      - How to read the brief and the README
      - Run reach check after each change and resolve findings by class
      - Follow the FLOW directive - reach-feature or reach-bug - whenever writing code; never run git
      - Pass reach qualify before suggesting a submission; the student never sees scenarios, code or output
      - How to talk to the student (plain language; the student directs creative choices)
      - Ground explanations in the encrypted course reference through reach reference (list, show, search, links), decrypted in memory only, never as a source of answers; the released contract wins
    reach-submit:
      purpose: Submitting and receipts.
      contents:
      - Offer to submit once reach qualify passed
      - Run reach submit and relay Reach's question word for word
      - When Reach reports the student's yes, run reach submit again once
      - Wait for the receipt with reach receipts wait
      - Tell the student at once that the submission was received with the receipt id and time
      - If no receipt within five minutes
      - say it is not yet received and retry once
    reach-feature:
      purpose: The feature flow for one slice without git - read, settle the behaviour, audit, approach, scenarios first, implement, check, qualify, checkpoint, report, offer to submit.
    reach-bug:
      purpose: The bug flow for one slice without git - reproduce with a scenario that fails, fix the cause, check, qualify, checkpoint, report.
    reach-help:
      purpose: Asking for help.
      contents:
      - When the student asks for instructor help
      - run reach hand raise with a summary; tell the student a hand was raised (Reach raises the ladder hand itself)
      - When a reply arrives
      - present it and ask before applying a suggested change
gate:
  command: reach gate <session|prompt|write|shell>
  checks:
  - >-
    The install is enrolled and not revoked.
  - >-
    This Reach is at least the minimum_reach_version Teach last advertised (M-REACH-OUTDATED otherwise, naming the
    update command).
  - >-
    The cached status is no older than 24 hours (M-GATE-STALE otherwise); reach hello and reach sync refresh it when
    online, so the gate itself never waits on the network.
  - >-
    The guardrails package is present and its signature verifies against a current instructor key (M-GATE-NOGUARD),
    and its version is not lower than the one the cached status advertises (M-GATE-OLDGUARD).
  - The workspace belongs to one of the student's current slices.
  - >-
    For write and shell, the target is inside the owned files (or, since 0.11.0, qualify/features and
    qualify/step_definitions) and outside the vault and keys. Git is refused in slice and root spaces (M-GATE-NOGIT).
    While the attempt ladder is at the hand rung without the student's yes, or at the hard stop, writes to those files
    and slice write commands are refused (M-LADDER-ASK, M-LADDER-STOPPED). A Codex apply_patch
    names its targets in "*** Add File:", "*** Update File:", "*** Delete File:" and "*** Move to:" lines; every one
    must be an owned file.
  offline: >-
    The gate passes offline for up to 24 hours on a verified cached guardrails package, so a lost connection does
    not stop class work; submissions queue.
  messages: >-
    Every refusal says what is missing and the command that fixes it (reach sync, reach enroll, reach work --slice
    ...).
  logging: Every refusal is logged locally and counted in the next status call to Teach.
  responsiveness: >-
    Since 0.19.1 (STD-HOOK-RESPONSIVE) no hook waits on the network or on another process. Reach::Locks.exclusive
    polls a non-blocking flock until a deadline and answers :busy; every file lock on a hook path (brain, brain spool,
    rate bucket, ledger, link, debug, late work, imports, the outside-access
    counter) waits at most hooks.lock_wait_s (config.yml, default 2 seconds, spent across the whole hook process) and
    then degrades without losing data. The rate bucket treats busy as no token; every other step is skipped for that event and retried by the
    next background run. The prompt after a sign-in gets the short signed-in context (M-LOGIN-DONE-AGENT with the
    session start's local parts) and starts one detached reach hello --background, whose result is stored under
    ~/.reach/state/hello and carried once by the session's next prompt. Non-hook commands keep blocking waits.
shape_loop:
  checker: >-
    Dovetail's pure-Ruby shape checker (dovetail check --require-signed) run against the signed shape in the vault.
  invocation: >-
    [RbConfig.ruby, <vault>/shape/dovetail/exe/dovetail, "check", ...] when the shape package's checker exists there,
    and ["dovetail", "check", ...] on the PATH otherwise (the not-on-PATH failure applies only to this fallback):
    <panel> --shape <vault>/shape/<cutout>/shape.json --require-signed --format json [--changed <path relative to
    the panel directory>], where <module> is the shape's module. <panel> is a copy of
    <vault>/suite/reference_build/<module>/modules/<module>/panel with the slice's owned panel files laid over it, the
    tree Teach's grading sandbox checks, so the instructors' views count; without the suite it is
    <workspace>/modules/<module>/panel, and the workspace itself when that does not exist. A slice that owns no panel
    files has no shape findings. DOVETAIL_PUBLIC_KEYS names Teach's signing
    public keys, which Reach writes from install.yml to ~/.reach/keys/teach/<key_id>.pem; Dovetail reads the signature
    from shape.sig beside shape.json, so the shape package carries both. Finding paths come back relative to the panel
    directory and Reach reports them relative to the workspace. A --changed path outside the panel directory has no
    shape findings.
  failure: >-
    Exit 0 or 1 with a JSON report is a result; any other exit, output that is not a report, or no dovetail on the PATH
    means the check could not run. Reach never reads that as no findings: reach shape check says so and fails, and
    reach check reports one visible CK-SHAPE finding carrying Dovetail's code line (D-SHP-002 for a signature no key
    verifies, D-SHP-003 for no key), which blocks a panel submission.
  classification:
    invisible: >-
      Rules whose fix changes nothing the student can see or do (S-LIF-001, S-ID-001, S-STO-001, S-DAT-001, S-EVT-003,
      S-KEY-001, S-DYN-001, S-I18N-001, S-CSS-001 when a same-looking token exists).
    visible: >-
      Rules whose fix changes appearance or behaviour (S-OVL-001, S-OVL-002, S-LAY-001, S-LAY-003, S-LAY-004, S-CSS-002,
      S-CSS-003 without an equivalent token, S-HTML-001, S-STATE-001, S-NAV-002).
    unlisted: >-
      A rule on neither list is visible when Dovetail reports it as an error and invisible when it reports a warning, so
      a warning Dovetail itself passes never blocks a submission.
  agent_protocol:
    invisible: >-
      The agent fixes the finding without interrupting the student and mentions it in its next summary only if asked.
    visible: >-
      The agent pauses, tells the student what the check found in plain words, and offers alternatives - first the
      attempted design adjusted to comply, then newer ideas - and waits for the student's choice.
  attempt_gate: Replaced in 0.11.0 by attempt_ladder, which counts failed qualifications per slice.
qualification:
  command: reach qualify [--slice <id>] [--list] [--local-only] [--task <text>] [--summary <text>] [--format text|json]
  purpose: >-
    The agent proves a slice before submission with scenarios of its own. The student never sees them or their output.
  kit: >-
    The slice API's qualify record (Grokit 0.5.0+): tag, local, kit (paths and Grokit sources), helpers and steps.
    Teach writes the kit into the workspace at qualify/kit/, refusing any source under a behaviours directory or any
    owned path, so it never carries an answer.
  steps:
  - check - reach check; only findings in the slice's own files count.
  - coverage - every graded scenario name has a scenario of the agent's with that exact name and the slice tag (QF-UNCOVERED). Since 0.20.3 a record that stops here carries next (M-QUALIFY-UNCOVERED), telling the agent to write those scenarios itself and not to raise a hand. Since 0.21.6 the feature files are read as UTF-8 whatever the locale.
  - >-
    local_pass and local_stub, when qualify.local is true - the agent's scenarios run in vault/runs/<slice>-pass on
    the kit with the owned files, and in <slice>-stub on the starting copy, where each must fail (QF-LOCAL-FAIL,
    QF-VACUOUS). A local failure whose answer the practice recording does not hold is QF-PRACTICE, which points the
    agent at qualify/kit/practice/README.md (since 0.14.5). Cucumber runs under a 300 second timeout with the kit's gems installed once per lock digest.
  - >-
    remote - a sealed qualification package (W-PKG-7) posted to Teach (W-API-QUALIFY) and polled every 10 seconds, at
    most 36 times (W-API-QUALIFICATION). Teach runs the agent's scenarios on the reference build with the owned files,
    again on the starting copy, and the hidden graded scenarios (QF-REMOTE-FAIL, QF-VACUOUS, QF-HIDDEN). Offline,
    network errors and Teach's unavailable answer leave it pending, which counts for nothing; a later run resumes the
    same qualification when the digests have not changed. Since 0.21.2 the upload and the polls run under their own
    20-second deadline, started after the local steps, so an MCP tool budget spent on the local steps cannot starve
    the upload; polls that run out leave the qualification pending with its id.
  answers_from_teach: >-
    Per row: name, result, the failing step only when it is verbatim a line of the agent's own feature files, and an
    error class from a fixed whitelist (else other). Never messages or output, because the run directory holds course
    code the student does not own.
  record: >-
    .reach/qualification.json in the workspace (files_digest and tests_digest over canonical JSON, steps, findings,
    passed, suite_version), a corpus record of kind qualification and a ledger event qualify.
  exit: 0 pass, 3 pending, 1 fail.
  submit_gate: >-
    reach submit refuses (M-SUBMIT-UNQUALIFIED) unless the latest record passed on exactly the current owned files and
    scenarios, and sends the scenarios and the record as evidence (W-PKG-5 evidence/).
  limits: Teach allows 12 qualifications per slice per hour and 2 in flight per student, and 60 scenarios per package.
attempt_ladder:
  unit: Failed qualifications per slice (a pending one does not count), in ~/.reach/state/ladder/<slice>.json.
  rungs:
    '1': Silent; the agent tries again.
    '2': M-LADDER-NOTICE for the student.
    '3': >-
      Reach raises a hand itself (originator agent, trigger attempt_ladder, reach.hand/v2 with the task, the attempt
      history, every owned and scenario file in full and the last output) and prints M-LADDER-HAND. Further
      qualifications, writes and slice write commands are refused (M-LADDER-ASK) until reach attempts continue records
      the student's yes, which needs a student prompt typed after the hand was raised (the time of the student's last slice prompt is all the ladder keeps, in ~/.reach/state/ladder/<slice>.prompt.json; hand bundles carry student_last_request null).
    4 to 9: M-LADDER-CONTINUE; one yes covers them all.
    '10': M-LADDER-STOPPED; everything is refused until an instructor replies.
  reset: A passing qualification or an instructor's reply to the ladder hand resets the ladder.
  witness: Every notice, hand, consent, stop and reset is a ledger event of kind ladder.
submission:
  command: reach submit [--slice <id>]
  preconditions:
  - The gate passes.
  - >-
    Only owned files differ from the workspace as delivered (read-only files unchanged, no new files outside owned
    paths).
  - The shape check has no errors for panel slices (only findings in the slice's own files count, since 0.11.0).
  - The latest qualification passed on exactly the current owned files and scenarios (M-SUBMIT-UNQUALIFIED).
  - Every question of the student's own part is answered (M-SUBMIT-NO-PART).
  - >-
    The slice is not closed: when the due time has passed and an ingest receipt for the slice is already stored,
    reach submit refuses with M-SUBMIT-CLOSED before asking; with no cached due time or no local receipt it goes on and
    Teach stays the authority (STD-SUBMIT-APPROVAL, W-SUB-2).
  approval: >-
    After the preconditions Reach asks the student (M-SUBMIT-ASK) and submits only on their yes (STD-SUBMIT-APPROVAL,
    STD-CONSENT-FROM-REACH). With the prompt hook, reach submit records the question and answers asked; the hook captures
    the yes for exactly the owned files asked about (valid 30 minutes) and reach submit, run again, uses it once; a no
    answers declined; a change to an owned file after the yes asks again. In a terminal reach submit prompts and reads
    the answer itself. On Antigravity, which has no prompt hook, the agent asks and runs the command after the yes. The
    submit is sent only after the yes.
  steps:
  - >-
    Pack the owned files into a gzip tar archive with manifest.json (slice, cutout, assignment, file digests, Reach
    version, client timestamp), per specs/wire.yml W-TAR, with evidence/qualify/** (the agent's scenarios and steps)
    and evidence/qualification.json.
  - >-
    Seal it as a teach.package/v1 envelope of kind submission (W-ENV): AES-256-GCM with the canonical header as
    additional data, the key wrapped with RSA-OAEP to Teach's advertised encryption_key (named in recipient_key_id),
    and the header and ciphertext digest signed with the install key (RSA-PSS).
  - Write it to the outbox.
  - >-
    Upload with an idempotency key. Teach answers 200 with the signed ingest receipt in the same response, so the
    student usually hears at once; reach receipts wait (up to five minutes) covers a queued upload.
  - Verify the receipt's signature against the key its signing_key_id names; store it.
  - Announce - the agent tells the student the submission was received, with the receipt id and time.
  - >-
    Archive - once the ingest receipt verifies, save a ZIP copy of the whole assignment folder in the student's
    Downloads folder (STD-SUBMIT-ARCHIVE) and tell the student where it is; then tell the student whether and until
    when they can submit again (attempt, due and resubmit from Teach's answer, W-SUB-1).
  archive: >-
    Reach::Archive writes <course>-<assignment>-<YYYY-MM-DD>-<HHMM>-<zone>.zip in course time (STD-COURSE-TIME) with
    Reach's own standard-library ZIP writer (Reach::Zip) through a hidden temporary file, never overwriting (-2, -3 and
    so on), with every slice workspace of the assignment minus top-level dot entries, AGENTS.md, CLAUDE.md, GEMINI.md and
    symbolic links, plus rEach/receipts/<receipt_id>.json for the assignment and rEach/own-part.json. The destination is
    REACH_DOWNLOADS_DIR when set, otherwise XDG_DOWNLOAD_DIR on Linux, otherwise Downloads in the home folder. It is
    skipped above config.yml submit.archive_max_mb (default 256) and a skipped or failed copy never fails, undoes or
    delays the submission. A queued submission that Reach later sends from the outbox is archived the same way when its
    workspace still exists. Nothing about the copy is sent to Teach. Since 0.19.0 (STD-SUBMIT-ARCHIVE) the submit ask
    (M-SUBMIT-ASK) and every answer after an ingest (M-SUBMIT-ARCHIVED, M-SUBMIT-ARCHIVE-SKIPPED,
    M-SUBMIT-ARCHIVE-FAILED) say the ZIP is or will be in Downloads and that the student must also upload it to the
    learning system the course profile names (STD-COURSE-PROFILE, since 0.33.0) when the course requires that upload; a skipped or failed
    copy names reach submit archive. Reach::Archive.claim_zip is the shared claim-and-rename step and Reach::Archive.lms_name reads the name and Reach::Archive.credit adds the sentence.
  archive_again: >-
    Since 0.19.0 reach submit archive [--assignment A] (and reach_submit with archive true and optional assignment)
    runs Reach::Submit.archive_again: it needs a stored ingest receipt for the assignment (default the current
    workspace's, else the only one with a submission), refuses with M-SUBMIT-ARCHIVE-NONE or M-SUBMIT-ARCHIVE-WHICH
    otherwise, writes the ZIP with Reach::Archive.write! from a workspace of that assignment, and answers with the
    same followup text as a submission, upload reminder included when the course requires it.
  retries:
    policy: Exponential backoff with full jitter from 5 seconds to 10 minutes, at most 12 attempts, honouring Retry-After.
    never_retry: 400, 401, 403, 404, 413 and 422 responses - these are reported to the student with the reason.
  deadline: >-
    The due time is judged by Teach's received_at; Reach warns the student 24 hours and 1 hour before a due time
    when a slice has no ingest receipt. Since 0.17.0 a slice may be submitted again until the due time and the last
    submission counts (W-SUB-1); after the due time a slice already on record is refused by Reach before it asks
    (M-SUBMIT-CLOSED) and by Teach (403 deadline_passed), while a slice with nothing on record may still be submitted
    once, marked late.
  grade_receipt: >-
    reach sync asks Teach for the grade receipt of each submission that has an ingest receipt and no grade receipt,
    at most once per submission every 30 seconds (W-API-SUBMISSION); a verified one is stored, announced (M-GRADED)
    and shown by reach status and the agent.
receipts:
  verification: Every receipt's signature is checked against the instructors' public keys before it is stored or
    announced.
  storage: "~/.reach/receipts/<receipt_id>.json and a record in Reach's corpus when available."
  attempt: >-
    Since 0.17.0 an ingest receipt carries attempt, the submission's number among the slice's submissions (W-RCPT-1,
    W-SUB-1); one from an older Teach has none. Every stored receipt for an assignment is copied into the Downloads
    ZIP (STD-SUBMIT-ARCHIVE).
  preservation: >-
    reach sync reads the install's receipts from Teach (W-API-RECEIPTS, at most 5 pages of 200) and verifies and
    stores every one Reach does not hold, so a receipt missed while offline or lost from disk comes back.
  acknowledgments: >-
    For every receipt it verifies and stores, Reach writes a receipt of the receipt (W-RCPT-4,
    reach.receipt-ack/v1): the receipt's id, kind, submission, student, the digest of the receipt exactly as
    received, the install id and the time, signed with the install key. It keeps it at
    ~/.reach/receipts/acks/<receipt_id>.json with a local state (pending, linked, mismatch or refused) and sends it
    to Teach (W-API-RECEIPT-ACK), which links it to its own receipt. It is sent once right after a submit or grade
    poll stores the receipt, and pending ones again on reach sync (at most 20 per sync, W-SAFE-11). reach status
    counts linked and pending acknowledgments; a mismatch is reported by reach sync as a warning.
  announcement: >-
    The agent and reach status both show new receipts; a desktop notification is sent when the harness is not in
    focus (macOS osascript, Windows toast, Linux notify-send when present).
  commands:
  - reach receipts - list receipts, newest first
  - reach receipts wait --submission <id> - block until the ingest receipt arrives or five minutes pass
  - reach receipts acks - list the acknowledgment records with their state, newest first
  - reach receipts show <id>
course_alignment:
  since: 0.12.0 (wire protocol 1 revision 2026-09-30b)
  purpose: >-
    Keeps each student, their course and their instructors aligned: the student signs in every session, works only on
    the current assignment of their own modules, answers their own part in their own words, stays inside the
    workspace, stays on the course, and is pointed to help at once in a crisis. The directive prose is private and
    encrypted (Teach directives PACE, OWNPART, COACH, SANDBOX, FOCUS, WHOAMI and rules G-PACE-1 ... G-IDENT-1); what
    can be enforced deterministically is enforced by Reach's hooks, not by the agent. Design record:
    docs/course-alignment-design.md; build record: the v0.12.0 blueprint, kept privately.
  policy: >-
    Reach::Policy reads the course policy (login, limits, support, student_part, module_selection) from the verified
    guardrails package's course.yml (W-POL-1). A package from an older Teach yields the defaults, with the student's
    part not required.
  login:
    - The prompt hook signs the student in at the start of every harness session in every course folder (W-ID-1).
    - It asks for the student ID (M-LOGIN-ASK), then "Am I speaking with <name>?" (M-LOGIN-CONFIRM), and waits for a yes. It blocks every step's prompt, so the agent never sees the ID or the answer.
    - Three wrong IDs in 15 minutes lock the session for 15 minutes and report login_failed; a no reports identity_denied and ends course work for the session.
    - Until the session is signed in, the write, shell and read gates refuse everything with M-LOGIN-NEEDED, except reach support. Submit, qualify, part record, modules choose and transfer request need a sign-in within max_hours (12).
    - Since 0.32.1 the first sign-in after the update asks Teach whether a password reset is allowed (no
      ~/.reach/state/login/renewed.json yet). When it is, the yes is followed by M-LOGIN-RENEW, which apologizes and
      asks for a new password twice; Reach sets it with POST /api/v1/password/reset and signs the student in. When it
      is not, Reach writes renewed.json and asks for the password as before. Hermes keeps the terminal step.
    - Since 0.28.0 (W-ID-5) the yes is followed by the password the student chose at enrollment (M-LOGIN-ASK-PASSWORD); the session is confirmed only when it matches the local verifier (~/.reach/state/login/verifier.json, a salted PBKDF2 digest) or, with no verifier, the course server. A wrong password counts toward the lockout. forgot password starts a reset, which works only after an instructor allowed one, and then asks for a new password twice. Hermes is sent to a terminal instead.
    - State lives in ~/.reach/state/login/. Commands - reach login status, reach login password (type the password in a terminal, typing hidden), reach login reset (choose a new password in a terminal once an instructor allowed a reset).
    - Since 0.19.1 the first prompt the agent sees after the yes carries M-LOGIN-DONE-AGENT (the student's name and that course work can begin) with the session start's local parts, replacing the session start's "wait for them" (M-LOGIN-NEEDED); the just-signed-in marker is removed only after the hook has written and flushed that answer, so a hook the harness kills delivers it on the next prompt.
    - Hermes cannot block a prompt, so its agent sees the typed ID; Antigravity has no hooks and no sign-in.
    - Since 0.21.5 (STD-SIGNIN-PLUGIN-HOOK) the plugin's own prompt hook (reach gate enroll, from hooks/hooks.json and hooks/codex.json) also signs the student in once enrollment is done, in every folder, because Codex runs a hook only after the student trusts it and every course folder's .codex/hooks.json starts out untrusted. When the plugin hook and a course folder's prompt hook both run for one prompt, the first to claim it under ~/.reach/state/login/prompt.lock evaluates the sign-in and records the prompt's digest; the other passes that prompt with no answer and captures nothing.
    - Since 0.33.4 (STD-CODEX-SETUP, STD-HOOK-GUARD) the plugin's prompt hook also takes a typed yes or no to the Codex setup question on Codex, because a course folder's prompt hook does not run until Codex trusts the folder and the hook. It keeps its own stamp (hooks_enroll_seen.json) and no longer counts as the prompt hook that the hooks guard and reach part record look for.
  identity_tags: Every local record (ledger, corpus, consent, part answers, module records, imports) carries student_id (W-ID-2).
  consent: >-
    Anything that commits the student (module lock, transfer request) needs their own yes, captured by the prompt hook
    within 30 minutes of the question and used once (W-CONSENT-1). The command prints the question for the agent to
    relay and exits 3 until the answer arrives. Since 0.14.3 the prompt hook that captures the yes or no runs the
    pending action itself (quick network timeouts; offline or slow means queued and flushed later) and gives the
    agent M-CONSENT-DONE with the outcome to relay word for word.
  modules:
    - Teach signs a record of the student's modules (W-MOD-1). Reach verifies it, keeps current and history under ~/.reach/state/modules/, and refuses writes in a slice of a module that is not the student's (M-GATE-NOT-YOUR-MODULE). Old workspaces stay on disk.
    - In a student_choice course (BUS 201), reach modules lists the options until the window closes; reach modules choose <a> <b> asks "Lock in A and B for the rest of the course?", seals the choice locally, sends it with the student's yes, and stores Teach's signed record. It is then locked; a second choice is refused.
    - While a choice is open the prompt gate lets the student sign in and answer, though they have no slice yet (W-MOD-5).
    - Commands - reach modules [choose <a> <b>] [--format json].
  transfers: >-
    reach transfer request --modules a,b asks "Would you like to notify the professor to verify your move?"; on yes it
    sends the request with the student's own words, and nothing changes until an instructor approves or denies it.
    reach sync and reach transfer status poll at most every 60 s while it is pending; reach status and the session
    greeting show the answer.
  own_part:
    - Each assignment's questions only the student can answer come from the course policy (W-PART-1). reach part lists them; reach part record <id> takes the student's latest typed prompt (at most 30 minutes old, at least min_words words, never a bare yes or no; M-PART-NO-ANSWER when there is none, M-PART-NO-HOOK since 0.28.1 when the prompt hook has not run for 30 minutes) verbatim, and stores it with its digest and no session or sequence number. The prompt hook keeps only the latest gate-allowed prompt typed in a slice or the root that has at least the smallest min_words of any question and is not a consent yes or no, in ~/.reach/state/part/pending.json (0600); reach part record takes it, then deletes the file.
    - reach submit refuses with M-SUBMIT-NO-PART until every question is answered, and sends part.json. Teach stores the answers as sent and runs no check against any conversation.
  sandbox:
    - The read gate (Claude Code Read, Glob, Grep, NotebookRead, LS; Hermes read and search tools; Codex view_image) and the shell gate refuse any path outside the student's workspace root (M-GATE-OUTSIDE), and web fetch and search in slices and the root (M-GATE-NOWEB; Codex web_search disabled there). The third refusal in a session reports outside_access.
    - "Imports: a file the student drags into the chat (its path in the prompt) is copied into <folder>/materials/ within limits: at most 5 per prompt, 20 MB each, 200 MB per folder, common document, data and image types only. reach import <path> does the same from the student's own terminal and is refused to the agent. materials/ is never submitted or scanned into the course record."
  pace: Writes in a slice are refused (M-GATE-NOT-CURRENT) when it is not the current assignment or its due time has passed by Teach's clock (W-PACE-1). extracurricular/ is outside the time gate.
  coaching:
    - reach next gives the student's next step from local state (sign in, choose modules, plan, answer your part, build, submit, wait for the result, review, done).
    - Every prompt in a slice or the root gets a short anchor in the agent's context naming the current step and the next one.
  support:
    - reach support prints a fixed message beginning "If this is an emergency, call 911 now.", then 988 and the course's support line, and raises a wellbeing hand to the instructors (no code, no conversation text), at most once an hour; it works signed out and offline (queued).
    - Since 0.19.2 the wellbeing bundle's space is outside when reach support runs outside every rEach folder (never null), and a hand Teach refuses is dropped from the outbox, sent to Teach as a fault event, and never reported to the student as told or queued (STD-WELLBEING-DELIVERED).
    - The prompt hook matches a fixed list of crisis phrases before sign-in, answers with the same message, queues the hand, and sends it at once through a detached quick flush (W-SUP-3); in a signed-in session it tells the agent to run reach support.
  limits: >-
    reach sync enforces the policy limits: the corpus spool still waiting for admission is measured against the 50 MB
    cap and reported (spool lines are never rewritten, since admission depends on them), and nothing else is pruned. reach doctor reports the sizes (R-DOC-LIMITS).
hand_raising:
  command: reach hand raise [--type student_request] [--summary ...] [--slice ...] [--include-profile]
  types: >-
    Since 0.19.0 (STD-HAND-TYPES, W-HAND-TYPES) Reach::Hands::TYPES lists attempt_gate, attempt_ladder, check_gate,
    wellbeing, late_work, late_submission and the thirteen agent-chosen types (Reach::Hands::AGENT_TYPES:
    student_request, concept_question, assignment_question, deadline_question, grade_question, submission_question,
    technical_issue, setup_issue, access_issue, extension_request, feedback, integrity_question, other). --type (the
    reach_raise_hand tool's type; trigger remains an alias) names one; an unknown type is refused with
    M-HAND-TYPE-UNKNOWN before any network call. The fourteen types newer than the previous wire revision go out as
    themselves only when the cached status's wire_contract_sha256 equals the digest of this Reach's own specs/wire.yml
    (Reach::Debug.teach_kinds?); otherwise Reach sends student_request with the summary prefixed "[<type>] " (cut to 2000
    bytes), in the wire body and in the bundle.
  late: >-
    Since 0.19.0 reach hand late --assignment A [--type late_submission] is the detached worker of STD-LATE-WORK:
    Reach::LateWork.send_hand raises the hand (originator agent, the bundle from the existing builder, summary
    M-LATE-HAND-WORK or M-LATE-HAND-SUBMISSION) once per assignment and type, kept in state late-hands.json.
  bundle: >-
    reach.hand/v2 (W-PKG-6-v2): originator (student or agent), trigger, course, assignment, cutout and slice, the task,
    the attempt history, every owned file and scenario file in full, the last qualification's output (up to 64 KB), the
    agent's summary, the student's last request, the environment and the contract and suite versions, fitted to 192
    KiB. Never files outside the owned paths and qualify folders. The ladder raises its own hand with originator agent. The student's profile is added only with --include-profile, after the student
    agreed to share it.
  transport: Encrypted to Teach's key and signed like a submission; uploaded with an idempotency key.
  student_notice: The agent tells the student that a hand was raised and what was sent.
  outcomes: >-
    Since 0.14.4 a hand Teach refuses (hand-raises disabled, or another non-retryable refusal) is reported with
    M-HAND-REFUSED naming Teach's reason, from both reach hand raise (non-zero exit) and reach_raise_hand (an error
    result); a hand that could not reach Teach is saved to the outbox and reported with M-HAND-QUEUED (queued true).
  replies: >-
    Polled every 60 seconds while a hand is open, and on every reach status; delivered to the agent through the
    MCP bridge and shown to the student; a suggested patch is applied only with the student's agreement and only
    to owned files.
mcp_bridge:
  command: reach mcp (stdio)
  subscription: >-
    Since 0.22.0 serving starts one daemon thread that spawns a detached reach subscribe tick --source session about every
    60 seconds (STD-TEACH-SUBSCRIBE, subscription); it never writes to stdout or stderr and never blocks a tool call.
  missing_arguments: >-
    Since 0.32.2 a tools/call that leaves out an argument the tool requires is answered with JSON-RPC error -32602
    naming the tool and the argument, and records no fault. Before it the agent got M-REACH-HICCUP-TOOL and Teach
    received a KeyError fault.
  tools:
  - name: reach_status
    description: The student's enrollment, current assignment, slices, package versions and outstanding receipts
  - name: reach_receipts
    description: Receipts newest first
  - name: reach_shape_check
    description: Shape findings for the current slice, classified invisible or visible
  - name: reach_qualify
    description: Qualify the current slice, list its tag and graded names, or run locally only
  - name: reach_attempts
    description: Show the attempt ladder or record the student's yes to continue
  - name: reach_submit
    description: >-
      Submit the current slice and wait for the ingest receipt; it asks the student through Reach first and submits only
      on their yes. Since 0.19.0 archive true (with an optional assignment) saves the ZIP of an already submitted
      assignment to Downloads again instead
  - name: reach_raise_hand
    description: >-
      Raise a hand with a summary. Since 0.19.0 it takes type (an enum of the agent-chosen request types, default
      student_request; trigger remains an alias) and refuses an unknown one before any network call
  - name: reach_hand_status
    description: A hand's state and reply
  - name: reach_hello
    description: The greeting to use now and the session context (profile state, course, next step)
  - name: reach_profile_show
    description: The student's saved profile
  - name: reach_profile_save
    description: Save profile fields and the interview status (partial or complete); works where the harness's shell is sandboxed
  - name: reach_profile_forget
    description: Delete the student's profile
  - name: reach_enroll
    description: >-
      Since 0.16.0 it never enrolls: it answers with M-GATE-NOENROLL, because the student's code, username and
      student ID go to rEach's own enrollment flow and never through the agent. Since 0.16.20 it takes no teach_url
      argument, so no agent has a reason to ask for one. While Reach is locked every other tool
      refuses with the lock's message too (W-ENR-6).
  - name: reach_sync
    description: Fetch new packages, verify them and refresh workspaces
  - name: reach_check
    description: Run reach check on the current slice (optionally one changed path) and return the findings
  - name: reach_checkpoint
    description: save, list, show or restore a checkpoint of the current slice
  - name: reach_plan
    description: save, note or show the slice plan
  - name: reach_directive
    description: The full text of one directive by opcode
  - name: reach_reference
    description: list, show, search or list the links of the course reference material
  - name: reach_support
    description: The fixed crisis message (911, 988, the course's support line) to relay word for word; raises the wellbeing hand like reach support
  - name: reach_part
    description: List the student's own-part questions, or record one from the student's latest typed prompt (never text the agent supplies)
  - name: reach_transfer_request
    description: Ask Reach to request a module move; returns Reach's own question until the student's captured yes, then sends it to Teach
  - name: reach_modules
    description: Show the student's modules or options, or choose them; returns Reach's lock-in question until the student's captured yes
  - name: reach_next
    description: The deterministic next step for the student, in business terms; since 0.34.9 (STD-SIGNIN-HOOK-SILENT) it says M-NEXT-LOGIN-NO-HOOK instead of asking for the student ID when Codex is not running rEach's sign-in hook
  - name: reach_remember
    description: Keep one durable finding about the student or their work (category, claim, evidence, optional supersedes and, since 0.18.0, origin import:JOB/CONVERSATION); returns saved, reinforced or held
  - name: reach_recall
    description: What rEach remembers; the profile when query is absent, the matching findings when it is given
  - name: reach_memory_forget
    description: Forget findings by id, or everything with all true
  - name: reach_grade
    description: >-
      Since 0.19.0 (STD-GRADE-VIEW), the points Teach has recorded for the student per assignment and in total, or the
      plain message that grades are not available yet, or the last answer with its as_of when Teach cannot be reached
  - name: reach_debug
    description: >-
      Since 0.21.8 (STD-CODEX-SANDBOX), debug mode through the bridge: action on (optional minutes), off or status, with
      the same messages as reach debug; works before enrollment like reach debug. Since 0.35.0 (STD-SETUP-LOG) action
      export saves a setup report to Downloads (M-SETUP-REPORT-MANUAL), and while not enrolled every tool result carries
      M-SETUP-REPORT-SAVED once after an automatic report
  - name: reach_doctor
    description: >-
      Since 0.21.8 (STD-CODEX-SANDBOX), the reach doctor health check through the bridge, which Codex runs outside its
      sandbox; works before enrollment like reach doctor
  - name: reach_known_issues
    description: >-
      Since 0.21.9 (STD-KNOWN-ISSUES), the known issues from Teach that match this computer's operating system, harness
      and Reach version, each with its symptom, whether its detector fires and the steps for this system and harness;
      works before enrollment. Since 0.31.0 (STD-CODEX-SETUP): each entry carries remedy, null or the tool call that
      fixes it, and the text names that call (M-KNOWN-ISSUE-REMEDY)
  - name: reach_setup
    description: >-
      Since 0.31.0 (STD-CODEX-SETUP), sets Codex up so rEach's commands work in its sandbox: action status (the default)
      answers text, satisfied, mode_wanted and the last probe; probe runs the sandboxed probe and answers text,
      network, home_writable and available; configure (optional mode workspace or full) answers rEach's own question
      with relay_verbatim true, or the outcome text; works before enrollment
  - name: reach_announcements
    description: >-
      Since 0.30.0 (STD-ANNOUNCEMENTS), the announcements the instructors sent this student, newest first, each with its
      sent time, title and text
  - name: reach_storage
    description: >-
      Since 0.18.0, how much space rEach's memory uses (action status, the default), or compact the saved course memory
      (action compact); compact returns Reach's own question until the student's captured yes, then starts the background
      job
  - name: reach_import
    description: >-
      Since 0.18.0, bring a downloaded ChatGPT, Claude or Gemini export into rEach. Action pick opens the operating
      system's picker, export (path, mode brain or copy) returns Reach's own question until the student's captured yes
      and then starts the background job, status, cancel and list show or stop it, next and done work the findings
      queue, search and show read the imported conversations (show needs the copy mode)
  excluded: Nothing that reveals package contents, the vault, keys, graded steps or fixture values.
  authentication: The bridge signs its Teach requests with the install key; the harness never sees the key.
cli:
  command: reach
  subcommands:
  - name: hello
    synopsis: reach hello [--harness ID] [--format hook|text|json]
    purpose: >-
      rEach's greeting and session context - the first-run introduction when there is no profile, a welcome back
      otherwise; never blocks and always exits 0
  - name: guide
    synopsis: reach guide [--path] [--format text|json]
    purpose: >-
      Since 0.16.13, print the text of rEach's Installation and Setup Guide (docs/INSTALLATION-AND-SETUP-GUIDE.docx,
      the de-identified student handout), or with --path only where the file is; works while Reach is locked. Until
      the student is enrolled, reach hello's locked context (M-ENR-AGENT-GUIDE) and Hermes's locked prompt context
      (M-ENR-HERMES-GUIDE) tell the agent to run it every session and to walk the student through the guide's
      "Approvals and other extra steps" for their app when the student's messages reach it while Reach is locked,
      which means the enrollment hook is not running (in Codex, rEach's hooks are untrusted). INSTALL.md has the
      installing agent use it for setup's host steps. It exits 1 with M-GUIDE-MISSING or M-GUIDE-DAMAGED when the
      file is absent or unreadable.
  - name: version
    synopsis: reach version | reach --version | reach -V
    purpose: Since 0.18.1, prints reach <VERSION> and exits 0; it works before enrollment
  - name: update
    synopsis: reach update status|check|run [--apply] [--background] [--format text|json]
    purpose: >-
      status shows the update manifest; check looks for newer releases and tags (the newest of both, since 0.16.14) and records them; run
      checks, downloads and stages the newest release and, with --apply, installs it through the release's own
      update/apply.rb, resuming an interrupted update first. Hooks call it with --background.
  - name: codex
    synopsis: reach codex status|probe [--format text|json] | configure [--mode workspace|full] | off
    purpose: >-
      Since 0.31.0 (STD-CODEX-SETUP), works before enrollment as an unlocked command. status prints the doctor's codex
      line (JSON: CodexSetup.status); probe runs the sandboxed probe; configure asks the student on a terminal and
      applies on their yes, or without a terminal returns rEach's question for the agent (consent kind codex_setup);
      off records the withdrawal, stops the reapply and changes nothing in Codex's file. The hidden probe-child is what
      the probe runs inside the sandbox. Exit 0 when the action did what it says or nothing was needed, 1 otherwise.
  - name: subscribe
    synopsis: reach subscribe status [--format text|json] | tick --source session|background | install | uninstall
    purpose: >-
      Since 0.22.0 (STD-TEACH-SUBSCRIBE), works before enrollment as an unlocked command. status shows the settings,
      whether the background job is installed and where, the last and next check, the last sync, failures and
      unsupported_until; tick makes one check of W-API-REVISION and syncs only when something changed; install and
      uninstall manage the operating system job.
  - name: setup
    synopsis: reach setup [--harness auto|claude-code|codex|antigravity] [--source <link or path>]
    purpose: >-
      Install rEach into the detected harnesses through their own install commands, ending with the NEXT block the
      installing agent reads to the student. It exits 1 and prints no installed text or greeting when nothing was
      installed, including the manual branches taken when a harness CLI is missing.
  - name: start
    synopsis: reach start [--harness ID]
    purpose: Open the chosen harness in the current folder with rEach speaking first (no course gate)
  - name: remember
    synopsis: reach remember --category C --claim TEXT --evidence TEXT [--supersedes ID] [--format text|json]
    purpose: >-
      Since 0.16.15, keep one durable finding the agent learned (category preference, goal, decision, struggle, skill,
      project, fact or thought). A near-duplicate (cosine at least brain.duplicate within the category) only
      reinforces the existing finding; a spent per-hour or per-day budget holds it; a claim or evidence that looks
      like a password, key, token or a student ID is refused. A held or reinforced remember exits 0 so the agent's
      loop is not broken. Refused while Reach is locked.
  - name: memory
    synopsis: >-
      reach memory [list [--category C] [--limit N] | show ID | forget ID... | forget --all --yes | export]
      [--format text|json]
    purpose: >-
      Since 0.16.15, show what rEach remembers, and forget it. Forgetting writes a tombstone line and scrubs the
      finding (and the superseded findings it replaced, and note sources only it used) from Reach's spool; forget
      --all also scrubs every captured prompt source. Refused while Reach is locked.
  - name: import
    synopsis: >-
      reach import <path> | reach import export PATH --mode brain|copy | pick [--folder] | status | cancel | list |
      next | done CONVERSATION [--part N] | search QUERY | show CONVERSATION [--part N] [--job ID] [--format text|json]
    purpose: >-
      reach import <path> (unchanged) copies one dropped file into the workspace materials folder. Since 0.18.0
      (STD-EXPORT-IMPORT) its subcommands bring in an export of another AI system: export validates and detects the
      vendor, asks the student through Reach (M-IMPORT-ASK-BRAIN or M-IMPORT-ASK-COPY) and on the yes starts the
      detached job; pick prints the path chosen in the operating system's own picker or answers
      M-IMPORT-PICKER-UNAVAILABLE; status, cancel and list report on or stop jobs; next prints the next queued
      conversation (at most import.next_max_bytes) and done advances the queue; search and show read the catalog and,
      in copy mode, the saved conversations. run --job ID is the worker the job and the next prompt start. Refused
      while Reach is locked.
  - name: storage
    synopsis: reach storage [status | measure | compact] [--format text|json]
    purpose: >-
      Since 0.18.0 (STD-STORAGE-GATES), status prints the last measure of the corpus and the microbrain together, the
      thresholds and the compaction job; measure is the detached worker hello starts; compact asks the student through
      Reach (M-STORAGE-COMPACT-ASK) and, on the yes, starts the detached compaction worker. The worker refuses to run
      unless that yes has just started it. Refused while Reach is locked.
  - name: profile
    synopsis: reach profile show|save|forget
    purpose: Show, save (field by field, status partial or complete) or delete the student's interview profile
  - name: attempts settle
    synopsis: reach attempts settle [--slice <cutout>-<slice>]
    purpose: Called by the Stop hook; records whether the turn resolved its findings, for the attempt gate
  - name: hook
    synopsis: reach hook stop [--final] --harness H
    purpose: >-
      The Stop and SessionEnd hooks: flush debug events, show the Teach link notice and the debug block. Never blocks
      and always exits 0. reach transcript turn, code, flush and status remain as hidden aliases for hook files written
      by older versions: turn runs reach hook stop, the others do nothing and exit 0 (STD-TRANSCRIPT)
  - name: enroll
    synopsis: reach enroll [--course-passkey PASSKEY --username USER --student-id ID [--password-stdin] | <code>]
    purpose: >-
      The course server is config.yml teach.url (https://sven-f1l1.tail062fd2.ts.net since 0.16.19, the course's Teach behind Tailscale
      Funnel); the student is never asked for it. Since 0.16.20 --teach-url is an unlisted operator override (the
      smokes use it), as is REACH_TEACH_URL; without a configured URL enroll says to run reach update.
      Since 0.18.2 reach setup and update/apply.rb write teach.url to ~/.reach/state/teach.json, read after
      REACH_TEACH_URL and config.yml, so an install with a missing or broken config.yml still knows Teach.
      Since 0.21.11 Reach::Runtime::TEACH_URL (https://sven-f1l1.tail062fd2.ts.net) is the built-in last resort after
      that file. A network failure prints M-ENR-CLI-OFFLINE, which names the URL and the cause, and exits 1.
      Since 0.21.13 enrollment requests leave the Teach connection state alone (STD-TEACH-LINK), so that message is
      the only line a failed terminal enroll prints.
      Since 0.18.1 the student-facing name is course passkey: --course-passkey, with --course-code kept as an unlisted
      alias. Since 0.16.0, with --course-code (or with no arguments on a terminal, asking for the three values one per line)
      it previews the course code, enrolls with shape v2 (W-API-ENROLL), verifies and stores the enrollment stamp and
      fingerprint, prints M-ENROLL-DONE and M-FINGERPRINT-NOTICE, then syncs; a bare <code>
      enrolls with shape v1 as before. Generate keys, enroll with Teach, then sync. It verifies the response fields and
      minimum_reach_version before writing any key. Since 0.29.1 a wire_contract_sha256 that differs from Reach's own
      digest does not refuse the enrollment (W-COMPAT-2): Reach stores the digest Teach advertised, reach doctor reports
      R-DOC-WIRE, and the newer wire features stay off until the digests match. Since 0.10.0 the old spelling reach enrol still works as a hidden
      alias (not listed in help), and Reach posts to /api/v1/enroll, retrying once at /api/v1/enrol on a 404 so an
      older Teach still enrolls it.
  - name: sync
    synopsis: reach sync
    purpose: Fetch new packages, verify them and refresh workspaces
  - name: status
    synopsis: reach status
    purpose: Enrollment, slices, package versions, each slice's qualification (checks), receipts, open hands
  - name: work
    synopsis: reach work [--harness ...] [--slice ... | --extracurricular]
    purpose: >-
      Open a slice (or, with --extracurricular, the student's extracurricular folder) in the chosen harness, through
      the gate, with rEach speaking first
  - name: gate
    synopsis: reach gate session|prompt|write|shell
    purpose: Called by harness hooks
  - name: shape check
    synopsis: reach shape check [--changed <path>] [--format text|agent|json]
    purpose: Run the shape checker
  - name: qualify
    synopsis: reach qualify [--slice ...] [--list] [--local-only] [--task ...] [--summary ...] [--format text|json]
    purpose: Prove the slice before submission (qualification)
  - name: attempts
    synopsis: reach attempts show|continue [--slice ...]
    purpose: The attempt ladder; continue records the student's yes after the third failed qualification
  - name: submit
    synopsis: reach submit [--slice ...] | archive [--assignment A]
    purpose: >-
      Ask the student, then submit and wait for the receipt; archive (since 0.19.0) saves the Downloads ZIP of a
      submitted assignment again
  - name: receipts
    synopsis: reach receipts [wait|show]
    purpose: Receipts
  - name: hand
    synopsis: reach hand raise [--type T] | status | list | late --assignment A [--type late_submission]
    purpose: Hand-raises; --type names one of the request types (STD-HAND-TYPES) and late is the detached late-work worker
  - name: grade
    synopsis: reach grade [--format text|json]
    purpose: >-
      Since 0.19.0 (STD-GRADE-VIEW), asks Teach for the student's recorded points (W-API-GRADES) and prints them per
      assignment with the total, M-GRADES-UNAVAILABLE when Teach has none, answers 404 or grades_disabled, or
      M-GRADES-OFFLINE (or the last answer with its as_of) when Teach cannot be reached
  - name: watch
    synopsis: reach watch
    purpose: A polling file watcher that runs the shape check on change (the Codex backstop)
  - name: check
    synopsis: reach check [--changed <path>] [--format text|agent|json]
    purpose: >-
      The one checker: ruby -wc, the Ruby 2.6 floor, one-class shape, comments, test code, purity, granted ports,
      fuse boundaries and Dovetail panel rules; each finding carries a rule id, file, line, message, fix and its
      invisible or visible class. The PostToolUse hooks call it with --changed; submit runs it first.
  - name: checkpoint
    synopsis: reach checkpoint save [--note <text>] | list | show <n> | restore <n>
    purpose: Snapshots of the slice's owned files under ~/.reach/checkpoints; no git in the workspace
  - name: plan
    synopsis: reach plan save --behaviour ... [--input ...] [--output ...] [--steps a|b] ... | note --progress ... [--next ...] | show
    purpose: The slice plan at <workspace>/.reach/plan.yml, read back at every session start
  - name: directive
    synopsis: reach directive <OPCODE> | --list
    purpose: The full text of one directive, public from directives/ or course-private from the vault
  - name: doctor
    synopsis: reach doctor [--install-chromium] | reach doctor --report [--offline] [--format json]
    purpose: >-
      Checks Ruby, gems, Chromium, harness configuration, keys, packages and connectivity, one line per problem
      with its fix. With --report it prints every diagnostic fact instead (STD-CRYPTO-FALLBACK): Ruby, SSL library,
      kit, environment, crypto self-tests under every Ruby it finds, and each package opened stage by stage, never a
      secret
    checks: >-
      R-DOC-RUBY, R-DOC-SHIM, R-DOC-HARNESS, R-DOC-ENROLL, R-DOC-KEYS, R-DOC-GUARD, R-DOC-WS, R-DOC-CHROME, R-DOC-GEMS,
      R-DOC-NET (reachable, and clocks within five minutes), R-DOC-OUTBOX, R-DOC-OUTDATED, R-DOC-WIRE (Teach's
      advertised contract digest matches Reach's), R-DOC-VERSION (every manifest carries VERSION), R-DOC-PERSONA (the
      skill and agent bodies match and quote the first-run greeting), R-DOC-DIRECTIVES (every public directive file
      parses and fits the table), R-DOC-TASTE (the vendored design-taste-frontend skill is the official one),
      R-DOC-SEAL (the sidecar is readable). R-DOC-SDK and R-DOC-LINKS are gone, since rplugin is optional.
  - name: lock
    synopsis: reach lock
    purpose: Wipe the decrypted vault (it is rebuilt from packages on demand)
  - name: instructor
    synopsis: reach instructor keygen [--out PATH] | code [--label TEXT] [--key PATH] | status [--format text|json] | lock | dummy [--course ID] | as USERNAME [--course ID] | diagnose [--course ID] | exit
    purpose: >-
      Since 0.16.17, instructor unlock (STD-INSTRUCTOR-UNLOCK), and it runs while Reach is locked. keygen writes a new
      RSA 3072 private key (0600, parent directory 0700, never overwriting) and prints its key id and the YAML entry for
      enrollment.instructor_keys, never the key. code prints one RINS1 code signed with the key, and refuses with
      M-INSTRUCTOR-KEY-UNPINNED when config.yml does not pin the key. status says whether the unlock is on, with the code
      id, label, key id and time, never the code, and names the active persona. lock exits an active persona and moves
      instructor.json to a .backup sibling. Since 0.16.23 (STD-INSTRUCTOR-PERSONA), dummy starts a blank test student and
      as USERNAME a test copy of that roster student (W-API-ENROLL-INSTRUCTOR; --course is needed when Teach has not
      exactly one open course), and exit moves the persona's pointer, home and workspace to .backup. All need the
      instructor unlock (M-PERSONA-NEEDS-UNLOCK), except exit, which also runs when a persona is active and its code was
      revoked. Errors map to M-PERSONA-CODE-REFUSED, M-PERSONA-COURSE-NEEDED, M-PERSONA-NO-STUDENT and
      M-PERSONA-TEACH-OLD; a revoked or unpinned code locks the persona at the next prompt (M-PERSONA-LOCKED).
  - name: debug
    synopsis: reach debug on [--for MINUTES] | off | status [--format text|json] | show [--last N] [--format ascii|markdown|json] | flush | export [--format text|json]
    phrase: >-
      Since 0.20.1 a prompt that is only "enable debug mode", "turn debug on", "turn debug off" or a close variant (an
      optional please, trailing punctuation) switches debug mode from the prompt hook, before any enrollment or lock check,
      and the agent relays M-DEBUG-SAID-ON or M-DEBUG-SAID-OFF word for word (M-DEBUG-RELAY); a sentence that only mentions
      debug changes nothing. Since 0.35.0 (STD-SETUP-LOG) the plugin-level enrollment hook (reach gate enroll) takes the
      same phrases before the enrollment flow sees the prompt, except at a password step: the reply is M-DEBUG-RELAY with
      the current enrollment question after it, and the phrase is never an enrollment answer. While debug mode is on, the session event also carries Reach::OsInfo.snapshot: OS family,
      name, version and build, kernel, arch, WSL, container, virtualization, CPU, memory, disk, uptime, load, locale,
      timezone, shell, terminal, desktop, session type, ssh, and Ruby, git, node and Chrome versions; never a hostname,
      username, path or address. Cached for 24 hours; every probe is bounded to 2 seconds.
    purpose: >-
      Since 0.16.23 (STD-DEBUG-MODE), and it runs while Reach is locked. on turns local debug mode on, for MINUTES minutes or until off; off turns the local switch off (an instructor's remote request or an active persona still keeps it on, and the command says so). status prints whether it is on, the reason (persona, local or remote), the end time and the spool counts. show prints the latest events as an ASCII table, a Markdown table or JSON, by default the form the detected surface renders. flush sends the spool through W-API-DEBUG now. At the end of every turn, while debug is on, the Stop hook shows the turn's events as a hook systemMessage (never agent context) on Claude Code and Codex; Hermes has no user-visible hook output, so reach debug show is its way. Outside course folders, where only the plugin-level hooks run, the next prompt shows the pending events. A remote request on a real student prints M-DEBUG-NOTICE once per session. Since 0.35.0 (STD-SETUP-LOG) export writes reach-setup-report-<time>.json to the Downloads folder, enrolled or not, and prints its path and file:// link (M-SETUP-REPORT-MANUAL; json prints path, link and bytes; a failed write prints M-SETUP-REPORT-FAILED and exits 1), and status adds the setup log (active, streak, files, bytes; json key setup_log).
  - name: mcp
    synopsis: reach mcp
    purpose: The stdio MCP bridge
  - name: reference
    synopsis: reach reference list | show <path> | search <words> | links | ingest [--force]
    purpose: >-
      Read the encrypted course reference: list its files, show one, search for files holding every word, or list its
      links. Blobs are decrypted in memory for these verbs; before enrollment, or when Teach sent no key, it exits
      nonzero with the connect-to-course hint, and a blob that fails authentication is refused. Since 0.17.1 ingest
      spools the delivered course corpus into the microbrain when it changed, or always with --force, and prints
      M-COURSE-INGESTED; it exits 0 for ingested, unchanged and none, and 1 for disabled and failed.
subscription:
  standard: STD-TEACH-SUBSCRIBE
  since: 0.22.0
  wire: W-API-REVISION, W-SAFE-14
  summary: >-
    Reach polls Teach's signed W-API-REVISION probe and runs one reach sync only when a part changed. A student's
    computer is behind NAT and Teach cannot hold a connection per student, so this is polling from two places: the
    MCP server while a harness session runs and a user-level operating system job.
  module: Reach::Subscribe (lib/reach/subscribe.rb)
  state: >-
    <home>/state/subscribe.json (0600, written under state/subscribe.state.lock): revision, parts, checked_at,
    next_due_at, failures, unsupported_until, last_sync_at, notices and job. state/subscribe.lock holds one tick at a
    time (non-blocking); state/sync.lock is Reach::Sync.run's exclusive lock.
  settings: >-
    config.yml subscribe: {background: true, session_interval_s: 60, background_interval_s: 900}. REACH_OFFLINE=1 and
    REACH_SUBSCRIBE=0 make every entry point a no-op.
  tick: >-
    reach subscribe tick --source session|background returns at once when a kill switch is set, when no install is
    enrolled or the install is revoked, when another tick holds the lock, when the last check was under 50 s ago, and
    when unsupported_until or a backoff's next_due_at is ahead. Otherwise one GET /api/v1/revision (normal mode, one
    attempt, If-None-Match with the stored quoted revision). 304 or an unchanged revision: record checked_at. A new
    revision: Reach::Sync.run in this process (non-blocking sync lock), then store revision and parts, append one
    notice per changed part and reset failures; a held sync lock or a raising sync keeps the old revision and parts.
    404: unsupported_until = now + 21600. 403 revoked or not_enrolled: mark revoked and uninstall the job. Any other
    failure: failures += 1 and next_due_at = now + min(60 * 2^(failures-1), 3600).
  sync_lock: >-
    Reach::Sync.run holds state/sync.lock for its whole run, waiting up to 120 seconds for interactive callers (reach
    sync, reach_sync, persona) and not at all for a tick. Hooks never call Reach::Sync.run, so STD-HOOK-RESPONSIVE is
    unchanged.
  session_polling: >-
    reach mcp starts one daemon thread that sleeps session_interval_s plus 0-15 s, spawns the tick through
    Reach::Storage.spawn_detached when Reach::Subscribe.due? (a file read) says so, and repeats until the server exits.
    It rescues everything and writes nothing to stdout or stderr.
  background_job: >-
    Reach::Subscribe.install!, uninstall! and installed? manage one idempotent job running <ruby> <shim> subscribe tick
    --source background every background_interval_s. Linux: reach-subscribe.service and reach-subscribe.timer in
    ~/.config/systemd/user (REACH_SYSTEMD_USER_DIR overrides the folder and suppresses every systemctl call), enabled
    with systemctl --user enable --now; with no usable systemctl --user nothing is installed (before 0.32.2 the check
    for it could not run, so no Linux job was ever installed). macOS:
    ~/Library/LaunchAgents/reach.subscribe.plist loaded with launchctl bootstrap gui/<uid> or launchctl load -w.
    Windows: schtasks task rEach\Update check for the current user, run through rubyw.exe or, when absent, wscript.exe
    on ~/.reach/bin/reach-subscribe.vbs. Every operating system call times out at 10 s and never prompts; a failure is
    recorded in subscribe.json and Reach::Debug.fault.
  ensure: >-
    Reach::Subscribe.ensure! does nothing while a kill switch is set (REACH_OFFLINE=1 or REACH_SUBSCRIBE=0 pause checks
    but never remove the job), and otherwise installs the job when the install is enrolled and not revoked and settings
    background is true, and uninstalls it when not. It runs from the detached reach hello --background, from a
    detached reach subscribe ensure after enrollment and after reach update applies a release, never in a hook.
  notices: >-
    status course_update, grades grade, hands hand_reply, extra_credit extra_credit, receipts receipt; known_issues adds
    none. Since 0.33.6 a hands change whose new replies all carry answered_by service-desk or teach-issues is stored as
    support_message ("technical support sent a message about a problem you reported") instead of hand_reply, and every
    entry of the sync summary's hand_replies names from as technical_support or instructor. They are stored unannounced and deduplicated by kind; the prompt hook reads them and adds M-SUBSCRIBE-UPDATES
    once, then marks them announced; a notice older than 7 days is dropped.
  cli: >-
    reach subscribe status [--format text|json], tick --source session|background, install, uninstall (and ensure, the
    detached entry). subscribe is an unlocked command. reach doctor prints R-DOC-SUBSCRIBE, informational only.
client_safety:
  applies_to: Every call from Reach to Teach.
  version_header: Since 0.21.0 every signed request carries X-Reach-Version (W-AUTH-7, STD-VERSION-REPORT), set in Reach::Client#sign! beside the X-Teach-* headers.
  timeouts:
    connect_s: 5
    read_s: 30
    upload_read_s: 120
  limiter: >-
    A token bucket at 20 requests per minute, below Teach's 30 per install, kept in ~/.reach/state/bucket.json under
    an exclusive file lock so every Reach process (hooks, the MCP bridge, the CLI) shares one budget.
  quick_mode: >-
    Calls made while a harness waits (reach hello's status refresh, doctor's health check) use 2-second timeouts, no
    retries and at most half a second of limiter wait, and fall back to the cache.
  retries: >-
    At most 4 for idempotent requests, exponential backoff with full jitter (1 s base, 30 s cap), Retry-After honoured;
    4xx other than 408, 425 and 429 never retried.
  circuit_breaker: >-
    Five consecutive failures open the breaker for 60 seconds; the gate then uses its offline allowance and submissions
    stay in the outbox.
  polling: >-
    Receipts and hand replies are polled no more often than every 30 seconds, and only while something is outstanding.
  kill_switch: REACH_OFFLINE=1 stops all network calls (for exams or debugging); the gate's offline allowance still
    applies.
  enrollment: >-
    Since 0.16.0 (W-SAFE-13) the plugin-level enrollment prompt hook is the one hook that calls Teach: at most one
    W-API-ENROLL-PREVIEW per typed code and one W-API-ENROLL per yes, connect 5 s, read 10 s, no retries, and none
    while the local enrollment lockout (5 refusals in 15 minutes) lasts. It runs only while Reach is locked.
  observability: >-
    Reach logs every request with route, status, latency and retry count (never bodies or keys) and reports counts
    in its status call.
course_reference:
  location: >-
    ~/.reach/vault/guardrails/reference/, unpacked from the guardrails package's reference/<name>.rref entries (wire
    protocol 1 revision 2026-10-01a); REACH_REFERENCE_DIR overrides it.
  repository: >-
    Since 0.14.5 the Reach repository carries no course material, encrypted or not. Teach keeps the blobs and their
    keys and ships them to each enrolled install. Since Teach 0.18.2 an install receives only its own course's blobs
    and keys, every release unit, from enrollment on.
  blob_format: >-
    RREF version 1: the magic RREF, a format version byte, a length-prefixed key id, a length-prefixed course id, a
    12-byte nonce, a 16-byte AES-256-GCM tag and the ciphertext, with the header authenticated as additional data.
    The plaintext is gzip-compressed JSON of schema reach.reference/v1 holding files (path, title, media_type, text)
    and links. Limits: 20 MiB per blob, 64 MiB plaintext, 2000 files, media types text/markdown and text/plain.
  key_source: >-
    reference-keys.json (schema reach.reference-keys/v1) in the guardrails package, delivered by Teach at enrollment
    and kept in the vault. Wire protocol 1 revision 2026-09-28f made it an optional W-PKG-1 entry.
  handling: >-
    Decrypted in memory for list, show, search and links. Since 0.17.1 the one plaintext copy is the microbrain's
    private tier (STD-COURSE-CORPUS): Reach::CourseCorpus spools each file as a source under course/<course>/<path>
    into the brain spool (0600) and the detached sync admits it into ~/.corpora/reach. No plaintext is written to the
    rEach folder, a workspace, a log or Teach. Without a key the blob is reported as locked; a blob that fails
    authentication is refused.
  ingest_state: >-
    ~/.reach/brain/course-ingest.json: the fingerprint (sha256 over blob names and digests and held key ids), the path
    to source id map of the last ingest, and course and file counts.
  interfaces: reach reference list|show|search|links|ingest and the reach_reference MCP tool.
remote_acceptance: >-
  Every slice is graded at Teach. Since 0.11.0 no graded suite reaches the student and reach tips is gone; the
  qualification's remote step is the only place the hidden scenarios run before grading, and reach doctor checks gems
  only for slices whose qualify kit runs locally.
  shape_findings: >-
    Since 0.14.6 reach check, reach shape check and reach status report shape findings only for the workspace's owned
    files (or findings with no file): Teach ships no suite package, so the instructors' panel files are absent from the
    workspace and the checker's findings on them cannot be acted on.
runtime_kit_platforms: >-
  The runtime workflow (since the runtime-4.0.7-r2 build; r2 never published, Reach 0.16.4 pins runtime-4.0.7-r3) builds
  the Linux kits in a manylinux_2_28 container from Ruby's own source,
  with OpenSSL, libyaml, libffi and zlib linked in, so they need glibc 2.28 or newer (Debian 10+, Ubuntu 20.04+, RHEL
  and Alma 8+); runtime/relocate_check.rb fails a kit that needs a newer glibc. Chrome for Testing still needs the
  system's graphics and NSS libraries; when they are missing, reach runtime install names them. When the checking
  tools fail to install without the kit, the error carries bundler's own reason and points at reach runtime install.
  On Windows the install checks the Chrome version from the <version>.manifest file Chrome for Testing ships beside
  chrome.exe, because chrome.exe --version opens a browser there and never exits (since 0.16.7).
runtime_kit_auto: >-
  Since 0.16.5 the student is never asked about the runtime kit. reach hello (the session-start hook) starts reach
  runtime install --auto in a detached process when no kit is active or the active kit is not the pinned RUNTIME_ID
  (since 0.16.10; before it a student with an older kit kept it forever), the platform has a kit, the kit is pinned,
  config.yml runtime.auto_install is not false and neither REACH_RUNTIME_DISABLE=1 nor REACH_OFFLINE=1 is set.
  The older kit keeps serving local qualification until the new one is placed and runtime/current names it, and it
  stays on disk afterwards, so a run already using it is never pulled out from under; reach runtime remove --old
  does not remove it.
  Attempts are recorded in ~/.reach/state/runtime-auto.json per pinned RUNTIME_ID: one starts at most once per
  runtime.interval_s (3600) plus a random 0 to runtime.jitter_s (600), at most runtime.max_attempts (5) per pinned kit,
  and the count resets after a success or a new pin. Nothing starts when that state file cannot be written, which is
  the case for an agent shell inside a sandbox. Every install path (the background run, reach runtime install, reach
  setup --runtime, reach doctor --install-chromium) takes ~/.reach/state/runtime-install.lock without waiting; the
  background run skips when it is held and the others are refused with a message. reach setup reports that the kit
  installs itself and offers reach runtime install only when runtime.auto_install is false. A local qualify without a
  kit says the checking tools are still installing while the lock is held. Verified 2026-10-01 on Linux x86_64 in a
  scratch home (the r3 kit installed in about 22 s) and inside codex sandbox (nothing started); macOS and Windows are
  unverified.
ruby_bootstrap: >-
  Since 0.20.7 (STD-RUBY-BOOTSTRAP) rEach no longer needs a Ruby already installed. hooks/hooks.json and .mcp.json run
  sh "${CLAUDE_PLUGIN_ROOT}/exe/reach-run" ARGS (Claude Code runs plugin hooks through Git Bash on Windows, with the
  plugin root in forward-slash form). exe/reach-run picks, in order, REACH_RUBY, the Ruby on PATH when it is 2.6.10 or
  newer, then the active kit's ruby (runtime/current, .complete present), and execs exe/reach with it. With none it
  starts one detached bootstrap (a mkdir lock at ~/.reach/state/bootstrap.lock, stale after 15 minutes): it downloads
  the platform's kit bundle named in exe/runtime-pins from the pinned runtime release with curl (or wget), checks size
  and sha256 (sha256sum, shasum -a 256 or openssl), extracts runtime/ with tar into a staging folder, smoke-runs ruby -v
  and places it as ~/.reach/runtime/<RUNTIME_ID> with a .complete marker naming the ruby component only, then writes
  runtime/current. A hook (hello, gate) answers at once while that runs: SessionStart and UserPromptSubmit get
  hookSpecificOutput additionalContext M-BOOTSTRAP-WAIT and exit 0; other hook verbs exit 0 silently. reach-run mcp
  waits up to 120 s, then exits 1 with one plain line on stderr. Any other command waits for the install with a
  progress line. Platforms are the runtime kit's five; Windows ARM64 uses windows-x86_64 under emulation; anything else
  (musl Linux, 32-bit) gets a plain message naming how to install Ruby. REACH_RUNTIME_DISABLE=1 or REACH_OFFLINE=1 stops
  the download and says so. Once a ruby-only kit is active, runtime auto-install adds Chrome in place (only chrome),
  never replacing the Ruby a running hook uses. scripts/reach-install.ps1 is the PowerShell twin for INSTALL.md on a
  Windows computer with no Ruby: Invoke-WebRequest or curl.exe, Get-FileHash, tar.exe, the same placement, then
  [Environment]::SetEnvironmentVariable('Path', ..., 'User') prepending the kit's ruby bin, then it runs the existing
  reach-install with that Ruby. exe/runtime-pins is generated by tools/runtime_pins.rb --write from the manifest whose
  sha256 RuntimeKit pins; tools/runtime_pins.rb --check fails when they disagree, and the runtime release steps in
  runtime/README.md run it. hooks/codex.json keeps calling ruby, which the Windows PATH step and macOS's system Ruby
  provide.
corpus:
  port: >-
    Every record is first one rcorpus.spool/v1 line (tier private) in <rplugin state>/reach/brain-spool/<UTC
    date>.jsonl, mode 0600, written with the standard library on any Ruby. When rplugin and rcorpus load (Ruby 3.3+ or
    the runtime kit), Reach opens its owned corpus through Reach.ports.corpus.open("reach") and runs
    Rcorpus::Spool#admit after each write; a refusal or error goes to ~/.reach/logs/brain.jsonl and is never raised.
    recent reads corpus.kv.list plus unadmitted spool lines, or the spool alone without the corpus. Ids are
    receipt:<id>, qualification:<id> and note|tip|attempt:<uuid>; a receipt's own kind is kept as receipt_kind.
    ~/.reach/corpus-fallback/*.jsonl from earlier versions is migrated into the spool once.
  kinds_file: specs/kinds.yml
  kinds:
    source: "One captured student prompt (prompts/<date>/<session>-<digest>.private.md) or note (notes/<date>/<uuid>.private.md), at most 16384 bytes; since 0.16.15."
    finding: One durable thing the partner learned about the student or their work, grounded on a source; since 0.16.15.
    note: The agent's working notes about the slice (what was tried, what the student prefers).
    tip: Tips delivered by the suite or the instructors, so the agent does not repeat mistakes across sessions.
    attempt: Fix attempts per finding (kept for older records; the ladder counts qualifications).
    qualification: Each qualification record.
    receipt: A copy of each receipt.
  brain:
    since: 0.16.15
    capture: >-
      The prompt hook (reach gate prompt) calls Reach::Brain.capture_prompt for every gate-allowed prompt in any folder
      (a slice, the root, extracurricular or outside every course folder); a prompt the gate blocked never reaches it.
      It composes a Student line and appends one op source line (tier private; id source-<24 hex of sha256(path,
      newline, source_digest)>), kept only on the computer and never sent. A prompt matching the secret pattern or
      containing the student's own ID, shorter than brain.capture_min_chars (default 1), a repeated digest (last 500) or
      one over a spent brain.sources_per_hour is skipped and logged without text. The AI's replies are not ingested,
      and no conversation file is read.
    findings: >-
      The host agent distils; Reach::Brain.remember grounds the finding on the session's last source captured within
      30 minutes, else on a note source holding the evidence. The source line is always spooled first. Finding id is
      finding-<24 hex of sha256(category, newline, normalized claim)>; salience 0.7 for preference, goal and decision,
      else 0.5; supersedes appends a tombstone for the old id. Novelty and budget keys are in config.yml brain and
      mirrored in specs/kinds.yml.
    nudge: >-
      Every brain.nudge_every_turns captured turns the next prompt context adds M-BRAIN-DISTILL; a nudge followed by no
      saved finding doubles the interval up to brain.nudge_max_turns, and a saved finding resets it.
    recall: >-
      The session start adds M-BRAIN-CONTEXT and, when findings exist, the profile within brain.session_budget_bytes;
      each prompt adds the BM25 hits whose score is at least brain.prompt_min_score (default 0.2) of the ideal score, the sum of the idf of the prompt terms that occur anywhere in memory, within brain.prompt_budget_bytes, not
      repeating ids from the session's last 10 injections. Hooks (session start and every prompt) are always
      lexical, through Reach::BrainIndex, to stay inside the 150 ms budget. An explicit recall with a query (the
      reach_recall tool) is fused through Rcorpus::Context#render when rplugin and the encoder are present, and falls
      back to the index on any error. Sources are spooled with op source and findings with op finding (not put), so
      admission builds the content file, graph nodes, supports edge and embedding.
    admission: >-
      Spool admission runs at most once per brain.admit_interval_s; a failure doubles the wait up to
      brain.admit_max_backoff_s. After a successful admit, once a day, Rcorpus::Consolidate runs when defined.
    erasure: >-
      The one exception to the append-only spool: Reach::BrainSpool.scrub! rewrites each day file (pending and
      admitted/) without the put and source lines of the forgotten ids, through a mode 0600 temporary file, fsync
      and rename under the same file lock writers take. Tombstone lines (an id and a reason) stay so a later
      admission carries the forget to the corpus. Text already admitted into a corpus plane is not erased by Reach.
    config: >-
      config.yml brain: enabled, capture_min_chars, sources_per_hour, duplicate, related, per_hour, per_day,
      max_record_bytes, nudge_every_turns, nudge_max_turns, session_budget_bytes, prompt_budget_bytes, prompt_k,
      prompt_min_score, admit_interval_s, admit_max_backoff_s, max_spool_bytes (20 MiB), and since 0.17.1 course_recall
      (true), course_k (3), course_budget_bytes (600), course_min_score (0.2); a missing or invalid value falls back to its default.
    spool_cap: >-
      After a capture appends a source, at most once per 10 minutes (state.json), the total spool size (pending and
      admitted day files) is compared with brain.max_spool_bytes. Over it, the oldest source lines no active finding
      references are scrubbed (Reach::BrainSpool.scrub!) until the total is at or below 80% of the cap; finding,
      tombstone and every other kind of line are never removed. Since 0.17.1 course sources (path course/) are never
      victims and their bytes are left out of the comparison, so a large course never sets spool_full. If it is still over the cap, new source captures are
      skipped (brain.source_held, reason spool_full) while findings are still accepted.
    events: >-
      ~/.reach/logs/brain.jsonl: brain.captured, brain.source_held, brain.pruned, brain.remembered, brain.recalled, brain.nudged,
      brain.forgotten, brain.admit_failed, and since 0.17.1 brain.course_ingested, brain.course_ingest_failed and
      brain.course_recalled; ids, counts, bytes and outcomes only, never claim, evidence, turn or course text.
    state: "~/.reach/brain/ (mode 0700) holds state.json (budgets, reinforcements, admit backoff, notice flag), sessions/<session>.json and index.json (a cache)."
  privacy: >-
    The corpus lives on the student's disk only; nothing in it is sent to Teach except what a hand-raise bundle
    explicitly includes.
  degradation: Without rplugin and rcorpus, records stay in the spool until a run that can load them admits them.
installer:
  public_zip: >-
    scripts/reach-install installs from the repository's public ZIP with no Git and no login. It reads the ZIP with a
    pure-Ruby reader, materialises symlinks safely, backs up an existing install before replacing it, and downloads
    the Dovetail archive pinned in dovetail-revision.txt (Dovetail is also a git submodule at dovetail). It enforces
    size and count limits and bounded retries, and REACH_INSTALL_KILL_SWITCH stops it. Verified only against a local
    GitHub-shaped ZIP; the real public download and the Windows path are unverified.
  from_a_link: >-
    The student pastes the repository link into their agent (Claude Code, Cowork, Codex or Antigravity) and asks it
    to install rEach. The agent reads INSTALL.md, which tells it to run the harness's own plugin install, or (since
    0.16.5) one command that downloads scripts/reach-install, installs ~/.reach/plugin and runs exe/reach setup, asked to
    run outside the sandbox from the start so a sandboxing app asks the student once; setup ends with the NEXT block, which the agent reads
    to the student word for word ("rEach is installed and ready." and the greeting). In the Claude app and Codex app
    the student adds the link as a plugin marketplace in the app's plugin settings instead.
  public_repository: >-
    Installing from a link needs the repository to be public (GitHub or public Bitbucket); a private repository
    needs the student's own git credentials.
  macos: >-
    The built-in /usr/bin/ruby (2.6.10) runs Reach; no Ruby install is needed.
  windows: >-
    A PowerShell installer that installs the pinned RubyInstaller build per user (no administrator rights), then
    the same steps.
  linux: >-
    A shell installer that uses the distribution's Ruby when it is in range, otherwise installs the pinned Ruby
    per user.
  chromium: >-
    reach doctor offers to download a pinned Chromium into ~/.reach/chromium when no browser is found, verified
    by sha256.
  uninstall: >-
    The harness's own plugin removal (or rplugin uninstall reach) removes the plugin; reach profile forget, reach
    lock and removing ~/.reach remove the student's data after the course.
auto_update:
  summary: >-
    Since 0.13.0 Reach keeps the install at ~/.reach/plugin current by itself. It looks for newer releases when a
    session starts and once an hour while the student works, downloads a newer one in the background, and installs
    it at the next session start through scripts the release itself carries. The student is told calmly and is never
    interrupted mid-work; course work waits only while an install is actually running.
  managed_install: >-
    Only ~/.reach/plugin (Reach::Paths.home + /plugin) is managed, and only when it holds a VERSION file and no .git
    entry. A git checkout, a missing install (Cowork, a harness that installed straight from the repository link) or
    REACH_UPDATE_DISABLE=1 leaves Reach notify-only or silent: it never writes over a developer's tree. The local
    version is that install's VERSION, not the version of whichever harness copy is running.
  sources:
    order: >-
      Since 0.16.14 every check lists both GitHub releases and tags and takes the newest version from either; a version
      present in both is recorded with source releases. A failed tag listing is tolerated when releases answered;
      when neither answers, the check fails and backs off. Before 0.16.14 tags were read only when releases were
      unavailable or listed no version, so a newer tag after any version release was never offered.
    releases: >-
      GET https://api.github.com/repos/<owner>/<repo>/releases?per_page=30 with Accept application/vnd.github+json and
      If-None-Match from the stored ETag (a 304 does not count against GitHub's 60 per hour unauthenticated limit).
      Drafts and prereleases are skipped; tag_name must parse as v?X.Y.Z. A 403/429 or a network failure counts as no
      releases, and the tags still decide.
    tags: >-
      GET https://github.com/<owner>/<repo>.git/info/refs?service=git-upload-pack (git's own smart-HTTP ref
      advertisement, no git binary and no API limit). refs/tags/v?X.Y.Z entries are versions; peeled ^{} lines are
      ignored.
    archive: >-
      https://github.com/<owner>/<repo>/archive/refs/tags/<tag>.zip, read with scripts/reach-install's own ZIP reader and
      completed with the Dovetail archive pinned in the release's dovetail-revision.txt. The unpacked VERSION must
      equal the tag's version or the stage is refused.
    repository: >-
      config.yml updates.repository (default https://github.com/SteveBenner/rEach), overridable by
      REACH_UPDATE_REPOSITORY. Only https URLs are accepted.
  cadence: >-
    A check runs at session start (reach hello) when the last one is older than updates.interval_s (default 3600)
    and from the prompt gate once that interval has passed, plus a jitter of up to 600 s per install so a class
    behind one address does not poll in step. Every check runs in a detached process; no hook waits on the network.
    After consecutive failures the next check is pushed back exponentially (interval x 2^failures, capped at 86400 s).
  manifest:
    file: ~/.reach/state/update.json (0600, written to a tmp file then renamed)
    fields: >-
      schema reach.update/v1, local_version, remote_versions (every remote version ahead of local, ascending, with
      tag and source), source (releases|tags), target_version, target_tag, phase, staged_path, backup_path,
      started_at, updated_at, attempts, last_check_at, next_check_at, failures, last_error, etag, harness_results,
      announced (which session ids were told what), completed_version, completed_at
    phases: idle -> detected -> downloaded -> staged -> swapped -> refreshed -> completed
    resume: >-
      Every phase is safe to repeat. Any reach start that finds a phase other than idle or completed and no live
      update lock resumes from the last phase recorded: detected re-downloads, downloaded re-stages, staged re-runs the
      release's update/apply.rb, swapped re-runs it with --resume (which skips the swap and finishes the refresh and
      migrations). If ~/.reach/plugin is missing, the shim completes the swap from staged_path or restores
      backup_path before loading Reach. Attempts are counted; after 5 failed attempts at one target the manifest
      keeps the error and waits for the next newer release or a manual reach update run.
    lock: ~/.reach/state/update.lock holds the pid and a heartbeat; a lock older than 900 s or whose pid is gone is stale.
  release_scripts: >-
    The old Reach only finds, downloads and stages a release; the release installs itself. It runs
    ruby <staged>/update/apply.rb --staged DIR --destination ~/.reach/plugin --manifest FILE --from X --to Y
    [--resume]. apply.rb (Ruby 2.6-safe, standard library only) moves the current install to
    ~/.reach/.backup/plugin-<timestamp>, moves the staged tree in, runs every update/migrations/<version>.rb with
    from < version <= to in version order, rewrites the shim root to the new install, refreshes the harness copies
    (Claude Code: claude plugin marketplace update reach, then claude plugin update reach@reach --scope user; Codex:
    codex plugin marketplace upgrade reach, then codex plugin add reach@reach; Hermes and Antigravity link to the
    install and need nothing), records each harness result, and writes phase completed. A harness CLI that is absent
    or refuses is recorded and does not fail the update.
  student_experience:
    session_start: >-
      When an update is ready or under way, the greeting starts with G-UPDATING and the install runs in the
      background; the next prompt after it completes carries M-UPDATE-DONE for the agent to pass on.
    mid_session: >-
      A release found mid-session is downloaded and staged in the background; the agent is told once, after its
      current answer, to give the student M-UPDATE-READY. Nothing is swapped mid-session.
    hold: >-
      While an install is actually running (a live update lock in phase staged or swapped), the prompt gate and the
      write and shell gates refuse with M-UPDATE-INSTALLING, and reach qualify, submit and sync refuse the same way.
      If an install cannot finish (offline, GitHub down) the student keeps working, is told M-UPDATE-RETRY once, and
      Reach retries; Teach's minimum_reach_version stays the only hard lock.
  foreground_check: >-
    Since 0.20.5 reach update run checks GitHub whether or not the hourly check is due and whether or not a terminal is
    attached, so an agent's reach update run --apply sees a release published since the last check. The detached run
    Reach spawns at session start passes --scheduled and checks only when due. REACH_OFFLINE=1 and REACH_UPDATE_DISABLE=1
    still stop the check.
  shim_non_downgrade: >-
    Reach::Runtime.ensure_shim! rewrites ~/.reach/bin/root only when the recorded root is missing or its VERSION is not
    newer than the running copy, so a stale harness copy cannot point the shim back at older code.
  kill_switches: REACH_UPDATE_DISABLE=1 (no checks, no installs), REACH_OFFLINE=1 (no checks), REACH_INSTALL_KILL_SWITCH=1 (no downloads)
  limits: >-
    connect timeout 10 s, read timeout 30 s for listings and 60 s for archives, at most 3 attempts per request with
    full-jitter exponential backoff from 1 s, Retry-After honoured up to 300 s, archives capped at 100 MiB by the
    installer's reader.
  log: ~/.reach/logs/update.log (one JSON line per check, stage, apply and failure)
  untagged_patches: Only tagged releases reach students; an untagged patch version is never offered.
privacy_and_integrity:
  student_data_sent: >-
    Enrollment (code, public key, platform, versions; since 0.16.0 also the course code, the institutional username
    and student ID, and the W-ENR-4 fingerprint, whose computer, account and hostname values are salted SHA-256
    hashes), the live fingerprint digest on every status request, submissions (owned files and manifest), hand bundles, status
    counts, own-part answers, and since 0.25.0 the recorded conversation of signed-in assignment work: prompts, replies,
    reasoning, actions and assignment code (STD-TRANSCRIPT). Nothing else.
  never_sent: >-
    Every conversation outside signed-in assignment work (before sign-in, in the extracurricular folder, outside the
    course folders), files outside the course folders, the corpus, the microbrain, and the interview
    profile file (except inside a hand bundle the student agreed to add it to).
  provider_note: >-
    What the student types to rEach goes to their AI provider, as any chat does; Reach records and sends the
    conversation only for signed-in assignment work (STD-TRANSCRIPT). Reach keeps the profile file and the microbrain on this computer and never sends them to
    Teach. rEach's greeting says so ("What I save about you stays on this computer").
  integrity: Reach cannot make a student's work pass; it can only show them early what the official grading will
    check.
workspace_layout:
  purpose: >-
    One folder for everything a student does with their AI partner in a course, split so assignment code and the
    student's own code never mix: deliverables/ holds every slice workspace, extracurricular/ holds anything else the
    student wants to write.
  spaces:
    slice: >-
      ~/reach-work/deliverables/<course>/<assignment>/<cutout>-<slice>/, provisioned by reach sync from the workspace
      package (slice_workspace). The only place assignment code is written: the slice's owned files.
    extracurricular: ~/reach-work/extracurricular/ (extracurricular, below).
    root: >-
      ~/reach-work itself, deliverables/ and any directory between deliverables/ and a slice. Rules files and harness
      settings are written there so a session opened at the top is covered by the same rules, but every write is refused (M-WRITE-ROOT)
      and the rules point at deliverables/ and extracurricular/.
  space_of_a_path: >-
    Reach::Workspace.space_for(path): inside a slice workspace (a .reach/ marker) is that slice; inside
    extracurricular/ is extracurricular; the root, deliverables/ and directories between are root; anything else is no
    space, and rEach's rules do not apply there.
  migration: >-
    Since 0.10.0 slice workspaces live under deliverables/. Every sync, before provisioning, moves a slice workspace
    still at the old place (~/reach-work/<course>/<assignment>/<cutout>-<slice>/) to the same path under deliverables/
    when that path is free (a rename, logged as workspace_moved), leaves it where it is otherwise, and never deletes
    anything. A harness open in the old folder keeps its files; the student reopens it with reach work.
extracurricular:
  purpose: >-
    A student who wants to write code of their own, outside any assignment, can: it goes in extracurricular/, a
    personal folder in their course workspace. It is never graded or submitted, and since 0.16.12 its files never leave
    the student's computer: nothing said there is recorded or sent either, whether or not the student is signed in.
  folder: >-
    ~/reach-work/extracurricular/, created at enrollment and at every sync, marked by .reach-space.json {"schema":
    "reach.space/v1", "kind": "extracurricular", "course"}, with read-only AGENTS.md, CLAUDE.md and GEMINI.md and the
    harness settings of the other spaces. The student's own files are never touched by Reach.
  launch: reach work --extracurricular [--harness ID] opens it through the gate, with rEach speaking first.
  gate: >-
    Any write inside extracurricular/ is allowed (symlinks resolved); a write outside it is refused with
    M-WRITE-OUTSIDE-EXTRA. Shell rules as in a slice, with "owned" meaning anything inside extracurricular/; network
    commands stay refused. Git is allowed there, since the folder is the student's own. No shape check,
    qualification, attempt ladder, plan, checkpoint or witness ledger there.
  rules: >-
    Rendered from the guardrails package's rules with scope extracurricular or everywhere (G-CODE-1, G-EXTRA-1,
    G-EXTRA-2 from Teach 0.10.0), then the public directive rows whose spaces include extracurricular (CODEFILE),
    then "Folder: <path>" and "This is
    the student's own code folder. Nothing here is graded or submitted." A package from an older Teach carries no
    extracurricular rule, so Reach renders fallback_rules instead (locales/en-US.yml extracurricular_rules).
  fallback_rules:
  - This is the student's own code folder. Nothing here is graded, submitted or shared with classmates.
  - Put code in files in this folder, never in chat. Explanations in chat stay prose.
  - >-
    Coursework does not belong here: code for an assignment goes only in that slice's owned files under
    deliverables/, and never write or move coursework into this folder.
  - >-
    Files in this folder stay on the student's computer and are never sent to the instructors. Nothing said
    in this folder is recorded or sent. Only signed-in assignment work is recorded for the instructors. Say so if the student asks.
  - Do not reach the network from here; use rEach's own commands for anything the course server provides.
transcripts:
  since: 0.25.0
  standard: STD-TRANSCRIPT
  purpose: >-
    Restored in 0.25.0 (wire revision 2026-10-03i) after the 0.21.1 teardown. Reach records the conversation while a
    student is signed in and working on an assignment, and sends it to Teach for the instructors.
  bounds: >-
    Reach::Transcript.capturing?(session) is true only when the install is enrolled and not revoked, instructor mode
    is off, the session runs in a slice workspace or the workspace root, the session is signed in when the course
    requires sign-in, and the cached status names a current assignment. Every recording entry point (capture, code,
    turn) checks it. Outside the bounds it calls pass, which only moves the harness-transcript offset to the end of
    the file. At a prompt, a session whose harness transcript Reach has not seen before starts at the end of that
    file, so nothing older than the first recorded prompt is read.
  deidentify: >-
    Since 0.26.0 (STD-TRANSCRIPT-DEIDENTIFY, W-TRN-6) Reach::Transcript.run_flush asks Reach::Deidentify.envelope for
    the install's pseudonym, the scrubber and the sealed identity index, passes every entry through
    Reach::Deidentify.entry before batching, and sends pseudonym and identity with each batch. With no
    transcripts.identity_key in the cached status the flush stops with identity_key and sends nothing. Since 0.26.1
    each entry also carries restore (Reach::Deidentify.seal_restore), so a re-identified transcript is exact.
  code_in_files: >-
    The AI partner is told to put code in files, never in chat (the public directive R-CODEFILE, Teach's G-CODE-1 and
    the persona): coursework only in the slice's owned files under deliverables/, anything else in extracurricular/.
  hooks: >-
    The prompt hook records each gate-allowed prompt. PostToolUse runs reach transcript code --harness H (AI writes).
    Stop and SessionEnd run reach hook stop [--final] --harness H, which records the turn (replies, reasoning,
    actions, the scan of owned files), sends in quick mode, then does its debug flush and notices. reach transcript
    turn is an alias of reach hook stop; reach transcript flush sends everything and reach transcript status counts.
  delivery: >-
    Entries are sent at turn end (quick: at most 3 requests, at most once every 60 s), on reach sync and before a
    submission that needs the student's own part, through the shared client (limiter, bounded retries, timeouts).
    A Teach that answers 403 or 404 stops the sending and Reach keeps every entry.
  stream: >-
    Since 0.32.0 (STD-TRANSCRIPT-STREAM, W-TRN-7). Reach::Transcript.stream is the background sender: under
    state/transcript-stream.lock, when state/transcript-stream.json shows the last run at least send_interval_s ago
    (Reach::Transcript.send_interval_s reads transcripts.send_interval_s from the cached status, default 600, clamped
    to 60..86400), it calls ingest_open_sessions and then flush in normal mode. reach transcript stream [--force] runs
    it; Reach::Transcript.start_stream_thread (started by the MCP server) spawns it detached when due, and reach
    subscribe tick calls it after the revision check. Reach::Subscribe.settings caps background_interval_s at
    send_interval_s, so the operating system job is reinstalled at the course's interval. remember_context stores
    {capture, harness, space, workspace} in the session state at every recording hook; TranscriptIngest.skip sets
    capture false and moves every offset to the end; ingest_event skips instead of reading when capture was false.
    TranscriptIngest reads tool results as output entries, keeps the last 500 tool call ids to name them, and reads
    <session>/subagents/agent-*.jsonl with one offset per file. Reach::Transcript.text_parts and split_bytes split
    text over PART_BYTES (120000) into entries with part; wire_entry sends part only when the status has
    transcripts.parts, and sendable? holds part entries and action summaries over 2000 bytes otherwise.
  own_part: >-
    The prompt hook keeps the latest gate-allowed prompt typed in a slice or the workspace root that has at least
    the smallest min_words of any policy question and is not a consent yes or no, in ~/.reach/state/part/pending.json
    (0600), with the session_id, seq and digest of its recorded entry, or null when it was not recorded. reach part
    record takes it (at most 30 minutes old, at least that question's min_words) and deletes the pending file
    (W-PART-2); Teach checks the answer against the recorded entry (W-PART-3).
  ladder: >-
    Only the time of the student's last slice prompt is kept, in ~/.reach/state/ladder/<slice>.prompt.json; hand bundles
    carry student_last_request null (W-QUAL-6, W-PKG-6).
  consent: >-
    Consent reads the live prompt in memory, with seq null (W-CONSENT-1).
  limits: >-
    reach sync keeps the spool under the course's transcript_spool_max_bytes (default 209715200) by archiving fully
    acknowledged sessions to ~/.reach/transcripts/archive as .jsonl.gz.
  disclosure: >-
    No in-session notice. docs/student-guide.md, PRIVACY.md and the persona's answer when a student asks what is
    shared state what is recorded and when.
debug_mode:
  since: 0.16.23
  standard: STD-DEBUG-MODE
  wire: W-API-DEBUG, W-API-STATUS classification and debug, W-DBG-EVENT, W-DBG-KINDS, W-DBG-SCRUB, W-DBG-RENDER
  switch: >-
    On while a persona is active (reason persona), else while debug/switch.json says on and its until has not passed
    (reason local, set by reach debug on or, since 0.21.8, the reach_debug tool), else while the cached status.debug.requested is true and its until has not
    passed (reason remote).
  files: >-
    <home>/debug/ (0700): spool.jsonl, state.json, switch.json, sent-<date>.jsonl, rejected-<date>.jsonl and two lock
    files, all 0600. <home> is the persona's home while a persona is active. Nothing is created while debug is off,
    except that since 0.16.25 fault and link events (W-DBG-FAULT, STD-TEACH-LINK) are spooled with reason fault, sent
    through W-API-DEBUG, and the connection state is kept in <home>/link.json (0600) beside its link.lock.
  emit_points: >-
    session (hello), hook and gate (every reach gate command and the Stop and SessionEnd hooks, with message ids and
    latency), command (every reach command except reach debug: command and flag names, exit, duration_ms, error class),
    request (Reach::Client: path template, method, status, error, request_id, attempt, latency_ms, bytes), lock (a
    change of EnrollmentLock.state), sync, check, qualify, submit, brain,
    update and error (rescue sites that already log, 12 backtrace frames relative to the plugin root).
  field_names: >-
    No emitted field name contains code, password, secret, token, key, signature, pem or passphrase, because Reach drops
    such a field and Teach refuses a batch that carries one; the command event says exit and error, the request event
    says status and error.
  scrub: >-
    Field names are dropped by /code|password|secret|token|key|signature|pem|passphrase/i; strings lose RINS1 codes, PEM
    blocks, course-code-shaped values and values matching the config enrollment username and student ID patterns
    ([scrubbed]), are cut to 1024 bytes, and an event keeps at most 64 fields and 32 array items.
  sending: >-
    Reach::Debug.flush runs from the Stop hook (quick client, at most 2 batches, 60 seconds of backoff after a failure),
    the SessionEnd hook, reach sync and reach debug flush; batches hold at most debug.batch_max_events events and 900000
    bytes, grouped by session, harness, surface and reason.
  surface_detection: >-
    Claude Code: CLAUDE_CODE_ENTRYPOINT cli, sdk-cli, sdk-ts, sdk-py, mcp and bench are tui; claude-desktop,
    claude-desktop-3p, claude-vscode, claude-in-teams, local-agent and remote values are gui, as is any value naming a
    desktop, IDE or JetBrains host and any run with CLAUDE_CODE_DESKTOP_APP_VERSION set. Codex: gui when CODEX_DESKTOP_APP
    or a CODEX_IDE_* variable is set, else tui. Hermes and anything unknown: tui.
setup_log:
  since: 0.35.0
  standard: STD-SETUP-LOG (specs/app.yml)
  library: lib/reach/setup_log.rb (Reach::SetupLog); fed by Reach::Debug, Reach::Messages.text, Reach::CLI and the MCP bridge
  files: >-
    <home>/setup-log/ (0700): log-<date>.jsonl, install-<stamp>.jsonl (written by scripts/reach-install and
    reach-install.ps1), state.json {streak, failures, last_success_at, env_at, offer} and lock, all 0600. Separate from
    <home>/debug/, where nothing is created while debug mode is off.
  config: >-
    config.yml setup_log (optional): enabled true, threshold 3, max_bytes 20971520, report_max_bytes 8388608,
    string_max_bytes 65536, env_every_s 600. REACH_SETUP_LOG=0 turns it off.
  typed_text: >-
    Never recorded. Fields named prompt, user_message, message_text, text, answer, username, email, student_id,
    first_name, last_name, full_name, display_name, name, passkey or code keep only {typed, length, lines}; fields the
    debug scrub drops by name are [redacted]; strings lose PEM blocks, RINS1 codes, course-code-shaped values and
    values matching the enrollment username and student ID patterns. Messages are recorded by id and parameter names,
    never their rendered text.
  report: >-
    reach-setup-report-<YYYYMMDD-HHMMSS>.json in Reach::Archive.downloads_dir (setup-log/reports when Downloads cannot
    be written), schema reach.setup-report/v1: created_at, reason (streak or manual), reach_version, streak,
    recent_failures, environment, installer, log (oldest-first, trimmed from the oldest end, log_trimmed), debug_events,
    issues. Written without asking at each multiple of the threshold; never sent by Reach.
progress_checkpoints:
  standard: STD-PROGRESS (specs/app.yml); wire W-API-PROGRESS, revision 2026-10-03h. Since 0.24.0.
  library: >-
    lib/reach/progress.rb (Reach::Progress: mark, enrolled!, assignment_started, flush!). Called from
    Reach::EnrollFlow (step_code, step_confirm, register), the reach enroll command, Reach::Login.commit! and
    Reach::Gate.prompt; Reach::Sync.run calls flush! after the outbox retry.
  checkpoints: enroll.code, enroll.identity, setup.signin, <assignment>.started
  state: state/progress.json {student_id, reached {id => time}, sent [ids]}
  off_switch: REACH_PROGRESS=0
issue_reports:
  standard: STD-ISSUES (specs/app.yml); wire W-ISSUE-1 to W-ISSUE-8, revision 2026-10-03c. Since 0.23.0.
  library: >-
    lib/reach/issues.rb (Reach::Issues: signature, classify, observe, flush!, notice!, record_status, list) and
    lib/reach/capsule.rb (Reach::Capsule.build). Reach::Debug.fault adds fault_id to every fault event and calls
    Reach::Issues.observe, which never raises.
  state: >-
    <home>/state/issues.json (0600, written by rename under issues.lock): {version, day: {date, raised, suppressed},
    issues: {<signature>: {count, first_at, last_at, window, blocking, reach_version, pending, hand_ref, hand_id,
    raised_at, raised_version, sent_at, told, silent, fix_version, issue_state, told_fixed}}}.
  rules: >-
    Fixed table, no model: transport faults and the issue code's own faults are ignored; a fault on enrollment,
    sign-in, hello, sync, qualify or submit is raised at once; any other at the third occurrence in 24 hours; once per
    signature per Reach version, 3 a day, 10 waiting. config.yml issues {enabled, repeat_threshold, window_h,
    max_per_day, max_queued}; the course policy's limits.issues only tightens; REACH_ISSUES_DISABLE=1 turns it off.
  delivery: >-
    A detached reach issues flush --background seals reach.issue/v1 with the hand seal and posts it to W-API-HAND
    with trigger issue and originator reach, only when Teach's wire digest equals Reach's. Unsent entries stay in
    the outbox (kind hand, issue <signature>, attempts, next_at) and are retried from the Stop hook, reach sync and
    reach issues flush with full-jitter backoff (60 s doubling, 6 h cap); a manual flush ignores the wait.
  told: >-
    M-ISSUE-REPORTED once after an issue is due and M-ISSUE-FIXED once when the hand status names a fix_version the
    install has reached, as a systemMessage on Claude Code and Codex hooks, in the prompt context on Hermes and on
    stderr from a terminal command. Never for a seal, ledger or integrity fault.
  commands: reach issues [list] (persona or debug mode only), reach issues flush [--background].
  doctor: R-DOC-ISSUES while an issue report waits in the outbox.
live_sessions:
  standard: STD-LIVE (specs/app.yml); wire W-LIVE-1 to W-LIVE-9 and W-API-LIVE routes, revision 2026-10-03f. Since 0.23.0.
  runner_start: >-
    Since 0.33.2 the runner and every other detached reach process start with Reach::Runtime.detach_group
    (new_pgroup on Windows, pgroup elsewhere). A request made while an answer is still queued returns M-LIVE-SENDING
    and starts the runner; it does not ask the student again.
  diagnosis: >-
    STD-LIVE-DIAGNOSIS, wire W-LIVE-10, revision 2026-10-04c, since 0.27.0. Reach::Live.diagnose! (reach instructor
    diagnose, reach_live action diagnose) needs a valid instructor unlock on the install, starts a blank test
    student when the install is not enrolled, and asks one question (M-LIVE-DIAG-ASK, consent live_session with
    subject {"live": "diagnosis"}). On the yes the runner posts the request with the stored code and Teach opens the
    session at once. While a session with diagnosis true is open, send! posts at once with no live_send question and
    a requested action from the fixed table is run with no live_action question.
  library: >-
    lib/reach/live.rb (Reach::Live: ask!, diagnose!, follow_up!, prompt_notices, status, send!, wait, end!, run!, note_status).
    Reach::Consent hands the kinds live_session, live_action and live_send to it; Reach::Gate adds its notices to the
    prompt context; Reach::Sync passes the status answer's live field to note_status.
  state: >-
    <home>/state/live/ (0600): state.json (the session, pending request or consent, actions waiting for the student,
    the one staged outgoing message, what the student was told), inbox.jsonl (messages from the instructor's side),
    state.lock and runner.lock. <home>/state/bucket-live.json is the runner's own token bucket (30 a minute).
  rules: >-
    A session is asked for or accepted only after the student's typed yes (consent live_session, sent to Teach). An
    instructor-requested action runs only after the student's typed yes for that action (consent live_action, kept
    local), within 30 minutes; otherwise the answer is ok false with a fixed sentence. A note or agent message is
    sent only after the student saw its exact text and typed yes (consent live_send over the text's SHA-256, kept
    local); one waits at a time. Agent messages only in a co_debug session. Actions are a fixed table:
    doctor (reach doctor --report), status, sync, update_check (reach update check), update (reach update run),
    cache_repair (Reach::CodexCache.repair), resend (reach issues flush and reach debug flush), and since 0.31.0
    (wire revision 2026-10-04h, STD-CODEX-SETUP) codex_configure (Reach::CodexSetup.apply! with via live, in process)
    and sandbox_probe (Reach::CodexSetup.probe!, in process). 60 s and 16000 bytes per action, 2000 bytes per message.
  runner: >-
    reach live run --background, detached, one per install (runner.lock): sends the pending request or consent,
    polls W-API-LIVE-POLL every 3 s while open and 10 s while waiting, runs approved actions, sends approved
    messages, flushes debug events every 10 s, and exits when the session closes, after five failures in a row or
    after 4 hours.
  told: >-
    M-LIVE-ASK and M-LIVE-OFFER-ASK (the session), M-LIVE-ACTION-ASK (each action), M-LIVE-SEND-ASK and
    M-LIVE-SEND-ASK-AGENT (each message), M-LIVE-OPEN-AGENT or M-LIVE-OPEN-AGENT-CODEBUG with the rules once when
    the session opens, M-LIVE-UNREAD while messages wait, M-LIVE-CLOSED once when it ends.
  wake: >-
    reach live watch, written into Claude Code's Stop hook as a second entry (async, asyncRewake, timeout 900) only
    when claude --version answers 2.1.288 or newer (Reach::Harness.claude_wake?). Reach::Live.watch! takes the watch
    token in state.json (the newest watcher wins), looks once a second for at most 840 s, and exits 2 with the
    notices on stderr, or 0 with nothing. Reach::Desktop.notify shows M-LIVE-NOTIFY when a message arrives in an
    open session, at most once every 20 s.
  blocked: >-
    Reach::Gate.prompt calls Reach::Live.blocked_prompt for a prompt it blocks (a GateBlocked, or a sign-in decision
    marked stuck: locked out, refused, or the sign-in step failed) and adds its text under the block text.
    Reach::Consent.observe_blocked captures yes or no for the live kinds only, without a confirmed sign-in, and
    writes gate blocked into the answered record. The words live session ask M-LIVE-ASK; end live session queues a
    pending end the runner posts to W-API-LIVE-END. Notices take the student form (the question itself,
    M-LIVE-OPEN-STUDENT, M-LIVE-NOTE-STUDENT for each note, which marks the inbox read).
  commands: reach live [status | request [--hand ID] | wait | note TEXT | say TEXT | end | watch | run [--background]].
  tool: reach_live with action status, request, wait (up to 45 s, local inbox only), note, say or end.
  switches: REACH_LIVE_DISABLE=1, config.yml live.enabled false; live.wake, live.notify and live.blocked false turn off the watcher, the desktop notification and the blocked-prompt path.
announcements:
  standard: STD-ANNOUNCEMENTS, STD-DUE-CHANGE, STD-HOLDINGS (specs/app.yml)
  since: 0.30.0
  wire: W-API-ANNOUNCEMENTS, W-API-ANNOUNCEMENT-RECEIPTS, W-API-HOLDINGS, W-SAFE-16, revision 2026-10-04g
  summary: >-
    reach sync fetches the announcements the instructors sent this student into state/announcements.json, reports
    which course material the install holds, and notes a due time that moved. The prompt hook shows each
    announcement and each due change once and makes no network call; a detached reach announcements flush reports
    the received and shown times.
  state: state/announcements.json, state/holdings.json, state/due_changes.json (mode 0600, written atomically by Reach::StateFile)
  commands: reach announcements [list] [--format json], reach announcements flush
  tool: reach_announcements
  messages: M-ANNOUNCE-NOTICE, M-ANNOUNCE-LINE, M-ANNOUNCE-NONE, M-DUE-CHANGED
  switches: config.yml announcements.show (default true)
course_profile:
  standard: STD-COURSE-PROFILE (specs/app.yml)
  since: 0.33.0
  wire: W-POL-2, W-API-ENROLL-PREVIEW hints, revision 2026-10-04j
  summary: >-
    Reach::CourseProfile reads the profile section of the guardrails package's course.yml. It supplies the learning
    system's name and the upload rule, the enrollment hints, and the wellbeing phrases and support text. With no
    profile Reach names no learning system, asks for the school email and student ID in plain words, shows times in
    UTC when no zone is known, and keeps its built-in crisis phrases and support message.
  messages: M-LMS-UPLOAD-ZIP, M-LMS-UPLOAD-THAT, M-LMS-UPLOAD-WORK, M-LMS-RECORD, M-ENR-SCHOOL, M-ENR-EMAIL-DOMAIN
  not_read_yet: terms, slices
student_messages:
  principle: >-
    Every message a student sees is one or two plain sentences, says what happened and what to do next, and uses
    no jargon without a short explanation.
  catalogue:
  - id: M-UPDATE-INSTALLING
    text: rEach is installing an update (version {version}) that you need to keep using it. Give it a minute, then try again; your work is safe.
  - id: M-UPDATE-READY
    text: A rEach update (version {version}) is ready. It installs the next time you start a session, so nothing changes in the middle of your work.
  - id: M-UPDATE-DONE
    text: rEach is up to date (version {version}). Start a new session when it suits you to load everything.
  - id: M-UPDATE-RETRY
    text: rEach couldn't finish installing an update (version {version}) just now. You can keep working; it will try again on its own.
  - id: M-SUBSCRIBE-UPDATES
    text: "rEach picked up new course updates since your last message: {updates}. Tell the student in plain words if it helps their work."
  - id: M-GATE-NOENROLL
    text: rEach is locked until you enroll in your course. Type anything in a chat with your AI partner and rEach will walk you through it, or run reach enroll in a terminal.
  - id: M-GATE-NOGUARD
    text: >-
      Your course rules haven't arrived yet, so your AI partner can't start. Run reach sync, and if that doesn't
      work, tell your instructor.
  - id: M-GATE-OLDGUARD
    text: Your course rules have an update. Run reach sync to get it, then try again.
  - id: M-GATE-REVOKED
    text: This computer's Reach was switched off by your instructor. Ask them for a new enrollment code.
  - id: M-WRITE-OUTSIDE
    text: That file belongs to the course and can't be changed. Your work goes in {owned_files}.
  - id: M-WRITE-ROOT
    text: >-
      Nothing is written at the top of your course folder. Coursework goes in your slice under deliverables/, and
      anything else you want to build goes in extracurricular/.
  - id: M-WRITE-OUTSIDE-EXTRA
    text: >-
      From your extracurricular folder, only files inside it can change. Coursework goes in your slice's files under
      deliverables/.
  - id: M-SHELL-BLOCKED
    text: That command would change files outside your slice, so Reach stopped it.
  - id: M-SHAPE-VISIBLE
    text: >-
      The design you asked for would break how your panel fits with the others ({plain_reason}). Here are some ways
      to get close to it that fit.
  - id: M-HAND-RAISED
    text: >-
      Your AI partner got stuck on the same problem three times, so it asked your instructors for help. You'll see
      their answer here.
  - id: M-SUBMIT-RECEIVED
    text: Your {slice} work for {cutout} was received at {time}. Receipt {receipt_id}.
  - id: M-SUBMIT-PENDING
    text: Your submission hasn't been received yet. Reach will keep trying; keep your computer online.
  - id: M-SUBMIT-REJECTED
    text: 'Your submission wasn''t accepted: {reason}. {fix}'
  - id: M-GRADED
    text: Your {slice} work for {cutout} was graded. {passed} of {total} checks passed.
  - id: M-DEADLINE-24H
    text: "{cutout} ({slice}) is due in 24 hours and hasn't been submitted yet."
  - id: M-OFFLINE
    text: >-
      Reach can't reach the course server right now. You can keep working; submissions will be sent when you're
      back online.
  - id: M-GATE-STALE
    text: rEach hasn't been able to check in with your course for over a day. Connect to the internet and run reach sync.
  - id: M-REACH-OUTDATED
    text: >-
      This version of rEach ({version}) is too old for your course, which needs {minimum} or newer. Update rEach, then
      try again.
  - id: M-AUTH-FAILED
    text: >-
      Your course server didn't accept rEach's signature. Check that your computer's clock is right, then run reach
      sync. If it keeps happening, tell your instructor.
  - id: M-ENROLL-REFUSED
    text: That enrollment code wasn't accepted. Check it's typed correctly, or ask your instructor for a new one.
  - id: M-ENROLL-DONE
    text: You're connected to {course}. rEach is fetching your course materials now.
  - id: M-QUALIFY-NOKIT
    text: The tools that check this part haven't arrived yet. Run reach sync, and if that doesn't help, tell your instructor.
  - id: M-SUBMIT-UNQUALIFIED
    text: >-
      This part hasn't passed its checks since it last changed, so it can't be submitted yet. Your AI partner runs the
      checks first, then submits.
  - id: M-LADDER-NOTICE
    text: >-
      I'm taking another pass at this part. My last two tries didn't hold up against the checks, so I'm working through
      it again.
  - id: M-LADDER-HAND
    text: >-
      After three passes this part still isn't holding up, so I've asked your instructors to take a look. I can keep
      trying while we wait if you'd like: just say yes, and I'll carry on for up to {limit} passes in all.
  - id: M-LADDER-STOPPED
    text: >-
      I've made {limit} passes at this part without getting it right, so I'm stopping until your instructors reply.
      Nothing is lost; your work is saved as it is.
  - id: M-GATE-NOGIT
    text: >-
      rEach keeps this work's history for you with checkpoints, so that version-history command isn't used here yet.
      Save a checkpoint instead with reach checkpoint save.
  locales: >-
    en-US in v1. Course messages live in locales/en-US.yml and rEach's greetings in locales/greetings.en-US.yml, so
    both can be translated; the texts in the files are authoritative, and the ones above are the original wording.
failure_reason_catalogue:
  purpose: Turns the suite's failure categories into the plain reasons students and agents see.
  categories:
  - id: contract
    example: The result didn't have the fields your module promised (for example, a status was missing).
  - id: behaviour
    example: The result was the wrong value for this case (for example, the margin should be 35.0%).
  - id: state
    example: >-
      The panel didn't show the right state (for example, nothing appeared when storage was down; it should show
      the unavailable message).
  - id: shape
    example: The panel did something outside its space (for example, it covered other panels).
  - id: locale
    example: Numbers or dates weren't shown the way the chosen region expects.
  - id: privacy
    example: Something private was shown or sent where it shouldn't be.
  - id: resilience
    example: When a part of the system was unavailable, the panel or module stopped working instead of saying so.
  - id: not_built
    example: This part still answers "not built yet"; its code is the starting copy, or stops before it does the work.
  authoring: >-
    The instructors write a reason for each scenario's likely failures in the suite's reasons.yml; Reach picks the
    reason by the failing step's category, from the suite's reasons.yml when it names one and from its own catalogue
    otherwise. A failing step whose message names not_built is category not_built.
state_machines:
  install:
    states:
    - not_enrolled
    - enrolled
    - synced
    - active
    - offline
    - revoked
    notes: >-
      synced means all current packages verified; active means a harness session is running with the gate passing;
      offline is entered when the circuit breaker is open. Since 0.16.0 not_enrolled is also re-entered (locked) when
      the stamp fails, the course ends or the fingerprint stops matching (W-ENR-6).
  enrollment_flow:
    states:
    - awaiting_code
    - awaiting_username
    - awaiting_student_id
    - awaiting_confirm
    - awaiting_move
    - enrolled
    notes: >-
      Since 0.16.0, W-ENR-7; awaiting_move (W-ENR-8) waits for an instructor-approved device move. Stored machine-wide at ~/.reach/state/enroll/flow.json (0600) and removed on success;
      start over, restart or cancel return to awaiting_code; enrollment_refused returns to awaiting_username.
  slice_workspace:
    states:
    - absent
    - provisioned
    - in_progress
    - checked
    - submitted
    - received
    - graded
    transitions:
    - from: absent
      to: provisioned
      when: reach sync delivers a workspace package for the slice
    - from: provisioned
      to: in_progress
      when: An owned file first changes
    - from: in_progress
      to: checked
      when: reach qualify passes on the current files
    - from: checked
      to: submitted
      when: reach submit uploads
    - from: submitted
      to: received
      when: The ingest receipt verifies
    - from: received
      to: graded
      when: The grade receipt verifies
    - from: received
      to: in_progress
      when: The student changes an owned file again before the deadline
  finding:
    states:
    - open
    - fixing
    - resolved
    - escalated
    transitions:
    - from: open
      to: fixing
      when: The agent starts a fix
    - from: fixing
      to: resolved
      when: The next check no longer reports it
    - from: fixing
      to: open
      when: The check still reports it (an attempt is counted)
    - from: open
      to: escalated
      when: The third failed qualification raises the ladder hand
    - from: escalated
      to: resolved
      when: The check no longer reports it after the reply
class_day_runbook:
  before_class:
  - Instructors release the assignment's packages on Teach.
  - Students run reach sync at home or at the start of class.
  in_class:
  - reach status on the projector shows what the class should see.
  - Common problems and their one-line fixes are in reach doctor's output.
  after_class:
  - Instructors watch the hand-raise queue and the ingest receipts on Teach's dashboard.
compatibility:
  rplugin: optional; used when installed (Ruby 3.3+)
  wire_protocol: 1 (specs/wire.yml); Teach advertises minimum_reach_version and wire_contract_sha256
  dovetail: The checker version pinned by the shape package (Reach carries the matching dovetail library in its
    vault). Not built yet; until it is, Reach runs the dovetail on the PATH and reports a check that cannot run.
  teach_api: v1
  harnesses:
    claude_code: >-
      The versions whose hook events include SessionStart, UserPromptSubmit, PreToolUse, PostToolUse and Stop; reach
      doctor checks the version.
    codex: >-
      The versions with plugins, hooks (SessionStart, UserPromptSubmit, PreToolUse with apply_patch, PostToolUse,
      Stop), sandbox_workspace_write and MCP servers; reach doctor checks the version.
    antigravity: The versions reading plugins from ~/.gemini/config/plugins with skills and rules.
  ruby: 2.6.10 to 4.0.x
failure_modes:
- failure: The harness updates and changes its hook format
  behaviour: >-
    reach doctor detects the version, reach work refuses to start a course session with an unsupported harness version
    and says which versions work, and a Reach patch release adds support.
- failure: The student edits the generated harness configuration
  behaviour: reach work restores it from the guardrails before launching; the gate logs the change.
- failure: The student deletes the workspace
  behaviour: >-
    reach sync re-provisions it from the workspace package; the student's last submitted owned files are restored
    from the outbox copy when present.
- failure: Chromium is missing or too old for Ferrum
  behaviour: >-
    reach doctor offers the pinned Chromium download; a panel slice's local passes cannot run until then, and reach
    qualify goes on to the course server.
- failure: Gem installation fails offline
  behaviour: >-
    Local qualification passes are unavailable until online; checks still run, and the remote step stays pending.
security:
  keys: The install private key never leaves ~/.reach/keys; the MCP bridge signs on the harness's behalf.
  vault: >-
    Decrypted materials live only in ~/.reach/vault with 0700 permissions and are wiped by reach lock and at the
    end of the term.
  hooks: Reach's harness configuration is read-only on disk; the gate checks its digest on each session start.
  honesty: >-
    Reach's protections stop accidents and casual tampering; they are not a guarantee against a determined machine
    owner, which is why grading happens on Teach.
hook_io_contract:
  claude_code:
    input: >-
      The hook receives the event as JSON on standard input (session id, event name, and for tool events the tool
      name and tool input).
    output: >-
      Exit 0 allows; exit 2 blocks and the text on standard error is shown to the agent; other exit codes are treated
      as a gate failure and block.
    timeout: >-
      Every gate call finishes within 2 seconds; a gate that cannot decide in time blocks with M-GATE-NOGUARD's
      wording and logs a timeout.
    paths: >-
      Paths from tool input are resolved against the workspace, symlinks followed with File.realpath, and compared
      with the owned-path list after normalisation (case-insensitive on macOS and Windows).
  codex:
    input: >-
      The same JSON event on standard input as Claude Code; a file write arrives as tool_name apply_patch with the
      patch text in tool_input.command, which reach gate write reads for its target paths.
    output: Exit 0 allows; exit 2 blocks and standard error is shown to the agent.
    trust: Codex runs plugin and project hooks only after the student trusts them; setup tells the student to.
    launcher: >-
      reach work checks the gate, writes the workspace configuration and execs codex with it, so the gate holds even
      before the hooks are trusted.
    submit_time_check: >-
      Every file that differs from the delivered workspace is compared with the owned-path list; any other difference
      blocks the submission and lists the files.
  hermes:
    input: >-
      Hermes shell hooks receive {hook_event_name, tool_name, tool_input, session_id, cwd, profile, extra} as JSON on
      standard input. write_file and patch carry tool_input.path; patch in V4A mode carries the patch text in
      tool_input.patch, which reach gate write reads for its target paths; terminal carries tool_input.command.
      pre_llm_call carries the prompt in extra.user_message and the first-turn flag in extra.is_first_turn;
      post_llm_call carries the reply in extra.assistant_response; pre_verify carries extra.attempt and
      extra.changed_paths.
    output: >-
      pre_tool_call: exit 0 allows; exit 2 blocks and the first 400 characters of standard error are shown to the
      agent; hooks are fail_closed, so a crash or timeout blocks. pre_llm_call: standard output {"context": text} is
      appended to the user's message. pre_verify: standard output {"action": "continue", "message": findings} keeps the
      agent working, only when extra.attempt is 0. Every other event's output is ignored.
    trust: Hermes asks before running a new hook; reach work launches with --accept-hooks, which records nothing.
shell_rules:
  purpose: How reach gate shell decides a Bash command in Claude Code.
  parsing: >-
    The command is split on ;, &&, ||, | and newlines; each part is tokenised with Shellwords; subshells and command
    substitution ($(), backticks) are refused outright. Since 0.11.3 that test reads quotes as the shell does: nothing
    inside single quotes counts, $( and backticks still count inside double quotes, and a backslash escapes the next
    character, so grep -E '(a|b)' is not a subshell. Code handed to an interpreter inline (ruby -e, python -c, node -e/-p/
    --eval, perl -e/-E, bash/sh/zsh -c) cannot be read, so outside the extracurricular folder it is refused with
    M-GATE-NOCODETOOL, as Hermes' execute_code is; ruby -c <file> stays allowed.
  allowed_readonly:
  - ls
  - cat
  - head
  - tail
  - less
  - grep
  - rg
  - find (without -delete or -exec)
  - wc
  - diff
  - ruby -c
  - reach
  - ruby (or rubyX.Y) followed by Reach's own shim, ~/.reach/bin/reach, the form rEach's session context prints (since 0.11.3)
  write_commands:
  - cp
  - mv
  - rm
  - mkdir
  - touch
  - tee
  - sed -i
  - perl -i
  - truncate
  - chmod
  - npm
  - npx
  - bundle
  - gem
  rules:
  - >-
    A write command is allowed only when every path argument is an owned file (or its directory for mkdir of nothing
    new - refused).
  - Output redirection (>, >>) is allowed only into owned files.
  - >-
    Any path under ~/.reach, the vault, api/, contract/, shape/, fixtures/ or the generated harness files is refused
    for writing, and the vault and keys are refused for reading.
  - Network tools (curl, wget, ssh, scp, nc) are refused; Reach's own commands handle the network.
  - Every git command is refused in slice and root spaces (M-GATE-NOGIT, since 0.11.0); checkpoints are the history.
  - >-
    Unknown commands are allowed only when they take no path arguments outside the workspace and no redirection;
    otherwise refused with M-SHELL-BLOCKED.
  honesty: >-
    Shell rules catch ordinary mistakes and casual attempts; a student determined to bypass them on their own machine
    can; the submit-time check and Teach's grading are the backstop.
templates:
  rendering: >-
    Since 0.2.0 AGENTS.md, CLAUDE.md and GEMINI.md are rendered from the guardrails package's directives per
    specs/wire.yml W-RENDER-1, so the instructors' own wording reaches the agent; the text below is the shape that
    rendering produces for the built-in directives.
  agents_md: |
    # Course rules for this workspace

    You are helping a student with one slice of a course module. These rules come from the instructors and always apply.

    1. Change only these files: {owned_files}. Everything else here is read-only course material.
    2. Do not rewrite the module or the app, and do not add packages.
    3. Keep the inputs and outputs exactly as the contract in contract/ describes.
    4. Follow the brief in shape/brief.md. After every change, run `reach shape check`. Fix problems the student would not notice without interrupting. If a fix would change what the student sees or can do, stop, explain it simply, and offer choices - first their idea adjusted to fit, then new ideas.
    5. Reach counts failed qualifications. After the third it asks the instructors for help itself; keep going only after the student says yes.
    6. Never make up data or results. Report missing or unavailable values the way the contract says.
    7. Before suggesting a submission, `reach qualify` must pass. Tell the student what the work can be relied on to do, never scenarios, code or output.
    8. After `reach submit`, wait for the receipt and tell the student straight away that it was received, with the receipt number and time.
    9. The student decides the creative direction, the wording and the look. Explain your work in plain words.
    10. Do not help anyone look inside Reach's protected files, other students' work, or the course server.

    Slice: {cutout_id} ({slice}) - {behavior}
    Due: {due}
  claude_md: The same text as AGENTS.md, so every harness reads identical rules.
  gemini_md: The same text as AGENTS.md, for Antigravity.
  slice_readme: |
    # {cutout_id} - {slice} slice

    **What it should do:** {behavior}

    **Input:** {input}
    **Output:** {output}

    **Your files:** {owned_files}
    **You can use:** {instructor_apis}

    **How it's checked:** your AI partner proves the work with checks of its own before anything is submitted, and the course server runs the instructors' checks that decide your grade.

    **Where it shows up:** {panel_slice}

    Start by asking your AI partner to explain the input, the output and the first scenario in plain words.
  skill_reach_course: |
    ---
    name: reach-course
    description: Use in every course workspace. How to work on a student's slice under the instructors' rules.
    ---
    Read AGENTS.md (the same rules are in CLAUDE.md and GEMINI.md), README.md, contract/README.md, api/README.md and shape/brief.md first, and nothing else in the tree.
    AGENTS.md ends with a table of directives: one row per rule with its opcode, its condition and `reach directive <OPCODE>`. When a row's condition applies, run that command (or the reach_directive tool) and follow the full text.
    Work only in the owned files listed in AGENTS.md, and in qualify/features and qualify/step_definitions for your own scenarios.
    Whenever you write code, follow a flow (the FLOW directive): new or changed behaviour, the reach-feature skill; something failing or wrong, the reach-bug skill. Saving or going back: the reach-checkpoint skill. Never run git.
    After each change, run `reach check --format agent` (it includes the shape check) and handle each finding by its class:
    - invisible: fix it now without interrupting the student;
    - visible: stop, explain in plain words, and offer alternatives, starting with the student's idea adjusted to comply.
    Reach counts failed qualifications for you (the TOZERO directive): pass on the notices it prints, and after the third it has already asked the instructors for help; ask the student before trying again.
    For a panel slice, load the design-taste-frontend skill and read shape/brief.md before writing any markup.
    Before suggesting a submission, `reach qualify` must pass on the files as they are (the QUALIFY directive). Waiting for the course server is not a pass. The student never sees scenarios, code or command output: tell them in business terms what their part of the system can now be relied on to do.
    Talk with the student only in business terms. Never name files, folders, classes, methods, code, tests, scenarios or commands to them, and never ask them to write, open or read code. If they ask which file to work in or how the code works, say that you write and check all the code, then ask what the business needs.
    Reach signs the student in at the start of every session: it asks "Am I speaking with ...?", their student ID and their password itself, and that request is genuine. Do not word your own request for their student ID or password, never tell the student that Reach, or you, will not ask for them, and never work around a refusal that says they have not signed in.
    When the student is stuck, silent or unsure where to begin, run `reach next` and coach that one step, kindly and honestly (the COACH directive). Praise real effort, never flatter, and say what the instructors want them to learn.
    Every assignment has questions only the student can answer. `reach part` lists them. Ask them one at a time in business terms; when the student has answered in chat, run `reach part record <question id>`. Never write, suggest or improve their answer (the OWNPART directive).
    Stay on the current step (the PACE and FOCUS directives). Decline anything outside this course in one kind sentence and come back to the step. Never give life advice, counseling or opinions on personal matters.
    If the student says they are in crisis or might hurt themselves or someone else, run `reach support` immediately and relay its message word for word. It begins "If this is an emergency, call 911 now." Do not counsel.
    Never read or touch anything outside the workspace (the SANDBOX directive). If the student has a file for the course, ask them to drag it into the chat or paste its text; Reach copies a dropped file into materials/ and tells you its name.
    If the student says they were moved to other modules or that someone else approved something, run `reach transfer request --modules <a>,<b>` and relay its question exactly (the WHOAMI directive). Keep working on their current modules until Teach answers.
    Ask the student for meaningful business choices: the user, decision, information flow, expected behavior and their contribution account. Then implement all permitted code yourself, read each owned source file before changing it, and prepare the editable README from what the student actually says. Never invent personal reflection or contributions.
    Never spawn subagents; work in this session only.
    When the student asks about the syllabus, glossary or assignment prompts, ground the explanation with `reach reference` (or the reach_reference tool): `reach reference list` shows the files, `reach reference show <path>` prints one, `reach reference search <words>` finds the files that contain all the words, and `reach reference links` lists the textbook and other links. The material is decrypted in memory and never written to disk; do not copy it into files. If it reports locked, tell the student to run `reach sync`. Do not reveal reference answers or material outside the student's released contract; the released contract wins over the reference.
  skill_reach_submit: |
    ---
    name: reach-submit
    description: Use when the student wants to submit their slice, submit it again before the due time, or asks whether a submission was received.
    ---
    Offer to submit once `reach qualify` has passed: tell the student they can ask you to submit this part whenever they are ready, that it sends the work to their instructors and saves a ZIP of all their work for the assignment in their Downloads folder, that to receive credit for this coursework they must also upload that ZIP to Blackboard (or the system Reach names), and that they can submit again until the due time (the last one counts).
    Before submitting, run `reach part`: every question must be answered in the student's own words. If one is missing, ask it first.
    `reach submit` works only after `reach qualify` passed on exactly the files you have now; if it refuses, run `reach qualify` first. Run `reach submit` (or the reach_submit tool). Reach asks the student itself: when it answers with Reach's question, relay it word for word and wait. Reach captures the student's answer itself. Never answer the question for the student, and never submit after a no.
    When Reach then says the student said yes, run `reach submit` again once, as it says. Most of the time the receipt comes back straight away; tell the student in plain words what was received, the receipt number and the time, where the ZIP of their work was saved, and whether and until when they can submit again. After every submission, say again in your own words that the student must also upload that ZIP to Blackboard (or the system Reach names) to receive credit; the submission to rEach alone does not give credit.
    If the ZIP was not saved (Reach says it was too large or could not be saved), or the student lost it, run `reach submit archive` (or the reach_submit tool with archive true) to make it again for an assignment that has been submitted, and tell them it still has to be uploaded to Blackboard. Reach refuses when nothing has been submitted for that assignment.
    If Reach says the part is late, tell the student in plain words that it will be marked late and cannot be submitted again after this one. If submit says the due time has passed and the part is already submitted, tell the student it can't be submitted again and that their instructor can help; never try to submit a slice Reach says is closed.
    On Antigravity, Reach cannot ask for you: ask the same question in plain words, and run the command only after the student's yes.
    If submit says the work is queued, run `reach receipts wait --submission <id>` when you have an id, or `reach sync` when you are back online, and tell the student it has not been received yet.
    If submit says the work wasn't accepted, read the reason and the fix to the student in plain words.
    When a grade receipt arrives, show the signed scenario results in plain words. A queued or received submission is not passed. If a result fails, use the reach-bug skill, pass `reach qualify` again, and submit the correction with the student's yes.
  skill_reach_help: |
    ---
    name: reach-help
    description: Use when the student asks for instructor help. After three failed qualifications Reach raises the hand itself.
    ---
    Run `reach hand raise --type <type> --summary "<what is blocked, what you tried>"` (or the reach_raise_hand tool with type). Pick the closest type: grade_question (grades), access_issue (accounts, Blackboard and other course systems), extension_request (the student asks for more time), concept_question, assignment_question, deadline_question, submission_question, technical_issue, setup_issue, feedback, integrity_question or other; use student_request when none fits better (it is also the default). Reach refuses a type it does not know. Do not raise one for failed qualifications: Reach raises that hand itself on the third failure, with your code and scenarios in it.
    Tell the student that you asked the instructors for help and what was sent.
    Check `reach hand status` when the student returns; present any reply, and ask before applying a suggested change.
    Include the student's saved profile only if they say yes: `reach hand raise --include-profile ...`.
doctor_checks:
- id: R-DOC-RUBY
  checks: Ruby is 2.6.10 to 4.0.x
  fix: The installer command for this platform
- id: R-DOC-SHIM
  checks: The ~/.reach/bin/reach shim and its root file exist, and the root holds exe/reach
  fix: Run any reach command once (it rewrites the shim), or reach setup
- id: R-DOC-ENROLL
  checks: Once enrolled, Reach is not locked (W-ENR-6) by a revoked install, a damaged or missing stamp, a moved computer or an ended course; the finding names the lock reason. An install that has not enrolled yet is not a finding - doctor prints an `enrollment:` line carrying M-GATE-NOENROLL and that line alone does not change the exit code
  fix: reach enroll --course-code CODE --username USER --student-id ID
- id: R-DOC-KEYS
  checks: The instructors' public keys are present and current
  fix: reach sync
- id: R-DOC-GUARD
  checks: After enrollment, the guardrails package verifies and is the latest known
  fix: reach sync
- id: R-DOC-WS
  checks: Each current slice's workspace exists, read-only files unchanged, harness configuration intact
  fix: reach sync, then reach work
- id: R-DOC-HARNESS
  checks: A supported harness version is installed
  fix: Update the harness or install one
- id: R-DOC-CHROME
  checks: A usable Chromium is available
  fix: reach doctor --install-chromium
- id: R-DOC-GEMS
  checks: The qualify kit's gems are installed for this Ruby, for slices whose kit runs locally
  fix: reach qualify installs them on first run
- id: R-DOC-NET
  checks: Teach is reachable (since 0.21.11 also before enrollment, at the default Teach URL, naming the URL and the cause), the clock is within 5 minutes of Teach's
  fix: Check the connection or the computer's clock
- id: R-DOC-OUTBOX
  checks: The outbox is empty
  fix: reach submit retries automatically; stay online
- id: R-DOC-OUTDATED
  checks: This Reach is at least the minimum_reach_version Teach advertises
  fix: Update rEach through the harness's plugin update, or git pull in ~/.reach/plugin
- id: R-DOC-WIRE
  checks: Teach's advertised wire_contract_sha256 equals the digest of this Reach's specs/wire.yml
  fix: Update rEach; if it is current, tell the instructors their server and rEach disagree
- id: R-DOC-VERSION
  checks: VERSION matches every plugin manifest (plugin.json, .claude-plugin, .codex-plugin, reach.rplugin.yml)
  fix: A packaging fault; reinstall rEach
- id: R-DOC-PERSONA
  checks: The reach-assistant skill and the rEach agent carry the same persona, quoting the first-run greeting
  fix: A packaging fault; reinstall rEach
- id: R-DOC-DIRECTIVES
  checks: Every file in directives/ (README.md aside) parses, its opcode is 3 to 10 capitals or digits, its rule fits 88 characters and aliases are unique; a file that does not parse is named with the reason (no --- block, not a mapping, or the read or YAML error)
  fix: A packaging fault; reinstall rEach
- id: R-DOC-TASTE
  checks: skills/design-taste-frontend is the official tasteskill (name, opening line, MIT licence, provenance)
  fix: A packaging fault; reinstall rEach
- id: R-DOC-SEAL
  checks: The sidecar at the platform's state directory (or REACH_SIDECAR) exists and parses after enrollment
  fix: Run any reach command once; if it persists, reach enroll again
- id: R-DOC-STORAGE
  checks: Since 0.18.0, the last measure of rEach's memory (corpus and microbrain) is below storage.demand_mb; it is a finding only at or above it
  fix: reach storage compact
directives:
  table: >-
    The last section of every workspace AGENTS.md (W-RENDER-1). One row per directive, fleet form: [<alias> ·
    <OPCODE>] padded to 20, the rule padded to 88, "reach directive <OPCODE>" padded to 26, "⚙ <enforce>" padded
    to 22, "⚡ [<when>]". Course rows first, then engineering rows, then the pointer sentence. The table is
    capped at 6000 bytes.
  public:
    source: >-
      directives/<opcode>.md in this repository, frontmatter id/opcode/alias/tier/slice/rule/when/enforce, an optional
      spaces list (slice, extracurricular, root; default [slice], since 0.10.0) saying which folders' tables show the
      row, and a body
    aliases: A to M
    opcodes: PLAN1ST, RUBY, PURE, QUALIFY, NOCOM, VERIFY, TOZERO, CHECKPOINT, RESUME, LEAN, DOVETAIL, CODEFILE, FLOW
    qualify_and_flow: >-
      Since 0.11.0 QUALIFY (R-QUALIFY, alias D) replaces NOTEST: the agent writes its own scenarios under qualify/ and
      passes reach qualify. FLOW (R-FLOW, alias M) makes the reach-feature or reach-bug flow mandatory whenever the
      agent writes code, with no git. TOZERO follows the attempt ladder.
    codefile: >-
      CODEFILE (R-CODEFILE, since 0.10.0) tells the agent to put code in files, never in chat: coursework only in the
      slice's owned files under deliverables/, anything else in the student's extracurricular folder.
  private:
    source: >-
      Rows in the guardrails package's directives.yml (W-PKG-1), unpacked to the vault for the table. A body is
      never on the install: reach directive asks Teach for it (GET /api/v1/directives/<OPCODE>, W-API-DIRECTIVE) in
      quick mode, shows it once and keeps nothing; a Teach older than 0.5.0 that put a body in the package is read
      from there in memory (Reach::Guardrails.private_body); offline, the one-line rule prints with
      M-DIRECTIVE-OFFLINE. Teach records every served body and derives directive_dump from its own record.
    aliases: N to Z
  no_secrets: >-
    A body says what the agent does, never why or how it is enforced; grading, weights, rubrics, thresholds, keys
    and the seal live in Teach and never enter a body, so any body could be disclosed without harm
    (STD-DIRECTIVES-CARRY-NO-SECRETS). OPAQUE asks the agent to keep them private; Reach claims no boundary.
  reading: reach directive <OPCODE> (or the reach_directive tool) prints the body; every read is a ledger event on the install and a directive_reads row on Teach.
check:
  rules: >-
    CK-RUBY-SYNTAX, CK-RUBY-FLOOR, CK-RUBY-SHAPE, CK-COMMENT, CK-TEST, CK-PURE, CK-PORTS, CK-FUSE, CK-PANEL (with
    Dovetail's S-* ids), CK-SHAPE (from Reach::Shape when a shape is installed)
  panel_deferral: >-
    Since 0.9.0, when Reach::Shape.ran? (a signed shape was present and the Dovetail checker exited 0 or 1 with a
    report in this run), Reach::Check drops every CK-PANEL finding whose rule starts with "S-", because CK-SHAPE
    reports the same defect from Dovetail; CK-PANEL-TS, CK-FUSE, CK-TEST and CK-COMMENT stay. With no shape, or a
    checker that could not run, CK-PANEL runs every rule.
  granted_ports: >-
    Since 0.9.0 CK-PORTS and the ruby shape's allowed constants read the granted port names from
    <workspace>/api/slice-api.json (schema grokit.slice-api/v1: ports[].name plus clock and logger, camelized for
    constants) and fall back to api/README.md when it is absent or has another schema (wire revision 2026-09-29b).
  finding: id, rule, file, line, message, fix, classification (invisible or visible), finding_id
  callers: >-
    The PostToolUse hooks (--changed <path>), reach qualify and reach submit (only findings in the slice's own files
    count there), the student or agent by hand
  hook_input: >-
    A hook's JSON event on stdin when stdin is readable within half a second; otherwise none, so a run from a shell
    whose stdin is open but silent never waits.
  ruby_shape: >-
    The course's own shape: module Grokit, module <Module>, module Behaviours, a plain class <Name>, and def
    call(input, ports), either argument prefixed with an underscore when unused. Grokit constants allowed are the
    course's errors (NotImplemented, InvalidInput, Unavailable, CurrencyMismatch), the module's own namespace, and any
    constant the slice's api/README.md names.
  ledger: Every run appends a check record; a --changed run appends the write record first (before and after digests).
checkpoints:
  store: "~/.reach/checkpoints/<course>/<assignment>/<workspace>/NNN/{files/, meta.json}"
  rules: >-
    An identical state is refused (M-CHECKPOINT-SAME); restore saves the state it replaces first; every save and
    restore is a ledger event and a restore witnesses the restored files; no git repository is ever created in a
    workspace.
plan:
  file: "<workspace>/.reach/plan.yml (reach.plan/v1)"
  fields: behaviour, input, output, steps, edge_cases, scenarios, evidence, progress, next; text fields up to 400 characters, lists up to 12 entries of 200
  use: Saved before the first edit (PLAN1ST), read back at session start (RESUME), included in a hand bundle.
seal:
  mark: >-
    A 16-hex per-install, per-cutout, per-file mark Teach derives from its seal secret and ships in the guardrails
    package's seal.yml; Reach encodes it as U+2060, 64 x (U+200B for 0, U+200C for 1), U+2060 on the carrier line
    (Ruby line 2 "# reach <cutout> <slice>", Svelte line 1 "<!-- reach <cutout> <slice> -->").
  classes: own, missing, corrupt, foreign, unmarked; missing and corrupt are re-stamped, foreign never.
  ledger: >-
    ~/.reach/state/ledger/<course>/<assignment>/<workspace>.jsonl, one record per event with n, at, kind, fields, gv,
    prev and an HMAC tag under the ledger key Teach derives per install and guardrails version; a head cache and a
    per-computer sidecar carry the latest tag.
  sidecar: >-
    macOS ~/Library/Application Support/reach/seal.json, Windows %LOCALAPPDATA%\reach\seal.json, Linux
    $XDG_STATE_HOME or ~/.local/state/reach/seal.json, REACH_SIDECAR overrides; records every install enrolled from
    this computer.
  reports: >-
    vault_tampered, corrupt_mark, foreign_mark, ledger_break, sidecar_conflict, enrolled and directive_dump go to
    POST /api/v1/integrity, deduplicated, queued in the outbox when offline, and never shown to the student.
  submission: The manifest carries a seal block and the archive a ledger tail; Teach assesses provenance (W-PKG-5).
  hooked: >-
    Since 0.9.0 the seal carries hooked (true when the slice's ledger holds a session record) and harness falls back
    to REACH_HARNESS (claude-code, codex or antigravity) before "unknown"; rules/reach.md has Antigravity run
    REACH_HARNESS=antigravity reach submit. Teach treats a hookless seal by its TEACH_UNHOOKED_HARNESS_POLICY (note by
    default), so a harness that cannot witness writes is not flagged for review on that alone (wire revision
    2026-09-29b). hooked is self-reported from the student's ledger; it is a signal, not a guarantee.
status_example: |
  rEach 0.11.0 · BUS 101 (Fall 2026) · enrolled as Dana Ruiz (G4 · Finance)
  Current assignment: A2, due Sat 17 Oct 11:59 pm PDT
  Your slices:
    finance.a2s1  backend  in progress   shape: ok     checks: passed (12 min ago)
    finance.a2s2  panel    received      receipt R-8F2C1 at Thu 15 Oct 9:41 pm PDT
  Receipts: 4 (latest R-8F2C1)
  Open hands: none
  Course rules: v3 (verified)   Connection: online
privacy_notice:
  shown: >-
    In full in docs/student-guide.md. It says plainly that signed-in assignment work is recorded for the instructors and nothing else said is.
  text: >-
    Reach sends your submitted slice files, your enrollment details, your own-part answers and, when your AI partner
    asks for help, a short summary with your recent changes to the course server. To keep your enrollment yours, it also
    sends a scrambled fingerprint of this computer and computer account (never your files or passwords), which your
    course server checks. While you are signed in and working on an assignment, rEach also records the conversation
    (what you type, and your AI partner's replies, reasoning, actions and assignment code) and sends it to the course
    server, where your instructors can read it. Nothing is recorded before you sign in, in your extracurricular folder
    or outside your course folder. What rEach learns about you in its interview and from what you type is
    saved on this computer only; the interview profile is shared with your instructors only if you agree to add it when
    asking for help, and reach profile forget deletes it. Like any chat, what you type to rEach goes to the AI provider
    you use.
persona:
  name: rEach
  source: >-
    skills/reach-assistant/SKILL.md and agents/reach.md carry the same body (reach doctor's R-DOC-PERSONA compares
    them); the files are the source, first written from the v0.2.0 blueprint (kept privately) verbatim.persona_body.
    The greetings live in locales/greetings.en-US.yml.
  voice: Warm, curious and brief, in plain words; the course rules come first and the student leads creative choices.
  introduction:
    when: The first session after installation, and every session while no profile exists.
    how: >-
      reach hello decides the greeting from the profile and enrollment state (first run, resume, not enrolled,
      returning with the assignment and slice state) and hands it to the agent through the SessionStart context, the
      reach_hello tool, or setup's NEXT block; the agent opens its first reply with it word for word, unless the student's first message is a crisis, which gets reach support's message first and no greeting (since 0.14.3).
    first_run: >-
      "Hi, I'm rEach, your academic assistant! Since I don't know anything about you yet, let's start with a brief
      interview. It takes about five minutes, and you can skip any question. What I save about you stays on this
      computer: I use it to explain things in ways that suit you, and it never affects your grade. First question: what
      would you like me to call you?"
    gui_limit: >-
      A desktop app waits for the student to type first, so its banner reads "rEach is ready. Say hi to get started."
      and rEach introduces itself in its first reply.
    memory_notice: >-
      G-MEMORY-NOTICE closes the greeting: the private memory stays on this computer and is never sent to the
      instructors. When a student asks what rEach shares, the persona answers that signed-in assignment work is recorded
      and sent to the instructors and nothing else said is; submitted work, own-part answers, help requests the student
      agrees to and usage information also reach the instructors; the profile file and the memory stay on this computer.
    code_in_files: >-
      The persona puts code in files, never in chat: coursework in the slice's owned files, anything else in the
      student's extracurricular folder, and offers reach work --extracurricular when the student wants to build
      something of their own.
interview:
  purpose: >-
    Learn just enough about the student to shape examples, pacing, wording and how options are offered in their
    assignments; it never changes the course rules, the owned files, submission or grading.
  questions:
  - preferred_name
  - studies
  - year
  - coding_experience (none, a little, quite a bit)
  - ai_experience
  - the course's own question (Teach's course.interview.course_question, delivered in the guardrails package)
  - goal
  - explanation_style (step by step, big picture first, example first)
  - creative_lead (lead with own ideas, or choose from options)
  - work_times
  - deadline_reminders
  - notes
  guardrails:
  - >-
    One question at a time: each message ends with at most one question, each question asks one thing, and a
    confirmation checks one thing; at most twelve main questions with one follow-up each; about five minutes.
  - Every question is optional; "skip" moves on, "stop" ends and keeps what was agreed.
  - >-
    Never asks about health or disability, religion, politics, immigration status, money, family, relationships, age,
    other courses' grades or contact details; a volunteered sensitive detail is acknowledged, not probed, and only
    the practical preference is kept; accommodation requests go to the instructors.
  - Records what the student said, never personality labels.
  - Off-topic drift gets a brief answer when harmless, then a return to the interview.
  - Never blocks course work; the student can start and finish the interview later.
  closing: >-
    rEach reads back what it will remember, asks what to change or leave out, and saves only what the student agreed
    to, marking the profile complete or partial.
  storage: ~/.reach/profile.yml (reach.profile/v1, 0600), through reach profile save or the reach_profile_save tool.
course_time:
  rule: >-
    Every time rEach shows a student (due dates in greetings, status and the session context; receipt times) is
    written in the course's timezone with its abbreviation, e.g. "Sat 3 Oct 11:59 pm PDT" and "Sat 14 Nov 11:59 pm
    PST", whatever zone the student's computer is set to, because the syllabus and Teach's deadline use course time.
  zone: >-
    install.yml course.timezone from Teach's enrollment; then the guardrails package's course.yml timezone; then a
    local config.yml course.timezone; otherwise UTC, labeled UTC (since 0.33.0).
  computation: >-
    America/Los_Angeles uses built-in US daylight-time rules (PDT from 2:00 am on the second Sunday of March to 2:00 am
    on the first Sunday of November, PST otherwise), so it is right on macOS, Linux and Windows alike. Any other zone
    uses the system's zoneinfo when present, else the computer's own zone with its abbreviation.
  date_only: A due value with no time ("2026-10-03") is shown as a date with no zone ("Sat 3 Oct").
  deadlines: Deadline warnings compare instants, so the display zone never changes when a warning fires.
storage:
  since: 0.18.0
  standard: STD-STORAGE-GATES
  wire: W-DBG-KINDS, W-DBG-KINDS-2
  measure: >-
    Reach::Storage.measure sums the bytes of Reach's own rcorpus corpus root (0 without rplugin) and of the microbrain
    (Reach::Brain.dir, Reach::BrainSpool.dir, Reach::Paths.import_spool_dir and Reach::Paths.imports_dir; a root inside
    another is counted once), with lstat sizes, skipping symlinks. A persona's home is measured as its own. The result
    ({corpus, brain, total, measured_at}) is kept in <home>/state/storage.json (0600, atomic) beside warned_mb, the
    sessions that heard the demand notice and the compaction job.
  schedule: >-
    Measuring never runs inside a hook. reach hello reads storage.json and, when the last measure is older than
    storage.check_interval_s (3600) and no measure runs, spawns a detached reach storage measure under an exclusive
    lock; the prompt hook only reads. A measure also follows every compaction (and every import job).
  config: >-
    config.yml storage: warn_mb [512, 1024, 2048], demand_mb 4096, check_interval_s 3600. One MB is 1048576 bytes.
  notices: >-
    When the total crosses a warn threshold above warned_mb the next prompt carries M-STORAGE-WARN once and warned_mb
    rises; dropping below a threshold lowers it so a later crossing warns again. At or above demand_mb reach hello's
    context and the first prompt of each session carry M-STORAGE-DEMAND and Reach::Storage.demanded? is true (new
    imports are refused). reach doctor reports R-DOC-STORAGE then.
  compaction: >-
    reach storage compact asks through Reach like reach submit (STD-SUBMIT-APPROVAL; consent kind compaction, subject
    the corpus root's digest and the total in whole MB). Terminal mode asks at its own prompt; REACH_HARNESS=antigravity
    proceeds (the reach-storage skill asks first). On the yes it starts a detached reach storage compact --run under an
    exclusive lock and answers M-STORAGE-COMPACT-STARTED. The worker runs Rcorpus::Compact#run(compress: true) when
    the loaded rcorpus accepts a compress keyword and plain run otherwise (reclaim "unsupported"), then gzips every
    admitted file in the import spool that is not already .gz (verified by decompressing to the same sha256 before the
    plain file is removed), then measures again. It never opens, prunes, scrubs or rewrites the brain folder or the
    brain spool, and never calls Rcorpus::Consolidate or Rcorpus::Erase. The next prompt after it ends carries
    M-STORAGE-COMPACTED, M-STORAGE-COMPACT-OLD-LIBRARY or M-STORAGE-COMPACT-FAILED. Without rplugin reach storage
    compact answers M-STORAGE-NO-CORPUS.
  debug: >-
    Reach::Debug records storage events (measured, warned, demanded, compact_started, compacted, compact_failed) with
    MB figures, the tier and the outcome only: under kind storage when the cached status's wire_contract_sha256 equals
    this Reach's own specs/wire.yml digest, otherwise under kind brain with fields.event storage.<outcome>
    (W-DBG-KINDS-2).
  agent_text: skills/reach-storage/SKILL.md; one bullet in agents/reach.md and skills/reach-assistant/SKILL.md.
import:
  since: 0.18.0
  standard: STD-EXPORT-IMPORT
  wire: W-DBG-KINDS, W-DBG-KINDS-2
  sources: >-
    reach import export accepts a folder or a .zip (Reach::Unzip reads the central directory and streams one entry at
    a time; nothing is extracted). The vendor is detected from the first element of conversations.json (chatgpt: items
    carry mapping; claude: items carry chat_messages, also memories.json and projects.json beside it), of
    conversations-NNN.json shards, or of a Takeout MyActivity.json whose first item is a Gemini Apps item (gemini: each
    activity item is one conversation of a prompt and its reply). An export holding only chat.html, conversations.html
    or MyActivity.html answers M-IMPORT-NEEDS-JSON; anything else M-IMPORT-UNKNOWN. Only user and assistant turns with
    text are kept (system and tool turns and binary payloads are dropped). reach import pick opens osascript,
    PowerShell (-STA), zenity or kdialog with a 300 s timeout.
  streaming: >-
    Reach::JsonStream yields the text of each top-level array element and its byte offset, tracking strings, escapes
    and nesting across 1 MiB chunks, so memory stays bounded by the largest single conversation.
  consent: >-
    reach import export asks through Reach like reach submit (consent kind export_import, subject the path digest, the
    mode and the size in bytes). The agent offers the two modes first (the reach-import skill). It is refused when
    Reach::Storage.demanded? (M-IMPORT-STORAGE-FULL), and in copy mode when the last measured total plus the estimate
    reaches storage.demand_mb (M-IMPORT-COPY-TOO-LARGE); the question says so when the import would cross a warn
    threshold.
  job: >-
    A detached reach import run --job ID, one at a time under an exclusive lock, keeps its state in
    <brain>/imports/<ID>/job.json (written atomically after every conversation) beside catalog.jsonl and queue.jsonl.
    A killed job resumes from the last finished conversation: the catalog and the verbatim copy are cut back to the
    sizes recorded with that state, so no line is duplicated. The next prompt resumes an interrupted job and carries
    M-IMPORT-FINISHED (or M-IMPORT-FAILED) once. Each conversation becomes one catalog line (title, dates, turns,
    bytes, the 12 most frequent non-stopword tokens, an excerpt of at most 400 bytes of the first user turn, and where
    its full text lives) after the secret and student-ID refusal has dropped any title, excerpt or token that matches.
    In copy mode it is also rendered as Markdown and appended as private-tier source ops (category import, path
    import/<vendor>/<conversation_id>.md, parts of at most 1,000,000 bytes) to the import spool, which is admitted
    into Reach's corpus at the end. The queue ranks the catalog newest first, weighted by length and by overlap with
    the course's reference words. A storage measure follows the job.
  findings: >-
    reach import next prints the next queued conversation (title, dates, an origin line, at most import.next_max_bytes
    with a part marker) and reach import done advances the queue; reach remember --origin import:<job>/<conversation>
    stores the origin on the finding, and remember's budget, novelty gate and secret refusal apply unchanged. reach
    import search streams the catalog (BM25) and, in copy mode, the verbatim parts (plain or .gz), at most 10 hits with a
    300-byte snippet; reach import show prints one conversation from the copy.
  isolation: >-
    Imported text never enters Reach::BrainIndex (it reads only the brain spool), never counts toward
    brain.max_spool_bytes (the import spool is a separate folder), and is never sent to Teach.
  config: >-
    config.yml import: next_max_bytes 12000, progress_every 500.
  debug: >-
    Reach::Debug.import records started, progress (at most every progress_every conversations), finished, failed and
    cancelled with the vendor, mode, counts and bytes only, under W-DBG-KINDS-2.
  agent_text: skills/reach-import/SKILL.md; one bullet in agents/reach.md and skills/reach-assistant/SKILL.md.
transcript_export:
  since: 0.19.0
  standard: STD-TRANSCRIPT-EXPORT
  restored: >-
    Removed in 0.21.1 and restored in 0.25.0: Reach::TranscriptExport, reach transcripts export, the reach_transcripts
    tool, transcripts.auto_export (default true) and the messages M-TRANSCRIPTS-* and M-TX-*.
late_work:
  since: 0.19.0
  standard: STD-LATE-WORK
  wire: W-PACE-1, W-PACE-2, W-HAND-TYPES
  config: >-
    config.yml late_work: allow (default true), notice_every (default 10).
  writable: >-
    Reach::Pace.writable? allows a slice whose own due has passed by Teach's clock when late_work.allow is true. The due
    is the status's current_assignment.due when the slice's assignment is the current one, otherwise the workspace
    package's due (Reach::LateWork.due_for_meta); an assignment that is neither current nor past due stays refused
    (M-GATE-NOT-CURRENT).
  info: >-
    Reach::LateWork.late?(workspace) and .info(workspace) give the due, how late (M-LATE-HOW-*), submitted_before_due (an
    ingest receipt with late false exists for the slice), on_record and can_submit (no ingest receipt for the slice, or
    the due has not passed).
  notices: >-
    M-LATE-NOTICE in reach hello's context when the cwd workspace is late; on the first prompt of each session in a late
    workspace and every notice_every prompts after (a per-session counter in state late-prompts.json, no network);
    M-LATE-STATUS in reach status; the submit ask uses M-SUBMIT-ASK-LATE. M-LATE-CAN-SUBMIT, M-LATE-CANNOT-SUBMIT and
    M-LATE-CANNOT-SUBMIT-ONTIME say whether it can still be submitted.
  hands: >-
    The first allowed late write in an assignment (the gate's write path) records it in state late-hands.json and spawns
    a detached reach hand late --assignment A (trigger late_work); a verified ingest receipt with late true does the same
    with trigger late_submission (Reach::Receipts.store). Once per assignment and type ever; the next session start retries
    an unsent one; a 403 hands_disabled or a 400 gives it up quietly, as do five failed tries. No hook waits on the network.
home_in_workspace:
  since: 0.31.0
  standard: STD-HOME-IN-WORKSPACE
  layout: >-
    rEach's own files live in <workspace_base>/.reach-home (workspace_base is $REACH_WORKSPACE_ROOT or ~/reach-work),
    never in ~/.reach for a new install. The workspace stays where it is. A persona keeps its home at
    <home>/personas/<id> and its workspace at <workspace_base>/personas/<id>.
  user_home: >-
    Since 0.34.3 (STD-USER-HOME) every ~ above is Reach::Paths.user_home. On macOS and Linux that is File.expand_path("~")
    as before. On Windows it is the signed-in user's profile folder as Windows reports it, never $HOME: the Profile
    known folder (SHGetKnownFolderPath through Fiddle), else HKCU\Volatile Environment USERPROFILE (reg.exe), else
    %USERPROFILE%, else ~; Reach::Paths.user_home_source names the step that answered. exe/reach-run asks reg.exe, then
    PowerShell's [Environment]::GetFolderPath('UserProfile'), then $USERPROFILE; scripts/reach-install and
    scripts/reach-install.ps1 follow the same order. A harness's config folder follows that harness's own rule:
    CLAUDE_CONFIG_DIR, else %USERPROFILE%, else user_home for Claude and Antigravity; CODEX_HOME, else user_home for
    Codex; HERMES_HOME, else user_home for Hermes. rEach never creates the folder its paths hang from (user_home, or the
    parent of $REACH_WORKSPACE_ROOT or $REACH_HOME): when it is missing every launcher and Reach::Paths.ensure_home!
    create nothing and answer M-HOME-MISSING.
  resolution: >-
    Reach::Paths.root, memoized for at most 2 seconds: (1) $REACH_HOME set: that directory, legacy logic off; (2)
    <workspace_base>/.reach-home/state/relocation.json exists with phase completed: the new home; (3) ~/.reach holds
    install.yml or plugin/: the legacy home is active and a relocation is due; (4) the new home holds install.yml,
    plugin/ or keys/ and either is enrolled (install.yml and keys/install.pem) or no stray home is enrolled (since
    0.34.4): the new home; (5) on Windows only, with neither override set, a stray home exists: a
    reach-work/.reach-home (completed, or holding install.yml, plugin/ or keys/) or a legacy .reach under $HOME or
    %USERPROFILE% when that folder differs from user_home; the stray home is active and a relocation is due; (6)
    otherwise the new home.
  stray_relocation: >-
    Since 0.34.3 a stray home is moved by the same relocation as a legacy one, with the stray home as its source and
    user_home's reach-work as its base. After the home is switched in, the stray reach-work's other top-level entries
    are copied into user_home's reach-work one by one through a .<name>.reach-moving staging name that is renamed only
    after it verifies; an entry whose name already exists there is skipped and logged. Nothing under the stray folder is
    deleted, truncated, renamed or overwritten; a RELOCATED.json the stray source refuses is logged and does not stop the
    move. Since 0.34.4 a destination home that is populated but not enrolled (a reinstall that ran before the move) is
    renamed to <base>/.reach-home.set-aside-<UTC timestamp> and the stray home is moved in its place; an enrolled
    destination still fails destination_occupied. Since 0.34.5 that rename happens in the switch step, after the copy,
    verification and enrollment comparison passed and immediately before the staged home is renamed in, and is undone
    when that rename fails, so a failed run leaves the profile home as it was. Since 0.34.6 the same holds for a
    bootstrap-only home renamed to .reach-home.pre-<timestamp>-<hex>; when putting either folder back fails, or the
    destination reappeared meanwhile, the run fails with reason rollback_incomplete, the folder stays under its
    set-aside or pre name (nothing is deleted) and the student is told so and to tell their instructor. An enrolled
    stray home is always chosen
    over an unenrolled one. At session start, on Windows with $HOME different from user_home, Reach::Debug.emit_always
    records a W-DBG-FAULT fault event (where paths.user_home, cause home_env_mismatch, a stable fault_id, home_source
    and two booleans), never a path or a name. Since 0.34.13 Reach::Debug.relative_frames writes a backtrace frame
    under user_home, $HOME or %USERPROFILE% as ~/..., and Reach::Deidentify scrubs a $HOME that differs from user_home
    on Windows as [[home-folder-env]] (Teach restores any [[a-z0-9-]] placeholder); a home folder that is a drive or
    filesystem root yields no scrub form.
  relocation: >-
    Reach::Relocation copies the legacy home to <workspace_base>/.reach-home.relocating with a journal (SHA-256 per
    file, resumable after a kill), verifies in rounds, compares enrollment before and after (key, fingerprint and stamp
    of the root and of every persona; the comparison has no side effect and never marks the install moved or queues an
    integrity event), switches by renaming the staged directory to .reach-home, rewrites the staged copies of bin/root,
    the update manifest and last-install.txt, then rewrites every harness config in the root, extracurricular and slice
    spaces, repoints the Claude and Codex marketplaces at the new plugin (Reach::HarnessSource; Codex removes and adds
    the marketplace on its "already added from a different source" conflict and restores the old source when the add
    fails) and refreshes the subscription job. It starts detached at session start (Reach::Hello), runs in the
    foreground at the end of reach setup, and runs on request as reach relocate [--format json]. Nothing under the legacy
    home is ever deleted, truncated, renamed or overwritten; the only write there is RELOCATED.json. The lock
    (.reach-home.relocation.lock) and the auto-start state (.reach-home.relocation-auto.json) are files beside the home in
    the workspace base. A destination that holds anything other than a bootstrap/ folder, or a staged directory that is
    not rEach's, fails with destination_occupied and writes nothing.
  home_refused: >-
    In every kind of space, a read, write, listing, search, redirect or cd whose target resolves inside the home (or a
    persona home, .reach-home.relocating, .reach-home.failed-* or .reach-home.pre-*), and a recursive search or listing
    whose base is an ancestor of the home, is refused the way vault and keys reads are; reach's own commands through the
    shim are the only way in. Workspace.current_slices, Workspace.migrate_layout!, Archive and the student-work walks
    prune the home; Reach::Workspace.space_for returns nil inside it; storage measure counts it as rEach's own storage.
  target_spaces: >-
    Reach::Workspace.space_for_target judges a write or a shell command by its target, so a root-kind session (cwd
    <workspace_base>) may write an owned file of one slice and a command that cds into a slice runs as that slice.
    Reach::Gate.focus_workspace picks the one current slice when the cwd is the root; with two or more it refuses with
    M-PICK-SLICE ("Which slice? Run this from inside one: {choices}"). The root space carries the check PostToolUse hook
    for Claude and Codex. While a relocation runs, Reach::Relocation.hold! makes writes, shell calls and submit refuse
    with M-RELOCATING.
  doctor: >-
    R-DOC-RELOCATION reports a failed relocation (with its reason) as a finding only for an enrolled install; a legacy
    install awaiting its relocation and a completed one are reported without a finding.
  not_fixed: >-
    This layout alone does not open the Codex sandbox: by default it still blocks the network and writes outside the
    chat's folder. Since 0.31.0 STD-CODEX-SETUP (codex_setup) writes network access, the reach-work folder as a
    writable root and its trust into the student's own Codex configuration after their yes. Codex hook trust is
    unrelated to this layout. On Windows the project's top-level .codex is read-only inside the sandbox.
codex_setup:
  since: 0.31.0
  standard: STD-CODEX-SETUP
  wire: W-LIVE-5 (codex_configure, sandbox_probe) and W-KI-1 (remedy), revision 2026-10-04h
  library: >-
    lib/reach/codex_setup.rb (Reach::CodexSetup: status, apply!, configure_terminal, ask_chat, follow_up!, withdraw!,
    heal!, probe!, probe_child, doctor_line, doctor_problems, and the line editor Reach::CodexSetup::Editor). It is the
    only code that writes $CODEX_HOME/config.toml for sandbox keys.
  rule: >-
    A Codex project-level .codex/config.toml does not change the sandbox Codex gives a chat, so after the student's own
    yes Reach writes the keys it needs into the student's user-level Codex configuration ($CODEX_HOME/config.toml,
    else ~/.codex/config.toml), from outside the sandbox, keeps a backup beside it, proves the result with a sandboxed
    probe and puts the keys back when they were removed.
  toggles: >-
    config.yml codex: setup (true; false or REACH_CODEX_SETUP=0 makes every entry point answer M-CODEX-SETUP-OFF and
    change nothing, and turns off the reapply and the doctor's problem lines; a course turns it off, never on, with
    setup false in the course policy's codex section), sandbox (auto, workspace or full; auto is full on Windows and
    workspace elsewhere, because neither workspace key has been measured on Windows and writable_roots is reported
    unreliable there, openai/codex#23552), heal (true; false stops the reapply), probe_timeout_s (20, held to 5..60).
  wanted: >-
    workspace: top-level sandbox_mode = "workspace-write", [sandbox_workspace_write] network_access = true and
    writable_roots holding the reach-work folder (Reach::Paths.workspace_base, never the Reach home), and
    [projects."<reach-work>"] trust_level = "trusted". full: sandbox_mode = "danger-full-access" and the same trust
    table, with [sandbox_workspace_write] left as found. An existing danger-full-access is never narrowed.
  never_written: >-
    approval_policy, model, features, hooks, Codex hook trust, marketplaces, mcp_servers and every other key. Reach
    neither writes nor reads Codex hook trust.
  editor: >-
    Line based and binary safe: it keeps the file's line ending style, every byte it does not edit and a final newline,
    replaces or inserts only the lines it must (top-level sandbox_mode after the last top-level line, a missing key
    after its table's last line, a missing table at the end after one blank line), adds the folder to a one-line
    writable_roots array, and writes TOML basic strings. It refuses and changes nothing (M-CODEX-SETUP-UNSAFE with a
    short reason) when the file is not UTF-8, when one of its keys or tables is written as a dotted key, an inline
    table, a multi-line array or twice, when the file is a link, or when the result does not read back as set up.
    Under the lock it copies the old file to config.toml.reach-backup-<UTC yyyymmddThhmmssZ> (never overwritten,
    deleted or pruned), writes a temporary file and renames it over the config with the old mode (0600 for a new
    file). When the codex command is on PATH it runs codex features list (a no-model command that loads and checks
    the whole configuration) before and after the write, with a 15 second limit, and puts the old content back when
    only the new file is rejected. A second apply on a set-up file writes nothing (M-CODEX-SETUP-ALREADY).
  state: >-
    <root>/state/codex_setup.json (0600, temporary file and rename): consent {answer yes, no or withdrawn, at, via
    terminal, chat or live}, mode, applied_at, backup, config_sha256, healed_at and the last probe {at, available,
    network, home_writable, reason, codex_version}. <root>/state/codex_setup.lock through Reach::Locks with a 5 second
    wait; a busy lock answers M-CODEX-SETUP-BUSY.
  consent: >-
    terminal: reach codex configure on a terminal prints M-CODEX-SETUP-ASK and reads one line. chat: reach_setup
    configure and a reach codex configure without a terminal ask through Reach::Consent (kind codex_setup, subject the
    mode and the SHA-256 of the current file, kept on the computer); the prompt hook captures the typed answer and its
    follow-up applies on a yes or records the no (M-CODEX-SETUP-DECLINED). In the MCP server on Codex, while
    KnownIssues.hooks_stale? holds, no yes can be captured, so it answers M-CODEX-SETUP-TERMINAL and asks nothing. Before enrollment
    the MCP tool answers M-CODEX-SETUP-SIGN-IN and asks nothing, because a chat yes is captured only for a signed-in
    student; the terminal command works before enrollment. A withdrawal with no backup on disk answers
    M-CODEX-SETUP-OFF-DONE-NEW, and the outcome text sent to Teach from a live action names the backup by file name only.
    live: the student's yes to the codex_configure live action. Inside the sandbox, where Codex's home is not
    writable, every writing entry point answers M-SANDBOX-AGENT. reach codex off records the withdrawal.
  heal: >-
    CodexSetup.heal! reapplies when setup and heal are on, the recorded answer is yes, Codex is present, the file is
    not set up, the process is not sandboxed and the last reapply is over 6 hours old, with the same editor, backup,
    validation and lock; it records healed_at, emits one debug event and never raises. Called from reach mcp after the
    plugin cache repair and from the background subscription tick, nowhere else and never from a hook.
  probe: >-
    CodexSetup.probe! runs codex sandbox [-c sandbox_mode="<the settings file's own top-level value, when it is one
    of read-only, workspace-write or danger-full-access>"] -- <ruby> <exe/reach> codex probe-child from the reach-work
    folder with the configured limit, so the test runs under the mode a chat would use; the child prints one JSON line {flag, network (false without a request when
    CODEX_SANDBOX_NETWORK_DISABLED is 1, null when REACH_OFFLINE is 1, else one anonymous GET /api/v1/health with 5
    second limits and no retry, answered below 500), home_writable (Reach::Sandbox.probe_home)}. The child does not
    use Reach::Client, whose token bucket lives in the Reach home and would read a blocked folder as a blocked
    network; the parent takes one token from that bucket (quick) before it starts the child, and answers available
    false when rEach is pacing its requests. scripts/reach-install runs reach codex configure right after it installs
    when Codex is present and a person can answer (stdin a terminal, or /dev/tty when stdout is a terminal), and
    prints the command otherwise. A timeout, a non-zero exit or unreadable output is available false with the reason.
  doctor: >-
    reach doctor prints codex: <not found | setup off | settings ok (workspace|full) | settings not applied>; sandbox
    <last probe: internet ok|blocked, folder ok|blocked, age | not tested>, runs the probe first when Codex and its
    command are present, the process is not sandboxed and REACH_OFFLINE is not 1, and adds R-DOC-CODEX when the
    student said yes and the file no longer holds the settings, or when the last probe under 24 hours old was
    blocked. reach doctor --report carries a codex section (CodexSetup.status) and never runs the probe.
  observability: >-
    One debug event per apply, decline, withdrawal, reapply, refusal and probe through the generic brain event
    (event codex_setup.applied, already, declined, withdrawn, healed, refused or probed) with mode, via, reason, the
    backup's file name and the probe's booleans; unexpected errors go through Reach::Debug.fault (codex_setup:<step>).
  measured: >-
    Codex 0.160.0 on Linux, 2026-10-03: a chat's sandbox follows the user-level config (codex debug prompt-input shows
    workspace-write, network enabled and the reach-work writable root after Reach's edit, and read-only with
    restricted network before it); a project-level .codex/config.toml changed nothing. codex sandbox honors the
    file's [sandbox_workspace_write] keys but not its top-level sandbox_mode (it stays read-only unless given -c
    sandbox_mode=...), which is why the probe passes the file's value; with it the probe reported blocked before and
    ok after configure in both modes.
  unverified: >-
    Windows and macOS (the editor's CRLF and path handling, the PowerShell installer step, case-insensitive path
    comparison), the Codex desktop app and IDE extension honoring the user-level config, and a real Codex chat
    reaching the course server after configure.
grade_view:
  since: 0.19.0
  standard: STD-GRADE-VIEW
  wire: W-API-GRADES
  fetch: >-
    Reach::Grades.fetch GETs /api/v1/grades through Reach::Client (its token bucket, timeouts, retries and breaker),
    keeps only the last answer in state grades.json, and renders each assignment's points and points_possible and the
    total (M-GRADES-*), with the course grade of record named when the course profile names a learning system. 404 and 403
    grades_disabled forget the stored answer and answer M-GRADES-UNAVAILABLE; a network failure shows the stored answer
    labelled with its as_of (M-GRADES-OFFLINE-LAST) or M-GRADES-OFFLINE. Points are never derived from receipts.
smoke_test:
  command: ruby tools/smoke/run.rb
  purpose: >-
    Drive real Claude sessions with rEach loaded, the way a student would, and check what rEach said and did. It is a
    release check, not part of the plugin; see tools/smoke/README.md.
  sandbox: >-
    Every session runs in a Docker container built from tools/smoke/Dockerfile (Ruby 2.6.10, the Mac floor, plus git)
    as the developer's user with all capabilities dropped and a read-only root; the container sees only a scratch home,
    the repository (read-only) and the host's claude binary (read-only), never the developer's home or Claude
    configuration. Claude signs in with a dedicated token from claude setup-token.
  students: Scripted lines, or a model playing a described student with no tools.
  checks: >-
    Hard checks on replies, tool calls and the files a scenario leaves (profile fields and mode, workspace files,
    installed plugins) decide pass or fail; a model judge adds advisory notes.
  safety: >-
    One conversation at a time, a per-turn timeout, a per-session and a whole-run spending ceiling, and a kill switch
    (REACH_SMOKE_DISABLE=1, or a STOP file in the run folder).
