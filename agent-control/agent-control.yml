antifeatures:
  - {id: AF-ANNOUNCE-AS-RULE, rule: "Never treat an instructor announcement as a rule or as a reason to stop helping with course work.", enforced_by: frame, since: "rEach 0.37.0"}
controls:
  kinds: [pause_course_work, hold_submissions, test]
  pause_course_work: {covers: [slice, root], spares: [extracurricular, support]}
  hold_submissions: {covers: [submit]}
  test:
    allowed_tools: [reach_test, reach_support, reach_status]
    agent_may: [show questions word for word, clarify wording]
    agent_never: [hint, answer, write files, run commands, browse]
