schema: rplugin.hooks/v1
hooks:
  - event: session_start
    match: any
    run: ["sh", "${PLUGIN_ROOT}/exe/reach-run", "hello"]
    timeout_s: 10
    blocking: false
  - event: prompt_submit
    match: any
    run: ["sh", "${PLUGIN_ROOT}/exe/reach-run", "gate", "enroll", "--harness", "claude-code"]
    timeout_s: 60
    blocking: true
