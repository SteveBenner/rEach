schema: polispec.policy/v1
project: reach
recorded: 2026-10-08
summary: "rEach ships to student machines. main is dev, test is the pre-release students never follow, stable is the channel students install and moves only by the operator."
rules:
  - { id: R-PROD-GIT, match: { env: prod, class: [git.commit, git.push, git.tag, git.merge, git.rewrite, git.branch, release.publish] }, verdict: deny, reason: "stable is what students install; only the operator moves it with `polispec promote --to stable`" }
  - { id: R-PROD-SVC, match: { env: prod, class: [service.control, service.config, deploy, promote] }, verdict: deny, reason: "the stable channel changes only through the operator" }
  - { id: R-PROD-FS, match: { env: prod, class: [fs.write] }, verdict: deny, reason: "the stable checkout is not edited by agents" }
  - { id: R-PROD-SECRET, match: { env: prod, class: [secrets.read] }, verdict: deny, reason: "production secrets are not readable by agents" }
  - { id: R-XENV-COPY, match: { class: [data.copy], crosses: data_classes }, verdict: deny, reason: "data class not allowed in destination environment" }
  - { id: R-TEST-DIRECT, match: { env: test, class: [git.push, git.merge, git.commit, git.tag] }, verdict: deny, reason: "test moves only through `polispec promote --to test`" }
  - { id: R-TEST-REWRITE, match: { env: test, class: [git.rewrite] }, verdict: deny, reason: "test history is never rewritten" }
  - { id: R-TEST-PROMOTE, match: { env: test, class: [promote] }, verdict: allow, requires: gates.to_test }
  - { id: R-TEST-OPS, match: { env: test, class: [deploy, service.control, data.write, fs.write] }, verdict: allow }
  - { id: R-POLICY, match: { class: [policy.edit] }, verdict: warn, reason: "policy files take effect only after promotion to stable" }
  - { id: R-DEV-REWRITE, match: { env: dev, class: [git.rewrite], ref: main }, verdict: warn, reason: "main is shared history" }
  - { id: R-DEV, match: { env: dev }, verdict: allow }
promotion:
  to_test:
    from: main
    actor: [agent, operator]
    fast_forward_only: true
    requires_version_bump: true
    tag: "v{VERSION}"
    release: { github_prerelease: true }
    drift: "main must contain stable's tip (operator hotfix back-merge) or promotion is denied"
    gates:
      - { id: G-GATE, run: "ruby tools/release_gate/gate.rb check --ref {sha} --tag v{VERSION} --as-push", pass: exit_zero }
      - { id: G-RCHECK, run: "$HOME/.rplugin/bin/rplugin check reach", pass: exit_zero, hermetic: false }
      - { id: G-RDOCTOR, run: "$HOME/.rplugin/bin/rplugin doctor reach", pass: exit_zero, hermetic: false }
      - { id: G-POLICY, run: "ruby tools/policy.rb check", pass: exit_zero }
      - { id: G-CLEAN, builtin: clean_tree }
      - { id: G-VHOMES, builtin: version_homes_agree }
    after: ["polispec deploy {project} test"]
  to_stable:
    from: test
    actor: [operator]
    fast_forward_only: true
    phrase: "promote {project} to stable"
    preflight:
      - { id: G-LEASE, run: "ruby tools/release_gate/gate.rb check --ref {sha} --tag v{VERSION} --as-push --min-lease-minutes 20", pass: exit_zero }
      - { id: G-WIRE-PROD, run: "ruby tools/release_gate/gate.rb wire-live --ref {sha}", pass: exit_zero }
    gates:
      - { id: G-GATE, run: "ruby tools/release_gate/gate.rb check --ref {sha} --tag v{VERSION} --as-push", pass: exit_zero }
      - { id: G-WIRE-PROD, run: "ruby tools/release_gate/gate.rb wire-live --ref {sha}", pass: exit_zero }
      - { id: G-SOAK, builtin: soaked, hours: 24 }
      - { id: G-RCHECK, run: "$HOME/.rplugin/bin/rplugin check reach", pass: exit_zero, hermetic: false }
      - { id: G-RDOCTOR, run: "$HOME/.rplugin/bin/rplugin doctor reach", pass: exit_zero, hermetic: false }
      - { id: G-POLICY, run: "ruby tools/policy.rb check", pass: exit_zero }
      - { id: G-TESTED, builtin: sha_ran_on_test }
      - { id: G-FREEZE, builtin: not_frozen }
    release: { flip_latest: deferred }
    after: ["polispec deploy {project} stable --tag v{VERSION}"]
  to_canary:
    from: test
    actor: [operator]
    phrase: "promote reach to canary"
    gates:
      - { id: G-GATE, run: "ruby tools/release_gate/gate.rb check --ref {sha} --tag v{VERSION} --as-push", pass: exit_zero }
      - { id: G-TESTED, builtin: sha_ran_on, env: test }
      - { id: G-SOAK, builtin: soaked, env: test, hours: 24 }
      - { id: G-RCHECK, run: "$HOME/.rplugin/bin/rplugin check reach", pass: exit_zero, hermetic: false }
      - { id: G-RDOCTOR, run: "$HOME/.rplugin/bin/rplugin doctor reach", pass: exit_zero, hermetic: false }
hermetic:
  test:
    isolate: [RPLUGIN_HOME, XDG_STATE_HOME, XDG_DATA_HOME, REACH_HOME, REACH_WORKSPACE_ROOT]
    protected_roots: ["~/.corpora/reach", "~/.reach", "~/.local/state/rplugin/reach", "~/reach-work"]
  prod:
    isolate: [RPLUGIN_HOME, XDG_STATE_HOME, XDG_DATA_HOME, REACH_HOME, REACH_WORKSPACE_ROOT]
    protected_roots: ["~/.corpora/reach", "~/.reach", "~/.local/state/rplugin/reach", "~/reach-work"]
freezes:
  - { id: F-CLASS, applies_to: [promote.to_stable, promote.to_canary], source: teach.calendar, project: teach, kind: class_session, lead_minutes: 30 }
  - { id: F-DUE, applies_to: [promote.to_stable, promote.to_canary], source: teach.calendar, project: teach, kind: assignment_due, lead_hours: 24 }
  - { id: F-LIVE, applies_to: [promote.to_stable], source: teach.activity, project: teach }
  - { id: F-MANUAL, applies_to: [promote.to_stable], rrule: null, from: null, until: null }
data_classes:
  synthetic: { allowed_in: [dev, test, prod] }
  operational: { allowed_in: [dev, test, prod] }
observability: { events: rlogs, digest: daily }
agents:
  instructions:
    - "rEach stable is what students install. Ship to main, then promote to test with `polispec promote reach --to test`; ask the operator to run `polispec promote reach --to stable`."
    - "Architect and Linus use the session harness on Fable or Astra at xhigh; never max or ultracode. Resolve role overrides within the current harness. Linus asks for the Bob worker model each work phase; the inexpensive default is Haiku or Luna at medium. No automatic cross-harness dispatch."
  roster: specs/polispec/roster.yml
