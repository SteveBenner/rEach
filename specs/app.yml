      purpose: "Save a setup report to Downloads for the instructors."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_debug
      standards: [STD-DEBUG-MODE, STD-ENV-REPORT]
    - verb: "reach instructor status"
      synopsis: "reach instructor status [--format text|json]"
      purpose: "Show the instructor unlock state, the persona and the keyring summary."
      mutates: none
      requires: "Usable while locked."
