      standards: [STD-HOME-IN-WORKSPACE, STD-USER-HOME]
    - verb: "reach remember"
      synopsis: "reach remember --category C --claim TEXT --evidence TEXT [--supersedes ID] [--origin import:JOB/CONVERSATION] [--format text|json]"
      purpose: "Keep one durable thing learned about the student or their work in the local brain."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_remember
      standards: [STD-BRAIN]
    - verb: "reach memory list"
      synopsis: "reach memory list [--category C] [--limit N] [--format text|json]"
      purpose: "List what rEach remembers."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_memory
      standards: [STD-BRAIN]
    - verb: "reach memory show"
      synopsis: "reach memory show ID"
      purpose: "Show one memory."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_memory
      standards: [STD-BRAIN]
    - verb: "reach memory forget"
      synopsis: "reach memory forget ID... | reach memory forget --all --yes"
      purpose: "Forget memories by id, or all of them with --all --yes."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_memory
      standards: [STD-BRAIN]
    - verb: "reach memory export"
      synopsis: "reach memory export"
      purpose: "Print an export of the memories."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_memory
      standards: [STD-BRAIN]
    - verb: "reach storage status"
      synopsis: "reach storage status [--format text|json]"
      purpose: "Show how much space rEach's memory uses on this computer."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_storage
      standards: [STD-STORAGE-GATES]
    - verb: "reach storage measure"
      synopsis: "reach storage measure [--format text|json]"
      purpose: "Measure the memory folders again and print the total in MB."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_storage
      standards: [STD-STORAGE-GATES]
    - verb: "reach storage compact"
      synopsis: "reach storage compact [--format text|json]"
      purpose: "Compact the saved course memory after the student's yes; the first call asks, the second after the captured yes starts a background compaction."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_storage
      standards: [STD-STORAGE-GATES, STD-CONSENT-FROM-REACH]
    - verb: "reach issues list"
      aliases: ["reach issues"]
      synopsis: "reach issues list"
      purpose: "List the technical problems rEach noticed and reported by itself. Shown only in instructor persona or debug mode."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_issues
      standards: [STD-ISSUES]
    - verb: "reach issues flush"
      synopsis: "reach issues flush [--background]"
      purpose: "Send queued issue reports to Teach as hands."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_issues
      standards: [STD-ISSUES]
    - verb: "reach live status"
      aliases: ["reach live"]
      synopsis: "reach live [status]"
      purpose: "Show the state of the live session with the instructors."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE]
    - verb: "reach live request"
      synopsis: "reach live request [--hand ID]"
      purpose: "Ask for a live session; rEach asks the student before anything is run or sent."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE, STD-LIVE-DIAGNOSIS]
    - verb: "reach live wait"
      synopsis: "reach live wait"
      purpose: "Wait for the next instructor messages and print them."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE]
    - verb: "reach live note"
      aliases: ["reach live say"]
      synopsis: "reach live note TEXT | reach live say TEXT"
      purpose: "Send a note (kind note) or the agent's message (kind agent) into the live session."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE]
    - verb: "reach live end"
      synopsis: "reach live end"
      purpose: "End the live session."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE]
    - verb: "reach live run"
      synopsis: "reach live run"
      purpose: "Internal: the live worker that carries out the queued live actions."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE]
    - verb: "reach live watch"
      synopsis: "reach live watch --harness H"
      purpose: "Claude Code Stop-time wake hook: stay up to 900 s so an instructor message can wake the chat."
      mutates: external
      requires: "Only installed on Claude Code 2.1.288 or newer with live wake enabled."
      source: lib/reach/cli.rb CLI.cmd_live
      standards: [STD-LIVE]
    - verb: "reach import"
      synopsis: "reach import PATH"
      purpose: "Copy a file the student names into the current workspace's materials folder, within the allowed file types and size limits."
      mutates: files
      requires: "A course workspace."
      source: lib/reach/cli.rb CLI.cmd_import
      standards: [STD-WORKSPACE-LAYOUT]
    - verb: "reach import export"
      synopsis: "reach import export PATH --mode brain|copy [--format text|json]"
      purpose: "Bring a downloaded ChatGPT, Claude or Gemini export (folder or ZIP) into rEach, asking the student first. brain keeps a catalog and findings; copy adds a full local copy."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import pick"
      synopsis: "reach import pick [--folder]"
      purpose: "Open the operating system's own picker for the export ZIP or folder and print the chosen path."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import status"
      aliases: ["reach import cancel", "reach import list"]
      synopsis: "reach import status | cancel | list [--job ID] [--format text|json]"
      purpose: "Show the background import's progress, cancel it, or list imports."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import next"
      synopsis: "reach import next [--job ID]"
      purpose: "Print the next queued conversation to learn from."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import done"
      synopsis: "reach import done CONVERSATION [--part N] [--job ID]"
      purpose: "Mark a conversation worked."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import search"
      synopsis: "reach import search QUERY [--job ID]"
      purpose: "Search the imported conversations."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import show"
      synopsis: "reach import show CONVERSATION [--part N] [--job ID]"
      purpose: "Print one conversation from the saved copy."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach import run"
      synopsis: "reach import run --job ID [--format json]"
      purpose: "Internal: the detached worker that processes one import job."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_export_import
      standards: [STD-EXPORT-IMPORT]
    - verb: "reach packet import"
      synopsis: "reach packet import FOLDER [--bundle ZIP] [--allowed-signers PATH] [--no-qualify] [--format text|json]"
      purpose: "Bring the work done in the offline sidecar folder the instructor handed out into the workspace: verify the folder's signature, the student and the course, copy each started slice with its checkpoints and answers, keep the offline receipt, then run reach check and reach qualify."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_packet
      standards: [STD-PACKET-IMPORT]
    - verb: "reach test"
      synopsis: "reach test [status | open | questions | record QUESTION_ID | submit]"
      purpose: "The student's course test: status, open it, show its questions word for word, record the answer typed in the latest message, or submit."
      mutates: external
      requires: "A test the instructors set for this course."
      source: lib/reach/cli.rb CLI.route
      standards: [STD-TEST-MODE]
  mcp:
    - id: reach
      endpoint: "stdio: sh exe/reach-run mcp (Claude Code, .mcp.json) or ruby exe/reach mcp (Codex, root mcp.json and .codex-plugin/plugin.json; Hermes and workspace files run the shim with mcp)"
      auth: "None on the wire: the bridge runs as the student's own process, speaks JSON-RPC over stdio (protocol versions 2025-06-18, 2025-03-26 and 2024-11-05), and answers tools/call only after the enrollment lock and the course controls allow the tool. Every tool call has a 25 s budget."
      description: "The student's agent reaches rEach only through these tools. Tools marked read-only carry readOnlyHint; reach_profile_forget, reach_memory_forget, reach_transcripts and reach_storage carry destructiveHint; reach_submit, reach_qualify and reach_raise_hand carry openWorldHint. The tools usable while rEach is locked are reach_hello, reach_support, reach_debug, reach_doctor, reach_update, reach_setup, reach_transcripts, reach_validate, and reach_submit with archive true."
      tools:
        - name: reach_validate
          purpose: "Run the pre-enrollment security validation pass with fabricated practice data (actions start, status, answer, plan, artifact, check, qualify, submit, finish)."
          mutates: true
        - name: reach_status
          purpose: "The enrollment, current assignment, slices, package versions and outstanding receipts; returns a refused queued submission once."
          mutates: false
        - name: reach_receipts
          purpose: "Receipts newest first."
          mutates: false
        - name: reach_shape_check
          purpose: "Shape findings for the current slice, classified invisible or visible."
          mutates: false
        - name: reach_qualify
          purpose: "Prove the slice before submitting; returns the record and the attempt ladder's next rung."
          mutates: true
        - name: reach_preview
          purpose: "Start, stop, report or screenshot the local panel preview (panel slices only)."
          mutates: true
        - name: reach_attempts
          purpose: "Show the attempt ladder, or record the student's yes to keep trying after a hand."
          mutates: true
        - name: reach_submit
          purpose: "Ask the student, then submit the slice and wait for the receipt; with archive true save a ZIP of work instead; with partial true submit unqualified work for review."
          mutates: true
        - name: reach_raise_hand
          purpose: "Raise a hand with a summary, a request type and optional last step and what the student saw."
          mutates: true
        - name: reach_hand_status
          purpose: "A hand's state and reply, and a workaround to follow when the course server is already fixing the problem."
          mutates: false
        - name: reach_hello
          purpose: "The session-start greeting and context."
          mutates: true
        - name: reach_profile_show
          purpose: "The student's saved interview answers."
          mutates: false
        - name: reach_profile_save
          purpose: "Save the student's interview answers."
          mutates: true
        - name: reach_profile_forget
          purpose: "Delete the saved interview answers."
          mutates: true
        - name: reach_enroll
          purpose: "Explain how the student enrolls; it never enrolls and takes nothing."
          mutates: false
        - name: reach_sync
          purpose: "Fetch new packages and refresh workspaces."
          mutates: true
        - name: reach_check
          purpose: "Check the slice's code against the course and engineering rules."
          mutates: false
        - name: reach_checkpoint
          purpose: "Save, list, show, restore or recover snapshots of the slice's files."
          mutates: true
        - name: reach_plan
          purpose: "Save, update or show the slice plan and run its second-pass audit (audit_packet, audit_record, audit_show)."
          mutates: true
        - name: reach_passes_packet
          purpose: "The packet for one candidate-passes point."
          mutates: false
        - name: reach_passes_score
          purpose: "Score the candidates written for one point from evidence only."
          mutates: true
        - name: reach_passes_pick
          purpose: "Install the highest-confidence scored candidate and record the pick."
          mutates: true
        - name: reach_directive
          purpose: "The full text of one directive from the workspace rules table."
          mutates: false
        - name: reach_reference
          purpose: "List, show, search or list the links of the course reference material."
          mutates: false
        - name: reach_support
          purpose: "The fixed crisis message to give the student word for word; raises the wellbeing hand."
          mutates: true
        - name: reach_part
          purpose: "List own-part questions, or record one from the student's latest typed prompt."
          mutates: true
        - name: reach_transfer_request
          purpose: "Ask for a module move; returns rEach's own question until the student's captured yes, then sends the request."
          mutates: true
        - name: reach_modules
          purpose: "Show the student's modules or options, or choose them behind a lock-in question."
          mutates: true
        - name: reach_remember
          purpose: "Keep one durable thing learned about the student or their work."
          mutates: true
        - name: reach_recall
          purpose: "The profile, or the memories matching a query."
          mutates: false
        - name: reach_memory_forget
          purpose: "Forget remembered findings by id, or all of them after the student confirms."
          mutates: true
        - name: reach_next
          purpose: "The deterministic next step for the student."
          mutates: false
        - name: reach_import
          purpose: "Import a downloaded AI-app export: pick, export, status, cancel, list, next, done, search, show."
          mutates: true
        - name: reach_packet
          purpose: "Bring the work done in the offline sidecar folder into the workspace."
          mutates: true
        - name: reach_grade
          purpose: "The points recorded for the student for each assignment, and the total."
          mutates: false
        - name: reach_extra_credit
          purpose: "Turn in an extra-credit answer exactly as the student typed it."
          mutates: true
        - name: reach_extra_credit_list
          purpose: "List the extra credit turned in and its state."
          mutates: false
        - name: reach_feedback
          purpose: "Ask to send the instructors a feedback note; sends only after the student's captured yes."
          mutates: true
        - name: reach_feedback_list
          purpose: "List the feedback notes sent and their state."
          mutates: false
        - name: reach_debug
          purpose: "Turn debug mode on or off, show its state, or export a setup report."
          mutates: true
        - name: reach_doctor
          purpose: "The health check report for the agent to explain."
          mutates: false
        - name: reach_update
          purpose: "Report the installed version and update state, or start the updater in the background."
          mutates: true
        - name: reach_announcements
          purpose: "The instructors' announcements newest first."
          mutates: false
        - name: reach_test
          purpose: "The course test: status, open, questions, record an answer, submit."
          mutates: true
        - name: reach_setup
          purpose: "Codex setup: status, probe, configure behind a consent question, and harness move."
          mutates: true
        - name: reach_transcripts
          purpose: "Save a ZIP of the student's saved conversations (export) or delete the local copies (forget)."
          mutates: true
        - name: reach_storage
          purpose: "Report the memory size, or compact the saved course memory after the student's yes."
          mutates: true
        - name: reach_live
          purpose: "Live session with the instructors: status, request, wait, note, say, end."
          mutates: true
      source: lib/reach/mcp_bridge.rb
      standards: [STD-MESSAGES-LOADED, STD-ENROLL-NO-RELAY, STD-CONTROLS, STD-RUBY-BOOTSTRAP, STD-CODEX-PLUGIN-HOOKS]
  skills:
    - name: reach-assistant
      purpose: "Persona and greeting: who rEach is, how it talks, and how it starts every session. The body is the same text as agents/reach.md."
      source: skills/reach-assistant/SKILL.md
      audience: "The student's agent, at the start of every session."
    - name: reach-course
      purpose: "How to work on a student's slice under the instructors' rules: what to read first, owned files, directives and reference files."
      source: skills/reach-course/SKILL.md
      audience: "The student's agent, in every course workspace."
    - name: reach-submit
      purpose: "Submit a slice: qualify first, answer own-part questions, relay rEach's question, and tell the student about the receipt and the ZIP."
      source: skills/reach-submit/SKILL.md
      audience: "The student's agent, when the student wants to submit."
    - name: reach-help
      purpose: "Raise a hand or ask for a live session with an instructor; rEach raises the hand itself after three failed qualifications."
      source: skills/reach-help/SKILL.md
      audience: "The student's agent, when the student wants instructor help."
    - name: reach-build
      purpose: "Route a request to build or continue this week's step to the reach-feature flow."
      source: skills/reach-build/SKILL.md
      audience: "The student's agent."
    - name: reach-feature
      purpose: "The feature flow for one slice without git: read, plan with the student, save the plan, audit it, write scenarios, implement, qualify."
      source: skills/reach-feature/SKILL.md
      audience: "The student's agent, for new or changed behavior."
    - name: reach-fix
      purpose: "Route a failing check or a broken-behavior report to the reach-bug flow."
      source: skills/reach-fix/SKILL.md
      audience: "The student's agent."
    - name: reach-bug
      purpose: "The bug flow for one slice: name the failure exactly, reproduce it, make the smallest fix and prove it with the same run."
      source: skills/reach-bug/SKILL.md
      audience: "The student's agent, when a check or qualification fails."
    - name: reach-plan-audit
      purpose: "A second, independent pass that checks the saved plan against the released constraints before any code is written or qualified."
      source: skills/reach-plan-audit/SKILL.md
      audience: "The student's agent, after every plan save."
    - name: reach-passes
      purpose: "Write several candidate passes through different lenses at the plan, scenarios and code points, and let rEach choose by evidence."
      source: skills/reach-passes/SKILL.md
      audience: "The student's agent, where the student's input becomes a solution."
    - name: reach-checkpoint
      purpose: "Save, list, restore and recover snapshots of the slice's files; rEach also saves on every write."
      source: skills/reach-checkpoint/SKILL.md
      audience: "The student's agent, when the student says save, undo or that work is missing."
    - name: reach-feedback
      purpose: "Send the instructors a note that can wait; blocked students raise a hand instead."
      source: skills/reach-feedback/SKILL.md
      audience: "The student's agent."
    - name: reach-storage
      purpose: "Report and compact the memory rEach keeps on this computer, asking the student first."
      source: skills/reach-storage/SKILL.md
      audience: "The student's agent, when rEach says its memory is large."
    - name: reach-import
      purpose: "Bring history from another AI app's export into rEach and learn from it."
      source: skills/reach-import/SKILL.md
      audience: "The student's agent, when the student asks to import."
    - name: reach-sidecar
      purpose: "Bring work done in the offline sidecar folder into rEach."
      source: skills/reach-sidecar/SKILL.md
      audience: "The student's agent."
    - name: reach-uninstall
      purpose: "Remove rEach with one command the student decides on; the agent never deletes anything itself."
      source: skills/reach-uninstall/SKILL.md
      audience: "The student's agent, when the student asks to remove rEach."
    - name: design-taste-frontend
      purpose: "Anti-slop frontend direction for landing pages, portfolios and redesigns, shipped for panel work."
      source: skills/design-taste-frontend/SKILL.md
      audience: "The student's agent, on frontend work."
  hooks:
    - event: "SessionStart"
      command: 'sh "${CLAUDE_PLUGIN_ROOT}/exe/reach-run" hello'
      blocking: false
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Plugin hook: greet and give session context in every folder. reach-run starts the runtime install detached when Ruby is missing and never waits for it."
      source: hooks/hooks.json
      standards: [STD-HOOK-HARNESS, STD-HOOK-RESPONSIVE, STD-RUBY-BOOTSTRAP]
    - event: "UserPromptSubmit"
      command: 'sh "${CLAUDE_PLUGIN_ROOT}/exe/reach-run" gate enroll --harness claude-code'
      blocking: true
      timeout_s: 60
      harnesses: [claude-code]
      purpose: "Plugin hook: run the enrollment and sign-in flow from the typed answers, and block the prompt with a decision block while the student is not enrolled or signed in."
      source: hooks/hooks.json
      standards: [STD-SIGNIN-PLUGIN-HOOK, STD-CLAUDE-WINDOWS-HOOKS, STD-HOOK-HARNESS]
    - event: "Stop"
      command: 'sh "${CLAUDE_PLUGIN_ROOT}/exe/reach-run" hook response --harness claude-code'
      blocking: true
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Plugin hook: review the reply against the guided-learner policy and ask for a rewrite when it breaks one."
      source: hooks/hooks.json
      standards: [STD-GUIDED-LEARNER, STD-HOOK-HARNESS]
    - event: "SessionStart"
      command: 'ruby "${PLUGIN_ROOT}/exe/reach" hello'
      blocking: false
      timeout_s: 10
      harnesses: [codex]
      purpose: "Plugin hook for Codex, rendered from run_by_harness codex because Windows has no sh. On Codex it also runs the course session work."
      source: hooks/codex.json
      standards: [STD-HOOK-HARNESS, STD-CODEX-PLUGIN-HOOKS, STD-CODEX-HOOK-TRUST, STD-CODEX-WINDOWS-HOOKS]
    - event: "UserPromptSubmit"
      command: 'ruby "${PLUGIN_ROOT}/exe/reach" gate enroll --harness codex'
      blocking: true
      timeout_s: 60
      harnesses: [codex]
      purpose: "Plugin hook for Codex: enrollment and sign-in, plus the course prompt work, because Codex does not run a course folder's prompt hook. It blocks by printing a JSON decision block as its only output."
      source: hooks/codex.json
      standards: [STD-CODEX-PROMPT-JSON-BLOCK, STD-CODEX-HOOK-TRUST, STD-HOOK-GUARD]
    - event: "Stop"
      command: 'ruby "${PLUGIN_ROOT}/exe/reach" hook response --harness codex'
      blocking: true
      timeout_s: 10
      harnesses: [codex]
      purpose: "Plugin hook for Codex: the same response review as on Claude Code."
      source: hooks/codex.json
      standards: [STD-GUIDED-LEARNER, STD-HOOK-HARNESS]
    - event: "SessionStart"
      command: "reach gate session --harness claude-code"
      blocking: false
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Course folder hook written to .claude/settings.json: course session work. On Windows the command is wrapped as & quoted-ruby quoted-shim args; exit $LASTEXITCODE."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-CLAUDE-WINDOWS-HOOKS, STD-HOOK-RESPONSIVE]
    - event: "MessageDisplay"
      command: "reach hook display --harness claude-code"
      blocking: false
      timeout_s: 30
      harnesses: [claude-code]
      purpose: "Course folder hook: supply the reviewed display content of an assistant message; fails open."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-GUIDED-LEARNER]
    - event: "UserPromptSubmit"
      command: "reach gate prompt --harness claude-code"
      blocking: true
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Course folder hook: the prompt gate and the context added to each prompt."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-HOOK-GUARD, STD-COWORK-CODE-TAB]
    - event: "PreToolUse Write|Edit|MultiEdit|NotebookEdit"
      command: "reach gate write --harness claude-code"
      blocking: true
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Course folder hook: refuse writes outside the slice's owned files."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-HOOK-GUARD]
    - event: "PreToolUse Bash|PowerShell"
      command: "reach gate shell --harness claude-code"
      blocking: true
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Course folder hook: refuse forbidden shell commands."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-HOOK-GUARD, STD-NO-GIT-IN-WORKSPACE]
    - event: "PreToolUse Read|Glob|Grep|NotebookRead|LS|WebFetch|WebSearch"
      command: "reach gate read --harness claude-code"
      blocking: true
      timeout_s: 10
      harnesses: [claude-code]
      purpose: "Course folder hook: refuse reads outside the course workspace and of private paths. The same settings file also denies Read of the vault and key folders."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-HOOK-GUARD, STD-VAULT-PRIVATE]
    - event: "PostToolUse Write|Edit|MultiEdit"
      command: "reach check --format agent"
      blocking: false
      timeout_s: 60
      harnesses: [claude-code]
      purpose: "Course folder hook, slice and root folders only: check the written file against the rules and return findings to the agent."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-CHECK-BEFORE-SUBMIT]
    - event: "PostToolUse Write|Edit|MultiEdit|NotebookEdit"
      command: "reach transcript code --harness claude-code"
      blocking: false
      timeout_s: 15
      harnesses: [claude-code]
      purpose: "Course folder hook: record the code the agent wrote in the transcript."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-TRANSCRIPT]
    - event: "Stop"
      command: "reach hook stop --harness claude-code"
      blocking: true
      timeout_s: 30
      harnesses: [claude-code]
      purpose: "Course folder hook: record the turn, queue issue reports, review the reply."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-TRANSCRIPT, STD-GUIDED-LEARNER]
    - event: "Stop (async wake)"
      command: "reach live watch --harness claude-code"
      blocking: false
      timeout_s: 900
      harnesses: [claude-code]
      purpose: "Course folder hook, only when live wake is enabled and Claude Code is 2.1.288 or newer: runs async with asyncRewake so an instructor message can wake the chat."
      source: lib/reach/harness.rb Harness.wake_entry
      standards: [STD-LIVE]
    - event: "SessionEnd"
      command: "reach hook stop --final --harness claude-code"
      blocking: false
      timeout_s: 30
      harnesses: [claude-code]
      purpose: "Course folder hook: close the transcript for the session."
      source: lib/reach/harness.rb Harness.claude_settings_content
      standards: [STD-TRANSCRIPT]
    - event: "PreToolUse apply_patch|Write|Edit"
      command: "reach gate write --harness codex"
      blocking: true
      timeout_s: 10
      harnesses: [codex]
      purpose: "Course folder hook written to .codex/hooks.json: refuse writes outside the owned files. Codex runs it only once the student has trusted it, which reach codex configure arranges."
      source: lib/reach/harness.rb Harness.codex_hooks_content
      standards: [STD-CODEX-HOOK-TRUST, STD-CODEX-WINDOWS-HOOKS, STD-HOOK-GUARD]
    - event: "PreToolUse Bash|shell|exec_command"
      command: "reach gate shell --harness codex"
      blocking: true
      timeout_s: 10
      harnesses: [codex]
      purpose: "Course folder hook: refuse forbidden shell commands."
      source: lib/reach/harness.rb Harness.codex_hooks_content
      standards: [STD-CODEX-HOOK-TRUST, STD-HOOK-GUARD]
    - event: "PreToolUse view_image"
      command: "reach gate read --harness codex"
      blocking: true
      timeout_s: 10
      harnesses: [codex]
      purpose: "Course folder hook: refuse image reads outside the workspace."
      source: lib/reach/harness.rb Harness.codex_hooks_content
      standards: [STD-CODEX-HOOK-TRUST, STD-HOOK-GUARD]
    - event: "PostToolUse apply_patch|Write|Edit"
      command: "reach check --format agent"
      blocking: false
      timeout_s: 60
      harnesses: [codex]
      purpose: "Course folder hook, slice and root folders only: check the patched files."
      source: lib/reach/harness.rb Harness.codex_hooks_content
      standards: [STD-CODEX-PATCH-CHECK, STD-CODEX-HOOK-TRUST]
    - event: "PostToolUse apply_patch|Write|Edit"
      command: "reach transcript code --harness codex"
      blocking: false
      timeout_s: 15
      harnesses: [codex]
      purpose: "Course folder hook: record the code in the transcript."
      source: lib/reach/harness.rb Harness.codex_hooks_content
      standards: [STD-TRANSCRIPT, STD-CODEX-HOOK-TRUST]
    - event: "Stop"
      command: "reach hook stop --harness codex"
      blocking: true
      timeout_s: 30
      harnesses: [codex]
      purpose: "Course folder hook: record the turn and review the reply. The course folder carries no SessionStart or UserPromptSubmit hook for Codex; the plugin's two hooks carry that work."
      source: lib/reach/harness.rb Harness.codex_hooks_content
      standards: [STD-CODEX-HOOK-TRUST, STD-TRANSCRIPT]
    - event: "on_session_start"
      command: "reach gate session --harness hermes"
      blocking: false
      timeout_s: 10
      harnesses: [hermes]
      purpose: "Hermes profile hook, written into the profile's config file (a .reach-backup copy is kept): course session work."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-HOOK-HARNESS]
    - event: "pre_llm_call (enroll)"
      command: "reach gate enroll --harness hermes"
      blocking: true
      timeout_s: 60
      harnesses: [hermes]
      purpose: "Hermes hook: the enrollment and sign-in flow before each model call."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-SIGNIN-TERMINAL-RESET]
    - event: "pre_llm_call (prompt)"
      command: "reach gate prompt --harness hermes"
      blocking: true
      timeout_s: 15
      harnesses: [hermes]
      purpose: "Hermes hook: the prompt gate and context."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-HOOK-GUARD]
    - event: "pre_tool_call write_file|patch|execute_code"
      command: "reach gate write --harness hermes"
      blocking: true
      timeout_s: 10
      harnesses: [hermes]
      purpose: "Hermes hook, fail closed: refuse writes outside the owned files."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-HOOK-GUARD]
    - event: "pre_tool_call terminal"
      command: "reach gate shell --harness hermes"
      blocking: true
      timeout_s: 10
      harnesses: [hermes]
      purpose: "Hermes hook, fail closed: refuse forbidden shell commands."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-HOOK-GUARD]
    - event: "pre_tool_call read_file|search_files|list_files|list_directory|web_search|web_extract|browser_.*"
      command: "reach gate read --harness hermes"
      blocking: true
      timeout_s: 10
      harnesses: [hermes]
      purpose: "Hermes hook, fail closed: refuse reads outside the course workspace."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-HOOK-GUARD]
    - event: "post_tool_call"
      command: "reach transcript code --harness hermes"
      blocking: false
      timeout_s: 15
      harnesses: [hermes]
      purpose: "Hermes hook: record the code in the transcript."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-TRANSCRIPT]
    - event: "post_llm_call"
      command: "reach hook stop --harness hermes"
      blocking: false
      timeout_s: 30
      harnesses: [hermes]
      purpose: "Hermes hook: record the turn."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-TRANSCRIPT]
    - event: "on_session_end"
      command: "reach hook stop --final --harness hermes"
      blocking: false
      timeout_s: 30
      harnesses: [hermes]
      purpose: "Hermes hook: close the transcript."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-TRANSCRIPT]
    - event: "pre_verify"
      command: "reach check --format hermes"
      blocking: false
      timeout_s: 60
      harnesses: [hermes]
      purpose: "Hermes hook: check the slice before the agent claims it is done."
      source: lib/reach/harness.rb Harness.hermes_hooks_content
      standards: [STD-CHECK-BEFORE-SUBMIT]
    - event: "none (rules file only)"
      command: "reach hello --harness antigravity --format text"
      blocking: false
      harnesses: [antigravity]
      purpose: "Antigravity runs no rEach hooks. The agent is told by GEMINI.md and rules/reach.md to run this command at session start and to ask the student itself before submitting, so enrollment and gates rely on the terminal and the agent's compliance."
      source: rules/reach.md
      standards: [STD-NOHOOK-ENROLL, STD-HARNESS-VERIFIED]
    - event: "pre-push"
      command: "sh .githooks/pre-push"
      blocking: true
      harnesses: [git]
      purpose: "Maintainer clone only: run tools/policy.rb check and the release gate before a release push."
      source: .githooks/pre-push
      standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE, STD-SECURITY-AUDIT-MODE, STD-STUDENT-TREE]
    - event: "commit-msg"
      command: "sh .githooks/commit-msg"
      blocking: false
      harnesses: [git]
      purpose: "Maintainer clone only: name the open course-server issues a commit fixes."
      source: .githooks/commit-msg
      standards: [STD-ISSUE-CLOSEOUT-HOOK]
    - event: "post-checkout"
      command: "sh .githooks/post-checkout"
      blocking: false
      harnesses: [git]
      purpose: "Maintainer clone only: link the checkout to the maintainer's session archive when that tool is present; always exits 0."
      source: .githooks/post-checkout
      standards: [STD-STUDENT-TREE]
  outbound:
    - id: O1
      system: "Teach: enrollment routes"
      protocol: "HTTPS JSON. POST /api/v1/enroll (and the older /api/v1/enrol), GET /api/v1/enrollment/preview, POST /api/v1/enroll/attempts, POST /api/v1/enroll/attempts/{attempt_id}/steps, POST /api/v1/enroll/instructor."
      purpose: "Enroll an install, preview a course by its code, run the queued enrollment and password-reset attempt steps, and let an instructor persona enroll. The enroll route is unsigned; attempt steps are signed with the attempt identity."
      auth: "Unsigned for enroll and preview; attempt steps carry X-Reach-Attempt and a signature by the attempt key."
      config: "config.yml teach.url, reach enroll --teach-url, install.yml teach_url in the rEach home"
      failure: "A network failure raises the Teach-link-lost notice and leaves the student locked; the enrollment outbox keeps attempt steps for retry."
      rstack_wire: false
      standards: [STD-WIRE-CONTRACT, STD-ENROLL-LOCKDOWN, STD-PASSWORD-RESET-QUEUE, STD-TEACH-URL]
    - id: O2
      system: "Teach: security validation routes"
      protocol: "HTTPS JSON. POST /api/v1/validation, POST /api/v1/validation/:id/qualify, POST /api/v1/validation/:id/submit, GET /api/v1/validation/:id/receipt."
      purpose: "Run the pre-enrollment validation pass and fetch its signed receipt, which enrollment verifies and consumes."
      auth: "Creation is anonymous and course-code limited; later calls are signed with the attempt key and X-Reach-Attempt."
      config: "The course code and the configured Teach URL"
      failure: "Any failure leaves the phase blocked with a fixed message that tells the student to wait and contact the instructor; enrollment does not continue."
      rstack_wire: false
      standards: [STD-WIRE-CONTRACT]
    - id: O3
      system: "Teach: status, packages and course data"
      protocol: "HTTPS JSON, signed GETs. /api/v1/status, /api/v1/packages/:kind (conditional, 304 allowed), /api/v1/revision, /api/v1/controls, /api/v1/modules, /api/v1/instructor/keyring, /api/v1/announcements, /api/v1/directives/<OPCODE>, /api/v1/grades, /api/v1/tests/current, /api/v1/health (unsigned)."
      purpose: "Refresh the enrollment and assignment state, fetch signed course packages and rules, poll for a rebuilt package, read the course controls, modules, instructor keys, announcements, directives, grades and the test offer, and probe health."
      auth: "Every route but health is signed with the install key (X-Teach-Install, X-Teach-Timestamp, X-Teach-Nonce, X-Teach-Signature, X-Reach-Version, X-Reach-Env)."
      config: "install.yml teach_url; REACH_OFFLINE"
      failure: "Hooks never wait on these; a failure marks the link lost and the cached status is used. A 4xx revoked answer marks the install revoked."
      rstack_wire: false
      standards: [STD-WIRE-CONTRACT, STD-TEACH-SUBSCRIBE, STD-GATE-REPLACED, STD-HEALTH, STD-CONTROLS, STD-ANNOUNCEMENTS]
    - id: O4
      system: "Teach: submissions, qualification and receipts"
      protocol: "HTTPS JSON, signed. POST /api/v1/submissions, GET /api/v1/submissions/:id, POST /api/v1/qualifications, GET /api/v1/qualifications/:id, POST /api/v1/qualify-faults, GET /api/v1/receipts, POST /api/v1/receipts/:receipt_id/acknowledgment, POST /api/v1/extra-credit, GET /api/v1/extra-credit."
      purpose: "Send the student's work for ingest and poll for its receipt, run and poll the server qualification, report qualification faults, list receipts and acknowledge them, and redeem extra credit."
      auth: "Signed with the install key; mutating calls send an Idempotency-Key."
      config: "install.yml teach_url; the submission and hand outboxes under the rEach home"
      failure: "A submission that cannot be sent is saved in the outbox and sent at the next sync; Teach can still refuse or hold it, so only the receipt means received. Qualification faults are queued."
      rstack_wire: false
      standards: [STD-SUBMIT-APPROVAL, STD-QUALIFY-FAULTS, STD-QUALIFY-REMOTE-BUDGET, STD-EXTRA-CREDIT]
    - id: O5
      system: "Teach: hands, live sessions, feedback and reports"
      protocol: "HTTPS JSON, signed. POST /api/v1/hands, GET /api/v1/hands/:id, POST /api/v1/live, GET /api/v1/live, POST /api/v1/live/:id/consent, POST /api/v1/live/:id/messages, POST /api/v1/live/:id/end, POST /api/v1/feedback, GET /api/v1/feedback, POST /api/v1/debug, POST /api/v1/integrity, POST /api/v1/holdings, POST /api/v1/progress, POST /api/v1/transcripts."
      purpose: "Raise and follow hands, run a live session, send feedback, send debug events, integrity and holdings reports, first-reached progress marks and the recorded conversation."
      auth: "Signed with the install key; the live route group has its own token bucket."
      config: "install.yml teach_url; debug mode; the live and transcript settings in config.yml"
      failure: "Each sender queues locally and retries at the next sync or tick; the student is told when a hand is queued. Hooks use short bounded requests only."
      rstack_wire: false
      standards: [STD-HAND-TYPES, STD-LIVE, STD-FEEDBACK, STD-DEBUG-MODE, STD-HOLDINGS, STD-PROGRESS, STD-TRANSCRIPT, STD-ISSUES]
    - id: O6
      system: "Teach: modules, transfers, passwords and withdrawal"
      protocol: "HTTPS JSON, signed. POST /api/v1/modules/selection, POST /api/v1/transfers, GET /api/v1/transfers/:id, POST /api/v1/password/verify, GET /api/v1/password/reset, POST /api/v1/password/reset, POST /api/v1/installs/withdraw, plus the test routes POST /api/v1/tests/<control_id>/open, POST /api/v1/tests/attempts/<attempt_id>/answers and POST /api/v1/tests/attempts/<attempt_id>/submit."
      purpose: "Lock in modules, request a module move, verify or reset the student's password, tell Teach the install is withdrawn at uninstall, and run the timed course test."
      auth: "Signed with the install key; Idempotency-Key on mutating calls."
      config: "install.yml teach_url; reach uninstall --no-teach skips the withdrawal"
      failure: "Module choices and transfers are queued and flushed later; a password check makes one bounded request with no retry; the withdrawal failure is reported in the uninstall closing text."
      rstack_wire: false
      standards: [STD-MODULES-LOCK-SYNC, STD-SIGNIN-PASSWORD, STD-UNINSTALL, STD-TEST-MODE]
    - id: O7
      system: "Request signing, pacing and protection (all Teach calls)"
      protocol: "Reach::Client over Net::HTTP"
      purpose: "Every call is HTTPS (plain http only to loopback), signed per specs/wire.yml, limited by a shared token bucket, retried with capped jittered backoff on 408, 425, 429 and 5xx, and cut off by a circuit breaker after repeated failures."
      auth: "RSA-PSS signature by the install key over method, target, timestamp, nonce and body digest."
      config: "Connect 5 s and read 30 s by default (2 s for quick hook calls), at most 4 retries, a 64 MB response cap, a request log with query values redacted"
      failure: "Raises NetworkError or Refused; callers queue, show the Teach-link-lost notice, or degrade, and a certificate failure is reported separately."
      rstack_wire: false
      standards: [STD-WIRE-CONTRACT, STD-REQUEST-LOG, STD-CA-ROOTS, STD-TEACH-LINK]
    - id: O8
      system: "GitHub releases and repository"
      protocol: "HTTPS GET via Net::HTTP: the releases API, the git smart-HTTP tag listing, and the commit archive ZIP of the repository."
      purpose: "Find a newer stable or canary rEach, verify the release's commit, download that archive, and stage it for the swap."
      auth: "None (public repository)."
      config: "REACH_UPDATE_REPOSITORY, REACH_UPDATE_CHANNEL, REACH_UPDATE_DISABLE, REACH_OFFLINE, update.* in config.yml"
      failure: "Retries with backoff and an API block-until time; a release without a verified commit is not downloaded, and the update is simply skipped."
      rstack_wire: false
      standards: [STD-AUTO-UPDATE, STD-STABLE-CADENCE, STD-APP-COPY-UPDATE]
    - id: O9
      system: "Runtime and SDK kit release assets"
      protocol: "HTTPS download of a manifest and bundles from pinned release tags, checked against exe/runtime-pins or the manifest for size and sha256"
      purpose: "Install the Ruby, gems and Chrome kit and the SDK kit when the computer lacks them."
      auth: "None."
      config: "REACH_RUNTIME_DISABLE, REACH_SDK_DISABLE, REACH_OFFLINE, REACH_RUNTIME_ALLOW_UNPINNED, REACH_SDK_ALLOW_UNPINNED"
      failure: "A mismatch is refused and nothing is used; the bootstrap launcher never makes a hook wait and logs to a bootstrap log."
      rstack_wire: true
      standards: [STD-RUBY-BOOTSTRAP, STD-KIT-LOCK-MATCH, STD-KIT-CLEAN-ENV]
    - id: O10
      system: "AI app command lines (claude, codex, agy, hermes)"
      protocol: "Subprocess: claude plugin marketplace add|update|remove, claude plugin install|update, codex plugin marketplace add|list|remove, codex plugin add, agy plugin install, hermes profile create and hermes -p reach config path; --version probes; Kernel.exec to launch the app."
      purpose: "Install and update rEach through each app's own plugin command, detect versions, and launch the app in a workspace."
      config: "CODEX_CLI_PATH, PATH, the harness choice flags"
      failure: "A failed command is reported by setup with the app's own error text and changes nothing else; a missing app is skipped."
      rstack_wire: true
      standards: [STD-PORTS-ONLY, STD-HARNESS-MOVE, STD-CODEX-SETUP]
    - id: O11
      system: "rplugin ports and the SDK helper"
      protocol: "In-process Rplugin::Ports when present, otherwise a child ruby process running reach brain with the SDK kit's rplugin and corpus libraries"
      purpose: "Reach the secrets, state, events, corpus and schedule ports, and admit, erase and query the student's local brain and the course corpus."
      config: "Reach.ports, REACH_BRAIN_PLANES_DISABLE, brain.planes in config.yml"
      failure: "Without ports the brain features stay off and rEach keeps its own records under its home; errors are logged and ignored."
      rstack_wire: true
      standards: [STD-PORTS-ONLY, STD-BRAIN, STD-BRAIN-PLANES, STD-COURSE-CORPUS]
    - id: O12
      system: "Course checking tools"
      protocol: "Subprocesses: bundle install and bundle exec cucumber --format json in the slice run folder, the shape checker (dovetail), ruby -wc and ruby -c syntax checks, and ssh-keygen -Y verify for the sidecar folder signature"
      purpose: "Run the local scenario checks, the shape check and syntax checks, and verify a sidecar packet's signature."
      config: "The runtime kit or the Ruby on PATH; REACH_CHROME and CUPRITE_NO_SANDBOX are set for the browser"
      failure: "A tool that cannot run turns into a qualify-local-unable result with a message, never a pass."
      rstack_wire: false
      standards: [STD-QUALIFY-NOBROWSER, STD-QUALIFY-LOCAL-UNABLE, STD-PACKET-IMPORT, STD-KIT-CLEAN-ENV]
    - id: O13
      system: "Local preview server and headless Chrome"
      protocol: "A detached ruby process running lib/reach/kit/preview_server.rb on 127.0.0.1, probed with a loopback HTTP GET; lib/reach/kit/preview_shot.rb drives Chrome for a screenshot"
      purpose: "Show the panel the student builds in their own browser and take a screenshot with the console errors."
      config: "REACH_PREVIEW_PORT, REACH_PREVIEW_WORKSPACE, REACH_PREVIEW_OWNED, REACH_PREVIEW_IDLE_S, REACH_PREVIEW_KEY"
      failure: "A start that does not answer in time is killed and reported as a preview failure."
      rstack_wire: false
      standards: [STD-PREVIEW]
    - id: O14
      system: "Operating system scheduler"
      protocol: "Subprocess: schtasks /Create and /Delete (Windows), launchctl bootstrap, bootout, load and unload (macOS), systemctl --user enable, disable and daemon-reload (Linux)"
      purpose: "Install or remove the user-level job that runs reach subscribe tick."
      config: "reach subscribe install and uninstall; the systemd user directory override"
      failure: "Recorded in the subscribe state as not installed with the reason; no hook or command fails because of it."
      rstack_wire: false
      standards: [STD-TEACH-SUBSCRIBE]
    - id: O15
      system: "Desktop helpers"
      protocol: "Subprocess: open, xdg-open or rundll32 for a local URL; notify-send, osascript or powershell for notifications; zenity, kdialog, osascript or powershell for the file and folder picker; a terminal emulator for reach enroll --window"
      purpose: "Open the preview in the browser, notify the student, pick an export, and open a terminal window for sign-in."
      config: "Detected on PATH"
      failure: "A missing helper returns nil or false and the caller prints the manual step."
      rstack_wire: false
      standards: [STD-NOHOOK-ENROLL, STD-EXPORT-IMPORT]
    - id: O16
      system: "Computer and environment readers"
      protocol: "Subprocess: uname, sw_vers, ver, reg query, ioreg, df, ldd, lsof, powershell Get-PSDrive, and reads of the machine id files"
      purpose: "Build the install fingerprint and the environment header, measure free space, and check the runtime kit."
      config: "Short timeouts per probe"
      failure: "A probe that fails yields an empty value; the fingerprint falls back as STD-FINGERPRINT-OS-USER describes."
      rstack_wire: false
      standards: [STD-FINGERPRINT-OS-USER, STD-FINGERPRINT-SALT-KEPT, STD-ENV-REPORT]
    - id: O17
      system: "Uninstall handover script"
      protocol: "Subprocess: a copy of scripts/reach-uninstall run from the student's home with a prepared JSON handover, waiting up to 900 s"
      purpose: "Remove rEach's folders and settings after the student's yes and report what is left for the student."
      config: "reach uninstall flags"
      failure: "A timeout or failure is reported in the closing text and nothing of the student's work is removed."
      rstack_wire: false
      standards: [STD-UNINSTALL]
    - id: O18
      system: "Git in the maintainer clone"
      protocol: "Subprocess: git remote get-url --push origin and git config --get core.hooksPath, run by reach doctor"
      purpose: "Report when a maintainer's clone pushes without the release gate (R-DOC-GATE)."
      config: "Only when tools/release_gate/gate.rb exists in the install root"
      failure: "Any error returns no finding."
      rstack_wire: false
      standards: [STD-RELEASE-GATE, STD-STUDENT-TREE]
    - id: O19
      system: "Live action worker"
      protocol: "Detached ruby exe/reach subprocess capturing its output to a file under the live state folder"
      purpose: "Carry out an instructor-approved live action (for example the sandbox probe or a codex configure) and return its output."
      config: "Live settings in config.yml"
      failure: "An action that exceeds its timeout is abandoned and reported as refused."
      rstack_wire: false
      standards: [STD-LIVE, STD-LIVE-DIAGNOSIS]
configuration:
  env:
    - name: REACH_HOME
      kind: path
      effect: "Sets the Reach home root directory instead of the resolved default; the launcher also derives the home anchor from its parent."
      read_by: "Reach::Paths.root, exe/reach-run"
      source: lib/reach/paths.rb
      standards: [STD-HOME-IN-WORKSPACE]
    - name: REACH_WORKSPACE_ROOT
      kind: path
      default: "~/reach-work"
      effect: "Sets the course workspace base directory; the home anchor and the new home location follow it."
      read_by: "Reach::Paths.workspace_base, exe/reach-run"
      source: lib/reach/paths.rb
      standards: [STD-WORKSPACE-LAYOUT, STD-HOME-IN-WORKSPACE]
    - name: REACH_CHECKPOINT_MIRROR
      kind: path
      effect: "Overrides the directory that holds the checkpoint mirror."
      read_by: "Reach::Paths.checkpoint_mirror_dir, scripts/reach-uninstall"
      source: lib/reach/paths.rb
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - name: REACH_DOWNLOADS_DIR
      kind: path
      effect: "Overrides the folder where submission archives and exports are written for the student."
      read_by: "Reach::Archive.downloads_dir"
      source: lib/reach/archive.rb
      standards: [STD-SUBMIT-ARCHIVE]
    - name: REACH_REFERENCE_DIR
      kind: path
      effect: "Overrides the vault directory that holds the sealed course reference blobs."
      read_by: "Reach::Reference.dir"
      source: lib/reach/reference.rb
      standards: [STD-VAULT-PRIVATE]
    - name: REACH_SIDECAR
      kind: path
      effect: "Overrides the location of the seal sidecar file."
      read_by: "Reach::Sidecar.path, scripts/reach-uninstall"
      source: lib/reach/sidecar.rb
      standards: [STD-SEAL-INVISIBLE]
    - name: REACH_SYSTEMD_USER_DIR
      kind: path
      effect: "Overrides the systemd user unit directory used for the background subscribe timer."
      read_by: "Reach::Subscribe, scripts/reach-uninstall"
      source: lib/reach/subscribe.rb
      standards: [STD-TEACH-SUBSCRIBE]
    - name: REACH_CHROME
      kind: path
      effect: "Points at a Chrome or Chromium executable for preview screenshots and the suite browser."
      read_by: "Reach::CLI, Reach::OsInfo, Reach::Suite, Reach::Kit::PreviewShot"
      source: lib/reach/os_info.rb
    - name: REACH_RUBY
      kind: path
      effect: "Names the Ruby executable the launcher uses when it is executable."
      read_by: "exe/reach-run, Reach::Diagnose"
      source: exe/reach-run
    - name: REACH_TEACH_URL
      kind: setting
      effect: "Overrides the Teach base URL; otherwise the config file, the baked URL file, and the built-in default apply in that order."
      read_by: "Reach::Runtime.default_teach_url"
      source: lib/reach/runtime.rb
      standards: [STD-TEACH-URL]
    - name: REACH_OFFLINE
      kind: kill_switch
      effect: "When set to 1, Teach calls, runtime and SDK downloads, update checks, and Codex network setup are skipped or refused."
      read_by: "Reach::Client, Reach::CLI, Reach::RuntimeKit, Reach::SdkKit, Reach::CodexSetup, exe/reach-run"
      source: lib/reach/client.rb
    - name: REACH_RUNTIME_DISABLE
      kind: kill_switch
      effect: "When set to 1, the Ruby and Chromium runtime download is refused and installs must come from a folder."
      read_by: "Reach::RuntimeKit, Reach::SdkKit, exe/reach-run"
      source: lib/reach/runtime_kit.rb
      standards: [STD-RUBY-BOOTSTRAP]
    - name: REACH_RUNTIME_ALLOW_UNPINNED
      kind: setting
      effect: "When set to 1, a runtime install is allowed from a build that carries no runtime pin."
      read_by: "Reach::RuntimeKit"
      source: lib/reach/runtime_kit.rb
      standards: [STD-RUBY-BOOTSTRAP]
    - name: REACH_SDK_DISABLE
      kind: kill_switch
      effect: "When set to 1, the SDK download is refused."
      read_by: "Reach::SdkKit"
      source: lib/reach/sdk_kit.rb
    - name: REACH_SDK_ALLOW_UNPINNED
      kind: setting
      effect: "When set to 1, an SDK install is allowed from a build that carries no SDK pin."
      read_by: "Reach::SdkKit"
      source: lib/reach/sdk_kit.rb
    - name: REACH_INSTALL_KILL_SWITCH
      kind: kill_switch
      effect: "When set to 1, the installer refuses to download an archive and accepts only a local one."
      read_by: "scripts/reach-install"
      source: scripts/reach-install
    - name: REACH_UNINSTALL_KILL_SWITCH
      kind: kill_switch
      effect: "When set to 1, the uninstaller refuses to run."
      read_by: "Reach::Uninstall, scripts/reach-uninstall"
      source: lib/reach/uninstall.rb
      standards: [STD-UNINSTALL]
    - name: REACH_UNINSTALL_TELL_TEACH
      kind: setting
      effect: "When set to 0, the uninstaller does not notify Teach that the install is being removed."
      read_by: "Reach::Uninstall"
      source: lib/reach/uninstall.rb
      standards: [STD-UNINSTALL]
    - name: REACH_UPDATE_CHANNEL
      kind: setting
      default: "stable"
      effect: "Selects the update channel, stable or canary; an unknown value falls back to stable."
      read_by: "Reach::Update.channel"
      source: lib/reach/update.rb
      standards: [STD-STABLE-CADENCE, STD-AUTO-UPDATE]
    - name: REACH_UPDATE_REPOSITORY
      kind: setting
      effect: "Overrides the repository that update checks and downloads follow."
      read_by: "Reach::Update.config"
      source: lib/reach/update.rb
      standards: [STD-AUTO-UPDATE]
    - name: REACH_UPDATE_DISABLE
      kind: kill_switch
      effect: "When set to 1, automatic update checks are switched off."
      read_by: "Reach::Update"
      source: lib/reach/update.rb
      standards: [STD-AUTO-UPDATE]
    - name: REACH_CODEX_SETUP
      kind: kill_switch
      effect: "When set to 0, the Codex setup and the installer's Codex step are skipped."
      read_by: "Reach::CodexSetup, scripts/reach-install"
      source: lib/reach/codex_setup.rb
      standards: [STD-CODEX-SETUP]
    - name: REACH_HARNESS
      kind: setting
      effect: "Names the harness the current process runs under; it feeds hand context, storage and submit decisions, and session resolution."
      read_by: "Reach::Hands, Reach::Storage, Reach::Submit, Reach::Support"
      source: lib/reach/support.rb
    - name: REACH_MODEL
      kind: setting
      effect: "Records the model name in the environment block of a hand raised to Teach."
      read_by: "Reach::Hands"
      source: lib/reach/hands.rb
    - name: REACH_HOOK_GUARD_DISABLE
      kind: kill_switch
      effect: "When set to 1, the check that hooks are alive before work proceeds is turned off."
      read_by: "Reach::HookLiveness"
      source: lib/reach/hook_liveness.rb
      standards: [STD-HOOK-GUARD]
    - name: REACH_KIT_FALLBACK
      kind: setting
      effect: "When set to 0, the fallback to the kit Ruby for crypto is disabled."
      read_by: "Reach::CryptoProbe, Reach::Diagnose"
      source: lib/reach/crypto_probe.rb
      standards: [STD-CRYPTO-FALLBACK]
    - name: REACH_KIT_REEXEC
      kind: internal
      effect: "Marks a process that was already re-executed under the kit Ruby so it does not re-execute again."
      read_by: "Reach::CryptoProbe, Reach::Diagnose"
      source: lib/reach/crypto_probe.rb
      standards: [STD-CRYPTO-FALLBACK]
    - name: REACH_WINDOWLESS
      kind: internal
      effect: "Marks a background subscribe process that was relaunched without a console window."
      read_by: "Reach::Subscribe"
      source: lib/reach/subscribe.rb
    - name: REACH_ASSIGNMENT_CONTEXT
      kind: kill_switch
      effect: "When set to 0, the assignment context block is no longer added to the agent's view."
      read_by: "Reach::AssignmentContext"
      source: lib/reach/assignment_context.rb
      standards: [STD-ASSIGNMENT-CONTEXT]
    - name: REACH_AUTOSAVE
      kind: kill_switch
      effect: "When set to 0, checkpoint autosave is off regardless of the setting."
      read_by: "Reach::Checkpoint"
      source: lib/reach/checkpoint.rb
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - name: REACH_BRAIN_PLANES_DISABLE
      kind: kill_switch
      effect: "When set to 1, brain planes are off and the brain works in spool mode."
      read_by: "Reach::BrainPlanes"
      source: lib/reach/brain_planes.rb
      standards: [STD-BRAIN-PLANES]
    - name: REACH_BRAIN_PLANES_CHILD
      kind: internal
      effect: "Marks the child process that runs a brain plane so it does not start planes again."
      read_by: "Reach::BrainPlanes"
      source: lib/reach/brain_planes.rb
      standards: [STD-BRAIN-PLANES]
    - name: REACH_DEBUG
      kind: setting
      effect: "When non-empty, brain spool records are also echoed to standard error."
      read_by: "Reach::BrainSpool"
      source: lib/reach/brain_spool.rb
      standards: [STD-BRAIN]
    - name: REACH_ENV_REPORT_DISABLE
      kind: kill_switch
      effect: "When set to 1, the environment report headers sent with requests are omitted."
      read_by: "Reach::Environment, Reach::QualifyFaults"
      source: lib/reach/environment.rb
      standards: [STD-ENV-REPORT]
    - name: REACH_ISSUES_DISABLE
      kind: kill_switch
      effect: "When set to 1, issue reporting to Teach is off."
      read_by: "Reach::Issues"
      source: lib/reach/issues.rb
      standards: [STD-ISSUES]
    - name: REACH_LIVE_DISABLE
      kind: kill_switch
      effect: "When set to 1, live sessions with the instructor are off."
      read_by: "Reach::Live"
      source: lib/reach/live.rb
      standards: [STD-LIVE]
    - name: REACH_PROGRESS
      kind: kill_switch
      effect: "When set to 0, progress reporting is off."
      read_by: "Reach::Progress"
      source: lib/reach/progress.rb
      standards: [STD-PROGRESS]
    - name: REACH_QUALIFY_FAULTS_DISABLE
      kind: kill_switch
      effect: "When set to 1, recording of qualification faults is off."
      read_by: "Reach::QualifyFaults"
      source: lib/reach/qualify_faults.rb
      standards: [STD-QUALIFY-FAULTS]
    - name: REACH_SETUP_LOG
      kind: kill_switch
      effect: "When set to 0, the setup log is not written; the uninstaller sets it to 0 for its own run."
      read_by: "Reach::SetupLog, Reach::Uninstall, scripts/reach-install"
      source: lib/reach/setup_log.rb
      standards: [STD-SETUP-LOG]
    - name: REACH_SUBSCRIBE
      kind: kill_switch
      effect: "When set to 0, the Teach subscribe background check is switched off."
      read_by: "Reach::Subscribe"
      source: lib/reach/subscribe.rb
      standards: [STD-TEACH-SUBSCRIBE]
    - name: REACH_VALIDATION_DISABLE
      kind: kill_switch
      effect: "When set to 1, the security validation pass is blocked."
      read_by: "Reach::Validation"
      source: lib/reach/validation.rb
    - name: REACH_PERSONA
      kind: internal
      effect: "Set empty in the validation worker environment so the worker runs without a persona."
      read_by: "Reach::Validation"
      source: lib/reach/validation.rb
      standards: [STD-INSTRUCTOR-PERSONA]
    - name: REACH_PREVIEW_PORT
      kind: internal
      effect: "Passes the chosen port to the preview server process."
      read_by: "Reach::Preview, Reach::Kit::PreviewServer"
      source: lib/reach/kit/preview_server.rb
      standards: [STD-PREVIEW]
    - name: REACH_PREVIEW_KEY
      kind: secret_ref
      effect: "Passes the per-run access key to the preview server process; its value is generated per run."
      read_by: "Reach::Preview, Reach::Kit::PreviewServer"
      source: lib/reach/kit/preview_server.rb
      standards: [STD-PREVIEW]
    - name: REACH_PREVIEW_OWNED
      kind: internal
      effect: "Passes the JSON list of files the preview may serve to the preview server process."
      read_by: "Reach::Preview, Reach::Kit::PreviewServer"
      source: lib/reach/kit/preview_server.rb
      standards: [STD-PREVIEW]
    - name: REACH_PREVIEW_WORKSPACE
      kind: internal
      effect: "Passes the workspace directory to the preview server process."
      read_by: "Reach::Preview, Reach::Kit::PreviewServer"
      source: lib/reach/kit/preview_server.rb
      standards: [STD-PREVIEW]
    - name: REACH_PREVIEW_IDLE_S
      kind: setting
      default: "1800"
      effect: "Seconds of inactivity after which the preview server stops itself."
      read_by: "Reach::Kit::PreviewServer"
      source: lib/reach/kit/preview_server.rb
      standards: [STD-PREVIEW]
    - name: REACH_COMMAND_HANDOFF
      kind: internal
      effect: "Name of a regular expression constant in the guided learner check, not an environment variable; the inventory matched it by prefix."
      read_by: "Reach::GuidedLearner"
      source: lib/reach/guided_learner.rb
      standards: [STD-GUIDED-LEARNER]
    - name: REACH_POLICY_CORPUS
      kind: test
      effect: "Path list of extra corpus globs read by the policy tool."
      read_by: "tools/policy.rb"
      source: tools/policy.rb
    - name: REACH_FIGURES_CHROME
      kind: test
      effect: "Chrome executable used by the figures build tool."
      read_by: "tools/figures/build.rb"
      source: tools/figures/build.rb
      standards: [STD-FIGURES]
    - name: REACH_PROBE_KEEP
      kind: test
      effect: "Names the single REACH_ variable the sandbox probe keeps when it clears the rest of the environment."
      read_by: "tools/sandbox_probe/codex_setup_probe.rb"
      source: tools/sandbox_probe/codex_setup_probe.rb
    - name: REACH_PROBE_PORT
      kind: test
      effect: "Selects the port the probe support code wraps to record port calls."
      read_by: "Reach::Probe"
      source: lib/reach/probe.rb
    - name: REACH_SMOKE_DISABLE
      kind: kill_switch
      effect: "When set to 1, the course matrix smoke run stops."
      read_by: "tools/smoke/course_matrix.rb"
      source: tools/smoke/course_matrix.rb
      standards: [STD-COURSE-SMOKE]
    - name: REACH_SECURITY_AUDIT
      kind: internal
      effect: "Legacy switch; the value 0 is ignored and only prints a notice that the instructor override is the way to skip the audit."
      read_by: "tools/security_audit/gate.rb"
      source: tools/security_audit/gate.rb
      standards: [STD-SECURITY-AUDIT-MODE]
    - name: REACH_SECURITY_AUDIT_CLAUDE
      kind: path
      effect: "Names the model CLI binary the security audit gate runs; RELEASE_GATE_CLAUDE takes precedence."
      read_by: "tools/security_audit/gate.rb"
      source: tools/security_audit/gate.rb
      standards: [STD-SECURITY-AUDIT-MODE]
    - name: REACH_SECURITY_AUDIT_REMOTE
      kind: setting
      effect: "Pattern for the git remote that the audit gate and release gate treat as the repository to audit."
      read_by: "tools/security_audit/gate.rb, tools/release_gate/repo.rb"
      source: tools/security_audit/gate.rb
      standards: [STD-SECURITY-AUDIT-MODE, STD-RELEASE-GATE]
    - name: REACH_SECURITY_AUDIT_STATE
      kind: path
      default: "~/.local/state/reach-security-audit"
      effect: "Directory that holds the security audit gate state."
      read_by: "tools/security_audit/gate.rb, tools/release_gate/repo.rb"
      source: tools/security_audit/gate.rb
      standards: [STD-SECURITY-AUDIT-MODE]
    - name: REACH_SECURITY_AUDIT_TOKEN
      kind: secret_ref
      effect: "Token the audit gate uses to read its settings from the course server; read from the environment before the stored token."
      read_by: "tools/security_audit/gate.rb, tools/release_gate/repo.rb"
      source: tools/security_audit/gate.rb
      standards: [STD-SECURITY-AUDIT-MODE]
  files:
    - path: config.yml
      format: yaml
      purpose: >
        Plugin configuration shipped in the repository (schema rplugin.config/v1). It holds the corpus id, the Teach URLs, enrollment lockout and fingerprint settings, update, runtime and SDK install cadence, brain, debug, link, submit, live, issues, storage, import, late work, checkpoints, hooks, Codex, transcripts, agent control, and harness rules settings.
      written_by: release process (edited in the repository)
      read_by: Reach::Runtime.load_config and the modules that read one section each, including Update, Brain, BrainPlanes, Debug, Link, Checkpoint, Storage, Subscribe, TranscriptExport, Limits, AgentControl, Policy, Live, Issues, Locks, HookLiveness, Harness
      standards: [STD-TEACH-URL, STD-AUTO-UPDATE]
    - path: <reach-root>/config.yml
      format: yaml
      purpose: Per-install configuration. Reach::Runtime reads it as the live config of the install, and the updater reads and rewrites its updates section, including the channel, atomically.
      written_by: scripts/reach-install, Reach::Update
      read_by: Reach::Runtime.load_config, Reach::Update.install_config
      standards: [STD-STABLE-CADENCE, STD-AUTO-UPDATE]
    - path: <reach-root>/state/teach.json
      format: json
      purpose: The Teach URL baked from config at install time, read as a fallback when no environment override or config value is present.
      written_by: Reach::Runtime.bake_teach_url!
      read_by: Reach::Runtime.baked_teach_url
      standards: [STD-TEACH-URL]
    - path: <reach-home>/profile.yml
      format: yaml
      purpose: The student's local interview answers, with a status of partial, complete, or skipped. It stays on the student's machine.
      written_by: Reach::Profile.save
      read_by: Reach::Profile.load, Reach::Redact
      standards: [STD-PROFILE-LOCAL, STD-INTERVIEW-ONCE]
    - path: <reach-home>/install.yml
      format: yaml
      purpose: The enrollment record of the install, including identifiers returned at enrollment; its presence marks a home as enrolled.
      written_by: Reach::Enroll
      read_by: Reach::Enroll, Reach::Paths
    - path: <reach-home>/fingerprint.json
      format: json
      purpose: The machine fingerprint record used to bind the install to a computer.
      written_by: Reach::Fingerprint
      read_by: Reach::Fingerprint, Reach::Enroll
      standards: [STD-FINGERPRINT-SALT-KEPT, STD-FINGERPRINT-OS-USER]
    - path: <reach-home>/stamp.json
      format: json
      purpose: The stamp record of the install used by enrollment checks.
      written_by: Reach::Stamp
      read_by: Reach::Stamp
    - path: <reach-home>/vault/guardrails/agent-control.yml
      format: yaml
      purpose: The delivered agent-control table that decides how channels render for the agent, validated against a bundled copy and its digest.
      written_by: Reach::AgentControl
      read_by: Reach::AgentControl
      standards: [STD-AGENT-CONTROL, STD-VAULT-PRIVATE]
    - path: agent-control/agent-control.yml
      format: yaml
      purpose: The bundled agent-control table with a sha256 sidecar file used when no delivered table is valid.
      written_by: release process (edited in the repository)
      read_by: Reach::AgentControl.bundled_text
      standards: [STD-AGENT-CONTROL]
    - path: <reach-home>/vault/guardrails/course_policy.json
      format: json
      purpose: The delivered course policy and course profile (terms, submission, wellbeing, support, enrollment, limits), read through the guardrails loader.
      written_by: Reach::Guardrails
      read_by: Reach::Guardrails, Reach::CourseProfile, Reach::Policy
      standards: [STD-COURSE-PROFILE, STD-VAULT-PRIVATE]
    - path: <reach-home>/state/controls.json
      format: json
      purpose: Held course controls fetched from Teach (pause course work, hold submissions, test), with a server time offset and a parked marker for servers that lack the route.
      written_by: Reach::Controls.store
      read_by: Reach::Controls, Reach::ExamMode
      standards: [STD-CONTROLS, STD-TEST-MODE]
    - path: <reach-home>/state/exam.json
      format: json
      purpose: The local state of a running course test.
      written_by: Reach::ExamMode
      read_by: Reach::ExamMode, Reach::Controls
      standards: [STD-TEST-MODE]
    - path: <reach-home>/state/announcements.json
      format: json
      purpose: Announcements received from Teach and their shown state.
      written_by: Reach::Announcements
      read_by: Reach::Announcements
      standards: [STD-ANNOUNCEMENTS]
    - path: <reach-home>/state/due-changes.json
      format: json
      purpose: Recorded due date changes the student has been told about.
      written_by: Reach::DueChanges
      read_by: Reach::DueChanges
      standards: [STD-DUE-CHANGE]
    - path: <reach-home>/state/holdings.json
      format: json
      purpose: The record of what the student holds locally for the course.
      written_by: Reach::Holdings
      read_by: Reach::Holdings
      standards: [STD-HOLDINGS]
    - path: <reach-home>/state/storage.json
      format: json
      purpose: Storage warning thresholds reached and the time of the last storage check.
      written_by: Reach::Storage
      read_by: Reach::Storage
      standards: [STD-STORAGE-GATES]
    - path: <reach-home>/state/progress.json
      format: json
      purpose: Milestones reached and reports already sent for progress reporting.
      written_by: Reach::Progress
      read_by: Reach::Progress
      standards: [STD-PROGRESS]
    - path: <reach-home>/state/hooks_verified.json
      format: json
      purpose: Per harness record that hooks actually ran, which decides whether the rules file is a stub or full.
      written_by: Reach::Harness.note_hooks_ran
      read_by: Reach::Harness.rules_mode
      standards: [STD-HARNESS-VERIFIED]
    - path: <reach-home>/state/checkpoint-mirror.json
      format: json
      purpose: State of the checkpoint mirror, next to the checkpoint notice, salt, and dismissed records.
      written_by: Reach::Checkpoint
      read_by: Reach::Checkpoint
      standards: [STD-CHECKPOINT-AUTOSAVE, STD-FINGERPRINT-SALT-KEPT]
    - path: <reach-home>/state/transcripts-export.json
      format: json
      purpose: Progress of transcript export, kept with a retention state file for transcripts.
      written_by: Reach::TranscriptExport, Reach::Limits
      read_by: Reach::TranscriptExport, Reach::Limits
      standards: [STD-TRANSCRIPT-EXPORT]
    - path: <reach-home>/state/preview.json
      format: json
      purpose: The running preview server record, with its URL and idle window.
      written_by: Reach::Preview
      read_by: Reach::Preview
      standards: [STD-PREVIEW]
    - path: <reach-root>/state/update.json
      format: json
      purpose: The update manifest with channel, ceiling, last check time, and notes, next to an update lock and an update log.
      written_by: Reach::Update
      read_by: Reach::Update
      standards: [STD-AUTO-UPDATE, STD-STABLE-CADENCE]
    - path: <reach-root>/state/runtime-auto.json
      format: json
      purpose: State of the automatic runtime install, with its install lock.
      written_by: Reach::RuntimeAuto
      read_by: Reach::RuntimeAuto
      standards: [STD-RUBY-BOOTSTRAP]
    - path: <reach-root>/state/sdk-auto.json
      format: json
      purpose: State of the automatic SDK install, with its install lock.
      written_by: Reach::SdkAuto
      read_by: Reach::SdkAuto
    - path: <reach-root>/state/codex_setup.json
      format: json
      purpose: State of the Codex setup, with a setup lock.
      written_by: Reach::CodexSetup
      read_by: Reach::CodexSetup
      standards: [STD-CODEX-SETUP]
    - path: <reach-root>/state/harness-source.json
      format: json
      purpose: Record of the harness plugin source that Reach repointed.
      written_by: Reach::HarnessSource
      read_by: Reach::HarnessSource
    - path: <reach-root>/state/harness_sessions.json
      format: json
      purpose: Known harness session identities used to detect which harness is running.
      written_by: Reach::HarnessIdentity
      read_by: Reach::HarnessIdentity
    - path: <reach-root>/instructor.json
      format: json
      purpose: Local instructor unlock record for an install that holds instructor access.
      written_by: Reach::Instructor
      read_by: Reach::Instructor
      standards: [STD-INSTRUCTOR-UNLOCK]
    - path: <workspace>/.reach-home/state/relocation.json
      format: json
      purpose: Records a completed move of the Reach home into the workspace; a RELOCATED.json pointer is left in the old home, and a relocation lock and an automatic relocation state file sit in the workspace base.
      written_by: Reach::Relocation
      read_by: Reach::Paths, Reach::Relocation
      standards: [STD-HOME-IN-WORKSPACE]
    - path: <seal-state>/seal.json
      format: json
      purpose: The seal sidecar, kept outside the workspace in the platform state directory unless REACH_SIDECAR points elsewhere.
      written_by: Reach::Sidecar
      read_by: Reach::Sidecar
      standards: [STD-SEAL-INVISIBLE]
    - path: <reach-home>/logs/requests.jsonl
      format: jsonl
      purpose: The local request log of calls to Teach, kept beside the workspace and transcript logs.
      written_by: Reach::Client
      read_by: Reach::Client (scrub and rotation)
      standards: [STD-REQUEST-LOG]
    - path: <reach-home>/debug/spool.jsonl
      format: jsonl
      purpose: Debug mode event spool that is batched and sent to Teach when debug mode is on.
      written_by: Reach::Debug
      read_by: Reach::Client (scrub and rotation)
      standards: [STD-DEBUG-MODE]
    - path: <reach-home>/setup-log/log-YYYYMMDD.jsonl
      format: jsonl
      purpose: The daily setup log, with installer records in matching install files.
      written_by: Reach::SetupLog
      read_by: Reach::SetupLog
      standards: [STD-SETUP-LOG]
    - path: <reach-home>/state/qualify-faults.jsonl
      format: jsonl
      purpose: Recorded qualification faults with a state file for what was already reported.
      written_by: Reach::QualifyFaults
      read_by: Reach::QualifyFaults
      standards: [STD-QUALIFY-FAULTS]
    - path: <workspace>/<course>/<assignment>/<slice>/.reach/slice.json
      format: json
      purpose: The marker that identifies a slice workspace, next to delivered, plan audit, and refusal records in the same marker directory.
      written_by: Reach::Workspace
      read_by: Reach::Workspace, Reach::PlanAudit
      standards: [STD-WORKSPACE-LAYOUT, STD-PLAN-AUDIT]
    - path: <workspace>/<course>/<assignment>/<slice>/.reach/plan-audit.json
      format: json
      purpose: The plan audit record of a slice, with sibling refusal counters for plan audit and weighted passes.
      written_by: Reach::PlanAudit
      read_by: Reach::PlanAudit, Reach::Passes
      standards: [STD-PLAN-AUDIT, STD-WEIGHTED-PASSES]
    - path: .claude/settings.json
      format: json
      purpose: Workspace level Claude Code settings with the hooks Reach generates for a student workspace.
      written_by: Reach::Harness
      read_by: Reach::Relocation, Reach::HookLiveness
      standards: [STD-HOOK-HARNESS]
    - path: .codex/hooks.json
      format: json
      purpose: Workspace level Codex hooks generated for a student workspace.
      written_by: Reach::CodexSetup, Reach::Harness
      read_by: Reach::Relocation, Reach::CodexHookTrust
      standards: [STD-CODEX-PLUGIN-HOOKS, STD-CODEX-HOOK-TRUST]
    - path: settings.json
      format: json
      purpose: Plugin manifest setting that names the default agent as reach:reach.
      written_by: release process (edited in the repository)
      read_by: the Claude Code plugin loader
    - path: plugin.json
      format: json
      purpose: Plugin manifest for the harness plugin installers.
      written_by: release process (edited in the repository)
      read_by: harness plugin loaders
    - path: mcp.json
      format: json
      purpose: Declares the reach stdio MCP server that runs exe/reach with the mcp verb.
      written_by: release process (edited in the repository)
      read_by: harness plugin loaders
    - path: reach.rplugin.yml
      format: yaml
      purpose: The rplugin manifest. It declares ports, extensions, owned corpus kinds, skills, the agent, specs, hooks file, MCP server, docs, and Ruby compatibility.
      written_by: release process (edited in the repository)
      read_by: rplugin installer and doctor
    - path: reach.rstack_component.yml
      format: yaml
      purpose: The rStack component manifest. It declares the component as public, never supervised, and names its release gate lease route.
      written_by: release process (edited in the repository)
      read_by: rStack tooling and the release gate
      standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE]
    - path: hooks/reach.hooks.yml
      format: yaml
      purpose: Source description of the plugin hooks.
      written_by: release process (edited in the repository)
      read_by: rplugin installer, tools that render hooks.json and codex.json
      standards: [STD-HOOK-HARNESS]
    - path: locales/en-US.yml
      format: yaml
      purpose: Student facing message texts, with a greetings file for the greeting texts.
      written_by: release process (edited in the repository)
      read_by: Reach::Messages, Reach::Greetings
      standards: [STD-STUDENT-MESSAGES, STD-MESSAGES-LOADED]
    - path: specs/app.yml
      format: yaml
      purpose: The application spec with the STD standards.
      written_by: release process (edited in the repository)
      read_by: rplugin spec tooling, tools/release_gate
    - path: <xdg-config-home>/user-dirs.dirs
      format: shell-like key file
      purpose: The Linux XDG user directory file that Reach reads, without writing, to find the student's downloads folder.
      written_by: the desktop environment
      read_by: Reach::Archive.xdg_download_dir
security:
  principles:
    - id: SP1
      statement: >
        rEach runs on a student's own computer and talks only to the course server named in config.yml. It runs no
        server of its own and sends course information nowhere else, and it never reads or writes another plugin's data.
      standards: [STD-PORTS-ONLY, STD-WIRE-CONTRACT, STD-TEACH-URL]
    - id: SP2
      statement: >
        The student is the only source of enrollment secrets, passwords, sign-in answers, and consent. The prompt hook
        captures them before the agent sees them, nothing an agent can call enrolls a student, and a yes counts only when
        it is an explicit yes typed in the session that was asked.
      standards: [STD-ENROLL-NO-RELAY, STD-ENROLL-PASSWORD, STD-SIGNIN-PASSWORD, STD-CONSENT-FROM-REACH, STD-SUBMIT-APPROVAL]
    - id: SP3
      statement: >
        Anything private to the course lives in the vault and the keys folder, outside the reach of generic file code and
        outside what the agent may read. A directive body says what the agent does and never why, so disclosing one
        discloses no secret.
      standards: [STD-VAULT-PRIVATE, STD-DIRECTIVES-CARRY-NO-SECRETS, STD-SEAL-INVISIBLE]
    - id: SP4
      statement: >
        Data leaves the computer only inside stated bounds and de-identified where it is a conversation. Recording is
        bounded to signed-in assignment work, credentials are redacted irreversibly, and the request and setup logs hold
        no typed text, secret, or body.
      standards: [STD-TRANSCRIPT, STD-TRANSCRIPT-DEIDENTIFY, STD-REQUEST-LOG, STD-SETUP-LOG, STD-DEBUG-MODE]
    - id: SP5
      statement: >
        A control that cannot run never becomes a silent pass. An unverifiable validation receipt blocks enrollment,
        a missing identity key stops transcript upload, a Codex that runs no hooks refuses qualification and submission,
        and a guardrail or control fetched from the course server is used only when it verifies.
      standards: [STD-HOOK-GUARD, STD-AGENT-CONTROL, STD-CONTROLS, STD-ENROLL-LOCKDOWN]
    - id: SP6
      statement: >
        Learner-facing behavior is a compiled policy, not a request to the agent. The guided learner policy keeps code,
        terminal handoffs, and implementation detail out of replies, with the limits of display-boundary enforcement stated
        honestly.
      standards: [STD-GUIDED-LEARNER, STD-AGENT-CONTROL]
    - id: SP7
      statement: >
        Students install only a stable channel that moves through a gated, operator-owned promotion, and the repository is
        public, so it carries no student identifier, institution name, course material, key, or secret.
      standards: [STD-RELEASE-GATE, STD-STABLE-CADENCE, STD-NO-INSTITUTION, STD-TEACH-OPAQUE, STD-SECURITY-AUDIT-MODE]
  trust_boundaries:
    - id: TB1
      between: The student's computer (rEach and the student's AI agent) and the course server
      crossing: >
        HTTPS requests under the contract in specs/wire.yml, signed by the install key, plus sealed envelopes for
        submissions, qualifications, and transcripts.
      controls:
        - Every request from an enrolled install carries an RSA-PSS signature over the method, target, timestamp, nonce, and body digest, with install, timestamp, nonce, version, and environment headers.
        - A token bucket of 20 requests per minute, a circuit breaker that opens after 5 failures for 60 seconds, a 5 second connect timeout, a 30 second read timeout, and at most 4 retries with capped jittered backoff.
        - Responses are read with a 64 MB ceiling, and a skewed local clock changes nothing because controls use server time.
        - The request log holds method, route with query values replaced, status, latency, and retries, never bodies, passkeys, passwords, or tokens.
      standards: [STD-WIRE-CONTRACT, STD-REQUEST-LOG, STD-CA-ROOTS, STD-TEACH-URL, STD-PORTABLE-GCM]
    - id: TB2
      between: A computer that is not yet enrolled and the course server
      crossing: >
        Anonymous preview requests, the instructor keyring fetch, and the security validation pass that must succeed
        before enrollment.
      controls:
        - Until enrolled, a plugin-level prompt hook blocks every prompt in every harness and runs the enrollment flow itself, and every command and MCP tool except a short list refuses.
        - The validation pass uses an ephemeral key with no install identity, a one hour expiry, and a signed receipt checked against signing keys from the configured HTTPS origin and fetched again before passing.
        - From rEach 0.61.0 no enrollment shape bypasses the pass, a failed or unavailable pass blocks enrollment, and TLS is never bypassed and no alternate server is used.
        - Enrollment answers (passkey, username, student ID, password) are blocked from the agent and kept only as a salt and digest between entries.
      standards: [STD-ENROLL-LOCKDOWN, STD-ENROLL-NO-RELAY, STD-ENROLL-PASSWORD, STD-NOHOOK-ENROLL, STD-COURSE-PASSKEY]
    - id: TB3
      between: The student's AI agent and rEach's tools, hooks, and the files rEach protects
      crossing: >
        Prompt, tool-use, and stop hooks and the MCP tool bridge in each harness, plus the generated rules files in the
        course folders.
      controls:
        - Write, shell, and read gates in the course folder refuse access to the vault and keys folders, and the harness settings deny reads of both.
        - Consent for submission, module moves, harness moves, forgetting, and uninstall is asked by rEach and answered by the student's own typed yes, bound to the session and the question shown.
        - An instructor control can pause tool calls, hold submission, or lock a timed test to a short tool list, enforced in the hooks and the tool bridge, and no environment variable lifts a control in force.
        - Hooks write through temporary files renamed into place, so a harness never reads a half-written hooks file.
      standards: [STD-HOOK-GUARD, STD-CONSENT-FROM-REACH, STD-SUBMIT-APPROVAL, STD-CONTROLS, STD-TEST-MODE, STD-STATE-FILE-REPLACE, STD-HOOK-RESPONSIVE, STD-CODEX-HOOK-TRUST]
    - id: TB4
      between: The student's computer and GitHub
      crossing: >
        Downloads of rEach, its updates, its runtime kit, and its memory library from the public repository, and release
        and tag listings read by the updater.
      controls:
        - Students follow the stable branch, which moves only when the operator promotes a tested version, and main is never a student source.
        - The updater refuses a release whose commit it cannot verify, stages in the background, installs at the next session start, and records every phase so an interrupted update resumes.
        - A copy that cannot refresh itself tells the student to update from the app's Plugins page.
        - REACH_UPDATE_DISABLE=1 turns automatic update off.
      standards: [STD-AUTO-UPDATE, STD-APP-COPY-UPDATE, STD-AGENT-UPDATE, STD-STABLE-CADENCE, STD-NO-TOP-BIN]
    - id: TB5
      between: rEach and the model provider behind the student's AI app
      crossing: Whatever the student types and the agent replies goes to the provider the student chose, under that provider's own terms.
      controls:
        - rEach does not proxy or add to that path and states the separation in the privacy policy.
        - Conversations outside signed-in assignment work are never recorded, and the extracurricular folder is never read by recording.
        - The agent never receives passwords, sign-in answers, the enrollment secrets, or instructor codes, because the hooks capture them first.
      standards: [STD-TRANSCRIPT, STD-ENROLL-NO-RELAY, STD-SIGNIN-PASSWORD, STD-INSTRUCTOR-UNLOCK]
    - id: TB6
      between: A maintainer's clone and a release leaving the computer
      crossing: A push that carries a tag or a changed VERSION, and the stable promotion that follows.
      controls:
        - A pre-push gate scans added lines for secret shapes, student identifiers, and absolute home paths, audits the diff read-only, and checks wire digests, version homes, and the course server's facts.
        - No environment variable skips the gate. The ways through a block are the instructor's recorded one-push override and a time-boxed lease.
        - Test moves only through the polispec promotion, and stable moves only when the operator promotes, gated and not frozen during class or an assignment due time.
      standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE, STD-SECURITY-AUDIT-MODE, STD-STABLE-CADENCE]
    - id: TB7
      between: The course materials package and the student's workspace
      crossing: Sealed, signed course packages that unpack into the vault and the course folders.
      controls:
        - Envelopes are AES-256-GCM sealed with the data key wrapped to the recipient by RSA-OAEP and signed, and the signature is checked on open.
        - Every owned file carries an invisible per-install mark, every session leaves an HMAC-chained witness ledger, and tampering is reported silently and healed where safe.
        - The vault, the suite, and the reference build stay under the vault folder with mode 0700.
      standards: [STD-SEAL-INVISIBLE, STD-VAULT-PRIVATE, STD-PORTABLE-GCM, STD-CRYPTO-FALLBACK, STD-STORAGE-GATES]
  authentication:
    - id: AU1
      subject: An enrolled install, on every request to the course server
      mechanism: >
        RSA-PSS (SHA-256) signature over method, target, timestamp, nonce, and body digest, sent with the install id.
        A security validation session uses the same signature with an attempt header and no install id.
      source: lib/reach/client.rb Client#sign!
      standards: [STD-WIRE-CONTRACT]
    - id: AU2
      subject: The student, at enrollment
      mechanism: >
        The class-wide course passkey, the institutional username and student ID checked against identity rules from the
        course server, and a chosen password of at least 8 characters, all captured by the prompt hook. Teach answers with
        a signed enrollment stamp that binds the install, the student, the course, and the computer fingerprint.
      source: lib/reach/enroll_flow.rb
      standards: [STD-ENROLL-LOCKDOWN, STD-ENROLL-PASSWORD, STD-COURSE-PASSKEY]
    - id: AU3
      subject: The enrolled student, at sign-in
      mechanism: >
        Student ID and password. The password is checked against a salted PBKDF2-HMAC-SHA256 verifier (600000 iterations)
        bound to the student and install, or asked of the course server once when no verifier exists. The session lasts
        the course policy's max_hours (12 by default), and failures within the lockout window sign the session out.
      source: lib/reach/password.rb
      standards: [STD-SIGNIN-PASSWORD, STD-SIGNIN-ONCE, STD-PASSWORD-RESET-QUEUE, STD-SIGNIN-TERMINAL-RESET]
    - id: AU4
      subject: The same computer, at every session
      mechanism: >
        A salted hashed fingerprint of the computer and computer account is compared with the enrollment stamp. A mismatch
        locks rEach again, a reinstall on the same account keeps the salt in a per-computer sidecar so it counts as the same
        computer, and on macOS the account name and root forms of the account both match.
      source: lib/reach/fingerprint.rb
      standards: [STD-ENROLL-LOCKDOWN, STD-FINGERPRINT-SALT-KEPT, STD-FINGERPRINT-OS-USER]
    - id: AU5
      subject: An instructor lifting the lock on one install
      mechanism: >
        A RINS1 code (RSA-PSS signature over its payload) verified against keys from the signed instructor keyring that
        the course server serves. The keyring is cached, refreshed every 900 seconds by default, rejected when its
        signature fails or it is older than the cache, and a retired key or revoked code id is never accepted.
      source: lib/reach/instructor_keyring.rb
      standards: [STD-INSTRUCTOR-UNLOCK, STD-INSTRUCTOR-PERSONA]
    - id: AU6
      subject: The course server, to rEach
      mechanism: >
        Enrollment returns signing public keys that rEach pins for the install. Packages, status, and receipts are
        verified against them, and TLS is verified with the platform CA bundle or the running Ruby's own bundle.
      source: lib/reach/enroll.rb
      standards: [STD-WIRE-CONTRACT, STD-CA-ROOTS, STD-SEAL-INVISIBLE]
    - id: AU7
      subject: A pre-enrollment security validation session
      mechanism: >
        Creation with the course code and an ephemeral RSA public key, later calls signed by that key with the session
        named in a header, and a final signed receipt verified against signing keys from the configured origin.
      source: specs/security-validation.yml
      standards: [STD-ENROLL-LOCKDOWN]
    - id: AU8
      subject: A signed packet imported by hand
      mechanism: A packet bundle is accepted only when its signature verifies against the allowed signers passed to the import or named in config.yml.
      source: lib/reach/packet.rb Packet.verify!
      standards: [STD-PACKET-IMPORT]
    - id: AU9
      subject: The maintainer pushing a release
      mechanism: >
        The release gate reads the course server with a service token held in the maintainer's own state, and an
        override needs an interactive terminal and a typed phrase. rEach students never run the gate.
      source: tools/release_gate/gate.rb
      standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE]
  keys:
    - id: K1
      name: Install key
      purpose: RSA-4096 private key that signs every request and course envelope from this install and is generated on the student's computer.
      custody: >
        Kept in the keys folder of the rEach home with mode 0700 on the folder and 0600 on the file. A pending enrollment
        key sits in the enrollment state folder with mode 0600 until enrollment completes. It is never sent, and the harness
        denies agent reads of the folder.
      rotation: A new key is made on re-enrollment. No scheduled rotation.
      standards: [STD-PORTS-ONLY, STD-VAULT-PRIVATE, STD-STATE-FILE-REPLACE]
    - id: K2
      name: Validation session key
      purpose: Ephemeral RSA key for the pre-enrollment security validation pass, reused as the install key at enrollment.
      custody: Held in rEach's private validation state and consumed with the enrollment it enables.
      rotation: A restart creates a fresh session and key.
      standards: [STD-ENROLL-LOCKDOWN]
    - id: K3
      name: Course server signing keys
      purpose: Public keys rEach pins to verify packages, status, receipts, and the validation receipt.
      custody: Public material received at enrollment and stored in the install record.
      rotation: Set by the course server.
      standards: [STD-WIRE-CONTRACT]
    - id: K4
      name: Data key per sealed envelope
      purpose: A random AES-256-GCM key per envelope, wrapped to the recipient with RSA-OAEP, for packages, qualify, submit, hands, and reference.
      custody: Exists in memory for the duration of one seal or open. The pure-Ruby GCM fallback is byte-identical to OpenSSL.
      rotation: A new key for every envelope.
      standards: [STD-PORTABLE-GCM, STD-CRYPTO-FALLBACK]
    - id: K5
      name: Guardrails seal data
      purpose: Per-install marks for owned files and the key for the HMAC-chained witness ledger.
      custody: Delivered in the sealed guardrails package into the vault and never shown to the student.
      rotation: Replaced when the course server delivers a new package.
      standards: [STD-SEAL-INVISIBLE, STD-VAULT-PRIVATE]
    - id: K6
      name: Password verifier
      purpose: A salted PBKDF2-HMAC-SHA256 digest used to check the sign-in password offline.
      custody: Login state folder with mode 0600, bound to the student and install. The password is never stored.
      rotation: Rewritten on enrollment, on a server check, and on a reset.
      standards: [STD-SIGNIN-PASSWORD]
    - id: K7
      name: Fingerprint salt and computer sidecar
      purpose: A random salt for the computer fingerprint and a list of this computer's enrollments, kept outside rEach's own folder.
      custody: A per-computer sidecar file in the user's application state folder, which survives deletion of the rEach home. The student can delete it.
      rotation: A deleted sidecar makes a new salt and counts as a device move.
      standards: [STD-FINGERPRINT-SALT-KEPT]
    - id: K8
      name: Transcript pseudonym and re-identification public key
      purpose: A per-install random pseudonym and the public key to which the identity index of a de-identified transcript is sealed.
      custody: The pseudonym file has mode 0600. rEach holds only the public key from the course status and never the private half.
      rotation: The key is set by the course server. With no key rEach sends nothing and keeps its queue.
      standards: [STD-TRANSCRIPT-DEIDENTIFY]
    - id: K9
      name: Instructor keyring cache
      purpose: Public keys, retired key ids, and revoked code ids used to verify instructor unlock codes.
      custody: A cache file with mode 0600 in the root state folder, signature-checked before it replaces the cache.
      rotation: Refreshed every 900 seconds by default, and minting and rotation happen on the course server.
      standards: [STD-INSTRUCTOR-UNLOCK]
    - id: K10
      name: Release gate service token
      purpose: A bearer token the maintainer's gate uses to read facts from the course server and record runs.
      custody: The maintainer's own state, outside the repository, mode 0600. The repository holds no token.
      rotation: Set by the course server.
      standards: [STD-RELEASE-GATE, STD-SECURITY-AUDIT-MODE]
  privacy:
    pii_map: PRIVACY.md
    pii_map_note: >
      rEach keeps no column-level PII map. PRIVACY.md is the student-facing statement of what is sent and kept, and the
      map of Teach's data belongs to the course server.
    data_classes:
      - id: credential
        meaning: Secrets that prove or protect an identity or session.
        examples: [the install private key, the password, the course passkey, the instructor unlock code, the password verifier]
      - id: identity
        meaning: Values that name a student or a computer.
        examples: [name, username, student ID, computer account, computer name, hashed computer fingerprint]
      - id: conversation
        meaning: What the student types and the agent replies and does during signed-in assignment work.
        examples: [prompts, replies, reasoning blocks, tool actions, assignment code]
      - id: course_work
        meaning: The student's assignment files, answers, plans, checkpoints, and receipts.
        examples: [owned slice files, part answers, submission archives, grade receipts]
      - id: course_material
        meaning: Material the course delivers, held privately.
        examples: [the sealed guardrails, the suite, the reference build, the private tier of the memory]
      - id: operational
        meaning: Facts about the program and the computer that carry no typed text.
        examples: [rEach version, operating system, processor, Ruby version, AI app, debug and fault events, update state]
    deidentification: >
      A transcript leaves the computer under one random pseudonym per install, with known identifiers replaced by
      placeholders in text, summary, and note, and the identity index sealed to the course's re-identification public key.
      The local spool and the student's own export stay as typed except for redacted credentials, a name rEach does not
      know stays in the text, and the course server holds the key and can reveal. Anonymous feedback sends only the day
      and records nothing in rEach's reports or logs.
    wellbeing: >
      A crisis message is answered with the support message before anything else, ahead of the greeting and every flow
      step. A wellbeing hand always carries its space kind, a refused hand is never reported as told or queued, and the
      student still gets the full crisis message.
    retention:
      - Live transcript spool and archives on the computer are kept until the course ends, then sent conversations and their archives are deleted 180 days after the enrollment expires, and unsent or rejected ones after 30 days.
      - Automatic export of conversations to the Downloads folder is off by default, and rEach records each export path so a forget can find it.
      - Checkpoint copies of assignment work are kept and are never deleted on a schedule, and the student can forget them.
      - The setup log is local only, is never sent, and is exported only when the student chooses.
      - Server-side copies are owned by the course and erased by the instructor on request, which PRIVACY.md states.
    student_rights:
      - reach transcripts export saves the student's own conversations as a ZIP in Downloads.
      - reach transcripts forget deletes the spool, state, rejected files, archives, and recorded exports after a typed yes, and saves a receipt.
      - reach checkpoint forget deletes the checkpoint copies of the student's own enrollment after a yes.
      - reach profile forget and reach memory forget delete the profile and what rEach learned about how the student works.
      - reach uninstall removes rEach and never touches the student's work, after saving a copy of receipts and grade records.
      - The student can turn off the environment report, the qualification fault report, and the background check with REACH_ENV_REPORT_DISABLE, REACH_QUALIFY_FAULTS_DISABLE, and REACH_SUBSCRIBE.
    standards: [STD-TRANSCRIPT, STD-TRANSCRIPT-DEIDENTIFY, STD-TRANSCRIPT-EXPORT, STD-WELLBEING-DELIVERED, STD-UNINSTALL, STD-SETUP-LOG, STD-DEBUG-MODE, STD-CHECKPOINT-AUTOSAVE, STD-FEEDBACK]
  abuse_controls:
    - id: AB1
      control: Enrollment and sign-in lockout
      limit: Five refusals within 15 minutes lock enrollment from config.yml, and three sign-in failures within 15 minutes sign the session out by default course policy.
      kill_switch: None. The lockout is part of the lock.
      standards: [STD-ENROLL-LOCKDOWN, STD-SIGNIN-PASSWORD, STD-INSTRUCTOR-UNLOCK]
    - id: AB2
      control: Client request pacing
      limit: A token bucket of 20 requests per minute (30 for the live bucket), a circuit breaker opening after 5 failures for 60 seconds, bounded retries with capped jittered backoff, and a 30 second wait ceiling.
      kill_switch: None for the client. Individual features have their own switches.
      standards: [STD-WIRE-CONTRACT]
    - id: AB3
      control: Security validation pass
      limit: One hour expiry per session, one pass consumed once with the enrollment it enables.
      kill_switch: REACH_VALIDATION_DISABLE=1 blocks the pass and with it enrollment, and the course server has a matching switch.
      standards: [STD-ENROLL-LOCKDOWN]
    - id: AB4
      control: Hook guard
      limit: A Codex that has run no prompt hook for 15 minutes refuses qualification, submission, and part recording.
      kill_switch: hooks.require false in config.yml or REACH_HOOK_GUARD_DISABLE=1 switches the refusal off and the detector stays.
      standards: [STD-HOOK-GUARD, STD-HEALTH, STD-KNOWN-ISSUES]
    - id: AB5
      control: Storage gates
      limit: Warnings at 512, 1024, and 2048 MB, and at 4096 MB new imports are refused and compaction is required.
      kill_switch: None.
      standards: [STD-STORAGE-GATES]
    - id: AB6
      control: Issue and fault reporting budgets
      limit: Faults are capped at 60 an hour, issue reports at 3 a day with 10 queued, and qualification fault records at 60 an hour in batches of 20.
      kill_switch: REACH_ISSUES_DISABLE and REACH_QUALIFY_FAULTS_DISABLE.
      standards: [STD-ISSUES, STD-QUALIFY-FAULTS, STD-KNOWN-ISSUES]
    - id: AB7
      control: Brain admission and spool bounds
      limit: Per-hour and per-day record caps, a 4096 byte record limit, and a 20 MB spool cap from config.yml.
      kill_switch: REACH_BRAIN_PLANES_DISABLE for the planes, and brain.enabled in config.yml.
      standards: [STD-BRAIN, STD-BRAIN-PLANES]
    - id: AB8
      control: Submission bounds
      limit: A submission archive is capped at 256 MB, an all-slices archive at 2048 MB, and a submission needs a typed yes valid 30 minutes for exactly the files asked about.
      kill_switch: An instructor hold blocks submission only.
      standards: [STD-SUBMIT-APPROVAL, STD-SUBMIT-ARCHIVE, STD-CONTROLS]
    - id: AB9
      control: Instructor controls and timed test
      limit: A pause, a hold, and a test lockdown enforced by server time from the fetched controls.
      kill_switch: No environment variable and no config key lifts a control in force. Controls are fetched when agent_control.controls is on.
      standards: [STD-CONTROLS, STD-TEST-MODE, STD-AGENT-CONTROL]
    - id: AB10
      control: Updater and runtime kit
      limit: Hourly jittered checks with at most 5 attempts, and a staged install at the next session start.
      kill_switch: REACH_UPDATE_DISABLE=1, REACH_RUNTIME_DISABLE, and REACH_SDK_DISABLE.
      standards: [STD-AUTO-UPDATE, STD-RUBY-BOOTSTRAP]
    - id: AB11
      control: Environment report
      limit: The operating system, processor, Ruby version, and AI app accompany each request and each failed qualification record.
      kill_switch: REACH_ENV_REPORT_DISABLE=1 blanks the report.
      standards: [STD-ENV-REPORT]
    - id: AB12
      control: Uninstall
      limit: Removes only rEach-named folders and generated files, and never a symlink target or a folder that is or contains the student's home.
      kill_switch: REACH_UNINSTALL_KILL_SWITCH=1.
      standards: [STD-UNINSTALL]
    - id: AB13
      control: Release gate
      limit: Blocks a release push at or above the block_at severity, high by default, and records every run.
      kill_switch: There is no skip switch. The ways through are the instructor's override and a lease.
      standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE]
  audit:
    - id: AD1
      what: Integrity events (tampered vault, corrupt or foreign mark, ledger break, sidecar conflict, directive dump, failed sign-in, denied identity, outside access, fingerprint mismatch), reported to the course server silently
      where: The course server's integrity route, with a local outbox when it cannot be reached
      standards: [STD-SEAL-INVISIBLE]
    - id: AD2
      what: The witness ledger of each session, HMAC-chained
      where: The ledger folder of the rEach home, with a break reported to the course server
      standards: [STD-SEAL-INVISIBLE]
    - id: AD3
      what: Debug events and fault events, scrubbed before spooling, with no prompt, reply, file text, code, password, key, or token
      where: The debug spool in the rEach home, sent from the stop and session-end hooks and from reach sync
      standards: [STD-DEBUG-MODE, STD-TEACH-LINK]
    - id: AD4
      what: Every request rEach makes, with the route's query values replaced
      where: logs/requests.jsonl and its rotations in the rEach home, never sent
      standards: [STD-REQUEST-LOG]
    - id: AD5
      what: The exhaustive setup log until the install is enrolled, with typed text reduced to lengths and the home path written as a tilde
      where: The setup-log folder of the rEach home (mode 0700, files 0600), never sent
      standards: [STD-SETUP-LOG]
    - id: AD6
      what: Update phases and channel decisions
      where: state/update.json and logs/update.log in the rEach home
      standards: [STD-AUTO-UPDATE, STD-APP-COPY-UPDATE]
    - id: AD7
      what: Receipts of a transcripts forget, a checkpoint forget, and an uninstall, listing what was deleted
      where: The state folder of the rEach home, and a receipts copy in Downloads for an uninstall
      standards: [STD-TRANSCRIPT-EXPORT, STD-UNINSTALL]
    - id: AD8
      what: Every release gate run and every override
      where: Recorded on the course server, and in the maintainer's local gate state reports
      standards: [STD-RELEASE-GATE]
    - id: AD9
      what: The practice receipt of the security validation pass
      where: A signed receipt held by the course server and the student's private validation state
      standards: [STD-ENROLL-LOCKDOWN]
environments:
  stages:
    - id: dev
      branch: main
      purpose: Day-to-day development of rEach. Main may carry versions that have not been released.
      changed_by: Agents and the operator, with a warning before a history rewrite of main.
      checkout: The repository checkout and its worktrees.
      services: None. The fake Teach fixture runs on loopback for local checks.
      data: Synthetic fixtures only, with five fictional students in the fixture roster.
      standards: [STD-PLATFORM-SMOKE, STD-RELEASE-GATE]
    - id: test
      branch: test
      purpose: The pre-release students never follow, published as a GitHub prerelease and pointed at the course server's test instance.
      changed_by: Only through polispec promote --to test by an agent or the operator, from main, fast-forward only, with a version bump and the version tag.
      checkout: A polispec-managed checkout of the test branch.
      services: The operator's machines and the platform smoke install the test channel and talk to the Teach test instance named by teach.test_url in config.yml.
      data: Synthetic and operational data classes only.
      standards: [STD-PLATFORM-SMOKE, STD-RELEASE-GATE]
    - id: stable
      branch: stable
      purpose: The channel students install and update from. It moves only to a version that ran on test and passed the platform smoke.
      changed_by: The operator only, through polispec promote --to stable, fast-forward from test, with the GitHub release flipped to Latest as a separate deferred step.
      checkout: A polispec-managed checkout that agents may read but never edit.
      services: None run from this repository. Students pull it from GitHub on their own computers.
      data: Operational only. Agents never read production secrets.
      standards: [STD-AUTO-UPDATE, STD-STABLE-CADENCE]
    - id: canary
      branch: canary
      purpose: A ring of opted-in students who follow the canary update channel. It is empty until the instructor opts one in.
      changed_by: The operator only, through polispec promote to canary from test.
      checkout: A polispec-managed checkout of the canary branch.
      services: None. The updater follows the canary branch when the student's update channel is canary.
      data: Operational only.
      standards: [STD-STABLE-CADENCE, STD-AUTO-UPDATE]
    - id: student_computer
      branch: stable (by default) or canary
      purpose: Where rEach actually runs. Each student's computer is a stage of its own with its own copy, home folder, runtime kit, and AI app.
      changed_by: The student's install, through the managed updater at session start. The student can ask the agent to update, and no one else changes it.
      checkout: A managed plugin install without a git checkout, a harness plugin cache copy, or a copy refreshed through the app's Plugins page.
      services: The harness hooks and a background course check about every 10 minutes while REACH_SUBSCRIBE allows it.
      data: The student's own work and records, with course information sent only to the course server.
      standards: [STD-AUTO-UPDATE, STD-APP-COPY-UPDATE, STD-STABLE-CADENCE, STD-UNINSTALL, STD-USER-HOME]
  promotion:
    to_test: >
      From main, by an agent or the operator, fast-forward only, requiring a version bump and tagging v{VERSION}. The gates
      are the release gate dry run, rplugin check, rplugin doctor, the policy check, a clean tree, and agreeing version homes,
      and main must contain stable's tip so a hotfix is merged back first. The result is a GitHub prerelease and a deploy of test.
    to_stable: >
      From test, by the operator only, fast-forward only, by typing the promotion phrase. Preflight checks a release gate
      lease with at least 20 minutes left and that specs/wire.yml has the digest the live course server serves. The gates add
      the release gate, the wire check, rplugin check and doctor, the policy check, that this exact commit ran on test, and that
      no freeze is active.
    to_canary: >
      From test, by the operator only, by typing the promotion phrase, behind the release gate, rplugin check and doctor, and
      the check that the commit ran on test. It deploys the canary branch at the version tag.
    stable_cadence: >
      The stable workflow runs daily at 15:00 UTC and on dispatch. It reads the test tip and its version tag, pushes a hook
      notice ref when a hook changes (and waits the next day), runs the platform smoke on the hosted legs, and then opens a
      stable-ready issue when the smoke passes or a stable-hold issue when it fails. It never moves stable.
    freezes: >
      A class session (30 minutes lead) and an assignment due time (24 hours lead) from the course calendar freeze promotion to
      stable and canary, live activity on the course server freezes promotion to stable, and a manual freeze can be set.
    latest: >
      Latest on GitHub is flipped by the operator, deferred after the stable move. tools/stable_promote.rb latest-status
      reports eligibility: not already Latest, not a prerelease, published at least 24 hours ago, and no stable-hold issue opened since.
    source: specs/polispec/policy.yml
  rollback:
    test: polispec deploy reach test --tag vPREV, by an agent or the operator.
    stable: polispec deploy reach stable --tag vPREV, by the operator only.
    canary: polispec deploy reach canary --tag vPREV, by the operator only.
    student_computer: >
      A student keeps the version their install holds until the updater moves them, an interrupted update resumes from its
      recorded phase, a failed channel repoint restores the previous marketplace source, and a student can reinstall from the
      stable channel. Operator hotfixes on stable go back to main before the next promotion.
    source: specs/polispec/environments.yml
  health:
    smoke_command: ruby tools/platform_smoke/run.rb --leg test|stable|canary, run after each deploy.
    platform_smoke: >
      tools/platform_smoke installs rEach from the checkout into a scratch path, runs the whole security validation pass over
      HTTPS against the fake course server, enrolls, runs the hook command lines, status, the fingerprint, the runtime kit,
      and doctor. It runs on hosted Linux, macOS arm64 and Intel, Windows x64 and arm64, and on self-hosted Windows 10 and 11
      VMs when enabled, on every push to main and test and before stable is considered.
    agent_smoke: >
      tools/smoke drives real model sessions in a Docker sandbox with no access to the developer's home, and
      tools/smoke/course_matrix.rb inventories the course matrix in native fixture mode. Run before tagging any release that
      changes what a student sees.
    on_computer: reach doctor reports R-DOC findings including R-DOC-WIRE when the course server advertises a different wire digest, and the hook guard reports a Codex that runs no hooks.
    standards: [STD-PLATFORM-SMOKE, STD-SMOKE, STD-COURSE-SMOKE, STD-HEALTH, STD-WIRE-CONTRACT, STD-SMOKE-REAL-PACKAGES]
  backups:
    student_data: >
      Checkpoint copies of assignment work are kept in two places so work survives deletion of the reach-work folder, and a
      receipt and grade records copy is saved to Downloads before an uninstall. The student's own computer backups are the
      student's.
    plugin: >
      reach.rplugin.yml and config.yml declare a backup policy for the corpus (3 copies, 2 off disk) whose status is pending
      activation.
    server: Backups of course data belong to the course server and are outside this repository.
    standards: [STD-CHECKPOINT-AUTOSAVE, STD-UNINSTALL, STD-STORAGE-GATES]
  release_gate:
    spec: specs/release_gate.yml
    summary: >
      One pre-push gate, installed by tools/release_gate/install and run by the pre-push hook on every push that carries a
      release (a v tag or a changed VERSION). It reads facts from git, the GitHub release list, the specs, and the course
      server, and decides on a severity scale of critical, high, medium, low, and info with a default block at high.
    checks:
      - SEC-SCAN
      - SEC-AUDIT
      - CMP-WIRE-LIVE
      - CMP-WIRE-MAIN
      - CMP-PIN
      - CMP-INSTALLS
      - VER-COLLISION
      - VER-HOMES
      - VER-TAG-RELEASE
      - VER-DEMOTE
      - VER-STABLE
      - KNOWN-ALARM
      - KNOWN-ISSUE
      - KNOWN-DOCTOR
      - KNOWN-BACKUP
      - INST-FLAP
      - INST-STALE
      - GATE-FACTS
      - GATE-SPEC
    classes: A check in the critical class that cannot run blocks, and one in the warn class warns and is recorded.
    lease:
      mechanism: >
        A lease source file names an http or https route and a console address. On a recording run that would end blocked
        or error the gate asks the route with 2 second timeouts and counts only a 200 answer with a lease id of the expected
        shape, for this repository, granted not after and expiring after the gate's clock, at most 24 hours apart. A leased
        run still runs and records every check, exits 0, and consumes no override. No source or any other answer means no lease.
      standards: [STD-RELEASE-GATE-LEASE]
    override: >
      The instructor types the phrase at an interactive terminal with a reason of 10 to 500 characters and an expiry of 1 to 24
      hours. The record covers one push or a stated list of checks, is stored locally and on the course server, and raises an
      alarm until it is consumed or expires.
    no_bypass: No environment variable skips the gate, and the old security audit skip switch is ignored and says so.
    security_audit: >
      The audit scans added lines for secret shapes, secret-bearing file names, student identifiers matched as salted digests
      of the roster, student-style addresses, high-entropy strings, and absolute home paths, then runs one headless read-only
      model audit of the diff with tools restricted to reading. Teach being unreachable never turns the gate off.
    standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE, STD-SECURITY-AUDIT-MODE, STD-NO-INSTITUTION, STD-TEACH-OPAQUE]
decisions:
  - id: D1
    title: Coding is abstracted away from the student
    decision: "Students work only with business, software, process, people and data concepts from the syllabus, and the AI partner writes all of the code and never discusses code with them inside a slice."
    rationale: "The product owner decided the student carries the business behavior and none of the build overhead, which is why slices are cut into thin microbuilds."
    date: "2026-09-29"
    standards: [STD-GUIDED-LEARNER]
    source: docs/DESIGN-DECISIONS.md
  - id: D2
    title: Guide, never hand over answers
    decision: "The tutor leads students to a solution, gives no direct answers, and gives no tips."
    rationale: "The decision is that the agent must not do the student's thinking for them."
    date: "2026-09-25"
    standards: [STD-GUIDED-LEARNER, STD-PLAIN-TALK]
    source: docs/DESIGN-DECISIONS.md
  - id: D3
    title: Enrollment is fail-closed
    decision: "Until the student enrolls, a plugin-level prompt hook blocks every prompt in every harness and rEach refuses every command and tool except a small safe list."
    rationale: "The product owner decided rEach is inert until the install is bound to a rostered student."
    date: "2026-10-01"
    standards: [STD-ENROLL-LOCKDOWN]
    source: docs/DESIGN-DECISIONS.md
  - id: D4
    title: Enrollment answers never reach the agent
    decision: "The passkey, username, student ID and password are collected by the prompt hook, which blocks the prompt, and nothing an agent can call enrolls a student."
    rationale: "Relaying the questions through the agent would pass the passkey, student ID and password through it, and Cowork showed a blocked prompt as an empty response, so Cowork is sent to the Code tab instead."
    standards: [STD-ENROLL-NO-RELAY, STD-ENROLL-PASSWORD, STD-COWORK-CODE-TAB]
    source: specs/app.yml
  - id: D5
    title: One sign-in per computer for 12 hours
    decision: "A single sign-in covers every new chat on the computer, in any harness, for 12 hours, and a sign-in lockout or `reach login out` ends it everywhere."
    rationale: "A per-chat sign-in left Hermes students signed in only in a terminal session no chat reads, and every new chat asked the student again."
    date: "2026-10-13"
    standards: [STD-SIGNIN-ONCE, STD-SIGNIN-PASSWORD]
    source: specs/app.yml
  - id: D6
    title: Only the instructor resets a password
    decision: "A student has no way to reset a password; typing forgot changes nothing and the instructor's Reset password in Teach starts a reset."
    rationale: "Teach keeps only a hash, so nobody can look a password up, and the README says a reset needs the instructor."
    standards: [STD-PASSWORD-RESET-QUEUE, STD-SIGNIN-TERMINAL-RESET]
    source: README.md
  - id: D7
    title: The machine fingerprint follows the computer account, not the app
    decision: "The fingerprint binds the machine, the computer account and the install key, and does not change with the terminal or desktop app that runs rEach."
    rationale: "Students who enrolled in a terminal were locked as moved seconds after opening the desktop app, and the reverse, and had to enroll again."
    standards: [STD-FINGERPRINT-OS-USER, STD-FINGERPRINT-SALT-KEPT]
    source: specs/app.yml
  - id: D8
    title: The microbrain stays on the student's computer
    decision: "rEach keeps a private microbrain of everything the gate lets the student type, and nothing in it is sent to Teach."
    rationale: "The product owner decided the profile and memories are the student's own, to be shown or forgotten on request, with events carrying ids and counts only."
    date: "2026-10-02"
    standards: [STD-BRAIN, STD-BRAIN-PLANES, STD-PROFILE-LOCAL]
    source: docs/DESIGN-DECISIONS.md
  - id: D9
    title: Signed-in assignment work is recorded whole and sent de-identified
    decision: "While signed in on an assignment, rEach records every prompt, reply, reasoning block, action and tool output, and sends it in the background under a random pseudonym with identifiers replaced and an identity index sealed to the course's key."
    rationale: "Instructors should not wait for a turn end or a submission, and the record must be whole and uncut while the student stays unnamed."
    date: "2026-10-03"
    standards: [STD-TRANSCRIPT, STD-TRANSCRIPT-STREAM, STD-TRANSCRIPT-DEIDENTIFY, STD-TRANSCRIPT-EXPORT]
    source: docs/DESIGN-DECISIONS.md
  - id: D10
    title: Extracurricular work never leaves the computer
    decision: "The extracurricular folder is never scanned, mirrored, recorded, graded or sent."
    rationale: "It is the student's own place to build anything outside the course."
    date: "2026-10-01"
    standards: [STD-WORKSPACE-LAYOUT]
    source: docs/DESIGN-DECISIONS.md
  - id: D11
    title: Fault reports carry no content
    decision: "A hidden failure is reported to Teach as a signature with where it happened, the exception class and the errno name, and never an error message, prompt, reply or file."
    rationale: "The decision lets instructors learn of technical problems without the student acting and without any content leaving the computer."
    date: "2026-10-02"
    standards: [STD-ISSUES, STD-TEACH-LINK]
    source: docs/DESIGN-DECISIONS.md
  - id: D12
    title: Attempt ladder per slice
    decision: "Attempt 1 is silent, attempts 2 and 3 explain why another pass is needed, the third failure raises a hand, one student yes covers attempts 4 to 10, and at 10 rEach waits for an instructor."
    rationale: "The ladder lets a student struggle with support and without pressure before humans step in."
    date: "2026-09-29"
    standards: [STD-ATTEMPT-LADDER, STD-HAND-TYPES]
    source: docs/DESIGN-DECISIONS.md
  - id: D13
    title: The agent proves its work before Teach grades it
    decision: "The agent writes its own scenarios that fail on the untouched starting copy and cover every graded name, and submit is refused without a current pass, with the instructors' suite running as a hidden gate."
    rationale: "The decision is that qualification means clean checks, covered scenario names and a passing hidden suite, and the agent sees only names, results and reasons."
    date: "2026-09-29"
    standards: [STD-QUALIFY-BEFORE-SUBMIT, STD-CHECK-BEFORE-SUBMIT]
    source: docs/DESIGN-DECISIONS.md
  - id: D14
    title: Every qualification follows an audited plan
    decision: "Each plan is audited by a fresh pass that reads only the plan and the released constraints, and qualification stops when the audit is missing or stale."
    rationale: "A student's agent once planned its own scoring formula where the slice said to use the supplied port, faked that port in its own scenario, and the hidden scenario failed with no clue why."
    standards: [STD-PLAN-AUDIT, STD-WEIGHTED-PASSES]
    source: specs/app.yml
  - id: D15
    title: Consent is an explicit yes to the question actually shown
    decision: "A submission, module move, live session, feedback note or uninstall happens only on the student's own typed yes, asked by rEach, bound to the question shown and used once."
    rationale: "The October 2026 audit decided that only an explicit yes counts, after loose words such as ok or sure were found to count as yes for 30 minutes with no proof the question was shown."
    date: "2026-10-08"
    standards: [STD-CONSENT-FROM-REACH, STD-SUBMIT-APPROVAL]
    source: TODO.md
  - id: D16
    title: Shell gate fails closed
    decision: "A command the gate cannot fully parse and classify is refused, not allowed."
    rationale: "The audit found that escapes, wrappers and lone ampersands let a command hide its real intent from the gate."
    date: "2026-10-08"
    standards: [STD-HOOK-GUARD]
    source: TODO.md
  - id: D17
    title: No git in slices yet
    decision: "Whenever the agent writes code the feature or bug flow applies, git is refused in slices and the workspace root, and checkpoints keep the history until version control arrives in 2.0."
    rationale: "The flows overwrite files in place and keep history with checkpoints so the student carries no version-control work."
    date: "2026-09-29"
    standards: [STD-FLOWS, STD-NO-GIT-IN-WORKSPACE, STD-CHECKPOINT-AUTOSAVE]
    source: ROADMAP.md
  - id: D18
    title: rEach's files live inside the reach-work folder
    decision: "rEach keeps its own files in the .reach-home folder inside the student's reach-work folder, refuses it to the agent in every kind of access, and relocates old installs by copy, hash check and rename."
    rationale: "A harness sandbox may write only inside the chat's folder, the student should have one folder to open, and losing student data has no acceptable odds."
    date: "2026-10-03"
    standards: [STD-HOME-IN-WORKSPACE, STD-USER-HOME, STD-WORKSPACE-LAYOUT]
    source: docs/DESIGN-DECISIONS.md
  - id: D19
    title: Install from a link with no git
    decision: "The student types nothing beyond asking the agent to install rEach from the link, and the agent downloads the GitHub archive and unpacks it with Ruby."
    rationale: "The decision makes the install work for students with no git, with host-forced steps such as trusting Codex hooks as the only exceptions."
    date: "2026-09-30"
    standards: [STD-RUBY-BOOTSTRAP, STD-SETUP-GUIDE]
    source: docs/DESIGN-DECISIONS.md
  - id: D20
    title: Only tagged releases on stable reach students
    decision: "Students follow the stable branch, which moves at most once a day, only to the Latest tag and only after the platform smoke passes on the candidate."
    rationale: "Main may carry unreleased versions, and a hook change gets a day's notice because Codex re-asks hook trust per hash."
    date: "2026-10-01"
    standards: [STD-AUTO-UPDATE, STD-STABLE-CADENCE, STD-RELEASE-GATE]
    source: specs/app.yml
  - id: D21
    title: Course facts come from the course, not this repository
    decision: "No course material, institution name or school-specific identity appears in the repository; Reach reads a course's facts from its verified guardrails package."
    rationale: "The repository is public and its examples use reserved names, so the decision keeps rEach reusable and free of private details."
    date: "2026-10-01"
    standards: [STD-COURSE-PROFILE, STD-NO-INSTITUTION, STD-COURSE-CORPUS]
    source: docs/DESIGN-DECISIONS.md
  - id: D22
    title: Teach is described only by its published outcomes
    decision: "The public documents describe Teach as the frosted block that checks the roster, seals packages, runs hidden checks, signs receipts and answers hands, and name none of its classes, tables, variables or commands."
    rationale: "Teach is private, and a build blueprint that directs work on Teach is kept in the private superproject."
    standards: [STD-TEACH-OPAQUE, STD-FIGURES, STD-DIRECTIVES-CARRY-NO-SECRETS]
    source: specs/app.yml
  - id: D23
    title: The local pass should predict the Teach pass
    decision: "rEach ships a portable Ruby and a pinned Chrome so that the student's runtime, gem lock and browser match Teach's grader."
    rationale: "The decision aims for a local qualification to be a fair preview of the hidden one."
    date: "2026-09-29"
    standards: [STD-RUBY-BOOTSTRAP, STD-KIT-LOCK-MATCH, STD-QUALIFY-LOCAL-UNABLE]
    source: docs/DESIGN-DECISIONS.md
  - id: D24
    title: A person never sees a raw error
    decision: "Every exchange with Teach sits behind one safety layer that turns failures into plain messages, tracks the connection, and keeps hooks from waiting on the network."
    rationale: "A hook error or backtrace would stop or confuse the student, and a hook that waits on the network can freeze a session."
    standards: [STD-TEACH-LINK, STD-HOOK-RESPONSIVE, STD-MESSAGES-LOADED]
    source: specs/app.yml
  - id: D25
    title: Crisis support comes first and is always delivered
    decision: "A crisis message gets rEach's support answer before anything else, and a wellbeing hand that Teach refuses is never reported to the student as told."
    rationale: "The wellbeing hand once carried an invalid space value and was refused while the student believed it queued."
    standards: [STD-WELLBEING-DELIVERED, STD-CONSENT-FROM-REACH, STD-AGENT-CONTROL]
    source: specs/app.yml
  - id: D26
    title: Protections stop accidents, grading happens on Teach
    decision: "The seal, the witness ledger and the gates are invisible protections against accidents and casual tampering, and grading is done on Teach."
    rationale: "A determined machine owner can defeat any local protection, so no local promise is treated as a guarantee."
    standards: [STD-SEAL-INVISIBLE, STD-GUIDED-LEARNER]
    source: docs/architecture.md
  - id: D27
    title: A security validation pass precedes enrollment
    decision: "Before any identity or password is collected, the agent drives a practice assignment to a verified Teach receipt using only fabricated data."
    rationale: "The pass confirms the connection to Teach is genuine, and its failure text says a connection problem or an impersonating server is possible."
    standards: [STD-WIRE-CONTRACT]
    source: specs/security-validation.yml
  - id: D28
    title: A module choice is locked
    decision: "Once the student says yes to the lock-in question, their module choice is fixed, and a change goes through a transfer request the instructor confirms."
    rationale: "The product owner decided changes to the module set need an instructor's approval."
    date: "2026-09-30"
    standards: [STD-MODULES-LOCK-SYNC, STD-MODULES-PENDING]
    source: docs/DESIGN-DECISIONS.md
known_gaps:
  - id: G1
    title: Assignment-one smoke test is stale
    status: open
    description: "The smoke script expects a nonzero exit from the Claude Code login hook, which now blocks with exit 0, its grader image names no longer match, and the full-submit yes can never be taken because the harness sends no transcript path."
    impact: "The release smoke for assignment one fails or skips its login, guarded-write, submit and grading steps."
    source: TODO.md
    standards: [STD-SMOKE, STD-SMOKE-ASSIGNMENT-GUARDS]
  - id: G2
    title: Unenrolled install accepts an unsigned instructor keyring
    status: partial
    description: "An enrolled install now fetches from its own Teach URL, but the first half of the fix is open: an unenrolled install still accepts an unsigned keyring because it has no pinned trust root."
    impact: "Before enrollment the unlock keyring depends on the connection to the configured Teach address."
    source: TODO.md
    standards: [STD-INSTRUCTOR-UNLOCK]
  - id: G3
    title: Compatibility matrix tests commands, not live harnesses
    status: open
    description: "The tested matrix covers commands and hook command lines only, no leg runs a live Claude Code, Codex or Antigravity session, and the harness's own version is not reported."
    impact: "A passing harness cell does not prove the harness works end to end."
    source: TODO.md
    standards: [STD-COMPAT-TESTED, STD-HARNESS-VERIFIED]
  - id: G4
    title: Windows and macOS paths are unverified
    status: open
    description: "The Windows installer, sandbox behavior, hook quoting, Task Scheduler job and PowerShell paths, the macOS relocation and LaunchAgent, and the Windows VM test legs are recorded as not run on real hosts."
    impact: "Windows and macOS students run code paths that were verified only by reading or on fixtures."
    source: TODO.md
    standards: [STD-CLAUDE-WINDOWS-HOOKS, STD-CODEX-WINDOWS-HOOKS, STD-PLATFORM-SMOKE]
  - id: G5
    title: Course facts still live in the repository
    status: open
    description: "Message wording still says slice, cutout, module and panel, the skills, agent file and MCP bridge still carry course teaching rules, and some course facts such as the time zone default and ladder limits are still written here instead of coming from the course server."
    impact: "The product is not yet reusable across courses without code changes."
    source: TODO.md
    standards: [STD-COURSE-PROFILE, STD-NO-INSTITUTION]
  - id: G6
    title: Built-in Teach address shows the maintainer's host
    status: open
    description: "The built-in course server address in config.yml and the runtime still names the maintainer's machine, and a neutral public domain with a transition for installed students is not yet set up."
    impact: "The public repository exposes a private host name, and switching it needs a safe transition."
    source: TODO.md
    standards: [STD-TEACH-URL, STD-NO-INSTITUTION]
  - id: G7
    title: Analytics keyed to the enrollment are not built
    status: open
    description: "Which usage data, metadata and analytics rEach sends is not yet decided or documented, and nothing is sent keyed to the enrolled student."
    impact: "Instructors lack usage analytics, and the privacy documents cannot yet describe them."
    source: FEATURES.md
    standards: [STD-PROGRESS]
  - id: G8
    title: Forgetting does not erase admitted corpus history
    status: open
    description: "`reach memory forget` scrubs rEach's own spool only, so a finding or source already admitted into a memory plane stays there until the corpus can erase a tombstoned id."
    impact: "A student who asks to be forgotten still has admitted history on the computer."
    source: FEATURES.md
    standards: [STD-BRAIN, STD-BRAIN-PLANES]
  - id: G9
    title: Microbrain compaction is not built
    status: open
    description: "The microbrain is never compacted, and compression and compaction are planned for when it passes 512 MB."
    impact: "A very active student's local memory only grows."
    source: ROADMAP.md
    standards: [STD-STORAGE-GATES]
  - id: G10
    title: Git in the flows is planned for 2.0
    status: by_design
    description: "Version control, a repository per slice, a commit per checkpoint, and branches per feature or bug are specified but not built, and the gate refuses git in slices until then."
    impact: "History for the instructors is checkpoints only."
    source: ROADMAP.md
    standards: [STD-NO-GIT-IN-WORKSPACE, STD-CHECKPOINT-AUTOSAVE]
  - id: G11
    title: Live sessions are checked on Linux with Claude Code only
    status: partial
    description: "Live sessions ran only on Linux with Ruby 3.3 and Claude Code, the wake exists on Claude Code 2.1.288 or newer only, agent-to-agent messages for regular students stay behind a closed safety gate, and the fake Teach has no live routes."
    impact: "Codex, Cowork, Hermes, Windows and macOS students may meet unverified behavior in a live session."
    source: TODO.md
    standards: [STD-LIVE, STD-LIVE-DIAGNOSIS]
  - id: G12
    title: Installation guide copies are out of date
    status: open
    description: "The installation and setup guide still describes the old ~/.reach home, and does not mention announcements or live sessions."
    impact: "Students reading the guide get stale folder names and miss features."
    source: TODO.md
    standards: [STD-SETUP-GUIDE, STD-HANDOUT-PARITY]
  - id: G13
    title: Uninstall is built but not on stable
    status: fixed_unshipped
    description: "`reach uninstall` is on main and test, with no run on Windows, macOS, a real Antigravity or Hermes install, or a live course server, and it is not on stable."
    impact: "Until stable carries it, students cannot remove rEach with the one command."
    source: FEATURES.md
    standards: [STD-UNINSTALL]
  - id: G14
    title: Security validation pass is not released to students
    status: fixed_unshipped
    description: "The pass is on main and checked in scratch runs, but Teach must deploy its side and pin the wire revision before the operator promotes rEach to test and stable."
    impact: "Until then students enroll without the pass."
    source: FEATURES.md
    standards: [STD-WIRE-CONTRACT]
  - id: G15
    title: Bundled agent-control file is behind Teach
    status: open
    description: "The bundled agent-control.yml is an older version than the one Teach carries, so the release gate's pin check warns on every push."
    impact: "The student-facing agent rules lag the instructors' current rules until the file is re-pinned."
    source: TODO.md
    standards: [STD-AGENT-CONTROL, STD-RELEASE-GATE]
  - id: G16
    title: Import search and show are not confined to extracurricular
    status: open
    description: "The skill says to work from the extracurricular folder, but `reach import search`, `next` and `show` run in a course folder land in the course record's command line and nothing enforces the rule."
    impact: "Imported personal context can reach a recorded course session."
    source: TODO.md
    standards: [STD-EXPORT-IMPORT, STD-STORAGE-GATES]
  - id: G17
    title: Claude Code reasoning arrives unreadable
    status: by_design
    description: "Claude Code stores thinking as a signature with empty text, so its reasoning is recorded as not readable, and the Codex path was verified only on a synthetic rollout file."
    impact: "Instructors reading a transcript see no reasoning for Claude Code turns."
    source: TODO.md
    standards: [STD-TRANSCRIPT]
  - id: G18
    title: Hermes and Antigravity paths are not fully verified
    status: partial
    description: "An interactive Hermes session, a Hermes provider connection and the Antigravity install and plugin-directory link are untested."
    impact: "Students using those apps depend on unverified setup paths."
    source: TODO.md
    standards: [STD-HARNESS-VERIFIED, STD-NOHOOK-ENROLL]
  - id: G19
    title: Fake Teach lacks holdings and live routes
    status: partial
    description: "The local Teach stand-in serves announcements from a fixture but has no holdings or live session routes."
    impact: "These flows cannot be exercised end to end in local development."
    source: tools/fake_teach/server.rb
    standards: [STD-HOLDINGS, STD-LIVE]
  - id: G20
    title: The stable cadence standard lags the current workflow
    status: open
    description: >
      STD-STABLE-CADENCE describes a plan that compares origin stable with the Latest release. The stable workflow now
      plans from the test branch tip and its version tag and applies only a notice, a stable-ready issue, or a hold. Stable
      itself moves only by the operator's promotion (specs/polispec/environments.yml).
    source: .github/workflows/stable.yml
    standards: [STD-STABLE-CADENCE, STD-AUTO-UPDATE]
  - id: G21
    title: The polispec environments file names a test update channel the updater does not have
    status: open
    description: >
      specs/polispec/environments.yml says the operator's machines install the #test channel. The updater's channel set
      is stable and canary only, and test installs go through the configured test Teach address and the release gate.
    source: lib/reach/update.rb
    standards: [STD-AUTO-UPDATE]
  - id: G22
    title: Standards name a home folder the code no longer defaults to
    status: open
    description: >
      STD-PROFILE-LOCAL and several other standards place profile, brain, transcript, and setup-log files under ~/.reach.
      Reach::Paths resolves every location through its own home, which defaults to a .reach-home folder inside the
      workspace (STD-HOME-IN-WORKSPACE). The data section states the code's locations.
    source: lib/reach/paths.rb
    standards: [STD-PROFILE-LOCAL, STD-HOME-IN-WORKSPACE]
  - id: G23
    title: Hand outbox entries and the open-hands tracker use the default file mode
    status: open
    description: >
      Reach::Hands writes its outbox entries and the open-hands tracker with a plain File.write, so they take the process
      umask, while the issue registry, the receipts, and most other state files are written with mode 0600 through the
      state-file helper. The files hold hand routes and idempotency keys, not interview answers.
    source: lib/reach/hands.rb
    standards: [STD-STATE-FILE-HELD, STD-STATE-FILE-REPLACE]
standards:
  - id: STD-GUIDED-LEARNER
    text: "Learner presentation follows the six canonical policies in the compiled Polispec guided-learner catalog artifact policy/guided-learner.json: no code disclosure, no student terminal handoffs (including setup), no implementation disclosures, released-assignment scope, plain-language coaching, and truthful essential disclosures. Student installations need no Polispec runtime. Native display replacement and after-display correction have distinct coverage: neither a pattern check nor a Stop retry establishes complete semantic enforcement. Privacy, recording, consent, grading provenance, submission status, crisis support, and access to instructors remain explainable. Existing CODEFILE file locations govern agent work, not instructions to students to open files. Legacy terminal fallback descriptions elsewhere in this historical specification describe operator capabilities only; agents offer an available in-app path or instructor help."
  - id: STD-RUBY-FLOOR
    text: "Every lib/ file parses and runs on Ruby 2.6.10: no endless methods, no pattern matching, no numbered block parameters, no hash/keyword shorthand."
  - id: STD-RUBY-BOOTSTRAP
    text: "Since 0.20.7 rEach starts on a computer with no Ruby. The plugin's Claude Code hooks and MCP server (.mcp.json) run sh exe/reach-run, a POSIX sh launcher (Linux, macOS, Windows Git Bash and Cowork) that runs exe/reach with the Ruby on PATH when it is 2.6.10 or newer, otherwise with the runtime kit's Ruby under ~/.reach/runtime/<id>/ruby, and otherwise installs that Ruby: it downloads the kit bundle for the platform from the pinned runtime release, checks its size and sha256 against exe/runtime-pins (generated from the manifest RuntimeKit pins, and checked against it by tools/runtime_pins.rb), extracts it with tar, places it as RuntimeKit places a ruby-only install and writes runtime/current. A hook never waits for that download: the launcher starts one detached install under a lock and answers at once, and a prompt that arrives before Ruby is ready passes to the agent with M-BOOTSTRAP-WAIT context (rEach is finishing setup; ask the student to send the message again in a minute; do no course work yet) rather than being blocked. The MCP server waits up to 120 s for the install and otherwise exits with a plain message. On Windows, scripts/reach-install.ps1 does the same for INSTALL.md without Ruby and adds the kit Ruby's bin folder to the user PATH (no administrator rights), so harness hooks that call ruby work; an existing Ruby is left alone. Launcher failures are logged to ~/.reach/logs/bootstrap.log and never print a stack or a secret."
  - id: STD-PLAN-AUDIT
    text: "Since 0.54.0 every qualification follows a plan that passed a second-pass audit. After each reach plan save, the agent runs the reach-plan-audit skill as a fresh pass (a subagent where the harness has one) that reads only reach plan audit packet: the plan and the released constraints (behaviour, contract, operation, required instructor APIs, the slice's constraints from slice-api.json, graded scenario names, owned files), never a reference answer. It records pass or fail with reach plan audit record; the record is bound to the plan digest and the constraints digest, so any change to either makes it stale. reach qualify's first step, plan_audit, follows the course profile's qualify.plan_audit: enforce refuses a qualification without a current passing record (QF-PLAN-NONE, QF-PLAN-UNAUDITED, QF-PLAN-AUDIT-FAIL), uncounted on the attempt ladder, and since 0.54.1 the third consecutive enforced refusal raises one agent hand with trigger plan_audit carrying the plan and the audit (wire 2026-10-19b), so a student whose agent cannot get a plan through is never stuck alone; advise records the gap and continues; off skips it; a profile without the key means advise (W-POL-2). A failing verdict quotes the constraint the plan breaks in plain words, the agent explains it to the student, keeps the student's business reasoning in README.md, and corrects the plan to the constraint. reach check adds CK-INSTRUCTOR-API: a backend slice's owned Ruby must call every required instructor API, and since 0.62.1 a call to an API whose method name ends in ? or ! counts. Every qualification sends the plan, its digest and the audit record to Teach (W-QUAL-PLAN-1). Reason: a student's agent planned its own scoring formula where the slice said to use the supplied formula port, its own scenario faked that port, and the hidden scenario failed with no clue why."
  - id: STD-WEIGHTED-PASSES
    text: "Since 0.56.0 (wire revision 2026-10-21a, W-QUAL-PASSES-1) the points where the agent turns the student's input into a solution (the plan, the scenarios, the code) run as candidate passes. The reach-passes skill has the agent write up to eight candidates, each through its own lens (contract literal, port fidelity, normalisation and format, edge and adversarial cases, ledger avoidance, student intent, panel states and step vocabulary, a fresh read), each in .reach/passes/<point>/<n>/ mirroring the owned or qualify paths (plan.yml for the plan); the gate allows writes only to those numbered folders and under them (since 0.59.2 the folder itself, so mkdir of .reach/passes/<point>/<n> works), never to score.json or pick.json; a read-only sed whose script is only safe commands (SAFE_SED_COMMAND, no r, w or e) is judged on its file operands, not on its script, so a regex address such as /def call/,/end/p is not taken for a path (since 0.59.2). reach passes packet <point> prints the constraints (including the course's constraints for the slice), the lenses, the pattern-ledger entries for the point and the winning upstream candidate. reach passes score <point> assembles each candidate in a scratch run folder and computes eight criteria from evidence only (contract, coverage of the graded names, reach check findings, the ledger, required ports called and not faked, the share of its scenarios that fail on the starting copy, the port probe, and self-consistency) and a confidence from the candidate's own lens weights; a block-severity ledger match, a failed local run (for a scenarios candidate only once the owned code is no longer the starting copy, compared without rEach's own mark line and without the README; since 0.59.2 the reason names up to two failing scenarios with the failing step and the first line of the error, or says that no scenario ran or the run gave no report), a write outside the owned and qualify paths, files that do not parse, or a required instructor API that is never called rule a candidate out. The agent's own rating carries no weight and a candidate is never compared with another. reach passes pick <point> installs the highest-confidence candidate (ties to the lower lens number; below one half it is recorded with low_confidence and the agent tells the student), saves a checkpoint first, writes pick.json and clears the other candidates. A pick stays current while the constraints digest and the upstream pick are unchanged. reach qualify's passes step follows the course profile's qualify.passes.mode (enforce refuses with QF-PASSES-NONE, uncounted on the attempt ladder, and the third consecutive refusal raises one agent hand with trigger passes_or_pattern; advise, the default, records the gap and continues; off skips) and the manifest carries passes {point: {lens, confidence, low_confidence, candidate_digest}}. qualify.passes.count (1 to 8, default 8) sets how many candidates. The passes never count on the attempt ladder. Reason: an agent can compute what a required port returns, fake that port with the same fixed answer and assert it back, and nothing in the loop ranked the approaches by evidence before the course server did."
  - id: STD-PATTERN-LEDGER
    text: "Since 0.56.0 (W-QUAL-PATTERN-1, W-PKG-PATTERNS-1) the pattern ledger lists code patterns that are common in AI output and do not work. patterns/generic.yml (schema reach.patterns/v1) ships the generic entries with the app, each {id, severity block|warn|info, points, kind, parameters, message, remedy}; the kinds are regex_owned, regex_feature, regex_steps, i18n_keys, last_run, literal_echo, port_args and faked_port_echo, all data-driven so Teach can add entries of an existing kind without a rEach release. The course-specific entries live only in Teach and arrive in the signed and encrypted patterns package, fetched with the other packages on every sync; an entry with the same id replaces the shipped one, and an entry that names a cutout and slice applies only there. Reach::Patterns.match(workspace, point:, root:) returns {id, severity, file, line, message, remedy} rows, with messages in plain words that never name a hidden scenario or an expected value. A literal_echo match counts a value as stated, and leaves it alone, when the slice's constraints, the operation schema in api/slice-api.json (input and output, with its keys and enumerated values) or contract/README.md state it, the last two only as a whole token (since 0.59.1; before, only the constraints counted, so a contract-required label such as an output status was flagged). reach check adds CK-PATTERN rows (error for block, warning for warn, notice for info); the candidate passes score against them; reach qualify's patterns step follows the course profile's qualify.ledger.mode (enforce refuses a block match with QF-PATTERN, uncounted on the attempt ladder and sharing the passes hand; advise, the default, shows and sends the findings; off does not match locally while Teach still matches server-side) and the manifest carries pattern_matches [{id, severity, file, line}], never code. After the local run the port probe reruns the scenarios with each required port's answers perturbed, one port at a time, in a copy of the run folder; a scenario that touches the port and still passes is insensitive (QF-INSENSITIVE, a warning unless qualify.ledger.mode is enforce, and never counted on the attempt ladder, qualify.probe turns it off) and the manifest carries probe [{scenario, port, sensitive}]. A local run that was a dry run or ran nothing is never recorded as passed. Reason: a few mistakes recur in generated work and each was found only after the course server's hidden run failed."
  - id: STD-QUALIFY-FAULTS
    text: "Since 0.56.0 (W-QUAL-FAULT-1) every qualification attempt that does not pass, and every passes or ledger refusal, writes one reach.qualify-fault/v1 record to .reach/qualify-faults.jsonl (newest 200 kept): the attempt, whether it counted on the ladder, the step that refused it, each step's result and time, the findings with the agent's own scenario name, step text, error class and first error line, the pattern matches, the probe, the picked lenses and their criteria, the plan, constraints, files, tests and kit digests, the package and suite versions, the environment, the previous fault of the slice (so a run of faults is a chain) and the qualification id when the remote step ran. The record is scrubbed with the transcript de-identifier (STD-TRANSCRIPT-DEIDENTIFY): the home folder is cut to ~/… and the file extension, any other path outside the workspace (Windows paths included) is dropped, REACH_QUALIFY_FAULTS_DISABLE=1 turns the record and the send off, and it holds no files, prompt or README text and no student identity, though first_error_line and step text can quote one failing line of the student's tests or code; a hidden scenario's name and reason are never written. Reach sends the records to POST /api/v1/qualify-faults right after the attempt and again from the local file, in batches, with at most 60 an hour per install and a day's pause on a 404 from an older Teach; a failed send never blocks or fails a qualification. A hand bundle lists the fault_id of each attempt in attempts.history. Reason: a local failure reached the instructors only inside a hand after three failures, where the last output was the first thing cut to fit."
  - id: STD-PORTS-ONLY
    text: "When rplugin is present, code reaches its ports through Reach.ports (Rplugin::Ports.for('reach', root:)); without it, Reach keeps its own records under ~/.reach. Reach never reads or writes another plugin's data. reach setup touches a harness only through that harness's own install command or its documented plugin directory."
  - id: STD-WIRE-CONTRACT
    text: "Every byte Reach sends to or accepts from Teach follows specs/wire.yml. reach doctor reports R-DOC-WIRE when Teach advertises a different contract digest."
  - id: STD-ENROLL-PASSWORD
    text: "Since 0.16.21 (wire revision 2026-10-01e) the last enrollment step asks the student to choose a password of at least 8 characters, twice, and to write it down (M-ENR-ASK-PASSWORD, repeated in M-ENR-DONE). Like every enrollment answer the prompt hook blocks both entries, so the agent never sees them and nothing keeps them; the flow file keeps only a salt and a SHA-256 between the two entries and drops both when the flow ends. Reach sends the password in the shape v2 W-API-ENROLL body and never stores it; since 0.28.0 it keeps a salted one-way verifier of it (STD-SIGNIN-PASSWORD). From 0.28.0 to 0.53.24 a student who already had a password had to type that one (M-ENR-PASSWORD-WRONG otherwise); since 0.53.24 (wire revision 2026-10-18d, W-ID-5) a student who enrolls again, for example after reinstalling rEach, chooses a password as at a first enrollment and Teach takes it as the new one, so an existing student record never blocks a new enrollment; M-ENR-ASK-PASSWORD-REENROLL says so, and M-ENR-PASSWORD-WRONG remains for a Teach older than that revision. Hermes, which cannot block a prompt, is sent to reach enroll in a terminal (M-ENR-PASSWORD-TERMINAL), which asks with typing hidden or reads --password-stdin. Since 0.46.2 a failure on the computer after Teach has accepted the enrollment (saving the install key, install file, fingerprint, stamp or password verifier) is not answered with the confirm question again: Reach::EnrollFlow.register records a fault (where enroll_flow:register) and answers M-ENR-PASSWORD-RETRY-FAILED with M-ENR-LOCAL-SAVE-FAILED naming the error, and the flow goes back to awaiting_password. Any other unexpected error in an enrollment step records a fault (enroll_flow:step) and answers M-ENR-STEP-FAILED with the current question. Reason: on Windows a student on 0.38.10 was asked to type the same password again after every confirm while each confirm registered a new install on Teach."
  - id: STD-SIGNIN-PASSWORD
    text: "Since 0.28.0 (wire revision 2026-10-04d, W-ID-5) signing in takes the password the student chose at enrollment, and a hook enforces it: after the student ID and the yes, the prompt hook blocks with M-LOGIN-ASK-PASSWORD and the session stays unconfirmed, so the write, shell and read gates keep refusing, until the right password is typed. Reach::Password checks it against ~/.reach/state/login/verifier.json (0600), a salted PBKDF2-HMAC-SHA256 digest (600000 iterations) written when an enrollment, a server check or a reset succeeds and bound to the student and install; with no verifier it asks the course server once, and when the server cannot be reached the sign-in waits (M-LOGIN-PASSWORD-OFFLINE), so deleting the verifier signs nobody in. A wrong password counts toward the sign-in lockout. The password itself is never stored, logged, recorded in a transcript or the microbrain, or shown to the agent: every prompt of these steps is blocked. Nobody can look a password up. A student who forgot it types forgot password; once an instructor has allowed a reset for them, rEach asks for a new password twice and sets it (W-API-PASSWORD-RESET), and until then it tells them to ask their instructor. Enrolling again takes the existing password unless a reset is allowed. Hermes, which cannot block a prompt, sends the student to reach login password and reach login reset in a terminal, which read with typing hidden and work for every harness. The policy's login.password false switches the step off; installs enrolled before the enrollment password existed have none and sign in without one. While the sign-in lockout is active the prompt hook asks the course server whether a password reset is allowed (the same GET /api/v1/password/reset, at most once every 60 seconds, the answer cached in ~/.reach/state/login/reset_probe.json, one bounded request within the hook's existing budget). Since 0.35.11, when an instructor has allowed a reset the lockout is lifted: the failures and the lockout are cleared, a session that already passed the student ID and the yes (awaiting_password or a reset step) moves to the new password step and the student gets M-LOGIN-UNLOCKED-BY-TEACH followed by M-LOGIN-RESET-NEW (a Hermes chat is sent to the terminal instead), while a session that has not confirmed its ID continues from where it was, after M-LOGIN-UNLOCKED-BY-TEACH, with M-LOGIN-ASK for a fresh or awaiting_id session and the confirmation question for awaiting_confirm, so a reset never skips the identity check; a denied session stays locked out. reach login reset lifts it the same way, and it only reaches a session in a password step. M-LOGIN-LOCKED tells the student that their instructor can unlock it right away by allowing a password reset. Since 0.35.11 a valid instructor code also signs that one chat in and clears the lockout (STD-INSTRUCTOR-UNLOCK). Since 0.35.18 commands that require a sign-in (Login.require_active!) require the current chat's own sign-in whenever its session id is known (hook event, CODEX_THREAD_ID, CODEX_SESSION_ID or CLAUDE_CODE_SESSION_ID); with no session known, any active sign-in on the install is accepted as before."
  - id: STD-SIGNIN-ONCE
    text: "By the instructor's decision of 2026-10-13 the student signs in once per computer every 12 hours, not once per chat. A sign-in (the student ID, the yes and the password, or the yes alone where no password is required), made in a chat or in a terminal with reach login, reach login password or reach login reset, writes ~/.reach/state/login/signin.json (0600, schema reach.signin/v1: student_id, install_id, the session and harness it came from, signed_in_at, expires_at). While it is live every harness session on that install, new or already open, in any harness and across restarts, counts as signed in without being asked: the prompt hooks pass, the write, shell and read gates allow, reach hello greets normally, and the current chat's own sign-in that Login.require_active! asks for (STD-SIGNIN-PASSWORD) is met. It lasts the course policy's login.max_hours (12) from signed_in_at, and a shorter max_hours also shortens a sign-in already made. It is bound to the enrolled student and install, so a re-enrollment, an install enrolled for another student or a test student (an instructor persona, which has its own Reach home) starts signed out and never inherits it, and a test student's sign-in never reaches the student install. A chat waiting at any sign-in step when a sign-in is made anywhere is confirmed with it and its next prompt carries M-LOGIN-DONE-AGENT. A denied chat stays denied and a denial ends the sign-in. By the instructor's further decision of 2026-10-13 a sign-in lockout also ends it: when the wrong student IDs or passwords reach the lockout, or the course server answers rate_limited to a password check, signin.json turns signed_out and every chat's own confirmed sign-in expires, so every chat, open or new, asks again on its next prompt, and the student is told so (M-LOGIN-LOCKED-SIGNED-OUT) when a sign-in was live. reach login out ends it the same way on request, confirms with M-LOGIN-OUT-DONE, and answers M-LOGIN-OUT-ALREADY when nothing was signed in; it acts on the current Reach home only, so with a test student active it signs out only that test student and otherwise only the enrolled student. A valid instructor code still signs in only its own chat (STD-INSTRUCTOR-UNLOCK) and never starts the install's sign-in. M-LOGIN-OK, M-LOGIN-RESET-OK, M-LOGIN-TERMINAL-OK and M-LOGIN-TERMINAL-RESET-OK tell the student that new chats will not ask again for max_hours, and reach login status prints when the sign-in ends. Reason: reach login in a separate terminal, where Hermes students are sent because Hermes cannot keep a password out of the chat, signed in only a terminal-<random> session that no chat ever reads, so the terminal said signed in while the Hermes chat kept refusing; and every new chat asked the student to sign in again."
  - id: STD-WAIT-NOTICE
    text: "Since 0.51.12 the student is told about a long wait before it starts, in a calm sentence or two: roughly how long to expect and what closing the app (or the chat) does, worded for what really happens. qualify takes a few minutes, longer the first time, and closing stops it here (the course server may still finish its run, but the result does not show here); submit takes up to half a minute; nothing is saved for sending until the student says yes (closing while the question is open sends nothing); after the yes the work counts as received when it reaches the course server, which sets the receipt time and the late flag on arrival, so work that arrives after the due time is marked late and the app should stay open until the receipt shows; if it closes first the outbox entry (written before the send) is sent at the next sync, and the course server can still refuse it (shelved, M-SUBMIT-REJECTED-LATER shown by reach sync or reach status in a terminal) or the instructors' hold keeps it queued, so only the receipt means it was received; update takes a minute or two and rEach finishes it the next time it opens; the sync after enrolling and reach_sync take about a minute or two, stop if the app closes, lose nothing, and the next sync carries on; an export import runs in the background and carries on where it left off the next time rEach opens; compacting runs in a detached background process that normally carries on if the app closes, and if it is stopped early the next session marks it failed, tells the student, and they can compact again; a live wait is at most 45 seconds and closing ends only the wait. The note is carried by the description of each long reach_ tool (Reach::MCPBridge::TOOLS), by Reach::Guardrails::WAIT_RULE in every rendered rules file, by the LEAN and QUALIFY directive bodies, and by the messages rEach already prints at the start of the operation (M-SUBMIT-ASK, M-UPDATE-STARTED, M-UPDATE-INSTALLING, M-ENR-SYNCING, M-RELOCATING, M-LIVE-REQUESTED, M-IMPORT-STARTED, M-STORAGE-COMPACT-STARTED). No time is promised that rEach cannot keep: where the duration is unknown the note says it can take a while."
  - id: STD-SIGNIN-TERMINAL-RESET
    text: "A chat that cannot take a password (Hermes) and waits for a new password (awaiting_new_password or awaiting_new_password_again, after the instructor reset the password or allowed a reset) is sent to reach login reset (M-LOGIN-RESET-TERMINAL), and one that waits for the current password to reach login password (M-LOGIN-PASSWORD-TERMINAL). reach login password goes straight on to the new-password step of reach login reset when no chat waits for the current password but one waits for a new one, and when the course server answers that the password is not set; reach login does the same for the latter. Reason: a Hermes student whose instructor had reset the password was sent to reach login password, which accepts only a chat waiting for the current password, so the terminal answered that no chat was waiting and the chat sent the student back to the same command."
  - id: STD-PASSWORD-RESET-QUEUE
    text: "Since 0.48.0 (wire revision 2026-10-09a, W-ID-5, W-API-ENROLL-ATTEMPT-OPEN, W-API-ENROLL-ATTEMPT-STEP, W-AUTH-9) a student has no way to reset a rEach password; this replaces the forgot-password path of STD-SIGNIN-PASSWORD. Typing forgot or reset at the sign-in password prompt answers M-LOGIN-RESET-BY-INSTRUCTOR and changes nothing; the same words at any enrollment step answer M-ENR-RESET-BY-INSTRUCTOR followed by the current question, so they are never read as an email or an id. The instructor's Reset password button in Teach marks the reset pending. Reach::Password stores what Teach says in state/login/password_state.json (from the status document's password block, from GET /api/v1/password/reset when the student answers yes, and from the 409 of verify); when it says pending, sign-in removes verifier.json and asks for a new password twice (M-LOGIN-RESET-REQUIRED), cancel is refused, and only a successful W-API-PASSWORD-RESET clears the flag. A verifier records Teach's password_set_at and is used only while password_state.json does not contradict it. A 409 password_not_set (:unset) never signs a student in. Reach also reports enrollment progress: after the course code is accepted it makes the install key pair at once (kept as keys/install.pem.attempt until enrollment completes), queues each step (code, username, student_id, confirmed, password_chosen) in state/enroll/outbox.json (reach.enroll_outbox/v1) and a detached process (Reach::EnrollOutbox.drain!, serialized by a flock on outbox.json.lock) opens the attempt and posts the steps signed with that key, with X-Reach-Attempt in place of X-Teach-Install, removing a step only after a 2xx. The password never enters the queue. Since 0.48.1 (wire revision 2026-10-09b) the username and student_id steps carry only their time; the typed username and student id travel with the confirmed step, after the student said yes, and a no clears the queue before anything identifying is sent. Enrollment sends attempt_id and the same key, so a replay after a lost response is safe; with no attempt it enrolls as before. Failures never block the hook."
  - id: STD-TEACH-URL
    text: "rEach carries the course's Teach URL and never asks the student or the agent for it. config.yml teach.url names Teach over HTTPS (https://sven-f1l1.tail062fd2.ts.net since 0.16.19, Tailscale Funnel to the course server) and every enrollment path uses it: the prompt-hook enrollment flow and reach enroll (the reach_enroll tool took no teach_url since 0.16.20 and enrolls nothing since 0.35.2, STD-ENROLL-NO-RELAY). REACH_TEACH_URL and the unlisted --teach-url are operator overrides, an install keeps the URL it enrolled with (install.yml teach_url), and with no URL configured rEach says to run reach update (unreachable since 0.21.11, which builds the URL in; the guards stay as defenses). Since 0.18.2 reach setup and update/apply.rb also write config.yml teach.url to ~/.reach/state/teach.json, so an installed rEach still knows Teach when config.yml is missing, unreadable or blank; the lookup order is REACH_TEACH_URL, config.yml teach.url, then that file, so a URL changed by an update wins over the saved copy; since 0.21.11 Reach::Runtime::TEACH_URL (https://sven-f1l1.tail062fd2.ts.net) is the built-in last resort, so rEach always has a course server. Since 0.21.11 reach enroll in a terminal that cannot reach Teach names the URL and the network cause (M-ENR-CLI-OFFLINE), and reach doctor checks Teach (R-DOC-NET) before enrollment too, naming the URL and the cause. since 0.33.0 config.yml carries no enrollment identity rules, so they come from Teach's preview."
  - id: STD-CA-ROOTS
    text: "Since 0.21.11 every reach process trusts a CA bundle that exists on the computer. exe/reach, before anything loads OpenSSL, sets SSL_CERT_FILE to the running Ruby's own libexec/cert.pem when SSL_CERT_FILE is unset or names a missing file and that bundle exists (lib/reach/ca_roots.rb). The macOS runtime kit (rv-ruby) ships that bundle but its OpenSSL looks for certificates only under the build machine's /opt/homebrew/Cellar/rv-portable-openssl path, so without it every HTTPS request from the kit Ruby (enrollment, sync, update, downloads) failed certificate verification; since 0.21.3 every command on macOS's Ruby 2.6 runs under the kit (STD-RUBY-BOOTSTRAP), so this blocked every Mac student with the kit installed. Child processes inherit the variable. A SSL_CERT_FILE that names an existing file is never replaced."
  - id: STD-PERSONA-ONE-SOURCE
    text: "The rEach persona body is identical in skills/reach-assistant/SKILL.md and agents/reach.md, and quotes the G-FIRST-RUN greeting from locales/greetings.en-US.yml; reach doctor reports R-DOC-PERSONA otherwise."
  - id: STD-CODEX-PLUGIN-HOOKS
    text: "Codex lists rEach's plugin hooks for the student to trust. Codex 0.156 and newer loads no plugin hooks when a root plugin.json sits beside .codex-plugin/plugin.json (openai/codex#47925), so since 0.16.16 reach setup, every update and reach mcp rename that file to plugin.json.agent-plugins in Codex's cached copy of rEach only ($CODEX_HOME/plugins/cache/*/reach/*/ holding .codex-plugin/plugin.json). The repository and the install folder keep it for Antigravity, and nothing is deleted. Since 0.20.4 a locked reach hello run by the agent reports the repair (M-ENR-AGENT-CODEX-REPAIRED) only in the run that renamed a file, never again for a copy set aside earlier, and when the student has already restarted and rEach is still locked M-ENR-AGENT-GUIDE sends them to enroll in Terminal (reach enroll, interactive, so the agent never sees the passkey, username, student ID or password) instead of restarting again. Since 0.21.12 rEach's MCP server starts under Codex both before and after that repair, on Windows too: the root mcp.json (read while the root plugin.json is present) runs ruby with ${PLUGIN_ROOT}/exe/reach, which Codex expands, because Windows has no sh; .codex-plugin/plugin.json (read after the repair) runs ruby exe/reach mcp (./exe/reach since 0.21.14) with cwd \".\", because Codex 0.160 expands neither ${PLUGIN_ROOT} nor sets a working folder for a server declared there, and resolves a relative cwd against its cached copy of rEach. Since 0.53.25 rEach approves the two plugin hooks itself (STD-CODEX-HOOK-TRUST), because the desktop app does not list them for the student."
  - id: STD-HOOK-RESPONSIVE
    text: "Since 0.19.1 no session-start or prompt hook waits on the network or on another process (the enrollment steps, and since 0.28.0 a password check with no local verifier and the password reset steps, make one bounded request each: 5 s to connect, 10 s to read, no retry), and the Stop and SessionEnd hooks (reach hook stop) keep to their bounded quick requests (STD-TRANSCRIPT). The prompt that follows a successful sign-in gets a short signed-in context (the student's name and that course work may begin, M-LOGIN-DONE-AGENT) with the session start's local parts only; the status refresh, the course reference ingest and every other step that can touch the network or a contended lock run in one detached reach hello --background, whose result the next prompt carries. The just-signed-in marker is removed only after the hook has written its answer, so a hook the harness kills delivers it on the next prompt. Every file lock taken on a hook path waits at most hooks.lock_wait_s (default 2) and then degrades without losing data: a step whose lock is busy is skipped for that event. Each hook answers within 2 s on a warm computer; the Codex workspace prompt and session hooks get the same 60 s and 10 s limits as the plugin's."
  - id: STD-SIGNIN-PLUGIN-HOOK
    text: "Since 0.21.5 the student signs in from the plugin's prompt hook (reach gate enroll in hooks/hooks.json and hooks/codex.json), not only from a course folder's prompt hook (reach gate prompt). Codex runs a plugin or project hook only after the student trusts it and its hash still matches; every course folder's .codex/hooks.json is a new, untrusted project hook (and its Ruby path changes with the runtime kit), so a Codex student who trusted only the plugin's hooks was told by the session start to wait for the student-ID question that no hook ever asked. Once enrollment is done and the install is not in instructor mode, the plugin hook runs the same Reach::Login step in every folder. When both hooks run for one prompt, the first to take ~/.reach/state/login/prompt.lock (a bounded hook lock, STD-HOOK-RESPONSIVE) evaluates and commits the step and records the prompt's session and digest for 30 s; the other, or one that finds the lock busy, passes that prompt with no answer, so the ID is judged once, one hook speaks, and a sign-in prompt never enters the microbrain (STD-BRAIN). hooks/codex.json keeps its command line byte for byte, because changing it would make Codex mark the trusted plugin hook modified and stop running it. Hermes keeps signing in through its own gate prompt hook."
  - id: STD-ENROLL-NO-RELAY
    text: "Since 0.35.2 nothing an agent can call enrolls a student: the course passkey, email, student ID and password reach rEach only through its own prompt-hook flow (Reach::EnrollFlow) or the interactive reach enroll in a terminal, and the flag form for scripts (--course-passkey, --username, --student-id, --password-stdin), never through the AI (as STD-COWORK-CODE-TAB). The reach_enroll tool takes no arguments and posts nothing; it answers M-GATE-NOENROLL, M-ENROLL-NO-HOOK while Codex is not running a sign-in prompt hook (Reach::HookLiveness.signin_hook_dead?, STD-SIGNIN-HOOK-SILENT), or on an enrolled install M-ENROLL-ALREADY with the reach_next step. reach enroll with a bare passkey argument refuses with M-ENROLL-POSITIONAL, which points to the chat and to reach enroll on its own. Reach::Enroll.generate_and_register, the pre-v2 enroll request both used, is gone: Teach (W-API-ENROLL) refused its body as invalid_request every time, so the student saw M-ENROLL-REFUSED (that the passkey was not accepted) whatever they typed, as live Teach showed on 2026-10-05."
  - id: STD-SIGNIN-HOOK-SILENT
    text: "Since 0.34.9 (wire revision 2026-10-05a) Reach tells a silent sign-in hook apart from a silent course-folder hook. Reach::HookLiveness.signin_hook_dead? is true only for a Codex harness and when neither prompt hook that signs the student in has run since the latest Codex session start in hooks_seen.json (session_at, session_label): the plugin's gate enroll (hooks_enroll_seen.json at, STD-SIGNIN-PLUGIN-HOOK) and a course folder's gate prompt (hooks_seen.json prompt_at); or neither ever ran; or, with no session start recorded, neither ran in the last 15 minutes (wire revision 2026-10-05b; 0.34.9 and 0.34.10 read only gate enroll). It backs the detector signin_hook_not_running (W-KI-4); hooks_not_running and STD-HOOKS-REQUIRED keep reading the course-folder hooks. While it is true and the student is enrolled but not signed in, the reach_next tool returns M-NEXT-LOGIN-NO-HOOK instead of M-NEXT-LOGIN, which tells the student that Codex is not running rEach's sign-in step, not to type their student ID or password in the chat, and to restart Codex, allow rEach's hooks and start a new chat; before 0.34.9 the tool kept asking for the student ID while the hook that should have taken it never answered. The reach next command and the session anchor still show M-NEXT-LOGIN. Since 0.34.10 the same condition on the MCP path also replaces M-LOGIN-NEEDED with M-LOGIN-NEEDED-NO-HOOK, in reach_hello's sign-in context and in every tool refusal that says the student has not signed in (Reach::Login.require_active!), so the agent is no longer told that a chat request for the student ID is genuine while no hook can take it; the session-start hook and terminal commands keep M-LOGIN-NEEDED. Since 0.34.11 the sign-in step counts as running when either prompt hook ran, the plugin's gate enroll (hooks_enroll_seen.json at) or a course folder's gate prompt (hooks_seen.json prompt_at), because both sign the student in (Reach::Login.claim); 0.34.9 and 0.34.10 read only the plugin's stamp and told a student whose course-folder hooks ran that sign-in could not start. A tool gate (Reach::Gate.require_login!) refuses with the same M-LOGIN-NEEDED-NO-HOOK in that state. reach_known_issues and the session context name a remedy only for an issue whose detector fires; before 0.34.9 every matching entry's remedy was named, so the agent was told to run a fix for a problem rEach had not detected."
  - id: STD-CODEX-PROMPT-JSON-BLOCK
    text: "Since 0.35.16 a Codex prompt hook (reach gate enroll or reach gate prompt with --harness codex) blocks by printing {\"decision\":\"block\",\"reason\":<the message>} as its only standard output and exiting 0, never by exiting 2 (Reach::CLI.run_hook). Codex on Windows runs hooks in the session shell, PowerShell -Command, which turns a native exit 2 into exit 1, and Codex treats exit 1 as a hook failure that does not block, so the student's passkey, student ID, yes or password went on to the model and rEach's question never showed. Codex's UserPromptSubmit handler blocks on that JSON the same way as on exit 2 with standard error and shows the reason to the student. Since 0.35.17 the Codex tool gates (reach gate write, gate shell, gate read with --harness codex) block the same way, with {\"hookSpecificOutput\":{\"hookEventName\":\"PreToolUse\",\"permissionDecision\":\"deny\",\"permissionDecisionReason\":<the message>}} as the only standard output and exit 0, which Codex's PreToolUse handler treats like exit 2 with standard error; before, PowerShell's exit 1 let a blocked tool call run. Since 0.50.1 a Claude Code prompt hook blocks with JSON too (STD-CLAUDE-WINDOWS-HOOKS). Every other harness keeps exit 2 with the message on standard error; Cowork keeps STD-COWORK-CODE-TAB."
  - id: STD-CLAUDE-WINDOWS-HOOKS
    text: "Since 0.50.1. Claude Code on Windows runs hook commands in PowerShell, which cannot run a command that starts with a quoted path, so every hook rEach writes to a course folder's .claude/settings.json on Windows is & \"<ruby>\" \"<reach>\" <args>; exit $LASTEXITCODE (Reach::Harness.hook_line), and exit 2 from a gate still reaches Claude Code as exit 2. Reach::Relocation.repair_ruby_paths!, run by reach hello, treats a Windows course folder whose Claude hooks are not wrapped as stale and rewrites it, and Reach::Relocation.command_pair reads the wrapped form. A Claude Code prompt hook (gate enroll or gate prompt with --harness claude-code, Cowork included since 0.50.3) that blocks prints {\"decision\":\"block\",\"reason\":<the message>,\"hookSpecificOutput\":{\"hookEventName\":\"UserPromptSubmit\",\"suppressOriginalPrompt\":true}} as its only standard output and exits 0, so the student sees the reason without the executable and error prefix Claude Code put in front of standard error. The sign-in block (M-LOGIN) on Claude Code carries the message without the gate.login agent framing. Confirmed on a student's Windows computer against 0.48.1. Not covered: the plugin's own hooks/hooks.json and .mcp.json still run sh exe/reach-run (STD-RUBY-BOOTSTRAP), so a Windows computer where PowerShell cannot find sh runs no plugin hook, including reach hello and its repair."
  - id: STD-CODEX-WINDOWS-HOOKS
    text: "Since 0.51.10. Codex on Windows runs every command hook through the session shell, powershell -NoProfile -Command (pwsh when it is found first, cmd.exe /C only when Codex finds no PowerShell), after replacing ${PLUGIN_ROOT} in a plugin hook's command with the plugin folder. The plugin's own hooks (ruby \"<plugin>/exe/reach\" hello and gate enroll) therefore ran, but every hook rEach wrote to a course folder's .codex/hooks.json started with a quoted Ruby path, which PowerShell cannot parse, so on Windows the Codex tool gates (gate write, gate shell, gate read), check, transcript code and hook stop never ran. On Windows each of those hooks is now & \"<ruby>\" \"<reach>\" <args>; exit $LASTEXITCODE (Reach::Harness.hook_line, the same form as STD-CLAUDE-WINDOWS-HOOKS); macOS and Linux keep the sh form, and the standard output JSON contract (STD-CODEX-PROMPT-JSON-BLOCK) is unchanged. Reach::Relocation.repair_ruby_paths!, run by reach hello, treats a Windows course folder whose Codex hooks are not wrapped as stale and rewrites it. A rewritten hook has a new Codex trust hash: Reach::Harness.configure_codex approves it again through Reach::CodexSetup.refresh_trust! when the student has agreed that rEach may approve its course checks, and otherwise the codex_hooks_untrusted detector and M-HOOKS-UNTRUSTED ask the student once. The platform smoke step codex_course_hook runs the written exec_command hook through powershell.exe and pwsh.exe on the Windows legs and sh elsewhere and checks the PreToolUse deny on standard output. Checked against PowerShell 7.6.6 on Linux; Windows PowerShell 5.1 is covered only by the Windows smoke legs. Also since 0.51.10 every rEach command line a message hands the student or the agent to run (M-LOGIN-PASSWORD-TERMINAL, M-LOGIN-RESET-TERMINAL, M-ENR-PASSWORD-TERMINAL, M-ENR-DONE-LAUNCH, the Hermes setup line, M-ENR-AGENT-GUIDE, M-ENR-AGENT-NOHOOK-GUIDE, M-ENR-HERMES-GUIDE, the setup interview line and the hello.session line) comes from Reach::Runtime.terminal_command, which on Windows puts & in front so it runs when pasted into PowerShell; before, only the hello enroll, login and harness move lines had it. A line the assistant runs itself (the hello session line, the setup guide command and setup's hello line) comes from Reach::Runtime.agent_command, which keeps the plain quoted form for Claude Code, whose shell tool on Windows is Git Bash, and uses the & form everywhere else. macOS and Linux keep the sh form. Since 0.64.5 the Codex shell gate judges a command as PowerShell when the hook runs on a Windows host (gate shell --harness codex with Reach::Runtime.windows?), and on any host when every segment of the command starts with a modeled Verb-Noun cmdlet (Reach::Gate.cmdlet_command?), so a Windows Codex student's reads such as Get-Content README.md, Get-ChildItem and Select-String are no longer refused with M-SHELL-UNMODELED and their backslash paths are judged as the folders they name; before, the bare cmdlet was judged as POSIX shell and the student could not read the assignment README or a skill's SKILL.md. Select-Object -First N and -Last N pass as head and tail. The platform smoke step codex_course_hook now also sends Get-Content README.md | Select-Object -First 5, which must pass, and Get-Process, which must be refused. What Codex puts in the PreToolUse payload on Windows is not confirmed; the host rule assumes the command arrives as the bare text the model wrote."
  - id: STD-NO-TOP-BIN
    text: "The plugin root carries no top-level bin/ directory, because claude.ai and Cowork reject a plugin that has one (\"Plugin contains a top-level bin/ directory\"), whether it arrives by a marketplace added by URL, by organization sync or by upload. Since 0.18.4 the installer is scripts/reach-install, fetched by INSTALL.md from raw.githubusercontent.com/SteveBenner/rEach/stable/scripts/reach-install and loaded by reach update from the installed plugin's scripts/ folder."
  - id: STD-PROFILE-LOCAL
    text: "The student's interview profile lives only in ~/.reach/profile.yml (0600). It is sent to Teach only inside a hand-raise bundle the student agreed to include it in, and reach profile forget deletes it. The profile's extra_credit list is not interview data and is the one part that syncs with Teach (STD-EXTRA-CREDIT). Interview answers typed in a course workspace are prompts like any other: nothing records them (STD-TRANSCRIPT), though the local microbrain may learn from them (STD-BRAIN). Since 0.47.3 (security audit F05) that agreement is native: reach hand raise --include-profile attaches the fields only with a one-use, session-bound profile_share consent whose subject is the fields being sent, or a yes the student types in a terminal; an agent-supplied flag alone attaches nothing."
  - id: STD-EXTRA-CREDIT
    text: "Since 0.20.0 (wire revision 2026-10-02f, W-XC-1..3) a student redeems an extra-credit code an instructor texted them, with their answer, at any time while enrolled: reach extra-credit CODE ANSWER, the reach_extra_credit MCP tool, or by telling the agent, which runs it. Reach saves the entry to the extra_credit list of ~/.reach/profile.yml as pending before sending it to Teach, keeps it pending through transport failures and retries it on every reach sync, and marks it recorded or refused with Teach's reason (M-XC-*). reach sync makes the recorded entries equal Teach's list. reach extra-credit list shows the entries. reach profile forget deletes the local list only and says Teach keeps its record. Debug events carry entry_id, state and outcome, never the code or the answer."
  - id: STD-FEEDBACK
    text: "Since 0.52.0 (wire revision 2026-10-13d, W-API-FEEDBACK, W-FB-1..5) a student sends their instructors a feedback note, something that can wait, in one of eight categories (general, praise, suggestion, request, question, complaint, problem, pace), named by default or anonymous, by telling the agent, which runs reach feedback send or the reach_feedback MCP tool. Reach asks the question itself, showing the category, named or anonymous and the exact message, and sends only after the student's own yes in that session (STD-CONSENT-FROM-REACH); the agent never writes, improves or shortens the student's words without asking. Reach saves the note as pending in feedback.json before sending, retries it on every reach sync with the same key, and tells the agent once of each instructor reply and each note marked acted. An anonymous note carries no name to Teach and cannot be answered; Reach says so, and that a course chat it was typed in is still recorded (STD-TRANSCRIPT), before the yes. Something that blocks the student or needs a person now is a hand (STD-HAND-TYPES), never feedback. Debug events for a named note carry feedback_id, category, state and outcome, never the message. Since 0.52.4 an anonymous note leaves no debug event, request, fault or log line while Reach asks for, sends or retries it (every hook turn is silent while an anonymous question waits), goes with its day only as written_at, and loses its send key and feedback_id once Teach accepts or refuses it (W-FB-3). The remaining link is timing: Teach records when an install last made any other request, which may sit near an anonymous note's arrival (for example during the reach sync that retries it); PRIVACY.md says so plainly. Since 0.52.0 G-REACH-OUT tells an onboarded student once, in plain words, about raising a hand and the eight kinds of feedback."
  - id: STD-TRANSCRIPT
    text: "Since 0.25.0 (wire revision 2026-10-03i, W-TRN-0 to W-TRN-5) rEach records the conversation while a student is signed in and working on an assignment, and only then. The bounds are that the session is signed in (when the course requires sign-in), the cached course status names a current assignment, and the session runs in a slice workspace or the course folder root. Inside the bounds every allowed prompt, every reply, reasoning block and action of the AI, and the assignment code (code blocks in replies, each AI write, a turn-end scan of the slice's owned files) is appended to ~/.reach/transcripts/<session>.jsonl and sent to POST /api/v1/transcripts at turn end, on reach sync and before a submission that needs the student's own part. Outside the bounds (before sign-in, in the extracurricular folder, outside the course folder, in instructor mode) nothing is written or sent; rEach only moves its place in the harness's own transcript forward, and a session's recording never reads what that transcript held before the session's first recorded prompt. A prompt the gate or the sign-in blocks is not recorded. The prompt hook records the prompt, the PostToolUse hook (reach transcript code) records AI writes, and reach hook stop records the turn and sends. An own-part answer carries the session and seq of its recorded prompt, or null when it was not recorded. Students are told through the docs, PRIVACY.md and the persona's answer when they ask what rEach shares; there is no in-session notice. From 0.21.1 to 0.24.x nothing was captured; rEach no longer deletes ~/.reach/transcripts. Since 0.47.3 (security audit F01) private data never enters the record: a call to reach_profile_show, reach_profile_save, reach_profile_forget, reach_recall, reach_remember, reach_memory_forget or reach_import (MCP or the matching reach CLI verb in a shell) and any read whose path resolves inside the extracurricular folder or Reach's profile and brain state is kept only as a withheld placeholder (action summary [private tool call withheld], output text null with note private output withheld), by call id across ingests, and wire_entry drops such text again from older spool records; the read gate also refuses an extracurricular read from a slice or the course root (M-GATE-EXTRACURRICULAR-READ)."
  - id: STD-TRANSCRIPT-STREAM
    text: "Since 0.32.0 (wire revision 2026-10-04i, W-TRN-7) the record of STD-TRANSCRIPT is whole and is sent in the background, inside the same bounds. Reach::Transcript.stream runs every transcripts.send_interval_s of the cached course status (set in Teach's course policy; 600 s when absent, never under 60 s, at most once per interval across every rEach process): Reach's MCP server checks once a minute while a session is open (Reach::Transcript.start_stream_thread spawns a detached reach transcript stream) and the operating system job of STD-TEACH-SUBSCRIBE runs it too, at the shorter of its own interval and the course's. One run reads each session recorded in the last 48 hours whose latest hook found it inside the bounds and that still meets them, from where rEach last stopped in the harness transcript and in its Claude Code subagent transcripts, scans the slice's owned files, and sends everything queued in normal mode. No hook is needed for it and no hook waits on it (STD-HOOK-RESPONSIVE). Each hook stores the session's harness, space and slice workspace in the session state; a hook that finds the session outside the bounds switches background reading off, and the next hook inside the bounds first skips what the harness transcript gained meanwhile, so nothing said outside the bounds is read later. What each tool returned to the AI is recorded as an output entry (Claude Code tool results, Codex call outputs; Hermes payloads carry none), and a subagent's replies, reasoning, actions and outputs carry the note subagent. Nothing is cut to fit: a prompt, reply, reasoning block, action input or tool output over 120000 bytes becomes consecutive entries with part [n, of]. Entries with part, long action inputs and output entries wait in the queue until the course server's status lists them (transcripts.parts, transcripts.kinds). Code entries still stop at 131072 bytes of text with the whole file's size and digest. REACH_OFFLINE=1 stops the background sender. The student's own export shows tool output too. Students are told through PRIVACY.md, the README and the student guide."
  - id: STD-BRAIN
    text: "Since 0.16.15 Reach keeps a local microbrain, and every byte of it stays on the student's computer: sources and findings are brain-spool lines (tier private) and Reach's own state is under ~/.reach/brain (0700, files 0600); nothing is sent to Teach. Every gate-allowed prompt the student types, in any folder (a slice, the root, extracurricular or outside every course folder), becomes a private source as it arrives (Reach::Brain.capture_prompt, called from the prompt hook, brain.capture_min_chars default 1), kept only on the computer and never sent; a prompt the gate blocked (login, enrollment, passwords) never enters it, and a prompt matching the secret pattern or containing the student's own ID is skipped. The AI's replies are not ingested. The one other source is an export of another AI system the student imports on purpose (STD-EXPORT-IMPORT, since 0.18.0). Events carry ids, counts, bytes and outcomes, never claim, evidence or prompt text. The host agent distils durable findings with reach remember (or reach_remember); a novelty gate (cosine at least 0.85 within the category only reinforces), a per-hour and per-day write budget, a secret and student-ID refusal and a nudge that backs off from every 3 turns up to 24 stop floods. Recall is budgeted and lexical in hooks (an explicit recall is fused when rplugin and the encoder are present): at most 1500 bytes of profile at session start and 800 bytes of matching memories per prompt, repeating none from the last 10 injections. The spool is capped (brain.max_spool_bytes, 20 MiB): over the cap, the oldest sources no finding references are pruned to 80% and, when none remain, new captures pause (spool_full) while findings are still kept. Memory never changes the course rules, the owned files, submission or grading. reach memory forget (or reach_memory_forget) tombstones findings and scrubs them from Reach's spool, the one exception to its append-only rule; forget --all also scrubs every source except course material (STD-COURSE-CORPUS), and since 0.18.0 cancels any import, erases every imported verbatim copy from the corpus and deletes the imports folder and import spool (STD-EXPORT-IMPORT). reach remember and reach memory refuse while locked (STD-ENROLL-LOCKDOWN lists neither). The memory notice (G-MEMORY-NOTICE) tells the student it stays on this computer. While an instructor persona is active its microbrain lives only in the persona home and is never admitted into the computer's own ~/.corpora/reach."
  - id: STD-BRAIN-PLANES
    text: "Since 0.38.0 the microbrain is admitted into Reach's own corpus planes on every computer that can run them, not only where rplugin is installed. A pinned SDK kit (rplugin and rBrain runtime files, about 120 KB, MIT; only the runtime files and the microdatabase corpus template, built by tools/sdk_kit.rb behind a privacy gate; release asset sdk-<rplugin>-<rbrain>-r<n> on Reach's public GitHub repository with --latest=false; its manifest sha256 compiled into Reach) installs itself in the background into the Reach home's sdk folder once the runtime kit's Ruby is present (reach sdk install, reach sdk status; REACH_SDK_DISABLE=1 or REACH_OFFLINE=1 stop downloads). Every plane operation runs in a child process under the runtime kit's Ruby with a clean Ruby environment (STD-KIT-CLEAN-ENV): admission of the brain spool and the daily rBrain consolidation in a detached child (never in a hook), the corpus at the Reach home's corpora/reach (registry file only, no fleet services), explicit recall (reach_recall) through rBrain Context in a child capped at 10 s, the query passed in a 0600 file and never on a command line, and forget through rBrain Erase in a child capped at 30 s. A forget that cannot reach the planes is queued in the brain folder (pending-erase.jsonl, 0600) and runs before the next admission, so a forgotten record is never admitted first. Hooks keep the spool and the lexical BrainIndex exactly as before. Spool mode remains the complete fallback: with no runtime kit, no SDK kit, a build without an SDK pin, an instructor persona, brain.planes false or REACH_BRAIN_PLANES_DISABLE=1, nothing runs and nothing changes. No embedding model is shipped, so plane recall is lexical and graph only. reach doctor names the route (R-DOC-BRAIN-PLANES). Where rplugin is already loaded in Reach's own process, the same child runs under that Ruby and the corpus stays where rplugin resolves it."
  - id: STD-WORKSPACE-LAYOUT
    text: "Assignment code is written only in slice workspaces under ~/reach-work/deliverables/<course>/<assignment>/<cutout>-<slice>/, and anything else the student wants to build only in ~/reach-work/extracurricular/, which is never graded or submitted. The workspace root refuses writes (M-WRITE-ROOT; a slice file is still written from a chat at the root by giving its full path, and a shell command runs in a slice when the tool call's workdir names it, which the shell and patch gates judge as that slice's space and refuse as M-GATE-OUTSIDE when it names a place outside every course space), extracurricular refuses writes outside itself (M-WRITE-OUTSIDE-EXTRA), and the agent is told to put code in files, never in chat (R-CODEFILE). A sync moves an older slice workspace under deliverables/ when the path is free and never deletes one. While an instructor persona is active (STD-INSTRUCTOR-PERSONA) the same layout sits under ~/reach-work/personas/<persona id>/ instead."
  - id: STD-VAULT-PRIVATE
    text: "Decrypted guardrails, the suite and the reference build live only under ~/.reach/vault (0700) and are never read by generic file-listing code paths outside Reach::Guardrails, Reach::Directives, Reach::Seal and Reach::Suite. The one exception is course material, which the microbrain keeps in its private tier (STD-COURSE-CORPUS)."
  - id: STD-COURSE-CORPUS
    text: "Since 0.17.1 Reach ingests the course's whole reference corpus into the student's microbrain. Teach delivers it at enrollment in the guardrails package, every release unit at once and only for the student's own course; the rEach repository and plugin folder never hold course material. After each sync and at session start, Reach::CourseCorpus decrypts the delivered blobs when their fingerprint (blob digests and key ids) changed and spools every file as a private-tier source under course/<course>/<path> (category course; parts of at most 1,000,000 bytes). Changed or removed files are tombstoned. The detached sync admits them into ~/.corpora/reach, and session start never forces an admission. reach reference ingest [--force] runs it on demand. Plaintext course text exists only in the private brain spool (0600) and the corpus's private tier, never in the rEach folder, a workspace, a log or anything sent to Teach, and logs carry counts only. Course sources are never pruned, never count toward brain.max_spool_bytes and survive forget --all. Each prompt of at least 12 characters gets up to brain.course_k (3) matching passages of at most 600 bytes within brain.course_budget_bytes (600) under M-BRAIN-COURSE, when brain.course_recall is on (default)."
  - id: STD-DIRECTIVE-TABLE
    text: "Every course workspace's AGENTS.md ends with a directive table in the fleet's opcode form (alias, opcode, rule of at most 88 characters, reach directive <OPCODE>, enforcement, condition). Public engineering rows come from directives/ in this repo; course rows come only from the guardrails package, and a course row's body is served by Teach for one signed reach directive request (W-API-DIRECTIVE), never stored on the install; offline, the agent has the one-line rule. reach doctor reports R-DOC-DIRECTIVES when a public row does not parse or fit. Frontmatter reads the same under libyaml 0.1.x (macOS system Ruby 2.6.10) as under 0.2.x: when the old parser rejects an unquoted colon inside a flow list, the list items are quoted and the block is read again."
  - id: STD-DIRECTIVES-CARRY-NO-SECRETS
    text: "A directive body, public or private, says what the agent does and never why or how it is enforced. Grading, weights, rubrics, thresholds, keys and the seal live in Teach and never enter a body, so any body could be disclosed without harm; keeping it private is a behaviour the OPAQUE directive asks of the agent, not a security boundary Reach claims."
  - id: STD-SEAL-INVISIBLE
    text: "Every owned file carries an invisible per-install mark, every session leaves an HMAC-chained witness ledger, and a sidecar ties installs together. A foreign, corrupt or missing mark, a ledger break, a vault mismatch or a sweep of the private directives (directive_dump) is reported to Teach silently, healed where healing is safe, and never shown to or discussed with the student; a foreign mark is never overwritten. An instructor persona keeps its own sidecar inside its persona home, so a test student's install is never tied to the instructor's or a real student's install."
  - id: STD-QUALIFY-BEFORE-SUBMIT
    text: "reach submit refuses unless the latest reach qualify passed on exactly the current owned files and the agent's scenarios (M-SUBMIT-UNQUALIFIED). The agent writes those scenarios under qualify/. For a panel using the delivered GROKIT_REPLAY kit, local coverage and the starting-stub check require every scenario name in the supplied practice feature; the practice contract must not be absent or empty. Other slices require every graded name. reach qualify --list distinguishes the required assistant-authored names from Teach's graded names. The agent's scenarios run here on Grokit's answer-free kit when the slice allows it and always on Teach, which independently runs every hidden graded scenario and answers with names, results, the agent's own step text and a whitelisted error class only, plus for a failed hidden scenario a failure kind (raised or differed, instructor decision 2026-10-13). No reference code, graded step or value leaves Teach. A failed run with the same owned files and test files as the student's last counted failed qualification of the slice comes back counted false and is not counted on the attempt ladder (M-QUALIFY-IDENTICAL). Since 0.51.10 (instructor decision 2026-10-13) a run that fails in the local checks, before it reaches Teach, on owned files and scenarios identical to the last counted failed attempt of the slice, local or live, is not counted either (M-QUALIFY-IDENTICAL-LOCAL); without stored digests it counts. Since 0.47.3 (security audit F02) every collector that sends owned or test files (hand bundles, qualifications, submissions) reads them through Reach::SafeFiles, which refuses traversal, absolute paths, symlinked leaves and ancestors, non-regular files and a file swapped between check and read; a hand bundle leaves such a file out and lists it in skipped with the reason, a qualification stops before its first step with QF-UNREADABLE (not counted on the attempt ladder), and a submission refuses (M-SUBMIT-UNSAFE). On Windows the check that the file was not swapped compares the file id and ignores the device number, because Ruby fills it from the drive letter for a path and leaves it 0 for an open handle; when either file id is 0 it compares size and modification time."
  - id: STD-SUBMIT-APPROVAL
    text: "Since 0.17.0 (wire revision 2026-10-02c, W-SUB-2) the agent tells the student, once a slice's work passes reach qualify, that they can ask rEach to submit it. reach submit and reach_submit run every precondition first, then ask through Reach (M-SUBMIT-ASK, relayed word for word) and submit only on the student's yes: captured by the prompt hook (STD-CONSENT-FROM-REACH), valid for 30 minutes and for exactly the owned files it was asked about, and used once when the agent runs reach submit again; or typed at reach submit's own prompt when it runs in a terminal. Antigravity, which has no prompt hook, submits on the agent's relayed yes. After the due time a slice that already holds an ingest receipt is refused before anything is asked (M-SUBMIT-CLOSED), and since 0.53.3 so is a slice that holds a grade or validation receipt without one, such as a submission an instructor accepted by hand (before, rEach offered it once more as late and Teach refused it with deadline_passed); before it, every submission tells the student they can submit again until the due time and that the last one counts (W-SUB-1)."
  - id: STD-SUBMIT-ARCHIVE
    text: "Since 0.17.0, once an ingest receipt verifies (from reach submit or a later outbox retry), Reach saves a ZIP of the student's whole assignment folder, every slice workspace under deliverables/<course>/<assignment>/ without top-level dot entries, AGENTS.md, CLAUDE.md, GEMINI.md and symbolic links, plus the student's receipts for that assignment and their own part, to the Downloads folder (XDG_DOWNLOAD_DIR on Linux when set, otherwise Downloads in the home folder, created when missing) as <assignment>-<email local part>-<YYYYMMDD>.zip (since 0.38.10, e.g. A1-jruiz-20261007.zip; before, <course>-<assignment>-<YYYY-MM-DD>-<HHMM>-<zone>.zip), dated in course time (STD-COURSE-TIME). It never overwrites a file, adding -2, -3 and so on instead, writes through a temporary file and rename, skips the copy above config.yml submit.archive_max_mb (default 256), and a failed copy never fails or undoes the submission. The ZIP is written by Reach's own standard-library writer and never leaves the computer. Since 0.19.0 the submit ask says the ZIP will be saved to Downloads and that the student must also upload it to the course's learning system (config.yml submit.lms_name, default Blackboard) to receive credit, and every answer after an ingest (archived, skipped or failed) repeats that the upload to Blackboard is required for credit. reach submit archive [--assignment A] (and the reach_submit tool with archive true) writes the ZIP again on request, for example after a failed copy. Since 0.35.18 the ZIP leaves out every file a workspace's .reach/delivered.json lists as read-only (the qualify kit, contract, api, shape brief and the like) and keeps owned files and anything the student or the agent created that the delivered record lists nowhere; a workspace with no delivered.json is archived whole. On Windows the Downloads folder is the Downloads known folder (HKCU User Shell Folders, {374DE290-123F-4565-9164-39C4925E467B}, variables expanded), used only when it names an existing absolute folder, otherwise Downloads in the profile; REACH_DOWNLOADS_DIR still comes first and no folder is created outside the profile. Since 0.53.21 reach submit archive works before a submission too, for any assignment with a slice workspace on this computer: the ZIP is the same, the answer (M-SUBMIT-EXPORTED, M-SUBMIT-EXPORT-SKIPPED, M-SUBMIT-EXPORT-FAILED) says the work has not been submitted through rEach and asks the student to upload it to the learning system or send it to their instructor, and nothing is sent to Teach. It works at any point, past the enrollment lock in every lock state (the CLI exempts submit archive, the MCP bridge exempts reach_submit with archive true); a timed test lock still refuses the tool. reach qualify recommends it, naming the command, when the qualification could not be done: every finding is QF-NOBROWSER, a local step that produced no results, a local scenario whose step opening the panel got a browser status, timeout or connection error (Ferrum, or net::ERR_), or a course-server run that answered failed_to_run (record export, M-QUALIFY-EXPORT); a failed scenario, a hidden-scenario failure, a pending course server and the attempt limit never recommend it. Since 0.53.22 reach submit archive also takes --course C (one course, every assignment), --extracurricular (the student's own code folder) or --all (every course's deliverables plus extracurricular), with the same own-work rule and never rEach's home; --all is capped by config.yml submit.archive_all_max_mb (default 2048) and the rest by submit.archive_max_mb."
  - id: STD-SUBMIT-PARTIAL
    text: "Since 0.53.22 (wire revision 2026-10-18a, W-SUB-7) a student can submit unfinished work that has not passed reach qualify: reach submit --partial (reach_submit with partial true) asks through Reach (M-SUBMIT-PARTIAL-ASK, consent kind submission_partial) and sends only on the student's yes, at any time, with partial true in the body and the manifest. Only the safety checks apply: unsafe or missing owned files, a changed read-only course file, the submission-hold control and the closed rule; qualification, the reach check findings gate, the README rule, the shape check and the own-part requirement are skipped. Teach holds a partial submission for the instructor (state partial, never auto-graded; Regrade grades it, Validate signs it) and answers with an ingest receipt carrying partial true. A partial never closes a slice: after the due time Reach and Teach still accept a submission when only partial ones are on record. Reach offers partial only when Teach's status accepts names it (submission_kinds) and otherwise refuses with M-SUBMIT-PARTIAL-UNSUPPORTED, pointing to reach submit archive. reach qualify's M-QUALIFY-EXPORT offers both the partial submission and the ZIP."
  - id: STD-SUBMIT-REFUSALS
    text: "Since 0.52.13 a queued submission is removed from the outbox only when Teach delivered it: ingested, or a repeat of an ingested submission that has since been graded, validated or orphaned (the receipt in the answer is stored). A rejected answer or an answer Reach does not know shelves the entry in outbox/rejected, like a 4xx refusal, and the student hears of it once (M-SUBMIT-REJECTED-LATER) from reach sync, reach status or the reach_sync and reach_status tools, which return the notice in text with relay_verbatim true. A not_qualified refusal of a slice rEach records as Qualified for exactly the current files never sends the student back to reach qualify: M-SUBMIT-DISAGREE says rEach and the course server disagree about that check, that nothing is wrong with what the student did, and offers a technical_issue hand naming the qualification id."
  - id: STD-STORAGE-GATES
    text: "Since 0.18.0 Reach watches the bytes on the student's computer of its corpus (the rcorpus root of Reach's own corpus, when rplugin is present, and since 0.38.0 the planes corpus in the Reach home, STD-BRAIN-PLANES) and its microbrain (the Reach home's brain folder, the brain spool, the import spool and the import folders) together. Measuring runs in a detached process at most once per storage.check_interval_s (3600) and after an import or a compaction, never inside a hook. At storage.warn_mb (512, 1024, 2048) the student is told once per threshold crossed (M-STORAGE-WARN) and offered a compaction of the corpus; at storage.demand_mb (4096) every session start and the first prompt of each session say compaction is required and suggest a true backup to another drive (M-STORAGE-DEMAND), and a new import is refused. Compaction (reach storage compact, asked through Reach like a submission, STD-SUBMIT-APPROVAL) runs detached: rcorpus compaction of Reach's corpus, with compress true when the loaded rcorpus supports it (rcorpus 0.11.0, gzip snapshots and backups), plus gzip of admitted import-spool files. It never compacts, prunes or rewrites the microbrain (brain folder, brain spool, findings, catalogs). Without rplugin there is no corpus to compact and Reach says so (M-STORAGE-NO-CORPUS)."
  - id: STD-EXPORT-IMPORT
    text: "Since 0.18.0 a student can bring in a downloaded export of another AI system (ChatGPT, Claude or Gemini Takeout JSON), a folder or the vendor's ZIP, by dropping it into the harness, typing its path or choosing it in the operating system's own picker (reach import pick: osascript, PowerShell, zenity or kdialog; unavailable otherwise). reach import export asks the student through Reach (STD-CONSENT-FROM-REACH) for one of two modes: brain (a per-conversation catalog of titles, dates, keywords and a short excerpt, plus findings; M-IMPORT-ASK-BRAIN says deleting the export loses its full text) or copy (the same plus every conversation verbatim as private sources in the import spool, admitted into the corpus). Parsing is deterministic, streams the vendor JSON without loading it whole, and runs in a detached, resumable job (reach import status); no model call parses anything. Findings come from the agent working a ranked queue (reach import next and done) through reach remember within the brain's write budget, which can take many sessions. Imported text never enters the prompt-time brain index, never counts toward brain.max_spool_bytes, never reaches Teach, and is searched on request (reach import search, show). Copy mode is refused when it would take storage past storage.demand_mb. Since 0.47.3 (security audit F07, F10) the consent subject carries a streaming SHA-256 of the selected files' content, the worker processes only a private snapshot whose digest equals the approved one (source_changed otherwise) and records per-file digests that every later read of the original export checks, and parsing is bounded while it reads: JSON elements at most 64 MiB and depth 64, ZIP entries checked as they inflate (declared size, 2 GiB per entry, 4 GiB total, 100000 entries), tar members checked by header before reading, Teach responses at most 64 MiB, with wall-clock deadlines on extraction, digesting and import runs."
  - id: STD-PACKET-IMPORT
    text: "Since 0.51.0 a student who worked in the rEach Sidecar (the signed offline folder the instructor hands out so work can start before rEach is installed) brings that work into rEach once, with reach packet import <folder> or the reach_packet tool (the shell gate refuses a reach command that names a folder outside the course spaces, so the agent uses the tool for a folder in Downloads). Reach::Packet verifies the folder first: every file listed in MANIFEST.sha256 except student.yml and the student's own deliverables, checkpoints and run folders must match its digest, no unlisted file may be present, and MANIFEST.sig must verify with ssh-keygen -Y verify (identity teach, namespace reach-sidecar) against the signer lines rEach ships in config.yml sidecar.allowed_signers or a file passed with --allowed-signers; the packet's own allowed_signers file is never trusted. It refuses with a plain sentence when the folder is not a sidecar, was changed, carries no configured signer, when ssh-keygen is absent, when the sidecar's student email (or its name part) is not the install's username, or when the sidecar's course is not the enrolled course (ids compared through Reach::Identity.normalize_course_id). A packet older than its warn_after_days is a warning, never a refusal. For each started slice whose workspace exists here with the same assignment (otherwise the slice is named and left out): changed owned files are checkpointed first (automatic, before sidecar import), every sidecar checkpoint is replayed in order as a rEach checkpoint named sidecar N: <note>, the current owned files, qualify/features, qualify/step_definitions and plan.md are copied (a file the workspace does not own is named and left out), Reach::Seal.stamp restores the marks silently (STD-SEAL-INVISIBLE), an automatic checkpoint sidecar import is saved when anything differs, and the ledger records sidecar_import. The latest sidecar answer to each question of the assignment is recorded through Reach::Part.import! in the student's words with session_id and seq null (Teach marks such an answer unverifiable, W-PART-3) when it meets min_words and no newer answer is on record. The offline receipt is read from the latest bundle ZIP named in the sidecar's bundles.json (or --bundle PATH) and kept at <workspace>/.reach/sidecar-receipt.json; reach submit then carries it as evidence/sidecar-receipt.json. <workspace>/.reach/sidecar-import.json records what was imported. The import ends with reach check and, unless --no-qualify, the full reach qualify (the attempt ladder applies); the transcript folder is not imported, since the uploaded bundle carries it. Nothing is sent by the import and reach submit remains the student's step."
  - id: STD-TRANSCRIPT-DEIDENTIFY
    text: "Since 0.26.0 (wire revision 2026-10-04a, W-TRN-6) a transcript leaves the student's computer de-identified. Reach::Deidentify keeps one random pseudonym per install (state/pseudonym.json, 0600), replaces the identifiers rEach knows in every entry's text, summary and note with placeholders at send time (display name and each word of it, enrollment username and its part before the at sign, student id, computer account, home folder, computer name; without regard to case, at word boundaries, each at least 3 characters), recomputes bytes and digest for the text as sent, adds source_digest to a prompt, and seals the identity index (student id, install id, placeholder values) to the re-identification public key the course status hands out. The spool in ~/.reach/transcripts and the student's own export stay as typed, except for redacted credentials (below). With no key in the course status rEach sends nothing and keeps its queue (stopped: identity_key). Whoever holds the private key can re-identify; rEach never holds it. Since 0.26.1 (wire revision 2026-10-04b) re-identification loses nothing: each entry carries restore, the exact strings its placeholders stand for and any text that no longer fit, encrypted under a per-install key that travels inside the sealed identity index, so the key holder gets back the text exactly as recorded, including its spelling and capitals and a string that only looked like a placeholder. Limits stated to students in PRIVACY.md: the course server holds the key and can reveal, it authenticates each upload, and a name rEach does not know stays in the text. Since 0.47.3 (security audit F03) Reach::Redact irreversibly replaces credential-shaped text (authorization headers, password, secret, token, API and access key values, private key blocks, JWTs, well-known token prefixes, URLs with user info and database connection strings) with [redacted:<class>] in every captured field before the spool is written, again before de-identification and at egress, so neither the spool, the export, the restore record nor the upload holds it; digests are over the redacted text and the entry note records the classes and counts. Sensitive personal narrative is not detected; PRIVACY.md says so. The computer account is the account name of the process uid (Etc.getpwuid) and only then getlogin, USER or USERNAME: on macOS getlogin answers root in a process an app launched, so the student's account name stayed in transcripts sent from the Codex app or Claude desktop while the word root was replaced."
  - id: STD-TRANSCRIPT-EXPORT
    text: "Restored in 0.25.0 (first added in 0.19.0, removed in 0.21.1). reach transcripts export and the reach_transcripts tool save the student's own recorded conversations as a ZIP in Downloads, grouped by assignment and slice, and the ZIP stays on the computer. With transcripts.auto_export on (the default before 0.47.3) the first session after the course ends exports once in the background and the next prompt says where the ZIP is. The export works while the course-ended lock is on. Since 0.35.18 the Downloads folder is resolved as STD-SUBMIT-ARCHIVE resolves it. Since 0.47.3 (security audit F06) automatic export is opt-in (transcripts.auto_export false by default), Reach records the path of every export it writes, and reach transcripts forget (CLI after a yes typed in a terminal; reach_transcripts action forget after a transcripts_forget consent asked through Reach) deletes the spool, state, rejected files, archives and recorded exports after waiting out an upload, and writes a receipt to state/transcripts-forget/ that says server copies are kept by the course and erased by the instructor on request (Teach STD-TRANSCRIPT-RETENTION). Housekeeping deletes acknowledged spool and archives transcripts.archive_retention_days_after_course (180) days and unacknowledged or rejected files transcripts.unacked_retention_days_after_course (30) days after the course stamp expires, and nothing before."
  - id: STD-LATE-WORK
    text: "Since 0.19.0 (wire 2026-10-02e, W-PACE-2) a slice whose due time has passed stays writable as late work while late_work.allow is true (default); assignments not yet current stay refused. Reach says plainly that the work is late at session start, on the first prompt of each session in that slice and every late_work.notice_every (10) prompts after, in reach status and in the submit ask, and says when the slice can no longer be submitted (Teach accepts one late submission of a never-submitted slice and none after a submission on record). Reach raises one hand with trigger late_work per assignment on the first late write and one with trigger late_submission per assignment when a late ingest receipt verifies, from a detached process. Since 0.53.5 the text agrees: the prompt anchor M-ANCHOR keeps the conversation on the current step, on an overdue earlier assignment the student is finishing as late work, or on the work the instructor asked for, and wire W-PACE-1 (revision 2026-10-16b) no longer says a past-due slice is refused. Since 0.60.0 (wire revision 2026-10-22a) an assignment whose late_assignments entry carries rolling_until is open work, not late work, until that time by Teach's clock: Reach::LateWork.late? and info[\"late\"] are false inside the window, so there is no late notice, no late_work or late_submission hand and no marked-late wording, and the status line and the greeting name the cutoff instead; an entry without rolling_until, and any time after rolling_until, behave as before."
  - id: STD-LATE-ASSIGNMENTS
    text: "Since 0.53.24 (wire revision 2026-10-18c, W-API-STATUS late_assignments, W-API-PACKAGE assignment, W-PACE-3) a student who still owes an assignment whose due time has passed gets its work areas beside the current assignment's. The status lists each such assignment with its due time, slices and the newest workspace and shape package for it. On every sync Reach::Sync fetches those two packages with Reach::Packages#fetch(kind, assignment: id), which sends the assignment as a signed query parameter and refuses, storing nothing, an envelope whose header assignment is not the one asked for, and Reach::Workspace.provision_from_package(assignment: id) provisions the work areas under that assignment's own folder. Reach::Packages#latest_version(kind, assignment:) picks the newest stored package by its header assignment, never by the highest version, so the current assignment's work areas are provisioned from its own package even when a late assignment's package is the newer one; with no assignment it still returns the highest version. The shape vault is rebuilt from the shape packages of the current and the late assignments together, and its .version marker lists their versions, comma separated. reach status adds one line, Also open as late work, per late assignment, and the greeting's course line adds late work open with the assignment and its due time. Work in a late assignment is late work (STD-LATE-WORK). A work area of an assignment that has left the list is never removed. A Teach that sends no late_assignments, or an offline sync, changes nothing from before. Since 0.60.0 (wire revision 2026-10-22a) an entry may carry rolling_until: reach status then prints Also open: ID, can be submitted until TIME without being late, and the greeting's course line adds  · ID open, not late, until TIME, in place of the late-work wording of that entry."
  - id: STD-GRADE-VIEW
    text: "Since 0.19.0 (wire 2026-10-02e, W-API-GRADES) the student may ask for their current grade at any time: reach grade (and the reach_grade tool) asks Teach and shows the points recorded for each assignment and the total, or says plainly that grades are not available yet when Teach answers available false, 404 (an older Teach) or grades_disabled. Reach never derives points from autograder results and keeps no copy of grades beyond the last answer."
  - id: STD-HOME-IN-WORKSPACE
    text: "Since 0.31.0 rEach keeps its own files in .reach-home inside the student's reach-work folder (<workspace_base>/.reach-home), not in ~/.reach, so a harness whose sandbox may write only inside the chat's folder can reach them. Reach::Paths.root resolves in order: $REACH_HOME; a completed relocation record in the new home; the legacy ~/.reach when it holds install.yml or plugin/ (a relocation is due); otherwise the new home. An existing install is relocated automatically (at session start, after reach setup, or by reach relocate): the legacy home is copied, hash-verified and switched in by rename, enrollment is compared before and after without side effects, harness configs and the Claude and Codex plugin sources are repointed, and the legacy home is left exactly as it was apart from RELOCATED.json. Every kind of space refuses reads, writes, listings, searches, redirects and cds that reach the home; every walk of the student's work prunes it; a root-kind session judges writes and commands by their target slice and asks which slice (M-PICK-SLICE) when it cannot choose; writes wait while a relocation runs (M-RELOCATING); reach doctor reports R-DOC-RELOCATION. Not fixed: the Codex sandbox still blocks the network, so enroll, sync, updates and the subscription check need Full access or an allow rule; Codex hook trust is unrelated; on Windows the project's top-level .codex is read-only in the sandbox."
  - id: STD-USER-HOME
    text: "Since 0.34.3 rEach anchors every folder it uses on the signed-in user's own home. On Windows that is the profile folder Windows reports (the Profile known folder, then HKCU Volatile Environment USERPROFILE, then %USERPROFILE%), never $HOME, which a harness or shell may point at a folder that does not exist (it created C:\\Users\\anon); macOS and Linux keep ~. A harness's config folder follows that harness's own home rule. rEach never creates the folder its paths hang from: when it is missing, the launcher, the installers and Reach::Paths create nothing and answer M-HOME-MISSING. An install that already landed under a stray home is moved to the real one by the STD-HOME-IN-WORKSPACE relocation, its reach-work entries copied beside it, skipping any name already present, and nothing under the stray folder is changed apart from RELOCATED.json."
  - id: STD-HAND-TYPES
    text: "Since 0.19.0 (wire 2026-10-02e, W-HAND-TYPES) every hand carries a type (trigger): Reach's own attempt_ladder, check_gate, wellbeing, late_work and late_submission, or, for a hand the student asks for, the type the agent chooses among student_request, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, integrity_question and other (feedback too until 0.52.0, since when it goes through STD-FEEDBACK and a hand of type feedback is refused with M-HAND-TYPE-FEEDBACK). A Teach that predates the revision receives student_request with the type in the summary."
  - id: STD-WELLBEING-DELIVERED
    text: "Since 0.19.2 a wellbeing hand (W-SUP-2) always carries a string space: the current space's kind (slice, extracurricular or root), or outside when reach support runs from a directory outside every rEach folder; before, outside sent null and Teach refused it with 400 while the student was told it was queued. A wellbeing hand Teach refuses is never reported as told or queued: its outbox entry is removed, a fault event (support:wellbeing or support:flush) goes to Teach (W-DBG-FAULT), the student still gets the full crisis message, and the hour-long repeat guard is not armed. tools/smoke/assignment_one.rb runs Teach with hand-raises on and raises a CLI hand, an MCP reach_raise_hand hand and a wellbeing hand from outside every folder, and checks all three on Teach."
  - id: STD-ATTEMPT-LADDER
    text: "Reach counts failed qualifications per slice: a notice from the second, an agent hand (reach.hand/v2, originator agent) at the third with further work held until the student says yes, and a hard stop at the tenth until an instructor replies. A pass or a reply resets it."
  - id: STD-FLOWS
    text: "The agent writes code only through the reach-feature or reach-bug flow (directive FLOW). The student deals in business behaviour only: student-facing text never names code, tests, scenarios, files or commands."
  - id: STD-CHECK-BEFORE-SUBMIT
    text: "reach check is the one checker: the hooks run it after every write (on Hermes, whose hooks cannot answer a write, at the end of each turn that wrote code), reach qualify runs it first, and reach submit runs it first; only findings in the slice's own files count in qualify and submit. Findings are returned once with M-SUBMIT-FIX-FIRST; a second attempt on the same findings is refused with M-SUBMIT-BLOCKED-CHECK and raises a check_gate hand. Since 0.59.1 CK-PATTERN findings follow the pattern ledger's mode at submit as they do in qualify: they are shown, and only a block match under qualify.ledger.mode enforce counts toward the gate; a warn or info match, or any match under advise, never refuses a submission."
  - id: STD-NO-GIT-IN-WORKSPACE
    text: "Checkpoints are Reach's own snapshots under the Reach home's checkpoints folder, taken and restored by reach checkpoint (and since 0.53.26 on every write, STD-CHECKPOINT-AUTOSAVE); no git repository is created in or required by a course workspace, and since 0.11.0 the gate refuses git in slice and root spaces (M-GATE-NOGIT); the extracurricular folder is the student's own. Git support is planned for Reach 2.0 (ROADMAP.md)."
  - id: STD-CHECKPOINT-AUTOSAVE
    text: "Since 0.53.26 student work in reach-work is kept in three places on the computer without the student doing anything. (1) History on every write: Reach::Checkpoint saves a hidden automatic entry after every harness write of an owned file (through reach transcript code, which the PostToolUse hooks of Claude Code, Codex and Hermes already run), before every write the slice gate allows (reach gate write, so a change made in another editor is kept before the agent overwrites it), after every reach check (which covers Antigravity), before a sync writes package entries into an existing workspace and after a restore. Entries are content-addressed (<store>/blobs/<sha256>, one copy per distinct file content, meta.json per entry) and both stores are filed under a salted hash of the enrolled student id (since 0.53.29, salted since 0.53.30; folders mode 0700), so a later student on the same computer account never sees or recovers an earlier student's saves; a store an earlier release left under the unkeyed path or under local is adopted only when an entry matches the student's own store or the workspace ledger proves it is theirs, so an unchanged file costs nothing; entries saved before 0.53.26 (NNN/files/) still restore. An automatic save appends no ledger event, never raises into a hook and never waits on the network; the hook command lines in course folders are unchanged, so Codex hook trust is unaffected (STD-CODEX-HOOK-TRUST). reach checkpoint list shows the named saves and says how many automatic ones --all shows (M-CHECKPOINT-LIST-HIDDEN); numbers are one counter and restore takes any of them; a restore saves the state it replaces as a visible entry first; a named save succeeds even when a hidden automatic save already holds the same state; the autosave on write does not depend on the transcript being recorded. (2) A second copy outside the tree: every entry is mirrored to <data dir>/reach/checkpoints (~/Library/Application Support on macOS, %LOCALAPPDATA% on Windows, $XDG_DATA_HOME or ~/.local/share elsewhere; REACH_CHECKPOINT_MIRROR overrides; none for an instructor persona), reads fall back to it, and a mirror that cannot be written is reported by reach doctor (R-DOC-COPIES) and never stops a save. (3) Detection and recovery: at session start Reach tells the student once per condition when an owned file is missing or empty while a save since the last deliberate one (a named save, a before-restore save or a restore) holds it (M-WORK-MISSING; an automatic save that records the loss never silences it) or when a work folder is gone while its saves remain (M-WORK-FOLDER-MISSING); reach status and reach doctor say so every time; reach checkpoint recover [--slice S] (reach_checkpoint action recover) provisions a missing folder from the stored package and restores the newest save that still holds the missing files, saving what is there first; reach checkpoint dismiss --slice S stops the report for a folder the student removed on purpose while its saves stay; reach checkpoint forget [--slice S] (the tool's forget action) deletes the saved copies in both places only after the student's yes, in a terminal or through consent, writes a receipt (home-relative paths) and never touches the work files; through the tool, recover and dismiss also ask the student first and act once after the yes. A reach-work folder inside a cloud-synced folder (iCloud, OneDrive, Dropbox, Google Drive, CloudStorage) is told once to keep its files on the device (M-CLOUD-FOLDER, R-DOC-CLOUD) and nothing is moved; <reach-work>/README.md is written once (M-REACH-WORK-README) and says what the hidden folder holds. config.yml checkpoints.autosave and checkpoints.mirror (both true) and REACH_AUTOSAVE=0 are the switches. Every copy stays on the computer and PRIVACY.md lists them; what leaves the computer is unchanged. Not yet: scheduled archive ZIPs and copies on the course server, planned as later stages."
  - id: STD-COURSE-TIME
    text: "Every time shown to a student (due dates, receipt times) is in the course's timezone with its abbreviation, e.g. 'Oct 3, 2026 11:59 PM PDT' (since 0.38.10; a date alone reads 'Oct 3, 2026'), whatever zone the student's computer is in. The zone comes from Teach's enrollment (course.timezone) and defaults to America/Los_Angeles, the zone BUS 101 and BUS 201 run on. America/Los_Angeles is computed from built-in US daylight-time rules, so it is right on every platform, Windows included."
  - id: STD-SMOKE
    text: "tools/smoke is the release smoke test: real Claude sessions in a Docker sandbox with no access to the developer's home or Claude configuration, driven by scripted or model-played students, checked by hard assertions and advised by a model judge. Run it before tagging any release that changes the persona, greetings, hooks, install path or anything else a student sees."
  - id: STD-COURSE-SMOKE
    text: "tools/smoke/course_matrix.rb inventories all ten Grokit modules, every A1–A4 cutout slot, backend and panel slices, and both confirmed course selection profiles: 280 cases at the v0.10.1 pin. Its bundled native fixture runner exercises scratch security validation, enrollment, module choice or instructor assignment, real package delivery, fabricated answer capture, planning, native checks/checkpoint, local real/stub qualification, Teach sandbox qualification, encrypted submission, signed ingest and grade receipt retrieval, and the student's receipt reference. No model call, live student data, deployed networking, TLS, or agent-build quality is claimed by native_fixture mode. Agent adapters are separate and budget bounded. A plan, skip, pending qualification, partial submission, missing evidence, or unrun case never passes. Every selected case is reported before execution; output must sit in the repository's ignored .scratch; disk at three times the estimate and the grader images are checked before provisioning; the first case is a canary; an environment failure or three identical failures halt the run with STOP; a passing case keeps only case.json and evidence.json; and shard merging rejects source/engine mismatches, duplicate cases, and incomplete full-inventory passes. Reports distinguish execution_complete from coverage_complete. Native fixture or course-contract failures remain explicit findings; they are not bypassed to make the suite green."
  - id: STD-PLATFORM-SMOKE
    text: "tools/platform_smoke/run.rb installs Reach from the checkout into a scratch path with a space, enrolls it against tools/fake_teach and runs the hook command lines, status, the machine-id fingerprint, the runtime kit (waiting for the background self-install) and doctor. .github/workflows/platforms.yml runs it on every push to main and on dispatch, never on pull requests, on GitHub-hosted Linux (Ruby 2.6.10), macOS arm64 and Intel (the system Ruby 2.6.10), Windows x64 and Windows 11 arm64 (Ruby 4.0), and on self-hosted Windows 10 and Windows 11 VMs (labels win10, win11) when the repository variable REACH_VM_RUNNERS is on or a dispatch sets vms. Windows checkouts keep LF line endings. A doctor finding outside R-DOC-GUARD, R-DOC-HARNESS and, when no kit was installed, R-DOC-CHROME fails the run. Since 0.64.1 the smoke runs fake_teach over HTTPS (--tls: a scratch CA and a 127.0.0.1 certificate generated per run, trusted through SSL_CERT_FILE beside the platform's default bundle, with normal certificate verification) and points REACH_TEACH_URL at it, and the validate step runs the whole security validation pass (specs/security-validation.yml) through reach validate before enroll: fabricated answers, plan, both artifacts, check, qualify, submit and the re-fetched signed receipt, under the harness Reach::Validation detects (codex when it detects none). fake_teach serves the four validation routes, opens the sealed practice package, checks its answers, digests and README, signs the receipt, and from rEach 0.61.0 refuses an enrollment whose validation session, receipt, key, course, version or harness family does not match, consuming the pass once. Since 0.64.2 validate and enroll run after the runtime kit steps, because the macOS system Ruby's LibreSSL never reads SSL_CERT_FILE and so cannot trust the scratch CA; the kit Ruby that reach moves to there does. The doctor step also tolerates R-DOC-HEALTH only for the Codex-has-not-approved-the-course-checks line, since the smoke runs no Codex and has no trust store; any other health line fails it. From 0.61.0 to 0.64.0 the smoke had no pass, so enroll and the five steps behind it failed on every leg and the test health gate (G-TESTED) refused every stable promotion."
  - id: STD-STABLE-CADENCE
    text: "Since 0.43.0 stable moves at most once a day and only after the platform smoke passes on the candidate. .github/workflows/stable.yml runs at 15:00 UTC (and by workflow_dispatch): tools/stable_promote.rb plan compares origin stable with the Latest release and answers none (stable is at Latest), notice (the diff from stable to Latest touches hooks/ and no notice ref names Latest yet), wait (a notice ref names Latest with today's UTC date) or promote. A notice pushes refs/tags/notice/hooks/vX.Y.Z/YYYY-MM-DD and moves nothing, so a hook change reaches stable no sooner than the next day's run. A promote runs .github/workflows/platforms.yml (workflow_call, ref = the Latest tag) on every hosted leg, and on the Windows VM legs when vars.REACH_VM_RUNNERS is on; only when every smoke leg succeeded does tools/stable_promote.rb apply move stable through tools/release_stable.rb (Latest-only, fast-forward-only), prune the notice refs at or below the new stable version and close any open issue labeled stable-hold. A failed or cancelled smoke leaves stable where it is and opens (or comments on) one issue labeled stable-hold naming the tag and the run. Latest stays the maintainer's act. The managed updater reads the same notice refs from the tag listing it already fetches (no extra request): a notice for a version newer than the installed one is stored in the update manifest, and on Codex (the harness that re-asks hook trust per hash) Update.prompt_notices shows M-UPDATE-HOOKS-NOTICE once per version."
  - id: STD-AUTO-UPDATE
    text: "Reach keeps a managed ~/.reach/plugin install (VERSION present, no .git) current by itself: GitHub releases and tags together, the newest version from either since 0.16.14, checked at session start and hourly from detached processes, staged in the background, installed at the next session start by the release's own update/apply.rb, with every phase recorded in ~/.reach/state/update.json so an interrupted update resumes. Course work waits only while an install is running; REACH_UPDATE_DISABLE=1 turns it off. See reach.spec.yml auto_update. Since 0.35.18 every place a student install fetches rEach from GitHub (the bootstrap archive and scripts, and the Claude Code and Codex marketplace sources) follows the stable branch, which moves only when a version is published as Latest; main may carry unreleased versions and is never a student source. Since 0.35.20 tools/release_stable.rb vX.Y.Z moves origin stable to a tag only when GitHub names that tag the Latest release and the move is a fast-forward, and --dry-run reports the move without pushing. Since 0.35.21 it also creates stable when the remote has none (it fetched refs/heads/stable unconditionally and failed), and tools/tests/release_stable_test.rb and tools/tests/harness_source_test.rb cover the Latest and fast-forward refusals, the dry run, the move, the missing branch and the CODEX_CLI_PATH name check. Reach::HarnessSource repoints an existing marketplace source that is the repository with no ref, or main, to @stable (Codex) or #stable (Claude Code) once per harness, detached, at session start or the update check (reach update source), logs it to update.log and state/harness-source.json, restores the previous source on failure and never retries; a local-path source is left alone. Claude Code refuses to re-add a marketplace from a different source, so its repoint is remove, add, install. Since 0.43.0 (STD-STABLE-CADENCE) the managed install takes only the version at origin stable: the tag listing (info/refs) also yields refs/heads/stable and the peeled tag commits, the candidate versions are limited to the highest version tag whose commit is stable's commit, and no update is taken when stable is absent from the listing, matches no version tag, or the listing failed. Installs older than 0.43.0 keep taking the newest release or tag until they reach 0.43.0. Since 0.47.3 (security audit F08) an update is pinned to the commit seen at discovery: the check records target_commit, the stage downloads archive/<commit>.zip and requires its ZIP comment to equal target_commit, and the refs are read again right before update/apply.rb runs; a moved tag or a different archive stops in phase error before anything executes (reach.spec.yml auto_update.archive). scripts/reach-install pins the same way. The session-start check also runs while Reach is locked (not enrolled yet, moved, or any other lock): Reach::Hello.session_parts starts Reach::Update.on_session_start before it answers with the enrollment flow, so an install that cannot finish enrolling still receives the release that fixes it. Before, a locked install never checked, and students stuck in a failing enrollment stayed on the rEach they installed. Since 0.56.17 the update is also driven by the two paths that run without the harness's hooks: the background subscribe tick (the systemd timer, LaunchAgent or Task Scheduler job) calls Reach::Update.background_kick, which spawns the scheduled check, or the pending apply, for a managed install, for a plugin-cache install whose harness CLI is found, and the check alone for an app-only copy; and the MCP bridge calls Reach::Update.on_session_start when it starts, so a harness whose hooks never run (Codex with untrusted hooks, a copy used only through tools, a terminal) still starts the update. Update.cache_harness compares paths with Reach::Paths.path_within?, so a Windows or macOS plugin-cache copy whose realpath differs from the cache folder only by letter case is no longer taken for an app-only copy."
  - id: STD-APP-COPY-UPDATE
    text: "Since 0.52.15 a copy of rEach that lives in the Codex app or Claude desktop app plugin cache can refresh itself when the harness CLI is anywhere standard, not only on PATH: Reach::HarnessSource.codex_bin and claude_bin look on PATH, then (codex) CODEX_CLI_PATH, then /opt/homebrew/bin, /usr/local/bin, ~/.local/bin, ~/.npm-global/bin, the npm global prefix bin (NPM_CONFIG_PREFIX or the prefix in ~/.npmrc) and %APPDATA%\\npm, and run a CLI found off PATH with its folder in front of PATH so its interpreter is found. No path inside an app bundle is searched, because none is documented. A copy that is neither managed nor refreshable through a CLI it can find, and is not a git checkout, checks for updates hourly like the others and, when a newer stable version is pending, tells the agent once per chat (M-UPDATE-APP-NOTICE) to tell the student to update from the app's Plugins page or ask for rEach to be reinstalled with the installer, which creates the managed copy that updates itself. A cache refresh skipped for want of a CLI logs a cache_skipped update event (reason no_cli, harness, and the folders tried with the home folder shown as ~) to ~/.reach/logs/update.log and the debug stream. A 0.51.0 copy has none of this and takes it only when something moves it to 0.52.15 or later."
  - id: STD-CONSENT-FROM-REACH
    text: "A module move or module choice is asked by Reach, never by the agent: the agent runs reach transfer request or reach modules choose (or the matching reach_* tool) and relays the question it prints word for word, and never offers, promises or claims a notification in its own words. Reach acts on the student's captured yes or no itself, from the prompt hook, and hands the agent the outcome to relay (since 0.14.3), so the agent never makes the second call. A crisis message from the student is answered with reach support's message before anything else, the session greeting included. Since 0.35.18 a pending question is bound to the session that asked it (session_id stored when asked, from the hook event or the harness session environment), and only a yes or no typed in that session answers it; an answer from any other chat is ignored. A question asked with no known session binds to the first signed-in chat whose prompt hook relays it. A module-lock answer is captured in whichever session asked, a chat outside the course folder included. reach next, reach modules and reach_next state an open question (M-CONSENT-OPEN, its message id and subject) so the agent relays it instead of asking its own. Since 0.46.1 only an explicit yes counts: yes or y, case-insensitive, trimmed, with at most one trailing . or !; ok, sure, yeah, correct and confirm do not. The yes also binds to the question shown: when the prompt hook carries a transcript path (Claude Code, Codex), it counts only if the latest assistant message contains the pending question's text with whitespace normalized; without a transcript the strict yes and the 30-minute window apply. Since 0.47.3 (security audit F04) an answer counts only when the question is proven shown, in the harness transcript or in an assistant reply Reach spooled for the same session after the question was asked; missing evidence fails closed (specs/wire.yml W-CONSENT-1 evidence). Since 0.51.10 a question asked through the MCP server is stored with no session, because that process names no chat in Codex and keeps the chat it started in after Claude Code's /clear; a question with no session is answered by the first yes or no typed in a signed-in chat whose own transcript, or Reach's spooled replies for that chat, prove the question shown, so the answer that binds it also counts (before, that answer only bound it and each new reach_submit unbound it again). A submission answer, like a module-lock answer, is also captured in a chat outside the course folder. Since 0.51.10 (instructor decision 2026-10-13) a yes or no typed in a signed-in chat whose own transcript, or Reach's spooled replies for that chat, prove the question shown also answers a question bound to a different chat; a chat that does not show the question, a chat that is not signed in and the assistant's own text still never answer it, and each yes is used once. The transcript proof reads every assistant message since the student's previous prompt, not only the latest, so a question followed by a short closing message still counts; when no previous prompt is found in the transcript tail only the latest assistant message counts."
  - id: STD-VERSION-REPORT
    text: "Since 0.21.0 (wire revision 2026-10-03a, W-AUTH-7) every request Reach signs carries X-Reach-Version with Reach::VERSION, so Teach always knows which rEach each install runs, including after a self-update; the header carries nothing but the version."
  - id: STD-ENROLL-LOCKDOWN
    text: "Since 0.16.0 Reach is inert until it is enrolled: a plugin-level prompt hook blocks every prompt in every harness session and runs the enrollment flow (W-ENR-7) itself (the one exception, since 0.20.7, is a prompt that arrives while the launcher is still installing Ruby on a computer that had none, which passes with M-BOOTSTRAP-WAIT context instead, STD-RUBY-BOOTSTRAP; since 0.35.0 a prompt that is only a debug phrase switches debug mode and re-asks the current question without reaching the flow, STD-SETUP-LOG), asking for the class-wide course passkey (the course code of W-ENR-1), the institutional username and the student ID (W-ENR-3) so the agent never sees them; every reach command except help, version, enroll, setup, doctor, support, update, runtime, hello, gate, mcp, guide (since 0.16.13) and instructor (since 0.16.17), and every MCP tool, refuses while locked. Teach answers a shape v2 enrollment with a signed enrollment stamp (W-ENR-5) binding the install, the student, the course and a salted, hashed fingerprint of the computer, the computer account and the install key (W-ENR-4); Reach locks again when the stamp fails to verify, the course ends, or the live fingerprint stops matching (W-ENR-6). The flow's crisis check runs before any step. Institution rules come from Teach's preview and fall back to config.yml enrollment; nothing in lib/ names an institution. The one exception is a valid instructor unlock code (STD-INSTRUCTOR-UNLOCK). Since 0.35.18 the passkey step accepts text only when it is the passkey alone or holds exactly one token shaped like a passkey (course id of up to 16 letters or digits, an optional space, dash or underscore, then eight characters from Teach's secret alphabet, whole or as 4+4, with at least one digit), preferring a separated passkey over a split inside one word; any other text gets M-ENR-CODE-FORMAT, or M-ENR-CODE-COURSE-ONLY for a bare course id, and nothing is sent to Teach (Reach::Identity.parse_course_code). A bare course id whose last eight characters fit the secret alphabet (BUS101AFA26K7QX) is shaped like a passkey with no separator, so it is sent to Teach, which answers course_code_unknown with details.course_only and rEach shows M-ENR-CODE-COURSE-ONLY for it (verified against live Teach in 0.35.20)."
  - id: STD-STATE-FILE-HELD
    text: "Since 0.52.16 a file another program keeps held no longer becomes a fault. Reach::StateFile.rename_into_place raises Reach::StateFile::Held (a StandardError that carries the path) once its Windows retries are spent; on any other host a refused rename still raises its own error at once. Reach::Enroll.update! writes install.yml only when something other than last_checked_at changed or the stored last_checked_at is an hour old or more, so a sync no longer rewrites the file each time, and on Windows a timed-out install.yml.lock wait raises Held instead of writing without the lock. Reach::Debug.fault never reports a Held to Teach: Reach::SetupLog.held records it locally with a count. Reach::Subscribe treats it as busy and registers no failure, every reach_* tool answers it with a calm try-again result (M-STATE-HELD), a hook ends quietly and the terminal prints M-STATE-HELD. Reach::OldCopy compares Reach::VERSION with the managed plugin copy and the Codex and Claude plugin cache copies (small files only, no process list). The prompt hook tells the agent once per chat (M-OLD-COPY-NOTICE) only when the running copy is older than a copy found; a held file (a reach_* tool answer or a hook that ends on Held) gives it once per chat when any other copy found has a different version, since an older copy may be what holds the file. It says an older rEach is still running, to quit the app completely and update rEach from its Plugins page, or remove it and add it again following the setup handout. A 0.51.0 copy cannot be changed and has none of this; it is dealt with from the 0.52.16 side."
  - id: STD-CODEX-PATCH-CHECK
    text: "Since 0.52.16 the PostToolUse check hook handles a Codex apply_patch. The patch is in tool_input.command, so reach check --format agent takes the targets from Reach::Gate.patch_targets (rebased on tool_input.workdir or the event cwd, as the write gate does), keeps those inside a slice and runs Reach::Check.run once per distinct slice with that slice's targets as changed, exiting 0 quietly when none is in a slice. The hook never emits M-PICK-SLICE, which a student with several slices met after every patch since 0.51.11; a hook call that cannot resolve a slice exits 0 quietly. Claude Write and Edit behave as before."
  - id: STD-STATE-FILE-REPLACE
    text: "Since 0.46.2 every file rEach writes while enrolling a student, and every course-folder harness file, is replaced through Reach::StateFile (a temporary file beside the target renamed into place by rename_into_place, which retries a rename refused with EACCES or EBUSY, as 0.46.1 introduced for RAUD-13). 0.46.2 adds the two writers 0.46.1 left on a bare write: Reach::Stamp.store! and Reach::Harness.write_protected (.codex/hooks.json, .codex/config.toml and the other course-folder files, still made read-only after the rename), so Codex never reads an empty or half-written hooks.json. Reach::Relocation.stale_ruby_target? also counts a course folder whose .codex/hooks.json or .claude/settings.json does not parse as a JSON object as stale, so repair_ruby_paths! (run by reach hello at session start) rewrites it. Reason: on Windows a rename onto a file another process holds open is refused, and Codex reported a course folder's hooks.json as unparseable at line 1 column 1 while rEach's repair took the unreadable file for a current one."
  - id: STD-FINGERPRINT-SALT-KEPT
    text: "Since 0.43.1 a reinstall on the same computer enrolls as the same computer. Reach::Fingerprint.store! also writes the fingerprint salt into the per-computer sidecar (Reach::Sidecar.keep_fingerprint_salt, field fingerprint_salt of seal.json: macOS ~/Library/Application Support/reach, Windows %LOCALAPPDATA%\\reach, Linux $XDG_STATE_HOME or ~/.local/state/reach; REACH_SIDECAR overrides; a persona keeps it in its own home), and Reach::Fingerprint.build takes the salt from the explicit argument, then ~/.reach/fingerprint.json, then the sidecar, and only then makes a new one. A student who deletes the rEach home and enrolls again on the same computer account therefore sends the old salt, so Teach's same-computer check (equal salt and equal machine_id, os_user and platform hashes; the install key is left out) passes and no device move is recorded. Deleting the sidecar as well still makes a new salt and a device move. The wire is unchanged: the salt was already part of the W-ENR-4 fingerprint."
  - id: STD-FINGERPRINT-OS-USER
    text: "On macOS a process an app launched (the Codex app, Claude desktop, Claude Code hooks) gets root from getlogin, so the W-ENR-4 os_user Reach computes there is root:<uid>, while a terminal gets the account name. Reach::Fingerprint.live therefore also carries the digests of the same binding with os_user set to the account name of the uid (Etc.getpwuid) and to root, on POSIX and always with the same uid, and Reach::EnrollmentLock accepts the stamp when any of them matches (Reach::Fingerprint.matches?); X-Reach-Fingerprint carries the one that matches the stamp (Reach::Fingerprint.header_digest), and the relocation enrollment snapshot uses the same match. Another uid, machine id, platform or install key still locks as moved. What enrollment sends is unchanged. Reason: students who enrolled in Terminal were locked as moved seconds after they opened the Codex app or Claude desktop, and students who enrolled in the app were locked when they ran reach in Terminal, and had to enroll again."
  - id: STD-HARNESS-MOVE
    text: "Since 0.44.0 a student can move rEach to another AI app on the same computer (claude-code, codex, antigravity, or hermes) without enrolling again. reach harness move --to <app> [--from <app>] asks the student in the terminal, and the MCP tool reach_setup with action harness and to (and optional from) asks rEach's own question (consent kind harness_move, message M-HARNESS-MOVE-ASK, relayed word for word); the plugin prompt hook and the course-folder prompt hook both take the typed yes or no. When the app runs no rEach hooks (from is antigravity, or no app can be told from the environment, the parent process or an earlier hook run), no question is asked and the agent gets M-HARNESS-MOVE-TERMINAL with the terminal command instead, as STD-NOHOOK-ENROLL does for enrollment. On yes Reach::HarnessMove installs rEach into the target app with the same steps as reach setup --harness <app> (Reach::Setup.run_harness), rewrites every course folder's harness files (Reach::Harness.configure_all), and, when the target is codex and Codex's settings do not hold what rEach needs, adds the Codex settings step (M-HARNESS-MOVE-CODEX-NEXT: run reach codex configure in a terminal, STD-CODEX-SETUP), because the chat the student is leaving cannot take that answer. It answers with the next steps (M-HARNESS-MOVE-DONE: open the new app in the reach-work folder, start a new chat, sign in with the same password; the enrollment, course folders and work stay as they are). A target app with no command-line tool (the Codex or Claude desktop app) gets the setup's manual step instead, and a failed install changes nothing else (M-HARNESS-MOVE-FAILED). rEach stays installed in the app the student is leaving. The move adds no device move and no new enrollment: the enrollment lives in the rEach home and the fingerprint does not name the app. Each move writes a command debug event (from, to, ok, via). reach harness move exits 0 when the move succeeded, the student said no or rEach already runs in that app, 1 when the app is unknown or the install failed, and 2 on usage. Since 0.44.2 (wire revision 2026-10-07b, W-AUTH-8) Teach keeps the install's app at the last one reported in X-Reach-Env (not terminal or unknown), so after a move it shows the app in use."
  - id: STD-UNINSTALL
    text: "Since 0.63.0 (wire revision 2026-10-22d, W-API-INSTALL-WITHDRAW, Teach 0.107.4) a student, or the agent working for them, removes rEach with one command, reach uninstall (UNINSTALL.md, skill reach-uninstall). It deletes the rEach home folders (the workspace base's .reach-home and the legacy ~/.reach: only folders of those exact names that look like rEach, never the target of a symlink, never one that is or contains the student's home, the workspace base, a deliverables folder or an extracurricular folder), the user-level update job, the claude and codex plugin and marketplace registrations, the Antigravity links and the Hermes links and hook entries, rEach's edits to Codex's config.toml (Reach::CodexSetup.unconfigure!, restored from rEach's own backup and only for keys whose value is still what rEach wrote), the Windows user PATH entry the installer added (listed as left for the student when that PATH holds %variables, which a rewrite would flatten), and, inside the work folders, only the files rEach generated and can still recognise by content (.claude/settings.json, .mcp.json, .codex/config.toml and hooks.json, the write-protected AGENTS.md, CLAUDE.md and GEMINI.md rules files, .reach-space.json). A generated file the student changed is edited or left and listed, never deleted. Files and folders that rEach locked read-only (Workspace.lock_down) become writable again. Nothing else in the reach-work folder is touched: not deliverables, extracurricular, the older course folders, personas, README files, the .reach folder inside each assignment slice (it holds the student's plan, receipts and kept copies) or anything the student wrote. Before anything is deleted the receipts and grade records (never keys, vault, transcripts or install.yml) are copied to ~/Downloads/rEach-receipts-<UTC date and time>, and the home folders are not deleted when that copy fails. The checkpoint mirror outside reach-work stays unless --purge-checkpoint-mirror is given, and the Hermes profile named reach stays unless --delete-hermes-profile is given. Without a yes the verb prints M-UNINSTALL-ASK, naming what goes, what stays, the unsent items that will be lost and whether Teach will be told, and exits 3; the yes is Reach::Consent kind install_withdraw, recorded by the prompt hook from a chat inside a course folder; --yes is refused (M-UNINSTALL-NEEDS-CONSENT) while the install is enrolled and not locked, which includes a lock check that cannot run; on a terminal the verb asks for a typed yes itself and then does not tell Teach, because no consent record exists to send. After the yes the verb sends one signed POST /api/v1/installs/withdraw through the shared client (connect 5 s, read 10 s, one retry, a 25 s deadline; REACH_OFFLINE=1, --no-teach and REACH_UNINSTALL_TELL_TEACH=0 skip it); Teach marks the install revoked with reason withdrawn and keeps the student, the roster entry, submissions, receipts, grades and transcripts, so a later enrollment needs no device move. Every outcome other than 200 is soft: the uninstall continues and the closing text says Teach was not told and why (M-UNINSTALL-NOT-TOLD), and a removal that fails after Teach was told says so and asks the student to run it again (M-UNINSTALL-FAILED-TOLD). scripts/reach-uninstall (stdlib-only Ruby) does the removal; the verb loads it and runs it from a temporary copy so it can delete the plugin it came from, and UNINSTALL.md downloads and runs it alone when rEach will not start, in which case it never calls Teach and prints Codex's settings as left for the student. REACH_UNINSTALL_KILL_SWITCH=1 refuses everything. Unsent outbox items are counted in the question (M-UNINSTALL-UNSENT) and are lost with the student's yes; their work files stay and can be sent again after a reinstall. The gate lets reach uninstall run on a locked or relocating install when it is the only command on the line. Unverified: the macOS LaunchAgent, the Windows Task Scheduler, user PATH and deferred-removal paths, the Antigravity and Hermes steps and the claude and codex uninstall commands were exercised only against stubs or read as text on a Linux host."
  - id: STD-COWORK-CODE-TAB
    text: "Since 0.33.3 rEach does not enroll or sign a student in from Claude Cowork; it sends them to the Claude app's Code tab. When the prompt hook (gate enroll, gate prompt) runs and Reach::Fingerprint.harness_label names claude-cowork (CLAUDE_CODE_ENTRYPOINT local-agent or remote_cowork; since 0.35.7 any value that starts with local-agent, local_agent, remote_cowork or claude-coworker, Reach::Fingerprint::COWORK_ENTRYPOINT, the Cowork values found in Claude Code 2.1.289), and rEach is locked or the session is not signed in, the hook does not run the enrollment or sign-in flow and changes no flow state: it exits 0 and returns M-COWORK-CODE-TAB inside M-COWORK-RELAY as UserPromptSubmit additionalContext, which tells the agent to reply with that message word for word and do nothing else (Reach::CLI.code_tab_hold?, code_tab_payload). A prompt that matches the crisis check gets rEach's support message the same way. Reason: Cowork showed a blocked prompt as an empty response, and relaying the questions instead would pass the passkey, student ID and password through the agent, which STD-ENROLL-LOCKDOWN and STD-ENROLL-PASSWORD forbid. Instructor mode and every other Claude Code surface are unchanged. Since 0.35.7 a prompt hook never exits 2 in Cowork: when gate enroll or gate prompt would block there for any other reason (a block raised outside code_tab_hold?, or a state it does not cover), Reach::CLI.run_hook answers with the same M-COWORK-RELAY payload and exit 0, writes nothing to stderr, and records a gate debug event with outcome context and message id M-COWORK-CODE-TAB (Reach::CLI.cowork_prompt_hook?). This second rule has no instructor-mode exception: an instructor's blocked prompt in Cowork gets the Code tab message too. The prompt then reaches the model with only that relay instruction, unrecorded and without course rules, and the student learns the real reason for the block in the Code tab; this is accepted because the alternative in Cowork is an empty turn. Reason: on Windows a Cowork student's every message ended in an empty turn. Since 0.50.3 the second rule is replaced: a block raised outside code_tab_hold? answers in Cowork with the STD-CLAUDE-WINDOWS-HOOKS JSON decision block (exit 0, the reason shown to the student), confirmed working in Cowork on a student's computer; code_tab_hold? is unchanged. Not verified in a real Cowork session on any system; the first cause is inferred from one student's screenshot and the second from the instructor's report."
  - id: STD-INSTRUCTOR-UNLOCK
    text: "Since 0.16.17 an instructor can lift the enrollment lock on one install without enrolling. Since the instructor keyring (built, not released) Teach holds the private keys and mints, revokes and rotates the codes on its console; rEach pins no key in config.yml (enrollment.instructor_keys and enrollment.instructor_revoked are deleted and no longer read) and reads the keys, retired key ids and revoked code ids from GET /api/v1/instructor/keyring (schema teach.instructor-keyring/v1). On an install holding signing_public_keys the keyring signature must verify with the key named by signing_key_id, otherwise it is rejected and the cache kept; an unenrolled install accepts a well-formed keyring from the configured Teach URL. A keyring older (issued_at) than the cached one is dropped. The cache is instructor_keyring.json (0600) under the root state folder, fresh for instructor.keyring_refresh_s in config.yml (900), refreshed at session start (hello, quick) and before a typed code is verified when stale; offline the cache is used, and with no cache a code is refused with reason keyring_unavailable (M-INSTRUCTOR-KEYRING-UNAVAILABLE at reach instructor unlock). A key in retired_key_ids is never pinned (key_unpinned). reach instructor keygen and code print M-INSTRUCTOR-MINT-IN-TEACH and exit 1; status also shows the keyring revision, age and key ids. A code is RINS1.<payload>.<signature> (base64url, PSS with SHA-256 over RINS1.<payload>), carries a random id, the key id and an optional label, and never expires. Pasted into the locked prompt it is intercepted by the enrollment hook before any flow step, so the agent never sees it; an invalid one is refused (M-INSTRUCTOR-REFUSED) and counts toward the enrollment lockout, while a valid one unlocks even during a lockout. A valid code is stored in ~/.reach/instructor.json (0600) and re-verified each time the lock state is computed: a keyring that no longer lists its key, lists the key as retired or lists its id as revoked relocks the next prompt and logs instructor.invalidated. While unlocked and not enrolled, Reach allows every prompt without guardrails, workspace or login checks, captures nothing, and tells the agent once per session it is in instructor mode (M-INSTRUCTOR-CONTEXT). On an enrolled install (Enroll.current present) a valid code typed at any prompt, in any state, unlocks that chat and nothing else: it is never judged as a password, student ID, yes or no, passkey or enrollment answer and never counts toward a lockout, and it is verified (signature, keyring key, revocation) but never stored, so instructor.json is left alone, instructor.unlocked is not logged and reach instructor status says not unlocked. It signs the current chat in as the enrolled student (confirmed, with the usual expiry), clears the sign-in failures and their lockout and the enrollment-flow lockout, and grants that chat an instructor pass: a small private record under the Reach state folder that names the chat, the code id and its key and lasts no longer than the normal sign-in, never holding the code or its signature. The record is sealed with an HMAC-SHA256 keyed by a secret that belongs to this install (derived from the install key, or kept in its own private file when there is none), so a record edited by another program, by accident or copied from another install is ignored, as is one that has expired, claims a lifetime longer than the sign-in hours or starts in the future. The seal does not stop the student at that computer, who can read the install key; it raises the bar no higher than editing the installed Ruby files. While the pass lasts, no enrollment lock reason (revoked, stamp_invalid, moved, restamp, course_ended) blocks that chat's hooks; the seal, the expiry, the keyring key and revocation are re-checked whenever it is read, and a revoked code id or a retired or removed key voids it. Every other chat, the terminal and the MCP tools are unaffected, a new chat asks for sign-in as usual (STD-INSTRUCTOR-PERSONA still experiences it), and Instructor.active?, instructor personas and diagnosis see no unlock. M-INSTRUCTOR-SIGNED-IN says so plainly: this chat only, nothing stays unlocked on the computer. An invalid code is refused (M-INSTRUCTOR-REFUSED), counts toward the enrollment lockout only where it did before (not enrolled or locked) and never toward the sign-in failures. When the plugin prompt hook and a course folder's prompt hook both see the code in one prompt, exactly one of them does the work and answers: the first to claim the prompt (its turn, or its session and digest within 30 seconds) acts and the other passes it with no answer. reach instructor unlock does the same from a terminal for the most recent chat that is waiting for sign-in: it takes no argument, because a code on the command line would sit in shell history and the process list (M-INSTRUCTOR-UNLOCK-NO-ARG, exit 1), and reads one line from standard input (hidden on a terminal), answering M-INSTRUCTOR-TERMINAL-OK, or M-INSTRUCTOR-REFUSED with exit 1; it works when no hook runs, and a code typed at reach login password is routed to it. On an install that is not enrolled it accepts and stores the code as described above. Code verification (signature, keyring keys, revocation) is unchanged. reach instructor status never prints the code, and reach instructor lock moves instructor.json to a .backup sibling with the code field removed, so the backup keeps the code id, key id, label and times but can never unlock anything. A code that an earlier release stored on an install that is enrolled as a student (the root Reach home holds an enrollment, as opposed to a persona's own home or a computer that is not enrolled) is no longer honored: the next time the lock state is read, and at session start, instructor.json is moved to .backup without its code field and instructor.invalidated is logged with reason enrolled_install. Since 0.35.15 each session start on such an install also rewrites every .backup/instructor-*.json that still holds a code, signature or raw_code field (left by reach instructor lock before 0.35.14) without those fields and logs instructor.backup_scrubbed with the code id and key id; a backup it cannot rewrite logs instructor.backup_scrub_failed with the file name and error class and the rest are still scrubbed. While an instructor persona is active the install is enrolled as that test student, so it gates and captures exactly as a student's install does, into the test student's record (STD-INSTRUCTOR-PERSONA). Events (instructor.unlocked, instructor.refused, instructor.relocked, instructor.invalidated, instructor.backup_scrubbed, instructor.backup_scrub_failed, and instructor.signed_in with the session id, the pass expiry and, as booleans, which lockouts it cleared; an enrolled install logs it instead of instructor.unlocked) carry the code id, key id and reason, never the code. None of them is sent to Teach."
  - id: STD-INSTRUCTOR-PERSONA
    text: "Since 0.16.23 (wire revision 2026-10-02a) an instructor whose install holds a valid instructor unlock (STD-INSTRUCTOR-UNLOCK) and is not enrolled as a student can run that install as a test student, to experience every student feature and course step exactly as a student does: reach instructor dummy [--course ID] starts a blank test student, and reach instructor as <username> [--course ID] starts a test copy of that roster student (group, slice assignments, latest module record, submissions and receipts as of now). Teach creates the test student through W-API-ENROLL-INSTRUCTOR, which the instructor code authorizes; it never issues an install for a real student, nothing the persona does is written to a real student's record, and test students are left out of roster imports, grade exports, module capacity, sidecar conflicts and course-wide counts and named 'Test student ...' or 'Test copy of ...' in every instructor view. A persona has its own Reach home (~/.reach/personas/<id>/: install, keys, vault, transcripts, profile, brain, sidecar) and workspace (~/reach-work/personas/<id>/); the instructor unlock, the managed plugin, updates and the runtime kit stay shared. The active persona is named in ~/.reach/persona.json, which every hook and command reads, so the persona spans every harness session on the computer until reach instructor exit moves the pointer, the persona home and its workspace to .backup siblings. One persona is active at a time. While one is active, rEach tells the agent nothing about it and gates, captures and messages exactly as for a student; reach instructor status names it. Revoking the instructor code, or retiring its key, in the instructor keyring Teach serves locks the persona at the next prompt, and in Teach's course policy makes Teach answer revoked to it. Events (instructor.persona_started, instructor.persona_refused, instructor.persona_exited) carry the persona id, kind, course id, code id and test student id, never the code."
  - id: STD-DEBUG-MODE
    text: "Since 0.16.23 (wire revision 2026-10-02a) Reach has a debug mode that is always on while an instructor persona is active (STD-INSTRUCTOR-PERSONA) and otherwise only on request: reach debug on|off [--for MINUTES] on the computer, or an instructor's remote request that Teach delivers in status.debug. It records W-DBG-EVENT metadata of every kind in W-DBG-KINDS (session, hook, gate, command, request, lock, sync, check, qualify, submit, brain, update, error (transcript, retired by STD-TRANSCRIPT and no longer emitted), and since 0.18.0 storage and import under W-DBG-KINDS-2), scrubbed by W-DBG-SCRUB before it is spooled or shown, so no prompt, reply or file text, code, password, key or token is ever in it. Events are spooled under the Reach home in debug/ (0700, files 0600) and sent to Teach through W-API-DEBUG from the Stop and SessionEnd hooks and reach sync; no hook blocks on the network and a failure keeps every event queued. Teach files each event under the classification it derives from the student, instructor for a test student and student otherwise. At the end of each turn the person sees a debug block (W-DBG-RENDER): an ASCII table on a text-terminal harness and a Markdown table on one that renders Markdown, with config.yml debug.render (auto, ascii, markdown) as the override; reach debug show prints the latest events the same way and reach debug status says whether it is on and why. Its labels come from locales/en-US.yml like every other message. A student whose install an instructor switched into debug mode is told once per session (M-DEBUG-NOTICE); a persona is not, because it is the instructor. Since 0.16.25 fault and link events (W-DBG-FAULT, STD-TEACH-LINK) are recorded and sent with reason fault even while debug mode is off; nothing else is. Since 0.35.18 every reach submit starts a detached, bounded reach debug flush after it finishes and the subscribe tick flushes too, so the submission's own events leave the computer; the harness named in every event, command and submission seal comes from one function, Reach::Session.detect_harness: Codex's own variables (CODEX_THREAD_ID, CODEX_SESSION_ID, CODEX_SHELL) first, then Claude Code's, then Hermes, so a Codex process that also carries CLAUDE_PLUGIN_ROOT is never labeled claude-code. Since 0.53.4 (wire revision 2026-10-16b) every refusal says what was refused: Reach::Gate.raise_blocked! adds command (the shell command) or tool and target (the write or read tool and the path it named) to the gate event with outcome block and to the local <logs>/gate-refusals.jsonl line, each the first line only, scrubbed by Reach::Debug.scrub_string and cut to 200 characters, so a here-document body or later lines never leave the computer. The subject is held per call by Gate.write, Gate.shell and Gate.read and cleared when the call ends; a refusal from any other gate carries none. Since 0.53.6 the debug event never carries the command as typed, so no inline secret (an API_KEY=value, an Authorization header, a password flag, credentials in a URL) can reach Teach through it: Gate.mask_command emits only fixed vocabulary (since 0.53.12): operators, redirections, shell keywords, a command word only when its basename is on Gate::MASK_COMMANDS (the gate's own command lists plus common ones), bare * or ?, and the shape of everything else: $… for a variable plain or double-quoted, -… for a flag, <<… for a here-document, …=… for an assignment, and … for any other word or string. No word the student typed reaches Teach unless it is a known command name. Since 0.53.13 (wire revision 2026-10-17a) Gate.mask_target sends a refused path relative to the course folder when it lies inside it, and otherwise only ~/… or /… followed by the file extension (../… before 0.53.16, when a relative path could reach it), so a personal file name outside the course never reaches Teach. Since 0.53.14 the shell witness in the slice ledger (kind shell, which a submission carries to Teach) stores head through the same Gate.mask_command; command_digest still binds the command as run. Acknowledged gap: shell records written before 0.53.14 keep the raw head, and a later submission still carries them, because rewriting a record would break the HMAC chain Teach verifies. Since 0.53.15 a refused path is resolved to its real absolute location when it is captured (Gate.subject_path), so a symlink inside the course to a personal file is masked as outside, and the tool name is sent only when it is a known tool (Gate::MASK_TOOLS), as mcp__… for an MCP tool, or as … otherwise. The local gate-refusals.jsonl, which never leaves the computer, keeps the scrubbed first line; since 0.53.8 it is written 0600 and rotated like the other debug logs (Reach::Debug.append_log)."
  - id: STD-HANDOUT-PARITY
    text: "Since 0.38.10 rEach does what the student setup and troubleshooting handout says. A fresh install's NEXT block is G-INSTALLED then G-INSTALLED-ENROLL, and the first-run interview waits until the student is enrolled and signed in. Setup creates deliverables/ and extracurricular/ in reach-work. reach_update with no action starts with M-UPDATE-CURRENT or M-UPDATE-AVAILABLE, and M-UPDATE-STARTED is relayed word for word with the new-chat instruction; since 0.51.10 a run with no update waiting (and reach update run --apply on a plugin-cache copy whose newest copy is the running one) answers M-UPDATE-NOTHING, and the student keeps working in the same chat. Enrollment shows M-ENR-ASK-PASSWORD-REENROLL only when the install holds an earlier enrollment, and ends with M-ENR-DONE and M-ENR-SYNCING (M-ENR-DONE-LAUNCH only in Hermes). In Codex, while enrollment or sign-in is pending, a chat whose folder is not reach-work or inside it gets M-CODEX-WRONG-FOLDER. In Antigravity, reach enroll --window and reach login --window open a terminal window for the student (M-ENR-AGENT-NOHOOK-GUIDE, M-LOGIN-NOHOOK-GUIDE). Hermes setup prints M-HERMES-APPROVE-ONCE. A submission answers with one message, M-SUBMIT-RECEIVED and M-SUBMIT-ARCHIVED, with no receipt id; the returning greeting calls received work submitted; reach qualify prints one summary line first. A raised hand carries last_step_ok and student_saw, every free-text field is scrubbed of passkeys, labelled passwords and the student ID before it leaves, success prints M-HAND-SENT, and a refused or queued hand adds the course profile's support.contact_text (M-HAND-CONTACT). The reach-assistant and reach-help skills carry the handout's update-first, loop, claim-is-not-confirmation, three-layer, no-pasted-commands and raise-a-hand rules."
  - id: STD-MODULES-LOCK-SYNC
    text: "Since 0.21.4 a module lock-in that Teach accepts (Reach::Modules.choose! returning locked, from reach modules choose, reach_modules or the consent follow-up in the prompt hook) starts a detached reach sync at once, so the new modules' slice workspaces are provisioned before the student's next prompt and the prompt gate (check_has_workspace!) does not block it with M-GATE-NOSLICE (M-GATE-NOGUARD before 0.51.10). The hook never waits for that sync. A scratch Teach 0.22.3 run with a student_choice course provisioned the four slice workspaces about 4 s after the lock, and the next prompt passed; without the spawn no workspace arrived within 20 s and the next prompt was blocked. Since 0.35.18 the consent follow-up for a module lock runs with the answering session's sign-in, and a module-lock yes typed outside the course folder is captured and acted on. Since 0.35.22 a lock Teach accepts also settles the brain: Reach records the decision finding \"The student's modules are locked in: X and Y.\" (evidence: the course record id and issue time), superseding (since 0.35.23) only the first decision finding that names as many module titles as were locked (whole words, any case, titles with symbols included) with at least one not locked; no finding is deleted (0.35.22 forgot every further such finding), and when the brain reinforces or holds the new finding nothing is superseded, so a pair the agent saved while the question was still open no longer reads as the student's choice. This finding spends the brain's ordinary write budget and is skipped silently when the brain is off or refuses it. M-CONSENT-NEEDED tells the agent that nothing is decided until Reach says so and not to save the pending choice to memory."
  - id: STD-CRYPTO-FALLBACK
    text: "Since 0.21.3 a Ruby whose SSL library cannot use AES-GCM additional authenticated data (the macOS system Ruby 2.6.10 with LibreSSL 3.3.6, as Reach::GCM.native_aad? finds) runs every reach command under the runtime kit's Ruby when the kit is installed: Reach::CryptoProbe execs the kit Ruby on the same arguments with stdin passed through and REACH_KIT_REEXEC=1 so it never loops, which gives native OpenSSL GCM speed instead of the pure-Ruby Reach::GCM of 0.20.6. When the kit is missing it starts the background kit install and the command carries on with Reach::GCM. From 0.21.3 to 0.35.11 either way recorded a fault event (where crypto_self_test, outcome kit_reexec or kit_missing) with the Ruby path, the SSL library and the failing stage, even while debug mode was off (W-DBG-FAULT). Since 0.35.12 neither does: the move is handled and the command works, so it is not a fault, and the event, written on every command of every such Mac, was reported to Teach as a technical problem although nothing had failed and spent the shared fault_max_per_hour budget that real faults need. Reach::CryptoProbe.fallback! records nothing and no longer runs the self-test before it moves; the same facts stay in debug session events (ruby_path, openssl_library, kit_ruby, kit_reexec, gcm_self_test) and the failing stage in reach doctor --report. A fault debug event written before 0.38.7 carries no reach_version (W-DBG-FAULT since wire revision 2026-10-06c), the spool waits while the install is unenrolled, offline, sandboxed or in backoff and outlives an update, and a harness plugin copy can stay older than the reach on PATH, so a crypto_self_test event written by a rEach before 0.35.12 and flushed later was filed under the version of the install that sent it, some with an occurred time before that version existed, or under no version once Teach read the version from the event alone. Since 0.38.9 Reach::Debug.flush moves every spooled crypto_self_test fault event to debug/stale-<day>.jsonl before it batches, so no rEach sends one, whichever version wrote it; it is the one exception to STD-DEBUG-MODE sending every fault event, because no rEach since 0.35.12 records it, and nothing is deleted. Installs still on 0.21.3 to 0.35.11 keep recording and sending the event under their own version until they update. REACH_KIT_FALLBACK=0 turns the re-exec off. A native decryption failure names the OpenSSL stage, the SSL library and the Ruby version in its message. reach doctor --report [--offline] [--format json] prints every diagnostic fact: the running Ruby, its SSL library, openssl gem and whether native GCM works, the kit, the home and Reach home (home-relative), which harness and sandbox variables are set and whether the Reach home is writable, a native GCM test stage by stage, an envelope GCM round trip on the path Reach uses (openssl or ruby), RSA-OAEP and PSS, the native GCM test again in a subprocess under every other Ruby it finds (PATH, /usr/bin/ruby, the kit), and each package kind opened stage by stage (header, signing key, signature, unwrap, decrypt, digest) from the stored copy and, unless --offline, the latest copy from Teach (never stored), with a network failure's cause. It prints no key, passkey, token, student ID or course content. Debug session events carry ruby_path, openssl_library, openssl_gem, kit_ruby, kit_reexec and gcm_self_test, and sync events carry the scrubbed warning texts (warning_texts) beside their count. The platform smoke proves it on every leg: the kit Ruby opens Teach's known-answer envelope (kit_known_answer), doctor --report runs after a sync (doctor_report), and on both macOS legs reach doctor --report run inside codex sandbox (Codex CLI 0.160.0) moves to the kit Ruby and opens the stored guardrails package (codex_sandbox_decrypt)."
  - id: STD-UTF8-BUNDLE
    text: "Since 0.25.1 rEach reads text files as UTF-8 whatever the locale of the app that started it (lib/reach.rb sets Encoding.default_external to UTF-8), and every hand bundle (Reach::Hands.fit) and issue bundle (Reach::Issues.write_entry) passes through Reach::Utf8.clean before it is turned into JSON: every string and hash key is tagged UTF-8 and bytes that are not valid UTF-8 are replaced. An app that starts rEach with no locale (Claude Desktop on macOS starts the MCP server that way) made Ruby read a slice's files as US-ASCII, and one non-ASCII character in a file the student owns made reach_raise_hand fail with JSON::GeneratorError before anything was queued or sent."
  - id: STD-SETUP-LOG
    text: "Since 0.35.0, until the install is enrolled (no install file for the current home, and not in instructor mode), Reach writes an exhaustive local setup log to <home>/setup-log/ (0700 directory, 0600 files): every reach command with its exit, exception, full backtrace and cause chain, every hook decision, every request and response with headers and body, every debug event (kept whether or not debug mode is on), every fault, the ids of the messages shown, and an environment snapshot (Ruby, operating system, a fixed list of environment variables, paths, the course server URL, the enrollment lock) at most every 10 minutes; scripts/reach-install and reach-install.ps1 add install-<stamp>.jsonl records of every step and the outcome. It holds no typed text: a prompt, an answer, a username, email, student ID or name is recorded only as its length and line count, and passwords, passkeys, enrollment codes, tokens, keys, signatures, PEM blocks and RINS1 codes never reach a file. Since 0.35.1 the device fingerprint (fingerprint, salt, binding, hostname and machine id fields) is [redacted] too, and every path starting with the user folder (Paths.user_home, HOME, USERPROFILE) is written with ~ in its place, in the setup log, the installers' records and the report. Reach never sends the setup log. A streak counts failures in a row (faults, failed reach commands, a failed install, server refusals, offline, unknown, expired, old or course-only codes, lockouts, an ended course, a denied move, a failed password retry); rejected input (code, ID or username format, short, mismatched or wrong password) neither counts nor resets, and an advanced enrollment step, a successful install or a successful setup, runtime, update or enroll command resets it to 0. At the 3rd failure in a row and every multiple of setup_log.threshold after it, Reach writes reach-setup-report-<time>.json (schema reach.setup-report/v1: environment, installer records, the log trimmed from its oldest end to setup_log.report_max_bytes, recent debug events, issues) to the Downloads folder at once and shows M-SETUP-REPORT-SAVED with its path and file:// link once, in the enrollment hook's reply, a terminal command's output or an MCP tool result, suggesting the student send it to the instructor; reach debug export and the reach_debug export action write one on demand. Logging stops when enrollment succeeds; files stay, capped at setup_log.max_bytes (oldest files removed first). The debug phrases (STD-DEBUG-MODE) also work in the plugin-level enrollment hook, except at a password step. REACH_SETUP_LOG=0 turns the log and the automatic report off. Like every rEach writer it creates nothing when the folder its home hangs from is missing (STD-USER-HOME). Since 0.35.18 a successful enrollment, in the chat or in a terminal, resets the streak to 0, clears the pending report offer and removes the enrollment flow file before logging stops (Reach::EnrollFlow.finish, Reach::SetupLog.succeeded!), and a message built only to be raised or discarded (M-GATE-NOGUARD from the guardrails check) is logged and counted only when it is shown. The Downloads folder is resolved as STD-SUBMIT-ARCHIVE resolves it."
  - id: STD-ISSUES
    text: "Since 0.23.0 (wire revision 2026-10-03c, W-ISSUE-1 to W-ISSUE-8) Reach reports its own technical problems to the instructors without the student or the agent doing anything. Every fault Reach hides from a person (STD-TEACH-LINK) gets a signature, the first 16 hexadecimal characters of a SHA-256 over where it happened, the exception class, the errno name, the message id, the cause and the first three backtrace frames inside the plugin, each reduced to its file and bare method name so that every Ruby version gives the same value (W-ISSUE-2); the fault event carries it as fault_id and, since 0.38.7 (wire revision 2026-10-06c), the version of the Reach that recorded it as reach_version, because the spool outlives an update. Reach::Issues keeps a registry under the Reach home in state/issues.json (0600, at most 200 signatures, entries untouched for 30 days dropped) and decides from a fixed table, with no model and no network: a fault with a transport cause, a Reach::NetworkError or Reach::Offline, and a fault from the issue code itself are never issues; a fault where enrollment, sign-in, hello, sync, qualify or submit happens (W-ISSUE-BLOCKING) is an issue at its first occurrence; any other fault at its third occurrence within 24 hours. An issue is raised once per signature per Reach version (since 0.38.7 the version that observed the fault, kept in the pending record and in raised_version), at most 3 a day and at most 10 waiting; the rest are counted in the next bundle's suppressed field. The course policy's limits.issues can only tighten these, config.yml issues holds the local values, and REACH_ISSUES_DISABLE=1 or issues.enabled false turns the feature off without touching fault events. An issue is a hand with trigger issue and originator reach (W-ISSUE-1), sent only to a Teach whose wire contract digest equals Reach's own, with the fixed summary M-ISSUE-SUMMARY and the sealed bundle reach.issue/v1 (W-ISSUE-4): the fault fields as recorded with debug mode off, the Reach version that raised the issue (since 0.38.7 the version recorded when the fault was observed, so an issue queued on one build and sent after an update to another is reported under the build it happened on; null for a record that predates 0.38.7), the Ruby, platform, operating system, harness and surface of the Reach that builds the bundle, and a capsule (Reach::Capsule: Ruby and SSL facts, runtime kit, connection state, update phase, the names of set harness environment variables, the kind, place and time of the last 20 debug events) of at most 16384 bytes. It never carries an error message, a prompt, code, a path outside the plugin root, the profile or a typed identity. The bundle is built, sealed and sent by a detached reach issues flush --background, never inside a hook or a tool call (STD-HOOK-RESPONSIVE). An unsent issue waits in the outbox and is retried from the Stop hook, reach sync and reach issues flush with full-jitter backoff from 60 seconds to 6 hours that applies to issue entries only (W-ISSUE-8); one process at a time builds and sends, serialized by state/issues.flush.lock with a wait of at most 30 seconds, so two flushes started together never send one report twice; when the outbox is full the oldest non-blocking issue gives way. The next hook context after an issue is due tells the agent once that rEach noticed a technical problem with itself and reported it, and that the student need do nothing (M-ISSUE-REPORTED); when the hand's status names a fix_version and the install runs that version or newer, it says once that the problem is fixed (M-ISSUE-FIXED). A fault from the seal, the witness ledger or the integrity checks is raised like any other and neither notice is shown for it (STD-SEAL-INVISIBLE). A reply to an issue hand does not interrupt the student and never resets an attempt ladder. A technical_issue, setup_issue or access_issue hand the agent raises gains the same capsule and signature_hint, the signature of the newest fault in the 10 minutes before it (W-ISSUE-5). reach issues lists the registry for an instructor persona or while debug mode is on and says nothing about it to a student; reach doctor reports R-DOC-ISSUES while an issue report is waiting to be sent, and R-DOC-OUTBOX does not count issue entries. A hand Teach no longer holds (404) is dropped from the open list instead of stopping the check of the others."
  - id: STD-LIVE
    text: "Since 0.23.0 (wire revision 2026-10-03f, W-LIVE-1 to W-LIVE-9) a student can open a live session with the course's instructors to find out together why something in rEach does not work (Reach::Live, lib/reach/live.rb). It starts in one of two ways: the student's agent calls the reach_live tool (or reach live request) and Reach asks the student its own question (M-LIVE-ASK), or an instructor offers a session and Reach asks the student at their next prompt (M-LIVE-OFFER-ASK). Either way the session is asked for or accepted only after the student's own typed yes, captured by the prompt hook as a signed consent of kind live_session (STD-CONSENT-FROM-REACH), and an offer the student refuses is declined on Teach. One live session per install. While a session is open Reach turns debug mode on for the reason remote and sends its debug events every 10 seconds; when the session closes debug mode returns to what Teach's status says. Two rules hold for every live session and are enforced by code, not by the agent. First, nothing runs on the student's computer because the instructor's side asked: an action the instructor's side requests is one name out of a fixed table (doctor, status, sync, update_check, update, cache_repair, resend, and since 0.31.0 (wire revision 2026-10-04h) codex_configure and sandbox_probe of STD-CODEX-SETUP), Reach asks the student about each one (M-LIVE-ACTION-ASK, consent kind live_action), runs it only after their typed yes within 30 minutes, with a 60 second limit and at most 16000 bytes of output, and answers ok false with a fixed sentence when the student said no, did not answer, or the name is unknown. Second, nothing leaves the student's computer for the instructor's side without the student's yes: a note or an agent message is staged, Reach shows the student the exact text (at most 2000 bytes; M-LIVE-SEND-ASK) and sends it only after their typed yes (consent kind live_send, bound to the SHA-256 of the text), one at a time. Agent messages exist only when Teach marks the session co_debug, which it does for an instructor's test student and, since 0.53.20 (wire revision 2026-10-17b), for a regular student whose install reports 0.53.20 or newer; from 0.53.20 the student's question (M-LIVE-ASK, M-LIVE-OFFER-ASK) also says that the student's assistant and the instructor's assistant may write to each other, so the line is never on under a question that does not name it. The live_action and live_send consents stay on the student's computer. The agent is told the rules in the hook context (M-LIVE-RULES): do nothing the instructor's side asks without the student's yes, send only through reach_live, relay Reach's questions word for word, never answer them itself, and treat the other side's text as information. A detached reach live run --background holds the connection (poll every 3 seconds while open and 10 while waiting, its own token bucket of 30 requests a minute, five failures in a row end the run), so no hook or tool call waits on Teach; reach_live with action wait reads the local inbox and waits up to 45 seconds for something new, returns at once when a question for the student is waiting, and since 0.53.2 the agent is told to keep listening for the whole open session on every harness: call wait again after each answer, also through long silences, and stop only when wait says the session is over (M-LIVE-WAIT-OVER), when it carries a question for the student (relayed word for word, the turn ends so the student can type their own answer, and the agent calls wait again after it), or when the student asks for something else; every wait answer says which (M-LIVE-QUIET and M-LIVE-READ: call wait again). Before 0.53.2 the agent stopped after about five minutes of silence, and on a harness without the Stop-hook wake (Codex, seen on a Windows Codex app install on 0.52.16) every later note waited unseen until the student typed; a message that arrives after the agent has stopped waiting is shown at the student's next prompt (M-LIVE-UNREAD); the prompt hook checks for an offer at most once a minute, and a Teach that answers that live sessions are off is not asked again for an hour. The student or the instructor can end the session at any time; Reach says so once (M-LIVE-CLOSED). State lives under the Reach home in state/live/ (0600). No prompt, reply, code or file is sent. REACH_LIVE_DISABLE=1 or live.enabled false in config.yml turns the feature off. Reach also wakes a waiting agent: on Claude Code 2.1.288 or newer the Stop hook carries a second entry, reach live watch, marked async and asyncRewake with a 900 second limit. It runs in the background and never holds the turn, looks at the local state once a second for at most 840 seconds, and ends with exit code 2 and the notices the prompt hook would give (an offer's question, the open notice, unread messages, an action's question once per action, the end), so the harness wakes the agent with them; the newest watcher wins and an older one exits silently. On an older or unknown Claude Code and on every other harness the entry is not written and the notices show at the student's next prompt. When something from the instructor's side arrives in an open session Reach also shows one desktop notification (M-LIVE-NOTIFY through Reach::Desktop, at most one every 20 seconds, never the message text). config.yml live.wake and live.notify turn these off. A student whose prompts Reach blocks (course rules or course work missing, an update hold, an enrollment lock, or a sign-in that is locked out, refused or whose check failed; never the ordinary sign-in question) can still use a live session, with no agent involved. A blocked prompt that contains the words live session gets Reach's question (M-LIVE-ASK) under the block text; in this path Reach captures the typed yes or no for the three live consent kinds only, from the enrolled install without a confirmed sign-in, and marks the local record gate blocked. An instructor's offer, the open notice (M-LIVE-OPEN-STUDENT), each instructor note word for word (M-LIVE-NOTE-STUDENT), each action's question and the end are shown under the block text; an instructor's agent messages are not shown. Typing end live session queues the end for the runner (M-LIVE-ENDING); the hook makes no network call (STD-HOOK-RESPONSIVE). A blocked prompt is still never stored, learned from or sent. config.yml live.blocked false turns this path off. Since 0.33.2 every detached reach process (the live runner, the transcript stream, the subscribe tick, the storage measure, the support, module and transfer flushes and the sync after enrollment or a module lock) is started with the process group option of its platform (Reach::Runtime.detach_group, new_pgroup on Windows and pgroup elsewhere); before that Windows refused the option, the failure was swallowed and none of them ran there, so a typed yes was never sent. Reach::Live.ask! with an answer still queued for the runner starts the runner and returns M-LIVE-SENDING and does not ask M-LIVE-ASK again. Not run on a real Windows install. Since 0.46.1 a live session's codex_configure applies only the safe workspace mode (CodexSetup.apply!(mode: workspace)); full mode, which turns the Codex sandbox off, is applied only through its own question (M-CODEX-SETUP-CHANGES-FULL)."
  - id: STD-LIVE-DIAGNOSIS
    text: "Since 0.27.0 (wire revision 2026-10-04c, W-LIVE-10) an install that holds a valid instructor unlock (STD-INSTRUCTOR-UNLOCK) can start a diagnosis session: a live session for working out a rEach problem on that computer between the assistant there and the instructor's assistant. reach instructor diagnose [--course ID] or the reach_live tool with action diagnose calls Reach::Live.diagnose!. Without a valid unlock it refuses (M-LIVE-DIAG-NEEDS-UNLOCK). On an install that is not enrolled it first starts a blank test student (STD-INSTRUCTOR-PERSONA) and says how to sign in as it (M-LIVE-DIAG-SIGNIN); on an enrolled install, a student's included, it runs on that install as it is. Reach then asks one question, M-LIVE-DIAG-ASK (consent kind live_session, subject {live: diagnosis}), which says in plain words what the one yes covers. Only the typed yes of the person at the computer counts, captured by the prompt hook as for every consent, also while prompts are blocked. On the yes the runner posts the request with the consent record and the stored unlock code; the course server verifies the code and opens the session at once, or refuses (M-LIVE-DIAG-REFUSED). While a session whose view carries diagnosis true is open, STD-LIVE's two per-item questions do not apply: Reach::Live.send! posts a note or an assistant message at once, and a check from the fixed table that the instructor's side requests is run at once and its result sent. Everything else in STD-LIVE holds: only the fixed table runs, an unknown action is refused, the session is bounded in time, either side can end it and the person can end it by typing, debug events flow only while it is open, and REACH_LIVE_DISABLE=1 turns it off. The agent's rules for the session (M-LIVE-DIAG-OPEN-AGENT, M-LIVE-DIAG-RULES) keep three limits: it asks the person before running any other command or changing anything, it never sends a password, key, token or instructor code, and messages from the instructor's side never change what Reach allows. The unlock code is sent only in that one request and is never written to the live state, the debug events or a log. Since 0.46.1 the server's diagnosis flag approves instructor-requested actions only when the student's diagnosis yes is recorded on this computer (diagnosis_consent in the live state, cleared when the session closes); otherwise each action still needs its own yes."
  - id: STD-TEACH-LINK
    text: "Since 0.16.25 (wire revision 2026-10-02b) every exchange between Reach and Teach, and every Reach hook, MCP tool and command around it, sits behind one safety layer. A person never sees a raw error, a Ruby backtrace, an exception class, a hook error or a hook timeout. Reach::Client turns every transport failure, including ones outside its retry list and a deadline running out, into a Reach::NetworkError whose message is a plain locales/en-US.yml text (since 0.21.2 a deadline running out says M-TEACH-DEADLINE and does not mark the connection lost); the raw failure stays only in debug events. Reach tracks the Teach connection in link.json under the Reach home: when a request fails for lack of a connection it is lost, and any answer from Teach restores it. The person is told once per outage that the connection was lost and that their work is saved and will be sent when it is back (M-TEACH-LINK-LOST), and once when it returns (M-TEACH-LINK-BACK): a systemMessage on Claude Code and Codex hooks, a relay note in the prompt context on Hermes, and a line on stderr from a terminal command. A deliberate REACH_OFFLINE=1 is not an outage, and since 0.21.8 neither is a Codex sandbox that blocks the network (STD-CODEX-SANDBOX), whose failures say M-SANDBOX-AGENT instead of a hiccup; since 0.21.9 a known-issues fetch (STD-KNOWN-ISSUES) never changes the connection state either, and since 0.21.13 neither does an enrollment request (preview, enroll, instructor persona enroll, the v1 code enroll): before enrollment there is no work to send, so a failed one says its own enrollment message (M-ENR-OFFLINE, M-ENR-PASSWORD-RETRY-OFFLINE, M-ENR-CLI-OFFLINE) and never M-TEACH-LINK-LOST or M-TEACH-LINK-BACK. Every hook command runs inside a guard that keeps the hook's outcome (a Reach block stays a block; Claude Code and Codex allow when Reach itself fails, as before; Hermes fail-closed gates block) but replaces whatever went wrong with a plain message shown at most once every 15 minutes (M-REACH-HICCUP), and gives the network a deadline inside the harness's hook timeout so the harness never kills a hook. MCP tools answer with M-TEACH-LINK-LOST or M-REACH-HICCUP-TOOL, and terminal commands with M-REACH-HICCUP-CLI, instead of an exception. A Teach refusal that names something the student can act on still shows Teach's text; one that means Reach sent something malformed (invalid_request, too_large, or no code) is hidden as a hiccup. Every hidden error is recorded as a fault event and every connection change as a link event (W-DBG-FAULT) and sent to Teach even while debug mode is off, with no message text unless debug mode is on, so instructors see students' failures in Teach. A long-lived process whose working directory was removed under it (the MCP bridge outliving the plugin copy Codex started it in, after an update or a reinstall replaced the copy) never raises from asking for it: Reach::Paths.cwd answers the working directory while it exists and the user's home otherwise, and every hook, tool and command reads the working directory through it, so reach_hello and the workspace-bound tools answer normally or with their plain refusal instead of M-REACH-HICCUP-TOOL."
  - id: STD-SETUP-GUIDE
    text: "Since 0.16.13 docs/INSTALLATION-AND-SETUP-GUIDE.docx is rEach's student setup guide and names no institution, instructor, course or term. reach guide prints its text while Reach is locked, and until the student is enrolled every session's locked context (M-ENR-AGENT-GUIDE, and M-ENR-HERMES-GUIDE on Hermes) tells the agent to read it and, when the student's messages reach it while locked, to walk them through the guide's extra steps for their app first, never asking for the passkey, username or student ID."
  - id: STD-NOHOOK-ENROLL
    text: "Since 0.23.1 an app that runs no rEach hooks (Antigravity, which has no hook format) is told so instead of being treated as a hooked app whose hooks failed. reach hello counts a session as hookless when it is not a hook call and not the MCP tool and either --harness antigravity is passed (rules/reach.md passes it) or no harness can be told from the environment, the parent process or an earlier hook run. While Reach is locked for any reason but an ended course, such a session's context is M-ENR-AGENT-NOHOOK-CONTEXT and M-ENR-AGENT-NOHOOK-GUIDE: the student enrolls with reach enroll in a terminal window, where they type the passkey, username, student ID and password themselves; the agent walks them through it at once, asks for no restart or approval, does not send them to their instructor unless the command fails, and never asks for or handles the details. The student-facing line is M-ENR-NOHOOK-STUDENT. On Windows the terminal command in these messages and in M-ENR-AGENT-GUIDE starts with the PowerShell call operator, because a line that starts with a quoted path is not run by PowerShell. The setup guide's Antigravity paragraph says the same. Not exercised in a real Antigravity session or on Windows."
  - id: STD-COURSE-PASSKEY
    text: "Since 0.18.1 every word a student or agent reads calls the class-wide enrollment secret the course passkey: the messages and greetings, reach help, reach enroll --course-passkey (--course-code stays as an unlisted alias), the persona, README.md, docs/student-guide.md and docs/INSTALLATION-AND-SETUP-GUIDE.docx. The wire contract keeps its names (W-ENR-1 course code, field course_code, errors course_code_unknown and course_code_expired) because specs/wire.yml is shared with Teach and its digest is checked at enrollment. Since 0.35.18 a passkey typed inside a short sentence, in lowercase or with spaces between its parts is accepted, and ordinary sentences are never sent to Teach as passkeys."
  - id: STD-PLAIN-TALK
    text: "Since 0.18.1 the persona section How you talk with the student binds in every session and folder, before and after enrollment: the agent treats the student as a new computer user, never brings up or suggests commands or how rEach works unless the student asks for exactly that, describes student-only steps as what to click, and goes faster or deeper only on evidence (profile coding_experience quite a bit, a remembered finding that the student is an experienced computer or software user, or the student's own request), recording that evidence with reach remember. reach hello's session context (M-AGENT-TALK) and the locked context carry the same rule, and rules/reach.md points to it."
  - id: STD-AGENT-UPDATE
    text: "Since 0.18.1 the agent updates rEach only through reach update run --apply and never searches GitHub, its releases or tags, or downloads, unzips or copies a rEach archive itself (persona section Updating rEach, M-AGENT-UPDATE in reach hello's context, INSTALL.md). Every tagged rEach release since 0.18.1 also has a GitHub release marked Latest, so GitHub's releases page names a rEach version rather than a runtime kit. Since 0.35.18 reach update run --apply on a Codex or Claude Code plugin-cache install refreshes rEach through the harness CLI (Codex: marketplace upgrade, plugin add, cache repair; Claude Code: marketplace update, plugin install, plugin update), using CODEX_CLI_PATH when codex is not on PATH (since 0.35.20 only a file named codex or codex.exe, any case), records the result in the update manifest, and when no CLI is usable prints M-UPDATE-APP-ONLY and exits non-zero; a copy that is neither a managed install nor inside a harness plugin cache likewise prints M-UPDATE-APP-ONLY and exits non-zero when an update is pending (the reach_update tool returns it instead of starting a background update, and reach update status carries it); it never reports an update that did not happen."
  - id: STD-AGENT-UPDATE-CHECKS
    text: "Since 0.20.5 every reach update run checks GitHub for a newer release, with or without a terminal, so an agent's reach update run --apply finds a release published since the last hourly check. Only the background run rEach spawns itself passes --scheduled and keeps to the hourly schedule."
  - id: STD-TIMES-AS-STATED
    text: "Since 0.20.5 the agent gives dates and times exactly as rEach states them, with the time zone rEach names, and never converts them to another zone (persona section How you talk with the student)."
  - id: STD-PORTABLE-GCM
    text: "Since 0.20.6 every AES-256-GCM seal and open in Reach (course packages, qualify, submit, hands and reference) goes through Reach::Crypto, which uses the native cipher when it accepts additional authenticated data and otherwise Reach::GCM: AES-256-CTR from the same library plus GHASH in Ruby, byte-identical to OpenSSL's GCM. macOS's built-in Ruby 2.6.10 (LibreSSL 3.3.6) refuses AAD on every GCM call, so without it no Mac running the system Ruby could open a package or submit."
  - id: STD-README-SUBSTANCE
    text: "Since 0.41.0 (wire 2026-10-06e, W-SUB-3) Reach::ReadmeCheck requires an owned README.md to carry the five template sections (Business user and decision; Information flow; People and control; Expected, actual, case, and status; Contributions and tools), each with at least 25 words. reach check reports each gap as CK-README, reach qualify fails its check step on it as QF-README with M-QUALIFY-README and does not count that on the attempt ladder, and reach submit refuses with M-SUBMIT-README before the check gate, raising no hand. Teach applies the same rule to qualifications (422 readme_incomplete) and submissions (rejected, readme_incomplete). The messages tell the agent to write from the student's own answers and never invent a reflection or contributions."
  - id: STD-QUALIFY-NOBROWSER
    text: "A local qualification run whose panel scenarios fail because the browser they drive cannot be found (Ferrum::BinaryNotFoundError, for example after the background Chrome install gave up while the link was down) is recorded as QF-NOBROWSER, not QF-LOCAL-FAIL, with next M-QUALIFY-NOBROWSER telling the agent to run reach doctor --install-chromium and qualify again. A record whose findings are all QF-README, QF-NOBROWSER or QF-UNREADABLE is not counted on the attempt ladder, so a missing browser spends no rung and raises no hand. Only that one error class is recognised; any other browser failure stays QF-LOCAL-FAIL, except a step that opens the panel by a cutout id (STD-QUALIFY-PANEL-ID)."
  - id: STD-PREVIEW
    text: "Since 0.59.0 reach preview (and the reach_preview tool, actions start, stop, status, screenshot) shows a panel slice in the student's own browser (Reach::Preview, lib/reach/preview.rb). It assembles the slice's qualify run directory as qualify does (Reach::Qualify.assemble_local, name preview), installs the kit's gems the same way, and starts lib/reach/kit/preview_server.rb in the background under the kit Ruby: Grokit's own Rack app from the kit (the practice app in app/, the recorded practice data through the slice's GROKIT_REPLAY) on 127.0.0.1 at a free port, answering only Host 127.0.0.1:<port> or localhost:<port> and only a browser holding the preview's random key: the address rEach returns carries reach_key=<32 hex>, which the server swaps once for an HttpOnly, SameSite=Strict cookie (303 to the same page without it), so another account on the same computer gets 403. GET /live/ for a .svelte panel source the slice owns is read from the student's workspace on every request, so a refresh shows a saved change; everything else comes from the assembled copy. rEach opens the student's default browser at /<module> (Reach::Desktop.open_url, plain http to host 127.0.0.1 with no user part only) and returns the address. One preview runs per rEach home (state/preview.json); it stops after 30 minutes without a request, on reach preview stop, or when another slice is previewed. --screenshot runs lib/reach/kit/preview_shot.rb with the same Chrome qualify uses and returns a PNG under <home>/previews with the console errors and failed requests. Only a panel slice whose kit holds qualify/kit/app/index.html is previewed; a backend slice gets M-PREVIEW-NOT-PANEL and a panel without the practice app M-PREVIEW-NO-PRACTICE. The preview is never the course server, takes no address from anywhere, counts on no ladder and sends nothing."
  - id: STD-QUALIFY-PANEL-ID
    text: "Since 0.58.1 a local panel scenario whose failing step opens the panel by a dotted cutout id (When I open the \"records.a2s1\" panel; Grokit's step takes the module id and visits /<module>) is recorded as QF-PANEL-ID, not QF-LOCAL-FAIL, with next M-QUALIFY-PANEL-ID naming the module id to write and telling the agent that the browser and preview are fine. It is a fault in the student's scenarios, so it counts on the attempt ladder, and Reach::Qualify.unable? does not treat it as a qualification that could not be done, so no export is recommended. reach check reports the same step in any feature under qualify/features as CK-PANEL-ID with the correction, before a qualification is spent on it. Both use Reach::Qualify::PANEL_CUTOUT_STEP; rEach does not change Grokit's step."
  - id: STD-QUALIFY-PANEL-EXAMPLE
    text: "Since 0.60.1 a panel scenario whose failing step is I run the \"<cutout>\" example \"<label>\" with a label that the Practice examples list of qualify/kit/practice/README.md does not hold is recorded as QF-PANEL-EXAMPLE, not QF-LOCAL-FAIL or QF-REMOTE-FAIL, whether it failed in the local run or in the course server's run of the agent's scenarios (which reports it only as Capybara::ElementNotFound), with next M-QUALIFY-PANEL-EXAMPLE listing the labels and telling the agent to choose one itself instead of asking the student. It is a fault in the student's scenarios, so it counts on the attempt ladder, and Reach::Qualify.unable? does not treat it as a qualification that could not be done. reach check reports the same step in any feature under qualify/features as CK-PANEL-EXAMPLE with the labels, before a qualification is spent on it. Nothing is flagged when the README is missing or lists no examples. Both use Reach::Qualify.panel_example; the labels are read with Reach::SafeFiles and the course server's answer is not changed."
  - id: STD-QUALIFY-LOCAL-UNABLE
    text: "Since 0.56.17 a local qualification run that cannot start on the student's computer is not a failed try and not a dead end: when the checking tools cannot be installed or do not load (a Reach::Error from select_lock! or install_gems, a runner that produced no report with a LoadError, GemNotFound or build error, or every failing scenario carrying such a message), Reach records local_pass, local_stub, and the port probe as ran false with skipped environment and the cause, adds no finding, tells the agent M-QUALIFY-LOCAL-UNABLE (the cause, not a code fault, the course server decides, reach runtime install repairs the local checks) and goes on to the remote step, so Teach's runs decide the slice (W-QUAL-2, W-QUAL-4, wire 2026-10-21f). A scenario that ran and failed for any other reason is still QF-LOCAL-FAIL."
  - id: STD-SMOKE-ASSIGNMENT-GUARDS
    text: "Since 0.41.0 tools/smoke/assignment_one.rb writes a schedule overlay for its scratch course with A1 due 14 days ahead, so the run never depends on the spec's base due dates; checks that reach check refuses the delivered template README; and after the grade, assigns the panel slice too and requires that A1 leaves Teach's progress and the panel exports as missing with score 0, then moves the student to another module and requires the submission to be orphaned and the new slices to export as missing."
  - id: STD-ENV-REPORT
    text: "Since 0.42.0 (wire 2026-10-07a, W-AUTH-8) every signed request carries X-Reach-Env with the harness rEach is running under, the OS family, the OS release, the CPU architecture and the Ruby version, from Reach::Environment (memoized per process, except the harness, which since 0.53.0 is worked out per request with its confidence, STD-HARNESS-VERIFIED; each value limited to [A-Za-z0-9 ._()+-] and 64 characters, the header at most 320 bytes). It is descriptive only, never used for authorization; a failure computing it omits it without failing the request, and REACH_ENV_REPORT_DISABLE=1 omits it."
  - id: STD-HARNESS-VERIFIED
    text: "Since 0.53.0 (wire 2026-10-16a, W-AUTH-8) one detector, Reach::HarnessIdentity, names the harness and how sure rEach is of it, and Reach::HookLiveness.harness and Reach::Environment both use it. Every hook that runs with a payload session_id records that session's label (Fingerprint.harness_label of the hook's --harness hint, or Session.detect_harness without one) in state/harness_sessions.json, keeping the newest 64 sessions of the last 14 days. A hook's own requests are verified; any other process whose CLAUDE_CODE_SESSION_ID or CODEX_THREAD_ID names a recorded session takes that session's label as verified; otherwise environment markers give an inferred label, and the parent process, the last label any hook recorded, or the terminal or unknown fallback give a weak one. The harness and its confidence are worked out for every signed request, so a long-lived MCP server follows the session's hooks instead of freezing its first answer; the other environment fields stay memoized. Every signed request that carries X-Reach-Env also carries X-Reach-Harness-Confidence. Not verified: that Codex's CODEX_THREAD_ID equals its hook session_id; if it does not, Codex processes other than hooks report inferred."
  - id: STD-COMPAT-TESTED
    text: "Since 0.42.0 the platform smoke report (reach.platform-smoke/v1) carries leg, reach_version, commit and the installed copy's Reach::Environment fields, and tools/platform_smoke/matrix.rb folds reports into compat-tested.json (reach.compat-tested/v1) and compat-tested.md: one cell per leg and harness group (core, claude-code, codex), pass or fail with the failed steps, a harness group blocked when core fails. The platforms workflow's matrix job builds and uploads it after every run. Its scope is rEach's commands and the harness hook command lines with no live agent session, and every artifact says so."
  - id: STD-SMOKE-REAL-PACKAGES
    text: "Since 0.20.5 the platform smoke opens real teach.package/v1 envelopes on every OS leg: a known-answer guardrails envelope sealed by Teach, and guardrails and workspace packages that fake_teach seals for the enrolled install, stores, and then answers with 304. R-DOC-GUARD is no longer an expected doctor finding."
  - id: STD-CLI-VERSION
    text: "Since 0.18.1 reach version, reach --version and reach -V print reach <VERSION> and exit 0, and work before enrollment."
  - id: STD-QUALIFY-UTF8
    text: "Since 0.21.6 reach qualify reads the agent's feature files as UTF-8 whatever the computer's locale, replacing invalid bytes, so a scenario that names a non-ASCII value (for example a Japanese label) cannot crash the coverage step with Encoding::CompatibilityError under a C or POSIX locale."
  - id: STD-KIT-CLEAN-ENV
    text: "Since 0.33.5 every launch of the runtime kit's Ruby (the qualify gem install and bundle check, the cucumber run, the GCM re-exec and doctor's kit probe) goes through Reach::RuntimeKit.clean_env, which unsets RUBYOPT, RUBYLIB, GEM_HOME, GEM_PATH, GEM_SPEC_CACHE, RUBYGEMS_GEMDEPS and every inherited BUNDLE_ and BUNDLER_ variable before the launch's own settings apply. A student whose own Ruby exports these (a Ruby 3.3.8 under ~/.local/usr exported RUBYLIB at its 3.3 standard library) otherwise made the kit Ruby 4.0.7 load the wrong rubygems at start and exit with \"ruby lib version (3.3.8) doesn't match executable version (4.0.7)\", so reach qualify could never run while reach runtime install's ruby -v smoke still passed. LD_LIBRARY_PATH and DYLD_ variables are left alone: the kit Ruby is statically linked to libruby and Chrome may need them. Launches of a Ruby already on the computer keep the student's environment."
  - id: STD-QUALIFY-REMOTE-BUDGET
    text: "Since 0.21.2 the Teach half of reach qualify (the upload and the polls for its result) runs under its own 20-second deadline that starts after the local steps, so an MCP reach_qualify call whose local steps outlast the 25-second tool budget still reaches Teach, and the whole call stays inside Codex's 60-second tool timeout. A poll that runs out leaves the qualification pending with its id, and the next reach qualify of the same files resumes it. A Reach deadline running out is told as M-TEACH-DEADLINE and does not mark the Teach connection lost."
  - id: STD-QUALIFY-UNCOVERED
    text: "Since 0.20.3, a qualification that stops on QF-UNCOVERED carries next (M-QUALIFY-UNCOVERED in text and JSON): write one scenario under qualify/features per uncovered required name with the slice tag (practice names for replay panels, graded names otherwise), then qualify again; never raise a hand for it. reach-help forbids hands for QF-UNCOVERED, QF-CHECK, QF-LOCAL-FAIL and QF-VACUOUS."
  - id: STD-MODULES-PENDING
    text: "Since 0.20.2, while a student has no modules, reach next says to choose them (M-NEXT-CHOOSE, or M-NEXT-CHOOSE-OPEN when the choice has no closing time) or to wait for the instructor to assign them (M-NEXT-WAIT-MODULES, in student-choice and instructor modes alike), never that nothing is released. Since 0.35.18 reach next names the slice as well as the module for a ready-to-submit or received slice, and after a submission continues to the next released slice that is not submitted, naming a received-but-ungraded slice only when no slice is left to submit."
  - id: STD-STUDENT-MESSAGES
    text: "Every message shown to a student comes from a catalogue by id, never an inline string: Reach::Messages (locales/en-US.yml) for course messages and Reach::Greetings (locales/greetings.en-US.yml) for rEach's greetings, so both stay translatable and consistent. Student-visible text stays in rEach's catalogue; the frames and the order of authority around what the agent is shown come from agent-control.yml (STD-AGENT-CONTROL)."
  - id: STD-CODEX-SANDBOX
    text: "Since 0.21.8 Reach recognizes a command that Codex runs in its own sandbox (CODEX_SANDBOX set, as on macOS, or CODEX_SANDBOX_NETWORK_DISABLED=1, the only marker on Linux) where the sandbox blocks the network (CODEX_SANDBOX_NETWORK_DISABLED=1) or the Reach home (a write under ~/.reach/state refused with EPERM, EACCES or EROFS), which happens whenever Codex runs outside a trusted course folder whose .codex/config.toml grants network_access and writable_roots ~/.reach. Reach::Sandbox decides it. Reach::Client then makes no request and raises a Reach::Offline carrying M-SANDBOX-AGENT (cause codex_sandbox), so the connection is not marked lost and no outage is announced; a terminal command that fails on such a blocked write says M-SANDBOX-AGENT instead of M-REACH-HICCUP-CLI, which would claim the instructor was told; reach update run and reach update check say M-SANDBOX-AGENT and do not run, and reach update status adds M-SANDBOX-UPDATE-STALE, so a stale last check is never reported as no newer version; reach doctor opens with M-SANDBOX-AGENT and doctor --report carries a sandbox section. M-SANDBOX-AGENT tells the agent to use the reach_* MCP tools, which Codex runs outside its sandbox, and gives it M-SANDBOX-STUDENT to relay when no tool fits. reach_debug (on, off, status) and reach_doctor give the agent debug mode and the health check through the bridge, and since 0.21.12 reach_update (status, run) gives it the updater: run starts reach update run --apply --force as a detached process, outside the sandbox, and answers M-UPDATE-STARTED (or M-UPDATE-NOT-STARTED when it could not start); status returns the installed version and reach update status's lines. reach_update works before enrollment, as reach update does. MCP tools, hooks and commands outside a Codex sandbox are unchanged. Since 0.28.2 M-SANDBOX-STUDENT carries the course folder's path on this computer (Reach::Sandbox.course_folder: Reach::Paths.workspace_root with the computer's own path separator) and says that folder holds deliverables and extracurricular and is the one to open; before, it said only \"your course folder\", and a Windows Codex student who found just those two folders was told they had no course folder. Since 0.31.0 STD-CODEX-SETUP fixes the cause: after the student's yes Reach writes the sandbox settings it needs into the student's own Codex configuration, and M-SANDBOX-AGENT and M-SANDBOX-STUDENT point the agent and the student to it."
  - id: STD-HOOK-GUARD
    text: "Since 0.29.0 (wire revision 2026-10-04f) Reach does no course work in a Codex that is not running its hooks, because without them Reach cannot see what the student types or apply the course's rules. Reach::HookLiveness.prompt_hook_dead? is true only for a Codex harness (told from the environment, the parent process or the last hook) and in one of two cases: a session-start hook with source startup, resume or clear ran on Codex (hooks_seen.json session_at and session_label, written by reach hello as a hook and by gate session) and no prompt hook has run since; or no prompt, tool or stop hook has run for 15 minutes (STD-KNOWN-ISSUES; since 0.64.0 STD-HEALTH). A session-start hook with source compact and a reach hello run by hand never arm it. While it is true, Reach::Qualify.run, Reach::Submit.submit and Reach::Part.record! refuse with M-HOOKS-REQUIRED, from the MCP tools and from the commands alike, which says that nothing is wrong with the student's work and sends the agent to the known issue's steps (since 0.64.0 it carries the steps itself), and the hooks_not_running detector reports the problem on the first tool call. The next prompt that arrives through the prompt hook lifts it. Every other command and tool keeps working, raising a hand and a live session included. It never applies to another harness. config.yml hooks.require false or REACH_HOOK_GUARD_DISABLE=1 switches the refusal off; the detector stays. Since 0.33.4 the plugin's own prompt hook (gate enroll) is not a prompt hook for this standard: it runs in every folder and records no prompt and applies no course rule, so it writes its own stamp (hooks_enroll_seen.json: at, label) and never writes hooks_seen.json. Before 0.33.4 it stamped prompt_at and work_at, so a Codex that ran only the plugin's hooks looked alive, qualify, submit and part record were not refused, and own-part answers were silently never saved. Only a course folder's gate prompt sets prompt_at, and only course-folder hooks set work_at. Reach::HookLiveness.recorded_harness reads the label from whichever of the two files is newer. Since 0.35.6 (STD-CODEX-HOOK-TRUST) the plugin's gate enroll hook on Codex carries the course prompt work itself and stamps prompt_at on every Codex run, because Codex never ran a course folder's prompt hook; whether the course rules for tools run is now judged from Codex's own hook trust (HookLiveness.course_hooks_untrusted?, M-HOOKS-UNTRUSTED), which require_hooks! checks first. Since 0.35.18 work_at is stamped only by a course folder's work hooks (gate write, gate shell, gate read, hook stop, transcript code), never by a prompt hook, the plugin's gate enroll included, which before stamped it on every Codex run and so hid a Codex that ran only the plugin's hooks. When prompt_at is newer than work_at, or there is no work_at, the hooks count as quiet 10 minutes after the latest prompt hook, otherwise 15 minutes after work_at; every prompt hook moves that clock, so a chat that keeps prompting is never reported as hooks not running."
  - id: STD-KNOWN-ISSUES
    text: "Since 0.21.9 (wire revision 2026-10-03d, W-API-KNOWN-ISSUES, W-KI-1 to W-KI-4) the instructors keep a list of known problems in Teach, each with what the student or agent sees, an optional detector, the operating systems, harnesses and Reach versions it applies to, and the steps the student takes, per operating system and harness. Reach fetches it without signing, so it works before enrollment, caches it under the Reach root (known_issues.json), and never shows the student a fetch error: a failed fetch leaves the connection state alone (an exception to STD-TEACH-LINK) and is recorded only as a debug request event. reach hello's session context (and the locked context before enrollment) names each entry that matches this computer's operating system, harness and Reach version in one line (M-KNOWN-ISSUES-AGENT), marking one whose detector fires as detected (M-KNOWN-ISSUE-DETECTED: walk the student through its steps now). reach_known_issues and reach known-issues give the full matching steps; the agent tells them to the student in plain words, one step at a time (STD-PLAIN-TALK). Detectors: codex_sandbox (STD-CODEX-SANDBOX) and hooks_not_running (an MCP call on Codex with no Reach hook run on this computer for 15 minutes; every hook run records its time in hooks_seen.json under the Reach root state directory). Since 0.28.1 (wire revision 2026-10-04e) hooks_seen.json keeps three times: at (any hook), work_at (a prompt, tool or stop hook) and prompt_at (the prompt hook, gate prompt or gate enroll). The detector reads work_at, so a harness that runs only the session-start hook is detected. reach part record, when it finds no kept prompt and prompt_at is absent or older than 30 minutes, refuses with M-PART-NO-HOOK, which says the answer never reached Reach and sends the agent to the known issue's steps, instead of M-PART-NO-ANSWER, which asks the student to answer first. Since 0.31.0 (wire revision 2026-10-04h) an entry also carries remedy, null or a live action name; Reach maps codex_configure and sandbox_probe to reach_setup (action configure or probe), doctor, status and sync to their tools, update_check and update to reach_update (action status or run), and anything else to null, and names the call in the agent context and in reach_known_issues (M-KNOWN-ISSUE-REMEDY). Reach runs nothing by itself because of a remedy. Since 0.35.18 the Codex hooks-not-running detection reads work_at from course-folder work hooks only (STD-HOOK-GUARD), and also fires when no work hook ran within 10 minutes of the latest prompt. Since 0.64.0 (wire revision 2026-10-23a) this standard is withdrawn: Teach keeps no known issues, Reach neither fetches nor shows them, reach_known_issues and reach known-issues are gone, and the detectors live on as STD-HEALTH."
  - id: STD-HEALTH
    text: "Since 0.64.0 (wire revision 2026-10-23a, W-HEALTH-1 and W-HEALTH-2) Reach checks its own health on the student's computer with no list from Teach (Reach::Health). The hook and harness code that the known issues shared (hooks_seen.json, prompt_hook_dead?, signin_hook_dead?, course_hooks_untrusted?, require_hooks!, record_hook!, the harness lookup) moved unchanged to Reach::HookLiveness. The checks are codex_sandbox, signin_hook_not_running, hooks_not_running and codex_hooks_untrusted, with the same conditions the known-issue detectors had. reach hello's session context (label hello.issues) names each one that fires in one line with what to tell the student (M-HEALTH-*) and, for codex_sandbox and codex_hooks_untrusted, the reach_setup configure call that fixes it (M-HEALTH-FIX); reach doctor reports the three hook checks as R-DOC-HEALTH findings and leaves the sandbox to R-DOC-CODEX. M-HOOKS-REQUIRED and M-PART-NO-HOOK carry the steps themselves. A hand linked to a Teach issue that carries a student workaround answers it as student_workaround (W-API-HAND-STATUS), and reach_hand_status and reach hand status show it as workaround, at most 600 characters."
  - id: STD-HOOK-HARNESS
    text: "Since 0.21.10 each harness's plugin hooks name their own harness: hooks/reach.hooks.yml passes --harness ${HARNESS}, rplugin renders hooks/hooks.json (Claude Code, sh and ${CLAUDE_PLUGIN_ROOT}) and hooks/codex.json (Codex, ruby and ${PLUGIN_ROOT}, because Windows has no sh; since 0.21.14 rendered from run_by_harness codex in hooks/reach.hooks.yml with rplugin 1.6.5, byte for byte the same command text, so students' trusted hooks stay trusted), and .codex-plugin/plugin.json and the root plugin.json's extensions.com.openai.hooks both point Codex at hooks/codex.json, never hooks/hooks.json. Since 0.21.14 reach.rplugin.yml's MCP server carries by_harness claude-code (sh exe/reach-run, for .mcp.json), so rplugin package reproduces every generated file and rplugin package --check passes."
  - id: STD-TEACH-SUBSCRIBE
    text: "Since 0.22.0 (wire revision 2026-10-03e, W-API-REVISION, W-SAFE-14, Teach 0.30.0) Reach subscribes to Teach by polling one cheap signed probe, so a rebuilt package, a new assignment, a policy change, a grade, a hand reply, extra credit, a receipt or a known issue arrives without the student running reach sync. While a harness session runs, its MCP server starts a detached reach subscribe tick --source session about every 60 seconds (plus up to 15 seconds of jitter), and a user-level operating system job (a systemd user timer, a launchd LaunchAgent or a Task Scheduler task for the current user, never cron and never a stored password) runs reach subscribe tick --source background about every 15 minutes. A tick makes one request, in normal mode with no retries, never more often than once per 50 seconds across every Reach process (state/subscribe.json and state/subscribe.lock under the Reach home); a 304 or an unchanged revision only records the check, a changed revision runs one reach sync in that process under the exclusive state/sync.lock (a tick never waits for it; every interactive sync waits up to 120 seconds) and stores the new parts only after it completes, a 404 waits six hours, a failure backs off from 60 seconds to one hour, and a revoked install removes the job. No hook ever calls the network for this or waits on a tick (STD-HOOK-RESPONSIVE); the prompt hook only reads subscribe.json and, once, adds M-SUBSCRIBE-UPDATES naming what changed so the agent can tell the student in plain words. Every failure is silent to the student and recorded through the debug fault path (STD-TEACH-LINK), except a refusal of a stale signature (STD-SUBSCRIBE-STALE-SIGNATURE). config.yml subscribe.background false, REACH_SUBSCRIBE=0 and REACH_OFFLINE=1 switch it off; reach subscribe status, install and uninstall manage the job, and reach doctor prints R-DOC-SUBSCRIBE, informational only."
  - id: STD-SUBSCRIBE-STALE-SIGNATURE
    text: "Since 0.51.2 a subscribe tick whose GET /api/v1/revision comes back 401 unauthenticated more than 240 seconds after Reach::Client signed it is a stale signature, not a fault. A computer that sleeps between signing and sending, as a Mac does during a background launchd tick, delivers a timestamp past Teach's 300 second window (W-AUTH-4 in specs/wire.yml). Reach::Client stamps RemoteRefused#signature_age_s from the time it signed, and Reach::Subscribe takes the ordinary backoff for such a refusal without recording a subscribe:check fault. The request is never retried (reach.spec.yml never_retry), and the next tick signs afresh. A 401 that arrives sooner is still a fault."
  - id: STD-CODEX-SETUP
    text: "Since 0.31.0 (wire revision 2026-10-04h, W-LIVE-5 and W-KI-1). A Codex project-level .codex/config.toml does not change the sandbox Codex gives a chat, so rEach sets up the student's own user-level Codex configuration ($CODEX_HOME/config.toml) itself, only after the student's yes typed in a terminal (reach codex configure, which the Windows installer runs after setup), captured in a chat through Reach::Consent (reach_setup configure, consent kind codex_setup, kept on the computer) or given to the codex_configure live action. Reach::CodexSetup is the only code that writes that file: a line editor that changes only sandbox_mode, [sandbox_workspace_write] network_access and writable_roots (the reach-work folder) and the folder's [projects] trust_level (mode workspace, the default outside Windows), or sandbox_mode danger-full-access and the trust (mode full, the default on Windows), never narrows an existing danger-full-access, never writes approval_policy, model, features, hooks, marketplaces or mcp_servers, and writes Codex hook trust only as STD-CODEX-HOOK-TRUST describes, refuses (M-CODEX-SETUP-UNSAFE) rather than guess when the file holds a form it does not read, keeps a backup beside the file, writes atomically, and puts the old file back when codex features list rejects only the new one. reach codex status, probe and off, reach_setup status and probe, the sandbox_probe live action and reach doctor's codex line and R-DOC-CODEX report and test the result; the background subscription tick and reach mcp put the settings back at most every 6 hours while the student's yes stands. config.yml codex (setup, sandbox, heal, probe_timeout_s) and REACH_CODEX_SETUP=0 turn it off; a course can turn it off, never on. See codex_setup in reach.spec.yml for the measured facts and what is not verified. Since 0.33.4 the plugin's prompt hook (gate enroll) takes the student's typed yes or no to the codex_setup question itself, on Codex only (a hook event that carries turn_id), for a signed-in session, on a prompt that was not a sign-in step, and for this consent kind only (Reach::CLI.codex_setup_answer, Reach::Consent.observe with kinds); it runs Reach::CodexSetup.follow_up! and returns the result as UserPromptSubmit additionalContext. Before 0.33.4 only a course folder's gate prompt read the answer, and Codex does not run that hook until the folder and the hook are trusted, which is the state this setup exists to fix, so the yes was never taken. Reach::Consent.capture claims the pending question by renaming it, so when the plugin hook and a course-folder hook both see one answer exactly one records it and speaks. reach_setup configure answers M-CODEX-SETUP-TERMINAL only when neither a course-folder hook nor the plugin hook has run for 15 minutes."
  - id: STD-CODEX-HOOK-TRUST
    text: "Since 0.35.6. Codex runs a non-managed hook only when the student's user config.toml holds [hooks.state.\"<key>\"] trusted_hash equal to the hook's current hash; an untrusted or modified hook is skipped without a word. The key is <absolute path of hooks.json>:<event label>:<group index>:<handler index>, and the hash is sha256 over the compact, key-sorted JSON of the normalized handler (event name, matcher where the event keeps one, command, timeout, async). A course folder's .codex/hooks.json is written after the student approved the plugin's hooks, so its hooks were never trusted and never ran. rEach therefore splits the work. Per-session and per-prompt work rides the plugin's two hooks (hooks/codex.json, unchanged byte for byte, so nothing needs approving again): on Codex, in a course folder, the plugin's gate enroll hook runs the course prompt work (Reach::Gate.prompt, once the sign-in is satisfied) and reach hello runs the course session work (Reach::Gate.session). A marker under the Reach state directory (hook_once, pruned after a day) keyed on the session id and the turn id (prompt) or the session id and the start source (session) lets exactly one of the plugin hook and an older trusted course-folder gate prompt or gate session do the work, and the other answers nothing. The plugin's gate enroll run stamps prompt_at on every Codex run, before any gating. Per-tool hooks (PreToolUse write, shell and read, PostToolUse check and transcript code) and Stop stay in the course folder's .codex/hooks.json; Harness.codex_hooks_content no longer writes SessionStart or UserPromptSubmit. Reach::CodexHookTrust computes each handler's key and hash (verified against codex 0.160.0 app-server hooks/list for the root, slice and extracurricular folders) and reads the trust state; Reach::CodexSetup records [hooks.state] trusted_hash for the course hooks.json files rEach manages, under a Codex-settings yes that carries the scope hook-trust-1 (STD-CODEX-SETUP; a yes given before this scope existed covers only the sandbox settings and is asked again), only for a course hooks.json that equals exactly what Harness.codex_hooks_content writes, with the same line editor, backup and refusals, never writing an enabled field, and marking each such course folder ([projects.\"<folder>\"] trust_level trusted, which Codex requires before it reads that folder's hooks.json) with the same editor and rules as the reach-work folder's own trust, in apply, in the reapply (which also runs when trust is stale) and after Harness.configure_codex rewrites a course hooks.json; reach codex off stops it. HookLiveness.course_hooks_untrusted? (Codex only, never while the student's sign-in is pending, unknown never counts) makes Reach::HookLiveness.require_hooks! refuse with M-HOOKS-UNTRUSTED, fires the codex_hooks_untrusted detector, and replaces M-NEXT-LOGIN-NO-HOOK, M-LOGIN-NEEDED-NO-HOOK and M-HOOKS-REQUIRED where it holds; the remedy is codex_configure, never a restart or a new chat. While the sign-in is pending the hooks_not_running and codex_hooks_untrusted detections are not shown to the agent; signin_hook_not_running still is, because it exists for that case. On Windows, hook keys and project paths are matched ignoring case and treating / and \\ alike, and an existing spelling is reused. Since 0.35.9 the Ruby and shim in every command rEach writes into a course folder are deterministic for one rEach home, because a changed command makes Codex see a hook as modified and skip it: Reach::Runtime.ruby_path returns the runtime kit Ruby under the home whenever runtime/current names an installed kit, whichever Ruby the process runs, and otherwise RbConfig.ruby unless that is a kit Ruby outside the home, in which case the same kit id under the current home. reach hello, on every session start of every harness and unless a relocation holds its lock, rewrites with Harness.configure_all (which refreshes the hook trust under the same consent rules) each course folder whose rEach-written commands name a Ruby or shim other than the current ones, leaves matching folders untouched, and emits one fault event (cause stale_ruby_path, repaired count only, no paths). Since 0.35.18 the course folder's shell matcher stays Bash|shell|exec_command: Codex code mode reports a nested exec_command to hooks as Bash and an apply_patch as apply_patch, and its exec and wait tools raise no PreToolUse hook of their own (codex-rs code_mode, 2026-10-05), so adding them would only change the trust hash of every course folder. Since 0.53.25 rEach also approves its own two plugin hooks. Codex (verified against codex 0.163.0 app-server hooks/list) keys a plugin hook as <plugin id>:<path inside the plugin>:<event label>:<group index>:<handler index>, for rEach reach@reach:hooks/codex.json:session_start:0:0 and reach@reach:hooks/codex.json:user_prompt_submit:0:0, and hashes the handler with ${PLUGIN_ROOT} left as written, so one entry stays valid across rEach versions; CodexHookTrust.plugin_keys and plugin_status compute them from Codex's cached copy of hooks/codex.json (the newest under $CODEX_HOME/plugins/cache/*/reach/*/, else the running plugin's own file) and need no [projects] trust. reach setup --harness codex writes them (CodexSetup.trust_plugin_hooks!, same editor, backup and refusals) right after codex plugin add, because installing the plugin is the student's choice to run it, and says so; before, the setup told the student to trust the hooks when Codex asked, and the Codex desktop app on macOS never asked, so on a fresh install the sign-in hook never ran (signin_hook_not_running) and the student was stuck at sign-in with nothing to answer. Every trust plan (apply, reapply, heal and refresh_trust!) includes the two plugin entries under the same hook-trust-1 yes, M-CODEX-SETUP-CHANGES-WORKSPACE and -FULL name them, and HookLiveness.course_hooks_untrusted? is true while the sign-in hook is dead (signin_hook_dead?) and the plugin hooks are untrusted, even with the sign-in pending, so an already installed student is sent to reach_setup configure (M-HOOKS-UNTRUSTED) instead of a restart that changes nothing."
  - id: STD-MESSAGES-LOADED
    text: "Since 0.35.19. A tool call never fails because a message file cannot be read. The tool bridge (reach mcp) reads locales/en-US.yml and locales/greetings.en-US.yml once when it starts and keeps them in memory, because an update's swap, a harness refreshing its plugin copy or a relocation can move or remove the plugin folder a running bridge was started from. Any other process that finds no file under its own locales/ reads the one in the managed install (Reach::Messages.locale_file). The bridge's fault replies never raise: with no catalogue at all they answer \"reach: internal error\" and the bridge keeps serving."
  - id: STD-FIGURES
    text: "docs/assets/figures/ holds ten system figures, each as <slug>-light.svg and <slug>-dark.svg, drawn by tools/figures/build.rb (Ruby standard library only) from tools/figures/figures/*.rb with the palettes and primitives of tools/figures/kit.rb; a figure names a tone, never a color, so the two variants cannot drift. The SVGs are committed with their source. docs/architecture.md shows them with a picture element that follows the reader's color scheme, and README.md shows figure 1. build.rb --png renders each SVG 3840 pixels wide with headless Chrome into docs/assets/figures/png/, which git ignores: the PNGs are published only as assets of the GitHub pre-release tagged figures-1, whose tag Reach::Update ignores (VERSION_TAG accepts only vN.N.N and pre-releases are skipped), so no clone, install or update carries them. Nothing checks a figure's wording against the code; it is prose, kept true by hand."
  - id: STD-TEACH-OPAQUE
    text: "Teach is private. docs/*.md, README.md and every figure describe Teach only by outcomes this repository already publishes in README.md, PRIVACY.md or specs/wire.yml (it checks the roster, seals and signs packages, runs hidden checks, signs receipts, answers hands), and name no Teach class, database table or column, environment variable, file path or command-line verb. A figure draws Teach as the frosted block of Figures::Canvas#frost. The same holds for AGENTS.md, CHANGELOG.md, FEATURES.md, TODO.md, this file and specs/implementation/: a build blueprint that directs work on Teach is kept in the private superproject, never here. specs/wire.yml, reach.spec.yml, lib/, tools/fake_teach and tools/smoke are outside this standard: they are the protocol, the program and its test tooling and name what the wire needs. Since 0.34.2 build blueprints and design drafts are not in this repository at all (specs/implementation/ and docs/course-alignment-design.md moved to the private superproject), .rproject/ notes are untracked, and the repository's whole history, every tag and branch, was rewritten on 2026-10-05 to remove them and to redact Teach internals and the maintainer's machine layout from every other file this standard covers; the GitHub release notes were redacted the same way. Since 0.40.1 specs/release_gate.yml is covered too: it names Teach only as the course server, and its machine tables name a Teach path only where it is the pinned copy of a rEach file or the Teach twin of a rEach version home. Nothing enforces this standard mechanically."
  - id: STD-NO-INSTITUTION
    text: "Since 0.38.2 this repository names no institution: no school name, email domain or school-specific identity scheme appears in any tracked file. Examples and the fake Teach fixtures use the reserved domain school.example and the name Example University, and since 0.38.4 the example courses are BUS 101 and BUS 201 (the fake Teach course is Business 101: Demo Course) rather than real course numbers; since 0.38.3 their identity rules are generic (username ^[a-z][a-z0-9._-]{1,31}$, student ID ^[0-9]{5,10}$) and their fictional students have first-initial-and-surname usernames and eight-digit IDs, and no document records an identity used to verify against live Teach. A student learns their institution only from Teach, through the identity rules of W-API-ENROLL-PREVIEW, and the enrollment messages read correctly for any institution name (M-ENR-USERNAME-FORMAT and M-ENR-ID-FORMAT say your {institution}). The security audit scan (tools/security_audit/scan.rb) treats any address at an .edu domain as student data. Nothing else enforces this standard mechanically."
  - id: STD-PROGRESS
    text: "Since 0.24.0 (wire revision 2026-10-03h, W-API-PROGRESS, Teach 0.35.0) Reach records the first time the student reaches a checkpoint only Reach can see and reports it to Teach, so an instructor sees where each student stands. Reach::Progress (lib/reach/progress.rb) keeps state/progress.json with the checkpoint ids and their first times: enroll.code when the course passkey is accepted and enroll.identity when the student confirms their email and student ID (both in the chat enrollment and in reach enroll), setup.signin at the first confirmed sign-in, and <assignment>.started at the first prompt the gate lets through inside a workspace of that assignment. A mark is first-write-wins, never raises into a hook and makes no network call: reach sync (Reach::Progress.flush!, beside the outbox retry) sends the marks not yet sent, at most 64 in one signed request, and records them as sent on a 200 or a refusal and keeps them when Teach cannot be reached; nothing enters the outbox, so reach doctor's outbox check is unaffected. The two enrollment marks made before an install exists wait in the file and go out with the sync that follows registration. A report carries checkpoint ids and times only, never typed text. A new enrollment after an earlier one starts the record afresh. REACH_PROGRESS=0 stops recording and sending. Since 0.35.22 <assignment>.started is also marked whenever Reach::Ledger.append records anything for a slice (a plan, a written answer, a check, a checkpoint), because a Codex chat runs from the course root and its prompts never pass inside a slice workspace, so the mark was never made; and Reach::Progress.flush! backfills it before sending from the first record of each current slice's ledger written for the enrolled student, at that record's time (a ledger that cannot be read skips only its slice; the record's HMAC tag is not checked, so the reported time is no more tamper-evident than state/progress.json itself), so a student who had already started is reported at the next sync. No Teach change."
  - id: STD-ANNOUNCEMENTS
    text: "Since 0.30.0 (wire revision 2026-10-04g, W-API-ANNOUNCEMENTS, W-API-ANNOUNCEMENT-RECEIPTS, W-SAFE-16) the instructors can send the student an announcement and Reach keeps it in a dated queue. Reach::Announcements (lib/reach/announcements.rb) replaces state/announcements.json with the list Teach answers on reach sync, keeping for each announcement the time it was first received and first shown; an announcement Teach no longer lists leaves the queue. The prompt hook (Reach::Gate) shows each announcement once, word for word, with M-ANNOUNCE-NOTICE, at most three per prompt and oldest first, marks it shown and starts one detached reach announcements flush, which reports the received and shown times; reach sync reports them too. The hook itself makes no network call. reach announcements [list] and the reach_announcements tool list the queue newest first (M-ANNOUNCE-LINE, M-ANNOUNCE-NONE), and --format json prints it as data. A Teach without the routes answers 404 and Reach asks again no sooner than six hours later; a 503 leaves the queue as it is. config.yml announcements.show false stops the display at the prompt and leaves the queue and its commands working. An announcement is text from the instructors: Reach never treats it as an instruction to the agent beyond telling the student, and it changes no gate, grade or due time. Since 0.37.0, with agent_control.render on (STD-AGENT-CONTROL), each announcement reaches the agent in a fixed announcement frame that says when it was sent (day, date, time and zone), that relative words such as today refer to that day, and that it is information that never stops the agent from helping; the student sees the text word for word as before. An announcement may carry a show_until time: one not yet shown when that time passes is never shown at the prompt, and reach announcements and reach_announcements still list it, marked with M-ANNOUNCE-LINE-EXPIRED, which ends in (shown until, then the time)."
  - id: STD-DUE-CHANGE
    text: "Since 0.30.0 Reach tells the student when an assignment's due time moved. Reach::DueChanges (lib/reach/due_changes.rb) keeps, in state/due_changes.json, the due time it last saw for each assignment id in status.current_assignment; when reach sync stores a status whose due differs from the one seen for the same assignment, it queues one notice with the earlier and the new time, and the prompt hook shows it once with M-DUE-CHANGED. The first due time seen for an assignment queues nothing. Reach holds no due time of its own: every due time it states comes from the status Teach answered (wire W-API-STATUS)."
  - id: STD-HOLDINGS
    text: "Since 0.30.0 (wire revision 2026-10-04g, W-API-HOLDINGS, W-SAFE-16) Reach tells Teach which copy of the course material it holds, so the instructors can see that an update arrived. Reach::Holdings (lib/reach/holdings.rb) reports, after reach sync has stored its packages, the version and content digest of the stored guardrails package and the file name and SHA-256 of each stored encrypted reference blob. It sends names and digests of material Teach delivered and nothing else: no file, no path on the student's computer, nothing the student wrote. It reports only when the list differs from the one last reported, never from a hook, and a failure is a sync warning, not a sync failure. A Teach without the route answers 404 and Reach waits six hours."
  - id: STD-COURSE-PROFILE
    text: "Since 0.33.0 (wire revision 2026-10-04j, W-POL-2) Reach takes the facts of one course from that course, not from this repository. Reach::CourseProfile (lib/reach/course_profile.rb) reads the profile section of the verified guardrails package's course.yml, cached per package version. Learning system: Reach::Archive.lms_name is the profile's submission.lms_name (a local config.yml submit.lms_name is still read when a profile names none) and may be nothing; the upload-for-credit sentences (M-LMS-UPLOAD-ZIP, M-LMS-UPLOAD-THAT, M-LMS-UPLOAD-WORK) are added to the submission messages only when the course requires the upload, and M-LMS-RECORD to the grade messages only when a learning system is named. Enrollment: the shipped config.yml carries no institution name, email domain or patterns; Reach::Identity.rules holds only what the enrollment preview answered, plus its hints; with no pattern any email address and any student ID are accepted for Teach to judge, with no institution name Reach says 'school' (M-ENR-SCHOOL), and the passkey example names no course. Time: with no zone from the install, the package or a local config.yml, times are shown in UTC and labeled UTC; America/Los_Angeles keeps its built-in daylight rules. Wellbeing: Reach::Login.crisis_match? uses the profile's phrases when the course sends any and the built-in list otherwise, and Reach::Support shows the profile's support text in place of the built-in message when the course sends one; detection is never off. This standard supersedes the Pacific default and the Blackboard default named in earlier standards. The profile's terms and slices sections are not read yet."
  - id: STD-SECURITY-AUDIT-MODE
    text: "Since 0.34.0 a maintainer's clone can audit a release before it leaves the computer: tools/security_audit/install sets core.hooksPath to .githooks, and .githooks/pre-push runs tools/security_audit/gate.rb, which acts only on a push to the project's GitHub remote that carries a release (any refs/tags/v* ref, or a branch update whose VERSION file changed; deletions are ignored) and otherwise exits 0 without output. This is a maintainer tool: nothing under lib/, exe/, hooks/ or skills/ changes and no student install runs it. The gate reaches Teach at TEACH_URL, or at config.yml teach.url when TEACH_URL is unset, and reads its settings there with a scoped service token (5 s timeout, two jittered retries, a 0600 cache at ~/.local/state/reach-security-audit/config.json, built-in defaults when neither answers; Teach being unreachable never turns the gate off). It computes a base (the newest v* tag before the pushed commit, or the empty tree for whole_tree), runs a deterministic scan over the added lines (secret shapes, secret-bearing file names, student identifiers matched against salted HMAC digests of the roster with no plaintext identifier on the wire, student-style addresses, high-entropy strings, absolute home paths; matched values are masked to their first and last 2 characters), then runs one headless read-only claude -p audit (Read, Grep, Glob only, --strict-mcp-config, --setting-sources empty, --no-session-persistence, --max-budget-usd unless token-open) using tools/security_audit/prompt.md. The decision follows the mode, block_at and on_error settings: gate blocks (exit 1) on a scan or audit finding at or above block_at, report_only never blocks, and an audit failure follows on_error. The verdict is cached by tree, base and settings digest so the tag push after the branch push reuses it. Outputs: a masked report at ~/.local/state/reach-security-audit/reports/, a stderr summary, a desktop notification, a run POSTed to Teach with an Idempotency-Key (failed posts wait in an outbox and go with the next run), and best-effort rLogs events (component reach, process_role security_audit). REACH_SECURITY_AUDIT=0 skips the audit and posts a skipped run. The gate runs on the computer's own Ruby 2.6.10 or newer with the standard library only. Since 0.40.0 the hook runs tools/release_gate/gate.rb (STD-RELEASE-GATE), which wraps this audit with the broken-state checks of specs/release_gate.yml, blocks at high by default, ignores REACH_SECURITY_AUDIT=0 and lets only the instructor's recorded override through. Since 0.64.6 the high-entropy rule judges the part of a quoted value that follows a leading environment-variable reference and a slash (${NAME}/ or $NAME/), so a hook command that runs ${CLAUDE_PLUGIN_ROOT}/exe/reach-run is not read as a generated secret; since 0.64.3 those commands in this spec blocked every branch with three high findings and kept the model audit from running. A long random tail after such a prefix, and every value without one, is still judged at 4.5 bits per character (tools/security_audit/scan.rb, ENV_REFERENCE). specs/release_gate.yml, whose copy Teach pins, is unchanged: its entry still calls a high-entropy quoted string high."
  - id: STD-RELEASE-GATE
    text: "Since 0.40.0 a release push (a tag v*, or a branch whose VERSION changes) passes tools/release_gate/gate.rb, run by .githooks/pre-push and installed by tools/release_gate/install, in rEach and in Teach alike. specs/release_gate.yml is the shared contract: it names every check with what it reads, what it calls broken, its severity and how it clears, the severity scale critical, high, medium, low and info, the default block_at high, the environment the hook reads and the pinned copies Teach carries. The checks are the security scan and audit, CMP-WIRE-LIVE (the release's wire digest against the live Teach), CMP-WIRE-MAIN, CMP-PIN (pinned copies against their owner, for rEach the wire Teach main pins and the bundled agent-control.yml against Teach main), CMP-INSTALLS, VER-COLLISION (another branch, worktree or remote tag claims the version), VER-HOMES (VERSION against its eight homes and the tag name), VER-TAG-RELEASE (a tag without a GitHub release), VER-DEMOTE (a tag older than Latest), VER-STABLE (stable away from Latest without a hold), KNOWN-ALARM, KNOWN-ISSUE, KNOWN-DOCTOR, KNOWN-BACKUP, INST-FLAP, INST-STALE, GATE-FACTS and GATE-SPEC. A check that cannot run says so; in the critical class that blocks. Every run is recorded on Teach and in ~/.local/state/release-gate/reach/reports; the gate's events go to rLogs. There is no skip switch: REACH_SECURITY_AUDIT=0 is ignored, and the only way past a block is the instructor's override, typed on a terminal as 'override reach' with a reason of 10 to 500 characters and an expiry of 1 to 24 hours, recorded on Teach with user, host and terminal, alarmed until one push consumes it. ruby tools/release_gate/gate.rb check [--ref REF] [--tag vX.Y.Z] is the dry run; hold stable records why stable stays behind Latest. reach doctor reports R-DOC-GATE when a clone that pushes over SSH has no gate installed. Since 0.40.1 specs/release_gate.yml is the outcome-level contract: it keeps the tables the gate code reads (version homes, pinned paths, check ids, parts, repositories, classes and severities) and describes Teach only as the course server that answers facts, records runs and overrides and raises alarms; Teach's schedule, settings, alarm names, routes, scopes, port and commands for these checks are in the private superproject's copy of the contract (STD-TEACH-OPAQUE). Since 0.47.1 INST-FLAP, like KNOWN-ALARM, skips the gate's own release_gate:* and release_gate_override:* alarms, so blocked runs never keep the gate blocked. Since 0.47.2 check --as-push exits as the push would, zero when an active lease or a covering override would let it through, without consuming the override; the Polispec promotion gate G-GATE runs it, so the instructor's override reaches a promotion and the promotion's own push consumes it. Since 0.51.5 (wire 2026-10-13a, W-COMPAT-6) an install older than the reference release is owed only its update path: CMP-INSTALLS still reports it below minimum_reach_version, but no longer compares its wire digest, and lists it as info."
  - id: STD-RELEASE-GATE-LEASE
    text: "Since 0.46.0 a time-boxed lease is the second way through a release-gate block (specs/release_gate.yml lease). tools/release_gate/lease.rb (Ruby standard library only) reads the lease source file named by RELEASE_GATE_LEASE_SOURCE or ~/.config/release-gate/lease_source.yml; with no file, an unreadable one or a url that is not http or https there is no lease source and the gate behaves as before. On a recording run that would end blocked or error, the gate asks GET <url>?repo=<repo> with 2 s timeouts and counts only a 200 answer whose lease id is gtl_ plus 20 hexadecimal characters, whose repos include the repository, and whose granted_at is not after and expires_at is after the gate's clock, at most 24 hours apart; anything else is no lease. A leased run still runs every check, is recorded with status leased and the lease id, exits 0, and consumes no override. A dry run says whether a lease would apply and records nothing. This is a maintainer tool: nothing under lib/, exe/, hooks/ or skills/ changes and no student install runs it."
  - id: STD-ISSUE-CLOSEOUT-HOOK
    text: "Since 0.45.0 a maintainer's clone can name the open course-server issues a commit fixes: tools/release_gate/install also enables .githooks/commit-msg, which runs tools/release_gate/closeout.rb (Ruby standard library only, built on ReleaseGate::Repo for the repository name, the release-gate token and the course server address) on every commit message. It sends the course server the repository, the subject, the message without comment lines, the branch name and at most 200 staged path names, never diff content, and the server answers the issues the commit matches: those it matches on identity evidence (the issue id, the issue's branch or its ship subject) become a Fixes-Issue trailer, and up to three likelier candidates become Probably-Fixes trailers, which never change an issue's state. The hook adds a trailer with git interpret-trailers only when the id is not already in the message, prints one stderr line per trailer added and is silent otherwise. It never blocks a commit and always exits 0: it skips a merge in progress, a fixup!, squash! or amend! subject, a clone with no token or no course server address, and any request that fails (3 s timeouts, two attempts with jittered backoff, no retry on a client error). CLOSEOUT_DISABLE=1 or git config closeout.enabled false switches it off. This is a maintainer tool: nothing under lib/, exe/, hooks/ or skills/ changes and no student install runs it."
  - id: STD-COMPAT-ACCEPTS
    text: "Since 0.40.0 (wire 2026-10-06d, W-COMPAT-ACCEPTS) Reach::Compat reads accepts {hand_triggers, debug_kinds, harnesses} from the cached status or enroll answer: a typed hand goes typed when its trigger is listed, a typed debug kind when listed, a harness name when listed, and otherwise as before when the whole wire digest matches. An issue hand is built and sent whenever issues are enabled; when the Teach answered without accepts and its digest differs, the hand goes degraded with capsule null, so a fault on a drifted install still reaches Teach instead of going silent (brief M5, 2026-10-06)."
  - id: STD-STUDENT-TREE
    text: "Since 0.34.1 a student install carries no developer material that names a Teach address. .gitattributes marks .githooks/, .github/, assets/ (since 0.38.5, the logo artwork), tools/, docs/smoke-assignment-1.md, docs/deploy-and-test.md and figure 08 (deployment topology, which draws the local fixture address) export-ignore, so GitHub's branch and tag archives, which the installer (main.zip) and reach update (refs/tags/vN.N.N.zip) download, leave them out, and an update's swap removes them from an existing install. A marketplace added from the repository link clones the whole tree, so no tracked file outside CHANGELOG.md names the live Teach's port: tools/smoke/slice_build.rb reads it from the Teach source it builds and refuses to run when it cannot, docs and blueprints write a placeholder, and the security audit gate defaults to config.yml teach.url. AGENTS.md, which every harness reads first, says the course server is only what reach reports and that docs/, specs/ and tools/ are never a source of an address or a port. The local fixture tools/fake_teach and the smoke tools still bind 127.0.0.1 in a clone; that is test tooling starting its own server. Nothing checks the archive contents mechanically; the release check is a search of the downloaded archive."
  - id: STD-KIT-LOCK-MATCH
    text: "Since 0.35.18 the runtime kit matches a qualify kit's Gemfile.lock to a prebuilt gem profile by content with line endings normalized: a profile is used when its lock_sha256 equals the SHA-256 of the lock in its LF or its CRLF form, so a kit built from a CRLF checkout (the Windows build) matches the LF lock Teach ships. runtime/package.rb hashes and bundles the LF form, .gitattributes pins runtime/locks/** to eol=lf, and a failed fallback bundle install names the gem that failed. Since 0.35.22 an installed kit whose gem folder is not named by the manifest's lock hash (the r3 Windows kit: folder gems/425419d6dd75, the CRLF hash, while the manifest and .complete carry the LF hash aa2ee347cf56) uses the folder the kit's own BUILD.json names for the profile of the same name (lock12, else lock_sha256, used only when it starts with 12 hex digits), so gems_for finds it and qualify no longer falls back to a bundle install that compiles ffi; matching also accepts the lock's raw bytes. Since 0.47.3 (security audit F09) Reach no longer selects Gemfile.ruby26.lock: the local suite needs Ruby 3.2 or newer or the runtime kit and otherwise refuses with M-QUALIFY-NORUNTIME, and the repository's Gemfile.lock selects rack 2.2.24 and nokogiri 1.19.4. Since 0.56.17 a kit profile is also used when the qualify kit's Gemfile.lock matches no profile by digest but its Gemfile is identical and its source lock differs only in line endings or the PLATFORMS section (Reach::Suite.profile_covering). The source lock must match the digest recorded by the kit; the installed Windows lock may add native platform gem entries and checksums. Sources, dependency requirements, resolved versions, and checksums must match; a patch-version difference does not qualify. profile_ready? waits 180 s for bundle check and keeps its first error line; on Windows Reach never runs bundle install (it could only compile, and ffi 1.16.3 has no prebuilt gem for Ruby 4.0 there): it refuses with the reason the prebuilt gems were not used and the command to reinstall them, and a bundle install that fails on a native extension anywhere names the gem and says it needs a compiler this computer does not have."
  - id: STD-REQUEST-LOG
    text: "Since 0.35.18 Reach's request log (logs/requests.jsonl and its rotations) holds method, route with every query value replaced by [redacted], status, latency and retries, never a passkey, secret, password or token; each install scrubs its older lines once (marker state/requests-log-scrubbed.json). Since 0.52.3 it holds no request to /api/v1/feedback and nothing made while Reach::Debug.silently holds (W-SAFE-7)."
  - id: STD-CLI-HELP
    text: "Since 0.35.18 reach <verb> --help and -h print that verb's usage and exit 0 for every verb, before any enrollment, sign-in or workspace check; reach help prints the whole list."
  - id: STD-AGENT-CONTROL
    text: "Since 0.37.0 (config.yml agent_control.render) the text rEach puts in the agent's context is rendered from one bundled document, agent-control/agent-control.yml, pinned by agent-control/agent-control.yml.sha256: Reach::AgentControl (lib/reach/agent_control.rb) uses the bundled copy only while its SHA-256 equals the pinned digest, and uses the copy delivered inside the course guardrails package (vault/agent-control.yml) when that copy is valid and its version is not older than the bundled one; a copy that cannot be read, fails the schema or is older is refused and the bundled one stays in use. Every block rEach injects, in the session context, at the prompt and tool hooks, in the tool bridge and in the generated rules files, goes through Reach::AgentControl.channel under a channel id fixed in code; the document declares each channel's tier and frame, and reach doctor (R-DOC-AGENT-CONTROL) checks that it declares exactly the channels rEach uses, the six tiers, the eight frames and a precedence block of five lines. The first block of each context from the session, gate and notice channels is the precedence block, the order of authority, and the generated rules files open with it as well; each block is wrapped in its frame, which states what the text is and how far it binds. On any error, with the flag off, or with no usable document, the raw text is used unchanged, so a broken document never stops a student's work. A control or test frame states when it ends. Student-visible text is unchanged by rendering."
  - id: STD-CONTROLS
    text: "Since 0.37.0 (config.yml agent_control.controls) Reach::Controls (lib/reach/controls.rb) enforces in code the course controls the instructors set, never by asking the agent to obey. reach sync fetches them into state/controls.json with the server's time offset, so a skewed computer clock changes nothing; a control applies between its start and end by server time. A pause blocks prompts and tool calls (write, shell, read and web) in a slice and in the workspace root with M-CONTROL-PAUSED and leaves the student's extracurricular folder and reach support working. A hold blocks reach submit only, with M-CONTROL-HOLD; reach qualify, checks and all other work continue. While a test control is open and the student has an open attempt, the test lockdown allows only the tools listed in controls.test.allowed_tools of agent-control.yml (reach_test, reach_support and reach_status by default) and refuses every other tool call, in the hooks and in the tool bridge, with M-CONTROL-TEST-LOCKED. A server without the controls answers 404 and Reach asks again no sooner than six hours later; a 503 clears the held controls. No environment variable and no config.yml key lifts a control that is in force."
  - id: STD-TEST-MODE
    text: "Since 0.37.0 (config.yml agent_control.test_mode) an instructor can set a timed test, and Reach::ExamMode (lib/reach/exam_mode.rb, state/exam.json; the student's word is test) runs it through reach test [status | open | questions | record QUESTION | submit] and the reach_test tool. Opening the test starts one attempt on the server, which sets its deadline, and shows the questions word for word; the attempt ends at the deadline whether or not it was submitted. The student answers each question in their own message, and reach test record takes only the student's own captured prompt, at most thirty minutes old and never one typed before the attempt opened, never text the agent wrote; answers are append-only. reach test submit ends the attempt and says how many questions were answered. During the attempt the agent may clarify the wording of a question and nothing else, and the lockdown of STD-CONTROLS applies. A server without the routes answers 404 and Reach asks again no sooner than six hours later."

  - id: STD-INTERVIEW-ONCE
    text: "Since 0.51.10 the first-run interview greeting (G-FIRST-RUN) is handed out once per install, kept in state/interview.json with the session it went to, and again only in that session or, when no session id is known, within two minutes; a resume greeting (G-RESUME, G-RESUME-NONAME) once for each saved partial profile; neither for a profile whose status is skipped, which reach profile save --status skipped and reach_profile_save write when the student skips the interview or picks their work. After an offer has passed the session context says the interview was already offered, so the agent starts or resumes it only when the student asks. A student who answered or skipped the interview never meets it again, in any app or folder."
  - id: STD-NO-SLICE-MESSAGE
    text: "Since 0.51.10 a course with no slice workspace on this computer yet is refused with M-GATE-NOSLICE (the prompt gate's check_has_workspace!, the CLI's slice lookups and the MCP slice tools), and an MCP slice argument that names no slice with M-GATE-NOSLICE-NAMED listing the slices; M-GATE-NOGUARD is kept for a guardrails package that is missing. An MCP slice argument, and the --slice of every reach command (submit and hand raise included), matches a folder name exactly (or with spaces and slashes as dashes) or, when exactly one folder ends in -<name>, by its slice name; a name that matches two or more slices gets M-PICK-SLICE and one that matches none M-GATE-NOSLICE-NAMED, both listing the slices. reach_check, reach_checkpoint, reach_plan, reach_shape_check and reach_part take that slice argument, so a Codex chat at the course root with two or more slices can work on each without opening its folder; M-PICK-SLICE, the root rules and reach work without a terminal (M-WORK-HERE, M-WORK-CODEX-PROJECT) say so."
  - id: STD-ASSIGNMENT-CONTEXT
    text: "Since 0.54.3 every new chat starts from the student's durable assignment state, never from the chat. Reach::Threads (lib/reach/threads.rb, state/threads.json, flock on threads.json.lock) records each chat by session id and harness (started, last seen, assignment, phase, material digest, required reads and reads), keeps at most parameters.assignment_context.max_threads, and maps the active chat per harness. Reach::AssignmentContext (lib/reach/assignment_context.rb) takes the assignment from the slice workspace or the cached status and the phase from reach next (start, plan, part, build, submit, wait, review, done). reach hello states the assignment and phase, compares them with the last chat in any harness (assignment or phase moved, new course-server results, course material changed), names the phase directives from behavior.yml parameters.assignment_context.phases, and names the reference files tagged for that assignment (reach.reference/v1 file keys assignments, phases and kind, set in the AIvoryTower release manifest and carried by Teach's pack), falling back to a file whose title or path names the assignment. reach reference show and the reach_reference tool record the read path, never its text, against the chat named by CLAUDE_CODE_SESSION_ID or CODEX_THREAD_ID, else the harness's active chat. The prompt gate reminds the agent (notice.next) until every required file is read, and a compacted chat must read them again. Material text never enters hook context. REACH_ASSIGNMENT_CONTEXT=0 turns it all off. Since 0.54.4 state/threads.json is written owner-only (0600), and a reference file whose path holds a backtick or control character or runs past 200 characters is not named, and a title is cut to one line of at most 120 characters without backticks, so a bad manifest entry cannot break the message. No wire change."
  - id: STD-GATE-REPLACED
    text: "Since 0.54.6 (wire revision 2026-10-20b, W-ENR-8) a copy of rEach that Teach switched off because the student enrolled again is told so. Teach answers its requests 403 revoked with details {reason: replaced, revoked_at, replacement: {harness, platform, enrolled_at}}; Reach::Enroll.mark_revoked! keeps the reason and the replacement in the install record, Reach::EnrollmentLock reports the lock reason replaced, and every surface that shows the lock (the prompt hook, the enrollment flow's first message, reach sync, the CLI gate and the MCP bridge) shows M-GATE-REPLACED: the newest enrollment stays on, the course work continues in that copy, and to work on this computer the student enrolls here again with the course passkey; where the replacement is known the message adds M-GATE-REPLACED-WHERE with the harness in plain words (the Claude app, Codex in a terminal) and the day. A revoke by an instructor (details.reason instructor or unenrolled) and a 403 with no details, from a Teach older than this revision, keep M-GATE-REVOKED. Verified 2026-10-20 in a scratch home: the replaced details lock as replaced with both sentences, an instructor revoke and a detail-less revoke lock as revoked, and the enrollment flow starts over from M-GATE-REPLACED."
  - id: STD-BRAND-IDENTITY
    text: "rEach uses an adult, restrained cosmic identity: docs/assets/reach-logo.svg is a legible four-point AI sparkle constellation, with no fingers. docs/assets/reach-banner.svg carries realistic adult forearms and hands approaching a luminous connection in a deep cosmos, inspired by The Creation of Adam. The SVG is self-contained, with no remote fonts or image dependencies. Consumers use the same shared sparkle silhouette. Artwork provenance is recorded in docs/assets/provenance.json. Since 0.38.5 the rEach logo is the wordmark in assets/logo/: reach-logo-blue.png for light backgrounds and reach-logo-white.png for dark ones (transparent PNGs), and five hands pictures (a human hand and a robotic hand reaching toward each other across dark stone) carry it at the bottom center, bottom right or top left, in white or blue. README.md opens with reach-hands-white-bottom-center.png. The maintainer generated them with AI image generation (no third-party stock images); the files are the maintainer's PNGs recompressed losslessly, pixel for pixel the same. reach-logo.svg and reach-banner.svg stay in docs/assets/ for their existing consumers."

polispec:
  since: 0.47.0
  engineering_source: specs/polispec/behavior.yml (polispec.behavior/v2)
  runtime_artifact: policy/behavior.json (polispec.behavior.compiled/v2)
  authoring: ruby tools/policy.rb build; ruby tools/policy.rb check
  diagnosis: reach policy --json reports authorities, digests, enforcement modes, and projection drift without private bodies.
  authorities:
    application: The released package owns engineering directives, fallback settings, and the native binding inventory.
    course: Teach owns course directives, assignment scope, and binding settings; existing authenticated guardrails are normalized locally.
    control: Teach owns its pinned agent-control contract and runtime control state; student settings do not become a policy document.
  enforcement: Four deny-only control predicates consume native facts; shell parsing, file ownership, qualification, deadlines, and submission remain native bindings.
  advisory: Prompt instructions remain advisory wherever no code enforces them; a binding inventory does not prove every sentence is enforced.
  course_bindings: Since 0.54.7 Reach::BehaviorPolicy.course_rule maps a course directive's enforce label to the native guard that enforces it, the same way the public tier does (gate:write and gate:shell to the write and shell gates, gate:read to Reach::Gate.read, check:* and hook:shape to Reach::Check.run, ledger to Reach::Ledger.append, hook:login to Reach::Gate.require_login!, hook:part to Reach::Submit.require_part!). Any other label stays advisory, so reach policy reports a course directive native only when code enforces it.
  surfaces: "Since 0.62.0 specs/polispec/behavior.yml is polispec.behavior/v2 and is the one source of every rule rEach puts in an agent's context. Each rule has one canonical directive; the persona (agents/reach.md, skills/reach-assistant/SKILL.md), every skills/reach-*/SKILL.md, rules/reach.md, agent-control/agent-control.yml, the workspace rules files, the wrapper messages (TOOLS-RULE, WAIT-RULE, EXTRA-RULE-1..5) and this repository's AGENTS.md are surfaces rendered from it, and tools/policy.rb check fails on drift or on a sentence that restates a directive without naming it (polispec behavior drift and lint). policy/behavior.json carries each surface's sha256, so the runtime persona check needs no polispec. The guardrails package carries Teach's course_policy.json (wire 2026-10-22c) beside the legacy directives.yml, and Reach reads it when present. SessionStart prints every directive row once; a hook (SessionStart, prompt, and the claude-code tool hook) injects a directive's full body once per session when its when condition matches (Reach::BehaviorPolicy.when_matches?, a port of Polispec::Surfaces.when_matches?), at most directive_injection.max_bodies bodies and max_bytes per event, private bodies through the authenticated reach directive route. harness.rules_file auto (default) | stub | full chooses per workspace file: the stub (rows and a pointer) where that harness's hooks have run on this install, the full rules file otherwise, so Antigravity and hookless Codex get the full text."
  packaging: Public Markdown directives derive from the source. Doctor and the pre-push gate check their content, compiled digest, native guard inventory, and pinned control baseline.
  recovery: An invalid installed policy refuses governed writes with M-POLICY-INVALID; doctor, policy inspection, reinstall, update, and instructor support remain available.
  compatibility: Ruby 2.6 compatible and offline; no new student dependency, service, model call, or runtime rStack wire.
  development: specs/polispec/policy.yml and roster.yml govern main, test, and stable when the host ledger is activated.
  stable: The readiness workflow smokes the planned immutable commit and verifies it still matches test; only the operator promotes stable through Polispec.
heal:
  doctor: null
  test: null
  build: null
  version_files: [VERSION, specs/app.yml, reach.rplugin.yml, reach.spec.yml, reach.rstack_component.yml]
  hooks: [commit-msg, pre-push]
  push:
    remote: origin
    branch: main
    recipe: Push one exact commit (git push origin <sha>:refs/heads/main). The pre-push release gate needs a lease or an operator override per version. Move test only with polispec promote reach --to test, which creates the version tag.
  envs:
    dev:
      ready_when: ["rplugin check reach", "rplugin doctor reach", "ruby tools/policy.rb check"]
      deploy: null
      live: false
    test:
      ready_when: ["ruby tools/platform_smoke/run.rb --leg test"]
      deploy: polispec promote reach --to test
      live: false
    prod:
      ready_when: ["operator: ruby tools/platform_smoke/run.rb --leg stable"]
      deploy: "operator: polispec promote reach --to stable"
      live: true
