schema_version: 1
name: reach
version: 0.64.6
security_validation:
  contract: specs/security-validation.yml
  phase: Required before student enrollment; the current harness walks the isolated practice assignment to a verified Teach receipt.
  isolation: Since 0.64.1 the child process that runs the practice Check and Checkpoint gets its own REACH_HOME, REACH_WORKSPACE_ROOT and REACH_CHECKPOINT_MIRROR under the session's validation directory, so the practice save never lands in the student's checkpoint mirror.
  observability: Existing gate events carry check security_validation and the phase or blocked outcome through Reach's Debug port.
kind: plugin
purpose: >
  The student's side of the course software. A harness plugin that installs
  from its repository link into Claude Code, Claude Cowork, Codex,
  Antigravity or Hermes (and through rplugin when present) and turns the student's own
  AI agent into rEach, a bounded course partner: it greets the student and
  runs a short interview saved on their computer only, enrolls with Teach (refusing all input until
  the student enrolls with the class-wide course passkey, their institutional username and student ID),
  receives the student's
  protected materials, refuses to let the agent work until the instructors'
  guardrails are installed, keeps the agent inside the student's slice,
  checks every change against the Dovetail shape, has the agent prove each
  slice with scenarios of its own before submitting (reach qualify, locally
  and on Teach), submits work and waits for Teach's receipt, and raises a
  hand to the instructors by itself after three failed qualifications.
blueprint: The full design is in reach.spec.yml (schema reach.spec/v1) at the project root.
wire_contract: specs/wire.yml (Teach-Reach protocol 1; teach carries a byte-identical pinned copy)
implementation_blueprint: kept in the private superproject, outside the student plugin (STD-TEACH-OPAQUE)
runtime:
  ruby: "2.6.10 to 4.0.x, standard library only, no native gems"
  sdk: "optional: rplugin (Ruby 3.3+) is loaded when present; otherwise Reach runs standalone from a harness's own plugin copy"
harnesses:
  - claude-code (terminal, desktop Code tab, VS Code) and Claude Cowork, from .claude-plugin/
  - codex (CLI, IDE, desktop app), from .codex-plugin/ and .agents/plugins/marketplace.json
  - antigravity (the Gemini harness), from plugin.json, rules/ and skills/ through reach setup
  - hermes (Nous Research's Hermes Agent CLI), through a dedicated Hermes profile named reach that reach setup creates and reach work launches
depends_on:
  - dovetail (the pure-Ruby shape checker the shape package carries in the vault, with a dovetail on the PATH as the fallback)
  - teach (the course server this plugin talks to, protocol 1)
actors:
  - id: A1
    name: Student
    kind: human
    description: >
      The enrolled learner who owns the business behavior of an assignment and writes no code. They talk to their own AI agent, answer rEach's questions by typing, and decide whether work is submitted, whether a hand is raised, and whether a live session opens.
    surfaces:
      - "reach status"
      - "reach next"
      - "reach part"
      - "reach grade"
      - "reach support"
      - "reach login"
      - "reach login out"
      - "reach uninstall"
      - "reach transcripts export"
      - "reach profile forget"
    standards: [STD-GUIDED-LEARNER, STD-CONSENT-FROM-REACH, STD-SUBMIT-APPROVAL]
  - id: A2
    name: Student's AI agent
    kind: agent
    description: >
      The student's own assistant in Claude Code, Claude Cowork, Codex, Antigravity or Hermes, which rEach turns into a bounded course partner. It writes all of the code inside the student's slice, runs rEach's tools, and relays rEach's questions word for word, but never sees the enrollment answers or passwords and cannot answer a consent question itself.
    surfaces:
      - "reach_hello"
      - "reach_setup"
      - "reach_validate"
      - "reach_next"
      - "reach_plan"
      - "reach_check"
      - "reach_qualify"
      - "reach_submit"
      - "reach_raise_hand"
      - "reach_live"
      - "reach_checkpoint"
      - "reach-assistant"
      - "reach-plan-audit"
    standards: [STD-GUIDED-LEARNER, STD-ENROLL-NO-RELAY, STD-PERSONA-ONE-SOURCE, STD-PLAN-AUDIT]
  - id: A3
    name: rEach runtime
    kind: service
    description: >
      The plugin, hooks, command line and MCP bridge that run on the student's computer. It locks the install until enrollment, gates every prompt, write, shell and read, keeps the student's state in the rEach home, and is the only party that talks to Teach for the student.
    surfaces:
      - "reach gate prompt"
      - "reach gate write"
      - "reach gate shell"
      - "reach gate read"
      - "reach hook stop"
      - "reach mcp"
      - "reach doctor"
      - "reach sync"
      - "reach update run --apply"
    standards: [STD-ENROLL-LOCKDOWN, STD-HOOK-RESPONSIVE, STD-TEACH-LINK, STD-PORTS-ONLY, STD-HOME-IN-WORKSPACE]
  - id: A4
    name: Instructor
    kind: human
    description: >
      The course staff who share the class-wide passkey, read hands, reply to them, reset passwords, confirm module moves, mint instructor unlock codes and approve or offer live sessions. They work on Teach, never in the student's rEach.
    surfaces:
      - "reach instructor unlock"
      - "reach instructor status"
      - "reach instructor diagnose"
      - "reach live status"
      - "reach hand status"
    standards: [STD-INSTRUCTOR-UNLOCK, STD-PASSWORD-RESET-QUEUE, STD-LIVE, STD-LIVE-DIAGNOSIS, STD-INSTRUCTOR-PERSONA]
  - id: A5
    name: Teach
    kind: service
    description: >
      The private course server that checks the roster, seals and signs packages, runs hidden checks, signs receipts and answers hands. This repository knows it only through specs/wire.yml, which rEach follows byte for byte.
    surfaces:
      - "GET /api/v1/revision"
      - "GET /api/v1/instructor/keyring"
    standards: [STD-WIRE-CONTRACT, STD-TEACH-OPAQUE, STD-TEACH-URL]
  - id: A6
    name: Plugin marketplace and installer
    kind: service
    description: >
      The public GitHub repository, its releases and stable branch, the install scripts, and the Claude Code, Codex, Antigravity and Hermes plugin registrations that carry rEach onto the student's computer. Only the stable branch is a student source.
    surfaces:
      - "scripts/reach-install"
      - "scripts/reach-install.ps1"
      - "reach setup"
      - "reach update check"
      - "reach harness move"
    standards: [STD-AUTO-UPDATE, STD-APP-COPY-UPDATE, STD-RUBY-BOOTSTRAP, STD-NO-TOP-BIN]
  - id: A7
    name: Operator
    kind: human
    description: >
      The maintainer who develops rEach on main, promotes it to test and stable through polispec, publishes releases, and holds the release-gate lease when a push would otherwise block.
    surfaces:
      - "tools/release_gate/gate.rb"
      - "tools/stable_promote.rb"
      - "tools/release_stable.rb"
      - "tools/security_audit/gate.rb"
    standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE, STD-SECURITY-AUDIT-MODE, STD-STABLE-CADENCE]
  - id: A8
    name: Release automation
    kind: service
    description: >
      The hosted workflows that plan a stable promotion each day, run the platform smoke on every operating-system leg of the candidate, and move stable only when every leg passes.
    surfaces:
      - ".github/workflows/stable.yml"
      - ".github/workflows/platforms.yml"
      - "tools/platform_smoke/run.rb"
    standards: [STD-STABLE-CADENCE, STD-PLATFORM-SMOKE, STD-SMOKE]
  - id: A9
    name: Instructor's assistant
    kind: agent
    description: >
      The instructors' own AI assistant, which works with the student's agent through Teach during an approved live session. Everything it asks for comes from a fixed list and runs only after the student's yes.
    surfaces:
      - "reach live status"
      - "reach live say TEXT"
      - "reach_live"
    standards: [STD-LIVE, STD-LIVE-DIAGNOSIS]
journeys:
  - id: J1
    name: Install rEach from a link
    actor: A1
    trigger: "The student pastes the repository link into their AI app and asks it to install rEach."
    steps:
      - "The agent follows INSTALL.md and tells the student in one sentence what the install command will do."
      - "The agent runs the one install command, outside the sandbox when the app has one, which downloads the stable archive and unpacks it with Ruby, with no git."
      - "When the computer has no Ruby, the launcher installs the runtime kit Ruby in the background instead."
      - "The agent runs `reach setup --harness codex` or the matching app name, which registers rEach with the app through the app's own install command."
      - "In Codex the agent asks the student's yes and runs `reach codex configure` or `reach_setup` with action configure, then the student starts a new chat."
      - "The agent relays the NEXT block word for word, starting with the introduction and the request to connect to the course."
    outcome: "rEach is installed in the student's app and locked until the student enrolls."
    interfaces:
      - "scripts/reach-install"
      - "scripts/reach-install.ps1"
      - "reach setup"
      - "reach_setup"
      - "reach codex configure"
      - "reach doctor"
    failure_modes:
      - when: "The app's sandbox blocks the network or the rEach home, as in Codex."
        result: "The agent asks to run the one command outside the sandbox, or tells the student to switch the chat to Full access and ask again, and never improvises another folder."
      - when: "The student uses Claude Cowork."
        result: "The agent only tells the student to add the marketplace by hand and to work in the Code tab."
      - when: "Codex has not been told to trust rEach's hooks."
        result: "rEach does no course work, reports the hooks as not running, and the student trusts them and starts a new chat."
      - when: "The install is interrupted or run twice."
        result: "An existing install is moved to a .backup folder beside it first, so nothing is deleted."
    standards: [STD-RUBY-BOOTSTRAP, STD-CODEX-SETUP, STD-CODEX-HOOK-TRUST, STD-HOOK-GUARD, STD-NO-TOP-BIN, STD-COWORK-CODE-TAB]
  - id: J2
    name: Security validation pass
    actor: A2
    trigger: "A new install must prove its connection to Teach before it collects any identity or password."
    steps:
      - "The agent runs `reach validate` or the `reach_validate` tool and announces the text it returns."
      - "The agent follows each next step, filling the practice answers with fabricated data only."
      - "rEach plans and builds the practice artifacts, runs `reach check` and a checkpoint on them in the session's own isolated home, then asks Teach to qualify and receive the sealed practice package."
      - "rEach fetches Teach's signed receipt, verifies it against the bound course, key, harness, version and challenge, and returns the final text."
      - "The agent relays that text verbatim and moves on to enrollment only when the phase is passed."
    outcome: "The student hears the purpose and gets a verified result before any identity or password is asked for."
    interfaces:
      - "reach validate"
      - "reach_validate"
      - "reach check"
      - "reach checkpoint save"
    failure_modes:
      - when: "Teach cannot be reached or the receipt cannot be verified."
        result: "rEach returns a calm failure text saying a connection problem or software impersonating rEach or Teach is possible, tells the student to wait and contact the instructor through details they already know, and enrollment stops."
      - when: "The pass is interrupted."
        result: "The run resumes, or `reach validate --restart` begins a new isolated run that leaves prior practice files and real work alone."
    standards: [STD-WIRE-CONTRACT]
  - id: J3
    name: Interview and enrollment
    actor: A1
    trigger: "The student types anything in the chat of a freshly installed, not yet enrolled rEach."
    steps:
      - "The prompt hook blocks the prompt and asks, one question at a time, for the course passkey, the school username, the student ID and a chosen password typed twice, so the agent never sees any of it."
      - "rEach sends the answers to Teach, which checks the roster and answers with a signed enrollment stamp tied to a scrambled fingerprint of the machine, account and install key."
      - "rEach keeps only a salted one-way verifier of the password and saves the stamp, install key and fingerprint."
      - "rEach introduces itself and the agent asks the interview questions, one thing each and at most twelve, and saves the answers with `reach profile save`."
      - "The student may answer as many as they like and finish later, ask what rEach knows with `reach profile show`, or delete it with `reach profile forget`."
    outcome: "The install is enrolled and unlocked, and the interview profile exists on the student's computer only."
    interfaces:
      - "reach enroll"
      - "reach_enroll"
      - "reach enroll --window"
      - "reach profile save"
      - "reach profile show"
      - "reach profile forget"
      - "reach_hello"
    failure_modes:
      - when: "The passkey is unknown or expired."
        result: "Teach refuses with course_code_unknown or course_code_expired and rEach re-asks, accepting a loosely typed passkey but never sending an ordinary sentence as one."
      - when: "The app runs no rEach hooks, as in Antigravity, or cannot block a prompt, as in Hermes."
        result: "The agent tells the student to run `reach enroll` in a terminal, where typing is hidden, and walks them through the step."
      - when: "Saving the stamp or key on the computer fails after Teach accepted the enrollment."
        result: "rEach records a fault, names the error and returns to the password step instead of asking the confirm question again."
      - when: "The student enrolls again, for example after reinstalling."
        result: "Teach takes the new password and switches off the older copy, which shows that it was replaced until it enrolls again."
    standards: [STD-ENROLL-LOCKDOWN, STD-ENROLL-PASSWORD, STD-ENROLL-NO-RELAY, STD-NOHOOK-ENROLL, STD-COURSE-PASSKEY, STD-GATE-REPLACED, STD-FINGERPRINT-OS-USER, STD-PROFILE-LOCAL, STD-INTERVIEW-ONCE]
  - id: J4
    name: Sign in on a computer
    actor: A1
    trigger: "The student opens a chat on an enrolled computer that holds no live sign-in."
    steps:
      - "The prompt hook asks for the student ID, then 'Am I speaking with <name>?', then the password, hidden from the agent."
      - "A correct password writes one sign-in for the computer that lasts 12 hours."
      - "Every new chat in any app on that computer counts as signed in without asking again, and the next prompt gets a short signed-in context."
      - "The student can check the state with `reach login status` or end it early on a shared computer with `reach login out`."
    outcome: "Course work may begin in any chat on the computer for up to 12 hours."
    interfaces:
      - "reach login"
      - "reach login password"
      - "reach login status"
      - "reach login out"
      - "reach login --window"
    failure_modes:
      - when: "Too many wrong IDs or passwords, or Teach answers rate_limited."
        result: "The sign-in ends in every chat, the student is told so, and every chat asks again on its next prompt."
      - when: "The student forgot the password."
        result: "Typing forgot changes nothing; only the instructor's Reset password in Teach starts a reset, after which the next sign-in asks for a new password, and `reach login reset` finishes it from a terminal."
      - when: "The computer or account is not the one enrolled, as after copying the install."
        result: "The fingerprint check fails, rEach does no course work and locks until the student enrolls there."
      - when: "The app is Hermes, which cannot keep a password out of the chat."
        result: "The student signs in with `reach login` in a terminal and the Hermes chat is confirmed by it."
    standards: [STD-SIGNIN-PASSWORD, STD-SIGNIN-ONCE, STD-SIGNIN-PLUGIN-HOOK, STD-SIGNIN-TERMINAL-RESET, STD-PASSWORD-RESET-QUEUE, STD-FINGERPRINT-OS-USER]
  - id: J5
    name: Receive course materials
    actor: A3
    trigger: "A session starts, the background course check ticks, or the student runs a sync after signing in."
    steps:
      - "rEach asks Teach for its revision and, when it changed, fetches the signed and sealed packages and the signed guardrails."
      - "rEach verifies and opens them, installs the guardrails and refreshes the slice workspaces under the course folder."
      - "The student opens a slice with `reach work`, which sets up the workspace and the harness files for that folder."
      - "rEach tells the student about new announcements, a moved due time and the reply to a hand, without interrupting."
    outcome: "The student's slices, rules and reference material are current, and the agent may work."
    interfaces:
      - "reach sync"
      - "reach_sync"
      - "reach work"
      - "reach subscribe status"
      - "reach announcements"
      - "reach reference list"
      - "reach modules"
    failure_modes:
      - when: "The guardrails are not installed or the course server has not delivered them."
        result: "rEach refuses to let the agent work until they are installed."
      - when: "Teach is unreachable."
        result: "The gate keeps passing for up to 24 hours on verified rules, submissions queue, and the student sees a plain connection note, never a raw error."
      - when: "The assistant runs in a Codex sandbox that blocks the network or the rEach home."
        result: "rEach makes no request, does not mark the connection lost, and returns a message telling the agent to run the command outside the sandbox."
      - when: "The student's course lets them pick modules and the instructor moved them."
        result: "The student asks to confirm with `reach transfer request`, and the instructor confirms on Teach."
    standards: [STD-TEACH-SUBSCRIBE, STD-TEACH-LINK, STD-CODEX-SANDBOX, STD-ANNOUNCEMENTS, STD-DUE-CHANGE, STD-HOLDINGS, STD-COURSE-CORPUS, STD-MODULES-LOCK-SYNC, STD-NO-SLICE-MESSAGE]
  - id: J6
    name: Work a slice under the gate
    actor: A2
    trigger: "The student, signed in, asks their agent to build the next part of the assignment."
    steps:
      - "The agent runs `reach next` and states the current assignment and phase, which every new chat gets from durable state."
      - "The agent asks the student's own-part questions one at a time and records the answers with `reach part record`."
      - "The agent saves a plan with `reach plan save` and runs the second-pass audit with the `reach-plan-audit` skill and `reach plan audit`."
      - "The agent writes code only in the slice's owned files, through the feature or bug flow, and every write passes `reach gate write`."
      - "After each write rEach runs `reach shape check` or `reach check`, saves a checkpoint, and records the signed-in conversation for the instructors."
      - "The student stays on business behavior and never sees code."
    outcome: "The slice holds checked code, a saved plan and checkpoints, and the student has answered their own part."
    interfaces:
      - "reach next"
      - "reach part"
      - "reach plan save"
      - "reach plan audit"
      - "reach check"
      - "reach shape check"
      - "reach checkpoint save"
      - "reach gate write"
      - "reach_plan"
      - "reach_check"
      - "reach_shape_check"
      - "reach-feature"
      - "reach-bug"
    failure_modes:
      - when: "A write targets a file outside the slice's owned files, the rEach home, or the workspace root."
        result: "The gate refuses with a plain message and the agent is told which slice or space is meant."
      - when: "The agent tries git in a slice or the workspace root."
        result: "The shell gate refuses it, since checkpoints are the history until version control arrives."
      - when: "A shell command cannot be fully parsed and classified."
        result: "The gate fails closed and refuses it."
      - when: "Files are lost or broken."
        result: "`reach checkpoint recover` brings the missing work back from rEach's kept copies."
      - when: "The assignment's due time has passed."
        result: "The slice stays writable as late work, rEach says so plainly, and one hand with trigger late_work is raised per assignment."
    standards: [STD-FLOWS, STD-NO-GIT-IN-WORKSPACE, STD-WORKSPACE-LAYOUT, STD-CHECKPOINT-AUTOSAVE, STD-PLAN-AUDIT, STD-ASSIGNMENT-CONTEXT, STD-TRANSCRIPT, STD-LATE-WORK, STD-SEAL-INVISIBLE]
  - id: J7
    name: Qualify locally and on Teach
    actor: A2
    trigger: "The agent believes the slice is ready and has written its own scenarios under qualify/."
    steps:
      - "The agent runs `reach qualify`, which first checks that the plan passed its audit."
      - "rEach runs `reach check`, confirms the agent's scenarios cover every required scenario name and that they fail on the untouched starting copy."
      - "Where the slice allows it, the agent's scenarios run locally on the runtime kit, with `reach preview` available to show a panel in the student's browser."
      - "rEach then uploads the files to Teach, which runs the agent's scenarios and the hidden graded scenarios, and rEach polls for the result."
      - "The result shows scenario names, pass or fail and a reason, never reference code or graded steps, and a pass is recorded for exactly the current owned files."
    outcome: "A current qualification pass exists, which unlocks submit."
    interfaces:
      - "reach qualify"
      - "reach qualify --list"
      - "reach_qualify"
      - "reach preview"
      - "reach_preview"
      - "reach attempts show"
      - "reach_attempts"
    failure_modes:
      - when: "The qualification does not pass."
        result: "Attempt 1 is silent, attempts 2 and 3 tell the student in plain words why another pass is needed, and the failure is recorded as a fault with its kind."
      - when: "The local runtime kit cannot run here or the starting-copy check is impossible."
        result: "rEach reports the environment as unable, not as a code failure, and the Teach half still runs."
      - when: "The Teach half runs past its 20 second budget."
        result: "The qualification stays pending with an id and the next `reach qualify` of the same files resumes it."
      - when: "Required instructor APIs are faked or a known pattern repeats."
        result: "The weighted passes and the pattern ledger report it, and follow the course's ledger mode."
    standards: [STD-QUALIFY-BEFORE-SUBMIT, STD-PLAN-AUDIT, STD-WEIGHTED-PASSES, STD-PATTERN-LEDGER, STD-QUALIFY-FAULTS, STD-QUALIFY-REMOTE-BUDGET, STD-QUALIFY-LOCAL-UNABLE, STD-QUALIFY-UNCOVERED, STD-PREVIEW, STD-KIT-LOCK-MATCH]
  - id: J8
    name: Submit work and keep the receipt
    actor: A1
    trigger: "The agent tells the student the part passed and the student asks to submit."
    steps:
      - "The agent runs `reach submit`, which first checks that a current qualification pass exists and that every own-part question is answered."
      - "rEach asks the student its own question, the student types yes, and the prompt hook captures it for 30 minutes and for exactly those owned files."
      - "The agent runs `reach submit` again and rEach sends the sealed submission to Teach and waits for the signed ingest receipt."
      - "rEach stores the receipt, confirms it back to Teach with a signed receipt acknowledgment, and `reach sync` fetches any receipt the computer is missing."
      - "rEach saves a ZIP of the whole assignment to the Downloads folder, and tells the student to upload it to the learning system if the course requires it."
      - "The student can look at points with `reach grade` and at receipts with `reach receipts`."
    outcome: "Teach holds the submission, the student holds a signed receipt, and a ZIP copy of the work is in Downloads."
    interfaces:
      - "reach submit"
      - "reach_submit"
      - "reach submit archive"
      - "reach receipts"
      - "reach_receipts"
      - "reach grade"
      - "reach_grade"
      - "reach status"
    failure_modes:
      - when: "No current qualification pass exists, or an own-part answer is missing."
        result: "The submit is refused with a message naming what is missing."
      - when: "The due time has passed."
        result: "A slice with a receipt is refused before anything is asked; a never-submitted slice may send one late submission, which raises a late_submission hand."
      - when: "Teach cannot be reached."
        result: "The submission queues in the outbox and is removed only when Teach delivered it."
      - when: "The student wants to send unqualified work for review."
        result: "`reach submit --partial` sends it for the instructor to look at."
      - when: "The ZIP copy cannot be written."
        result: "The submission still stands, since a failed copy never undoes or fails it."
    standards: [STD-SUBMIT-APPROVAL, STD-SUBMIT-ARCHIVE, STD-SUBMIT-PARTIAL, STD-SUBMIT-REFUSALS, STD-CONSENT-FROM-REACH, STD-QUALIFY-BEFORE-SUBMIT, STD-LATE-WORK, STD-GRADE-VIEW, STD-COURSE-TIME]
  - id: J9
    name: Raise a hand and get an answer
    actor: A1
    trigger: "The student asks for help, or a third qualification of a slice fails."
    steps:
      - "At the third failed qualification rEach raises a hand to the instructors by itself, tells the student, and holds further work until the student says yes."
      - "A student's own yes is recorded with `reach attempts continue` and covers attempts 4 to 10."
      - "At attempt 10 rEach stops and waits for an instructor."
      - "For a hand the student asks for, the agent picks a type and runs `reach hand raise` with a summary."
      - "`reach hand status` and the background check bring the instructor's reply, which resets the ladder."
    outcome: "The instructors hold a structured hand with the failing owned files, task, assignment, slice, attempt history and timestamps, and the student hears the reply."
    interfaces:
      - "reach hand raise"
      - "reach hand status"
      - "reach hand list"
      - "reach attempts continue"
      - "reach_raise_hand"
      - "reach_hand_status"
      - "reach support"
      - "reach_support"
    failure_modes:
      - when: "The student is having a hard time or writes a crisis message."
        result: "rEach answers with its support message before anything else and raises a wellbeing hand, and a hand Teach refuses is never reported as told."
      - when: "A network blip returns nothing for a stored reply."
        result: "The stored reply is kept and the ladder is not reset."
      - when: "The student wants to send a feedback note instead."
        result: "That goes through `reach feedback send` with a named or anonymous choice, and a hand of type feedback is refused."
      - when: "rEach itself breaks."
        result: "A content-free fault report is sent on its own with a signature, and the student sees one short note."
    standards: [STD-ATTEMPT-LADDER, STD-HAND-TYPES, STD-WELLBEING-DELIVERED, STD-FEEDBACK, STD-ISSUES, STD-CONSENT-FROM-REACH]
  - id: J10
    name: Update rEach
    actor: A3
    trigger: "A session starts or the hourly check finds a newer tagged release on the stable source."
    steps:
      - "rEach checks GitHub releases and tags together from a detached process and stages the newest version in the background."
      - "At the next session start the release's own update script installs it and records every phase in the update manifest."
      - "The student is told without being interrupted, and course work waits only while an install runs."
      - "An interrupted update resumes from the manifest."
      - "A student or agent can run `reach update status` or `reach update run --apply` by hand."
    outcome: "The student runs the newest stable release with no action of their own."
    interfaces:
      - "reach update status"
      - "reach update check"
      - "reach update run --apply"
      - "reach_update"
      - "reach subscribe status"
    failure_modes:
      - when: "The student's install is a copy managed by an app, such as a Codex cache copy."
        result: "rEach updates through the app's own channel and tells the agent when no command-line tool is available."
      - when: "A hook change reaches Codex."
        result: "Codex asks the student to trust the changed hooks again, and rEach shows one notice per version."
      - when: "A migration fails."
        result: "The update stops after its attempt limit instead of respawning forever."
      - when: "The student turns the check off."
        result: "REACH_UPDATE_DISABLE and `reach subscribe uninstall` stop it, and nothing else installs rEach for them."
    standards: [STD-AUTO-UPDATE, STD-APP-COPY-UPDATE, STD-CODEX-HOOK-TRUST, STD-STABLE-CADENCE, STD-AGENT-UPDATE, STD-AGENT-UPDATE-CHECKS, STD-VERSION-REPORT, STD-CLI-VERSION]
  - id: J11
    name: Move to another AI app
    actor: A1
    trigger: "The student wants to use a different supported app on the same computer."
    steps:
      - "The agent runs `reach harness move --to codex`, or the `reach_setup` tool with action harness, and relays rEach's own question word for word."
      - "The student types yes, and rEach installs itself into the target app with the same steps as `reach setup` and rewrites every course folder's harness files."
      - "When the target is Codex and its settings lack what rEach needs, rEach adds the Codex settings step."
      - "rEach gives the next steps: open the new app in the reach-work folder, start a new chat and sign in with the same password."
    outcome: "rEach works in the new app with the same enrollment, course folders and work, and stays installed in the old app."
    interfaces:
      - "reach harness move"
      - "reach_setup"
      - "reach setup"
      - "reach codex configure"
    failure_modes:
      - when: "The app being left runs no rEach hooks, as Antigravity."
        result: "No question is asked and the agent gets the terminal command instead."
      - when: "The target app has no command-line tool."
        result: "Setup returns its manual step."
      - when: "The install into the target app fails."
        result: "Nothing else changes and the student is told it failed."
    standards: [STD-HARNESS-MOVE, STD-CODEX-SETUP, STD-NOHOOK-ENROLL, STD-FINGERPRINT-OS-USER]
  - id: J12
    name: Uninstall rEach
    actor: A1
    trigger: "The student asks their agent to remove rEach."
    steps:
      - "The agent runs `reach uninstall`, outside the sandbox, from a chat inside the reach-work folder."
      - "rEach prints its question naming what goes, what stays, the unsent items that would be lost and whether the course server will be told, and the agent relays it and stops."
      - "After the student's own typed yes, the agent runs the same command again."
      - "rEach saves the receipts and grade records to the Downloads folder first, tells Teach with one signed request, then removes its home folders, the update job, the app registrations and its Codex edits."
      - "rEach prints a closing text and lists anything left for the student."
    outcome: "rEach is gone from the computer, and the student's deliverables, extracurricular folder and receipts copy remain."
    interfaces:
      - "reach uninstall"
      - "reach-uninstall"
    failure_modes:
      - when: "The receipts copy fails."
        result: "Nothing is deleted and the command exits with an error."
      - when: "Teach is unreachable, refuses, or rate limits."
        result: "The uninstall finishes and says Teach was not told, after at most one retry."
      - when: "A file rEach generated was changed by the student."
        result: "It is edited or left and listed, never deleted."
      - when: "A candidate folder looks like the work folder, the user folder or holds deliverables."
        result: "It is refused and listed."
      - when: "The command is run with --yes while enrolled."
        result: "It is refused, since only the student's typed yes counts."
    standards: [STD-UNINSTALL, STD-CONSENT-FROM-REACH]
  - id: J13
    name: Live session with an instructor
    actor: A1
    trigger: "Something in rEach does not work and a normal request for help is not enough, or an instructor offers a session."
    steps:
      - "The student tells the agent to ask for a live session, and the agent calls `reach_live` or runs `reach live request`."
      - "rEach asks its own question, and the session opens only after the student's typed yes and an instructor's acceptance."
      - "While it is open rEach turns debug mode on for the reason remote and sends only its own debug events."
      - "The instructor's assistant asks for actions from a fixed list, and rEach asks before running each one and shows every message the agent wants to send."
      - "Either side ends it with `reach live end`, and it closes by itself after an hour unless extended."
    outcome: "The instructors see what rEach did and when, and the problem is diagnosed without seeing what the student typed or their files."
    interfaces:
      - "reach live request"
      - "reach live status"
      - "reach live wait"
      - "reach live say TEXT"
      - "reach live end"
      - "reach_live"
    failure_modes:
      - when: "rEach is not letting the student's messages through at all."
        result: "A message containing the words live session still gets rEach's question under its notice."
      - when: "The student refuses an instructor's offer."
        result: "The offer is declined on Teach."
      - when: "An instructor session is used for a diagnosis on an install with no instructor unlock."
        result: "It is refused until a valid unlock is held."
    standards: [STD-LIVE, STD-LIVE-DIAGNOSIS, STD-DEBUG-MODE, STD-INSTRUCTOR-UNLOCK, STD-CONSENT-FROM-REACH]
  - id: J14
    name: Promote a release to students
    actor: A7
    trigger: "The operator finishes a version on main and wants students to receive it."
    steps:
      - "The operator pushes to main, and the pre-push release gate runs the security scan and the release checks."
      - "The operator promotes to test with polispec and publishes the tagged release as Latest."
      - "The daily stable workflow plans none, notice, wait or promote against the Latest release."
      - "A hook change first pushes a dated notice ref and moves nothing, and waits for the next day."
      - "A promote runs the platform smoke on every hosted leg, and only when all pass `tools/release_stable.rb` fast-forwards stable to the Latest tag."
      - "Students' installs then pick the release up on their next update check."
    outcome: "Stable sits at the Latest release and students update to it without action."
    interfaces:
      - "tools/release_gate/gate.rb"
      - "tools/stable_promote.rb"
      - "tools/release_stable.rb"
      - "tools/platform_smoke/run.rb"
      - ".github/workflows/stable.yml"
      - ".github/workflows/platforms.yml"
    failure_modes:
      - when: "A check at or above the block severity fails."
        result: "The push is refused, and only a time-boxed lease of at most 24 hours, with a reason, lets it through while every check still runs."
      - when: "Any smoke leg fails or is cancelled."
        result: "Stable stays where it is and one stable-hold issue names the tag and the run."
      - when: "An untagged patch exists on main."
        result: "It is never offered to students."
    standards: [STD-RELEASE-GATE, STD-RELEASE-GATE-LEASE, STD-STABLE-CADENCE, STD-PLATFORM-SMOKE, STD-SMOKE, STD-SECURITY-AUDIT-MODE, STD-ISSUE-CLOSEOUT-HOOK]
data:
  stores:
    - id: S1
      kind: filesystem
      name: rEach install root
      holds: >
        The install-wide files that are not specific to one student or persona: the managed plugin copy, the Ruby runtime kit, gems, the pinned Chromium, staged updates and their backups, the update manifest, the Teach URL pointer, the hook-liveness records, the instructor unlock files, the security validation state, and the root logs.
      location: "$REACH_HOME if set, else <workspace>/.reach-home, else the legacy <user home>/.reach until the relocation runs; <workspace> is $REACH_WORKSPACE_ROOT or <user home>/reach-work"
      standards: [STD-HOME-IN-WORKSPACE, STD-USER-HOME, STD-AUTO-UPDATE, STD-INSTRUCTOR-UNLOCK]
    - id: S2
      kind: filesystem
      name: rEach home of the signed-in identity
      holds: >
        The per-identity files: the install record, install key, stamp, fingerprint, profile, link state, open-hand tracker, relocation journal, and the folders keys, packages, vault, outbox, receipts, logs, state, checkpoints, transcripts, brain, corpora, setup-log, and debug. For a student this is the same folder as the install root; for an instructor persona it is a separate folder.
      location: "same as the install root for a student; <root>/personas/<persona id> for an instructor persona"
      standards: [STD-HOME-IN-WORKSPACE, STD-INSTRUCTOR-PERSONA]
    - id: S3
      kind: filesystem
      name: Slice workspaces
      holds: >
        The student's working folders for graded slices, each with the delivered course files, the student's owned files, generated harness files, and a hidden .reach folder of local records (slice marker, delivered digests, plan, qualification record, pass candidates, sidecar receipt, qualify kit).
      location: "<workspace>/deliverables/<course>/<assignment>/<cutout>-<slice>/ (legacy: <workspace>/<course>/<assignment>/<cutout>-<slice>/)"
      standards: [STD-WORKSPACE-LAYOUT, STD-STORAGE-GATES, STD-NO-GIT-IN-WORKSPACE]
    - id: S4
      kind: filesystem
      name: reach-work base folder
      holds: >
        The folder around the slice workspaces: the extracurricular folder for the student's own code, the root README, the extracurricular space marker, and the instructor persona workspaces. The rEach home also hangs from this folder.
      location: "<workspace>/ with <workspace>/extracurricular/, <workspace>/README.md, <workspace>/personas/<persona id>/"
      standards: [STD-WORKSPACE-LAYOUT, STD-HOME-IN-WORKSPACE]
    - id: S5
      kind: filesystem
      name: Vault
      holds: >
        Decrypted guardrails, the qualification suite, the shape brief tooling, the reference build, and per-run qualification directories. Nothing outside a few named Ruby modules lists or reads it.
      location: "<home>/vault (mode 0700) with guardrails/, suite/, shape/, runs/"
      standards: [STD-VAULT-PRIVATE, STD-SEAL-INVISIBLE]
    - id: S6
      kind: blob_store
      name: Package store
      holds: >
        The sealed course packages Teach delivered (guardrails, workspace, shape) kept as one .pkg envelope per version, opened only inside Reach::Packages.
      location: "<home>/packages/<kind>/<version>.pkg"
      standards: [STD-WIRE-CONTRACT]
    - id: S7
      kind: local_file
      name: State folder
      holds: >
        Small JSON, JSONL, YAML, and lock files for the flows that must survive between hook and command runs: enrollment, sign-in, consent, ladders, queues, caches, and detached-process state. Most are replaced atomically through Reach::StateFile with mode 0600.
      location: "<home>/state/ (install-wide records are in <root>/state/)"
      standards: [STD-STATE-FILE-REPLACE, STD-STATE-FILE-HELD]
    - id: S8
      kind: local_file
      name: Outbox
      holds: >
        One JSON file per item waiting to be sent to Teach (submission, hand, issue report, integrity event), keyed by its idempotency key, plus a rejected shelf for submissions Teach refused for good.
      location: "<home>/outbox/<idempotency key>.json and <home>/outbox/rejected/"
      standards: [STD-ISSUES, STD-SUBMIT-REFUSALS]
    - id: S9
      kind: local_file
      name: Receipts store
      holds: >
        The signed receipts Teach issued (ingest, grade, validation) and the signed acknowledgements rEach sends back for them.
      location: "<home>/receipts/<receipt id>.json and <home>/receipts/acks/<receipt id>.json"
      standards: [STD-SUBMIT-ARCHIVE]
    - id: S10
      kind: local_file
      name: Witness ledger
      holds: >
        A hash-chained append-only JSONL record per slice of what rEach saw (sessions, writes, qualifications, submissions), with a head file per slice, kept so a slice's history can be checked and a store can be matched to its student.
      location: "<home>/state/ledger/<course>/<assignment>/<cutout>-<slice>.jsonl and .head.json; key in <home>/state/ledger.key unless the seal supplies one"
      standards: [STD-SEAL-INVISIBLE, STD-CHECKPOINT-AUTOSAVE]
    - id: S11
      kind: filesystem
      name: Local microbrain and corpus
      holds: >
        The private microbrain (sessions, state, lexical index, course ingest record, import jobs, pending erasures), its append-only brain spool and import spool, and the planes corpus. All of it stays on the computer.
      location: "<home>/brain/, <home>/corpora/reach, <state-home>/rplugin/reach/brain-spool (persona: <home>/brain-store), <state-home>/rplugin/reach/import-spool"
      standards: [STD-BRAIN, STD-BRAIN-PLANES, STD-STORAGE-GATES, STD-EXPORT-IMPORT]
    - id: S12
      kind: filesystem
      name: Transcript spool
      holds: >
        The per-session conversation record rEach keeps while a signed-in student works on an assignment, with its state file, rejected lines, pending queues, gzip archives, and the per-space map.
      location: "<home>/transcripts/<session>.jsonl, <session>.state.json, <session>.rejected.jsonl, <session>.pending-<pid>.q, archive/*.jsonl.gz, spaces/<digest>.json"
      standards: [STD-TRANSCRIPT, STD-TRANSCRIPT-STREAM, STD-TRANSCRIPT-DEIDENTIFY, STD-TRANSCRIPT-EXPORT]
    - id: S13
      kind: filesystem
      name: Checkpoint store and mirror
      holds: >
        Content-addressed history of the student's owned files, filed under a salted hash of the student, with a second mirrored copy outside the reach-work tree.
      location: "<home>/checkpoints/<student key>/<course>/<assignment>/<cutout>-<slice>/ and the mirror <data-dir>/reach/checkpoints (REACH_CHECKPOINT_MIRROR overrides)"
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - id: S14
      kind: local_file
      name: Logs, debug, and setup log
      holds: >
        Redacted request logs, workspace and transcript event logs, gate refusals, brain events, update and runtime logs, the instructor event log, the debug event folder, and the exhaustive pre-enrollment setup log.
      location: "<home>/logs/*.jsonl, <root>/logs/update.log, runtime.jsonl, instructor.jsonl, <home>/debug/, <home>/setup-log/ (mode 0700, files 0600)"
      standards: [STD-REQUEST-LOG, STD-SETUP-LOG, STD-DEBUG-MODE]
    - id: S15
      kind: local_file
      name: Sidecar seal file
      holds: >
        A small record kept outside the rEach home so it survives a reinstall: the fingerprint salt, the checkpoint salt, the list of installs the computer has held, and ledger heads.
      location: "<state-home>/reach/seal.json (Application Support on macOS, LOCALAPPDATA on Windows, XDG_STATE_HOME or <user home>/.local/state elsewhere; $REACH_SIDECAR overrides; persona: <home>/seal.json)"
      standards: [STD-FINGERPRINT-SALT-KEPT, STD-FINGERPRINT-OS-USER]
    - id: S16
      kind: filesystem
      name: Downloads folder
      holds: >
        Files rEach writes for the student to keep or send on: submission archive ZIPs, setup reports, and the receipts copy made before an uninstall.
      location: "the user's Downloads folder (Downloads known folder on Windows, XDG_DOWNLOAD_DIR on Linux when set, else <user home>/Downloads; $REACH_DOWNLOADS_DIR first)"
      standards: [STD-SUBMIT-ARCHIVE, STD-SETUP-LOG, STD-UNINSTALL]
    - id: S17
      kind: external
      name: Harness configuration folders
      holds: >
        The settings, plugin registrations, hook entries, and marketplace sources of the student's AI apps (Claude Code, Codex, Antigravity, Hermes) that rEach installs into and edits, plus rEach's own backup of Codex's settings.
      location: "$CLAUDE_CONFIG_DIR or <user home>/.claude, $CODEX_HOME or <user home>/.codex, <user home>/.gemini, $HERMES_HOME or <user home>/.hermes"
      standards: [STD-CODEX-SETUP, STD-HARNESS-MOVE, STD-UNINSTALL]
    - id: S18
      kind: external
      name: Teach course server
      holds: >
        The authoritative enrollment, receipts, hands, grades, packages, live sessions, and transcripts. rEach keeps only the local copies and caches in the other stores; the protocol is in specs/wire.yml.
      location: "the HTTPS URL in install.yml teach_url, or the compiled default Teach URL before enrollment"
      standards: [STD-TEACH-URL, STD-WIRE-CONTRACT, STD-TEACH-OPAQUE]
    - id: S19
      kind: memory
      name: Process memory
      holds: >
        Per-process memos that are never persisted: the resolved home and user-home pair (a 2 second resolution cache), the persona override, the enrollment-lock instructor pass session, and the brain enabled flag.
      location: "module instance variables in Reach::Paths, Reach::EnrollmentLock, and Reach::Brain"
  entities:
    - name: install record
      store: S2
      purpose: The enrollment record of this computer, written once enrollment succeeds and read by almost every command.
      key: [install_id]
      data_class: pii_direct
      owner: Reach::Enroll
      source: lib/reach/enroll.rb Reach::Enroll.write_install_file
      relations:
        - {to: install key, via: install_id, kind: signs_for}
        - {to: enrollment stamp, via: install_id, kind: one_to_one}
        - {to: fingerprint record, via: install_id, kind: one_to_one}
      notable_columns:
        - {name: student_id, note: "identifies the student; never leaves the computer except in signed requests to Teach"}
        - {name: username, note: "present when shape is v2"}
        - {name: display_name, note: "shown in greetings"}
        - {name: signing_public_keys, note: "Teach public keys that verify stamps, receipts, and the instructor keyring"}
        - {name: encryption_key, note: "Teach public key that sealed envelopes are encrypted to"}
        - {name: revoked, note: "set true by Reach::Enroll.mark_revoked! with revoked_reason, revoked_at, and optional replacement"}
        - {name: last_checked_at, note: "rewritten only when something else changed or the stored value is an hour old"}
        - {name: wire_contract_sha256, note: "Teach wire digest this install enrolled against"}
      lifecycle: L2
      standards: [STD-STATE-FILE-HELD, STD-ENROLL-PASSWORD, STD-FINGERPRINT-SALT-KEPT]
    - name: install key
      store: S2
      purpose: The private signing key of this install, used to sign requests, sealed envelopes, and receipt acknowledgements.
      key: [install_id]
      data_class: credential
      owner: Reach::Enroll
      source: lib/reach/enroll.rb Reach::Enroll
      notable_columns:
        - {name: install.pem, note: "private key PEM in the keys folder (mode 0700); never sent"}
      standards: [STD-ENROLL-NO-RELAY, STD-VAULT-PRIVATE]
    - name: pending enrollment key
      store: S2
      purpose: The key made for an enrollment attempt before it succeeds, so a retried attempt keeps one identity.
      key: [attempt id]
      data_class: credential
      owner: Reach::EnrollOutbox
      source: lib/reach/enroll_outbox.rb Reach::EnrollOutbox.key_file
      notable_columns:
        - {name: install.pem.attempt, note: "held key for the attempt in the outbox; removed when the outbox is cleared"}
        - {name: pending_key.pem, note: "enrollment-state copy named by Reach::Paths.enroll_pending_key_file"}
      standards: [STD-ENROLL-LOCKDOWN]
    - name: enrollment stamp
      store: S2
      purpose: The Teach-signed statement that binds this install to a student, course, and fingerprint, checked on every lock evaluation.
      key: [stamp_id]
      data_class: pii_direct
      owner: Reach::Stamp
      source: lib/reach/stamp.rb Reach::Stamp
      notable_columns:
        - {name: student_id, note: "bound into the signed stamp"}
        - {name: username, note: "bound into the signed stamp"}
        - {name: fingerprint_digest, note: "salted digest compared with the live fingerprint"}
        - {name: fingerprint_strict_digest, note: "stricter digest used when the course policy says strict"}
        - {name: expires_at, note: "an expired stamp makes the lock reason course_ended"}
      relations:
        - {to: install record, via: install_id, kind: belongs_to}
      standards: [STD-ENROLL-LOCKDOWN, STD-INSTRUCTOR-UNLOCK]
    - name: fingerprint record
      store: S2
      purpose: The salted hashes that identify this computer, used to notice a move to another computer.
      key: [schema, salt]
      data_class: pii_derived
      owner: Reach::Fingerprint
      source: lib/reach/fingerprint.rb Reach::Fingerprint
      notable_columns:
        - {name: salt, note: "also kept in the sidecar so a reinstall derives the same digests"}
        - {name: hostname, note: "stored only as a salted hash"}
        - {name: digests, note: "binding and loose digests compared with the stamp"}
      relations:
        - {to: sidecar seal record, via: salt, kind: mirrored_in}
      standards: [STD-FINGERPRINT-SALT-KEPT, STD-FINGERPRINT-OS-USER]
    - name: fingerprint cache
      store: S7
      purpose: A short-lived cache of the live fingerprint so hooks do not recompute it.
      key: [salt]
      data_class: pii_derived
      owner: Reach::Fingerprint
      source: lib/reach/fingerprint.rb Reach::Fingerprint
      notable_columns:
        - {name: ttl, note: "valid for 600 seconds (CACHE_TTL_S)"}
      standards: [STD-FINGERPRINT-SALT-KEPT]
    - name: enrollment flow record
      store: S7
      purpose: The step the chat enrollment dialogue has reached, kept between prompts and deleted when enrollment finishes.
      key: [schema]
      data_class: pii_direct
      owner: Reach::EnrollFlow
      source: lib/reach/enroll_flow.rb Reach::EnrollFlow
      notable_columns:
        - {name: state, note: "the lifecycle column"}
        - {name: code, note: "the course code the student typed; a join credential for the course"}
        - {name: username, note: "typed during the flow"}
        - {name: student_id, note: "typed during the flow"}
        - {name: password_salt, note: "present only between the two password prompts; stripped by without_digest"}
        - {name: password_sha256, note: "salted digest used to compare the repeat entry; stripped by without_digest"}
        - {name: refusals, note: "timestamps of refused attempts that drive the lockout"}
        - {name: locked_until, note: "end of the enrollment lockout"}
      lifecycle: L1
      standards: [STD-ENROLL-PASSWORD, STD-ENROLL-LOCKDOWN, STD-INTERVIEW-ONCE]
    - name: enrollment outbox record
      store: S7
      purpose: The steps of an enrollment attempt reported to Teach as they happen (username, student id, confirmed, password chosen), so Teach can see where a student is stuck.
      key: [attempt id]
      data_class: pii_direct
      owner: Reach::EnrollOutbox
      source: lib/reach/enroll_outbox.rb Reach::EnrollOutbox
      notable_columns:
        - {name: entries, note: "ordered steps from STEPS; the schema is reach.enroll_outbox/v1"}
      relations:
        - {to: pending enrollment key, via: attempt id, kind: uses}
      standards: [STD-ENROLL-NO-RELAY, STD-WIRE-CONTRACT]
    - name: enrollment hand-off files
      store: S7
      purpose: Short-lived files that carry a confirmed identity or an enrollment notice from one process to the next.
      key: [file name]
      data_class: pii_direct
      owner: Reach::Enroll
      source: lib/reach/enroll.rb Reach::Enroll
      notable_columns:
        - {name: pending_identity.json, note: "the identity awaiting confirmation"}
        - {name: just_enrolled.json, note: "course title and time; consumed once by consume_notice"}
      standards: [STD-NOHOOK-ENROLL]
    - name: device move marker
      store: S7
      purpose: Records that the live fingerprint no longer matches the stamp, which locks the install with reason moved until the student re-enrolls.
      key: [stamp_id]
      data_class: operational
      owner: Reach::EnrollmentLock
      source: lib/reach/enrollment_lock.rb Reach::EnrollmentLock.mark_moved!
      notable_columns:
        - {name: changed, note: "names of the fingerprint components that differ"}
        - {name: at, note: "time of the first mismatch; a fingerprint_mismatch integrity event is queued only for the first"}
      relations:
        - {to: enrollment stamp, via: stamp_id, kind: invalidates}
        - {to: outbox entry, via: integrity event, kind: queues}
      lifecycle: L2
      standards: [STD-ENROLL-LOCKDOWN, STD-HARNESS-MOVE]
    - name: login session record
      store: S7
      purpose: The sign-in dialogue state of one chat session.
      key: [session_id]
      data_class: pii_derived
      owner: Reach::Login
      source: lib/reach/login.rb Reach::Login
      notable_columns:
        - {name: state, note: "the lifecycle column"}
        - {name: expires_at, note: "end of the confirmed sign-in, max_hours after confirmation"}
        - {name: reset_required, note: "true while a password reset is forced"}
        - {name: password_salt, note: "set only between the two new-password prompts"}
        - {name: password_sha256, note: "set only between the two new-password prompts"}
      lifecycle: L3
      standards: [STD-SIGNIN-PASSWORD, STD-SIGNIN-ONCE, STD-SIGNIN-TERMINAL-RESET, STD-PASSWORD-RESET-QUEUE]
    - name: sign-in record
      store: S7
      purpose: The computer-wide record that someone is signed in, shared by all chats and the terminal.
      key: [schema]
      data_class: pii_direct
      owner: Reach::Login
      source: lib/reach/login.rb Reach::Login.sign_in!
      notable_columns:
        - {name: student_id, note: "the enrolled student"}
        - {name: state, note: "signed_in or signed_out; signed_out carries a reason such as lockout"}
        - {name: expires_at, note: "end of the sign-in window"}
      lifecycle: L4
      standards: [STD-SIGNIN-PASSWORD, STD-SIGNIN-ONCE]
    - name: login failures record
      store: S7
      purpose: Counts recent failed sign-in answers and the lockout they cause.
      key: [schema]
      data_class: operational
      owner: Reach::Login
      source: lib/reach/login.rb Reach::Login.failures_data
      notable_columns:
        - {name: failures, note: "timestamps inside the failure window"}
        - {name: locked_until, note: "end of the lockout; cleared by an instructor reset or a lifted lockout"}
        - {name: reported_sessions, note: "at most 500 session keys already reported"}
      standards: [STD-SIGNIN-PASSWORD, STD-PASSWORD-RESET-QUEUE]
    - name: password verifier files
      store: S7
      purpose: The local material that checks a typed password and tracks reset permission without keeping the password.
      key: [file name]
      data_class: credential
      owner: Reach::Password
      source: lib/reach/password.rb Reach::Password
      notable_columns:
        - {name: verifier.json, note: "salted verifier; never the password"}
        - {name: password_state.json, note: "reset-required and pickup state"}
        - {name: renewed.json, note: "marks a password change"}
        - {name: reset_probe.json, note: "cache of whether Teach allows a reset"}
        - {name: just_confirmed.json, note: "sessions to tell once that they are signed in"}
      standards: [STD-SIGNIN-PASSWORD, STD-ENROLL-PASSWORD, STD-PASSWORD-RESET-QUEUE]
    - name: consent record
      store: S7
      purpose: A question rEach asked the student itself and the student's typed yes or no, so a risky action only runs after consent that the agent cannot forge.
      key: [kind, subject_digest, asked_at]
      data_class: audit
      owner: Reach::Consent
      source: lib/reach/consent.rb Reach::Consent
      notable_columns:
        - {name: kind, note: "one of Reach::Consent::KINDS"}
        - {name: subject_digest, note: "SHA-256 of the canonical subject the answer is bound to"}
        - {name: answer, note: "yes or no, captured from the student's own prompt"}
        - {name: used_at, note: "set when take! spends a yes or a no is cleared"}
        - {name: student_id, note: "the enrolled student when asked"}
      lifecycle: L12
      standards: [STD-CONSENT-FROM-REACH, STD-SUBMIT-APPROVAL]
    - name: instructor unlock record
      store: S1
      purpose: The unlock code of an instructor on a computer that is not enrolled as a student, and the per-chat passes granted on an enrolled computer.
      key: [code id]
      data_class: credential
      owner: Reach::Instructor
      source: lib/reach/instructor.rb Reach::Instructor
      notable_columns:
        - {name: instructor.json, note: "holds the code; mode 0600; moved to .backup without the code field on lock"}
        - {name: instructor_passes.json, note: "sealed per-chat passes; never holds the code or its signature"}
        - {name: instructor_pass.key, note: "install-local HMAC secret that seals the passes"}
      standards: [STD-INSTRUCTOR-UNLOCK, STD-INSTRUCTOR-PERSONA]
    - name: instructor keyring cache
      store: S1
      purpose: The cached copy of Teach's instructor keyring used to verify unlock codes offline.
      key: [signing_key_id]
      data_class: configuration
      owner: Reach::InstructorKeyring
      source: lib/reach/instructor_keyring.rb Reach::InstructorKeyring
      notable_columns:
        - {name: issued_at, note: "an older keyring than the cached one is dropped"}
        - {name: retired_key_ids, note: "keys never pinned"}
        - {name: revoked code ids, note: "codes that relock the next prompt"}
      standards: [STD-INSTRUCTOR-UNLOCK]
    - name: instructor persona record
      store: S1
      purpose: Points a test-student persona home and workspace for an instructor who tries the student experience.
      key: [persona id]
      data_class: operational
      owner: Reach::Persona
      source: lib/reach/persona.rb Reach::Persona
      notable_columns:
        - {name: id, note: "eight hex characters (PERSONA_ID)"}
      relations:
        - {to: rEach home of the signed-in identity, via: personas/<id>, kind: owns}
      standards: [STD-INSTRUCTOR-PERSONA]
    - name: security validation state
      store: S1
      purpose: The progress of the fabricated-data validation pass that must pass before a student may give an identity or password.
      key: [session_id]
      data_class: operational
      owner: Reach::Validation
      source: lib/reach/validation.rb Reach::Validation
      notable_columns:
        - {name: phase, note: "the lifecycle column"}
        - {name: receipt, note: "the verified validation receipt from Teach"}
        - {name: qualification_id, note: "pattern vq_ plus 24 hex characters"}
      lifecycle: L5
      standards: [STD-HOOK-RESPONSIVE]
    - name: course status cache
      store: S7
      purpose: The last course status from Teach (assignments, due times, policy, transcript settings), used offline and by hooks.
      key: [course id]
      data_class: course_content
      owner: Reach::Sync
      source: lib/reach/sync.rb Reach::Sync.cached_status
      notable_columns:
        - {name: transcripts, note: "send_interval_s, parts, and kinds that the stream honors"}
        - {name: late_assignments, note: "entries that may carry rolling_until"}
      standards: [STD-COURSE-PROFILE, STD-LATE-WORK, STD-TRANSCRIPT-STREAM]
    - name: course package
      store: S6
      purpose: A sealed package of course material delivered for guardrails, workspace, or shape, stored by version.
      key: [kind, version]
      data_class: course_content
      owner: Reach::Packages
      source: lib/reach/packages.rb Reach::Packages
      notable_columns:
        - {name: content_digest, note: "also the ETag sent as If-None-Match on the next fetch"}
      standards: [STD-WIRE-CONTRACT, STD-HANDOUT-PARITY]
    - name: guardrails vault
      store: S5
      purpose: The decrypted guardrails and the reference blobs, read only by the guardrails, directives, seal, and suite modules.
      key: [version]
      data_class: course_content
      owner: Reach::Guardrails
      source: lib/reach/guardrails.rb Reach::Guardrails
      notable_columns:
        - {name: reference, note: "folder of reference blobs read by Reach::Reference; media types limited to text/markdown and text/plain"}
      standards: [STD-VAULT-PRIVATE, STD-DIRECTIVES-CARRY-NO-SECRETS]
    - name: suite and shape vaults
      store: S5
      purpose: The decrypted qualification suite and the shape tooling kept for local checks.
      key: [folder]
      data_class: course_content
      owner: Reach::Suite
      source: lib/reach/suite.rb Reach::Suite
      notable_columns:
        - {name: shape/.version, note: "marker compared by Reach::Sync before shape tooling is refreshed"}
      standards: [STD-VAULT-PRIVATE]
    - name: qualification run directory
      store: S5
      purpose: Scratch output of one local qualification pass for a slice.
      key: [slice, pass name]
      data_class: operational
      owner: Reach::Qualify
      source: lib/reach/qualify.rb Reach::Qualify
      notable_columns:
        - {name: name, note: "stub or pass"}
      standards: [STD-VAULT-PRIVATE, STD-QUALIFY-LOCAL-UNABLE]
    - name: seal record
      store: S5
      purpose: The sealed state that lets rEach vouch for the workspace and supplies the ledger key.
      key: [version]
      data_class: credential
      owner: Reach::Seal
      source: lib/reach/seal.rb Reach::Seal
      notable_columns:
        - {name: seal.yml, note: "in the guardrails vault; students are never told the mechanism"}
      standards: [STD-SEAL-INVISIBLE, STD-VAULT-PRIVATE]
    - name: slice marker
      store: S3
      purpose: Identifies a slice workspace and carries its assignment facts from the package.
      key: [course, assignment, cutout_id, slice]
      data_class: course_content
      owner: Reach::Workspace
      source: lib/reach/workspace.rb Reach::Workspace.write_marker
      notable_columns:
        - {name: due, note: "drives the late-work notices"}
        - {name: owned_files, note: "the only files the student may change"}
        - {name: package_version, note: "package this workspace was provisioned from"}
      lifecycle: L10
      standards: [STD-WORKSPACE-LAYOUT, STD-LATE-WORK]
    - name: delivered digests
      store: S3
      purpose: Digests of the read-only files delivered and the owned files as delivered, so changes and tampering can be detected and archives can leave delivered files out.
      key: [workspace]
      data_class: course_content
      owner: Reach::Workspace
      source: lib/reach/workspace.rb Reach::Workspace.write_delivered_digests
      notable_columns:
        - {name: readonly, note: "path to digest of each locked delivered file"}
        - {name: owned, note: "path to digest of each owned file as delivered"}
      standards: [STD-SUBMIT-ARCHIVE, STD-QUALIFY-BEFORE-SUBMIT]
    - name: slice plan
      store: S3
      purpose: The student's plan for the slice, audited before qualification when the plan audit is on.
      key: [workspace]
      data_class: pii_direct
      owner: Reach::Plan
      source: lib/reach/plan.rb Reach::Plan
      notable_columns:
        - {name: text fields, note: "limited to 400 characters (TEXT_LIMIT)"}
        - {name: list fields, note: "limited to 12 items of 200 characters"}
      standards: [STD-PLAN-AUDIT, STD-CHECKPOINT-AUTOSAVE]
    - name: qualification record
      store: S3
      purpose: The result of the last qualification attempt for a slice, which a submission requires to be passed and current.
      key: [slice, attempt]
      data_class: operational
      owner: Reach::Qualify
      source: lib/reach/qualify.rb Reach::Qualify.write_record
      notable_columns:
        - {name: passed, note: "true only when nothing is pending and no finding remains"}
        - {name: pending, note: "true while the course server has not finished"}
        - {name: files_digest, note: "a record is current only while this still matches the files"}
        - {name: tests_digest, note: "same check for the student's own tests"}
        - {name: qualification_id, note: "Teach's id for the remote run"}
      relations:
        - {to: attempt ladder state, via: slice, kind: counts_into}
      lifecycle: L7
      standards: [STD-QUALIFY-BEFORE-SUBMIT, STD-WEIGHTED-PASSES, STD-QUALIFY-FAULTS]
    - name: pass candidates
      store: S3
      purpose: The multi-pass candidate folders, scores, and picks recorded for the weighted passes standard.
      key: [workspace, point, candidate number]
      data_class: operational
      owner: Reach::Passes
      source: lib/reach/passes.rb Reach::Passes
      notable_columns:
        - {name: score.json, note: "score per point"}
        - {name: pick.json, note: "the chosen candidate"}
      standards: [STD-WEIGHTED-PASSES, STD-PATTERN-LEDGER]
    - name: sidecar receipt
      store: S3
      purpose: The receipt file placed in the slice so a later session can see what was submitted.
      key: [workspace]
      data_class: audit
      owner: Reach::Packet
      source: lib/reach/packet.rb Reach::Packet
      notable_columns:
        - {name: sidecar-receipt.json, note: "file name in the .reach folder"}
      standards: [STD-PACKET-IMPORT, STD-SUBMIT-ARCHIVE]
    - name: course folder harness files
      store: S3
      purpose: The generated rules and harness configuration files rEach writes into each course folder, recognised by content so an uninstall can remove only them.
      key: [path]
      data_class: configuration
      owner: Reach::Harness
      source: lib/reach/harness.rb Reach::Harness
      notable_columns:
        - {name: AGENTS.md CLAUDE.md GEMINI.md, note: "write-protected rules files"}
        - {name: .claude/settings.json .mcp.json .codex/config.toml, note: "hook and tool entries pointing at rEach"}
        - {name: .reach-space.json, note: "space marker in the extracurricular folder"}
      standards: [STD-HOOK-HARNESS, STD-CODEX-PLUGIN-HOOKS, STD-UNINSTALL]
    - name: student work files
      store: S3
      purpose: The files the student and the AI write in the owned slots of a slice; the content that is submitted.
      key: [workspace, relative path]
      data_class: pii_direct
      owner: the student and the AI agent
      source: lib/reach/workspace.rb Reach::Workspace.owned_files
      notable_columns:
        - {name: owned_files, note: "list from the slice marker; all other files are delivered read-only"}
      standards: [STD-WORKSPACE-LAYOUT, STD-CHECKPOINT-AUTOSAVE, STD-SUBMIT-ARCHIVE]
    - name: imported materials
      store: S3
      purpose: Files the student drops into a chat that rEach copies into the space's materials folder, with a log of each copy.
      key: [space, name]
      data_class: pii_direct
      owner: Reach::Imports
      source: lib/reach/imports.rb Reach::Imports.import!
      notable_columns:
        - {name: digest, note: "SHA-256 of the stored copy"}
        - {name: source_name, note: "original file name"}
        - {name: student_id, note: "written on each line of the import log state/imports.jsonl"}
        - {name: limits, note: "20 MiB per file and 200 MiB per space by default, tunable by config"}
      standards: [STD-PACKET-IMPORT, STD-STORAGE-GATES]
    - name: extracurricular space files
      store: S4
      purpose: The marker and README of the folder where the student builds anything that is not graded.
      key: [path]
      data_class: configuration
      owner: Reach::Workspace
      source: lib/reach/workspace.rb Reach::Workspace.write_extracurricular_marker
      notable_columns:
        - {name: .reach-space.json, note: "schema reach.space/v1 with kind extracurricular and the course id"}
        - {name: README.md, note: "written once; says what the hidden folder holds"}
      standards: [STD-WORKSPACE-LAYOUT, STD-CHECKPOINT-AUTOSAVE]
    - name: attempt ladder state
      store: S7
      purpose: Counts failed qualifications per slice and tracks the instructor hand and the student's consent to continue.
      key: [slice]
      data_class: operational
      owner: Reach::Ladder
      source: lib/reach/ladder.rb Reach::Ladder
      notable_columns:
        - {name: failed, note: "the counter; notice from 2, hand at 3, hard stop at 10"}
        - {name: hand_id, note: "the agent hand raised at the third failure"}
        - {name: consent_at, note: "set when the student agrees to continue after the hand"}
        - {name: history, note: "last 20 attempts"}
      relations:
        - {to: open hands tracker, via: hand_id, kind: waits_on}
      lifecycle: L6
      standards: [STD-ATTEMPT-LADDER, STD-HAND-TYPES]
    - name: submit gate counter
      store: S7
      purpose: Remembers that the same set of pre-submission findings was shown once, so a repeat is let through.
      key: [slice]
      data_class: operational
      owner: Reach::Submit
      source: lib/reach/submit.rb Reach::Submit.check_gate!
      notable_columns:
        - {name: digest, note: "digest of the finding ids"}
        - {name: count, note: "the second consecutive time lets the submission continue"}
      standards: [STD-CHECK-BEFORE-SUBMIT, STD-SUBMIT-REFUSALS]
    - name: witness ledger
      store: S10
      purpose: A tamper-evident chain of events per slice.
      key: [slice, n]
      data_class: audit
      owner: Reach::Ledger
      source: lib/reach/ledger.rb Reach::Ledger.append
      notable_columns:
        - {name: student_id, note: "written on each record; lets a checkpoint store be matched to its student"}
        - {name: prev, note: "tag of the previous record"}
        - {name: gv, note: "guardrails version when the key came from the seal"}
        - {name: kind, note: "event kind such as session, qualify, submit, checkpoint"}
      standards: [STD-SEAL-INVISIBLE, STD-CHECKPOINT-AUTOSAVE]
    - name: ledger key
      store: S7
      purpose: The local HMAC key of the witness ledger when the seal supplies none.
      key: [file]
      data_class: credential
      owner: Reach::Ledger
      source: lib/reach/ledger.rb Reach::Ledger.local_key
      notable_columns:
        - {name: ledger.key, note: "64 hex characters, mode 0600"}
      standards: [STD-SEAL-INVISIBLE]
    - name: outbox entry
      store: S8
      purpose: A request waiting to be sent to Teach, replayed with its idempotency key until Teach accepts or refuses it.
      key: [idempotency_key]
      data_class: pii_derived
      owner: Reach::Submit
      source: lib/reach/submit.rb Reach::Submit
      notable_columns:
        - {name: kind, note: "submission, hand, or integrity; issue reports are written as hand entries with an issue field"}
        - {name: route, note: "the wire route the body is posted to"}
        - {name: body, note: "the sealed envelope; the bundle inside is encrypted to Teach"}
        - {name: attempts and next_at, note: "backoff for issue entries only"}
      relations:
        - {to: receipt, via: submission_id, kind: settled_by}
        - {to: open hands tracker, via: hand_id, kind: settled_by}
      lifecycle: L9
      standards: [STD-SUBMIT-APPROVAL, STD-ISSUES, STD-SUBMIT-PARTIAL]
    - name: rejected submission shelf
      store: S8
      purpose: Submissions Teach refused for good, kept so the student can be told once and the work resent after a fix.
      key: [idempotency_key]
      data_class: pii_derived
      owner: Reach::Submit
      source: lib/reach/submit.rb Reach::Submit.shelve_rejected
      notable_columns:
        - {name: rejected_at, note: "time of the refusal"}
        - {name: rejection, note: "code and reason from Teach"}
      standards: [STD-SUBMIT-REFUSALS]
    - name: open hands tracker
      store: S2
      purpose: Remembers each raised hand that has no final answer, so replies can be polled and shown.
      key: [hand_id]
      data_class: operational
      owner: Reach::Hands
      source: lib/reach/hands.rb Reach::Hands.open_hands_file
      notable_columns:
        - {name: reply, note: "latest reply from Teach, including the author class (instructor or technical support)"}
        - {name: polled_at, note: "polling spaced at least 60 seconds apart"}
        - {name: originator, note: "student, agent, or reach"}
        - {name: slice, note: "workspace folder name"}
      relations:
        - {to: attempt ladder state, via: hand_id, kind: reset_by_reply}
        - {to: issues registry, via: hand_id, kind: status_feeds}
      lifecycle: L8
      standards: [STD-HAND-TYPES, STD-ATTEMPT-LADDER, STD-WELLBEING-DELIVERED]
    - name: receipt
      store: S9
      purpose: A Teach-signed receipt that a submission was ingested or graded, or that a validation passed, verified on arrival.
      key: [receipt_id]
      data_class: audit
      owner: Reach::Receipts
      source: lib/reach/receipts.rb Reach::Receipts.store
      notable_columns:
        - {name: kind, note: "ingest, grade, or validation (ON_RECORD_KINDS)"}
        - {name: student_id, note: "the student the receipt is for"}
        - {name: signature, note: "PSS signature verified against signing_public_keys"}
      relations:
        - {to: receipt acknowledgement, via: receipt_id, kind: acknowledged_by}
      lifecycle: L10
      standards: [STD-SUBMIT-ARCHIVE, STD-GRADE-VIEW]
    - name: receipt acknowledgement
      store: S9
      purpose: The signed acknowledgement of a receipt that rEach sends to Teach so the receipt is linked.
      key: [receipt_id]
      data_class: audit
      owner: Reach::ReceiptAcks
      source: lib/reach/receipt_acks.rb Reach::ReceiptAcks
      notable_columns:
        - {name: state, note: "pending, linked, mismatch, or refused"}
        - {name: ack.signature, note: "install-key signature over the canonical body"}
        - {name: last_error, note: "latest failure text"}
      lifecycle: L11
      standards: [STD-SUBMIT-ARCHIVE]
    - name: grade poll marker
      store: S7
      purpose: A timestamp file that spaces out grade-receipt polling per submission.
      key: [submission_id]
      data_class: operational
      owner: Reach::Receipts
      source: lib/reach/receipts.rb Reach::Receipts.poll_marker
      notable_columns:
        - {name: POLL_INTERVAL_S, note: "30 seconds"}
      standards: [STD-GRADE-VIEW]
    - name: issues registry
      store: S7
      purpose: The signatures of faults rEach hid from the student, with counts, the daily budget, and what has been raised and fixed.
      key: [signature]
      data_class: operational
      owner: Reach::Issues
      source: lib/reach/issues.rb Reach::Issues
      notable_columns:
        - {name: count and window, note: "occurrences in the repeat window"}
        - {name: pending, note: "the record that becomes the issue hand; holds the redacted fault frames, never a message or path"}
        - {name: raised_version, note: "an issue is raised once per signature per rEach version"}
        - {name: hand_id and sent_at, note: "set once the hand is delivered"}
        - {name: fix_version, note: "from the hand status; a newer or equal running version prints the fixed notice"}
        - {name: told and told_fixed, note: "flags so each notice is shown once"}
      relations:
        - {to: outbox entry, via: hand_ref, kind: queues}
        - {to: open hands tracker, via: hand_id, kind: status_from}
      lifecycle: L13
      retention: "at most 200 signatures; entries untouched for 30 days with nothing pending are dropped"
      standards: [STD-ISSUES, STD-KNOWN-ISSUES, STD-SEAL-INVISIBLE]
    - name: live session state
      store: S7
      purpose: The one live session this install may have with the instructors, its inbox, and the actions waiting for the student's yes.
      key: [session id]
      data_class: operational
      owner: Reach::Live
      source: lib/reach/live.rb Reach::Live
      notable_columns:
        - {name: session.state, note: "the lifecycle column"}
        - {name: actions, note: "list of requested actions each with a status"}
        - {name: outgoing, note: "the staged message waiting for the student's yes, at most 2000 bytes"}
        - {name: inbox.jsonl, note: "messages received from the instructor side"}
      lifecycle: L14
      standards: [STD-LIVE, STD-LIVE-DIAGNOSIS]
    - name: update manifest
      store: S1
      purpose: Records every phase of an automatic update so an interrupted update resumes and a bad target is not retried forever.
      key: [target_version]
      data_class: operational
      owner: Reach::Update
      source: lib/reach/update.rb Reach::Update
      notable_columns:
        - {name: phase, note: "the lifecycle column"}
        - {name: target_commit, note: "commit chosen at discovery; the staged archive's ZIP comment must equal it"}
        - {name: attempts, note: "capped by the maximum attempts"}
        - {name: staged_path and backup_path, note: "folders under updates/ and .backup"}
      lifecycle: L16
      standards: [STD-AUTO-UPDATE, STD-STABLE-CADENCE, STD-APP-COPY-UPDATE]
    - name: relocation record
      store: S2
      purpose: The journal that makes the move from the legacy home to the home inside the workspace resumable and verifiable.
      key: [id]
      data_class: operational
      owner: Reach::Relocation
      source: lib/reach/relocation.rb Reach::Relocation
      notable_columns:
        - {name: phase, note: "the lifecycle column"}
        - {name: manifest_digest, note: "root digest of the copied tree"}
        - {name: from_home and to_home, note: "recorded as paths of the two homes"}
        - {name: relocation.jsonl, note: "the journal the resume check must parse"}
      lifecycle: L17
      standards: [STD-HOME-IN-WORKSPACE, STD-USER-HOME]
    - name: import job
      store: S11
      purpose: A background import of another AI system's conversation export into the microbrain.
      key: [id]
      data_class: pii_direct
      owner: Reach::ExportImport
      source: lib/reach/export_import.rb Reach::ExportImport
      notable_columns:
        - {name: state, note: "the lifecycle column"}
        - {name: phase, note: "queued, then the worker phases, then finished, failed, or cancelled"}
        - {name: mode, note: "brain or copy"}
        - {name: vendor, note: "chatgpt, claude, or gemini"}
        - {name: error, note: "spawn, stalled, source_changed, time_limit, or element_limit"}
      lifecycle: L18
      standards: [STD-EXPORT-IMPORT, STD-STORAGE-GATES, STD-BRAIN]
    - name: microbrain state
      store: S11
      purpose: The microbrain's session records, lexical index, and ingest records.
      key: [session id]
      data_class: pii_derived
      owner: Reach::Brain
      source: lib/reach/brain.rb Reach::Brain
      notable_columns:
        - {name: state.json, note: "counters and budgets for finding writes"}
        - {name: sessions/<id>.json, note: "per-session recall bookkeeping; the last 50 are kept"}
        - {name: index.json, note: "lexical index of findings"}
        - {name: course-ingest.json, note: "fingerprint of the course material already admitted"}
      standards: [STD-BRAIN, STD-COURSE-CORPUS]
    - name: brain spool
      store: S11
      purpose: The append-only day files of private sources and findings, admitted into the planes corpus.
      key: [date, line]
      data_class: pii_direct
      owner: Reach::BrainSpool
      source: lib/reach/brain_spool.rb Reach::BrainSpool
      notable_columns:
        - {name: tier, note: "private for every line"}
        - {name: operation_id and revision, note: "stamp fields added to each line"}
        - {name: admitted/, note: "day files already admitted"}
      relations:
        - {to: planes corpus, via: admission, kind: feeds}
      retention: "capped at 20 MiB; over the cap the oldest sources no finding references are pruned to 80 percent"
      standards: [STD-BRAIN, STD-BRAIN-PLANES]
    - name: planes corpus
      store: S11
      purpose: The corpus plane that admits the spool and answers explicit recall, plus the queue of forgets that could not reach it.
      key: [corpus id]
      data_class: pii_derived
      owner: Reach::BrainPlanes
      source: lib/reach/brain_planes.rb Reach::BrainPlanes
      notable_columns:
        - {name: pending-erase.jsonl, note: "forgets that run before the next admission; mode 0600"}
      standards: [STD-BRAIN-PLANES, STD-BRAIN]
    - name: transcript record
      store: S12
      purpose: The recorded conversation of one session inside the recording bounds, queued for Teach.
      key: [session_id, seq]
      data_class: pii_direct
      owner: Reach::Transcript
      source: lib/reach/transcript.rb Reach::Transcript
      notable_columns:
        - {name: kind, note: "prompt, reply, reasoning, action, output, or code"}
        - {name: part, note: "[n, of] for entries over 120000 bytes"}
        - {name: note, note: "withheld placeholders and subagent markers"}
        - {name: archive, note: "ended sessions are gzipped under archive/"}
      relations:
        - {to: transcript stream state, via: session_id, kind: sent_by}
      standards: [STD-TRANSCRIPT, STD-TRANSCRIPT-STREAM, STD-TRANSCRIPT-DEIDENTIFY, STD-TRANSCRIPT-EXPORT]
    - name: transcript stream state
      store: S7
      purpose: The sender's position and lock so the background stream runs at most once per interval.
      key: [session_id]
      data_class: operational
      owner: Reach::Transcript
      source: lib/reach/transcript.rb Reach::Transcript.stream
      notable_columns:
        - {name: transcript-stream.json, note: "last run time"}
        - {name: transcript-flush.json, note: "state of the flush before a submission"}
      standards: [STD-TRANSCRIPT-STREAM]
    - name: transcript space map
      store: S12
      purpose: Maps a work folder to the space and slice a session belongs to, keyed by a digest of the folder.
      key: [digest]
      data_class: operational
      owner: Reach::Transcript
      source: lib/reach/transcript.rb Reach::Transcript
      notable_columns:
        - {name: digest, note: "digest of the real base path, so no path is stored in the name"}
      standards: [STD-TRANSCRIPT]
    - name: de-identification pseudonym
      store: S7
      purpose: The stable pseudonym and restore key used when a transcript is de-identified before it leaves the computer.
      key: [install_id]
      data_class: pii_derived
      owner: Reach::Deidentify
      source: lib/reach/deidentify.rb Reach::Deidentify
      notable_columns:
        - {name: pseudonym, note: "anon_ plus 32 hex characters"}
        - {name: restore_key, note: "64 hex characters; lets the student map names back locally"}
      standards: [STD-TRANSCRIPT-DEIDENTIFY, STD-TRANSCRIPT-EXPORT]
    - name: checkpoint entry
      store: S13
      purpose: One saved state of a slice's owned files, a numbered entry with a meta file and content-addressed blobs.
      key: [slice, n]
      data_class: pii_direct
      owner: Reach::Checkpoint
      source: lib/reach/checkpoint.rb Reach::Checkpoint.save
      notable_columns:
        - {name: via, note: "write, pre_write, check, provision, restored, manual, or automatic"}
        - {name: digests, note: "path to SHA-256 of each file; the blob lives at blobs/<sha256>"}
        - {name: ledger_head, note: "ties an entry to its student for adoption of an older store"}
        - {name: automatic, note: "automatic entries are hidden from the default list"}
      relations:
        - {to: witness ledger, via: ledger_head, kind: vouched_by}
      lifecycle: L19
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - name: checkpoint state files
      store: S7
      purpose: The salt that keys the checkpoint store, the told-once notice record, the mirror status, and the dismissed folders.
      key: [file name]
      data_class: operational
      owner: Reach::Checkpoint
      source: lib/reach/checkpoint.rb Reach::Checkpoint
      notable_columns:
        - {name: checkpoint-salt.json, note: "32 hex characters, also kept in the sidecar"}
        - {name: checkpoint-notice.json, note: "key of the conditions already told, and cloud_told"}
        - {name: checkpoint-mirror.json, note: "last mirror failure, if any"}
        - {name: checkpoint-dismissed.json, note: "folders whose loss report the student dismissed"}
      lifecycle: L19
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - name: submission archive
      store: S16
      purpose: The ZIP of the student's assignment folder written after a verified ingest receipt or on request.
      key: [file name]
      data_class: pii_direct
      owner: Reach::Archive
      source: lib/reach/archive.rb Reach::Archive
      notable_columns:
        - {name: file name, note: "<assignment>-<email local part>-<YYYYMMDD>.zip, never overwritten (-2, -3 added)"}
        - {name: size limits, note: "config submit.archive_max_mb 256 and submit.archive_all_max_mb 2048"}
      standards: [STD-SUBMIT-ARCHIVE, STD-COURSE-TIME]
    - name: setup log
      store: S14
      purpose: An exhaustive local log of setup and enrollment commands kept until enrollment succeeds, used to build a setup report.
      key: [file name]
      data_class: audit
      owner: Reach::SetupLog
      source: lib/reach/setup_log.rb Reach::SetupLog
      notable_columns:
        - {name: streak, note: "failures in a row; a report is written at the third and every multiple of the threshold"}
        - {name: paths, note: "written with ~ in place of the user folder"}
        - {name: report, note: "reach-setup-report-<time>.json goes to Downloads and is never sent by rEach"}
      retention: "capped at setup_log.max_bytes with the oldest files removed first"
      standards: [STD-SETUP-LOG, STD-USER-HOME]
    - name: request log
      store: S14
      purpose: One line per Teach request with method, redacted route, status, latency, and retries.
      key: [timestamp]
      data_class: audit
      owner: Reach::Client
      source: lib/reach/client.rb Reach::Client
      notable_columns:
        - {name: route, note: "every query value replaced by [redacted]"}
        - {name: feedback requests, note: "not logged"}
      standards: [STD-REQUEST-LOG]
    - name: event logs
      store: S14
      purpose: The other append-only logs, namely workspace events, transcript events, gate refusals, brain events, update and runtime logs, and instructor events.
      key: [log file]
      data_class: audit
      owner: Reach::Debug
      source: lib/reach/debug.rb Reach::Debug.append_log
      notable_columns:
        - {name: workspace.jsonl and transcript.jsonl, note: "ids, counts, and outcomes, never prompt text"}
        - {name: gate-refusals.jsonl, note: "written by Reach::Gate"}
        - {name: instructor.jsonl, note: "instructor events; never the code"}
      standards: [STD-DEBUG-MODE, STD-INSTRUCTOR-UNLOCK]
    - name: student profile
      store: S2
      purpose: The student's interview profile, including the extra credit list that syncs with Teach.
      key: [student]
      data_class: pii_direct
      owner: Reach::Profile
      source: lib/reach/profile.rb Reach::Profile
      notable_columns:
        - {name: profile.yml, note: "mode 0600; sent only inside a hand bundle the student agreed to include it in"}
        - {name: extra_credit, note: "the one part that syncs with Teach"}
      standards: [STD-PROFILE-LOCAL, STD-EXTRA-CREDIT, STD-INTERVIEW-ONCE]
    - name: sidecar seal record
      store: S15
      purpose: Facts that must survive a reinstall of rEach on the same computer.
      key: [sidecar_id]
      data_class: pii_derived
      owner: Reach::Sidecar
      source: lib/reach/sidecar.rb Reach::Sidecar
      notable_columns:
        - {name: installs, note: "install_id, student_id, teach_url, and enrolled_at of earlier installs"}
        - {name: heads, note: "ledger heads"}
      relations:
        - {to: fingerprint record, via: salt, kind: mirrors}
      standards: [STD-FINGERPRINT-SALT-KEPT, STD-SEAL-INVISIBLE]
    - name: progress record
      store: S7
      purpose: The milestones reached in setup and course work that are reported to Teach in batches.
      key: [student_id]
      data_class: operational
      owner: Reach::Progress
      source: lib/reach/progress.rb Reach::Progress
      notable_columns:
        - {name: reached, note: "milestone to time"}
        - {name: sent, note: "milestones already delivered"}
        - {name: student_id, note: "written when enrolled"}
      standards: [STD-PROGRESS]
    - name: holdings report state
      store: S7
      purpose: Remembers the digest of what this install holds so unchanged holdings are not re-reported.
      key: [digest]
      data_class: operational
      owner: Reach::Holdings
      source: lib/reach/holdings.rb Reach::Holdings
      notable_columns:
        - {name: unsupported_until, note: "set when Teach does not support the route, pausing reports for 6 hours"}
      standards: [STD-HOLDINGS]
    - name: assignment threads
      store: S7
      purpose: The assignment-context threads and the active thread per space, bounded by the behavior policy.
      key: [thread id]
      data_class: operational
      owner: Reach::Threads
      source: lib/reach/threads.rb Reach::Threads
      notable_columns:
        - {name: max_threads, note: "from the assignment_context policy, default 64"}
      standards: [STD-ASSIGNMENT-CONTEXT, STD-NO-SLICE-MESSAGE]
    - name: module transfer request
      store: S7
      purpose: The student's request to change course modules and Teach's answer.
      key: [transfer_id]
      data_class: operational
      owner: Reach::Transfer
      source: lib/reach/transfer.rb Reach::Transfer
      notable_columns:
        - {name: state, note: "the lifecycle column"}
        - {name: off_until, note: "24 hour pause after a closed request"}
        - {name: student_id, note: "written on save"}
      lifecycle: L21
      standards: [STD-MODULES-LOCK-SYNC, STD-MODULES-PENDING]
    - name: module selection
      store: S7
      purpose: The modules Teach assigned, the pending selection, and a history of past assignments.
      key: [module id]
      data_class: course_content
      owner: Reach::Modules
      source: lib/reach/modules.rb Reach::Modules
      notable_columns:
        - {name: current.json, note: "schema teach.module-assignment/v1"}
        - {name: pending.json, note: "schema reach.module-selection/v1"}
        - {name: history/, note: "earlier assignments"}
      standards: [STD-MODULES-LOCK-SYNC, STD-MODULES-PENDING]
    - name: student part answers
      store: S7
      purpose: The student's own answers to the questions an assignment requires before submission.
      key: [course, assignment, question id]
      data_class: pii_direct
      owner: Reach::Part
      source: lib/reach/part.rb Reach::Part
      notable_columns:
        - {name: answers, note: "text, word count, session, and sequence of the recorded prompt"}
        - {name: pending.json, note: "the answer awaiting the student's confirmation within 30 minutes"}
      standards: [STD-TRANSCRIPT, STD-QUALIFY-BEFORE-SUBMIT]
    - name: feedback store
      store: S7
      purpose: The feedback the student wrote through rEach, with its delivery state and Teach's replies.
      key: [local_id]
      data_class: pii_direct
      owner: Reach::Feedback
      source: lib/reach/feedback.rb Reach::Feedback
      notable_columns:
        - {name: state, note: "the lifecycle column"}
        - {name: anonymous, note: "an anonymous item drops its feedback id after sending and its time is truncated to the day"}
        - {name: idempotency_key, note: "kept only while pending"}
      lifecycle: L22
      standards: [STD-FEEDBACK]
    - name: support state
      store: S7
      purpose: The time and result of the last wellbeing support hand, so one is not raised twice within an hour.
      key: [file]
      data_class: operational
      owner: Reach::Support
      source: lib/reach/support.rb Reach::Support
      notable_columns:
        - {name: last_raised_at, note: "RECENT_S is 3600 seconds"}
        - {name: last_state, note: "told or queued"}
      standards: [STD-WELLBEING-DELIVERED]
    - name: link state
      store: S2
      purpose: Rate limits on the calm messages shown when Teach cannot be reached and on faults reported for client-side errors.
      key: [file]
      data_class: operational
      owner: Reach::Link
      source: lib/reach/link.rb Reach::Link
      notable_columns:
        - {name: hiccup_quiet_minutes, note: "default 15"}
        - {name: fault_max_per_hour, note: "default 60"}
      standards: [STD-TEACH-LINK]
    - name: subscription state
      store: S7
      purpose: What the background subscription last saw (course update, grade, hand reply, extra credit, receipt) and when it last ran.
      key: [file]
      data_class: operational
      owner: Reach::Subscribe
      source: lib/reach/subscribe.rb Reach::Subscribe
      notable_columns:
        - {name: notices, note: "kinds from NOTICE_KINDS"}
        - {name: source, note: "session or background"}
      standards: [STD-TEACH-SUBSCRIBE, STD-SUBSCRIBE-STALE-SIGNATURE]
    - name: request rate buckets
      store: S7
      purpose: The token buckets that pace requests to Teach across processes.
      key: [bucket name]
      data_class: operational
      owner: Reach::Client
      source: lib/reach/client.rb Reach::Client.try_take
      notable_columns:
        - {name: tokens, note: "refilled by elapsed time"}
        - {name: updated_at, note: "monotonic wall time of the last take"}
      standards: [STD-WIRE-CONTRACT]
    - name: hook liveness records
      store: S1
      purpose: Whether the harness's hooks have been seen to run, used to refuse work that needs hooks and to explain it.
      key: [file name]
      data_class: operational
      owner: Reach::HookLiveness
      source: lib/reach/hook_liveness.rb Reach::HookLiveness
      notable_columns:
        - {name: hooks_seen.json, note: "work_at, prompt_at, session_at, session_label"}
        - {name: hooks_enroll_seen.json, note: "enrollment hook sightings"}
      standards: [STD-HOOK-HARNESS, STD-SIGNIN-PLUGIN-HOOK]
    - name: hook once markers
      store: S1
      purpose: One empty-ish file per hook turn that stops two hooks from both answering the same prompt.
      key: [digest of kind, session, token]
      data_class: operational
      owner: Reach::Gate
      source: lib/reach/gate.rb Reach::Gate.once!
      notable_columns:
        - {name: ONCE_KEEP_S, note: "kept for one day"}
      standards: [STD-HOOK-RESPONSIVE, STD-CODEX-PLUGIN-HOOKS]
    - name: harness identity records
      store: S1
      purpose: Which AI app each session ran in, with the confidence of that identification, and the marketplace source repoint record.
      key: [session id]
      data_class: operational
      owner: Reach::HarnessIdentity
      source: lib/reach/harness_identity.rb Reach::HarnessIdentity
      notable_columns:
        - {name: harness_sessions.json, note: "at most 64 sessions and 14 days"}
        - {name: confidence, note: "verified, inferred, or weak"}
        - {name: harness-source.json, note: "written by Reach::HarnessSource; marks the once-per-harness repoint to stable"}
      standards: [STD-HARNESS-VERIFIED, STD-AUTO-UPDATE, STD-HARNESS-MOVE]
    - name: codex setup record
      store: S1
      purpose: Remembers what rEach changed in Codex's settings so it can be undone.
      key: [file]
      data_class: configuration
      owner: Reach::CodexSetup
      source: lib/reach/codex_setup.rb Reach::CodexSetup
      notable_columns:
        - {name: sandbox_mode, note: "one of SANDBOX_MODES"}
        - {name: backup, note: "rEach's own copy of Codex's prior settings, restored only for keys still holding the value rEach wrote"}
      standards: [STD-CODEX-SETUP, STD-CODEX-SANDBOX, STD-CODEX-HOOK-TRUST]
    - name: sandbox refusal counters
      store: S7
      purpose: Counts reads and writes the gate refused outside the work folders in a session, to report repeated attempts once.
      key: [session id]
      data_class: operational
      owner: Reach::Gate
      source: lib/reach/gate.rb Reach::Gate.count_outside
      notable_columns:
        - {name: refusals, note: "count"}
        - {name: reported, note: "true after the integrity event was queued"}
      standards: [STD-GUIDED-LEARNER, STD-CODEX-SANDBOX]
    - name: guided learner display state
      store: S7
      purpose: Per-message state for the guided learner's display check, in a directory that must not be a symlink.
      key: [digest of session, turn, message]
      data_class: operational
      owner: Reach::GuidedLearner
      source: lib/reach/guided_learner.rb Reach::GuidedLearner
      notable_columns:
        - {name: directory mode, note: "0700; refused when it is a symlink"}
      standards: [STD-GUIDED-LEARNER, STD-PLAIN-TALK]
    - name: hello context cache
      store: S7
      purpose: The session-start context and the lock of the background refresh.
      key: [session id]
      data_class: operational
      owner: Reach::Hello
      source: lib/reach/hello.rb Reach::Hello
      notable_columns:
        - {name: context.json, note: "sessions and their order"}
      standards: [STD-HOOK-RESPONSIVE]
    - name: storage measure state
      store: S7
      purpose: The last measured bytes of the corpus and microbrain and which warning thresholds were told.
      key: [file]
      data_class: operational
      owner: Reach::Storage
      source: lib/reach/storage.rb Reach::Storage
      notable_columns:
        - {name: warn_mb, note: "512, 1024, and 2048 by default"}
        - {name: demand_mb, note: "4096 by default; a new import is refused above it"}
      standards: [STD-STORAGE-GATES]
    - name: integrity seen list
      store: S7
      purpose: Digests of integrity events already queued, so each is reported once.
      key: [digest]
      data_class: operational
      owner: Reach::Integrity
      source: lib/reach/integrity.rb Reach::Integrity
      notable_columns:
        - {name: list length, note: "the last 5000 digests"}
      standards: [STD-SEAL-INVISIBLE, STD-CODEX-PATCH-CHECK]
    - name: hermes state record
      store: S7
      purpose: Remembers where the Hermes configuration lives for this install.
      key: [file]
      data_class: configuration
      owner: Reach::Setup
      source: lib/reach/setup.rb Reach::Setup
      notable_columns:
        - {name: config_path, note: "read by Reach::Harness.hermes_config_path"}
      standards: [STD-HARNESS-MOVE, STD-UNINSTALL]
    - name: Teach URL pointer
      store: S1
      purpose: The Teach URL this root was configured for, read before an install record exists.
      key: [file]
      data_class: configuration
      owner: Reach::Runtime
      source: lib/reach/paths.rb Reach::Paths.teach_url_file
      notable_columns:
        - {name: teach.json, note: "state/teach.json under the install root"}
      standards: [STD-TEACH-URL]
    - name: managed install tree
      store: S1
      purpose: The plugin copy rEach updates itself in, the runtime kit, gems, Chromium, updates, and backups.
      key: [folder]
      data_class: configuration
      owner: Reach::Update
      source: lib/reach/paths.rb Reach::Paths.managed_install_dir
      notable_columns:
        - {name: plugin/VERSION, note: "a managed copy has VERSION and no .git"}
        - {name: updates/staging-<version>-<hex>, note: "staged release before the swap"}
        - {name: .backup, note: "previous plugin copies and failed-<backup> folders"}
        - {name: bin/, note: "launcher shims"}
      standards: [STD-AUTO-UPDATE, STD-APP-COPY-UPDATE, STD-RUBY-BOOTSTRAP]
    - name: forget receipts
      store: S7
      purpose: Receipts of what a checkpoint forget or a transcripts forget deleted, with home-relative paths.
      key: [folder, file]
      data_class: audit
      owner: Reach::Checkpoint
      source: lib/reach/checkpoint.rb Reach::Checkpoint.forget!
      notable_columns:
        - {name: checkpoints-forget/, note: "written by Reach::Checkpoint"}
        - {name: transcripts-forget/, note: "written by Reach::TranscriptExport; says server copies are kept until the instructor erases them"}
      standards: [STD-CHECKPOINT-AUTOSAVE, STD-TRANSCRIPT-EXPORT]
    - name: lock files
      store: S7
      purpose: Advisory lock files that serialize writers across hook, command, and detached processes.
      key: [file name]
      data_class: operational
      owner: Reach::Locks
      source: lib/reach/locks.rb Reach::Locks
      notable_columns:
        - {name: examples, note: "sync.lock, issues.lock, issues.flush.lock, subscribe.lock, storage-<name>.lock, install.yml.lock, transcript-flush.lock"}
      standards: [STD-STATE-FILE-HELD, STD-HOOK-RESPONSIVE]
  lifecycles:
    - id: L1
      name: Chat enrollment flow (enrolled is the removal of the flow file)
      entity: enrollment flow record
      column: state
      states: [awaiting_code, awaiting_validation, awaiting_username, awaiting_student_id, awaiting_confirm, awaiting_move, awaiting_password, awaiting_password_again, enrolled]
      initial: awaiting_code
      terminal: [enrolled]
      transitions:
        - {from: awaiting_code, to: awaiting_validation, by: step_code, guard: "the course code previews successfully on Teach"}
        - {from: awaiting_validation, to: awaiting_username, by: Reach::Validation passing the security validation pass}
        - {from: awaiting_username, to: awaiting_student_id, by: step_username}
        - {from: awaiting_student_id, to: awaiting_confirm, by: step_student_id}
        - {from: awaiting_confirm, to: awaiting_password, by: step_confirm, guard: "the student answers yes"}
        - {from: awaiting_confirm, to: awaiting_code, by: step_confirm, guard: "the student answers no; the outbox is cleared and a fresh flow keeps the refusals"}
        - {from: awaiting_password, to: awaiting_password_again, by: step_password}
        - {from: awaiting_password_again, to: awaiting_password, by: step_password_again, guard: "the repeat differs, or Teach says the password is required or wrong"}
        - {from: awaiting_password_again, to: awaiting_move, by: register, guard: "Teach answers device_move_pending"}
        - {from: awaiting_move, to: awaiting_password, by: step_move, guard: "the student answers yes"}
        - {from: awaiting_move, to: awaiting_code, by: step_move, guard: "the student answers no"}
        - {from: awaiting_password_again, to: awaiting_code, by: register, guard: "Teach answers device_move_denied"}
        - {from: awaiting_password_again, to: awaiting_username, by: refused, guard: "Teach answers enrollment_refused; enough refusals in the window set locked_until"}
        - {from: awaiting_password_again, to: enrolled, by: EnrollFlow.finish, guard: "Teach accepts the registration"}
        - {from: awaiting_validation, to: awaiting_code, by: restart words, guard: "start over, restart, or cancel"}
        - {from: awaiting_username, to: awaiting_validation, by: step, guard: "the validation record is no longer fresh and passed"}
      constants: []
      source: lib/reach/enroll_flow.rb Reach::EnrollFlow
      standards: [STD-ENROLL-PASSWORD, STD-ENROLL-LOCKDOWN, STD-NOHOOK-ENROLL]
    - id: L2
      name: Enrollment lock reason (computed on every call, not stored)
      entity: install record
      column: EnrollmentLock.state reason
      states: [not_enrolled, unlocked, replaced, revoked, moved, restamp, stamp_invalid, course_ended, instructor_revoked]
      initial: not_enrolled
      terminal: []
      transitions:
        - {from: not_enrolled, to: unlocked, by: Reach::Enroll.register_v2 and Reach::EnrollFlow.finish}
        - {from: unlocked, to: revoked, by: Reach::Enroll.mark_revoked!, guard: "called from Sync, Subscribe, Transcript, or Debug when Teach answers revoked or not_enrolled"}
        - {from: unlocked, to: replaced, by: Reach::Enroll.mark_revoked!, guard: "revoked_reason is replaced"}
        - {from: unlocked, to: moved, by: Reach::EnrollmentLock.mark_moved!, guard: "the live fingerprint does not match the stamp"}
        - {from: moved, to: unlocked, by: Reach::EnrollmentLock.clear_moved!, guard: "a device move is re-registered"}
        - {from: unlocked, to: stamp_invalid, by: Reach::EnrollmentLock.reason_for_state, guard: "the stamp or stored fingerprint is missing or does not verify"}
        - {from: unlocked, to: restamp, by: Reach::EnrollmentLock.reason_for_state, guard: "a v1 install has no stamp and the policy requires one"}
        - {from: unlocked, to: course_ended, by: Reach::EnrollmentLock.reason_for_state, guard: "the stamp has expired"}
        - {from: not_enrolled, to: instructor_revoked, by: Reach::Persona, guard: "a persona is active and its instructor unlock is not"}
      constants: []
      source: lib/reach/enrollment_lock.rb Reach::EnrollmentLock
      standards: [STD-ENROLL-LOCKDOWN, STD-INSTRUCTOR-UNLOCK, STD-HARNESS-MOVE]
    - id: L3
      name: Chat sign-in dialogue
      entity: login session record
      column: state
      states: [awaiting_id, awaiting_confirm, awaiting_password, awaiting_new_password, awaiting_new_password_again, confirmed, denied]
      initial: awaiting_id
      terminal: [denied]
      transitions:
        - {from: awaiting_id, to: awaiting_confirm, by: evaluate_id, guard: "the prompt contains the student's ID"}
        - {from: awaiting_confirm, to: awaiting_password, by: evaluate_confirm, guard: "yes and a password is required"}
        - {from: awaiting_confirm, to: confirmed, by: evaluate_confirm, guard: "yes and no password is required"}
        - {from: awaiting_confirm, to: denied, by: evaluate_confirm, guard: "no, which also signs the install out"}
        - {from: awaiting_confirm, to: awaiting_new_password, by: reset_required_decision, guard: "Teach requires a reset"}
        - {from: awaiting_password, to: confirmed, by: evaluate_password, guard: "Password.check is ok"}
        - {from: awaiting_password, to: awaiting_new_password, by: reset_required_decision, guard: "the password is unset or a reset is required"}
        - {from: awaiting_new_password, to: awaiting_new_password_again, by: evaluate_new_password, guard: "the new password is in range"}
        - {from: awaiting_new_password, to: awaiting_password, by: evaluate_new_password, guard: "the student cancels and no reset is forced"}
        - {from: awaiting_new_password_again, to: confirmed, by: evaluate_new_password, guard: "the repeat matches and Password.reset! is ok"}
        - {from: awaiting_new_password_again, to: awaiting_new_password, by: evaluate_new_password, guard: "the repeat differs or Teach is offline"}
        - {from: awaiting_new_password_again, to: awaiting_password, by: evaluate_new_password, guard: "Teach does not allow a reset"}
        - {from: confirmed, to: awaiting_id, by: evaluate, guard: "expires_at has passed"}
        - {from: awaiting_password, to: confirmed, by: Login.sign_in!, guard: "a terminal sign-in confirms every waiting session"}
      constants: [WAITING_STATES, PASSWORD_STATES, RESET_STATES]
      source: lib/reach/login.rb Reach::Login
      standards: [STD-SIGNIN-PASSWORD, STD-SIGNIN-ONCE, STD-SIGNIN-TERMINAL-RESET, STD-PASSWORD-RESET-QUEUE]
    - id: L4
      name: Computer-wide sign-in record
      entity: sign-in record
      column: state
      states: [signed_in, signed_out]
      initial: signed_in
      terminal: []
      transitions:
        - {from: signed_in, to: signed_out, by: Reach::Login.sign_out!, guard: "a lockout, a denied identity, or an explicit sign-out; the reason is recorded"}
        - {from: signed_out, to: signed_in, by: Reach::Login.sign_in!, guard: "a correct terminal password or a confirmed chat"}
      constants: []
      source: lib/reach/login.rb Reach::Login.sign_in!
      standards: [STD-SIGNIN-PASSWORD, STD-SIGNIN-ONCE]
    - id: L5
      name: Security validation pass
      entity: security validation state
      column: phase
      states: [handoff, plan, build, checked, qualified, received, passed, consumed]
      initial: handoff
      terminal: [consumed]
      transitions:
        - {from: handoff, to: plan, by: advance answer, guard: "every fabricated question has an answer"}
        - {from: plan, to: build, by: advance plan, guard: "the plan text is 10 to 400 characters"}
        - {from: build, to: build, by: advance artifact, guard: "an owned file is written; the qualification and check digests are dropped"}
        - {from: build, to: checked, by: advance check, guard: "answers.json preserves every fabricated answer"}
        - {from: checked, to: qualified, by: advance qualify, guard: "Teach answers passed with a vq_ id"}
        - {from: qualified, to: received, by: advance submit, guard: "the receipt verifies"}
        - {from: received, to: passed, by: advance finish, guard: "the fetched receipt equals the stored one"}
        - {from: passed, to: consumed, by: Reach::Validation.enrollment_key!, guard: "the pass is spent on an enrollment"}
      constants: []
      source: lib/reach/validation.rb Reach::Validation.advance
      standards: [STD-ENROLL-PASSWORD, STD-HOOK-RESPONSIVE]
    - id: L6
      name: Qualification attempt ladder
      entity: attempt ladder state
      column: failed (rung computed by Ladder.record)
      states: [silent, notice, hand, continue, stopped, passed]
      initial: silent
      terminal: []
      transitions:
        - {from: silent, to: notice, by: Reach::Ladder.record, guard: "failed reaches NOTICE_FROM, which is 2"}
        - {from: notice, to: hand, by: Reach::Ladder.raise_ladder_hand, guard: "failed reaches HAND_AT, which is 3; further work is held until the student agrees"}
        - {from: hand, to: continue, by: Reach::Ladder.continue!, guard: "a student prompt exists since the hand and failed is still under HARD_STOP"}
        - {from: notice, to: stopped, by: Reach::Ladder.record, guard: "failed reaches HARD_STOP, which is 10"}
        - {from: continue, to: stopped, by: Reach::Ladder.record, guard: "failed reaches HARD_STOP, which is 10"}
        - {from: silent, to: passed, by: Reach::Ladder.reset!, guard: "a qualification passes"}
        - {from: stopped, to: silent, by: Reach::Ladder.reset_for_hand, guard: "an instructor reply arrives for the hand"}
        - {from: hand, to: silent, by: Reach::Ladder.reset_for_hand, guard: "an instructor reply arrives for the hand"}
      constants: []
      source: lib/reach/ladder.rb Reach::Ladder
      standards: [STD-ATTEMPT-LADDER, STD-HAND-TYPES]
    - id: L7
      name: Qualification record
      entity: qualification record
      column: passed and pending
      states: [pending, failed, passed]
      initial: failed
      terminal: []
      transitions:
        - {from: failed, to: passed, by: Reach::Qualify, guard: "a new attempt has no findings and nothing pending"}
        - {from: failed, to: pending, by: Reach::Qualify.pending!, guard: "the course server has not finished or is unavailable"}
        - {from: pending, to: passed, by: Reach::Qualify, guard: "a later attempt resumes the same qualification_id and Teach reports a pass"}
        - {from: pending, to: failed, by: Reach::Qualify, guard: "a later attempt resumes the same qualification_id and Teach reports findings"}
        - {from: passed, to: failed, by: Reach::Qualify, guard: "a new attempt finds a problem; a passed record is also not current once files_digest or tests_digest differs"}
      constants: []
      source: lib/reach/qualify.rb Reach::Qualify
      standards: [STD-QUALIFY-BEFORE-SUBMIT, STD-QUALIFY-REMOTE-BUDGET, STD-ATTEMPT-LADDER]
    - id: L8
      name: Raised hand tracking
      entity: open hands tracker
      column: presence in outbox and in hands/open.json
      states: [queued, open, answered, closed]
      initial: queued
      terminal: [closed]
      transitions:
        - {from: queued, to: open, by: Reach::Submit outbox flush, guard: "Teach accepts and returns a hand_id; Reach::Hands.track records it"}
        - {from: open, to: answered, by: Reach::Hands.poll_replies, guard: "the polled reply differs from the stored one"}
        - {from: open, to: closed, by: Reach::Hands.poll_replies, guard: "Teach reports resolved or closed, or answers 404"}
        - {from: answered, to: closed, by: Reach::Hands.poll_replies, guard: "Teach reports resolved or closed, or answers 404"}
      constants: [AGENT_TYPES, TECHNICAL_TYPES]
      source: lib/reach/hands.rb Reach::Hands
      standards: [STD-HAND-TYPES, STD-WELLBEING-DELIVERED, STD-ATTEMPT-LADDER]
    - id: L9
      name: Submission from approval to receipt
      entity: outbox entry
      column: answer state of Reach::Submit
      states: [asked, declined, queued, delivered, ingested, rejected]
      initial: asked
      terminal: [ingested, rejected, declined]
      transitions:
        - {from: asked, to: declined, by: Reach::Consent, guard: "the student answers no"}
        - {from: asked, to: queued, by: Reach::Submit.submit, guard: "the student answers yes; the sealed submission is written to the outbox"}
        - {from: queued, to: queued, by: Reach::Submit outbox flush, guard: "Teach answers received, or rEach is offline"}
        - {from: queued, to: ingested, by: Reach::Submit.handle_response, guard: "Teach answers ingested with a receipt that verifies; the archive ZIP is written"}
        - {from: queued, to: delivered, by: Reach::Submit.handle_response, guard: "Teach answers a DELIVERED_STATES value without a receipt"}
        - {from: queued, to: rejected, by: Reach::Submit.shelve_rejected, guard: "Teach refuses for good; the entry moves to outbox/rejected"}
      constants: [DELIVERED_STATES, ON_RECORD_KINDS]
      source: lib/reach/submit.rb Reach::Submit
      standards: [STD-SUBMIT-APPROVAL, STD-SUBMIT-ARCHIVE, STD-SUBMIT-PARTIAL, STD-SUBMIT-REFUSALS]
    - id: L10
      name: Slice work state as the student sees it (computed)
      entity: slice marker
      column: Reach::Workspace.state_word
      states: [not started yet, in progress, submitted, graded]
      initial: not started yet
      terminal: [graded]
      transitions:
        - {from: not started yet, to: in progress, by: the student or the AI writing, guard: "an owned file differs from its delivered digest"}
        - {from: in progress, to: submitted, by: Reach::Receipts.store, guard: "an ingest receipt is the latest for the slice"}
        - {from: submitted, to: graded, by: Reach::Receipts.refresh_grades, guard: "a grade receipt is the latest for the slice"}
      constants: []
      source: lib/reach/workspace.rb Reach::Workspace.state_word
      standards: [STD-GRADE-VIEW, STD-WORKSPACE-LAYOUT]
    - id: L11
      name: Receipt acknowledgement
      entity: receipt acknowledgement
      column: state
      states: [pending, linked, mismatch, refused]
      initial: pending
      terminal: [linked, mismatch, refused]
      transitions:
        - {from: pending, to: linked, by: Reach::ReceiptAcks.attempt, guard: "Teach accepts the acknowledgement"}
        - {from: pending, to: mismatch, by: Reach::ReceiptAcks.attempt, guard: "Teach answers conflict"}
        - {from: pending, to: refused, by: Reach::ReceiptAcks.attempt, guard: "invalid_request or a permanent 4xx other than 401, 408, and 429"}
        - {from: pending, to: pending, by: Reach::ReceiptAcks.attempt, guard: "offline or a retryable answer; last_error is kept"}
      constants: []
      source: lib/reach/receipt_acks.rb Reach::ReceiptAcks
      standards: [STD-SUBMIT-ARCHIVE]
    - id: L12
      name: Consent question
      entity: consent record
      column: pending file, answer, and used_at
      states: [asked, yes, no, used, expired]
      initial: asked
      terminal: [used, expired]
      transitions:
        - {from: asked, to: yes, by: Reach::Consent.capture, guard: "the prompt hook sees the student's yes within the 30 minute window after the question was shown"}
        - {from: asked, to: no, by: Reach::Consent.capture, guard: "the student's no within the window"}
        - {from: asked, to: expired, by: time, guard: "WINDOW_S of 1800 seconds passes"}
        - {from: yes, to: used, by: Reach::Consent.take!, guard: "the action asks with the same kind and subject digest"}
        - {from: no, to: used, by: Reach::Consent.clear_declined!, guard: "the same ask is made again"}
        - {from: yes, to: expired, by: time, guard: "the answer is older than the window"}
      constants: []
      source: lib/reach/consent.rb Reach::Consent
      standards: [STD-CONSENT-FROM-REACH, STD-SUBMIT-APPROVAL]
    - id: L13
      name: Hidden-fault issue
      entity: issues registry
      column: entry fields count, pending, hand_id, fix_version
      states: [observed, pending, sent, fixed]
      initial: observed
      terminal: [fixed]
      transitions:
        - {from: observed, to: pending, by: Reach::Issues.observe, guard: "a blocking fault at once, or the repeat threshold within the window; under the daily and queued caps; not raised yet for this rEach version"}
        - {from: pending, to: sent, by: Reach::Issues.sent!, guard: "the detached flush delivers the issue hand; backoff runs from 60 seconds to 6 hours between tries"}
        - {from: sent, to: fixed, by: Reach::Issues.record_status, guard: "the hand status names a fix_version that the running version meets or exceeds"}
      constants: []
      source: lib/reach/issues.rb Reach::Issues
      standards: [STD-ISSUES, STD-KNOWN-ISSUES]
    - id: L14
      name: Live session
      entity: live session state
      column: session.state
      states: [requested, offered, open, closed]
      initial: requested
      terminal: [closed]
      transitions:
        - {from: requested, to: open, by: Reach::Live absorb, guard: "Teach reports the session open after the student asked with a typed yes"}
        - {from: offered, to: open, by: Reach::Live, guard: "the student answers the offer with a typed yes"}
        - {from: offered, to: closed, by: Reach::Live absorb, guard: "the student refuses, the offer is declined on Teach, and Teach reports the session closed"}
        - {from: open, to: closed, by: Reach::Live.end!, guard: "the student or the instructor ends the session"}
        - {from: requested, to: closed, by: Reach::Live absorb, guard: "Teach reports the session closed"}
      constants: [LIVE_STATES]
      source: lib/reach/live.rb Reach::Live
      standards: [STD-LIVE, STD-LIVE-DIAGNOSIS]
    - id: L15
      name: Live action request (answered means the entry is removed after the answer is sent)
      entity: live session state
      column: actions[].status
      states: [waiting, approved, declined, unknown, answered]
      initial: waiting
      terminal: [answered]
      transitions:
        - {from: waiting, to: approved, by: Reach::Consent, guard: "the student answers yes within 30 minutes; consent kind live_action"}
        - {from: waiting, to: declined, by: Reach::Consent, guard: "the student answers no"}
        - {from: approved, to: answered, by: Reach::Live.settle_actions, guard: "the named action ran with a 60 second limit and at most 16000 bytes of output"}
        - {from: declined, to: answered, by: Reach::Live.settle_actions, guard: "the answer ok false is sent"}
        - {from: unknown, to: answered, by: Reach::Live.settle_actions, guard: "the name is not in ACTIONS"}
        - {from: waiting, to: answered, by: Reach::Live.settle_actions, guard: "the answer window has passed; the silent result is sent"}
      constants: []
      source: lib/reach/live.rb Reach::Live.settle_actions
      standards: [STD-LIVE, STD-CODEX-SETUP]
    - id: L16
      name: Automatic update
      entity: update manifest
      column: phase
      states: [idle, detected, downloaded, staged, swapped, refreshed, completed, error]
      initial: idle
      terminal: [completed]
      transitions:
        - {from: idle, to: detected, by: Reach::Update.check, guard: "a newer version exists at the stable branch (STD-STABLE-CADENCE)"}
        - {from: detected, to: downloaded, by: Reach::Update.stage}
        - {from: downloaded, to: staged, by: Reach::Update.stage, guard: "the archive's ZIP comment equals target_commit"}
        - {from: staged, to: swapped, by: update/apply.rb}
        - {from: swapped, to: refreshed, by: update/apply.rb}
        - {from: refreshed, to: completed, by: update/apply.rb, guard: "the apply script exits successfully"}
        - {from: staged, to: error, by: Reach::Update.commit_mismatch?, guard: "the moved tag or different archive is found before anything runs"}
        - {from: swapped, to: detected, by: update/apply.rb rollback, guard: "the backup is restored after a failed apply"}
        - {from: completed, to: idle, by: Reach::Update.check, guard: "no newer version remains"}
      constants: [ACTIVE_PHASES]
      source: lib/reach/update.rb Reach::Update
      standards: [STD-AUTO-UPDATE, STD-STABLE-CADENCE, STD-AGENT-UPDATE]
    - id: L17
      name: Home relocation
      entity: relocation record
      column: phase
      states: [copying, verifying, switching, completed, failed]
      initial: copying
      terminal: [completed]
      transitions:
        - {from: copying, to: verifying, by: Reach::Relocation}
        - {from: verifying, to: switching, by: Reach::Relocation, guard: "the copy's hashes match"}
        - {from: switching, to: completed, by: Reach::Relocation, guard: "the new home is renamed into place and harness configs are repointed"}
        - {from: copying, to: failed, by: Reach::Relocation.update_state, guard: "a failure with a recorded reason and detail"}
        - {from: failed, to: copying, by: Reach::Relocation, guard: "a consistent journal makes the staged copy resumable"}
      constants: []
      source: lib/reach/relocation.rb Reach::Relocation
      standards: [STD-HOME-IN-WORKSPACE, STD-USER-HOME]
    - id: L18
      name: Conversation export import job
      entity: import job
      column: state
      states: [starting, running, finished, failed, cancelled]
      initial: starting
      terminal: [finished, cancelled]
      transitions:
        - {from: starting, to: running, by: the detached worker}
        - {from: running, to: finished, by: Reach::ExportImport worker}
        - {from: starting, to: failed, by: Reach::ExportImport, guard: "the worker could not be spawned"}
        - {from: running, to: failed, by: Reach::ExportImport, guard: "stalled, source changed, a time limit, or an element limit"}
        - {from: failed, to: running, by: Reach::ExportImport.run, guard: "RUNNABLE_STATES allows a resume, up to RESUME_LIMIT times"}
        - {from: starting, to: cancelled, by: Reach::ExportImport.cancel}
        - {from: running, to: cancelled, by: Reach::ExportImport.cancel}
      constants: [LIVE_STATES, RUNNABLE_STATES]
      source: lib/reach/export_import.rb Reach::ExportImport
      standards: [STD-EXPORT-IMPORT, STD-STORAGE-GATES]
    - id: L19
      name: Work-loss condition and recovery
      entity: checkpoint entry
      column: computed conditions plus checkpoint-dismissed.json
      states: [intact, file_missing, folder_missing, recovered, dismissed]
      initial: intact
      terminal: []
      transitions:
        - {from: intact, to: file_missing, by: Reach::Checkpoint.missing, guard: "an owned file is missing or empty while a save since the last deliberate one holds it"}
        - {from: intact, to: folder_missing, by: Reach::Checkpoint.notice!, guard: "a work folder is gone while its saves remain"}
        - {from: file_missing, to: recovered, by: Reach::Checkpoint.recover, guard: "reach checkpoint recover restores the newest save holding the files, saving the current state first"}
        - {from: folder_missing, to: recovered, by: Reach::Checkpoint.recover, guard: "the folder is provisioned from the stored package, then restored"}
        - {from: folder_missing, to: dismissed, by: Reach::Checkpoint.dismiss!, guard: "the student removed the folder on purpose"}
        - {from: dismissed, to: intact, by: Reach::Checkpoint.forget!, guard: "forget of all slices clears the dismissed list"}
      constants: []
      source: lib/reach/checkpoint.rb Reach::Checkpoint
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - id: L20
      name: Harness move
      entity: consent record
      column: result state of Reach::HarnessMove
      states: [asked, terminal, moved, declined, failed]
      initial: asked
      terminal: [terminal, moved, declined, failed]
      transitions:
        - {from: asked, to: moved, by: Reach::HarnessMove, guard: "the typed yes; rEach is installed into the target app and every course folder is rewritten"}
        - {from: asked, to: declined, by: Reach::Consent, guard: "the student answers no"}
        - {from: asked, to: terminal, by: Reach::HarnessMove, guard: "the app runs no rEach hooks, so the terminal command is given and no question is asked"}
        - {from: asked, to: failed, by: Reach::HarnessMove, guard: "the install into the target app fails; nothing else changes"}
      constants: [HARNESS_NAMES]
      source: lib/reach/harness_move.rb Reach::HarnessMove
      standards: [STD-HARNESS-MOVE, STD-NOHOOK-ENROLL]
    - id: L21
      name: Module transfer request
      entity: module transfer request
      column: state
      states: [pending, approved, denied, withdrawn, closed]
      initial: pending
      terminal: [approved, denied, withdrawn, closed]
      transitions:
        - {from: pending, to: approved, by: Reach::Transfer poll, guard: "Teach approves"}
        - {from: pending, to: denied, by: Reach::Transfer poll, guard: "Teach denies"}
        - {from: pending, to: withdrawn, by: Reach::Transfer poll, guard: "Teach reports the request withdrawn"}
        - {from: pending, to: closed, by: Reach::Transfer.post_request, guard: "Teach refuses the request; a forbidden answer also sets off_until, which pauses new requests for 24 hours"}
      constants: []
      source: lib/reach/transfer.rb Reach::Transfer
      standards: [STD-MODULES-LOCK-SYNC, STD-MODULES-PENDING]
    - id: L22
      name: Feedback item
      entity: feedback store
      column: state
      states: [pending, refused, new, seen, acted, closed]
      initial: pending
      terminal: [refused, closed]
      transitions:
        - {from: pending, to: new, by: Reach::Feedback.deliver, guard: "Teach accepts the item and returns a feedback_id"}
        - {from: pending, to: refused, by: Reach::Feedback.deliver, guard: "Teach refuses, or the stored entry is damaged"}
        - {from: new, to: seen, by: Reach::Feedback.pull!, guard: "Teach reports the state seen"}
        - {from: seen, to: acted, by: Reach::Feedback.apply_remote, guard: "Teach reports the state acted"}
        - {from: acted, to: closed, by: Reach::Feedback.apply_remote, guard: "Teach reports the state closed"}
      constants: []
      source: lib/reach/feedback.rb Reach::Feedback
      standards: [STD-FEEDBACK]
    - id: L23
      name: Uninstall run (not persisted)
      entity: install record
      column: the verb's own steps
      states: [planned, asked, confirmed, removed]
      initial: planned
      terminal: [removed]
      transitions:
        - {from: planned, to: asked, by: Reach::Uninstall.confirm, guard: "no yes yet; M-UNINSTALL-ASK is printed and the verb exits 3"}
        - {from: asked, to: confirmed, by: Reach::Consent, guard: "the install_withdraw consent is a yes, or --yes on a computer that is not enrolled or is locked"}
        - {from: planned, to: confirmed, by: Reach::Uninstall.confirm, guard: "a terminal run types its own yes"}
        - {from: confirmed, to: removed, by: scripts/reach-uninstall, guard: "the receipts are copied to Downloads first; the home folders are not deleted when that copy fails"}
      constants: [HARNESS_NAMES, OUTBOX_NAMES]
      source: lib/reach/uninstall.rb Reach::Uninstall
      standards: [STD-UNINSTALL, STD-CONSENT-FROM-REACH]
  enumerations:
    - const: ASSIGNMENT_PHASES
      values: [start, plan, part, build, submit, wait, review, done]
      used_for: The phases of an assignment that the behavior policy maps to opcode lists; the policy is invalid unless it has exactly these keys.
      source: lib/reach/behavior_policy.rb Reach::BehaviorPolicy
      standards: [STD-ASSIGNMENT-CONTEXT]
    - const: RETRYABLE_STATUSES
      values: [408, 425, 429, 500, 502, 503, 504]
      used_for: HTTP statuses from Teach that the shared client retries within its bounded budget.
      source: lib/reach/client.rb Reach::Client
      standards: [STD-WIRE-CONTRACT]
    - const: SANDBOX_MODES
      values: [read-only, workspace-write, danger-full-access]
      used_for: The Codex sandbox modes rEach recognises when it reads or sets Codex's settings.
      source: lib/reach/codex_setup.rb Reach::CodexSetup
      standards: [STD-CODEX-SETUP, STD-CODEX-SANDBOX]
    - const: DIGEST_KINDS
      values: [prompt, reply, reasoning, output, code]
      used_for: Transcript kinds whose text is de-identified and carries a digest of the original.
      source: lib/reach/deidentify.rb Reach::Deidentify
      standards: [STD-TRANSCRIPT-DEIDENTIFY]
    - const: PACKAGE_KINDS
      values: [guardrails, workspace, shape]
      used_for: The package kinds that reach doctor and the diagnosis probe check for a stored copy.
      source: lib/reach/diagnose.rb Reach::Diagnose
      standards: [STD-WIRE-CONTRACT]
    - const: PACKAGE_KINDS
      values: [guardrails, workspace]
      used_for: The package kinds served by the fake Teach and checked by the platform smoke; both are test tooling, and neither includes shape.
      source: tools/fake_teach/server.rb FakeTeach::Store
      standards: [STD-PLATFORM-SMOKE, STD-SMOKE]
    - const: KEEP_STATUSES
      values: [401, 403, 408, 425, 429]
      used_for: Teach statuses that keep an enrollment outbox entry for a later retry instead of dropping it, together with any status of 500 or above.
      source: lib/reach/enroll_outbox.rb Reach::EnrollOutbox
      standards: [STD-ENROLL-NO-RELAY]
    - const: KEPT_ROLES
      values: [user, assistant]
      used_for: The message roles read from a conversation export; every other role is skipped.
      source: lib/reach/export_import/vendors.rb Reach::ExportImport::Vendors
      standards: [STD-EXPORT-IMPORT]
    - const: TEXT_TYPES
      values: [text, multimodal_text, nil]
      used_for: The content types of an export message whose text is kept.
      source: lib/reach/export_import/vendors.rb Reach::ExportImport::Vendors
      standards: [STD-EXPORT-IMPORT]
    - const: VENDOR_NAMES
      values: ["chatgpt: ChatGPT", "claude: Claude", "gemini: Gemini"]
      used_for: Maps the vendor ids of supported conversation exports to display names.
      source: lib/reach/export_import/vendors.rb Reach::ExportImport::Vendors::Render
      standards: [STD-EXPORT-IMPORT]
    - const: RETRY_STATUSES
      values: [404, 429]
      used_for: Statuses that leave a feedback item pending for a later retry, together with any status of 500 or above.
      source: lib/reach/feedback.rb Reach::Feedback
      standards: [STD-FEEDBACK]
    - const: STATES
      values: [pending, refused, new, seen, acted, closed]
      used_for: The feedback item states that a Teach row may set (pending and refused are local only); covered by lifecycle L22.
      source: lib/reach/feedback.rb Reach::Feedback
      standards: [STD-FEEDBACK]
    - const: PROTECTED_NAMES
      values: [.claude, .codex, .mcp.json, CLAUDE.md, AGENTS.md]
      used_for: Top-level names in a course folder that the gate refuses to let an agent write or move; compared lower-case on case-insensitive file systems.
      source: lib/reach/gate.rb Reach::Gate
      standards: [STD-HOOK-GUARD, STD-GATE-REPLACED]
    - const: APPLY_PATCH_NAMES
      values: [apply_patch, applypatch]
      used_for: The shell command words the gate treats as a patch application and judges by the files the patch names.
      source: lib/reach/gate.rb Reach::Gate
      standards: [STD-HOOK-GUARD, STD-CODEX-PATCH-CHECK]
    - const: AGENT_TYPES
      values: [student_request, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, integrity_question, other]
      used_for: The hand types the agent may choose for a hand the student asks for; the inventory shows a truncated value because the list spans lines.
      source: lib/reach/hands.rb Reach::Hands
      standards: [STD-HAND-TYPES]
    - const: NEWER_TYPES
      values: [late_work, late_submission, plan_audit, passes_or_pattern, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, integrity_question, other]
      used_for: Hand types that need a Teach newer than the original wire revision; an older Teach receives student_request with the type in the summary.
      source: lib/reach/hands.rb Reach::Hands
      standards: [STD-HAND-TYPES]
    - const: TYPES
      values: [attempt_gate, attempt_ladder, check_gate, wellbeing, late_work, late_submission, plan_audit, passes_or_pattern, student_request, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, integrity_question, other]
      used_for: Every trigger a hand may carry from rEach; the issue trigger is raised only by Reach::Issues with originator reach.
      source: lib/reach/hands.rb Reach::Hands
      standards: [STD-HAND-TYPES, STD-ISSUES]
    - const: TECHNICAL_TYPES
      values: [technical_issue, setup_issue, access_issue]
      used_for: Hand types that gain the capsule and signature hint and are marked technical in the bundle.
      source: lib/reach/hands.rb Reach::Hands
      standards: [STD-HAND-TYPES, STD-ISSUES]
    - const: CODEX_NAMES
      values: [codex, codex.exe]
      used_for: Executable names accepted when rEach looks for the Codex command line.
      source: lib/reach/harness_source.rb Reach::HarnessSource
      standards: [STD-AUTO-UPDATE, STD-CODEX-SETUP]
    - const: CLAUDE_NAMES
      values: [claude, claude.exe]
      used_for: Executable names accepted when rEach looks for the Claude Code command line.
      source: lib/reach/harness_source.rb Reach::HarnessSource
      standards: [STD-AUTO-UPDATE]
    - const: GIVE_UP_STATUSES
      values: [400]
      used_for: Statuses that stop retrying a late-work hand, together with the give-up codes.
      source: lib/reach/late_work.rb Reach::LateWork
      standards: [STD-LATE-WORK, STD-LATE-ASSIGNMENTS]
    - const: MAX_REASONS
      values: [8]
      used_for: The most reasons a plan audit verdict keeps.
      source: lib/reach/plan_audit.rb Reach::PlanAudit
      standards: [STD-PLAN-AUDIT]
    - const: MEDIA_TYPES
      values: [text/markdown, text/plain]
      used_for: The media types a reference file may declare to be accepted from the vault reference blobs.
      source: lib/reach/reference.rb Reach::Reference
      standards: [STD-VAULT-PRIVATE, STD-COURSE-CORPUS]
    - const: NOTICE_KINDS
      values: ["status: course_update", "grades: grade", "hands: hand_reply", "extra_credit: extra_credit", "receipts: receipt"]
      used_for: Maps the sections of Teach's subscription answer to the kind of notice shown to the student; the inventory shows a truncated value because the mapping spans lines.
      source: lib/reach/subscribe.rb Reach::Subscribe
      standards: [STD-TEACH-SUBSCRIBE]
    - const: PART_KINDS
      values: [prompt, reply, reasoning, action, output]
      used_for: Transcript kinds that may be split into consecutive parts when over the size limit.
      source: lib/reach/transcript.rb Reach::Transcript
      standards: [STD-TRANSCRIPT-STREAM]
    - const: KINDS
      values: [prompt, reply, reasoning, action, output, code]
      used_for: Every kind of transcript entry; code entries stop at 131072 bytes of text.
      source: lib/reach/transcript.rb Reach::Transcript
      standards: [STD-TRANSCRIPT, STD-TRANSCRIPT-STREAM]
    - const: DEFAULT_SUPPORTED_KINDS
      values: [prompt]
      used_for: The transcript kinds sent when the course status lists no kinds, which is the oldest Teach behavior.
      source: lib/reach/transcript.rb Reach::Transcript
      standards: [STD-TRANSCRIPT-STREAM]
    - const: TEXT_KINDS
      values: [prompt, reply, reasoning]
      used_for: The transcript kinds that a student's own text export includes as text.
      source: lib/reach/transcript_export.rb Reach::TranscriptExport
      standards: [STD-TRANSCRIPT-EXPORT]
    - const: HARNESS_NAMES
      values: ["claude-code: Claude Code", "codex: Codex", "antigravity: Antigravity", "hermes: Hermes"]
      used_for: Display names of the AI apps that the uninstall question lists as found; the harness move uses the same four ids.
      source: lib/reach/uninstall.rb Reach::Uninstall
      standards: [STD-UNINSTALL, STD-HARNESS-MOVE]
    - const: OUTBOX_NAMES
      values: ["submissions: submission", "hands: hand raise", "issues: issue report", "other: other item"]
      used_for: Singular and plural names for the unsent outbox items the uninstall question counts.
      source: lib/reach/uninstall.rb Reach::Uninstall
      standards: [STD-UNINSTALL]
    - const: LEGACY_TRIGGERS
      values: [attempt_gate, attempt_ladder, student_request, check_gate, wellbeing]
      used_for: Hand triggers the fake Teach accepts from a Teach that predates the typed-hand revision; test tooling, not product state.
      source: tools/fake_teach/server.rb FakeTeach
      standards: [STD-SMOKE, STD-PLATFORM-SMOKE]
    - const: NEWER_TRIGGERS
      values: [late_work, late_submission, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, feedback, integrity_question, other, issue]
      used_for: Hand triggers the fake Teach accepts beyond the legacy ones; test tooling, and it lists feedback and issue which rEach itself no longer sends as typed hands.
      source: tools/fake_teach/server.rb FakeTeach
      standards: [STD-SMOKE, STD-PLATFORM-SMOKE]
    - const: BUNDLE_TRIGGERS
      values: [issue, technical_issue, setup_issue, access_issue]
      used_for: Triggers for which the fake Teach requires a sealed bundle; test tooling.
      source: tools/fake_teach/server.rb FakeTeach
      standards: [STD-SMOKE, STD-PLATFORM-SMOKE]
    - const: FORBIDDEN_NAMES
      values: [TOKENS.jsonl, DECISIONS.md]
      used_for: File names the SDK kit build refuses to include in the pinned kit; build tooling, not product state.
      source: tools/sdk_kit.rb SdkKitBuild
      standards: [STD-BRAIN-PLANES, STD-NO-INSTITUTION]
    - const: AUTOSAVE_VIAS
      values: [write, pre_write, check, provision, restored]
      used_for: The checkpoint save origins that append no ledger event; covered by lifecycle context of L19.
      source: lib/reach/checkpoint.rb Reach::Checkpoint
      standards: [STD-CHECKPOINT-AUTOSAVE]
    - const: Reach::Consent::KINDS
      values: [module_lock, transfer_request, submission, submission_partial, compaction, export_import, live_session, live_action, live_send, codex_setup, harness_move, profile_share, transcripts_forget, checkpoints_forget, checkpoints_recover, checkpoints_dismiss, feedback_send, install_withdraw]
      used_for: Every kind of action that needs the student's own typed yes, as asked by Reach::Consent.
      source: lib/reach/consent.rb Reach::Consent
      standards: [STD-CONSENT-FROM-REACH]
    - const: Reach::Live::ACTIONS
      values: [doctor, status, sync, update_check, update, resend, cache_repair, codex_configure, sandbox_probe]
      used_for: The fixed table of names an instructor's side may ask for in a live session, each gated by the student's yes.
      source: lib/reach/live.rb Reach::Live
      standards: [STD-LIVE]
interfaces:
  http:
    - id: H1
      title: "Local slice preview server"
      base: "/"
      audience: local
      auth: "Bound to 127.0.0.1 on a free port. Every request must carry a Host of 127.0.0.1 or localhost with that port. The first visit carries a 32 hex character key in the reach_key query value, which is answered with a 303 redirect that sets an HttpOnly SameSite=Strict cookie named reach_preview; later requests must present that cookie. Anything else gets 403."
      wire: null
      routes:
        - method: GET
          path: "/:any?reach_key=:key"
          purpose: "Enter the preview: a matching key sets the reach_preview cookie and redirects to the same path without the key."
          source: lib/reach/kit/preview_server.rb
        - method: GET
          path: "/live/modules/:module/panel/src/:file"
          purpose: "Serve the current text of one panel source file the student owns, so the open page can refresh it. Only owned .svelte files under the slice's panel source folders are served; symlinks, parent segments and files outside the workspace get no answer."
          source: lib/reach/kit/preview_server.rb
        - method: ANY
          path: "/:any"
          purpose: "Every other path is handed to the slice's own practice app, which runs on practice data on this computer. The server stops after the idle limit (1800 s by default)."
          source: lib/reach/kit/preview_server.rb
      standards: [STD-PREVIEW, STD-QUALIFY-NOBROWSER]
  cli:
    - verb: "reach help"
      aliases: ["reach", "reach --help", "reach -h"]
      synopsis: "reach help | reach <verb> --help | reach <verb> -h"
      purpose: "Print the usage of every verb, or of one verb. Every verb answers --help before any enrollment, sign-in or workspace check. An unknown verb prints the usage and exits 1."
      mutates: none
      source: lib/reach/cli.rb CLI.route
      standards: [STD-CLI-HELP]
    - verb: "reach version"
      aliases: ["reach --version", "reach -V"]
      synopsis: "reach version"
      purpose: "Print the installed rEach version."
      mutates: none
      source: lib/reach/cli.rb CLI.route
      standards: [STD-CLI-VERSION]
    - verb: "reach validate"
      synopsis: "reach validate [start|begin|status|answer|plan|artifact|check|qualify|submit|finish] [--course-code CODE --harness APP] [--restart] [--question ID --text TEXT]"
      purpose: "Run the agent-driven security validation pass with fabricated practice data. It must produce a fresh signed receipt before a student's credentials are collected."
      mutates: external
      requires: "A course code to start; the pass talks to the course server anonymously, then with a signed attempt identity. Usable while rEach is locked."
      source: lib/reach/cli.rb CLI.cmd_validate
      standards: [STD-WIRE-CONTRACT]
    - verb: "reach enroll"
      aliases: ["reach enrol"]
      synopsis: "reach enroll [--course-passkey P --username U --student-id I --password-stdin] [--teach-url URL --harness APP]"
      purpose: "Enroll this computer with a course passkey, a username, a student ID and a chosen password. The passkey, ID and password are read only in the terminal or from standard input, never by an agent."
      mutates: external
      requires: "An interactive terminal, or the full set of flags with the password on standard input. Runs the security validation first when no fresh receipt exists."
      source: lib/reach/cli.rb CLI.cmd_enroll
      standards: [STD-ENROLL-NO-RELAY, STD-ENROLL-PASSWORD, STD-COURSE-PASSKEY, STD-NOHOOK-ENROLL]
    - verb: "reach enroll --window"
      aliases: ["reach login --window"]
      synopsis: "reach enroll --window"
      purpose: "Open a terminal window that runs reach enroll for the student. The same flag on reach login opens a window that runs login."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_enroll
      standards: [STD-NOHOOK-ENROLL]
    - verb: "reach sync"
      synopsis: "reach sync"
      purpose: "Fetch new course packages and the course rules, refresh the workspaces, send queued items, and print the summary. Exits 2 when the install was revoked."
      mutates: external
      requires: "An enrolled install."
      source: lib/reach/cli.rb CLI.cmd_sync
    - verb: "reach status"
      synopsis: "reach status"
      purpose: "Print the enrollment, the current assignment, the slices, package versions, receipts and open hands."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_status
    - verb: "reach work"
      synopsis: "reach work [--harness claude-code|codex|antigravity|hermes] [--slice NAME | --extracurricular]"
      purpose: "Open a slice workspace, or the student's own folder, in an AI app. It rewrites the folder's rules file and harness hook files first, then replaces itself with the app."
      mutates: external
      requires: "An enrolled install and a terminal. With several apps detected, --harness is required."
      source: lib/reach/cli.rb CLI.cmd_work
      standards: [STD-WORKSPACE-LAYOUT]
    - verb: "reach start"
      synopsis: "reach start [--harness claude-code|codex|antigravity|hermes]"
      purpose: "Launch an AI app in the current folder with the greeting prompt, outside a course workspace."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_start
    - verb: "reach gate session"
      synopsis: "reach gate session --harness H   (hook event JSON on standard input)"
      purpose: "Session-start work of a course folder: record the session, refresh the guardrails and the assignment context."
      mutates: files
      requires: "Called by a harness hook, not typed. Never waits on the network."
      source: lib/reach/cli.rb CLI.gate_dispatch
      standards: [STD-HOOK-RESPONSIVE]
    - verb: "reach gate prompt"
      synopsis: "reach gate prompt --harness H   (hook event JSON on standard input)"
      purpose: "Prompt gate of a course folder: apply the enrollment lock, sign-in, course controls and the crisis check, and add context to the prompt."
      mutates: files
      requires: "Called by a harness hook."
      source: lib/reach/cli.rb CLI.gate_dispatch
      standards: [STD-SIGNIN-ONCE, STD-CONTROLS, STD-COWORK-CODE-TAB]
    - verb: "reach gate enroll"
      synopsis: "reach gate enroll --harness H   (hook event JSON on standard input)"
      purpose: "The plugin's prompt hook: runs the enrollment and sign-in flow from the student's typed answers, and on Codex also the course prompt work."
      mutates: external
      requires: "Called by a harness hook."
      source: lib/reach/cli.rb CLI.cmd_gate
      standards: [STD-SIGNIN-PLUGIN-HOOK, STD-ENROLL-NO-RELAY, STD-CODEX-PROMPT-JSON-BLOCK, STD-CODEX-HOOK-TRUST]
    - verb: "reach gate write"
      synopsis: "reach gate write --harness H   (hook event JSON on standard input)"
      purpose: "Tool gate before a file write or edit: allow only the slice's owned files, refuse the rest with a message."
      mutates: files
      requires: "Called by a harness hook. Fails closed on Hermes."
      source: lib/reach/cli.rb CLI.gate_dispatch
      standards: [STD-HOOK-GUARD]
    - verb: "reach gate shell"
      synopsis: "reach gate shell --harness H   (hook event JSON on standard input)"
      purpose: "Tool gate before a shell command: refuse commands the course rules forbid, such as git, reading the vault, or leaving the workspace."
      mutates: files
      requires: "Called by a harness hook. Fails closed on Hermes."
      source: lib/reach/cli.rb CLI.gate_dispatch
      standards: [STD-HOOK-GUARD, STD-NO-GIT-IN-WORKSPACE, STD-VAULT-PRIVATE]
    - verb: "reach gate read"
      synopsis: "reach gate read --harness H   (hook event JSON on standard input)"
      purpose: "Tool gate before a read, search or web tool: refuse reads outside the course workspace and of private paths."
      mutates: files
      requires: "Called by a harness hook. Fails closed on Hermes."
      source: lib/reach/cli.rb CLI.gate_dispatch
      standards: [STD-VAULT-PRIVATE]
    - verb: "reach shape check"
      synopsis: "reach shape check [--changed PATH] [--slice NAME] [--format text|agent|json]"
      purpose: "Run the shape checker over the slice's panel files and print findings classified invisible or visible."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_shape
    - verb: "reach qualify"
      synopsis: "reach qualify [--slice NAME] [--list] [--format text|agent|json] [--local-only] [--task TEXT] [--summary TEXT]"
      purpose: "Prove the slice before submitting: run the checks, the scenario coverage, the local scenario run, then the course server's qualification run. Exits 0 on pass, 3 when the server run is pending, 1 otherwise."
      mutates: external
      requires: "An enrolled, signed-in install and a slice workspace. Needs the plan and its audit to have passed first."
      source: lib/reach/cli.rb CLI.cmd_qualify
      standards: [STD-QUALIFY-BEFORE-SUBMIT, STD-PLAN-AUDIT, STD-ATTEMPT-LADDER, STD-QUALIFY-FAULTS, STD-WEIGHTED-PASSES]
    - verb: "reach preview"
      synopsis: "reach preview [--slice NAME] [--screenshot] [--format text|json] | stop | status"
      purpose: "Start the local preview server for the panel the student is building and print its address, or with --screenshot save a picture of it with the browser console errors."
      mutates: files
      requires: "A panel slice. The first start installs the checking tools."
      source: lib/reach/cli.rb CLI.cmd_preview
      standards: [STD-PREVIEW]
    - verb: "reach preview stop"
      synopsis: "reach preview stop"
      purpose: "Stop the running preview server."
      mutates: files
      source: lib/reach/cli.rb CLI.cmd_preview
      standards: [STD-PREVIEW]
    - verb: "reach preview status"
      synopsis: "reach preview status"
      purpose: "Say whether the preview server is running and where."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_preview
      standards: [STD-PREVIEW]
    - verb: "reach submit"
      synopsis: "reach submit [--partial] [--slice NAME]"
      purpose: "Ask the student, then submit the slice and wait for the receipt. The first call prints the question and records it (state asked); the student's typed yes is captured by a prompt hook and the second call sends. The other states are declined, ingested, rejected and queued."
      mutates: external
      requires: "A passed qualification on exactly the current files, answered own-part questions, and no active hook guard. --partial sends unqualified work for review."
      source: lib/reach/cli.rb CLI.cmd_submit
      standards: [STD-SUBMIT-APPROVAL, STD-QUALIFY-BEFORE-SUBMIT, STD-SUBMIT-PARTIAL, STD-SUBMIT-REFUSALS, STD-HOOK-GUARD]
    - verb: "reach submit archive"
      synopsis: "reach submit archive [--assignment A | --all | --course C | --extracurricular]"
      purpose: "Save a ZIP of the student's work to Downloads at any time: one assignment (the default), all work, one course, or the student's own code folder. It is never a submission."
      mutates: files
      requires: "Usable while locked. At most one selector."
      source: lib/reach/cli.rb CLI.cmd_submit_archive
      standards: [STD-SUBMIT-ARCHIVE]
    - verb: "reach receipts"
      synopsis: "reach receipts [wait --submission ID | show ID | acks]"
      purpose: "List the receipts held on this computer newest first; wait polls Teach for one submission's receipt, show prints one, acks lists the receipt acknowledgments."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_receipts
    - verb: "reach hand raise"
      synopsis: "reach hand raise --summary TEXT [--type T] [--slice NAME] [--last-step TEXT] [--saw TEXT] [--include-profile]"
      purpose: "Raise a hand with the instructors. T is one of student_request, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, integrity_question, other. The hand is queued when Teach cannot be reached."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_hand
      standards: [STD-HAND-TYPES, STD-PROFILE-LOCAL, STD-WELLBEING-DELIVERED]
    - verb: "reach hand late"
      synopsis: "reach hand late --assignment ID [--type late_work|late_submission]"
      purpose: "Send the late-work hand for an assignment."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_hand
      standards: [STD-LATE-WORK, STD-LATE-ASSIGNMENTS]
    - verb: "reach hand status"
      synopsis: "reach hand status ID"
      purpose: "Print one hand's state and reply as JSON."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_hand
    - verb: "reach hand list"
      synopsis: "reach hand list"
      purpose: "List the hands recorded on this computer."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_hand
    - verb: "reach grade"
      synopsis: "reach grade [--format text|json]"
      purpose: "Print the points Teach recorded for the student, or say grades are not available yet."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_grade
      standards: [STD-GRADE-VIEW]
    - verb: "reach extra-credit"
      synopsis: "reach extra-credit CODE ANSWER... | reach extra-credit CODE --answer TEXT [--format text|json]"
      purpose: "Turn in an extra-credit answer with the code an instructor gave the student."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_extra_credit
      standards: [STD-EXTRA-CREDIT]
    - verb: "reach extra-credit list"
      synopsis: "reach extra-credit list [--format text|json]"
      purpose: "List the extra credit turned in and whether each answer is recorded, waiting or not accepted."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_extra_credit
      standards: [STD-EXTRA-CREDIT]
    - verb: "reach feedback send"
      synopsis: "reach feedback send --category C --message TEXT [--anonymous] [--format text|json]   (C is general, praise, suggestion, request, question, complaint, problem or pace)"
      purpose: "Show the note to the student and send it to the instructors only after a typed yes. Also accepts reach feedback --flush to retry queued notes."
      mutates: external
      source: lib/reach/cli.rb CLI.cmd_feedback
      standards: [STD-FEEDBACK]
    - verb: "reach feedback list"
