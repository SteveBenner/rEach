schema_version: 1
name: reach
version: 0.35.7
kind: plugin
purpose: >
  The student's side of the course software. A harness plugin that installs
  from its repository link into Claude Code, Claude Cowork, Codex,
  Antigravity or Hermes (and through rplugin when present) and turns the student's own
  AI agent into rEach, a bounded course partner: it greets the student and
  runs a short interview saved on their computer only, enrolls with Teach (refusing all input until
  the student enrolls with the class-wide course passkey, their institutional username and student ID),
  receives the student's
  protected materials, refuses to let the agent work until the instructors'
  guardrails are installed, keeps the agent inside the student's slice,
  checks every change against the Dovetail shape, has the agent prove each
  slice with scenarios of its own before submitting (reach qualify, locally
  and on Teach), submits work and waits for Teach's receipt, and raises a
  hand to the instructors by itself after three failed qualifications.
blueprint: The full design is in reach.spec.yml (schema reach.spec/v1) at the project root.
wire_contract: specs/wire.yml (Teach-Reach protocol 1; teach carries a byte-identical pinned copy)
implementation_blueprint: kept in the private superproject (STD-TEACH-OPAQUE)
runtime:
  ruby: "2.6.10 to 4.0.x, standard library only, no native gems"
  sdk: "optional: rplugin (Ruby 3.3+) is loaded when present; otherwise Reach runs standalone from a harness's own plugin copy"
harnesses:
  - claude-code (terminal, desktop Code tab, VS Code) and Claude Cowork, from .claude-plugin/
  - codex (CLI, IDE, desktop app), from .codex-plugin/ and .agents/plugins/marketplace.json
  - antigravity (the Gemini harness), from plugin.json, rules/ and skills/ through reach setup
  - hermes (Nous Research's Hermes Agent CLI), through a dedicated Hermes profile named reach that reach setup creates and reach work launches
depends_on:
  - dovetail (the pure-Ruby shape checker the shape package carries in the vault, with a dovetail on the PATH as the fallback)
  - teach (the course server this plugin talks to, protocol 1)
standards:
  - id: STD-RUBY-FLOOR
    text: "Every lib/ file parses and runs on Ruby 2.6.10: no endless methods, no pattern matching, no numbered block parameters, no hash/keyword shorthand."
  - id: STD-RUBY-BOOTSTRAP
    text: "Since 0.20.7 rEach starts on a computer with no Ruby. The plugin's Claude Code hooks and MCP server (.mcp.json) run sh exe/reach-run, a POSIX sh launcher (Linux, macOS, Windows Git Bash and Cowork) that runs exe/reach with the Ruby on PATH when it is 2.6.10 or newer, otherwise with the runtime kit's Ruby under ~/.reach/runtime/<id>/ruby, and otherwise installs that Ruby: it downloads the kit bundle for the platform from the pinned runtime release, checks its size and sha256 against exe/runtime-pins (generated from the manifest RuntimeKit pins, and checked against it by tools/runtime_pins.rb), extracts it with tar, places it as RuntimeKit places a ruby-only install and writes runtime/current. A hook never waits for that download: the launcher starts one detached install under a lock and answers at once, and a prompt that arrives before Ruby is ready passes to the agent with M-BOOTSTRAP-WAIT context (rEach is finishing setup; ask the student to send the message again in a minute; do no course work yet) rather than being blocked. The MCP server waits up to 120 s for the install and otherwise exits with a plain message. On Windows, scripts/reach-install.ps1 does the same for INSTALL.md without Ruby and adds the kit Ruby's bin folder to the user PATH (no administrator rights), so harness hooks that call ruby work; an existing Ruby is left alone. Launcher failures are logged to ~/.reach/logs/bootstrap.log and never print a stack or a secret."
  - id: STD-PORTS-ONLY
    text: "When rplugin is present, code reaches its ports through Reach.ports (Rplugin::Ports.for('reach', root:)); without it, Reach keeps its own records under ~/.reach. Reach never reads or writes another plugin's data. reach setup touches a harness only through that harness's own install command or its documented plugin directory."
  - id: STD-WIRE-CONTRACT
    text: "Every byte Reach sends to or accepts from Teach follows specs/wire.yml. reach doctor reports R-DOC-WIRE when Teach advertises a different contract digest."
  - id: STD-ENROLL-PASSWORD
    text: "Since 0.16.21 (wire revision 2026-10-01e) the last enrollment step asks the student to choose a password of at least 8 characters, twice, and to write it down (M-ENR-ASK-PASSWORD, repeated in M-ENR-DONE). Like every enrollment answer the prompt hook blocks both entries, so the agent never sees them and nothing keeps them; the flow file keeps only a salt and a SHA-256 between the two entries and drops both when the flow ends. Reach sends the password in the shape v2 W-API-ENROLL body and never stores it; since 0.28.0 it keeps a salted one-way verifier of it (STD-SIGNIN-PASSWORD), and a student who already has a password types that one (M-ENR-PASSWORD-WRONG otherwise). Hermes, which cannot block a prompt, is sent to reach enroll in a terminal (M-ENR-PASSWORD-TERMINAL), which asks with typing hidden or reads --password-stdin."
  - id: STD-SIGNIN-PASSWORD
    text: "Since 0.28.0 (wire revision 2026-10-04d, W-ID-5) signing in takes the password the student chose at enrollment, and a hook enforces it: after the student ID and the yes, the prompt hook blocks with M-LOGIN-ASK-PASSWORD and the session stays unconfirmed, so the write, shell and read gates keep refusing, until the right password is typed. Reach::Password checks it against ~/.reach/state/login/verifier.json (0600), a salted PBKDF2-HMAC-SHA256 digest (600000 iterations) written when an enrollment, a server check or a reset succeeds and bound to the student and install; with no verifier it asks the course server once, and when the server cannot be reached the sign-in waits (M-LOGIN-PASSWORD-OFFLINE), so deleting the verifier signs nobody in. A wrong password counts toward the sign-in lockout. The password itself is never stored, logged, recorded in a transcript or the microbrain, or shown to the agent: every prompt of these steps is blocked. Nobody can look a password up. A student who forgot it types forgot password; once an instructor has allowed a reset for them, rEach asks for a new password twice and sets it (W-API-PASSWORD-RESET), and until then it tells them to ask their instructor. Enrolling again takes the existing password unless a reset is allowed. Hermes, which cannot block a prompt, sends the student to reach login password and reach login reset in a terminal, which read with typing hidden and work for every harness. The policy's login.password false switches the step off; installs enrolled before the enrollment password existed have none and sign in without one."
  - id: STD-TEACH-URL
    text: "rEach carries the course's Teach URL and never asks the student or the agent for it. config.yml teach.url names Teach over HTTPS (https://sven-f1l1.tail062fd2.ts.net since 0.16.19, Tailscale Funnel to the course server) and every enrollment path uses it: the prompt-hook enrollment flow and reach enroll (the reach_enroll tool took no teach_url since 0.16.20 and enrolls nothing since 0.35.2, STD-ENROLL-NO-RELAY). REACH_TEACH_URL and the unlisted --teach-url are operator overrides, an install keeps the URL it enrolled with (install.yml teach_url), and with no URL configured rEach says to run reach update (unreachable since 0.21.11, which builds the URL in; the guards stay as defenses). Since 0.18.2 reach setup and update/apply.rb also write config.yml teach.url to ~/.reach/state/teach.json, so an installed rEach still knows Teach when config.yml is missing, unreadable or blank; the lookup order is REACH_TEACH_URL, config.yml teach.url, then that file, so a URL changed by an update wins over the saved copy; since 0.21.11 Reach::Runtime::TEACH_URL (https://sven-f1l1.tail062fd2.ts.net) is the built-in last resort, so rEach always has a course server. Since 0.21.11 reach enroll in a terminal that cannot reach Teach names the URL and the network cause (M-ENR-CLI-OFFLINE), and reach doctor checks Teach (R-DOC-NET) before enrollment too, naming the URL and the cause. config.yml's enrollment identity rules match live Teach (student IDs ^[0-9]{5,10}$, usernames ^[a-z][a-z0-9._-]{1,31}$ since 0.16.20); Teach's preview rules still win."
  - id: STD-CA-ROOTS
    text: "Since 0.21.11 every reach process trusts a CA bundle that exists on the computer. exe/reach, before anything loads OpenSSL, sets SSL_CERT_FILE to the running Ruby's own libexec/cert.pem when SSL_CERT_FILE is unset or names a missing file and that bundle exists (lib/reach/ca_roots.rb). The macOS runtime kit (rv-ruby) ships that bundle but its OpenSSL looks for certificates only under the build machine's /opt/homebrew/Cellar/rv-portable-openssl path, so without it every HTTPS request from the kit Ruby (enrollment, sync, update, downloads) failed certificate verification; since 0.21.3 every command on macOS's Ruby 2.6 runs under the kit (STD-RUBY-BOOTSTRAP), so this blocked every Mac student with the kit installed. Child processes inherit the variable. A SSL_CERT_FILE that names an existing file is never replaced."
  - id: STD-PERSONA-ONE-SOURCE
    text: "The rEach persona body is identical in skills/reach-assistant/SKILL.md and agents/reach.md, and quotes the G-FIRST-RUN greeting from locales/greetings.en-US.yml; reach doctor reports R-DOC-PERSONA otherwise."
  - id: STD-CODEX-PLUGIN-HOOKS
    text: "Codex lists rEach's plugin hooks for the student to trust. Codex 0.156 and newer loads no plugin hooks when a root plugin.json sits beside .codex-plugin/plugin.json (openai/codex#47925), so since 0.16.16 reach setup, every update and reach mcp rename that file to plugin.json.agent-plugins in Codex's cached copy of rEach only ($CODEX_HOME/plugins/cache/*/reach/*/ holding .codex-plugin/plugin.json). The repository and the install folder keep it for Antigravity, and nothing is deleted. Since 0.20.4 a locked reach hello run by the agent reports the repair (M-ENR-AGENT-CODEX-REPAIRED) only in the run that renamed a file, never again for a copy set aside earlier, and when the student has already restarted and rEach is still locked M-ENR-AGENT-GUIDE sends them to enroll in Terminal (reach enroll, interactive, so the agent never sees the passkey, username, student ID or password) instead of restarting again. Since 0.21.12 rEach's MCP server starts under Codex both before and after that repair, on Windows too: the root mcp.json (read while the root plugin.json is present) runs ruby with ${PLUGIN_ROOT}/exe/reach, which Codex expands, because Windows has no sh; .codex-plugin/plugin.json (read after the repair) runs ruby exe/reach mcp (./exe/reach since 0.21.14) with cwd \".\", because Codex 0.160 expands neither ${PLUGIN_ROOT} nor sets a working folder for a server declared there, and resolves a relative cwd against its cached copy of rEach."
  - id: STD-HOOK-RESPONSIVE
    text: "Since 0.19.1 no session-start or prompt hook waits on the network or on another process (the enrollment steps, and since 0.28.0 a password check with no local verifier and the password reset steps, make one bounded request each: 5 s to connect, 10 s to read, no retry), and the Stop and SessionEnd hooks (reach hook stop) keep to their bounded quick requests (STD-TRANSCRIPT). The prompt that follows a successful sign-in gets a short signed-in context (the student's name and that course work may begin, M-LOGIN-DONE-AGENT) with the session start's local parts only; the status refresh, the course reference ingest and every other step that can touch the network or a contended lock run in one detached reach hello --background, whose result the next prompt carries. The just-signed-in marker is removed only after the hook has written its answer, so a hook the harness kills delivers it on the next prompt. Every file lock taken on a hook path waits at most hooks.lock_wait_s (default 2) and then degrades without losing data: a step whose lock is busy is skipped for that event. Each hook answers within 2 s on a warm computer; the Codex workspace prompt and session hooks get the same 60 s and 10 s limits as the plugin's."
  - id: STD-SIGNIN-PLUGIN-HOOK
    text: "Since 0.21.5 the student signs in from the plugin's prompt hook (reach gate enroll in hooks/hooks.json and hooks/codex.json), not only from a course folder's prompt hook (reach gate prompt). Codex runs a plugin or project hook only after the student trusts it and its hash still matches; every course folder's .codex/hooks.json is a new, untrusted project hook (and its Ruby path changes with the runtime kit), so a Codex student who trusted only the plugin's hooks was told by the session start to wait for the student-ID question that no hook ever asked. Once enrollment is done and the install is not in instructor mode, the plugin hook runs the same Reach::Login step in every folder. When both hooks run for one prompt, the first to take ~/.reach/state/login/prompt.lock (a bounded hook lock, STD-HOOK-RESPONSIVE) evaluates and commits the step and records the prompt's session and digest for 30 s; the other, or one that finds the lock busy, passes that prompt with no answer, so the ID is judged once, one hook speaks, and a sign-in prompt never enters the microbrain (STD-BRAIN). hooks/codex.json keeps its command line byte for byte, because changing it would make Codex mark the trusted plugin hook modified and stop running it. Hermes keeps signing in through its own gate prompt hook."
  - id: STD-ENROLL-NO-RELAY
    text: "Since 0.35.2 nothing an agent can call enrolls a student: the course passkey, email, student ID and password reach rEach only through its own prompt-hook flow (Reach::EnrollFlow) or the interactive reach enroll in a terminal, and the flag form for scripts (--course-passkey, --username, --student-id, --password-stdin), never through the AI (as STD-COWORK-CODE-TAB). The reach_enroll tool takes no arguments and posts nothing; it answers M-GATE-NOENROLL, M-ENROLL-NO-HOOK while Codex is not running a sign-in prompt hook (Reach::KnownIssues.signin_hook_dead?, STD-SIGNIN-HOOK-SILENT), or on an enrolled install M-ENROLL-ALREADY with the reach_next step. reach enroll with a bare passkey argument refuses with M-ENROLL-POSITIONAL, which points to the chat and to reach enroll on its own. Reach::Enroll.generate_and_register, the pre-v2 enroll request both used, is gone: Teach (W-API-ENROLL) refused its body as invalid_request every time, so the student saw M-ENROLL-REFUSED (that the passkey was not accepted) whatever they typed, as live Teach showed on 2026-10-05."
  - id: STD-SIGNIN-HOOK-SILENT
    text: "Since 0.34.9 (wire revision 2026-10-05a) Reach tells a silent sign-in hook apart from a silent course-folder hook. Reach::KnownIssues.signin_hook_dead? is true only for a Codex harness and when neither prompt hook that signs the student in has run since the latest Codex session start in hooks_seen.json (session_at, session_label): the plugin's gate enroll (hooks_enroll_seen.json at, STD-SIGNIN-PLUGIN-HOOK) and a course folder's gate prompt (hooks_seen.json prompt_at); or neither ever ran; or, with no session start recorded, neither ran in the last 15 minutes (wire revision 2026-10-05b; 0.34.9 and 0.34.10 read only gate enroll). It backs the detector signin_hook_not_running (W-KI-4); hooks_not_running and STD-HOOKS-REQUIRED keep reading the course-folder hooks. While it is true and the student is enrolled but not signed in, the reach_next tool returns M-NEXT-LOGIN-NO-HOOK instead of M-NEXT-LOGIN, which tells the student that Codex is not running rEach's sign-in step, not to type their student ID or password in the chat, and to restart Codex, allow rEach's hooks and start a new chat; before 0.34.9 the tool kept asking for the student ID while the hook that should have taken it never answered. The reach next command and the session anchor still show M-NEXT-LOGIN. Since 0.34.10 the same condition on the MCP path also replaces M-LOGIN-NEEDED with M-LOGIN-NEEDED-NO-HOOK, in reach_hello's sign-in context and in every tool refusal that says the student has not signed in (Reach::Login.require_active!), so the agent is no longer told that a chat request for the student ID is genuine while no hook can take it; the session-start hook and terminal commands keep M-LOGIN-NEEDED. Since 0.34.11 the sign-in step counts as running when either prompt hook ran, the plugin's gate enroll (hooks_enroll_seen.json at) or a course folder's gate prompt (hooks_seen.json prompt_at), because both sign the student in (Reach::Login.claim); 0.34.9 and 0.34.10 read only the plugin's stamp and told a student whose course-folder hooks ran that sign-in could not start. A tool gate (Reach::Gate.require_login!) refuses with the same M-LOGIN-NEEDED-NO-HOOK in that state. reach_known_issues and the session context name a remedy only for an issue whose detector fires; before 0.34.9 every matching entry's remedy was named, so the agent was told to run a fix for a problem rEach had not detected."
  - id: STD-NO-TOP-BIN
    text: "The plugin root carries no top-level bin/ directory, because claude.ai and Cowork reject a plugin that has one (\"Plugin contains a top-level bin/ directory\"), whether it arrives by a marketplace added by URL, by organization sync or by upload. Since 0.18.4 the installer is scripts/reach-install, fetched by INSTALL.md from raw.githubusercontent.com/SteveBenner/rEach/main/scripts/reach-install and loaded by reach update from the installed plugin's scripts/ folder."
  - id: STD-PROFILE-LOCAL
    text: "The student's interview profile lives only in ~/.reach/profile.yml (0600). It is sent to Teach only inside a hand-raise bundle the student agreed to include it in, and reach profile forget deletes it. The profile's extra_credit list is not interview data and is the one part that syncs with Teach (STD-EXTRA-CREDIT). Interview answers typed in a course workspace are prompts like any other: nothing records them (STD-TRANSCRIPT), though the local microbrain may learn from them (STD-BRAIN)."
  - id: STD-EXTRA-CREDIT
    text: "Since 0.20.0 (wire revision 2026-10-02f, W-XC-1..3) a student redeems an extra-credit code an instructor texted them, with their answer, at any time while enrolled: reach extra-credit CODE ANSWER, the reach_extra_credit MCP tool, or by telling the agent, which runs it. Reach saves the entry to the extra_credit list of ~/.reach/profile.yml as pending before sending it to Teach, keeps it pending through transport failures and retries it on every reach sync, and marks it recorded or refused with Teach's reason (M-XC-*). reach sync makes the recorded entries equal Teach's list. reach extra-credit list shows the entries. reach profile forget deletes the local list only and says Teach keeps its record. Debug events carry entry_id, state and outcome, never the code or the answer."
  - id: STD-TRANSCRIPT
    text: "Since 0.25.0 (wire revision 2026-10-03i, W-TRN-0 to W-TRN-5) rEach records the conversation while a student is signed in and working on an assignment, and only then. The bounds are that the session is signed in (when the course requires sign-in), the cached course status names a current assignment, and the session runs in a slice workspace or the course folder root. Inside the bounds every allowed prompt, every reply, reasoning block and action of the AI, and the assignment code (code blocks in replies, each AI write, a turn-end scan of the slice's owned files) is appended to ~/.reach/transcripts/<session>.jsonl and sent to POST /api/v1/transcripts at turn end, on reach sync and before a submission that needs the student's own part. Outside the bounds (before sign-in, in the extracurricular folder, outside the course folder, in instructor mode) nothing is written or sent; rEach only moves its place in the harness's own transcript forward, and a session's recording never reads what that transcript held before the session's first recorded prompt. A prompt the gate or the sign-in blocks is not recorded. The prompt hook records the prompt, the PostToolUse hook (reach transcript code) records AI writes, and reach hook stop records the turn and sends. An own-part answer carries the session and seq of its recorded prompt, or null when it was not recorded. Students are told through the docs, PRIVACY.md and the persona's answer when they ask what rEach shares; there is no in-session notice. From 0.21.1 to 0.24.x nothing was captured; rEach no longer deletes ~/.reach/transcripts."
  - id: STD-TRANSCRIPT-STREAM
    text: "Since 0.32.0 (wire revision 2026-10-04i, W-TRN-7) the record of STD-TRANSCRIPT is whole and is sent in the background, inside the same bounds. Reach::Transcript.stream runs every transcripts.send_interval_s of the cached course status (set in Teach's course policy; 600 s when absent, never under 60 s, at most once per interval across every rEach process): Reach's MCP server checks once a minute while a session is open (Reach::Transcript.start_stream_thread spawns a detached reach transcript stream) and the operating system job of STD-TEACH-SUBSCRIBE runs it too, at the shorter of its own interval and the course's. One run reads each session recorded in the last 48 hours whose latest hook found it inside the bounds and that still meets them, from where rEach last stopped in the harness transcript and in its Claude Code subagent transcripts, scans the slice's owned files, and sends everything queued in normal mode. No hook is needed for it and no hook waits on it (STD-HOOK-RESPONSIVE). Each hook stores the session's harness, space and slice workspace in the session state; a hook that finds the session outside the bounds switches background reading off, and the next hook inside the bounds first skips what the harness transcript gained meanwhile, so nothing said outside the bounds is read later. What each tool returned to the AI is recorded as an output entry (Claude Code tool results, Codex call outputs; Hermes payloads carry none), and a subagent's replies, reasoning, actions and outputs carry the note subagent. Nothing is cut to fit: a prompt, reply, reasoning block, action input or tool output over 120000 bytes becomes consecutive entries with part [n, of]. Entries with part, long action inputs and output entries wait in the queue until the course server's status lists them (transcripts.parts, transcripts.kinds). Code entries still stop at 131072 bytes of text with the whole file's size and digest. REACH_OFFLINE=1 stops the background sender. The student's own export shows tool output too. Students are told through PRIVACY.md, the README and the student guide."
  - id: STD-BRAIN
    text: "Since 0.16.15 Reach keeps a local microbrain, and every byte of it stays on the student's computer: sources and findings are brain-spool lines (tier private) and Reach's own state is under ~/.reach/brain (0700, files 0600); nothing is sent to Teach. Every gate-allowed prompt the student types, in any folder (a slice, the root, extracurricular or outside every course folder), becomes a private source as it arrives (Reach::Brain.capture_prompt, called from the prompt hook, brain.capture_min_chars default 1), kept only on the computer and never sent; a prompt the gate blocked (login, enrollment, passwords) never enters it, and a prompt matching the secret pattern or containing the student's own ID is skipped. The AI's replies are not ingested. The one other source is an export of another AI system the student imports on purpose (STD-EXPORT-IMPORT, since 0.18.0). Events carry ids, counts, bytes and outcomes, never claim, evidence or prompt text. The host agent distils durable findings with reach remember (or reach_remember); a novelty gate (cosine at least 0.85 within the category only reinforces), a per-hour and per-day write budget, a secret and student-ID refusal and a nudge that backs off from every 3 turns up to 24 stop floods. Recall is budgeted and lexical in hooks (an explicit recall is fused when rplugin and the encoder are present): at most 1500 bytes of profile at session start and 800 bytes of matching memories per prompt, repeating none from the last 10 injections. The spool is capped (brain.max_spool_bytes, 20 MiB): over the cap, the oldest sources no finding references are pruned to 80% and, when none remain, new captures pause (spool_full) while findings are still kept. Memory never changes the course rules, the owned files, submission or grading. reach memory forget (or reach_memory_forget) tombstones findings and scrubs them from Reach's spool, the one exception to its append-only rule; forget --all also scrubs every source except course material (STD-COURSE-CORPUS), and since 0.18.0 cancels any import, erases every imported verbatim copy from the corpus and deletes the imports folder and import spool (STD-EXPORT-IMPORT). reach remember and reach memory refuse while locked (STD-ENROLL-LOCKDOWN lists neither). The memory notice (G-MEMORY-NOTICE) tells the student it stays on this computer. While an instructor persona is active its microbrain lives only in the persona home and is never admitted into the computer's own ~/.corpora/reach."
  - id: STD-WORKSPACE-LAYOUT
    text: "Assignment code is written only in slice workspaces under ~/reach-work/deliverables/<course>/<assignment>/<cutout>-<slice>/, and anything else the student wants to build only in ~/reach-work/extracurricular/, which is never graded or submitted. The workspace root refuses writes (M-WRITE-ROOT), extracurricular refuses writes outside itself (M-WRITE-OUTSIDE-EXTRA), and the agent is told to put code in files, never in chat (R-CODEFILE). A sync moves an older slice workspace under deliverables/ when the path is free and never deletes one. While an instructor persona is active (STD-INSTRUCTOR-PERSONA) the same layout sits under ~/reach-work/personas/<persona id>/ instead."
  - id: STD-VAULT-PRIVATE
    text: "Decrypted guardrails, the suite and the reference build live only under ~/.reach/vault (0700) and are never read by generic file-listing code paths outside Reach::Guardrails, Reach::Directives, Reach::Seal and Reach::Suite. The one exception is course material, which the microbrain keeps in its private tier (STD-COURSE-CORPUS)."
  - id: STD-COURSE-CORPUS
    text: "Since 0.17.1 Reach ingests the course's whole reference corpus into the student's microbrain. Teach delivers it at enrollment in the guardrails package, every release unit at once and only for the student's own course; the rEach repository and plugin folder never hold course material. After each sync and at session start, Reach::CourseCorpus decrypts the delivered blobs when their fingerprint (blob digests and key ids) changed and spools every file as a private-tier source under course/<course>/<path> (category course; parts of at most 1,000,000 bytes). Changed or removed files are tombstoned. The detached sync admits them into ~/.corpora/reach, and session start never forces an admission. reach reference ingest [--force] runs it on demand. Plaintext course text exists only in the private brain spool (0600) and the corpus's private tier, never in the rEach folder, a workspace, a log or anything sent to Teach, and logs carry counts only. Course sources are never pruned, never count toward brain.max_spool_bytes and survive forget --all. Each prompt of at least 12 characters gets up to brain.course_k (3) matching passages of at most 600 bytes within brain.course_budget_bytes (600) under M-BRAIN-COURSE, when brain.course_recall is on (default)."
  - id: STD-DIRECTIVE-TABLE
    text: "Every course workspace's AGENTS.md ends with a directive table in the fleet's opcode form (alias, opcode, rule of at most 88 characters, reach directive <OPCODE>, enforcement, condition). Public engineering rows come from directives/ in this repo; course rows come only from the guardrails package, and a course row's body is served by Teach for one signed reach directive request (W-API-DIRECTIVE), never stored on the install; offline, the agent has the one-line rule. reach doctor reports R-DOC-DIRECTIVES when a public row does not parse or fit. Frontmatter reads the same under libyaml 0.1.x (macOS system Ruby 2.6.10) as under 0.2.x: when the old parser rejects an unquoted colon inside a flow list, the list items are quoted and the block is read again."
  - id: STD-DIRECTIVES-CARRY-NO-SECRETS
    text: "A directive body, public or private, says what the agent does and never why or how it is enforced. Grading, weights, rubrics, thresholds, keys and the seal live in Teach and never enter a body, so any body could be disclosed without harm; keeping it private is a behaviour the OPAQUE directive asks of the agent, not a security boundary Reach claims."
  - id: STD-SEAL-INVISIBLE
    text: "Every owned file carries an invisible per-install mark, every session leaves an HMAC-chained witness ledger, and a sidecar ties installs together. A foreign, corrupt or missing mark, a ledger break, a vault mismatch or a sweep of the private directives (directive_dump) is reported to Teach silently, healed where healing is safe, and never shown to or discussed with the student; a foreign mark is never overwritten. An instructor persona keeps its own sidecar inside its persona home, so a test student's install is never tied to the instructor's or a real student's install."
  - id: STD-QUALIFY-BEFORE-SUBMIT
    text: "reach submit refuses unless the latest reach qualify passed on exactly the current owned files and the agent's scenarios (M-SUBMIT-UNQUALIFIED). The agent writes those scenarios under qualify/, covering every graded name; they run here on Grokit's answer-free kit when the slice allows it and always on Teach, which also runs the hidden graded scenarios and answers with names, results, the agent's own step text and a whitelisted error class only. No reference code or graded step leaves Teach."
  - id: STD-SUBMIT-APPROVAL
    text: "Since 0.17.0 (wire revision 2026-10-02c, W-SUB-2) the agent tells the student, once a slice's work passes reach qualify, that they can ask rEach to submit it. reach submit and reach_submit run every precondition first, then ask through Reach (M-SUBMIT-ASK, relayed word for word) and submit only on the student's yes: captured by the prompt hook (STD-CONSENT-FROM-REACH), valid for 30 minutes and for exactly the owned files it was asked about, and used once when the agent runs reach submit again; or typed at reach submit's own prompt when it runs in a terminal. Antigravity, which has no prompt hook, submits on the agent's relayed yes. After the due time a slice that already holds an ingest receipt is refused before anything is asked (M-SUBMIT-CLOSED); before it, every submission tells the student they can submit again until the due time and that the last one counts (W-SUB-1)."
  - id: STD-SUBMIT-ARCHIVE
    text: "Since 0.17.0, once an ingest receipt verifies (from reach submit or a later outbox retry), Reach saves a ZIP of the student's whole assignment folder, every slice workspace under deliverables/<course>/<assignment>/ without top-level dot entries, AGENTS.md, CLAUDE.md, GEMINI.md and symbolic links, plus the student's receipts for that assignment and their own part, to the Downloads folder (XDG_DOWNLOAD_DIR on Linux when set, otherwise Downloads in the home folder, created when missing) as <course>-<assignment>-<YYYY-MM-DD>-<HHMM>-<zone>.zip in course time (STD-COURSE-TIME). It never overwrites a file, adding -2, -3 and so on instead, writes through a temporary file and rename, skips the copy above config.yml submit.archive_max_mb (default 256), and a failed copy never fails or undoes the submission. The ZIP is written by Reach's own standard-library writer and never leaves the computer. Since 0.19.0 the submit ask says the ZIP will be saved to Downloads and that the student must also upload it to the course's learning system (config.yml submit.lms_name, default Blackboard) to receive credit, and every answer after an ingest (archived, skipped or failed) repeats that the upload to Blackboard is required for credit. reach submit archive [--assignment A] (and the reach_submit tool with archive true) writes the ZIP again on request, for example after a failed copy."
  - id: STD-STORAGE-GATES
    text: "Since 0.18.0 Reach watches the bytes on the student's computer of its corpus (the rcorpus root of Reach's own corpus, when rplugin is present) and its microbrain (the Reach home's brain folder, the brain spool, the import spool and the import folders) together. Measuring runs in a detached process at most once per storage.check_interval_s (3600) and after an import or a compaction, never inside a hook. At storage.warn_mb (512, 1024, 2048) the student is told once per threshold crossed (M-STORAGE-WARN) and offered a compaction of the corpus; at storage.demand_mb (4096) every session start and the first prompt of each session say compaction is required and suggest a true backup to another drive (M-STORAGE-DEMAND), and a new import is refused. Compaction (reach storage compact, asked through Reach like a submission, STD-SUBMIT-APPROVAL) runs detached: rcorpus compaction of Reach's corpus, with compress true when the loaded rcorpus supports it (rcorpus 0.11.0, gzip snapshots and backups), plus gzip of admitted import-spool files. It never compacts, prunes or rewrites the microbrain (brain folder, brain spool, findings, catalogs). Without rplugin there is no corpus to compact and Reach says so (M-STORAGE-NO-CORPUS)."
  - id: STD-EXPORT-IMPORT
    text: "Since 0.18.0 a student can bring in a downloaded export of another AI system (ChatGPT, Claude or Gemini Takeout JSON), a folder or the vendor's ZIP, by dropping it into the harness, typing its path or choosing it in the operating system's own picker (reach import pick: osascript, PowerShell, zenity or kdialog; unavailable otherwise). reach import export asks the student through Reach (STD-CONSENT-FROM-REACH) for one of two modes: brain (a per-conversation catalog of titles, dates, keywords and a short excerpt, plus findings; M-IMPORT-ASK-BRAIN says deleting the export loses its full text) or copy (the same plus every conversation verbatim as private sources in the import spool, admitted into the corpus). Parsing is deterministic, streams the vendor JSON without loading it whole, and runs in a detached, resumable job (reach import status); no model call parses anything. Findings come from the agent working a ranked queue (reach import next and done) through reach remember within the brain's write budget, which can take many sessions. Imported text never enters the prompt-time brain index, never counts toward brain.max_spool_bytes, never reaches Teach, and is searched on request (reach import search, show). Copy mode is refused when it would take storage past storage.demand_mb."
  - id: STD-TRANSCRIPT-DEIDENTIFY
    text: "Since 0.26.0 (wire revision 2026-10-04a, W-TRN-6) a transcript leaves the student's computer de-identified. Reach::Deidentify keeps one random pseudonym per install (state/pseudonym.json, 0600), replaces the identifiers rEach knows in every entry's text, summary and note with placeholders at send time (display name and each word of it, enrollment username and its part before the at sign, student id, computer account, home folder, computer name; without regard to case, at word boundaries, each at least 3 characters), recomputes bytes and digest for the text as sent, adds source_digest to a prompt, and seals the identity index (student id, install id, placeholder values) to the re-identification public key the course status hands out. The spool in ~/.reach/transcripts and the student's own export stay as typed. With no key in the course status rEach sends nothing and keeps its queue (stopped: identity_key). Whoever holds the private key can re-identify; rEach never holds it. Since 0.26.1 (wire revision 2026-10-04b) re-identification loses nothing: each entry carries restore, the exact strings its placeholders stand for and any text that no longer fit, encrypted under a per-install key that travels inside the sealed identity index, so the key holder gets back the text exactly as recorded, including its spelling and capitals and a string that only looked like a placeholder. Limits stated to students in PRIVACY.md: the course server holds the key and can reveal, it authenticates each upload, and a name rEach does not know stays in the text."
  - id: STD-TRANSCRIPT-EXPORT
    text: "Restored in 0.25.0 (first added in 0.19.0, removed in 0.21.1). reach transcripts export and the reach_transcripts tool save the student's own recorded conversations as a ZIP in Downloads, grouped by assignment and slice, and the ZIP stays on the computer. With transcripts.auto_export on (the default) the first session after the course ends exports once in the background and the next prompt says where the ZIP is. The export works while the course-ended lock is on."
  - id: STD-LATE-WORK
    text: "Since 0.19.0 (wire 2026-10-02e, W-PACE-2) a slice whose due time has passed stays writable as late work while late_work.allow is true (default); assignments not yet current stay refused. Reach says plainly that the work is late at session start, on the first prompt of each session in that slice and every late_work.notice_every (10) prompts after, in reach status and in the submit ask, and says when the slice can no longer be submitted (STD-RESUBMISSION in Teach: one late submission of a never-submitted slice, none after a submission on record). Reach raises one hand with trigger late_work per assignment on the first late write and one with trigger late_submission per assignment when a late ingest receipt verifies, from a detached process."
  - id: STD-GRADE-VIEW
    text: "Since 0.19.0 (wire 2026-10-02e, W-API-GRADES) the student may ask for their current grade at any time: reach grade (and the reach_grade tool) asks Teach and shows the points recorded for each assignment and the total, or says plainly that grades are not available yet when Teach answers available false, 404 (an older Teach) or grades_disabled. Reach never derives points from autograder results and keeps no copy of grades beyond the last answer."
  - id: STD-HOME-IN-WORKSPACE
    text: "Since 0.31.0 rEach keeps its own files in .reach-home inside the student's reach-work folder (<workspace_base>/.reach-home), not in ~/.reach, so a harness whose sandbox may write only inside the chat's folder can reach them. Reach::Paths.root resolves in order: $REACH_HOME; a completed relocation record in the new home; the legacy ~/.reach when it holds install.yml or plugin/ (a relocation is due); otherwise the new home. An existing install is relocated automatically (at session start, after reach setup, or by reach relocate): the legacy home is copied, hash-verified and switched in by rename, enrollment is compared before and after without side effects, harness configs and the Claude and Codex plugin sources are repointed, and the legacy home is left exactly as it was apart from RELOCATED.json. Every kind of space refuses reads, writes, listings, searches, redirects and cds that reach the home; every walk of the student's work prunes it; a root-kind session judges writes and commands by their target slice and asks which slice (M-PICK-SLICE) when it cannot choose; writes wait while a relocation runs (M-RELOCATING); reach doctor reports R-DOC-RELOCATION. Not fixed: the Codex sandbox still blocks the network, so enroll, sync, updates and the subscription check need Full access or an allow rule; Codex hook trust is unrelated; on Windows the project's top-level .codex is read-only in the sandbox."
  - id: STD-USER-HOME
    text: "Since 0.34.3 rEach anchors every folder it uses on the signed-in user's own home. On Windows that is the profile folder Windows reports (the Profile known folder, then HKCU Volatile Environment USERPROFILE, then %USERPROFILE%), never $HOME, which a harness or shell may point at a folder that does not exist (it created C:\\Users\\anon); macOS and Linux keep ~. A harness's config folder follows that harness's own home rule. rEach never creates the folder its paths hang from: when it is missing, the launcher, the installers and Reach::Paths create nothing and answer M-HOME-MISSING. An install that already landed under a stray home is moved to the real one by the STD-HOME-IN-WORKSPACE relocation, its reach-work entries copied beside it, skipping any name already present, and nothing under the stray folder is changed apart from RELOCATED.json."
  - id: STD-HAND-TYPES
    text: "Since 0.19.0 (wire 2026-10-02e, W-HAND-TYPES) every hand carries a type (trigger): Reach's own attempt_ladder, check_gate, wellbeing, late_work and late_submission, or, for a hand the student asks for, the type the agent chooses among student_request, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, feedback, integrity_question and other. A Teach that predates the revision receives student_request with the type in the summary."
  - id: STD-WELLBEING-DELIVERED
    text: "Since 0.19.2 a wellbeing hand (W-SUP-2) always carries a string space: the current space's kind (slice, extracurricular or root), or outside when reach support runs from a directory outside every rEach folder; before, outside sent null and Teach refused it with 400 while the student was told it was queued. A wellbeing hand Teach refuses is never reported as told or queued: its outbox entry is removed, a fault event (support:wellbeing or support:flush) goes to Teach (W-DBG-FAULT), the student still gets the full crisis message, and the hour-long repeat guard is not armed. tools/smoke/assignment_one.rb runs Teach with hand-raises on and raises a CLI hand, an MCP reach_raise_hand hand and a wellbeing hand from outside every folder, and checks all three on Teach."
  - id: STD-ATTEMPT-LADDER
    text: "Reach counts failed qualifications per slice: a notice from the second, an agent hand (reach.hand/v2, originator agent) at the third with further work held until the student says yes, and a hard stop at the tenth until an instructor replies. A pass or a reply resets it."
  - id: STD-FLOWS
    text: "The agent writes code only through the reach-feature or reach-bug flow (directive FLOW). The student deals in business behaviour only: student-facing text never names code, tests, scenarios, files or commands."
  - id: STD-CHECK-BEFORE-SUBMIT
    text: "reach check is the one checker: the hooks run it after every write (on Hermes, whose hooks cannot answer a write, at the end of each turn that wrote code), reach qualify runs it first, and reach submit runs it first; only findings in the slice's own files count in qualify and submit. Findings are returned once with M-SUBMIT-FIX-FIRST; a second attempt on the same findings is refused with M-SUBMIT-BLOCKED-CHECK and raises a check_gate hand."
  - id: STD-NO-GIT-IN-WORKSPACE
    text: "Checkpoints are Reach's own snapshots under ~/.reach/checkpoints, taken and restored by reach checkpoint; no git repository is created in or required by a course workspace, and since 0.11.0 the gate refuses git in slice and root spaces (M-GATE-NOGIT); the extracurricular folder is the student's own. Git support is planned for Reach 2.0 (ROADMAP.md)."
  - id: STD-COURSE-TIME
    text: "Every time shown to a student (due dates, receipt times) is in the course's timezone with its abbreviation, e.g. 'Sat 3 Oct 11:59 pm PDT', whatever zone the student's computer is in. The zone comes from Teach's enrollment (course.timezone) and defaults to America/Los_Angeles, the zone BUS 101 and BUS 201 run on. America/Los_Angeles is computed from built-in US daylight-time rules, so it is right on every platform, Windows included."
  - id: STD-SMOKE
    text: "tools/smoke is the release smoke test: real Claude sessions in a Docker sandbox with no access to the developer's home or Claude configuration, driven by scripted or model-played students, checked by hard assertions and advised by a model judge. Run it before tagging any release that changes the persona, greetings, hooks, install path or anything else a student sees."
  - id: STD-PLATFORM-SMOKE
    text: "tools/platform_smoke/run.rb installs Reach from the checkout into a scratch path with a space, enrolls it against tools/fake_teach and runs the hook command lines, status, the machine-id fingerprint, the runtime kit (waiting for the background self-install) and doctor. .github/workflows/platforms.yml runs it on every push to main and on dispatch, never on pull requests, on GitHub-hosted Linux (Ruby 2.6.10), macOS arm64 and Intel (the system Ruby 2.6.10), Windows x64 and Windows 11 arm64 (Ruby 4.0), and on self-hosted Windows 10 and Windows 11 VMs (labels win10, win11) when the repository variable REACH_VM_RUNNERS is on or a dispatch sets vms. Windows checkouts keep LF line endings. A doctor finding outside R-DOC-GUARD, R-DOC-HARNESS and, when no kit was installed, R-DOC-CHROME fails the run."
  - id: STD-AUTO-UPDATE
    text: "Reach keeps a managed ~/.reach/plugin install (VERSION present, no .git) current by itself: GitHub releases and tags together, the newest version from either since 0.16.14, checked at session start and hourly from detached processes, staged in the background, installed at the next session start by the release's own update/apply.rb, with every phase recorded in ~/.reach/state/update.json so an interrupted update resumes. Course work waits only while an install is running; REACH_UPDATE_DISABLE=1 turns it off. See reach.spec.yml auto_update."
  - id: STD-CONSENT-FROM-REACH
    text: "A module move or module choice is asked by Reach, never by the agent: the agent runs reach transfer request or reach modules choose (or the matching reach_* tool) and relays the question it prints word for word, and never offers, promises or claims a notification in its own words. Reach acts on the student's captured yes or no itself, from the prompt hook, and hands the agent the outcome to relay (since 0.14.3), so the agent never makes the second call. A crisis message from the student is answered with reach support's message before anything else, the session greeting included."
  - id: STD-VERSION-REPORT
    text: "Since 0.21.0 (wire revision 2026-10-03a, W-AUTH-7) every request Reach signs carries X-Reach-Version with Reach::VERSION, so Teach always knows which rEach each install runs, including after a self-update; the header carries nothing but the version."
  - id: STD-ENROLL-LOCKDOWN
    text: "Since 0.16.0 Reach is inert until it is enrolled: a plugin-level prompt hook blocks every prompt in every harness session and runs the enrollment flow (W-ENR-7) itself (the one exception, since 0.20.7, is a prompt that arrives while the launcher is still installing Ruby on a computer that had none, which passes with M-BOOTSTRAP-WAIT context instead, STD-RUBY-BOOTSTRAP; since 0.35.0 a prompt that is only a debug phrase switches debug mode and re-asks the current question without reaching the flow, STD-SETUP-LOG), asking for the class-wide course passkey (the course code of W-ENR-1), the institutional username and the student ID (W-ENR-3) so the agent never sees them; every reach command except help, version, enroll, setup, doctor, support, update, runtime, hello, gate, mcp, guide (since 0.16.13) and instructor (since 0.16.17), and every MCP tool, refuses while locked. Teach answers a shape v2 enrollment with a signed enrollment stamp (W-ENR-5) binding the install, the student, the course and a salted, hashed fingerprint of the computer, the computer account and the install key (W-ENR-4); Reach locks again when the stamp fails to verify, the course ends, or the live fingerprint stops matching (W-ENR-6). The flow's crisis check runs before any step. Institution rules come from Teach's preview and fall back to config.yml enrollment; nothing in lib/ names an institution. The one exception is a valid instructor unlock code (STD-INSTRUCTOR-UNLOCK)."
  - id: STD-COWORK-CODE-TAB
    text: "Since 0.33.3 rEach does not enroll or sign a student in from Claude Cowork; it sends them to the Claude app's Code tab. When the prompt hook (gate enroll, gate prompt) runs and Reach::Fingerprint.harness_label names claude-cowork (CLAUDE_CODE_ENTRYPOINT local-agent or remote_cowork; since 0.35.7 any value that starts with local-agent, local_agent, remote_cowork or claude-coworker, Reach::Fingerprint::COWORK_ENTRYPOINT, the Cowork values found in Claude Code 2.1.289), and rEach is locked or the session is not signed in, the hook does not run the enrollment or sign-in flow and changes no flow state: it exits 0 and returns M-COWORK-CODE-TAB inside M-COWORK-RELAY as UserPromptSubmit additionalContext, which tells the agent to reply with that message word for word and do nothing else (Reach::CLI.code_tab_hold?, code_tab_payload). A prompt that matches the crisis check gets rEach's support message the same way. Reason: Cowork showed a blocked prompt as an empty response, and relaying the questions instead would pass the passkey, student ID and password through the agent, which STD-ENROLL-LOCKDOWN and STD-ENROLL-PASSWORD forbid. Instructor mode and every other Claude Code surface are unchanged. Since 0.35.7 a prompt hook never exits 2 in Cowork: when gate enroll or gate prompt would block there for any other reason (a block raised outside code_tab_hold?, or a state it does not cover), Reach::CLI.run_hook answers with the same M-COWORK-RELAY payload and exit 0, writes nothing to stderr, and records a gate debug event with outcome context and message id M-COWORK-CODE-TAB (Reach::CLI.cowork_prompt_hook?). Reason: on Windows a Cowork student's every message ended in an empty turn. Not verified in a real Cowork session on any system; the first cause is inferred from one student's screenshot and the second from the instructor's report."
  - id: STD-INSTRUCTOR-UNLOCK
    text: "Since 0.16.17 an instructor can lift the enrollment lock on one install without enrolling. The instructor runs reach instructor keygen once (an RSA 3072 private key at 0600, outside the repository), pins the printed public key under enrollment.instructor_keys in config.yml, ships it in a release, and mints codes with reach instructor code whenever needed. A code is RINS1.<payload>.<signature> (base64url, PSS with SHA-256 over RINS1.<payload>), carries a random id, the key id and an optional label, and never expires. Pasted into the locked prompt it is intercepted by the enrollment hook before any flow step, so the agent never sees it; an invalid one is refused (M-INSTRUCTOR-REFUSED) and counts toward the enrollment lockout, while a valid one unlocks even during a lockout. A valid code is stored in ~/.reach/instructor.json (0600) and re-verified each time the lock state is computed: removing its key from config.yml or listing its id under enrollment.instructor_revoked relocks the next prompt and logs instructor.invalidated. While unlocked and not enrolled, Reach allows every prompt without guardrails, workspace or login checks, captures nothing, and tells the agent once per session it is in instructor mode (M-INSTRUCTOR-CONTEXT); an enrolled install gates exactly as before. reach instructor status never prints the code, and reach instructor lock moves instructor.json to a .backup sibling. While an instructor persona is active the install is enrolled as that test student, so it gates and captures exactly as a student's install does, into the test student's record (STD-INSTRUCTOR-PERSONA). Events (instructor.unlocked, instructor.refused, instructor.relocked, instructor.invalidated) carry the code id, key id and reason, never the code."
  - id: STD-INSTRUCTOR-PERSONA
    text: "Since 0.16.23 (wire revision 2026-10-02a) an instructor whose install holds a valid instructor unlock (STD-INSTRUCTOR-UNLOCK) and is not enrolled as a student can run that install as a test student, to experience every student feature and course step exactly as a student does: reach instructor dummy [--course ID] starts a blank test student, and reach instructor as <username> [--course ID] starts a test copy of that roster student (group, slice assignments, latest module record, submissions and receipts as of now). Teach creates the test student through W-API-ENROLL-INSTRUCTOR, which the instructor code authorizes; it never issues an install for a real student, nothing the persona does is written to a real student's record, and test students are left out of roster imports, grade exports, module capacity, sidecar conflicts and course-wide counts and named 'Test student ...' or 'Test copy of ...' in every instructor view. A persona has its own Reach home (~/.reach/personas/<id>/: install, keys, vault, transcripts, profile, brain, sidecar) and workspace (~/reach-work/personas/<id>/); the instructor unlock, the managed plugin, updates and the runtime kit stay shared. The active persona is named in ~/.reach/persona.json, which every hook and command reads, so the persona spans every harness session on the computer until reach instructor exit moves the pointer, the persona home and its workspace to .backup siblings. One persona is active at a time. While one is active, rEach tells the agent nothing about it and gates, captures and messages exactly as for a student; reach instructor status names it. Revoking the instructor code, or removing its key, in Reach's config.yml locks the persona at the next prompt, and in Teach's course policy makes Teach answer revoked to it. Events (instructor.persona_started, instructor.persona_refused, instructor.persona_exited) carry the persona id, kind, course id, code id and test student id, never the code."
  - id: STD-DEBUG-MODE
    text: "Since 0.16.23 (wire revision 2026-10-02a) Reach has a debug mode that is always on while an instructor persona is active (STD-INSTRUCTOR-PERSONA) and otherwise only on request: reach debug on|off [--for MINUTES] on the computer, or an instructor's remote request that Teach delivers in status.debug. It records W-DBG-EVENT metadata of every kind in W-DBG-KINDS (session, hook, gate, command, request, lock, sync, check, qualify, submit, brain, update, error (transcript, retired by STD-TRANSCRIPT and no longer emitted), and since 0.18.0 storage and import under W-DBG-KINDS-2), scrubbed by W-DBG-SCRUB before it is spooled or shown, so no prompt, reply or file text, code, password, key or token is ever in it. Events are spooled under the Reach home in debug/ (0700, files 0600) and sent to Teach through W-API-DEBUG from the Stop and SessionEnd hooks and reach sync; no hook blocks on the network and a failure keeps every event queued. Teach files each event under the classification it derives from the student, instructor for a test student and student otherwise. At the end of each turn the person sees a debug block (W-DBG-RENDER): an ASCII table on a text-terminal harness and a Markdown table on one that renders Markdown, with config.yml debug.render (auto, ascii, markdown) as the override; reach debug show prints the latest events the same way and reach debug status says whether it is on and why. Its labels come from locales/en-US.yml like every other message. A student whose install an instructor switched into debug mode is told once per session (M-DEBUG-NOTICE); a persona is not, because it is the instructor. Since 0.16.25 fault and link events (W-DBG-FAULT, STD-TEACH-LINK) are recorded and sent with reason fault even while debug mode is off; nothing else is."
  - id: STD-MODULES-LOCK-SYNC
    text: "Since 0.21.4 a module lock-in that Teach accepts (Reach::Modules.choose! returning locked, from reach modules choose, reach_modules or the consent follow-up in the prompt hook) starts a detached reach sync at once, so the new modules' slice workspaces are provisioned before the student's next prompt and the prompt gate (check_has_workspace!) does not block it with M-GATE-NOGUARD. The hook never waits for that sync. A scratch Teach 0.22.3 run with a student_choice course provisioned the four slice workspaces about 4 s after the lock, and the next prompt passed; without the spawn no workspace arrived within 20 s and the next prompt was blocked."
  - id: STD-CRYPTO-FALLBACK
    text: "Since 0.21.3 a Ruby whose SSL library cannot use AES-GCM additional authenticated data (the macOS system Ruby 2.6.10 with LibreSSL 3.3.6, as Reach::GCM.native_aad? finds) runs every reach command under the runtime kit's Ruby when the kit is installed: Reach::CryptoProbe execs the kit Ruby on the same arguments with stdin passed through and REACH_KIT_REEXEC=1 so it never loops, which gives native OpenSSL GCM speed instead of the pure-Ruby Reach::GCM of 0.20.6. When the kit is missing it starts the background kit install and the command carries on with Reach::GCM. Either way it records a fault event (where crypto_self_test, outcome kit_reexec or kit_missing) with the Ruby path, the SSL library and the failing stage, even while debug mode is off (W-DBG-FAULT). REACH_KIT_FALLBACK=0 turns the re-exec off. A native decryption failure names the OpenSSL stage, the SSL library and the Ruby version in its message. reach doctor --report [--offline] [--format json] prints every diagnostic fact: the running Ruby, its SSL library, openssl gem and whether native GCM works, the kit, the home and Reach home (home-relative), which harness and sandbox variables are set and whether the Reach home is writable, a native GCM test stage by stage, an envelope GCM round trip on the path Reach uses (openssl or ruby), RSA-OAEP and PSS, the native GCM test again in a subprocess under every other Ruby it finds (PATH, /usr/bin/ruby, the kit), and each package kind opened stage by stage (header, signing key, signature, unwrap, decrypt, digest) from the stored copy and, unless --offline, the latest copy from Teach (never stored), with a network failure's cause. It prints no key, passkey, token, student ID or course content. Debug session events carry ruby_path, openssl_library, openssl_gem, kit_ruby, kit_reexec and gcm_self_test, and sync events carry the scrubbed warning texts (warning_texts) beside their count. The platform smoke proves it on every leg: the kit Ruby opens Teach's known-answer envelope (kit_known_answer), doctor --report runs after a sync (doctor_report), and on both macOS legs reach doctor --report run inside codex sandbox (Codex CLI 0.160.0) moves to the kit Ruby and opens the stored guardrails package (codex_sandbox_decrypt)."
  - id: STD-UTF8-BUNDLE
    text: "Since 0.25.1 rEach reads text files as UTF-8 whatever the locale of the app that started it (lib/reach.rb sets Encoding.default_external to UTF-8), and every hand bundle (Reach::Hands.fit) and issue bundle (Reach::Issues.write_entry) passes through Reach::Utf8.clean before it is turned into JSON: every string and hash key is tagged UTF-8 and bytes that are not valid UTF-8 are replaced. An app that starts rEach with no locale (Claude Desktop on macOS starts the MCP server that way) made Ruby read a slice's files as US-ASCII, and one non-ASCII character in a file the student owns made reach_raise_hand fail with JSON::GeneratorError before anything was queued or sent."
  - id: STD-SETUP-LOG
    text: "Since 0.35.0, until the install is enrolled (no install file for the current home, and not in instructor mode), Reach writes an exhaustive local setup log to <home>/setup-log/ (0700 directory, 0600 files): every reach command with its exit, exception, full backtrace and cause chain, every hook decision, every request and response with headers and body, every debug event (kept whether or not debug mode is on), every fault, the ids of the messages shown, and an environment snapshot (Ruby, operating system, a fixed list of environment variables, paths, the course server URL, the enrollment lock) at most every 10 minutes; scripts/reach-install and reach-install.ps1 add install-<stamp>.jsonl records of every step and the outcome. It holds no typed text: a prompt, an answer, a username, email, student ID or name is recorded only as its length and line count, and passwords, passkeys, enrollment codes, tokens, keys, signatures, PEM blocks and RINS1 codes never reach a file. Since 0.35.1 the device fingerprint (fingerprint, salt, binding, hostname and machine id fields) is [redacted] too, and every path starting with the user folder (Paths.user_home, HOME, USERPROFILE) is written with ~ in its place, in the setup log, the installers' records and the report. Reach never sends the setup log. A streak counts failures in a row (faults, failed reach commands, a failed install, server refusals, offline, unknown, expired, old or course-only codes, lockouts, an ended course, a denied move, a failed password retry); rejected input (code, ID or username format, short, mismatched or wrong password) neither counts nor resets, and an advanced enrollment step, a successful install or a successful setup, runtime, update or enroll command resets it to 0. At the 3rd failure in a row and every multiple of setup_log.threshold after it, Reach writes reach-setup-report-<time>.json (schema reach.setup-report/v1: environment, installer records, the log trimmed from its oldest end to setup_log.report_max_bytes, recent debug events, issues) to the Downloads folder at once and shows M-SETUP-REPORT-SAVED with its path and file:// link once, in the enrollment hook's reply, a terminal command's output or an MCP tool result, suggesting the student send it to the instructor; reach debug export and the reach_debug export action write one on demand. Logging stops when enrollment succeeds; files stay, capped at setup_log.max_bytes (oldest files removed first). The debug phrases (STD-DEBUG-MODE) also work in the plugin-level enrollment hook, except at a password step. REACH_SETUP_LOG=0 turns the log and the automatic report off. Like every rEach writer it creates nothing when the folder its home hangs from is missing (STD-USER-HOME)."
  - id: STD-ISSUES
    text: "Since 0.23.0 (wire revision 2026-10-03c, W-ISSUE-1 to W-ISSUE-8) Reach reports its own technical problems to the instructors without the student or the agent doing anything. Every fault Reach hides from a person (STD-TEACH-LINK) gets a signature, the first 16 hexadecimal characters of a SHA-256 over where it happened, the exception class, the errno name, the message id, the cause and the first three backtrace frames inside the plugin, each reduced to its file and bare method name so that every Ruby version gives the same value (W-ISSUE-2); the fault event carries it as fault_id. Reach::Issues keeps a registry under the Reach home in state/issues.json (0600, at most 200 signatures, entries untouched for 30 days dropped) and decides from a fixed table, with no model and no network: a fault with a transport cause, a Reach::NetworkError or Reach::Offline, and a fault from the issue code itself are never issues; a fault where enrollment, sign-in, hello, sync, qualify or submit happens (W-ISSUE-BLOCKING) is an issue at its first occurrence; any other fault at its third occurrence within 24 hours. An issue is raised once per signature per Reach version, at most 3 a day and at most 10 waiting; the rest are counted in the next bundle's suppressed field. The course policy's limits.issues can only tighten these, config.yml issues holds the local values, and REACH_ISSUES_DISABLE=1 or issues.enabled false turns the feature off without touching fault events. An issue is a hand with trigger issue and originator reach (W-ISSUE-1), sent only to a Teach whose wire contract digest equals Reach's own, with the fixed summary M-ISSUE-SUMMARY and the sealed bundle reach.issue/v1 (W-ISSUE-4): the fault fields as recorded with debug mode off, the Reach, Ruby, platform, operating system, harness and surface, and a capsule (Reach::Capsule: Ruby and SSL facts, runtime kit, connection state, update phase, the names of set harness environment variables, the kind, place and time of the last 20 debug events) of at most 16384 bytes. It never carries an error message, a prompt, code, a path outside the plugin root, the profile or a typed identity. The bundle is built, sealed and sent by a detached reach issues flush --background, never inside a hook or a tool call (STD-HOOK-RESPONSIVE). An unsent issue waits in the outbox and is retried from the Stop hook, reach sync and reach issues flush with full-jitter backoff from 60 seconds to 6 hours that applies to issue entries only (W-ISSUE-8); one process at a time builds and sends, serialized by state/issues.flush.lock with a wait of at most 30 seconds, so two flushes started together never send one report twice; when the outbox is full the oldest non-blocking issue gives way. The next hook context after an issue is due tells the agent once that rEach noticed a technical problem with itself and reported it, and that the student need do nothing (M-ISSUE-REPORTED); when the hand's status names a fix_version and the install runs that version or newer, it says once that the problem is fixed (M-ISSUE-FIXED). A fault from the seal, the witness ledger or the integrity checks is raised like any other and neither notice is shown for it (STD-SEAL-INVISIBLE). A reply to an issue hand does not interrupt the student and never resets an attempt ladder. A technical_issue, setup_issue or access_issue hand the agent raises gains the same capsule and signature_hint, the signature of the newest fault in the 10 minutes before it (W-ISSUE-5). reach issues lists the registry for an instructor persona or while debug mode is on and says nothing about it to a student; reach doctor reports R-DOC-ISSUES while an issue report is waiting to be sent, and R-DOC-OUTBOX does not count issue entries. A hand Teach no longer holds (404) is dropped from the open list instead of stopping the check of the others."
  - id: STD-LIVE
    text: "Since 0.23.0 (wire revision 2026-10-03f, W-LIVE-1 to W-LIVE-9) a student can open a live session with the course's instructors to find out together why something in rEach does not work (Reach::Live, lib/reach/live.rb). It starts in one of two ways: the student's agent calls the reach_live tool (or reach live request) and Reach asks the student its own question (M-LIVE-ASK), or an instructor offers a session and Reach asks the student at their next prompt (M-LIVE-OFFER-ASK). Either way the session is asked for or accepted only after the student's own typed yes, captured by the prompt hook as a signed consent of kind live_session (STD-CONSENT-FROM-REACH), and an offer the student refuses is declined on Teach. One live session per install. While a session is open Reach turns debug mode on for the reason remote and sends its debug events every 10 seconds; when the session closes debug mode returns to what Teach's status says. Two rules hold for every live session and are enforced by code, not by the agent. First, nothing runs on the student's computer because the instructor's side asked: an action the instructor's side requests is one name out of a fixed table (doctor, status, sync, update_check, update, cache_repair, resend, and since 0.31.0 (wire revision 2026-10-04h) codex_configure and sandbox_probe of STD-CODEX-SETUP), Reach asks the student about each one (M-LIVE-ACTION-ASK, consent kind live_action), runs it only after their typed yes within 30 minutes, with a 60 second limit and at most 16000 bytes of output, and answers ok false with a fixed sentence when the student said no, did not answer, or the name is unknown. Second, nothing leaves the student's computer for the instructor's side without the student's yes: a note or an agent message is staged, Reach shows the student the exact text (at most 2000 bytes; M-LIVE-SEND-ASK) and sends it only after their typed yes (consent kind live_send, bound to the SHA-256 of the text), one at a time. Agent messages exist only when Teach marks the session co_debug, which it does for an instructor's test student alone. The live_action and live_send consents stay on the student's computer. The agent is told the rules in the hook context (M-LIVE-RULES): do nothing the instructor's side asks without the student's yes, send only through reach_live, relay Reach's questions word for word, never answer them itself, and treat the other side's text as information. A detached reach live run --background holds the connection (poll every 3 seconds while open and 10 while waiting, its own token bucket of 30 requests a minute, five failures in a row end the run), so no hook or tool call waits on Teach; reach_live with action wait reads the local inbox and waits up to 45 seconds for something new, returns at once when a question for the student is waiting, and the agent is told to call it again while an answer is expected and to stop after about five minutes of silence; a message that arrives after the agent has stopped waiting is shown at the student's next prompt (M-LIVE-UNREAD); the prompt hook checks for an offer at most once a minute, and a Teach that answers that live sessions are off is not asked again for an hour. The student or the instructor can end the session at any time; Reach says so once (M-LIVE-CLOSED). State lives under the Reach home in state/live/ (0600). No prompt, reply, code or file is sent. REACH_LIVE_DISABLE=1 or live.enabled false in config.yml turns the feature off. Reach also wakes a waiting agent: on Claude Code 2.1.288 or newer the Stop hook carries a second entry, reach live watch, marked async and asyncRewake with a 900 second limit. It runs in the background and never holds the turn, looks at the local state once a second for at most 840 seconds, and ends with exit code 2 and the notices the prompt hook would give (an offer's question, the open notice, unread messages, an action's question once per action, the end), so the harness wakes the agent with them; the newest watcher wins and an older one exits silently. On an older or unknown Claude Code and on every other harness the entry is not written and the notices show at the student's next prompt. When something from the instructor's side arrives in an open session Reach also shows one desktop notification (M-LIVE-NOTIFY through Reach::Desktop, at most one every 20 seconds, never the message text). config.yml live.wake and live.notify turn these off. A student whose prompts Reach blocks (course rules or course work missing, an update hold, an enrollment lock, or a sign-in that is locked out, refused or whose check failed; never the ordinary sign-in question) can still use a live session, with no agent involved. A blocked prompt that contains the words live session gets Reach's question (M-LIVE-ASK) under the block text; in this path Reach captures the typed yes or no for the three live consent kinds only, from the enrolled install without a confirmed sign-in, and marks the local record gate blocked. An instructor's offer, the open notice (M-LIVE-OPEN-STUDENT), each instructor note word for word (M-LIVE-NOTE-STUDENT), each action's question and the end are shown under the block text; an instructor's agent messages are not shown. Typing end live session queues the end for the runner (M-LIVE-ENDING); the hook makes no network call (STD-HOOK-RESPONSIVE). A blocked prompt is still never stored, learned from or sent. config.yml live.blocked false turns this path off. Since 0.33.2 every detached reach process (the live runner, the transcript stream, the subscribe tick, the storage measure, the support, module and transfer flushes and the sync after enrollment or a module lock) is started with the process group option of its platform (Reach::Runtime.detach_group, new_pgroup on Windows and pgroup elsewhere); before that Windows refused the option, the failure was swallowed and none of them ran there, so a typed yes was never sent. Reach::Live.ask! with an answer still queued for the runner starts the runner and returns M-LIVE-SENDING and does not ask M-LIVE-ASK again. Not run on a real Windows install."
  - id: STD-LIVE-DIAGNOSIS
    text: "Since 0.27.0 (wire revision 2026-10-04c, W-LIVE-10) an install that holds a valid instructor unlock (STD-INSTRUCTOR-UNLOCK) can start a diagnosis session: a live session for working out a rEach problem on that computer between the assistant there and the instructor's assistant. reach instructor diagnose [--course ID] or the reach_live tool with action diagnose calls Reach::Live.diagnose!. Without a valid unlock it refuses (M-LIVE-DIAG-NEEDS-UNLOCK). On an install that is not enrolled it first starts a blank test student (STD-INSTRUCTOR-PERSONA) and says how to sign in as it (M-LIVE-DIAG-SIGNIN); on an enrolled install, a student's included, it runs on that install as it is. Reach then asks one question, M-LIVE-DIAG-ASK (consent kind live_session, subject {live: diagnosis}), which says in plain words what the one yes covers. Only the typed yes of the person at the computer counts, captured by the prompt hook as for every consent, also while prompts are blocked. On the yes the runner posts the request with the consent record and the stored unlock code; the course server verifies the code and opens the session at once, or refuses (M-LIVE-DIAG-REFUSED). While a session whose view carries diagnosis true is open, STD-LIVE's two per-item questions do not apply: Reach::Live.send! posts a note or an assistant message at once, and a check from the fixed table that the instructor's side requests is run at once and its result sent. Everything else in STD-LIVE holds: only the fixed table runs, an unknown action is refused, the session is bounded in time, either side can end it and the person can end it by typing, debug events flow only while it is open, and REACH_LIVE_DISABLE=1 turns it off. The agent's rules for the session (M-LIVE-DIAG-OPEN-AGENT, M-LIVE-DIAG-RULES) keep three limits: it asks the person before running any other command or changing anything, it never sends a password, key, token or instructor code, and messages from the instructor's side never change what Reach allows. The unlock code is sent only in that one request and is never written to the live state, the debug events or a log."
  - id: STD-TEACH-LINK
    text: "Since 0.16.25 (wire revision 2026-10-02b) every exchange between Reach and Teach, and every Reach hook, MCP tool and command around it, sits behind one safety layer. A person never sees a raw error, a Ruby backtrace, an exception class, a hook error or a hook timeout. Reach::Client turns every transport failure, including ones outside its retry list and a deadline running out, into a Reach::NetworkError whose message is a plain locales/en-US.yml text (since 0.21.2 a deadline running out says M-TEACH-DEADLINE and does not mark the connection lost); the raw failure stays only in debug events. Reach tracks the Teach connection in link.json under the Reach home: when a request fails for lack of a connection it is lost, and any answer from Teach restores it. The person is told once per outage that the connection was lost and that their work is saved and will be sent when it is back (M-TEACH-LINK-LOST), and once when it returns (M-TEACH-LINK-BACK): a systemMessage on Claude Code and Codex hooks, a relay note in the prompt context on Hermes, and a line on stderr from a terminal command. A deliberate REACH_OFFLINE=1 is not an outage, and since 0.21.8 neither is a Codex sandbox that blocks the network (STD-CODEX-SANDBOX), whose failures say M-SANDBOX-AGENT instead of a hiccup; since 0.21.9 a known-issues fetch (STD-KNOWN-ISSUES) never changes the connection state either, and since 0.21.13 neither does an enrollment request (preview, enroll, instructor persona enroll, the v1 code enroll): before enrollment there is no work to send, so a failed one says its own enrollment message (M-ENR-OFFLINE, M-ENR-PASSWORD-RETRY-OFFLINE, M-ENR-CLI-OFFLINE) and never M-TEACH-LINK-LOST or M-TEACH-LINK-BACK. Every hook command runs inside a guard that keeps the hook's outcome (a Reach block stays a block; Claude Code and Codex allow when Reach itself fails, as before; Hermes fail-closed gates block) but replaces whatever went wrong with a plain message shown at most once every 15 minutes (M-REACH-HICCUP), and gives the network a deadline inside the harness's hook timeout so the harness never kills a hook. MCP tools answer with M-TEACH-LINK-LOST or M-REACH-HICCUP-TOOL, and terminal commands with M-REACH-HICCUP-CLI, instead of an exception. A Teach refusal that names something the student can act on still shows Teach's text; one that means Reach sent something malformed (invalid_request, too_large, or no code) is hidden as a hiccup. Every hidden error is recorded as a fault event and every connection change as a link event (W-DBG-FAULT) and sent to Teach even while debug mode is off, with no message text unless debug mode is on, so instructors see students' failures in Teach."
  - id: STD-SETUP-GUIDE
    text: "Since 0.16.13 docs/INSTALLATION-AND-SETUP-GUIDE.docx is rEach's student setup guide and names no institution, instructor, course or term. reach guide prints its text while Reach is locked, and until the student is enrolled every session's locked context (M-ENR-AGENT-GUIDE, and M-ENR-HERMES-GUIDE on Hermes) tells the agent to read it and, when the student's messages reach it while locked, to walk them through the guide's extra steps for their app first, never asking for the passkey, username or student ID."
  - id: STD-NOHOOK-ENROLL
    text: "Since 0.23.1 an app that runs no rEach hooks (Antigravity, which has no hook format) is told so instead of being treated as a hooked app whose hooks failed. reach hello counts a session as hookless when it is not a hook call and not the MCP tool and either --harness antigravity is passed (rules/reach.md passes it) or no harness can be told from the environment, the parent process or an earlier hook run. While Reach is locked for any reason but an ended course, such a session's context is M-ENR-AGENT-NOHOOK-CONTEXT and M-ENR-AGENT-NOHOOK-GUIDE: the student enrolls with reach enroll in a terminal window, where they type the passkey, username, student ID and password themselves; the agent walks them through it at once, asks for no restart or approval, does not send them to their instructor unless the command fails, and never asks for or handles the details. The student-facing line is M-ENR-NOHOOK-STUDENT. On Windows the terminal command in these messages and in M-ENR-AGENT-GUIDE starts with the PowerShell call operator, because a line that starts with a quoted path is not run by PowerShell. The setup guide's Antigravity paragraph says the same. Not exercised in a real Antigravity session or on Windows."
  - id: STD-COURSE-PASSKEY
    text: "Since 0.18.1 every word a student or agent reads calls the class-wide enrollment secret the course passkey: the messages and greetings, reach help, reach enroll --course-passkey (--course-code stays as an unlisted alias), the persona, README.md, docs/student-guide.md and docs/INSTALLATION-AND-SETUP-GUIDE.docx. The wire contract keeps its names (W-ENR-1 course code, field course_code, errors course_code_unknown and course_code_expired) because specs/wire.yml is shared with Teach and its digest is checked at enrollment."
  - id: STD-PLAIN-TALK
    text: "Since 0.18.1 the persona section How you talk with the student binds in every session and folder, before and after enrollment: the agent treats the student as a new computer user, never brings up or suggests commands or how rEach works unless the student asks for exactly that, describes student-only steps as what to click, and goes faster or deeper only on evidence (profile coding_experience quite a bit, a remembered finding that the student is an experienced computer or software user, or the student's own request), recording that evidence with reach remember. reach hello's session context (M-AGENT-TALK) and the locked context carry the same rule, and rules/reach.md points to it."
  - id: STD-AGENT-UPDATE
    text: "Since 0.18.1 the agent updates rEach only through reach update run --apply and never searches GitHub, its releases or tags, or downloads, unzips or copies a rEach archive itself (persona section Updating rEach, M-AGENT-UPDATE in reach hello's context, INSTALL.md). Every tagged rEach release since 0.18.1 also has a GitHub release marked Latest, so GitHub's releases page names a rEach version rather than a runtime kit."
  - id: STD-AGENT-UPDATE-CHECKS
    text: "Since 0.20.5 every reach update run checks GitHub for a newer release, with or without a terminal, so an agent's reach update run --apply finds a release published since the last hourly check. Only the background run rEach spawns itself passes --scheduled and keeps to the hourly schedule."
  - id: STD-TIMES-AS-STATED
    text: "Since 0.20.5 the agent gives dates and times exactly as rEach states them, with the time zone rEach names, and never converts them to another zone (persona section How you talk with the student)."
  - id: STD-PORTABLE-GCM
    text: "Since 0.20.6 every AES-256-GCM seal and open in Reach (course packages, qualify, submit, hands and reference) goes through Reach::Crypto, which uses the native cipher when it accepts additional authenticated data and otherwise Reach::GCM: AES-256-CTR from the same library plus GHASH in Ruby, byte-identical to OpenSSL's GCM. macOS's built-in Ruby 2.6.10 (LibreSSL 3.3.6) refuses AAD on every GCM call, so without it no Mac running the system Ruby could open a package or submit."
  - id: STD-SMOKE-REAL-PACKAGES
    text: "Since 0.20.5 the platform smoke opens real teach.package/v1 envelopes on every OS leg: a known-answer guardrails envelope sealed by Teach, and guardrails and workspace packages that fake_teach seals for the enrolled install, stores, and then answers with 304. R-DOC-GUARD is no longer an expected doctor finding."
  - id: STD-CLI-VERSION
    text: "Since 0.18.1 reach version, reach --version and reach -V print reach <VERSION> and exit 0, and work before enrollment."
  - id: STD-QUALIFY-UTF8
    text: "Since 0.21.6 reach qualify reads the agent's feature files as UTF-8 whatever the computer's locale, replacing invalid bytes, so a scenario that names a non-ASCII value (for example a Japanese label) cannot crash the coverage step with Encoding::CompatibilityError under a C or POSIX locale."
  - id: STD-KIT-CLEAN-ENV
    text: "Since 0.33.5 every launch of the runtime kit's Ruby (the qualify gem install and bundle check, the cucumber run, the GCM re-exec and doctor's kit probe) goes through Reach::RuntimeKit.clean_env, which unsets RUBYOPT, RUBYLIB, GEM_HOME, GEM_PATH, GEM_SPEC_CACHE, RUBYGEMS_GEMDEPS and every inherited BUNDLE_ and BUNDLER_ variable before the launch's own settings apply. A student whose own Ruby exports these (a Ruby 3.3.8 under ~/.local/usr exported RUBYLIB at its 3.3 standard library) otherwise made the kit Ruby 4.0.7 load the wrong rubygems at start and exit with \"ruby lib version (3.3.8) doesn't match executable version (4.0.7)\", so reach qualify could never run while reach runtime install's ruby -v smoke still passed. LD_LIBRARY_PATH and DYLD_ variables are left alone: the kit Ruby is statically linked to libruby and Chrome may need them. Launches of a Ruby already on the computer keep the student's environment."
  - id: STD-QUALIFY-REMOTE-BUDGET
    text: "Since 0.21.2 the Teach half of reach qualify (the upload and the polls for its result) runs under its own 20-second deadline that starts after the local steps, so an MCP reach_qualify call whose local steps outlast the 25-second tool budget still reaches Teach, and the whole call stays inside Codex's 60-second tool timeout. A poll that runs out leaves the qualification pending with its id, and the next reach qualify of the same files resumes it. A Reach deadline running out is told as M-TEACH-DEADLINE and does not mark the Teach connection lost."
  - id: STD-QUALIFY-UNCOVERED
    text: "Since 0.20.3, a qualification that stops on QF-UNCOVERED carries next (M-QUALIFY-UNCOVERED in text and JSON): write one scenario under qualify/features per uncovered graded name with the slice tag, then qualify again; never raise a hand for it. reach-help forbids hands for QF-UNCOVERED, QF-CHECK, QF-LOCAL-FAIL and QF-VACUOUS."
  - id: STD-MODULES-PENDING
    text: "Since 0.20.2, while a student has no modules, reach next says to choose them (M-NEXT-CHOOSE, or M-NEXT-CHOOSE-OPEN when the choice has no closing time) or to wait for the instructor to assign them (M-NEXT-WAIT-MODULES, in student-choice and instructor modes alike), never that nothing is released."
  - id: STD-STUDENT-MESSAGES
    text: "Every message shown to a student comes from a catalogue by id, never an inline string: Reach::Messages (locales/en-US.yml) for course messages and Reach::Greetings (locales/greetings.en-US.yml) for rEach's greetings, so both stay translatable and consistent."
  - id: STD-CODEX-SANDBOX
    text: "Since 0.21.8 Reach recognizes a command that Codex runs in its own sandbox (CODEX_SANDBOX set, as on macOS, or CODEX_SANDBOX_NETWORK_DISABLED=1, the only marker on Linux) where the sandbox blocks the network (CODEX_SANDBOX_NETWORK_DISABLED=1) or the Reach home (a write under ~/.reach/state refused with EPERM, EACCES or EROFS), which happens whenever Codex runs outside a trusted course folder whose .codex/config.toml grants network_access and writable_roots ~/.reach. Reach::Sandbox decides it. Reach::Client then makes no request and raises a Reach::Offline carrying M-SANDBOX-AGENT (cause codex_sandbox), so the connection is not marked lost and no outage is announced; a terminal command that fails on such a blocked write says M-SANDBOX-AGENT instead of M-REACH-HICCUP-CLI, which would claim the instructor was told; reach update run and reach update check say M-SANDBOX-AGENT and do not run, and reach update status adds M-SANDBOX-UPDATE-STALE, so a stale last check is never reported as no newer version; reach doctor opens with M-SANDBOX-AGENT and doctor --report carries a sandbox section. M-SANDBOX-AGENT tells the agent to use the reach_* MCP tools, which Codex runs outside its sandbox, and gives it M-SANDBOX-STUDENT to relay when no tool fits. reach_debug (on, off, status) and reach_doctor give the agent debug mode and the health check through the bridge, and since 0.21.12 reach_update (status, run) gives it the updater: run starts reach update run --apply --force as a detached process, outside the sandbox, and answers M-UPDATE-STARTED (or M-UPDATE-NOT-STARTED when it could not start); status returns the installed version and reach update status's lines. reach_update works before enrollment, as reach update does. MCP tools, hooks and commands outside a Codex sandbox are unchanged. Since 0.28.2 M-SANDBOX-STUDENT carries the course folder's path on this computer (Reach::Sandbox.course_folder: Reach::Paths.workspace_root with the computer's own path separator) and says that folder holds deliverables and extracurricular and is the one to open; before, it said only \"your course folder\", and a Windows Codex student who found just those two folders was told they had no course folder. Since 0.31.0 STD-CODEX-SETUP fixes the cause: after the student's yes Reach writes the sandbox settings it needs into the student's own Codex configuration, and M-SANDBOX-AGENT and M-SANDBOX-STUDENT point the agent and the student to it."
  - id: STD-HOOK-GUARD
    text: "Since 0.29.0 (wire revision 2026-10-04f) Reach does no course work in a Codex that is not running its hooks, because without them Reach cannot see what the student types or apply the course's rules. Reach::KnownIssues.prompt_hook_dead? is true only for a Codex harness (told from the environment, the parent process or the last hook) and in one of two cases: a session-start hook with source startup, resume or clear ran on Codex (hooks_seen.json session_at and session_label, written by reach hello as a hook and by gate session) and no prompt hook has run since; or no prompt, tool or stop hook has run for 15 minutes (STD-KNOWN-ISSUES). A session-start hook with source compact and a reach hello run by hand never arm it. While it is true, Reach::Qualify.run, Reach::Submit.submit and Reach::Part.record! refuse with M-HOOKS-REQUIRED, from the MCP tools and from the commands alike, which says that nothing is wrong with the student's work and sends the agent to the known issue's steps, and the hooks_not_running detector reports the problem on the first tool call. The next prompt that arrives through the prompt hook lifts it. Every other command and tool keeps working, raising a hand and a live session included. It never applies to another harness. config.yml hooks.require false or REACH_HOOK_GUARD_DISABLE=1 switches the refusal off; the detector stays. Since 0.33.4 the plugin's own prompt hook (gate enroll) is not a prompt hook for this standard: it runs in every folder and records no prompt and applies no course rule, so it writes its own stamp (hooks_enroll_seen.json: at, label) and never writes hooks_seen.json. Before 0.33.4 it stamped prompt_at and work_at, so a Codex that ran only the plugin's hooks looked alive, qualify, submit and part record were not refused, and own-part answers were silently never saved. Only a course folder's gate prompt sets prompt_at, and only course-folder hooks set work_at. Reach::KnownIssues.recorded_harness reads the label from whichever of the two files is newer. Since 0.35.6 (STD-CODEX-HOOK-TRUST) the plugin's gate enroll hook on Codex carries the course prompt work itself and stamps prompt_at on every Codex run, because Codex never ran a course folder's prompt hook; whether the course rules for tools run is now judged from Codex's own hook trust (KnownIssues.course_hooks_untrusted?, M-HOOKS-UNTRUSTED), which require_hooks! checks first."
  - id: STD-KNOWN-ISSUES
    text: "Since 0.21.9 (wire revision 2026-10-03d, W-API-KNOWN-ISSUES, W-KI-1 to W-KI-4) the instructors keep a list of known problems in Teach, each with what the student or agent sees, an optional detector, the operating systems, harnesses and Reach versions it applies to, and the steps the student takes, per operating system and harness. Reach fetches it without signing, so it works before enrollment, caches it under the Reach root (known_issues.json), and never shows the student a fetch error: a failed fetch leaves the connection state alone (an exception to STD-TEACH-LINK) and is recorded only as a debug request event. reach hello's session context (and the locked context before enrollment) names each entry that matches this computer's operating system, harness and Reach version in one line (M-KNOWN-ISSUES-AGENT), marking one whose detector fires as detected (M-KNOWN-ISSUE-DETECTED: walk the student through its steps now). reach_known_issues and reach known-issues give the full matching steps; the agent tells them to the student in plain words, one step at a time (STD-PLAIN-TALK). Detectors: codex_sandbox (STD-CODEX-SANDBOX) and hooks_not_running (an MCP call on Codex with no Reach hook run on this computer for 15 minutes; every hook run records its time in hooks_seen.json under the Reach root state directory). Since 0.28.1 (wire revision 2026-10-04e) hooks_seen.json keeps three times: at (any hook), work_at (a prompt, tool or stop hook) and prompt_at (the prompt hook, gate prompt or gate enroll). The detector reads work_at, so a harness that runs only the session-start hook is detected. reach part record, when it finds no kept prompt and prompt_at is absent or older than 30 minutes, refuses with M-PART-NO-HOOK, which says the answer never reached Reach and sends the agent to the known issue's steps, instead of M-PART-NO-ANSWER, which asks the student to answer first. Since 0.31.0 (wire revision 2026-10-04h) an entry also carries remedy, null or a live action name; Reach maps codex_configure and sandbox_probe to reach_setup (action configure or probe), doctor, status and sync to their tools, update_check and update to reach_update (action status or run), and anything else to null, and names the call in the agent context and in reach_known_issues (M-KNOWN-ISSUE-REMEDY). Reach runs nothing by itself because of a remedy."
  - id: STD-HOOK-HARNESS
    text: "Since 0.21.10 each harness's plugin hooks name their own harness: hooks/reach.hooks.yml passes --harness ${HARNESS}, rplugin renders hooks/hooks.json (Claude Code, sh and ${CLAUDE_PLUGIN_ROOT}) and hooks/codex.json (Codex, ruby and ${PLUGIN_ROOT}, because Windows has no sh; since 0.21.14 rendered from run_by_harness codex in hooks/reach.hooks.yml with rplugin 1.6.5, byte for byte the same command text, so students' trusted hooks stay trusted), and .codex-plugin/plugin.json and the root plugin.json's extensions.com.openai.hooks both point Codex at hooks/codex.json, never hooks/hooks.json. Since 0.21.14 reach.rplugin.yml's MCP server carries by_harness claude-code (sh exe/reach-run, for .mcp.json), so rplugin package reproduces every generated file and rplugin package --check passes."
  - id: STD-TEACH-SUBSCRIBE
    text: "Since 0.22.0 (wire revision 2026-10-03e, W-API-REVISION, W-SAFE-14, Teach 0.30.0) Reach subscribes to Teach by polling one cheap signed probe, so a rebuilt package, a new assignment, a policy change, a grade, a hand reply, extra credit, a receipt or a known issue arrives without the student running reach sync. While a harness session runs, its MCP server starts a detached reach subscribe tick --source session about every 60 seconds (plus up to 15 seconds of jitter), and a user-level operating system job (a systemd user timer, a launchd LaunchAgent or a Task Scheduler task for the current user, never cron and never a stored password) runs reach subscribe tick --source background about every 15 minutes. A tick makes one request, in normal mode with no retries, never more often than once per 50 seconds across every Reach process (state/subscribe.json and state/subscribe.lock under the Reach home); a 304 or an unchanged revision only records the check, a changed revision runs one reach sync in that process under the exclusive state/sync.lock (a tick never waits for it; every interactive sync waits up to 120 seconds) and stores the new parts only after it completes, a 404 waits six hours, a failure backs off from 60 seconds to one hour, and a revoked install removes the job. No hook ever calls the network for this or waits on a tick (STD-HOOK-RESPONSIVE); the prompt hook only reads subscribe.json and, once, adds M-SUBSCRIBE-UPDATES naming what changed so the agent can tell the student in plain words. Every failure is silent to the student and recorded through the debug fault path (STD-TEACH-LINK). config.yml subscribe.background false, REACH_SUBSCRIBE=0 and REACH_OFFLINE=1 switch it off; reach subscribe status, install and uninstall manage the job, and reach doctor prints R-DOC-SUBSCRIBE, informational only."
  - id: STD-CODEX-SETUP
    text: "Since 0.31.0 (wire revision 2026-10-04h, W-LIVE-5 and W-KI-1). A Codex project-level .codex/config.toml does not change the sandbox Codex gives a chat, so rEach sets up the student's own user-level Codex configuration ($CODEX_HOME/config.toml) itself, only after the student's yes typed in a terminal (reach codex configure, which the Windows installer runs after setup), captured in a chat through Reach::Consent (reach_setup configure, consent kind codex_setup, kept on the computer) or given to the codex_configure live action. Reach::CodexSetup is the only code that writes that file: a line editor that changes only sandbox_mode, [sandbox_workspace_write] network_access and writable_roots (the reach-work folder) and the folder's [projects] trust_level (mode workspace, the default outside Windows), or sandbox_mode danger-full-access and the trust (mode full, the default on Windows), never narrows an existing danger-full-access, never writes approval_policy, model, features, hooks, marketplaces or mcp_servers, and writes Codex hook trust only as STD-CODEX-HOOK-TRUST describes, refuses (M-CODEX-SETUP-UNSAFE) rather than guess when the file holds a form it does not read, keeps a backup beside the file, writes atomically, and puts the old file back when codex features list rejects only the new one. reach codex status, probe and off, reach_setup status and probe, the sandbox_probe live action and reach doctor's codex line and R-DOC-CODEX report and test the result; the background subscription tick and reach mcp put the settings back at most every 6 hours while the student's yes stands. config.yml codex (setup, sandbox, heal, probe_timeout_s) and REACH_CODEX_SETUP=0 turn it off; a course can turn it off, never on. See codex_setup in reach.spec.yml for the measured facts and what is not verified. Since 0.33.4 the plugin's prompt hook (gate enroll) takes the student's typed yes or no to the codex_setup question itself, on Codex only (a hook event that carries turn_id), for a signed-in session, on a prompt that was not a sign-in step, and for this consent kind only (Reach::CLI.codex_setup_answer, Reach::Consent.observe with kinds); it runs Reach::CodexSetup.follow_up! and returns the result as UserPromptSubmit additionalContext. Before 0.33.4 only a course folder's gate prompt read the answer, and Codex does not run that hook until the folder and the hook are trusted, which is the state this setup exists to fix, so the yes was never taken. Reach::Consent.capture claims the pending question by renaming it, so when the plugin hook and a course-folder hook both see one answer exactly one records it and speaks. reach_setup configure answers M-CODEX-SETUP-TERMINAL only when neither a course-folder hook nor the plugin hook has run for 15 minutes."
  - id: STD-CODEX-HOOK-TRUST
    text: "Since 0.35.6. Codex runs a non-managed hook only when the student's user config.toml holds [hooks.state.\"<key>\"] trusted_hash equal to the hook's current hash; an untrusted or modified hook is skipped without a word. The key is <absolute path of hooks.json>:<event label>:<group index>:<handler index>, and the hash is sha256 over the compact, key-sorted JSON of the normalized handler (event name, matcher where the event keeps one, command, timeout, async). A course folder's .codex/hooks.json is written after the student approved the plugin's hooks, so its hooks were never trusted and never ran. rEach therefore splits the work. Per-session and per-prompt work rides the plugin's two hooks (hooks/codex.json, unchanged byte for byte, so nothing needs approving again): on Codex, in a course folder, the plugin's gate enroll hook runs the course prompt work (Reach::Gate.prompt, once the sign-in is satisfied) and reach hello runs the course session work (Reach::Gate.session). A marker under the Reach state directory (hook_once, pruned after a day) keyed on the session id and the turn id (prompt) or the session id and the start source (session) lets exactly one of the plugin hook and an older trusted course-folder gate prompt or gate session do the work, and the other answers nothing. The plugin's gate enroll run stamps prompt_at on every Codex run, before any gating. Per-tool hooks (PreToolUse write, shell and read, PostToolUse check and transcript code) and Stop stay in the course folder's .codex/hooks.json; Harness.codex_hooks_content no longer writes SessionStart or UserPromptSubmit. Reach::CodexHookTrust computes each handler's key and hash (verified against codex 0.160.0 app-server hooks/list for the root, slice and extracurricular folders) and reads the trust state; Reach::CodexSetup records [hooks.state] trusted_hash for the course hooks.json files rEach manages, under a Codex-settings yes that carries the scope hook-trust-1 (STD-CODEX-SETUP; a yes given before this scope existed covers only the sandbox settings and is asked again), only for a course hooks.json that equals exactly what Harness.codex_hooks_content writes, with the same line editor, backup and refusals, never writing an enabled field, and marking each such course folder ([projects.\"<folder>\"] trust_level trusted, which Codex requires before it reads that folder's hooks.json) with the same editor and rules as the reach-work folder's own trust, in apply, in the reapply (which also runs when trust is stale) and after Harness.configure_codex rewrites a course hooks.json; reach codex off stops it. KnownIssues.course_hooks_untrusted? (Codex only, never while the student's sign-in is pending, unknown never counts) makes Reach::KnownIssues.require_hooks! refuse with M-HOOKS-UNTRUSTED, fires the codex_hooks_untrusted detector, and replaces M-NEXT-LOGIN-NO-HOOK, M-LOGIN-NEEDED-NO-HOOK and M-HOOKS-REQUIRED where it holds; the remedy is codex_configure, never a restart or a new chat. While the sign-in is pending the hooks_not_running and codex_hooks_untrusted detections are not shown to the agent; signin_hook_not_running still is, because it exists for that case. On Windows, hook keys and project paths are matched ignoring case and treating / and \\ alike, and an existing spelling is reused."
  - id: STD-FIGURES
    text: "docs/assets/figures/ holds ten system figures, each as <slug>-light.svg and <slug>-dark.svg, drawn by tools/figures/build.rb (Ruby standard library only) from tools/figures/figures/*.rb with the palettes and primitives of tools/figures/kit.rb; a figure names a tone, never a color, so the two variants cannot drift. The SVGs are committed with their source. docs/architecture.md shows them with a picture element that follows the reader's color scheme, and README.md opens with figure 1. build.rb --png renders each SVG 3840 pixels wide with headless Chrome into docs/assets/figures/png/, which git ignores: the PNGs are published only as assets of the GitHub pre-release tagged figures-1, whose tag Reach::Update ignores (VERSION_TAG accepts only vN.N.N and pre-releases are skipped), so no clone, install or update carries them. Nothing checks a figure's wording against the code; it is prose, kept true by hand."
  - id: STD-TEACH-OPAQUE
    text: "Teach is private. docs/*.md, README.md and every figure describe Teach only by outcomes this repository already publishes in README.md, PRIVACY.md or specs/wire.yml (it checks the roster, seals and signs packages, runs hidden checks, signs receipts, answers hands), and name no Teach class, database table or column, environment variable, file path or command-line verb. A figure draws Teach as the frosted block of Figures::Canvas#frost. The same holds for AGENTS.md, CHANGELOG.md, FEATURES.md, TODO.md, this file and specs/implementation/: a build blueprint that directs work on Teach is kept in the private superproject, never here. specs/wire.yml, reach.spec.yml, lib/, tools/fake_teach and tools/smoke are outside this standard: they are the protocol, the program and its test tooling and name what the wire needs. Since 0.34.2 build blueprints and design drafts are not in this repository at all (specs/implementation/ and docs/course-alignment-design.md moved to the private superproject), .rproject/ notes are untracked, and the repository's whole history, every tag and branch, was rewritten on 2026-10-05 to remove them and to redact Teach internals and the maintainer's machine layout from every other file this standard covers; the GitHub release notes were redacted the same way. Nothing enforces this standard mechanically."
  - id: STD-PROGRESS
    text: "Since 0.24.0 (wire revision 2026-10-03h, W-API-PROGRESS, Teach 0.35.0) Reach records the first time the student reaches a checkpoint only Reach can see and reports it to Teach, so an instructor sees where each student stands. Reach::Progress (lib/reach/progress.rb) keeps state/progress.json with the checkpoint ids and their first times: enroll.code when the course passkey is accepted and enroll.identity when the student confirms their email and student ID (both in the chat enrollment and in reach enroll), setup.signin at the first confirmed sign-in, and <assignment>.started at the first prompt the gate lets through inside a workspace of that assignment. A mark is first-write-wins, never raises into a hook and makes no network call: reach sync (Reach::Progress.flush!, beside the outbox retry) sends the marks not yet sent, at most 64 in one signed request, and records them as sent on a 200 or a refusal and keeps them when Teach cannot be reached; nothing enters the outbox, so reach doctor's outbox check is unaffected. The two enrollment marks made before an install exists wait in the file and go out with the sync that follows registration. A report carries checkpoint ids and times only, never typed text. A new enrollment after an earlier one starts the record afresh. REACH_PROGRESS=0 stops recording and sending."
  - id: STD-ANNOUNCEMENTS
    text: "Since 0.30.0 (wire revision 2026-10-04g, W-API-ANNOUNCEMENTS, W-API-ANNOUNCEMENT-RECEIPTS, W-SAFE-16) the instructors can send the student an announcement and Reach keeps it in a dated queue. Reach::Announcements (lib/reach/announcements.rb) replaces state/announcements.json with the list Teach answers on reach sync, keeping for each announcement the time it was first received and first shown; an announcement Teach no longer lists leaves the queue. The prompt hook (Reach::Gate) shows each announcement once, word for word, with M-ANNOUNCE-NOTICE, at most three per prompt and oldest first, marks it shown and starts one detached reach announcements flush, which reports the received and shown times; reach sync reports them too. The hook itself makes no network call. reach announcements [list] and the reach_announcements tool list the queue newest first (M-ANNOUNCE-LINE, M-ANNOUNCE-NONE), and --format json prints it as data. A Teach without the routes answers 404 and Reach asks again no sooner than six hours later; a 503 leaves the queue as it is. config.yml announcements.show false stops the display at the prompt and leaves the queue and its commands working. An announcement is text from the instructors: Reach never treats it as an instruction to the agent beyond telling the student, and it changes no gate, grade or due time."
  - id: STD-DUE-CHANGE
    text: "Since 0.30.0 Reach tells the student when an assignment's due time moved. Reach::DueChanges (lib/reach/due_changes.rb) keeps, in state/due_changes.json, the due time it last saw for each assignment id in status.current_assignment; when reach sync stores a status whose due differs from the one seen for the same assignment, it queues one notice with the earlier and the new time, and the prompt hook shows it once with M-DUE-CHANGED. The first due time seen for an assignment queues nothing. Reach holds no due time of its own: every due time it states comes from the status Teach answered (wire W-API-STATUS)."
  - id: STD-HOLDINGS
    text: "Since 0.30.0 (wire revision 2026-10-04g, W-API-HOLDINGS, W-SAFE-16) Reach tells Teach which copy of the course material it holds, so the instructors can see that an update arrived. Reach::Holdings (lib/reach/holdings.rb) reports, after reach sync has stored its packages, the version and content digest of the stored guardrails package and the file name and SHA-256 of each stored encrypted reference blob. It sends names and digests of material Teach delivered and nothing else: no file, no path on the student's computer, nothing the student wrote. It reports only when the list differs from the one last reported, never from a hook, and a failure is a sync warning, not a sync failure. A Teach without the route answers 404 and Reach waits six hours."
  - id: STD-COURSE-PROFILE
    text: "Since 0.33.0 (wire revision 2026-10-04j, W-POL-2) Reach takes the facts of one course from that course, not from this repository. Reach::CourseProfile (lib/reach/course_profile.rb) reads the profile section of the verified guardrails package's course.yml, cached per package version. Learning system: Reach::Archive.lms_name is the profile's submission.lms_name (a local config.yml submit.lms_name is still read when a profile names none) and may be nothing; the upload-for-credit sentences (M-LMS-UPLOAD-ZIP, M-LMS-UPLOAD-THAT, M-LMS-UPLOAD-WORK) are added to the submission messages only when the course requires the upload, and M-LMS-RECORD to the grade messages only when a learning system is named. Enrollment: the shipped config.yml carries no institution name, email domain or patterns; Reach::Identity.rules holds only what the enrollment preview answered, plus its hints; with no pattern any email address and any student ID are accepted for Teach to judge, with no institution name Reach says 'school' (M-ENR-SCHOOL), and the passkey example names no course. Time: with no zone from the install, the package or a local config.yml, times are shown in UTC and labeled UTC; America/Los_Angeles keeps its built-in daylight rules. Wellbeing: Reach::Login.crisis_match? uses the profile's phrases when the course sends any and the built-in list otherwise, and Reach::Support shows the profile's support text in place of the built-in message when the course sends one; detection is never off. This standard supersedes the Pacific default and the Blackboard default named in earlier standards. The profile's terms and slices sections are not read yet."
  - id: STD-SECURITY-AUDIT-MODE
    text: "Since 0.34.0 a maintainer's clone can audit a release before it leaves the computer: tools/security_audit/install sets core.hooksPath to .githooks, and .githooks/pre-push runs tools/security_audit/gate.rb, which acts only on a push to the project's GitHub remote that carries a release (any refs/tags/v* ref, or a branch update whose VERSION file changed; deletions are ignored) and otherwise exits 0 without output. This is a maintainer tool: nothing under lib/, exe/, hooks/ or skills/ changes and no student install runs it. The gate reaches Teach at TEACH_URL, or at config.yml teach.url when TEACH_URL is unset, and reads its settings there with a scoped service token (5 s timeout, two jittered retries, a 0600 cache at ~/.local/state/reach-security-audit/config.json, built-in defaults when neither answers; Teach being unreachable never turns the gate off). It computes a base (the newest v* tag before the pushed commit, or the empty tree for whole_tree), runs a deterministic scan over the added lines (secret shapes, secret-bearing file names, student identifiers matched against salted HMAC digests of the roster with no plaintext identifier on the wire, student-style addresses, high-entropy strings, absolute home paths; matched values are masked to their first and last 2 characters), then runs one headless read-only claude -p audit (Read, Grep, Glob only, --strict-mcp-config, --setting-sources empty, --no-session-persistence, --max-budget-usd unless token-open) using tools/security_audit/prompt.md. The decision follows the mode, block_at and on_error settings: gate blocks (exit 1) on a scan or audit finding at or above block_at, report_only never blocks, and an audit failure follows on_error. The verdict is cached by tree, base and settings digest so the tag push after the branch push reuses it. Outputs: a masked report at ~/.local/state/reach-security-audit/reports/, a stderr summary, a desktop notification, a run POSTed to Teach with an Idempotency-Key (failed posts wait in an outbox and go with the next run), and best-effort rLogs events (component reach, process_role security_audit). REACH_SECURITY_AUDIT=0 skips the audit and posts a skipped run. The gate runs on the computer's own Ruby 2.6.10 or newer with the standard library only."
  - id: STD-STUDENT-TREE
    text: "Since 0.34.1 a student install carries no developer material that names a Teach address. .gitattributes marks .githooks/, .github/, tools/, docs/smoke-assignment-1.md, docs/deploy-and-test.md and figure 08 (deployment topology, which draws the local fixture address) export-ignore, so GitHub's branch and tag archives, which the installer (main.zip) and reach update (refs/tags/vN.N.N.zip) download, leave them out, and an update's swap removes them from an existing install. A marketplace added from the repository link clones the whole tree, so no tracked file outside CHANGELOG.md names the live Teach's port: tools/smoke/slice_build.rb reads it from the Teach source it builds and refuses to run when it cannot, docs and blueprints write a placeholder, and the security audit gate defaults to config.yml teach.url. AGENTS.md, which every harness reads first, says the course server is only what reach reports and that docs/, specs/ and tools/ are never a source of an address or a port. The local fixture tools/fake_teach and the smoke tools still bind 127.0.0.1 in a clone; that is test tooling starting its own server. Nothing checks the archive contents mechanically; the release check is a search of the downloaded archive."
