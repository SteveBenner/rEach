      mutates: files
      source: lib/reach/cli.rb CLI.cmd_debug
      standards: [STD-DEBUG-MODE]
    - verb: "reach debug status"
      synopsis: "reach debug status [--format text|json]"
      purpose: "Say whether debug mode is on."
      mutates: none
      source: lib/reach/cli.rb CLI.cmd_debug
      standards: [STD-DEBUG-MODE]
    - verb: "reach debug show"
      synopsis: "reach debug show [--last N] [--format ascii|markdown|json]"
