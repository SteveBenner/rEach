schema: teach-reach.wire/v1
name: Teach-Reach wire protocol
protocol: 1
recorded: '2026-10-03'
status: normative
canonical_copy: reach/specs/wire.yml
pinned_copies:
  - teach/specs/wire.yml
summary: >
  The one contract between Reach (the student's plugin) and Teach (the instructors' server). Both
  implementations are built against this file, byte for byte. Reach 0.1.0 and Teach 0.1.0 were each built
  against their own guess and did not interoperate; this contract replaces both guesses. Its base is Teach
  0.1.0's specified wire (teach.spec.yml wire_schemas), with three parts taken from Reach 0.1.0: the request
  signature covers the query string, submissions carry a file-by-file manifest inside the archive, and the
  workspace package carries a per-slice manifest of the student's owned files.
hybrid_decisions:
  - area: request authentication
    taken_from: teach
    why: A one-time nonce blocks replayed requests, and signing a digest of the body handles binary bodies.
  - area: what the request signature covers
    taken_from: reach
    why: Teach 0.1.0 signed the path without the query, leaving values such as ?since= and ?cursor= unsigned.
  - area: encrypted envelope
    taken_from: teach
    why: >-
      The header is bound into the encryption as associated data and names the key that signed it; Reach 0.1.0's
      envelope let a signed package be replayed as another kind or an older version.
  - area: package plaintext
    taken_from: teach
    why: A gzipped tar archive. teach.spec.yml already said gzip; Teach 0.1.0's builder forgot to compress.
  - area: owned-file list per slice
    taken_from: reach
    why: Teach 0.1.0 shipped empty placeholder files only, so Reach could not tell which files were the student's.
  - area: submission contents
    taken_from: both
    why: Teach's JSON request keeps routing fields visible; Reach's manifest.json with per-file digests is checked by Teach.
  - area: receipts
    taken_from: teach
    why: Deep canonical JSON signing; Reach 0.1.0's shallow key sort failed on nested grade results. signing_key_id added.
  - area: encryption key
    taken_from: new
    why: >-
      Teach names the key to encrypt to (encryption_key) and Reach names it back (recipient_key_id), so key rotation
      never strands a submission. The key is still Teach's one dual-purpose key (Teach STD-KEY-MODEL).
  - area: key wrapping algorithm
    taken_from: both (as implemented)
    why: >-
      RSA-OAEP with SHA-1 and MGF1-SHA-1, the only OAEP the Ruby 2.6 standard library offers. teach.spec.yml 0.1.0
      claimed SHA-256, which neither side implemented. SHA-1 inside OAEP remains sound.
conventions:
  W-CONV-1:
    rule: All JSON is UTF-8. Every key that crosses the wire is a string. No field is omitted to mean false; absent means absent.
  W-CONV-2:
    name: canonical JSON
    rule: >-
      canonical_json(value) = JSON.generate(canonicalize(value)), where canonicalize turns every Hash into a Hash whose
      keys are strings sorted by byte order (key.to_s, sorted with Array#sort), recursing into values; Arrays keep their
      order and recurse into elements; every other value is left as is. No whitespace, no pretty printing. Ruby's
      standard json generator on both sides (json 2.1 on Ruby 2.6 and the json bundled with Ruby 4.0 produce identical
      output for these values).
  W-CONV-3:
    name: timestamps
    rule: RFC 3339 in UTC with a trailing Z and whole seconds, Time.now.utc.strftime("%Y-%m-%dT%H:%M:%SZ").
  W-CONV-4:
    name: digests
    rule: SHA-256, lowercase hexadecimal, 64 characters. The digest of an empty body is e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855.
  W-CONV-5:
    name: base64
    rule: Strict base64 (RFC 4648 section 4, no line breaks), Base64.strict_encode64 / strict_decode64.
  W-CONV-6:
    name: RSA-PSS
    rule: RSA-PSS with SHA-256, MGF1-SHA-256 and a salt length of exactly 32 bytes, on signing AND verifying (never salt_length :auto).
  W-CONV-7:
    name: RSA key size
    rule: RSA-4096 for install keys and Teach keys. Public keys travel as PEM (SubjectPublicKeyInfo, "-----BEGIN PUBLIC KEY-----").
transport:
  W-TR-1:
    rule: HTTPS in production. The base URL is the course's Teach URL (install.yml teach_url); every route below is under <teach_url>/api/v1.
  W-TR-2:
    rule: >-
      Request bodies are JSON with Content-Type application/json. Responses are JSON with Content-Type application/json,
      except GET /packages/:kind returning 304 (empty body).
  W-TR-3:
    rule: Teach serves /api/v1 at the root of its application. A reverse proxy that mounts Teach under a prefix must strip the prefix before Teach sees the request.
request_authentication:
  applies_to: Every route except POST /api/v1/enroll and GET /api/v1/health.
  headers:
    X-Teach-Install: The install id returned by POST /enroll.
    X-Teach-Timestamp: W-CONV-3 timestamp of when the request was signed.
    X-Teach-Nonce: 32 lowercase hexadecimal characters, 16 bytes from a secure random source (SecureRandom.hex(16)), fresh for every attempt including retries.
    X-Teach-Signature: W-CONV-5 base64 of the W-CONV-6 RSA-PSS signature, by the install's private key, over the signed payload.
  W-AUTH-1:
    name: signed payload
    rule: >-
      The five lines METHOD, TARGET, TIMESTAMP, NONCE and BODY_DIGEST joined by a single "\n" with no trailing newline.
      METHOD is the uppercase HTTP method. TARGET is the route path starting at "/api/v1/" plus, when the request has a
      query string, "?" followed by the query string exactly as sent on the request line (no re-encoding, no re-ordering).
      TIMESTAMP and NONCE are the header values. BODY_DIGEST is the W-CONV-4 digest of the raw body bytes (of the empty
      string for a request without a body).
    example: |-
      GET
      /api/v1/receipts?since=2026-10-01T00%3A00%3A00Z&limit=50
      2026-10-15T21:41:07Z
      9f2c0b6a51e44f3d8a1c7e0b2d4f6a88
      e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  W-AUTH-2:
    name: target on the Teach side
    rule: >-
      Teach rebuilds TARGET as env["PATH_INFO"], plus "?" and env["QUERY_STRING"] when QUERY_STRING is non-empty. Teach
      never uses SCRIPT_NAME, never decodes, and never re-orders the query.
  W-AUTH-3:
    name: target on the Reach side
    rule: >-
      Reach signs the route path it was asked to call ("/api/v1/..."), never the base URL's own path prefix, and builds
      the query once (URI.encode_www_form over an ordered list of pairs) and uses that same string both on the request
      line and in TARGET.
  W-AUTH-4:
    name: freshness
    rule: >-
      Teach refuses a timestamp more than 300 seconds from its clock (401 unauthenticated) and a nonce it has already
      seen for the same install within 600 seconds (401 unauthenticated). The nonce is recorded only after the signature
      verifies.
  W-AUTH-5:
    name: nonce format
    rule: Teach refuses a nonce that is not exactly 32 lowercase hexadecimal characters (401 unauthenticated).
  W-AUTH-6:
    name: install state
    rule: >-
      An unknown install id is 403 not_enrolled; a revoked install is 403 revoked. Both are checked before the signature
      so a revoked install learns it is revoked.
  W-AUTH-7:
    name: reach version header
    since: 2026-10-03a
    rule: >-
      Since protocol 1 revision 2026-10-03a Reach sends X-Reach-Version, its own version (VERSION, for example
      "0.21.0"), on every request it signs. The header is not part of the W-AUTH-1 payload, so a Teach of an earlier
      revision ignores it. Teach reads it only after the signature verifies, accepts it only when it matches
      ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]{1,32})?$ and is at most 48 characters, records it as the install's
      current reach_version with the time it was reported, and keeps a history row whenever it changes. A missing or
      malformed header never refuses a request and never changes the recorded version. The version enrollment sent in
      its body stays the install's first record.
  instructor_requests: >-
    Instructor API requests use the same scheme with X-Teach-Instructor in place of X-Teach-Install. Reach never sends
    them; the rule is recorded so both flows share one verifier.
keys:
  W-KEY-1:
    name: install key
    rule: >-
      Reach generates an RSA-4096 key pair per install at enrollment. The private key never leaves
      ~/.reach/keys/install.pem (mode 0600). It signs requests and Reach-sealed envelopes and decrypts Teach-sealed
      envelopes.
  W-KEY-2:
    name: Teach keys
    rule: >-
      Teach has one or more non-retired RSA-4096 keys, each with a key_id; exactly one is active. The active key signs
      everything Teach issues (packages, receipts) and decrypts what Reach seals to it (Teach STD-KEY-MODEL: one
      dual-purpose key).
  W-KEY-3:
    name: key advertisement
    rule: >-
      POST /enroll and GET /status both return signing_public_keys (every non-retired key as {key_id, pem}) and
      encryption_key (the active key as {key_id, pem}). Reach replaces its stored copies with these on every successful
      response.
  W-KEY-4:
    name: key selection for verification
    rule: >-
      Reach verifies a Teach signature with the key whose key_id equals the envelope header's signing_key_id or the
      receipt's signing_key_id. When that key_id is unknown, Reach refreshes GET /status once and looks again; still
      unknown is a verification failure. Reach never tries every key.
  W-KEY-5:
    name: key selection for decryption on Teach
    rule: >-
      Teach decrypts a Reach-sealed envelope with the private key named by the header's recipient_key_id, retired or
      not, as long as its private key file still exists. An unknown recipient_key_id is a rejection (invalid_request,
      "unknown recipient key"). A missing recipient_key_id means the active key.
envelope:
  W-ENV-1:
    name: shape
    rule: >-
      A JSON object with exactly the fields header, wrapped_key, nonce, ciphertext, tag and signature. The last five are
      W-CONV-5 base64 strings.
  W-ENV-2:
    name: header
    schema: teach.package/v1
    fields:
      schema: {type: string, const: teach.package/v1, required: true}
      kind: {type: string, enum: [guardrails, workspace, shape, suite, submission, hand_bundle, qualification], required: true, note: "qualification since protocol 1 revision 2026-09-29d"}
      id: {type: string, required: true, note: "Teach: pkgenv_<20 hex>. Reach: renv_<20 hex>."}
      version: {type: integer, minimum: 1, required: true, note: "Teach: per student per kind, increasing. Reach-sealed: always 1."}
      course: {type: string, required: true}
      assignment: {type: [string, "null"], enum: [A1, A2, A3, A4, null], required: false}
      student_id: {type: string, required: true}
      created_at: {type: string, format: W-CONV-3, required: true}
      content_digest: {type: string, format: W-CONV-4, required: true, note: "digest of the plaintext bytes (the .tar.gz)"}
      signing_key_id: {type: string, required: true, note: "Teach-sealed: the Teach key_id. Reach-sealed: the install_id."}
      recipient_key_id: {type: string, required: false, note: "Reach-sealed: the encryption_key key_id it encrypted to. Teach-sealed: absent."}
  W-ENV-3:
    name: sealing
    steps:
      - content_digest = W-CONV-4 digest of the plaintext; set it in the header.
      - aad = canonical_json(header) (W-CONV-2), the header including content_digest.
      - A fresh random 32-byte AES key and a fresh random 12-byte nonce; AES-256-GCM encrypt the plaintext with aad; 16-byte tag.
      - wrapped_key = RSA public_encrypt of the AES key with OAEP padding (OpenSSL PKCS1_OAEP_PADDING, SHA-1, MGF1-SHA-1) under the recipient's public key.
      - signature = W-CONV-6 over the string aad + ciphertext_digest, where ciphertext_digest is the W-CONV-4 digest of the raw ciphertext bytes (plain concatenation, no separator).
  W-ENV-4:
    name: opening
    order:
      - Check the object has exactly the W-ENV-1 fields and the header has every required W-ENV-2 field.
      - Check header.schema, header.kind (equal to the kind the caller expects) and header.student_id (equal to the enrolled student).
      - Select the signer's public key (W-KEY-4 on Reach, the install's key on Teach) and verify the signature. Stop on failure.
      - Unwrap the AES key with the recipient's private key (W-KEY-5 on Teach).
      - Decrypt with aad = canonical_json(header). Stop on an authentication failure.
      - Check the W-CONV-4 digest of the plaintext equals header.content_digest. Stop on mismatch.
      - Only then unpack the plaintext (W-TAR).
    failure: >-
      Reach raises Reach::VerificationFailed and never writes any of the plaintext. Teach treats a submission or hand
      bundle that fails any step as a rejection (state rejected, code invalid_request) without storing plaintext.
tarball:
  W-TAR-1:
    name: format
    rule: >-
      Every envelope plaintext is a POSIX ustar archive written with Gem::Package::TarWriter and compressed with
      Zlib::GzipWriter. Readers accept gzip-compressed (first two bytes 0x1F 0x8B) or uncompressed tar.
  W-TAR-2:
    name: entry names
    rule: >-
      Relative, forward slashes only, no leading "/", no "." or ".." segment, no backslash, no NUL, at most 255 bytes.
      A reader refuses the whole archive when any entry name breaks this rule.
  W-TAR-3:
    name: entry types
    rule: Writers add regular files only. Readers skip directory entries and refuse the archive when it holds a symlink, hard link or device entry.
  W-TAR-4:
    name: limits
    rule: Readers refuse an archive whose uncompressed entries total more than 200 MiB or that holds more than 20000 entries.
  W-TAR-5:
    name: contents map
    rule: Readers return an ordered Hash of entry name to binary String (ASCII-8BIT); writers take the same shape.
packages:
  W-PKG-1:
    name: guardrails
    kind: guardrails
    built_by: teach
    entries:
      directives.yml: >-
        YAML list. First the numbered rules {id, rule}: the base directives G-SCOPE-1 ... G-AI-POLICY-1 in teach.spec.yml
        order, then one entry per string in each of the student's cutouts' "guardrails" list, id "G-CUTOUT-<cutout_id>-<n>"
        with n counting from 1 per cutout. Then, since protocol 1 revision 2026-09-28, the private directive rows
        {id, opcode, alias, tier: private, slice, rule, when, enforce}, one per file in Teach's directives/ directory
        (id "D-<OPCODE>", alias N-Z). A Reach that predates the rows renders them as numbered rules, which is harmless.
      course.yml: >-
        YAML map {id, title, term, timezone, current_assignment: {id, due}, interview: {course_question}}. Since
        protocol 1 revision 2026-09-30b it also carries the course policy (W-POL-1): login, limits, support,
        student_part and module_selection. A Reach older than that revision ignores the extra keys.
        interview.course_question is teach.spec.yml course_model.interview.course_question, or null when absent.
      tips.yml: >-
        YAML list of {cutout_id, text}, one per string in each of the student's cutouts' "tips" list. Absent since
        protocol 1 revision 2026-09-29d: a Teach of that revision writes none and a Reach of that revision reads none.
      "directives/<opcode>.md": >-
        Absent since protocol 1 revision 2026-09-28c: a Teach of that revision ships no bodies in the package and
        serves one per signed request instead (W-API-DIRECTIVE). Revision 2026-09-28b carried them here and a Reach
        of that revision decrypted one in memory; a Reach of 2026-09-28c still reads a body from the package when a
        Teach older than 2026-09-28c put one there. A body is never written to the vault or into a workspace.
      seal.yml: >-
        YAML map {schema: teach.seal/v1, ledger_key, marks}. ledger_key is HMAC-SHA256(Teach's seal secret,
        "ledger\n" + install_id + "\n" + header.version) as 64 lowercase hex characters. marks maps each cutout id of
        the student's slices to a map of owned path to mark, where mark is the first 8 bytes of
        HMAC-SHA256(Teach's seal secret, install_id + "\n" + cutout_id + "\n" + owned path) as 16 lowercase hex
        characters. The seal secret never leaves Teach; Reach stores seal.yml only in the vault.
      reference-keys.json: >-
        Optional, since protocol 1 revision 2026-09-28f. JSON map {schema: reach.reference-keys/v1, keys: [{key_id,
        course, key_b64}]}: the AES-256-GCM content keys of the encrypted course reference blobs (format RREF version
        1) that Teach delivers to this install. A Teach of that revision always writes it, with an empty keys list when
        it holds none; an older Teach omits it and Reach reports every blob as locked. Reach keeps it only in the vault
        and decrypts blobs in memory. Since Teach 0.18.2 it holds only the keys of the install's own course (the
        course's reference_course), every release unit, and no keys when the course has none.
      "reference/<name>.rref": >-
        Optional, since protocol 1 revision 2026-10-01a. The encrypted course reference blobs themselves, one entry
        per course whose content key Teach delivers in reference-keys.json, byte for byte as `teach reference pack`
        wrote them. Before that revision the blobs were committed to the Reach repository under
        corpus/course-reference/; since it, the Reach repository carries no course material at all and Reach reads
        blobs only from its vault copy of this package. Since Teach 0.18.2 only the install's own course's blobs are
        included, every release unit from enrollment on. Since Reach 0.17.1 the one plaintext copy Reach writes is the
        microbrain's private tier (STD-COURSE-CORPUS); never the Reach folder, a workspace or a log.
    reach_use: >-
      The guardrails version is header.version (an integer). Reach renders AGENTS.md, CLAUDE.md and GEMINI.md for a slice
      as W-RENDER-1, writes a digest manifest of the unpacked entries and re-checks it on every load (W-SEAL-3), and
      stamps every owned file with its mark (W-SEAL-1).
  W-PKG-2:
    name: workspace
    kind: workspace
    built_by: teach
    entries:
      slices.json: >-
        {"schema": "teach.workspace/v1", "course": <course id>, "assignment": <A1-A4>, "slices": [<slice>...]} where each
        slice is {cutout_id, slice, module, assignment, due, behavior, owned_files, instructor_apis, panel_slice,
        contract_refs, tags, class, acceptance_mode, scenarios, qualify, root}. root is "<cutout_id>-<slice>". owned_files lists paths relative to the slice
        workspace. tags is ["@<cutout_id>", "@<slice>"] since protocol 1 revision 2026-09-28d (["@<cutout_id>"]
        before it); every tag must hold for a scenario to run (W-RUN-1). acceptance_mode is "remote" and scenarios
        lists the names of the cutout's graded scenarios. qualify (since protocol 1 revision 2026-09-29d; absent before
        and when the course repository's slice API carries none) is {tag, local, env?}, copied from the slice API's
        qualify object: tag is the Cucumber tag every scenario the agent writes for the slice carries ("@backend" or
        "@panel"), and local is true when those scenarios can also run away from Teach (W-QUAL-2). env (since protocol
        1 revision 2026-10-01a, optional) maps environment variable names to relative paths inside the qualify kit;
        Teach drops any name outside [A-Z][A-Z0-9_]{0,63}, any of PATH, HOME, RUBYOPT, RUBYLIB, any name starting with
        BUNDLE_, GEM_, LD_, DYLD_, REACH_ or TEACH_, and any value that is absolute, contains "..", or passes 512 bytes,
        and Reach applies the same rule again before it sets them for a local run.
      "<root>/<owned file>": >-
        The student's starting copy of each owned file: the course repository's stub at stubs/<owned file> when it has
        one (since 2026-09-28d), otherwise empty.
      "<root>/api/README.md": >-
        The instructor APIs the slice may call. Since protocol 1 revision 2026-09-29b, when Teach can run the course
        repository's bin/slice-api, that tool's --format markdown output, verbatim; otherwise, and before that
        revision, the course spec's instructor_apis lines, one per line.
      "<root>/api/slice-api.json": >-
        Optional, since protocol 1 revision 2026-09-29b. The course repository's bin/slice-api --format json output,
        verbatim, conforming to the JSON Schema grokit.slice-api/v1 that the course repository publishes at
        specs/schemas/slice-api.v1.json; this contract does not restate its fields. Teach writes it only after checking
        the output against that schema, and exactly when it writes the tool's README. Reach reads only the schema name
        and the ports' names (plus clock and logger, which every backend slice receives) and falls back to
        api/README.md when the file is absent or names another schema.
      "<root>/contract/README.md": The contract references for the slice, one per line, as given by the course spec.
      "<root>/qualify/kit/<path>": >-
        Since protocol 1 revision 2026-09-29d. One entry per element of the slice API's qualify.kit, at its run-directory
        path, holding the bytes of the course repository file it names (source). The kit is answer-free by the course
        repository's contract; Teach refuses to build the package when a kit source lies under a behaviours/ directory
        or is one of a cutout's owned paths.
      "<root>/qualify/features/.keep": Since 2026-09-29d, an empty file, so the agent's scenario folder exists.
      "<root>/qualify/step_definitions/.keep": Since 2026-09-29d, an empty file, so the agent's step folder exists.
    owned_file_split:
      backend: The cutout's owned_paths that end in ".rb".
      panel: The cutout's owned_paths that do not end in ".rb".
      verification: The cutout's evidence_paths when present; otherwise the slice is not built and Teach reports a warning.
    never_included: >-
      A cutout's reference_implementation, its regeneration prompt, its acceptance scenarios, its status, step or group,
      or any file that is not one of the entries above. Teach copies slice fields by allowlist, never by blocklist.
    reach_use: W-PROV-1.
  W-PKG-3:
    name: shape
    kind: shape
    built_by: teach
    entries:
      "<cutout_id>/shape.json": The signed Dovetail shape for the cutout's module.
      "<cutout_id>/shape.sig": The shape's signature, when Dovetail produced one.
      "<cutout_id>/brief.md": The design brief for the cutout.
      "dovetail/**": >-
        Since 2026-09-28d: the Dovetail shape checker that compiled the shapes, as written by dovetail checker export
        (dovetail/exe/dovetail, dovetail/lib/**, dovetail/VERSION). It runs on Ruby 2.6.10 and later with the standard
        library only.
    availability: >-
      Since 2026-09-28d Teach compiles modules/<module>/contract.rb from the course repository with Dovetail and signs
      shape.json with its active signing key (the key Reach receives in signing_public_keys), for every cutout whose
      module has a contract; a cutout whose module has none is skipped with a warning. Before 2026-09-28d the kind was
      built only for course-spec entries carrying a shape.
    reach_use: >-
      Unpacked into ~/.reach/vault/shape/. The shape for a slice workspace is vault/shape/<cutout_id>/shape.json; its
      brief is copied read-only into <workspace>/shape/brief.md. Reach runs the shipped checker with its own Ruby
      (ruby vault/shape/dovetail/exe/dovetail check ...) and falls back to a dovetail on the PATH only when the package
      carries none. Since 2026-09-28e the check runs on the whole panel the student's code lives in: a copy of
      vault/suite/reference_build/<module>/modules/<module>/panel with the slice's owned panel files laid over it, the
      same tree Teach's grading sandbox checks. A slice that owns no panel files has nothing to check. Without the
      suite, Reach checks the workspace's own panel directory.
  W-PKG-4:
    name: suite
    kind: suite
    built_by: teach
    entries:
      "features/**/*.feature": The acceptance feature files named by the student's cutouts' acceptance_features, at the same relative paths.
      reasons.yml: The plain-language failure reasons, when the course repository has one at features/reasons.yml.
      "features/step_definitions/**": >-
        Since 2026-09-28d: the course repository's shared step files (features/step_definitions/grokit_*.rb) and the
        step file of each module the student's cutouts belong to (features/step_definitions/<module>_steps.rb).
      "features/support/**": Since 2026-09-28d, the course repository's features/support/ directory.
      "reference_build/<module>/**": >-
        Since 2026-09-28e, one tree per module the student's cutouts belong to, each at reference_build/<module>/: the
        output of the course repository's bin/reference-build --module <module> --out <dir>, with every path the student
        owns in that module replaced by the course repository's stub at stubs/<path>, or removed when there is no stub.
        The paths the student owns are each slice's owned_file_split (W-PKG-2), so a panel slice's cutout keeps its
        reference backend and a backend slice's cutout keeps its reference panel. From 2026-09-28d to 2026-09-28e the
        trees were merged into reference_build/**, where the last module's app/ replaced the others', and every
        owned_path of a cutout was stubbed whatever the slice.
      Gemfile: Since 2026-09-28d, the course repository's features/Gemfile.
      Gemfile.lock: Since 2026-09-28d, the course repository's features/Gemfile.lock (Ruby 3.2 and later).
      Gemfile.ruby26.lock: Since 2026-09-28d, the course repository's features/Gemfile.ruby26.lock (Ruby 2.6 to 3.1).
      suite.yml: >-
        Since 2026-09-28d: {suite_version, fixture_version, modules}. suite_version is the course repository's commit
        (12 hex characters); fixture_version is the course repository's fixtures/VERSION, or null.
      "step_definitions/**": Reserved in 0.2.0 and never shipped; replaced by features/step_definitions/**.
      "support/**": Reserved in 0.2.0 and never shipped; replaced by features/support/**.
    availability: >-
      Built only when TEACH_GROKIT_ROOT points at the course repository and the named feature files exist; otherwise
      skipped with a warning.
    reach_use: >-
      Before protocol 1 revision 2026-09-29d, unpacked into ~/.reach/vault/suite/ and run by reach tips as W-RUN-1.
      Teach 0.10.0 and later build no suite package (the acceptance suite runs only on Teach), and Reach 0.11.0 and
      later neither fetch nor read one; its place is taken by the qualify kit (W-PKG-2) and W-QUAL.
  W-RUN-1:
    name: suite run directory
    since: 2026-09-28d
    applies_to: >-
      Teach's grading sandbox and the hidden run of a qualification (W-QUAL-3), from Teach's own copy; before
      protocol 1 revision 2026-09-29d also reach tips, from the vault.
    assemble:
      - Start from an empty directory.
      - Copy reference_build/<module>/** into it at the same relative paths, for the module of the slice's cutout.
      - Copy features/** (feature files, features/step_definitions/**, features/support/**) into features/.
      - Copy Gemfile, Gemfile.lock and Gemfile.ruby26.lock, and reasons.yml, into the directory root.
      - Copy each of the student's owned files for the slice over the path it names, replacing any stub.
    gems: >-
      BUNDLE_GEMFILE is the directory's Gemfile. The lockfile is Gemfile.ruby26.lock on Ruby 3.1 and earlier and
      Gemfile.lock on Ruby 3.2 and later; the runner copies the chosen lock to Gemfile.lock before bundling when they
      differ. When the suite carries no Gemfile, Reach falls back to its own gem set.
    command: >-
      bundle exec cucumber --format json --tags @<cutout_id> --tags @<slice>, run from the directory root, with
      REACH_CHROME naming a Chrome or Chromium binary when one is known and CUPRITE_NO_SANDBOX=1 inside a container.
    results: >-
      Every scenario in the JSON report is one result; it passed when no step failed. A scenario's failure category is
      its @category:<name> tag, or behaviour when it has none.
  W-PKG-5:
    name: submission
    kind: submission
    built_by: reach
    entries:
      manifest.json: >-
        {"schema": "reach.submission/v1", course, assignment, cutout_id, slice, owned_files, digests, reach_version,
        client_created_at, seal}. digests maps each owned file to its W-CONV-4 digest, or null when the file does not
        exist. seal (since 2026-09-28, absent from older Reach) is {guardrails_version, ledger_key: "teach" | "local",
        ledger_head, ledger_count, witnessed: {owned path: digest or null}, marks: {owned path: own | missing | corrupt
        | foreign | unmarked}, harness, sidecar_id, integrity_events}. Since protocol 1 revision 2026-09-29b the seal
        also carries hooked (true when the slice's ledger holds at least one session record), and harness falls back
        to the REACH_HARNESS environment value (claude-code, codex or antigravity) before "unknown". Teach assesses a
        seal whose hooked is false, or whose harness is antigravity or unknown with no session record in the ledger
        tail, as hookless: under its unhooked-harness policy "note" (the default) the unwitnessed files become one note
        instead of review reasons; under "review" they stay reasons naming the harness. A seal without hooked is
        assessed as before this revision.
      "files/<owned file>": One entry per owned file that exists, its bytes unchanged.
      ledger.jsonl: The last 2000 records of the slice's witness ledger (W-SEAL-2), verbatim; absent when the ledger is empty.
      "evidence/qualify/features/<path>": >-
        Since protocol 1 revision 2026-09-29d. The agent's scenario files for the slice (the workspace's
        qualify/features/**, .keep excluded), bytes unchanged, exactly as the passing qualification used them.
      "evidence/qualify/step_definitions/<path>": Since 2026-09-29d, the agent's step files (qualify/step_definitions/**), likewise.
      evidence/qualification.json: >-
        Since 2026-09-29d. The passing qualification record (W-QUAL-5) whose files_digest and tests_digest equal the
        submitted owned files and evidence files. Teach stores and lists every evidence entry with the submission and
        never grades one; a submission from an older Reach carries none.
      part.json: >-
        Since protocol 1 revision 2026-09-30b. The student's own part for the submission's assignment (W-PART-2):
        {"schema": "reach.part/v1", assignment, student_id, answers: [{question_id, text, words, session_id, seq,
        digest, recorded_at}]}; since 2026-10-03b an answer carries no session_id or seq, and Teach ignores both when
        an older Reach sends them. Required when the course policy's student_part.required is true and the assignment
        has questions; Teach answers 400 invalid_request "the student's part is missing" otherwise.
    teach_checks:
      - manifest.cutout_id, manifest.slice and manifest.assignment equal the request body's cutout_id, slice and assignment.
      - Every files/ entry's path (without the files/ prefix) is in manifest.owned_files, and its digest equals manifest.digests for that path.
      - Every other entry is manifest.json, ledger.jsonl, part.json (since 2026-09-30b) or under evidence/; since 2026-09-29d any other entry rejects the submission.
      - >-
        From 2026-09-30b to 2026-10-02f part.json was checked by W-PART-3; since 2026-10-03b it is stored as sent and
        never checked against a transcript.
      - When the course spec is available, manifest.owned_files equals the W-PKG-2 owned_file_split for that cutout and slice.
      - A failed check rejects the submission with code invalid_request and reason "the package does not match the slice".
      - >-
        Provenance (W-SEAL-4) is assessed after the checks above and never rejects a submission; its verdict is stored
        on the submission for instructors and is not part of any receipt.
    file_list: The ingest receipt's file_list is the sorted list of files/ entry paths without the files/ prefix.
  W-PKG-6:
    name: hand bundle
    kind: hand_bundle
    built_by: reach
    entries:
      bundle.json: >-
        {"schema": "reach.hand/v1", trigger, summary, course, assignment, cutout_id, slice, attempts, files, plan, profile,
        client_created_at}. files maps each owned file to its text or null. attempts is the slice's recent attempt records.
        plan is the slice plan (reach.plan/v1) or null. profile is the student's saved profile fields, present only when
        the student agreed to include it; otherwise null. Reach 0.11.0 and later send reach.hand/v2 (W-PKG-6-v2);
        Teach 0.11.0 and later accept both.
  W-PKG-6-v2:
    name: hand bundle, version 2
    since: 2026-09-29d
    kind: hand_bundle
    built_by: reach
    entries:
      bundle.json: >-
        {"schema": "reach.hand/v2", hand_ref, originator, trigger, created_at, course, assignment, module, cutout_id,
        slice, task, attempts, code, tests, last_output, agent_summary, student_last_request, environment,
        contract_version, suite_version, plan, profile}. hand_ref is a UUID Reach makes for the hand. originator is
        agent (Reach raised it on the attempt ladder, W-QUAL-6) or student (the student asked for help). trigger is
        attempt_ladder, student_request or check_gate. task is {behaviour, plan_step, description}: the slice's
        behaviour, the plan step being worked, and the agent's one-line description of what it was attempting.
        attempts is {count, notice_from: 2, hand_at: 3, hard_stop: 10, history: [{n, at, passed, steps,
        files_digest}]}, the slice's qualifications since the last pass or instructor reply. code maps every owned file
        to its full text or null. tests maps every file under the workspace's qualify/features and
        qualify/step_definitions (.keep excluded) to its full text. last_output is {local: [plain lines], agent, stub,
        hidden} from the last qualification, the three row lists as W-API-QUALIFICATION returns them, the whole object
        cut to 65536 bytes of JSON. agent_summary is the agent's plain account of what failed and what it tried
        (at most 4000 bytes); student_last_request the student's last prompt in the slice (at most 4000 bytes) or
        null, and always null since 2026-10-03b (W-TRN-0). environment is {reach_version, ruby_version, platform, harness, model or null}. contract_version and
        suite_version come from the slice API and the last qualification, or null. plan and profile as in W-PKG-6.
    size: The whole bundle.json is at most 196608 bytes; Reach drops last_output first, then cuts code and tests to their first 32768 bytes each, marking every cut with "[cut]".
  W-PKG-7:
    name: qualification
    since: 2026-09-29d
    kind: qualification
    built_by: reach
    entries:
      manifest.json: >-
        {"schema": "reach.qualification/v1", course, assignment, cutout_id, slice, owned_files, digests, tests,
        attempt, reach_version, client_created_at}. digests maps each owned file to its W-CONV-4 digest or null, as in
        W-PKG-5; tests maps each qualify/ path sent to its digest. attempt is the slice's attempt number (W-QUAL-6).
      "files/<owned file>": One entry per owned file that exists, its bytes unchanged.
      "qualify/features/<path>": Every file under the workspace's qualify/features (.keep excluded).
      "qualify/step_definitions/<path>": Every file under the workspace's qualify/step_definitions (.keep excluded).
    teach_checks:
      - The same manifest and file checks as W-PKG-5, and every qualify/ entry's digest equals manifest.tests.
      - At most 60 scenarios across the feature files and at most 512 KiB of qualify/ entries; more is invalid_request.
render:
  W-RENDER-1:
    name: course rules file
    rule: >-
      AGENTS.md, CLAUDE.md and GEMINI.md in a slice workspace hold the same text: "# Course rules for this workspace", a
      blank line, "You are helping a student with one slice of a course module. These rules come from the instructors
      and always apply.", a blank line, a numbered list ("1. ", "2. ", ...) of every directives.yml entry without an
      opcode whose id does not start with "G-CUTOUT-" followed by those whose id starts with
      "G-CUTOUT-<this slice's cutout_id>-", in file order, then the directive table (W-RENDER-2) when it is not empty,
      a blank line, then "Your files: <owned files joined by ', '>", "Slice: <cutout_id> (<slice>) - <behavior>" and
      "Due: <due>", each on its own line, ending with a newline.
  W-RENDER-2:
    name: directive table
    rule: >-
      A blank line, "## Course directives", a blank line, one row per directives.yml entry with an opcode whose slice is
      all or equals this slice; a blank line, "## Engineering directives", a blank line, one row per file in Reach's
      directives/ directory whose slice applies; a blank line, then the pointer sentence. A section with no rows is
      omitted. A row is "[<alias> · <OPCODE>]" padded to 20, the rule padded to 88, "reach directive <OPCODE>" padded to
      26, "⚙ " and the enforce value padded to 22, "⚡ " and the when list as "[a, b]", separated by single spaces.
provisioning:
  W-PROV-1:
    name: slice workspaces
    rule: >-
      For each entry in slices.json, Reach provisions ~/reach-work/deliverables/<course>/<assignment>/<root>/ (since
      protocol 1 revision 2026-09-29c; ~/reach-work/<course>/<assignment>/<root>/ before, and REACH_WORKSPACE_ROOT
      replaces ~/reach-work) from the archive entries under "<root>/", then writes README.md (Reach's template from the
      slice fields), the W-RENDER-1 files, shape/brief.md when a brief exists, .reach/slice.json (course, assignment,
      cutout_id, slice, kind = slice, behavior, due, owned_files, tags, package_version, and since 2026-09-29d
      scenarios and qualify) and .reach/delivered.json, and makes every file except the owned files read-only. Since
      2026-09-29d the qualify/features and qualify/step_definitions folders stay writable and are left out of
      delivered.json, like the owned files; qualify/kit stays read-only.
  W-PROV-2:
    name: never overwrite the student's work
    rule: >-
      When a newer workspace package arrives, Reach replaces read-only files and the marker, but keeps any owned file
      whose current digest differs from the digest it had when last delivered. It records each kept file in the sync
      summary.
routes:
  - id: W-API-ENROLL
    method: POST
    path: /api/v1/enroll
    auth: none (rate limited per IP)
    request:
      code: {type: string, minLength: 12, maxLength: 32, note: "shape v1 only: a per-student single-use code"}
      shape: {type: string, enum: [v1, v2], required: false, note: "since revision 2026-10-01b; absent means v1"}
      course_code: {type: string, required: false, note: "shape v2 only: the class-wide course code, normalized by W-ENR-1 before sending"}
      username: {type: string, required: false, note: "shape v2 only: the student's institutional username, normalized by W-ENR-3"}
      student_id: {type: string, required: false, note: "shape v2 only: the student's institutional id, normalized by W-ENR-3"}
      fingerprint: {type: object, required: false, note: "shape v2 only: the W-ENR-4 fingerprint document"}
      password: {type: string, required: false, note: "shape v2 only, required since revision 2026-10-01e: the password the student chose as the last enrollment step (W-ENR-7), 8 to 256 characters after Reach trims surrounding whitespace; Teach stores only an scrypt hash and never logs, audits or returns it"}
      public_key_pem: {type: string, maxLength: 4096}
      reach_version: {type: string}
      platform: {type: string, enum: [macos, windows, linux], note: "Reach maps RbConfig host_os darwin -> macos, mswin|mingw|cygwin -> windows, anything else -> linux"}
      ruby_version: {type: string, note: RUBY_VERSION}
    response_200:
      install_id: string
      student_id: string
      course: {id: string, title: string, term: string, timezone: string}
      signing_public_keys: "[{key_id, pem}]"
      encryption_key: "{key_id, pem}"
      minimum_reach_version: string
      wire_contract_sha256: string
      display_name: "shape v2 only: the roster display name of the student"
      enrollment_stamp: "shape v2 only: the signed W-ENR-5 enrollment stamp"
    errors:
      400 invalid_request: "a bad, expired or used code, or a malformed body"
      400 reach_outdated: "reach_version is below minimum_reach_version (the code is not used)"
      400 course_code_unknown: "shape v2: no live course code matches (W-ENR-1); details may carry {did_you_mean: course id}, or since 2026-10-01d {course_only: course id}"
      400 course_code_expired: "shape v2: the course code matched but its course has ended"
      403 enrollment_refused: "shape v2: the username and student id do not name one roster entry of the code's course; never says which field failed"
      409 device_move_pending: "shape v2, since 2026-10-01c: the student already holds an active stamped install with another fingerprint and the course policy's enrollment.device_moves is approve (W-ENR-8)"
      403 device_move_denied: "shape v2, since 2026-10-01c: an instructor denied this device move (W-ENR-8)"
      400 password_required: "shape v2, since 2026-10-01e: password is missing, not a string, shorter than 8 or longer than 256 characters; checked before the course code is looked up, and the message tells an older Reach to update and enroll again"
      429 rate_limited: "too many attempts"
    notes: >-
      Spelled /api/v1/enroll since protocol 1 revision 2026-09-29c. Since the same revision Teach compares reach_version
      with its minimum_reach_version before it redeems the code, and refuses an older Reach with 400 reach_outdated
      and a message naming both versions, so the student can update Reach and enroll again with the same code. Teach 0.10.0 and later also answer the old
      /api/v1/enrol with the same handler, unlisted, so an installed older Reach can still enroll; Reach 0.10.0 and
      later post to /api/v1/enroll and retry once at /api/v1/enrol when a Teach older than 0.10.0 answers 404
      not_found. Since revision 2026-10-01b a request carries shape v2 (W-ENR-1..5): Teach resolves course_code to
      exactly one course, finds the roster entry of that course whose username and student_id both equal the
      request's, creates the install, stores the fingerprint and answers with a signed enrollment stamp. Teach keeps
      answering shape v1 until an operator retires per-student codes. Reach checks that response student_id equals
      the student_id it sent and refuses the enrollment (M-ENROLL-INCOMPLETE) when it does not.
  - id: W-API-ENROLL-PREVIEW
    method: GET
    path: /api/v1/enrollment/preview
    auth: none (rate limited per IP, shared with W-API-ENROLL)
    request_query:
      course_code: the course code, normalized by W-ENR-1
    response_200:
      course: {id: string, title: string, term: string, ends_on: "YYYY-MM-DD or null"}
      expires_at: "W-CONV-3 timestamp, the end of the course's last day in the course timezone"
      identity: "{institution_name, username_domain, username_pattern, student_id_pattern}, the W-ENR-3 rules Teach enforces for this course"
    errors: {400 course_code_unknown: "as W-API-ENROLL", 400 course_code_expired: "as W-API-ENROLL", 429 rate_limited: "too many attempts"}
    notes: >-
      Since revision 2026-10-01b. Reveals only what the class-wide code already reveals to anyone who holds it: the
      course and the identity format. Reach calls it once per code typed in the enrollment flow (W-ENR-7) and uses the
      identity rules it returns over its own config defaults.
  - id: W-API-ENROLL-INSTRUCTOR
    method: POST
    path: /api/v1/enroll/instructor
    auth: "none; the instructor code is the credential (rate limited per IP, shared with W-API-ENROLL)"
    request:
      shape: {type: string, enum: [v2], note: "always v2"}
      instructor_code: {type: string, maxLength: 4096, note: "the RINS1 instructor unlock code the install holds (STD-INSTRUCTOR-UNLOCK); Teach verifies it against the keys and revocations in its course policy and never logs, audits or returns it"}
      course_id: {type: string, required: false, note: "the course to join; may be omitted when Teach has exactly one course that has not ended"}
      persona: {type: object, note: "{kind: dummy} for a blank test student, or {kind: copy, username: <roster username>} for a test copy of that student"}
      fingerprint: {type: object, note: "the W-ENR-4 fingerprint document of the persona's own install"}
      public_key_pem: {type: string, maxLength: 4096, note: "the persona install's own public key"}
      reach_version: {type: string}
      harness: {type: string, enum: [claude-code, codex, hermes, unknown]}
      platform: {type: string, enum: [macos, windows, linux]}
      ruby_version: {type: string}
    response_200:
      install_id: string
      student_id: "the test student's id (test_<12 hex>), never a real student's"
      course: {id: string, title: string, term: string, timezone: string}
      signing_public_keys: "[{key_id, pem}]"
      encryption_key: "{key_id, pem}"
      minimum_reach_version: string
      wire_contract_sha256: string
      display_name: "the test student's display name: 'Test student <4 hex>' or 'Test copy of <the student's display name>'"
      enrollment_stamp: "a signed W-ENR-5 stamp for the test student, exactly as W-API-ENROLL issues it"
      persona: "{kind: dummy|copy, student_id, username, display_name, test_of: the copied student's id or null}"
    errors:
      400 invalid_request: "a malformed body or persona"
      400 reach_outdated: "as W-API-ENROLL"
      403 instructor_code_refused: "the code is malformed, its key is not pinned in Teach's course policy, its signature fails, or its id is revoked; details {reason: malformed|key_unpinned|signature|revoked}; counts toward the per-IP refusal limit"
      409 course_required: "course_id was omitted and more or fewer than one course is open; details {courses: [course ids that have not ended]}"
      404 not_found: "course_id names no course"
      400 course_code_expired: "the course has ended"
      404 student_not_found: "persona kind copy: no active roster entry of the course has that username"
      429 rate_limited: "too many attempts"
    notes: >-
      Since revision 2026-10-02a. Lets an instructor who holds a valid instructor unlock code run any Reach install as a
      test student, to experience the course exactly as a student does. Teach never issues an install for a real
      student here: it creates a new test student (students.test_of 'dummy' or the copied student's id, and the code's
      id and key id) with a roster entry in the course and answers as W-API-ENROLL does for that test student. A copy
      starts from the copied student's group, slice assignments, latest module record, submissions and their receipts,
      re-issued under the test student's ids; nothing is written to the copied student's own record. A dummy starts
      blank. Every later request from the persona's install is an ordinary install request; Teach answers revoked to it
      once the code's id is listed in the course policy's enrollment.instructor_revoked or its key is removed. Test
      students are left out of roster imports, grade exports, module capacity, sidecar conflicts and course-wide
      counts, and every instructor view names them by their 'Test' display name. A Teach older than this revision
      answers 404 not_found, and Reach says the course server must be updated first.
  - id: W-API-STATUS
    method: GET
    path: /api/v1/status
    auth: install
    response_200:
      install_id: string
      student: {id: string, display_name: string, group: "string or null"}
      course: {id: "string or null"}
      current_assignment: "{id, due} or null"
      slices: "[{cutout_id, slice, assignment}]"
      packages: "[{kind, version, content_digest}] for the latest package of each kind that exists"
      outstanding_receipts: "[receipt_id]"
      server_time: W-CONV-3 timestamp
      signing_public_keys: "[{key_id, pem}]"
      encryption_key: "{key_id, pem}"
      minimum_reach_version: string
      wire_contract_sha256: string
      transcripts: >-
        Since protocol 1 revision 2026-09-29c. {kinds: [entry kinds W-API-TRANSCRIPT accepts], max_text_bytes: 131072}.
        Absent from an older Teach, which Reach reads as kinds [prompt]. Since 2026-10-03b a Teach answers {kinds:
        [prompt, reply, reasoning, action, code], max_text_bytes: 131072} only so that an older Reach sends, and so
        drops, every queued kind (W-API-TRANSCRIPT); a Reach of this revision ignores it.
      modules: >-
        Since protocol 1 revision 2026-09-30b. The student's current signed module record (W-MOD-1), or null when the
        course is student_choice and the student has not chosen yet. For an instructor-mode course Teach issues the
        first record itself, source instructor, from the distinct modules of the student's slice assignments, the
        first time status is asked for after the student has any.
      module_selection: >-
        Since 2026-09-30b. {mode: "instructor | student_choice", open: boolean, closes_at: "W-CONV-3 or null",
        chosen: boolean}. open is true only in student_choice mode, inside the window, with no module record yet.
      transfer: "Since 2026-09-30b. The student's open transfer request {transfer_id, state, modules, created_at}, or null."
      policy_digest: >-
        Since 2026-09-30b. The W-CONV-4 digest of canonical_json of the course policy (W-POL-1) in the current
        guardrails package, so Reach can tell a stale package from a changed policy without fetching it.
      classification: >-
        Since 2026-10-02a. "instructor" when the install's student is a test student (W-API-ENROLL-INSTRUCTOR),
        otherwise "student". Teach derives it from the student and files every record from the install under it; an
        install never sets it.
      debug: >-
        Since 2026-10-02a. {requested: boolean, until: "W-CONV-3 timestamp or null", by: "instructor id or null"}: an
        instructor's remote request that this install run debug mode (W-API-DEBUG). Always requested true for a test
        student. Absent from an older Teach, which Reach reads as requested false.
  - id: W-API-PACKAGE
    method: GET
    path: /api/v1/packages/:kind
    auth: install
    request_headers:
      If-None-Match: The quoted content_digest of the newest package of this kind Reach has stored, when it has one.
    response_200: The envelope (W-ENV-1) of the latest package of that kind for this install's student, with ETag "<content_digest>" in double quotes.
    response_304: Empty body; the stored package is current.
    errors: {404 not_found: "no package of this kind has been built for the student yet"}
    notes: >-
      Since protocol 1 revision 2026-09-30b Teach builds and serves the guardrails package for the current assignment
      even when it is not released or the student has no slices yet (a student_choice course before the student
      chooses), so Reach can load the course policy, sign the student in and ask the lock-in question. Every other
      kind still needs a released assignment and the student's slices (403 not_released otherwise).
    reach_use: >-
      Reach stores the verified envelope at ~/.reach/packages/<kind>/<header.version>.pkg. A 404 is not an error; the
      kind has not been built yet.
  - id: W-API-SUBMIT
    method: POST
    path: /api/v1/submissions
    auth: install
    request_headers:
      Idempotency-Key: Required. A UUID Reach generates once per submission and reuses on every retry of it.
    request:
      cutout_id: {type: string, pattern: "^[a-z_]+\\.a[1-4](s[12])?$"}
      slice: {type: string, enum: [backend, panel, verification]}
      assignment: {type: string, enum: [A1, A2, A3, A4]}
      package: W-ENV-1 envelope, header.kind submission (W-PKG-5)
      client_created_at: W-CONV-3 timestamp
    response_200:
      submission_id: string
      state: "ingested | rejected"
      receipt: The signed ingest receipt (W-RCPT) when state is ingested.
      rejection: "{code, reason} when state is rejected"
      attempt: "Since revision 2026-10-02c, when state is ingested. This submission's number among the student's ingested submissions of the slice, counting from 1."
      due: "Since revision 2026-10-02c. The assignment's due time as a W-CONV-3 timestamp, or null when it has none."
      resubmit: "Since revision 2026-10-02c. open when Teach would accept another submission of this slice now, closed when the due time has passed."
    notes: >-
      Ingest is synchronous: the ingest receipt arrives in this response, so Reach announces "received" at once. A repeat
      with the same Idempotency-Key returns the original submission_id, state and receipt. Since revision 2026-10-02c
      (W-SUB-1) a slice may be submitted any number of times before its due time; a Reach older than that revision
      ignores attempt, due and resubmit.
    errors: {403 not_released: "", 403 forbidden: "not the student's slice, or submissions disabled", 403 deadline_passed: "after the due time, when a submission of the slice that was not rejected is already on record (W-SUB-1)", 413 too_large: "body over 5 MB", 429 rate_limited: ""}
  - id: W-API-SUBMISSION
    method: GET
    path: /api/v1/submissions/:id
    auth: install
    response_200:
      submission: "the submission record; since revision 2026-10-02c it carries attempt, supersedes and superseded_by (W-SUB-1)"
      receipts: "[receipt bodies], oldest first"
      acknowledgments: >-
        Since protocol 1 revision 2026-09-30. [W-RCPT-4 acknowledgment bodies, each with linked_at added], oldest
        first; absent from an older Teach.
    reach_use: Polled no more often than every 30 seconds for a grade receipt, only while one is outstanding.
  - id: W-API-QUALIFY
    method: POST
    path: /api/v1/qualifications
    auth: install
    since: 2026-09-29d
    request_headers:
      Idempotency-Key: Required. A UUID Reach generates once per qualification and reuses on every retry of it.
    request:
      cutout_id: {type: string, pattern: "^[a-z_]+\\.a[1-4](s[12])?$"}
      slice: {type: string, enum: [backend, panel]}
      assignment: {type: string, enum: [A1, A2, A3, A4]}
      package: W-ENV-1 envelope, header.kind qualification (W-PKG-7)
      client_created_at: W-CONV-3 timestamp
    response_202: {qualification_id: string, status: pending}
    notes: >-
      Ungraded: a qualification makes no score, no receipt and no grade row, and never counts as a submission. Teach
      runs it in the grading sandbox (W-QUAL-3). A repeat with the same Idempotency-Key returns the original
      qualification_id and its current status.
    errors: {400 invalid_request: "a body, package or manifest outside W-PKG-7", 403 forbidden: "not the student's slice", 403 not_released: "", 413 too_large: "body over 2 MB", 429 rate_limited: "over TEACH_QUALIFY_LIMIT_PER_HOUR (default 12) per slice per hour, or 2 already pending or running for the student", 503 unavailable: "qualifications are switched off (TEACH_QUALIFY_DISABLE=1); Retry-After says when to try"}
  - id: W-API-QUALIFICATION
    method: GET
    path: /api/v1/qualifications/:id
    auth: install
    since: 2026-09-29d
    response_200:
      qualification_id: string
      status: "pending | running | done | failed_to_run"
      agent: "[{name, result: passed | failed | skipped, step, error}] once done: the agent's scenarios on the slice"
      stub: "[{name, result}] once done: the same scenarios with the starting copies in place of the owned files"
      hidden: "[{name, result, reason}] once done: the instructors' graded scenarios for the slice"
      suite_version: "string or null"
      finished_at: "W-CONV-3 timestamp or null"
      reason: "string or null: why a run could not run (failed_to_run only), in plain words"
    notes: >-
      step is the text of the scenario's first failing step as written in the agent's feature file, and error the
      class name of what it raised (for example Capybara::ElementNotFound or RuntimeError); both are null for a
      scenario that passed or was skipped. Teach never returns a failure message, step output, log, page text or file
      content from a qualification run, because the run directory holds course code the student does not own. reason
      on a hidden row is the category text from the course's reasons.yml, as on a grade receipt.
  - id: W-API-RECEIPTS
    method: GET
    path: /api/v1/receipts
    auth: install
    query: {since: "W-CONV-3 timestamp, optional", limit: "1-200, default 50", cursor: "a receipt_id, optional"}
    response_200: {receipts: "[receipt bodies], newest first"}
    reach_use: >-
      Since protocol 1 revision 2026-09-30, reach sync pages through this route (limit 200, at most 5 pages) and stores
      every receipt Reach does not already hold, after verifying it (W-RCPT-2), so a receipt Reach missed or lost is
      preserved on the student's machine too.
  - id: W-API-RECEIPT-ACK
    method: POST
    path: /api/v1/receipts/:receipt_id/acknowledgment
    auth: install
    since: 2026-09-30
    request_headers:
      Idempotency-Key: Required. The acknowledgment's ack_id, reused on every retry of it.
    request: The W-RCPT-4 acknowledgment body, signature included; its receipt_id equals the path's.
    response_200: {ack_id: string, receipt_id: string, linked_at: W-CONV-3 timestamp}
    notes: >-
      Teach links the acknowledgment to the receipt it names and keeps it beside that receipt for instructors. One
      acknowledgment per receipt per install: a repeat for a receipt this install already acknowledged answers 200
      with the stored ack_id and linked_at, and Reach adopts them. Teach checks, in order: the receipt exists (404
      not_found); it belongs to the install's student (403 forbidden); the body has exactly the W-RCPT-4 fields, its
      install_id is the authenticated install and its student_id, submission_id and receipt_kind match the stored
      receipt (400 invalid_request); the signature verifies with the install's public key (400 invalid_request);
      receipt_digest equals the W-CONV-4 digest of canonical_json of the receipt body Teach issued, signature included
      (409 conflict). A Teach that predates the route answers 404 not_found, and one whose operator switched
      acknowledgments off (TEACH_RECEIPT_ACKS_DISABLE=1) answers 403 forbidden; Reach keeps the acknowledgment pending
      in both cases and sends it on a later sync.
    errors:
      400 invalid_request: a field outside W-RCPT-4, a field that does not match the receipt or install, or a signature that does not verify
      403 forbidden: not the student's receipt, or acknowledgments are switched off on this Teach
      404 not_found: no receipt by that id
      409 conflict: receipt_digest does not match the receipt Teach issued
      429 rate_limited: over 120 acknowledgments per hour per install
  - id: W-API-HAND
    method: POST
    path: /api/v1/hands
    auth: install
    request_headers:
      Idempotency-Key: Required, as for submissions.
    request:
      cutout_id: string
      slice: {enum: [backend, panel, verification]}
      trigger: {enum: [attempt_gate, attempt_ladder, student_request, check_gate, wellbeing, late_work, late_submission, concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue, setup_issue, access_issue, extension_request, feedback, integrity_question, other], note: "attempt_ladder since 2026-09-29d; attempt_gate is sent by Reach older than 0.11.0 only; wellbeing since 2026-09-30b (W-SUP-2); late_work through other since 2026-10-02e (W-HAND-TYPES)"}
      originator: {enum: [agent, student], required: false, note: "since 2026-09-29d; absent means student"}
      summary: {type: string, maxBytes: 2000}
      bundle: W-ENV-1 envelope, header.kind hand_bundle (W-PKG-6 or W-PKG-6-v2)
    response_200: {hand_id: string, state: string}
    notes: >-
      check_gate (since 2026-09-28) is raised by reach submit when reach check still reports findings on a second
      attempt. Since 2026-09-29d Teach keeps originator and the bundle's hand_ref with the hand and shows instructors
      the originator, the attempt count and history, the task, and the code and tests in full. An instructor's reply is
      what resets the slice's attempt ladder (W-QUAL-6). Since 2026-09-30b a wellbeing hand (W-SUP-2) may carry
      cutout_id and slice null, its bundle is reach.hand.wellbeing/v1, and Teach lists open wellbeing hands before
      every other hand.
  - id: W-API-HAND-STATUS
    method: GET
    path: /api/v1/hands/:id
    auth: install
    response_200: {state: string, reply: "object or null"}
  - id: W-API-GRADES
    method: GET
    path: /api/v1/grades
    auth: install
    since: 2026-10-02e
    response_200:
      available: "boolean; false while the course has no recorded points for this student, or grades are switched off"
      grades: "[{assignment, points, points_possible, recorded_at}] for the install's own student, one row per assignment, the latest recording of each; points and points_possible are non-negative numbers, points_possible may be null"
      total: "{points, points_possible} summed over grades, points_possible null when any row's is null; null when grades is empty"
      as_of: W-CONV-3 timestamp of the answer
    errors: {403: grades_disabled when Teach's grade kill switch is on}
    notes: >-
      A grade is a number of points an instructor records in Teach; the autograder's scenario results (W-RCPT-1) are
      not grades and this route never derives points from them. Teach that predates the revision answers 404, which
      Reach shows as grades not available yet.
  - id: W-API-EXTRA-CREDIT
    method: POST
    path: /api/v1/extra-credit
    auth: install
    since: 2026-10-02f
    request_headers:
      Idempotency-Key: Required, as for submissions; a retry of one redemption reuses its key.
    request:
      redemption: {type: string, minLength: 10, maxLength: 10, note: "the extra-credit code normalized by W-XC-1"}
      answer: {type: string, minLength: 1, maxBytes: 4000, note: "the student's answer, trimmed, stored by Teach as given (W-XC-2)"}
      answered_at: W-CONV-3 timestamp of when the student gave the answer to Reach
    response_200:
      entry: "{entry_id, label, points, answer, answered_at, recorded_at} for the redeemed code (W-XC-3); points is a non-negative number or null"
    errors:
      400: "extra_credit_unknown when no live code of this course matches, or it is bound to another student; extra_credit_expired when its expiry has passed"
      409: extra_credit_used when the code was already redeemed by a request with a different Idempotency-Key
      503: unavailable when Teach's extra-credit kill switch is on
    notes: >-
      Teach never says whether an unknown code exists for another student. A redemption is final: the student cannot
      change the answer, and an instructor who wants a new answer mints a new code.
  - id: W-API-EXTRA-CREDIT-LIST
    method: GET
    path: /api/v1/extra-credit
    auth: install
    since: 2026-10-02f
    response_200:
      entries: "[W-XC-3 entry] for the install's own student in this course, oldest first"
      as_of: W-CONV-3 timestamp of the answer
    errors: {503: unavailable when Teach's extra-credit kill switch is on}
    notes: Teach that predates the revision answers 404, which Reach treats as no extra credit recorded on Teach yet.
  - id: W-API-INTEGRITY
    method: POST
    path: /api/v1/integrity
    auth: install
    request_headers:
      Idempotency-Key: Required, as for submissions.
    request:
      kind: {enum: [vault_tampered, corrupt_mark, foreign_mark, ledger_break, sidecar_conflict, enrolled, directive_dump, login_failed, identity_denied, outside_access, fingerprint_mismatch], note: "login_failed, identity_denied and outside_access since 2026-09-30b (W-ID-3, W-SBX-3); fingerprint_mismatch since 2026-10-01b (W-ENR-6)"}
      detail: {type: string, maxBytes: 2000}
      cutout_id: {type: [string, "null"], required: false}
      slice: {type: [string, "null"], required: false}
      path: {type: [string, "null"], required: false}
      ledger_head: {type: [string, "null"], required: false}
      client_created_at: W-CONV-3 timestamp
    response_200: {event_id: string}
    notes: >-
      Since 2026-09-28. Teach stores the event against the install and student and shows it to instructors only. A
      Teach that predates the route answers 404 not_found, which Reach ignores (never retried, W-ERR-2). Reach sends
      kind enrolled once after every successful enrollment with detail {sidecar_id, prior_install_ids, platform}, so
      installs sharing a sidecar are linked on Teach. Kind directive_dump names a sweep of the private directives
      (three or more distinct within 300 seconds, or every one within an hour). A Reach of revision 2026-09-28b
      counted reads itself and sent the kind; since 2026-09-28c Teach counts the bodies it served (W-API-DIRECTIVE)
      and creates the event itself, at most one per install per hour, and Reach sends none. A Teach that predates
      the kind answers 400 invalid_request, which Reach ignores.
    errors: {429 rate_limited: "over 30 events per hour per install"}
  - id: W-API-DIRECTIVE
    method: GET
    path: /api/v1/directives/<OPCODE>
    auth: install
    query:
      cutout_id: {type: string, required: false}
      slice: {type: string, required: false}
    response_200: {opcode: string, alias: string, rule: string, body: string, digest: string}
    notes: >-
      Since protocol 1 revision 2026-09-28c. The body of one private directive, served for this one request and
      never stored on the install; Reach asks in quick mode (one attempt, two-second timeouts, no retries) and shows
      the table's one-line rule with M-DIRECTIVE-OFFLINE when it cannot. digest is SHA-256 over every row and body
      Teach currently holds, so a change of any directive is visible without a package rebuild. Teach records every
      served body (install, student, opcode, cutout_id, slice, time) and derives directive_dump events from that
      record; the query is covered by the request signature (W-SIG-1), so the cutout and slice are the install's own
      claim, signed. A Teach that predates the route answers 404 not_found; a revoked install is refused as for every
      route.
    errors:
      400 invalid_request: the opcode is not 3 to 10 capitals or digits
      404 not_found: no directive by that opcode
      429 rate_limited: over 60 bodies per hour per install
  - id: W-API-DEBUG
    method: POST
    path: /api/v1/debug
    auth: install
    request:
      session_id: {type: string, maxLength: 128, note: "the harness session id, or \"cli\" for a terminal command"}
      harness: {type: string, enum: [claude-code, codex, hermes, unknown]}
      surface: {type: string, enum: [tui, gui], note: "how the harness renders text for the person (W-DBG-RENDER)"}
      reason: {type: string, enum: [persona, local, remote, fault], note: "why the events were recorded: an instructor persona, reach debug on, status.debug.requested, or fault (debug mode off; only fault and link events, W-DBG-FAULT, since 2026-10-02b)"}
      events: {type: array, maxItems: 500, note: "W-DBG-EVENT objects, oldest first"}
    response_200:
      accepted: integer
      classification: "instructor | student, as status.classification"
    errors:
      400 invalid_request: "a malformed body or an event outside W-DBG-EVENT"
      413 too_large: "the body is over 1 MiB"
      429 rate_limited: "too many batches"
    notes: >-
      Since revision 2026-10-02a. Reach sends its debug spool here from the Stop and SessionEnd hooks and reach sync,
      never blocking a hook on the network; a failure keeps every event queued. Teach stores each event with the
      install, the student and the classification it derives (instructor for a test student, else student), drops an
      event whose id it already holds, and keeps them for instructors to read with teach debug. Since revision
      2026-10-02b a batch may carry reason fault: Reach sends its fault and link events (W-DBG-FAULT) even while
      debug mode is off, and Teach stores them like any other event. A Teach older than 2026-10-02b answers 400
      to reason fault and Reach keeps those events in its rejected file.
  - id: W-API-TRANSCRIPT
    method: POST
    path: /api/v1/transcripts
    auth: install
    retired: 2026-10-03b
    response_200:
      session_id: string, as sent
      accepted: 0
      duplicates: integer, the number of entries in the request
      last_seq: integer, the highest seq in the request, 0 when none carries an integer seq
      gaps: "[]"
    notes: >-
      Retired in protocol 1 revision 2026-10-03b: no conversation is ever captured from the student (W-TRN-0). A Reach
      of this revision never calls the route. A Teach of this revision answers an older Reach with the 200 above and
      stores, logs and journals nothing of the body, so the older Reach marks its queue acknowledged and stops
      sending it. Revisions 2026-09-29 to 2026-10-02f carried prompts, replies, reasoning, actions and code here.
    errors:
      400 invalid_request: the body is not a JSON object with a session_id string and an entries array
      413 too_large: the body is over 1 MiB
  - id: W-API-MODULES
    method: GET
    path: /api/v1/modules
    auth: install
    since: 2026-09-30b
    response_200:
      mode: "instructor | student_choice"
      count: integer, the number of modules each student carries (2)
      options: "[{id, title}] the modules a student_choice course offers, [] in instructor mode"
      window: "{opens_at, closes_at} W-CONV-3 timestamps or null"
      open: boolean, as in status module_selection.open
      current: the student's current signed module record (W-MOD-1) or null
      history: "[signed module records], oldest first, the current one last"
      full: "[module ids] that reached capacity_per_module, [] when no capacity is set"
  - id: W-API-MODULE-SELECT
    method: POST
    path: /api/v1/modules/selection
    auth: install
    since: 2026-09-30b
    request_headers:
      Idempotency-Key: Required. A UUID Reach generates once per selection and reuses on every retry of it.
    request:
      modules: "[module id] exactly count distinct ids from options"
      consent: W-CONSENT-1 record of the student's yes to the lock-in question
      client_created_at: W-CONV-3 timestamp
    response_200: The new signed module record (W-MOD-1), source student_choice.
    notes: >-
      Teach checks, in order: mode is student_choice (403 forbidden "modules are assigned by your instructor"); the
      window is open (403 forbidden "module choice is closed"); the student has no module record (409 conflict
      "your modules are already locked"); modules are count distinct ids from options (400 invalid_request); none is
      full (409 conflict naming it); consent.kind is module_lock and consent.subject_digest equals the W-CONV-4 digest
      of canonical_json({"modules": sorted modules}) (400 invalid_request). Then it writes the record and the
      student's slice assignments for every assignment in the course (W-MOD-3). A repeat with the same
      Idempotency-Key answers the same record.
    errors:
      400 invalid_request: modules or consent outside the rules above
      403 forbidden: instructor mode, or the window is closed
      409 conflict: already locked, or a chosen module is full
      429 rate_limited: over 10 selections per hour per install
  - id: W-API-TRANSFER
    method: POST
    path: /api/v1/transfers
    auth: install
    since: 2026-09-30b
    request_headers:
      Idempotency-Key: Required, as for submissions.
    request:
      modules: "[module id] the count distinct modules the student says they were moved to"
      note: {type: string, maxBytes: 2000, note: "the student's own words, from the captured prompt, about who approved it"}
      consent: W-CONSENT-1 record of the student's yes to notifying the professor
      client_created_at: W-CONV-3 timestamp
    response_200: {transfer_id: string, state: pending, created_at: W-CONV-3 timestamp}
    notes: >-
      A request changes nothing: the student keeps their current modules until an instructor approves it. One open
      request per student (409 conflict otherwise). consent.kind is transfer_request and consent.subject_digest is
      the W-CONV-4 digest of canonical_json({"modules": sorted modules}). Teach records transfer.requested in the
      audit log and lists the request for instructors. TEACH_TRANSFERS_DISABLE=1 answers 403 forbidden.
    errors:
      400 invalid_request: modules not valid course modules, the same as the current pair, or a bad consent
      403 forbidden: transfers are switched off
      409 conflict: an open request exists
      429 rate_limited: over 5 requests per day per install
  - id: W-API-TRANSFER-STATUS
    method: GET
    path: /api/v1/transfers/:id
    auth: install
    since: 2026-09-30b
    response_200:
      transfer_id: string
      state: "pending | approved | denied | withdrawn"
      modules: "[module id]"
      reply: "{text, decided_by, decided_at} or null"
      module_record: "the new signed module record (W-MOD-1) when approved, else null"
    reach_use: Polled on reach sync, and by the session hook, no more often than every 60 seconds and only while the request is pending (W-SAFE-12).
  - id: W-API-HEALTH
    method: GET
    path: /api/v1/health
    auth: none
    response_200: {status: "ok | degraded", database: boolean, blob_store: boolean}
submissions:
  W-SUB-1:
    name: resubmission
    since: 2026-10-02c
    rule: >-
      A student may submit a slice any number of times until the assignment's due time. Teach numbers every ingested
      submission of a (student, cutout_id, slice, assignment) from 1 in the order it was ingested (attempt), records the
      ingested submission it replaces (supersedes) and marks that one superseded (superseded_by). A rejected submission
      has no attempt, supersedes nothing and is never on record. Every submission keeps its receipts. After the due time
      Teach accepts a submission of a slice only when no submission of that slice is on record, and marks it late; any
      other answers 403 deadline_passed and stores nothing. The submission that counts is the one on record that no
      later one supersedes.
  W-SUB-2:
    name: what Reach does around a submission
    since: 2026-10-02c
    rule: >-
      Reach submits only after the student's yes to Reach's own question, and refuses locally, before asking, when the
      due time has passed and it already holds an ingest receipt for the slice. After an ingest receipt verifies it
      saves a copy of the student's assignment folder on the student's computer. Neither the question, the answer nor
      the copy is sent to Teach.
receipts:
  W-RCPT-1:
    name: body
    fields:
      receipt_id: string
      kind: "ingest | grade | validation"
      submission_id: string
      student_id: string
      cutout_id: string
      slice: string
      assignment: string
      issued_at: W-CONV-3
      signing_key_id: string (new in protocol 1)
      received_at: ingest only
      content_digest: ingest only
      file_list: ingest only
      late: ingest only, boolean
      attempt: "ingest only, integer, since revision 2026-10-02c: the submission's attempt (W-SUB-1); absent from an older Teach"
      scenarios: "grade only, [{name, result: passed|failed|skipped, reason?}]"
      score: grade only, number 0-1
      suite_version: grade only
      fixture_version: grade only
      validated_by: validation only
      note: validation only
      supersedes: optional
      signature: W-CONV-5 base64
  W-RCPT-2:
    name: signature
    rule: W-CONV-6 by the key named in signing_key_id over canonical_json(body without the signature key).
  W-RCPT-3:
    name: what Reach shows
    rule: >-
      Received: slice, cutout_id, received_at in the student's local time as "%a %-d %b %-l:%M %P", receipt_id.
      Graded: passed = the number of scenarios whose result is "passed", total = the number of scenarios.
  W-RCPT-4:
    name: acknowledgment (receipt of a receipt)
    since: 2026-09-30
    fields:
      schema: '"reach.receipt-ack/v1"'
      ack_id: '"rack_" followed by 20 lowercase hexadecimal characters'
      receipt_id: the acknowledged receipt's receipt_id
      receipt_kind: the acknowledged receipt's kind
      submission_id: the acknowledged receipt's submission_id
      student_id: the acknowledged receipt's student_id
      install_id: the install that verified the receipt
      receipt_digest: W-CONV-4 digest of canonical_json(the receipt body as received, signature included)
      receipt_signing_key_id: the acknowledged receipt's signing_key_id
      acknowledged_at: W-CONV-3 timestamp
      reach_version: string
      signature: W-CONV-5 base64 of W-CONV-6 by the install's private key over canonical_json(body without the signature key)
    rule: >-
      Reach writes one acknowledgment for every receipt it verifies and stores, whichever route brought the receipt
      (the submit response, a grade poll, or a sync backfill), and never for a receipt that fails verification. It
      keeps the acknowledgment on disk beside the receipt with a local state of pending, linked (Teach answered 200;
      linked_at recorded), mismatch (Teach answered 409) or refused (Teach answered 400), and sends pending ones
      through W-API-RECEIPT-ACK. A new install acknowledges again with its own install_id. The pair, Teach's signed
      receipt and Reach's signed acknowledgment, proves on both machines that the receipt was issued and that the
      student's install received the same bytes.
debug:
  W-DBG-EVENT:
    shape: >-
      {id: 32 hex, at: W-CONV-3 timestamp, seq: integer per session, kind: one of W-DBG-KINDS, persona_id: "8 hex or
      null", fields: object of at most 64 keys whose values are strings (at most 1024 bytes), numbers, booleans, null
      or arrays of at most 32 such scalars}
  W-DBG-KINDS:
    - session (reach and ruby version, platform, harness and its version, surface, runtime kit, install id, course id, persona id and kind, wire digest match)
    - hook (event, decision allow|block|context, message or rule id, space slice|root|extracurricular|outside, latency_ms)
    - gate (check name, outcome, message id)
    - command (reach command and flag names, exit, duration_ms, error class)
    - request (route id, method, status, error, request_id, attempt, latency_ms, bytes_out, bytes_in)
    - lock (enrollment lock state, reason, stamp verify result, fingerprint match)
    - sync (package kinds and versions, digests verified, files kept, duration_ms)
    - check (finding counts by rule id, files checked)
    - qualify (scenario counts passed, failed, pending; attempt; ladder step; local or teach)
    - submit (outcome, receipt id, late)
    - transcript (entries queued, sent, failed; not emitted since 2026-10-03b, still accepted)
    - brain (captures, recalls, refusals)
    - update (phase, outcome, versions)
    - error (exception class, message id or a scrubbed message, the first 12 backtrace frames relative to the plugin root)
    - fault (where it happened, exception class, errno name, message id, the first 12 backtrace frames relative to the plugin root, what the person was shown; since 2026-10-02b, W-DBG-FAULT)
    - link (the Teach connection changed: state lost|back, the failure that caused it, outage_s on back; since 2026-10-02b, W-DBG-FAULT)
    - storage (since 2026-10-02d, W-DBG-KINDS-2: corpus_mb, brain_mb, total_mb, tier, outcome measured|warned|demanded|compact_started|compacted|compact_failed, before_mb and after_mb on compacted)
    - import (since 2026-10-02d, W-DBG-KINDS-2: vendor, mode brain|copy, outcome started|progress|finished|failed|cancelled, conversations, done, bytes, findings_queued)
  W-DBG-KINDS-2:
    rule: >-
      Since revision 2026-10-02d. Reach records storage and import events under those kinds only when the
      wire_contract_sha256 Teach last advertised equals the digest of its own specs/wire.yml; otherwise it records them
      under kind brain with fields.event set to storage.<outcome> or import.<outcome>, so a Teach older than this
      revision, which answers 400 to an unknown kind, never sees one. Neither kind carries a path, a file or
      conversation name, a title or any text.
  W-DBG-SCRUB:
    rule: >-
      An event never carries prompt, reply, reasoning or file text, an instructor code, a course or enrollment code, a
      password, a private or public key, a token, a signature or a student's typed identity; Reach drops any field whose
      name contains code, password, secret, token, key, signature, pem or passphrase (a substring match, so field
      names are chosen to avoid them: exit, not exit_code; error, not error_code), and replaces any RINS1 code, PEM
      block or course-code-shaped value inside a string with [scrubbed], before the event is spooled or shown.
  W-DBG-FAULT:
    rule: >-
      Since revision 2026-10-02b. Reach never shows a person a raw error, a backtrace or a hook failure from talking to
      Teach or from its own code; it shows a plain message instead (STD-TEACH-LINK). Every error it hides that way is
      recorded as a fault event, and every change in the Teach connection as a link event, whether or not debug mode
      is on. While debug mode is on they travel with the debug spool under its reason; while it is off Reach spools
      only fault and link events and sends them with reason fault. A fault event carries no error message text unless
      debug mode is on (then a separate error event carries the scrubbed message as before), so a fault from a real
      student never holds file or prompt text. Reach records at most 60 fault events an hour and counts the rest in
      the next fault's dropped_faults.
  W-DBG-RENDER:
    rule: >-
      While debug mode is on, Reach shows the person a debug block at the end of each turn, and reach debug show prints
      the latest events on demand. On a text-terminal surface (tui: the Claude Code and Codex terminal apps, Hermes) the
      block is a plain ASCII table at most 100 columns wide; on a surface that renders Markdown (gui: the Claude desktop
      app, Claude Code in an IDE, the Codex app) it is a Markdown table. Reach decides from the harness's own
      environment and hook payload and falls back to tui; config.yml debug.render (auto, ascii, markdown) overrides it.
errors:
  W-ERR-1:
    shape: '{"error": {"code": <code>, "message": <text>}, "request_id": <hex>}'
  W-ERR-2:
    codes:
      invalid_request: {status: 400, reach: "never retried; shown as the reason"}
      unauthenticated: {status: 401, reach: "never retried; M-AUTH-FAILED (clock or key)"}
      forbidden: {status: 403, reach: "never retried"}
      not_enrolled: {status: 403, reach: "never retried; the install is marked revoked; M-GATE-REVOKED"}
      revoked: {status: 403, reach: "never retried; the install is marked revoked; M-GATE-REVOKED"}
      not_released: {status: 403, reach: never retried}
      deadline_passed: {status: 403, reach: never retried}
      not_found: {status: 404, reach: "never retried"}
      conflict: {status: 409, reach: never retried}
      too_large: {status: 413, reach: never retried}
      rate_limited: {status: 429, reach: "retried after Retry-After seconds, within the retry budget"}
      internal: {status: 500, reach: retried}
      reach_outdated: {status: 400, reach: "never retried; the message names the Reach version and the minimum and is shown as the reason (since revision 2026-09-29c, at enrollment)"}
      unavailable: {status: 503, reach: "retried after Retry-After seconds, within the retry budget; since revision 2026-09-29d, sent when an operator has switched a feature off"}
      course_code_unknown: {status: 400, reach: "never retried; M-ENR-CODE-UNKNOWN, or M-ENR-CODE-SUGGEST when details.did_you_mean is present (since 2026-10-01b), or M-ENR-CODE-COURSE-ONLY when details.course_only is present (since 2026-10-01d)"}
      course_code_expired: {status: 400, reach: "never retried; M-ENR-CODE-EXPIRED (since 2026-10-01b)"}
      enrollment_refused: {status: 403, reach: "never retried; M-ENR-REFUSED; counts toward the local enrollment lockout (since 2026-10-01b)"}
      fingerprint_mismatch: {status: 403, reach: "never retried; Reach drops its stamp and locks into the enrollment flow with M-ENR-MOVED (since 2026-10-01b)"}
      instructor_code_refused: {status: 403, reach: "never retried; M-PERSONA-CODE-REFUSED; details {reason} (since 2026-10-02a)"}
      course_required: {status: 409, reach: "never retried; M-PERSONA-COURSE-NEEDED naming details.courses (since 2026-10-02a)"}
      student_not_found: {status: 404, reach: "never retried; M-PERSONA-NO-STUDENT (since 2026-10-02a)"}
      device_move_pending: {status: 409, reach: "never retried automatically; M-ENR-MOVE-PENDING, the student's yes re-posts the same request; details {move_id} (since 2026-10-01c)"}
      device_move_denied: {status: 403, reach: "never retried; M-ENR-MOVE-DENIED with details.reason (since 2026-10-01c)"}
      extra_credit_unknown: {status: 400, reach: "never retried; M-XC-UNKNOWN; the entry stays in the profile as refused (since 2026-10-02f)"}
      extra_credit_expired: {status: 400, reach: "never retried; M-XC-EXPIRED; the entry stays in the profile as refused (since 2026-10-02f)"}
      extra_credit_used: {status: 409, reach: "never retried; M-XC-USED; the entry stays in the profile as refused (since 2026-10-02f)"}
    rule: Reach branches on error.code, never on the HTTP status alone, because five codes share 403.
compatibility:
  W-COMPAT-1:
    rule: >-
      Teach reports minimum_reach_version (default "0.2.0"). A Reach older than that blocks course work with
      M-REACH-OUTDATED and keeps working for enrollment, sync and status.
  W-COMPAT-2:
    rule: >-
      Teach reports wire_contract_sha256, the W-CONV-4 digest of the bytes of its specs/wire.yml. Reach computes the same
      digest of its own specs/wire.yml; reach doctor reports R-DOC-WIRE when they differ.
  W-COMPAT-3:
    rule: Protocol 1 does not interoperate with Reach 0.1.0 or Teach 0.1.0.
  W-COMPAT-4:
    rule: >-
      Since revision 2026-09-30b Teach's default minimum_reach_version is 0.12.0, so a Reach without the login,
      the student's part and the read gate cannot keep doing course work against a Teach of that revision.
  W-COMPAT-5:
    rule: >-
      Since revision 2026-10-01b. A Reach of this revision enrolls with shape v2 from the enrollment flow and from
      reach enroll --course-code, and with shape v1 only from reach enroll <code>. An install enrolled with shape v1
      carries no stamp; it keeps working unless the course policy sets enrollment.require_stamp, in which case Reach
      locks into the enrollment flow until the student enrolls with shape v2.
reach_client_safety:
  W-SAFE-1: {name: timeouts, rule: "connect 5 s, read 30 s, upload read 120 s; quick mode (hooks) connect 2 s, read 2 s, no retries"}
  W-SAFE-2: {name: rate limit, rule: "a token bucket of 20 requests per minute shared by every Reach process on the machine through ~/.reach/state/bucket.json under an exclusive file lock; Teach allows 30"}
  W-SAFE-3: {name: retries, rule: "at most 4 retries, exponential backoff with full jitter (1 s base, 30 s cap), Retry-After honoured up to 60 s; only codes W-ERR-2 marks retried, plus connection failures and timeouts; a fresh nonce and timestamp on every attempt"}
  W-SAFE-4: {name: circuit breaker, rule: "five consecutive failures open the breaker for 60 s; while open, calls raise Reach::Offline at once"}
  W-SAFE-5: {name: kill switch, rule: "REACH_OFFLINE=1 stops every network call"}
  W-SAFE-6: {name: polling, rule: "grade receipts no more often than every 30 s and hand replies no more often than every 60 s, only while one is outstanding"}
  W-SAFE-7: {name: logging, rule: "every request is logged to ~/.reach/logs/requests.jsonl with method, route, status, latency and retry count; never bodies, headers or keys"}
  W-SAFE-8: {name: integrity events, rule: "sent in quick mode with no retries and queued in the outbox when they fail; each distinct (kind, path, detail) is sent at most once per install"}
  W-SAFE-10: {name: qualifications, rule: "since 2026-09-29d: one POST per reach qualify that reaches the remote step, then GET /api/v1/qualifications/:id no more often than every 10 s and at most 36 times; still pending after that leaves the record pending_remote and a later reach qualify with unchanged files resumes polling the same id"}
  W-SAFE-11: {name: receipt acknowledgments, rule: "since 2026-09-30: no polling; one POST in normal mode right after a receipt is stored by reach submit or a grade poll, and reach sync sends at most 20 pending acknowledgments and reads at most 5 pages of W-API-RECEIPTS; a network failure, 403 or 404 keeps the acknowledgment pending"}
  W-SAFE-12: {name: modules and transfers, rule: "since 2026-09-30b: GET /api/v1/modules at most once per reach sync or reach modules call; GET /api/v1/transfers/:id no more often than every 60 s and only while a request is pending; the prompt and session hooks make no network call for login, consent or imports and queue login_failed, identity_denied and outside_access events in the outbox for the next sync or turn-end flush"}
  W-SAFE-13: {name: enrollment, rule: "since 2026-10-01b: only the enrollment prompt hook and reach enroll call W-API-ENROLL-PREVIEW and W-API-ENROLL, never in quick mode: connect 5 s, read 10 s, no retries, at most one preview per typed code and one enroll per yes; the local lockout (W-ENR-7) stops calls entirely while it lasts; X-Reach-Fingerprint is sent only on GET /api/v1/status"}
  W-SAFE-9: {name: transcripts, rule: "retired 2026-10-03b (W-TRN-0)"}
transcripts:
  W-TRN-0:
    name: no capture
    rule: >-
      Since revision 2026-10-03b Reach captures no conversation, ever: no prompt, reply, reasoning, action or code
      entry is written to disk or sent, in any folder or harness, and Teach keeps no transcript and no subcorpus. The
      prompt hook still reads each prompt as it arrives for the gate, the login, the crisis check (W-SUP-3), consent
      (W-CONSENT-1), the pending own-part answer (W-PART-2) and the local microbrain, which ingests every
      gate-allowed prompt, in any folder, as a private source kept only on the student's computer and never sent; it
      keeps nothing else of it. A Reach of this revision
      deletes ~/.reach/transcripts, and every persona's, the first time it runs.
  W-TRN-1: {name: capture, retired: 2026-10-03b}
  W-TRN-2: {name: delivery, retired: 2026-10-03b}
  W-TRN-3: {name: AI output, retired: 2026-10-03b}
  W-TRN-4: {name: code, retired: 2026-10-03b}
  W-TRN-5: {name: subcorpus, retired: 2026-10-03b}
qualification:
  W-QUAL-1:
    name: what a qualification proves
    since: 2026-09-29d
    rule: >-
      Before a slice is submitted, the agent proves it with scenarios of its own: at least one scenario, tagged with
      the marker's qualify.tag, for every graded scenario name in the marker's scenarios (same name, exact text), plus
      any edge cases it chooses, under the workspace's qualify/features, with step files under qualify/step_definitions.
      They must pass on the slice, fail on the starting copies, and the instructors' graded scenarios must pass on
      Teach. The agent never reads the graded scenarios' steps; it has their names, the slice API and the qualify kit.
  W-QUAL-2:
    name: local steps (Reach)
    rule: >-
      reach qualify runs, in order, stopping at the first that fails: check (reach check reports nothing on the owned
      files), coverage (every graded name appears as a scenario name under qualify/features on a scenario carrying
      qualify.tag; a missing name is QF-UNCOVERED), and when qualify.local is true local_pass and local_stub. The local
      run directory holds qualify/kit/** at the same paths, the owned files over it, qualify/features/** under
      features/agent/ and qualify/step_definitions/** under features/step_definitions/; the command is bundle exec
      cucumber --format json --tags <qualify.tag> from its root, with gems as W-RUN-1. local_pass needs every scenario
      to pass (QF-LOCAL-FAIL names each that did not); local_stub runs again with the starting copies of the owned
      files (the workspace package's entries) in their place and needs every covered scenario to fail (QF-VACUOUS names
      each that passed).
  W-QUAL-3:
    name: Teach's runs
    rule: >-
      Teach runs three passes in its grading sandbox for one qualification, on its grading image for Ruby 4.0 only.
      agent: the course build the grading run uses (the module's library, fixtures and application for a backend
      slice; the module's reference build for a panel slice), the course repository's features/support/**, the
      agent's features under features/agent/ and its step files under features/step_definitions/, the owned files laid
      over; bundle exec cucumber --format json --tags <qualify.tag>. stub: the same with the course repository's
      stubs/<owned path> laid over instead (a path with no stub is removed). hidden: the graded run of W-RUN-1 exactly
      as grading runs it, including the panel shape check that fails every row with reason shape_violation. The run
      directory of the agent and stub passes never holds the course's feature files or module step files.
  W-QUAL-4:
    name: verdict
    rule: >-
      A qualification passes when every step of W-QUAL-2 passed, every agent row passed, every stub row whose name is a
      graded name failed (QF-VACUOUS otherwise), and every hidden row passed (QF-HIDDEN, shown with the scenario name
      and the plain reason only). An agent row that did not pass is QF-REMOTE-FAIL. A qualification whose remote step
      could not run (REACH_OFFLINE=1, Teach unreachable, 503, or still pending after W-SAFE-10) is pending_remote: not
      passed and not a failed attempt.
  W-QUAL-5:
    name: record
    rule: >-
      Reach writes {slice, attempt, at, files_digest, tests_digest, steps: {id: {ran, passed, rows}}, passed, pending,
      qualification_id} to .reach/qualification.json in the workspace, to the course record (kind qualification) and
      as a qualify ledger record. files_digest is the W-CONV-4 digest of canonical_json of {owned path: digest or null};
      tests_digest the same over the qualify/ paths sent. reach submit refuses unless the latest record passed and both
      digests equal the workspace's current ones (M-SUBMIT-UNQUALIFIED), and sends that record as
      evidence/qualification.json.
  W-QUAL-6:
    name: attempt ladder
    rule: >-
      Per slice, Reach counts failed qualifications since the last pass or the last instructor reply to the slice's
      open agent hand. 1: silent. 2: M-LADDER-NOTICE, which the agent tells the student before trying again. 3: Reach
      raises a W-PKG-6-v2 hand with originator agent and trigger attempt_ladder and shows M-LADDER-HAND; from then on
      reach qualify and writes to the owned files and qualify/ are refused with M-LADDER-ASK until reach attempts
      continue records the student's yes, which it accepts only when the student sent a prompt in the slice after the
      hand was raised (since 2026-10-03b Reach keeps only the time of the student's latest prompt per slice, never
      its text). 4 to 9: M-LADDER-CONTINUE before each try. 10: M-LADDER-STOPPED;
      reach qualify and those writes are refused until an instructor replies to the hand. A pass or an instructor's
      reply seen by reach sync or the hand poll resets the count to zero.
seal:
  W-SEAL-1:
    name: marks in files
    rule: >-
      Reach keeps a carrier line in every owned .rb and .svelte file: for Ruby, line 1 "# frozen_string_literal: true"
      and line 2 "# reach <cutout_id> <slice> " followed by the payload; for Svelte, line 1 "<!-- reach <cutout_id>
      <slice> " + payload + " -->". The payload is U+2060, then the mark's 64 bits most significant first as U+200B (0)
      or U+200C (1), then U+2060. Reach rewrites a file only when the carrier is absent or its payload is not the
      expected mark, never when it decodes to a different valid mark (a foreign mark is kept as evidence).
  W-SEAL-2:
    name: witness ledger
    rule: >-
      One JSON record per line per slice: {n, at, kind, ...fields, gv, prev, tag}. gv is the guardrails version whose
      ledger_key signed the record (null with a local key). prev is the previous record's tag ("" for n = 1). tag is
      HMAC-SHA256(ledger_key, canonical_json(record without tag)) as 64 hex characters. Kinds: session {harness},
      prompt {session, seq, digest} (the transcript entry it witnesses, W-TRN-1; since 2026-09-29, and fieldless
      before and again since 2026-10-03b), write {path, before, after}, shell {command_digest, head}, check {changed, findings}, shape {findings},
      tips {passed, total, timed_out} (before 2026-09-29d), directive {opcode, tier}, plan {action}, checkpoint {n,
      note_digest, automatic}, restore {n}, mark_restored {path}, integrity {kind, path}, submit {manifest_digest},
      and since 2026-09-29d qualify {attempt, passed, pending, files_digest, tests_digest, qualification_id} and
      ladder {failed, action} where action is notice, hand, consent, stopped or reset.
  W-SEAL-3:
    name: vault manifest
    rule: >-
      At unpack Reach writes .manifest.json {entry: digest} beside the guardrails entries and recomputes it on every load;
      a mismatch is reported as integrity kind vault_tampered with the entry names and changes nothing the student sees;
      reach sync re-unpacks the signed package whenever the manifest disagrees.
  W-SEAL-4:
    name: Teach provenance verdict
    rule: >-
      For each submitted file: own when its payload decodes to the mark Teach computes for this install, foreign:<install>
      when it decodes to another install's mark for the same path, missing, corrupt, or unmarked for a kind Reach never
      stamps; witnessed when the submitted digest equals the last write.after for the path in the verified ledger tail.
      The ledger tail is verified record by record with the key derived from each record's gv; broken:<n> names the
      first record whose tag or prev fails; unverifiable when the manifest says ledger_key local; absent when no tail was
      sent. rules_current is whether seal.guardrails_version equals the latest guardrails package for the student. The
      summary is clean when every file is own and witnessed, the ledger is verified and the rules are current;
      otherwise review with the reasons listed.
alignment:
  summary: >-
    Since protocol 1 revision 2026-09-30b. The rules that keep a student, their course and their instructors aligned:
    the course policy Teach ships, the student's login at the start of every session, the student's consent to
    anything that commits them, the signed record of which modules they carry, the student's own part of each
    assignment, the sandbox around the workspace, the time gate, and the support message.
  W-POL-1:
    name: course policy
    rule: >-
      Teach writes the policy into the guardrails package's course.yml (W-PKG-1) under these keys, from its course
      policy file (TEACH_COURSE_POLICY, default <TEACH_HOME>/course_policy.yml) merged over teach.spec.yml
      course_model defaults. Reach reads it from the verified guardrails package only.
    keys:
      login: "{required: boolean (default true), max_hours: integer (12), lockout_failures: integer (3), lockout_minutes: integer (15)}"
      enrollment: >-
        since 2026-10-01b: {require_stamp: boolean (default false), fingerprint_match: binding | strict (default
        binding)}; since 2026-10-01c also device_moves: approve | auto (default approve; default auto since
        2026-10-02e) and identity: {institution_name, username_domain, username_pattern, student_id_pattern}, which
        W-API-ENROLL-PREVIEW serves.
      limits: "{corpus_max_bytes (52428800), transcript_spool_max_bytes (209715200), materials_max_bytes (209715200), import_max_bytes (20971520), import_max_per_prompt (5)}; transcript_spool_max_bytes is ignored since 2026-10-03b"
      support: "{text: string, the course's own support line appended to W-SUP-1}"
      student_part: "{required: boolean (default true), questions: {<assignment id>: [{id, question, min_words}]}}"
      module_selection: "{mode: instructor | student_choice, count (2), options: [{id, title}], opens_at, closes_at, capacity_per_module (null), slices: [slice kinds each chosen module gets, default [backend, panel]]}"
  W-CONSENT-1:
    name: consent record
    rule: >-
      A student's explicit yes, captured by Reach's prompt hook, never by the agent. A Reach command that commits the
      student (module lock, transfer request) first writes a pending question {kind, subject, subject_digest,
      message_id, asked_at} to ~/.reach/state/consent/pending.json and prints the exact question for the agent to
      relay. The prompt hook reads the next student prompt in any course space within 30 minutes: a yes-word prompt
      (W-ID-4) answers yes, a no-word prompt answers no, anything else leaves the question pending. The answered
      record is {kind, subject_digest, message_id, answer: yes | no, session_id, seq, digest (the W-TRN-1 digest of
      the student's prompt), asked_at, answered_at}; since 2026-10-03b seq is null and digest is the W-CONV-4 digest
      of the prompt, read as it arrives and not kept. Commands accept only a yes whose subject_digest matches their
      own subject and whose answered_at is at most 30 minutes old, and use it once.
    kinds: [module_lock, transfer_request]
  W-ID-1:
    name: login
    rule: >-
      When the policy's login.required is true, every harness session in every course space (slice, extracurricular
      and root) starts logged out. Reach's prompt hook runs a state machine per harness session, stored at
      ~/.reach/state/login/<session_id>.json: logged_out -> (the hook blocks the prompt with M-LOGIN-ASK) ->
      awaiting_id -> (a prompt whose trimmed text contains the enrolled student id as a whole token, compared
      case-insensitively, moves to awaiting_confirm and the hook blocks with M-LOGIN-CONFIRM naming the student's
      display_name) -> (a yes-word prompt: confirmed, blocked with M-LOGIN-OK; a no-word prompt: denied, blocked with
      M-LOGIN-DENIED; anything else: blocked with M-LOGIN-CONFIRM again). A prompt without the id in awaiting_id is a
      failure (M-LOGIN-WRONG); lockout_failures failures within lockout_minutes lock the session out for
      lockout_minutes (M-LOGIN-LOCKED). A denied session stays denied. Every login step prompt is blocked, so the
      agent never sees the id or the answer; before 2026-10-03b each was still captured to the transcript with gate
      blocked and note "login", and since then none is captured (W-TRN-0). Confirmed lasts until the harness session ends or max_hours pass. While a session is not confirmed the
      write, shell and read gates refuse everything with M-LOGIN-ASK, and the agent context from reach hello names no
      student.
    harnesses: >-
      Claude Code and Codex block prompts, so the login is enforced. Hermes cannot block a prompt; its hook injects
      the login message as context and the gates still refuse tool calls until confirmed, but the agent sees what the
      student typed. Antigravity has no hooks and no login.
  W-ID-2:
    name: identity tags
    rule: >-
      Every record Reach writes on the student's computer (ledger records, transcript entries before 2026-10-03b, corpus records,
      receipt acknowledgments, consent records, part answers, module records, import records) carries student_id,
      the enrolled student's id. Reach commands that commit the student (submit, qualify, modules choose, transfer
      request, part record) refuse with M-LOGIN-ASK unless some session confirmed a login within max_hours and no
      session was denied since.
  W-ID-3:
    name: identity events
    rule: >-
      A lockout queues integrity kind login_failed (detail {session_id, failures, harness}); a denial queues
      identity_denied (detail {session_id, harness}). Both are queued in the outbox by the hook (W-SAFE-12) and sent
      at the next flush; each at most once per session.
  W-ID-4:
    name: yes and no words
    rule: >-
      After lowercasing, trimming and dropping trailing punctuation, a prompt is a yes when it is one of: yes, y,
      yep, yeah, yes it is, that's me, thats me, it's me, its me, correct, confirm, confirmed, sure, ok, okay; and a
      no when it is one of: no, n, nope, not me, that's not me, thats not me, wrong. Anything else is neither.
  W-MOD-1:
    name: signed module record
    fields:
      schema: '"teach.module-assignment/v1"'
      record_id: '"mod_" followed by 20 lowercase hexadecimal characters'
      student_id: string
      course_id: string
      modules: "[module id], sorted, count long"
      source: "instructor | student_choice | transfer"
      version: integer, 1 for the first record of the student, then +1
      supersedes: "the previous record_id or null"
      reason: "string or null, the instructor's reason for an instructor record after the first"
      consent_digest: "the W-CONSENT-1 digest of the student's yes for student_choice, else null"
      transfer_id: "the approved transfer for source transfer, else null"
      issued_at: W-CONV-3 timestamp
      signing_key_id: string
      signature: W-CONV-5 base64 of W-CONV-6 by the key named in signing_key_id over canonical_json(body without signature)
    rule: >-
      The newest record is the student's current pair. Records are never edited or deleted; a change is a new record
      that supersedes the old one.
  W-MOD-2:
    name: Reach's use of the record
    rule: >-
      Reach verifies the record's signature as a receipt's (W-RCPT-2), stores the current one at
      ~/.reach/state/modules/current.json and every one it has seen under ~/.reach/state/modules/history/, and
      refuses writes (M-GATE-NOT-YOUR-MODULE) in a slice whose cutout's module (the cutout id before its first dot)
      is not in the current record. Before sending a student_choice selection Reach seals it locally as
      ~/.reach/state/modules/pending.json, signed with the install key, and deletes it only after a signed record
      for the same modules is stored.
  W-MOD-3:
    name: slice assignments follow the record
    rule: >-
      On a student_choice record Teach assigns, for every assignment in the course and every chosen module, each
      slice kind in module_selection.slices for the cutout <module>.<slot> of each of the assignment's cutout slots
      that exists in the course spec. On a later record (instructor reassignment or approved transfer) Teach replaces
      the student's slice assignments of every assignment that is not yet released, and, only when the instructor
      says include_current, of the current released assignment, mapping each removed cutout <old>.<slot> to
      <new>.<slot> with the same slice kind, old and new paired in sorted order. Released past assignments, their
      submissions, receipts and grades are never changed. Reach keeps the old slice workspaces read-only.
  W-MOD-5:
    name: prompts before a choice
    rule: >-
      Reach's prompt gate normally refuses course prompts until the student has a slice workspace. While the course
      policy's module_selection.mode is student_choice and the student has no module record, it lets prompts through
      so the student can sign in and answer the lock-in question; writes stay refused because there is no workspace.
  W-MOD-4:
    name: transfers
    rule: >-
      A transfer request is only ever raised by the student's yes (W-CONSENT-1, kind transfer_request) and changes
      nothing until an instructor approves it. Approval issues a new record, source transfer, which W-MOD-3 applies;
      denial closes the request with the instructor's reply. Reach shows the reply to the student in plain words.
  W-PART-1:
    name: the student's own part
    rule: >-
      The questions for an assignment are the policy's student_part.questions[<assignment id>]: things only the
      student can answer (their professional use case, their users, their baseline, the human decision, what they
      decided and why). Each has an id (for example A1-Q1), the question text and min_words.
  W-PART-2:
    name: recording an answer
    rule: >-
      Since 2026-10-03b Reach's prompt hook keeps, per slice, only the student's latest gate-allowed prompt in that
      slice that has at least the smallest min_words of the assignment's questions and is not a consent yes or no, in
      ~/.reach/state/part/pending-<cutout_id>-<slice>.json (0600) as {text, words, digest, at, student_id}, replacing
      the one before. reach part record <question id> takes it when it is at most 30 minutes old and has at least
      that question's min_words words, stores it verbatim as the answer at ~/.reach/state/part/<assignment>.json with
      {question_id, text, words, digest, recorded_at, student_id}, and deletes the pending file. Before 2026-10-03b it
      read the latest captured prompt (W-TRN-1) and stored its session_id and seq too. The agent never supplies the
      text. A new record for the same question replaces the old one. reach submit refuses with M-SUBMIT-NO-PART until
      every question of the slice's assignment has an answer, then adds part.json (W-PKG-5).
  W-PART-3:
    name: Teach's check of the part
    retired: 2026-10-03b
    rule: >-
      Retired with the transcripts (W-TRN-0). Teach stores part.json with the submission and shows the answers to
      instructors; it no longer compares them with a transcript, and part_verified and part_suspect are gone.
  W-SBX-1:
    name: read gate
    rule: >-
      In every course space Reach refuses (M-GATE-OUTSIDE) any tool call that reads, lists or searches a path
      outside the student's workspace root, and any shell command with a path argument that resolves outside it,
      except the Reach shim itself and /dev/null. In slices and the root it also refuses web fetch and web search
      tools (M-GATE-NOWEB). Claude Code: PreToolUse Read|Glob|Grep|NotebookRead|LS|WebFetch|WebSearch runs
      reach gate read. Codex and Hermes: their read-like tools run the same gate; their shell goes through reach
      gate shell, which applies the same outside-path test to every argument.
  W-SBX-2:
    name: imports
    rule: >-
      When the student's prompt contains absolute paths (as a drag-and-drop pastes them, quoted or with escaped
      spaces) to existing regular files outside the workspace, the prompt hook copies each, at most
      import_max_per_prompt, into <current space>/materials/ when it is at most import_max_bytes, its extension is
      one of txt md csv tsv json yml yaml pdf png jpg jpeg gif webp xlsx docx pptx, and materials/ stays under
      materials_max_bytes; the copy gets a unique name, mode 0600, and an import record {source_name, name, bytes,
      digest, at, student_id} in ~/.reach/state/imports.jsonl and the slice ledger. The hook tells the agent, as
      context, "The file the student dropped is now materials/<name>" or why it was not copied. The agent never
      reads the original path. materials/ is never submitted and is skipped by the course-record scan (W-TRN).
  W-SBX-3:
    name: outside access events
    rule: The third refused outside read in one harness session queues integrity kind outside_access (detail {session_id, tool, count}), once per session.
  W-PACE-1:
    name: time gate
    rule: >-
      Reach refuses writes (M-GATE-NOT-CURRENT) in a slice whose assignment is not status.current_assignment, or
      whose due time has passed by Teach's clock (server_time from the last status plus the time elapsed locally
      since it was fetched). Reads stay allowed. extracurricular/ is outside the time gate. Since revision 2026-10-02e
      (W-PACE-2) a past-due slice is writable, as late work.
  W-PACE-2:
    name: late work
    rule: >-
      Since revision 2026-10-02e. A slice whose own due time (its workspace package's due) has passed by Teach's clock
      stays writable while Reach's late_work.allow is true (default); an assignment whose due time has not come and
      that is not status.current_assignment stays refused. Reach tells the student the work is late at session start,
      on the first prompt of each session in that slice and every late_work.notice_every (10) prompts after, and in
      the submit ask, and says when the slice cannot be submitted again (W-SUB-1). It raises one hand with trigger
      late_work per assignment on the first late write, and one with trigger late_submission per assignment when an
      ingest receipt with late true verifies, each from a detached process, never inside a hook.
  W-HAND-TYPES:
    name: hand types
    rule: >-
      Since revision 2026-10-02e. trigger classifies a hand: attempt_gate, attempt_ladder, check_gate and wellbeing are
      raised by Reach itself; late_work and late_submission by the late-work rule (W-PACE-2); student_request,
      concept_question, assignment_question, deadline_question, grade_question, submission_question, technical_issue,
      setup_issue, access_issue (accounts, Blackboard and other course systems), extension_request, feedback,
      integrity_question and other are chosen by the agent for a hand the student asks for, student_request when none
      fits better. Reach sends the newer types only when the wire_contract_sha256 Teach last advertised equals the
      digest of its own specs/wire.yml; otherwise it sends student_request and prefixes the summary with
      [<type>], so an older Teach, which answers 400 to an unknown trigger, never sees one.
  W-SUP-1:
    name: support message
    rule: >-
      reach support prints M-SUPPORT, fixed text beginning "If this is an emergency, call 911 now." then the 988
      line, then the policy's support.text, then whether the instructors were told. The agent relays it verbatim and
      does not counsel.
  W-SUP-2:
    name: wellbeing hand
    rule: >-
      reach support raises a hand with trigger wellbeing, originator agent, cutout_id and slice of the current slice
      or null, summary "The student may need support.", and bundle reach.hand.wellbeing/v1 {schema, student_id,
      raised_at, harness, space}; no code, no transcript text, no profile. It is queued in the outbox when offline
      and raised at most once per 60 minutes per install.
  W-SUP-3:
    name: crisis safety net
    rule: >-
      Before any login step, Reach's prompt hook checks every student prompt in every course space against a fixed
      list of crisis phrases (lowercased, punctuation dropped, whole-phrase match): kill myself, killing myself, end
      my life, ending my life, want to die, wanna die, suicide, suicidal, hurt myself, hurting myself, harm myself,
      self harm, self-harm, cut myself, cutting myself, no reason to live, better off dead, hurt someone, kill
      someone, overdose. On a match in a session that is not confirmed, the hook blocks the prompt with M-SUPPORT
      (W-SUP-1) instead of any login message and queues the wellbeing hand (W-SUP-2) in the outbox; in a confirmed
      session it lets the prompt through and adds the context "The student may be in crisis: run reach support now and
      relay it word for word." A match never locks out, never counts as a login failure, and, since 2026-10-03b, is
      captured nowhere (W-TRN-0). Right after queuing the hand the hook starts a detached `reach support --flush`,
      which sends only queued wellbeing hands, in quick mode (W-SAFE-1), so the instructors hear within seconds
      without the hook waiting on the network.
enrollment:
  W-ENR-1:
    name: course code
    rule: >-
      Since revision 2026-10-01b. Teach mints one class-wide course code per course; a code names exactly one course
      and no course has two live codes at once. The code is the course id (W-ENR-2) followed by a secret of eight
      Crockford base32 characters (0-9 and A-Z without I, L, O, U), displayed as <course id>-XXXX-XXXX, for example
      MGMT327-K7QX-94TD. It expires at the end of the course's last day (courses.ends_on in the course timezone), or,
      since revision 2026-10-01c, at an earlier expiry the instructor sets when minting it (for a handout that should
      stop working after the first week); a course with no ends_on cannot mint a code. An expired code answers
      course_code_expired with details.reason course_ended or code_expired. Normalization, applied by Reach before sending and again by Teach:
      uppercase; drop every character that is not A-Z or 0-9; the last eight characters are the secret, the rest is
      the course id; in the secret only, O becomes 0 and I and L become 1. The normalized form is <course id>-<secret>
      with one hyphen. A value with fewer than nine characters after dropping, or a course id part longer than
      sixteen, is not a code. The secret is unique across Teach and is what Teach looks a code up by; the course id
      part is a human check. Teach accepts a code whose course id part is within Damerau-Levenshtein distance 2 of the
      secret's course id, and refuses one further away with course_code_unknown. When no code matches and the course
      id part alone is within distance 2 of exactly one live course id, Teach puts that id in details.did_you_mean. Since
      revision 2026-10-01d, when no code matches and the whole value with every hyphen dropped equals the id of a
      course with a live code, Teach puts that id in details.course_only instead: a course id of nine or more
      characters typed alone has the shape of a code.
  W-ENR-2:
    name: course id
    rule: >-
      A course id is 1 to 16 characters A-Z and 0-9, for example MGMT327. Wherever a course id is typed or stored it
      is normalized by uppercasing and dropping every other character, so mgmt-327, "mgmt 327" and Mgmt_327 are all
      MGMT327. Teach refuses to create a course whose normalized id collides with another course's.
  W-ENR-3:
    name: institutional identity
    rule: >-
      The student is identified by two values that must name the same roster entry of the code's course. username is
      the institutional email: Reach lowercases and trims it, and appends @<username_domain> when the student typed no
      @; its local part must match username_pattern and its domain must equal username_domain. student_id is the
      institutional id: Reach drops spaces and hyphens and it must match student_id_pattern. The rules come from
      W-API-ENROLL-PREVIEW and fall back to Reach's config enrollment block. For La Sierra University the rules are
      institution_name "La Sierra", username_domain lasierra.edu, username_pattern ^[a-z]{4}[0-9]{3}$ (first letter of
      the first name, first three of the last name, three digits) and student_id_pattern ^[0-9]{7}$. The roster's
      student_id becomes the install's student_id.
  W-ENR-4:
    name: fingerprint
    rule: >-
      A document {schema: "reach.fingerprint/v1", salt, binding, descriptive, digest, strict_digest} describing the
      computer, the computer account and the harness the student enrolled from. salt is 32 lowercase hexadecimal
      characters, generated once per enrollment. Every component value is sent as the lowercase hexadecimal SHA-256
      of "reach.fingerprint/v1" NUL salt NUL name NUL value, never in the clear, except where marked plain. binding
      components: machine_id (Linux /etc/machine-id, else /var/lib/dbus/machine-id; macOS IOPlatformUUID from
      ioreg -rd1 -c IOPlatformExpertDevice; Windows MachineGuid under HKLM\SOFTWARE\Microsoft\Cryptography; the
      literal "unknown" when none can be read), os_user (the login name, plus ":" and the uid on POSIX), platform
      (plain, W-API-ENROLL's value) and install_key (the SHA-256 of the install public key's DER). descriptive
      components: hostname, harness (plain), os_version (plain), ruby_version (plain), reach_version (plain) and
      enrolled_via (plain, chat or cli). Since revision 2026-10-01c Reach reuses the salt of an existing
      ~/.reach/fingerprint.json when it enrolls again, so the same computer, account and install key family keeps the
      same digest across re-enrollments on one machine; a new install key still changes install_key, which Teach
      leaves out when it decides whether a request comes from the same computer (W-ENR-8). digest is the W-CONV-4 digest of canonical_json of binding; strict_digest is
      the same over binding plus hostname. Reach stores the document at ~/.reach/fingerprint.json (0600).
  W-ENR-5:
    name: enrollment stamp
    fields:
      schema: '"teach.enrollment-stamp/v1"'
      stamp_id: '"stm_" followed by 20 lowercase hexadecimal characters'
      install_id: string
      student_id: string
      username: string
      course_id: string
      fingerprint_digest: the W-ENR-4 digest Teach stored
      fingerprint_strict_digest: the W-ENR-4 strict_digest Teach stored
      issued_at: W-CONV-3 timestamp
      expires_at: W-CONV-3 timestamp, the course code's expires_at
      signing_key_id: string
      signature: W-CONV-5 base64 of W-CONV-6 by the key named in signing_key_id over canonical_json(body without signature)
    rule: >-
      Reach verifies the signature with the signing keys of the same enrollment response, checks every field against
      what it sent and holds, and stores the stamp at ~/.reach/stamp.json (0600). A stamp that fails any check is not
      stored and the enrollment is refused (M-ENROLL-INCOMPLETE).
  W-ENR-6:
    name: lockdown
    rule: >-
      Reach is locked when there is no install, when the install was revoked, when the install has a stamp that does
      not verify, names another install or student, or has expired, when the live fingerprint's digest (strict_digest
      when the policy's enrollment.fingerprint_match is strict) differs from the stamp's, when Teach answered
      fingerprint_mismatch, and, when the policy sets enrollment.require_stamp, when the install has no stamp. While
      locked: every prompt in every harness session is blocked by the enrollment flow (W-ENR-7); every gate (write,
      shell, read) refuses; every reach command refuses with exit 2 and the lock's message except help, version,
      enroll, setup, doctor, support, update, runtime, hello, gate and mcp; and every MCP tool refuses with the
      lock's message. A fingerprint mismatch queues integrity kind fingerprint_mismatch with detail {stamp_id,
      changed: [component names whose hashes differ]} once per stamp. On GET /api/v1/status Reach sends the live
      digest in X-Reach-Fingerprint; Teach compares it with the stored digest and answers 403 fingerprint_mismatch
      when they differ. The header is not covered by the request signature, so the check deters a copied ~/.reach,
      not a modified Reach.
  W-ENR-7:
    name: enrollment flow
    rule: >-
      A prompt hook installed by the plugin itself (not by a workspace) runs in every harness session while Reach is
      locked, and passes every prompt untouched while it is not. It runs a machine-wide state machine stored at
      ~/.reach/state/enroll/flow.json: awaiting_code -> awaiting_username -> awaiting_student_id -> awaiting_confirm
      -> enrolled; since revision 2026-10-01e a yes in awaiting_confirm moves to awaiting_password -> awaiting_password_again
      before it posts. Every prompt it sees while locked is blocked, so the agent never sees a code, username, student id,
      password or answer, and none is written to a transcript. The password must be 8 to 256 characters after trimming
      surrounding whitespace (M-ENR-PASSWORD-SHORT otherwise) and the second entry must equal the first
      (M-ENR-PASSWORD-MISMATCH returns to awaiting_password); between the two prompts the flow file holds only a random
      salt and the SHA-256 of salt and password, never the password, and both are removed when the flow ends. The
      password ask (M-ENR-ASK-PASSWORD) and M-ENR-DONE tell the student to write it down. Before any step it checks the prompt for the W-SUP-3 crisis
      phrases and on a match blocks with M-SUPPORT and changes nothing. The words start over, restart and cancel
      return to awaiting_code from any step. In awaiting_code a prompt that normalizes to a code (W-ENR-1) is sent to
      W-API-ENROLL-PREVIEW; a prompt that normalizes to a course id alone gets M-ENR-CODE-COURSE-ONLY, and since
      revision 2026-10-01d so does a preview answered with details.course_only. In
      awaiting_confirm a yes (W-ID-4) asks for the password, and the matching second entry generates the install key,
      builds the fingerprint and posts shape v2 with the password; a no returns to awaiting_code. enrollment_refused returns to awaiting_username; lockout_refusals refusals within
      lockout_minutes (config, default 5 and 15) lock the flow for lockout_minutes, during which no call is made.
      Since revision 2026-10-01c device_move_pending moves the flow to awaiting_move (M-ENR-MOVE-PENDING), keeping the
      pending install key and fingerprint in ~/.reach/state/enroll/ (0600) so a yes re-posts the identical request;
      since revision 2026-10-01e that yes first asks for the password again (awaiting_password), because it is never kept;
      device_move_denied returns to awaiting_code with M-ENR-MOVE-DENIED.
      On success the hook starts a detached reach sync and blocks with M-ENR-DONE. Harnesses that cannot block a
      prompt (Hermes) get the flow's message injected as context and the gates still refuse; since revision 2026-10-01e
      Hermes is never asked for the password in chat: a yes in awaiting_confirm answers M-ENR-PASSWORD-TERMINAL, which
      tells the student to finish with reach enroll in a terminal. reach enroll asks for the password twice with typing
      hidden, or reads one line from standard input with --password-stdin. Antigravity has no hooks and enrolls with
      reach enroll.
  W-ENR-8:
    name: device moves
    rule: >-
      Since revision 2026-10-01c. When a shape v2 enrollment names a student who already holds an active (not revoked)
      install with a stored fingerprint, Teach compares the request's fingerprint.digest with each. Equal digest: the
      same computer, account and salt; Teach enrolls the new install and revokes the old one. Since revision
      2026-10-01d the same holds when the salts are equal and the machine_id, os_user and platform hashes are equal,
      whatever install_key says, because every enrollment generates a new install key. Different digest: a
      device move. With the course policy's enrollment.device_moves auto (the default since revision 2026-10-02e),
      Teach enrolls the new install and revokes the old one, so a student who sets their password is enrolled with
      no instructor step. With approve (an instructor's opt-in; the default before 2026-10-02e), Teach records a pending move {move_id "mv_" + 20 lowercase hex,
      student_id, course_id, fingerprint digest and descriptive components, harness, platform, requested_at} and
      answers 409 device_move_pending; a repeat of the same request (same student and digest) answers the same move.
      An instructor approves or denies the move with a reason. After approval the same request enrolls the new install
      and revokes the old ones, once; after a denial it answers 403 device_move_denied with the reason. Installs
      without a stored fingerprint (shape v1) never make a move.
  W-ENR-9:
    name: roster and limits on Teach
    rule: >-
      Since revision 2026-10-01c. Teach keeps a roster per course: {course_id, student_id, username, display_name,
      group, status} with (course_id, student_id) and (course_id, username) unique, validated against the course's
      identity rules on import. A shape v2 enrollment succeeds only for a roster entry whose status is active. Beyond
      the per-IP limit Teach answers 429 rate_limited for more than 150 enrollment or preview requests per minute
      naming one course code (60 before revision 2026-10-01d), and for more than 5 enrollment_refused answers within 15 minutes naming one student_id
      or one username. Every refusal, move and mismatch is an audit record and appears on the console.
extra_credit:
  W-XC-1:
    name: extra-credit codes
    rule: >-
      Since revision 2026-10-02f. An instructor mints an extra-credit code on Teach for one rostered student of one
      course, with a label of 1 to 120 characters and optional points (a non-negative number). The code is "XC" plus 8
      characters of Crockford base32 from a CSPRNG, shown as XC-ABCD-EFGH; the 8 characters are unique among the
      course's codes. It is bound to that student, single use, and expires at 23:59 course time on the course's last
      day unless the instructor sets an earlier expiry; an instructor can void an unredeemed code. The instructor
      gives the code to the student outside Teach (Teach sends no message). Reach and Teach both normalize a typed
      code the same way: uppercase, drop every character that is not A-Z or 0-9, map I and L to 1 and O to 0 after the
      first two characters, and accept only XC followed by 8 Crockford characters (10 characters).
  W-XC-2:
    name: redemption
    rule: >-
      Since revision 2026-10-02f. A student gives Reach a code and an answer at any time while enrolled, inside or
      outside a course folder. Reach saves the entry to the extra-credit section of its profile as pending before it
      sends anything, then posts W-API-EXTRA-CREDIT. A transport failure, 429 or 5xx leaves it pending and every
      later reach sync retries it with the same Idempotency-Key; an error code ends it as refused with the reason.
      Teach records the redemption against the student the install belongs to only when the code is live, bound to
      that student and unexpired, and keeps the answer only in its database: never in a log line, a debug event or an
      audit record's text. An instructor persona's test student redeems codes minted for that test student only.
  W-XC-3:
    name: entries and profile sync
    rule: >-
      Since revision 2026-10-02f. An entry is {entry_id "xc_" + 20 lowercase hex, label, points, answer,
      answered_at, recorded_at}. Reach keeps entries in the extra_credit list of ~/.reach/profile.yml, separate from
      the interview fields, which never leave the computer (STD-PROFILE-LOCAL). reach sync fetches
      W-API-EXTRA-CREDIT-LIST and makes the recorded entries in the profile equal Teach's list, keeping pending and
      refused entries that Teach does not know. Teach shows every code and its entry on the console's Extra credit page
      and on the student's page. A debug event about extra credit carries entry_id, state and outcome, never the code
      or the answer (W-DBG-SCRUB).
