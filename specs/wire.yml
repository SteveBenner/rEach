schema: teach-reach.wire/v1
name: Teach-Reach wire protocol
protocol: 1
recorded: '2026-09-30'
status: normative
canonical_copy: reach/specs/wire.yml
pinned_copies:
  - teach/specs/wire.yml
summary: >
  The one contract between Reach (the student's plugin) and Teach (the instructors' server). Both
  implementations are built against this file, byte for byte. Reach 0.1.0 and Teach 0.1.0 were each built
  against their own guess and did not interoperate; this contract replaces both guesses. Its base is Teach
  0.1.0's specified wire (teach.spec.yml wire_schemas), with three parts taken from Reach 0.1.0: the request
  signature covers the query string, submissions carry a file-by-file manifest inside the archive, and the
  workspace package carries a per-slice manifest of the student's owned files.
hybrid_decisions:
  - area: request authentication
    taken_from: teach
    why: A one-time nonce blocks replayed requests, and signing a digest of the body handles binary bodies.
  - area: what the request signature covers
    taken_from: reach
    why: Teach 0.1.0 signed the path without the query, leaving values such as ?since= and ?cursor= unsigned.
  - area: encrypted envelope
    taken_from: teach
    why: >-
      The header is bound into the encryption as associated data and names the key that signed it; Reach 0.1.0's
      envelope let a signed package be replayed as another kind or an older version.
  - area: package plaintext
    taken_from: teach
    why: A gzipped tar archive. teach.spec.yml already said gzip; Teach 0.1.0's builder forgot to compress.
  - area: owned-file list per slice
    taken_from: reach
    why: Teach 0.1.0 shipped empty placeholder files only, so Reach could not tell which files were the student's.
  - area: submission contents
    taken_from: both
    why: Teach's JSON request keeps routing fields visible; Reach's manifest.json with per-file digests is checked by Teach.
  - area: receipts
    taken_from: teach
    why: Deep canonical JSON signing; Reach 0.1.0's shallow key sort failed on nested grade results. signing_key_id added.
  - area: encryption key
    taken_from: new
    why: >-
      Teach names the key to encrypt to (encryption_key) and Reach names it back (recipient_key_id), so key rotation
      never strands a submission. The key is still Teach's one dual-purpose key (Teach STD-KEY-MODEL).
  - area: key wrapping algorithm
    taken_from: both (as implemented)
    why: >-
      RSA-OAEP with SHA-1 and MGF1-SHA-1, the only OAEP the Ruby 2.6 standard library offers. teach.spec.yml 0.1.0
      claimed SHA-256, which neither side implemented. SHA-1 inside OAEP remains sound.
conventions:
  W-CONV-1:
    rule: All JSON is UTF-8. Every key that crosses the wire is a string. No field is omitted to mean false; absent means absent.
  W-CONV-2:
    name: canonical JSON
    rule: >-
      canonical_json(value) = JSON.generate(canonicalize(value)), where canonicalize turns every Hash into a Hash whose
      keys are strings sorted by byte order (key.to_s, sorted with Array#sort), recursing into values; Arrays keep their
      order and recurse into elements; every other value is left as is. No whitespace, no pretty printing. Ruby's
      standard json generator on both sides (json 2.1 on Ruby 2.6 and the json bundled with Ruby 4.0 produce identical
      output for these values).
  W-CONV-3:
    name: timestamps
    rule: RFC 3339 in UTC with a trailing Z and whole seconds, Time.now.utc.strftime("%Y-%m-%dT%H:%M:%SZ").
  W-CONV-4:
    name: digests
    rule: SHA-256, lowercase hexadecimal, 64 characters. The digest of an empty body is e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855.
  W-CONV-5:
    name: base64
    rule: Strict base64 (RFC 4648 section 4, no line breaks), Base64.strict_encode64 / strict_decode64.
  W-CONV-6:
    name: RSA-PSS
    rule: RSA-PSS with SHA-256, MGF1-SHA-256 and a salt length of exactly 32 bytes, on signing AND verifying (never salt_length :auto).
  W-CONV-7:
    name: RSA key size
    rule: RSA-4096 for install keys and Teach keys. Public keys travel as PEM (SubjectPublicKeyInfo, "-----BEGIN PUBLIC KEY-----").
transport:
  W-TR-1:
    rule: HTTPS in production. The base URL is the course's Teach URL (install.yml teach_url); every route below is under <teach_url>/api/v1.
  W-TR-2:
    rule: >-
      Request bodies are JSON with Content-Type application/json. Responses are JSON with Content-Type application/json,
      except GET /packages/:kind returning 304 (empty body).
  W-TR-3:
    rule: Teach serves /api/v1 at the root of its application. A reverse proxy that mounts Teach under a prefix must strip the prefix before Teach sees the request.
request_authentication:
  applies_to: Every route except POST /api/v1/enroll and GET /api/v1/health.
  headers:
    X-Teach-Install: The install id returned by POST /enroll.
    X-Teach-Timestamp: W-CONV-3 timestamp of when the request was signed.
    X-Teach-Nonce: 32 lowercase hexadecimal characters, 16 bytes from a secure random source (SecureRandom.hex(16)), fresh for every attempt including retries.
    X-Teach-Signature: W-CONV-5 base64 of the W-CONV-6 RSA-PSS signature, by the install's private key, over the signed payload.
  W-AUTH-1:
    name: signed payload
    rule: >-
      The five lines METHOD, TARGET, TIMESTAMP, NONCE and BODY_DIGEST joined by a single "\n" with no trailing newline.
      METHOD is the uppercase HTTP method. TARGET is the route path starting at "/api/v1/" plus, when the request has a
      query string, "?" followed by the query string exactly as sent on the request line (no re-encoding, no re-ordering).
      TIMESTAMP and NONCE are the header values. BODY_DIGEST is the W-CONV-4 digest of the raw body bytes (of the empty
      string for a request without a body).
    example: |-
      GET
      /api/v1/receipts?since=2026-10-01T00%3A00%3A00Z&limit=50
      2026-10-15T21:41:07Z
      9f2c0b6a51e44f3d8a1c7e0b2d4f6a88
      e3b0c44298fc1c149afbf4c8996fb92427ae41e4649b934ca495991b7852b855
  W-AUTH-2:
    name: target on the Teach side
    rule: >-
      Teach rebuilds TARGET as env["PATH_INFO"], plus "?" and env["QUERY_STRING"] when QUERY_STRING is non-empty. Teach
      never uses SCRIPT_NAME, never decodes, and never re-orders the query.
  W-AUTH-3:
    name: target on the Reach side
    rule: >-
      Reach signs the route path it was asked to call ("/api/v1/..."), never the base URL's own path prefix, and builds
      the query once (URI.encode_www_form over an ordered list of pairs) and uses that same string both on the request
      line and in TARGET.
  W-AUTH-4:
    name: freshness
    rule: >-
      Teach refuses a timestamp more than 300 seconds from its clock (401 unauthenticated) and a nonce it has already
      seen for the same install within 600 seconds (401 unauthenticated). The nonce is recorded only after the signature
      verifies.
  W-AUTH-5:
    name: nonce format
    rule: Teach refuses a nonce that is not exactly 32 lowercase hexadecimal characters (401 unauthenticated).
  W-AUTH-6:
    name: install state
    rule: >-
      An unknown install id is 403 not_enrolled; a revoked install is 403 revoked. Both are checked before the signature
      so a revoked install learns it is revoked.
  instructor_requests: >-
    Instructor API requests use the same scheme with X-Teach-Instructor in place of X-Teach-Install. Reach never sends
    them; the rule is recorded so both flows share one verifier.
keys:
  W-KEY-1:
    name: install key
    rule: >-
      Reach generates an RSA-4096 key pair per install at enrollment. The private key never leaves
      ~/.reach/keys/install.pem (mode 0600). It signs requests and Reach-sealed envelopes and decrypts Teach-sealed
      envelopes.
  W-KEY-2:
    name: Teach keys
    rule: >-
      Teach has one or more non-retired RSA-4096 keys, each with a key_id; exactly one is active. The active key signs
      everything Teach issues (packages, receipts) and decrypts what Reach seals to it (Teach STD-KEY-MODEL: one
      dual-purpose key).
  W-KEY-3:
    name: key advertisement
    rule: >-
      POST /enroll and GET /status both return signing_public_keys (every non-retired key as {key_id, pem}) and
      encryption_key (the active key as {key_id, pem}). Reach replaces its stored copies with these on every successful
      response.
  W-KEY-4:
    name: key selection for verification
    rule: >-
      Reach verifies a Teach signature with the key whose key_id equals the envelope header's signing_key_id or the
      receipt's signing_key_id. When that key_id is unknown, Reach refreshes GET /status once and looks again; still
      unknown is a verification failure. Reach never tries every key.
  W-KEY-5:
    name: key selection for decryption on Teach
    rule: >-
      Teach decrypts a Reach-sealed envelope with the private key named by the header's recipient_key_id, retired or
      not, as long as its private key file still exists. An unknown recipient_key_id is a rejection (invalid_request,
      "unknown recipient key"). A missing recipient_key_id means the active key.
envelope:
  W-ENV-1:
    name: shape
    rule: >-
      A JSON object with exactly the fields header, wrapped_key, nonce, ciphertext, tag and signature. The last five are
      W-CONV-5 base64 strings.
  W-ENV-2:
    name: header
    schema: teach.package/v1
    fields:
      schema: {type: string, const: teach.package/v1, required: true}
      kind: {type: string, enum: [guardrails, workspace, shape, suite, submission, hand_bundle, qualification], required: true, note: "qualification since protocol 1 revision 2026-09-29d"}
      id: {type: string, required: true, note: "Teach: pkgenv_<20 hex>. Reach: renv_<20 hex>."}
      version: {type: integer, minimum: 1, required: true, note: "Teach: per student per kind, increasing. Reach-sealed: always 1."}
      course: {type: string, required: true}
      assignment: {type: [string, "null"], enum: [A1, A2, A3, A4, null], required: false}
      student_id: {type: string, required: true}
      created_at: {type: string, format: W-CONV-3, required: true}
      content_digest: {type: string, format: W-CONV-4, required: true, note: "digest of the plaintext bytes (the .tar.gz)"}
      signing_key_id: {type: string, required: true, note: "Teach-sealed: the Teach key_id. Reach-sealed: the install_id."}
      recipient_key_id: {type: string, required: false, note: "Reach-sealed: the encryption_key key_id it encrypted to. Teach-sealed: absent."}
  W-ENV-3:
    name: sealing
    steps:
      - content_digest = W-CONV-4 digest of the plaintext; set it in the header.
      - aad = canonical_json(header) (W-CONV-2), the header including content_digest.
      - A fresh random 32-byte AES key and a fresh random 12-byte nonce; AES-256-GCM encrypt the plaintext with aad; 16-byte tag.
      - wrapped_key = RSA public_encrypt of the AES key with OAEP padding (OpenSSL PKCS1_OAEP_PADDING, SHA-1, MGF1-SHA-1) under the recipient's public key.
      - signature = W-CONV-6 over the string aad + ciphertext_digest, where ciphertext_digest is the W-CONV-4 digest of the raw ciphertext bytes (plain concatenation, no separator).
  W-ENV-4:
    name: opening
    order:
      - Check the object has exactly the W-ENV-1 fields and the header has every required W-ENV-2 field.
      - Check header.schema, header.kind (equal to the kind the caller expects) and header.student_id (equal to the enrolled student).
      - Select the signer's public key (W-KEY-4 on Reach, the install's key on Teach) and verify the signature. Stop on failure.
      - Unwrap the AES key with the recipient's private key (W-KEY-5 on Teach).
      - Decrypt with aad = canonical_json(header). Stop on an authentication failure.
      - Check the W-CONV-4 digest of the plaintext equals header.content_digest. Stop on mismatch.
      - Only then unpack the plaintext (W-TAR).
    failure: >-
      Reach raises Reach::VerificationFailed and never writes any of the plaintext. Teach treats a submission or hand
      bundle that fails any step as a rejection (state rejected, code invalid_request) without storing plaintext.
tarball:
  W-TAR-1:
    name: format
    rule: >-
      Every envelope plaintext is a POSIX ustar archive written with Gem::Package::TarWriter and compressed with
      Zlib::GzipWriter. Readers accept gzip-compressed (first two bytes 0x1F 0x8B) or uncompressed tar.
  W-TAR-2:
    name: entry names
    rule: >-
      Relative, forward slashes only, no leading "/", no "." or ".." segment, no backslash, no NUL, at most 255 bytes.
      A reader refuses the whole archive when any entry name breaks this rule.
  W-TAR-3:
    name: entry types
    rule: Writers add regular files only. Readers skip directory entries and refuse the archive when it holds a symlink, hard link or device entry.
  W-TAR-4:
    name: limits
    rule: Readers refuse an archive whose uncompressed entries total more than 200 MiB or that holds more than 20000 entries.
  W-TAR-5:
    name: contents map
    rule: Readers return an ordered Hash of entry name to binary String (ASCII-8BIT); writers take the same shape.
packages:
  W-PKG-1:
    name: guardrails
    kind: guardrails
    built_by: teach
    entries:
      directives.yml: >-
        YAML list. First the numbered rules {id, rule}: the base directives G-SCOPE-1 ... G-AI-POLICY-1 in teach.spec.yml
        order, then one entry per string in each of the student's cutouts' "guardrails" list, id "G-CUTOUT-<cutout_id>-<n>"
        with n counting from 1 per cutout. Then, since protocol 1 revision 2026-09-28, the private directive rows
        {id, opcode, alias, tier: private, slice, rule, when, enforce}, one per file in Teach's directives/ directory
        (id "D-<OPCODE>", alias N-Z). A Reach that predates the rows renders them as numbered rules, which is harmless.
      course.yml: >-
        YAML map {id, title, term, timezone, current_assignment: {id, due}, interview: {course_question}}.
        interview.course_question is teach.spec.yml course_model.interview.course_question, or null when absent.
      tips.yml: >-
        YAML list of {cutout_id, text}, one per string in each of the student's cutouts' "tips" list. Absent since
        protocol 1 revision 2026-09-29d: a Teach of that revision writes none and a Reach of that revision reads none.
      "directives/<opcode>.md": >-
        Absent since protocol 1 revision 2026-09-28c: a Teach of that revision ships no bodies in the package and
        serves one per signed request instead (W-API-DIRECTIVE). Revision 2026-09-28b carried them here and a Reach
        of that revision decrypted one in memory; a Reach of 2026-09-28c still reads a body from the package when a
        Teach older than 2026-09-28c put one there. A body is never written to the vault or into a workspace.
      seal.yml: >-
        YAML map {schema: teach.seal/v1, ledger_key, marks}. ledger_key is HMAC-SHA256(Teach's seal secret,
        "ledger\n" + install_id + "\n" + header.version) as 64 lowercase hex characters. marks maps each cutout id of
        the student's slices to a map of owned path to mark, where mark is the first 8 bytes of
        HMAC-SHA256(Teach's seal secret, install_id + "\n" + cutout_id + "\n" + owned path) as 16 lowercase hex
        characters. The seal secret never leaves Teach; Reach stores seal.yml only in the vault.
      reference-keys.json: >-
        Optional, since protocol 1 revision 2026-09-28f. JSON map {schema: reach.reference-keys/v1, keys: [{key_id,
        course, key_b64}]}: the AES-256-GCM content keys of the encrypted course reference blobs (corpus/course-reference/
        <name>.rref in the Reach repository, format RREF version 1) that Teach delivers to this install. A Teach of that
        revision always writes it, with an empty keys list when it holds none; an older Teach omits it and Reach reports
        every blob as locked. Reach keeps it only in the vault and decrypts blobs in memory, never writing plaintext.
    reach_use: >-
      The guardrails version is header.version (an integer). Reach renders AGENTS.md, CLAUDE.md and GEMINI.md for a slice
      as W-RENDER-1, writes a digest manifest of the unpacked entries and re-checks it on every load (W-SEAL-3), and
      stamps every owned file with its mark (W-SEAL-1).
  W-PKG-2:
    name: workspace
    kind: workspace
    built_by: teach
    entries:
      slices.json: >-
        {"schema": "teach.workspace/v1", "course": <course id>, "assignment": <A1-A4>, "slices": [<slice>...]} where each
        slice is {cutout_id, slice, module, assignment, due, behavior, owned_files, instructor_apis, panel_slice,
        contract_refs, tags, class, acceptance_mode, scenarios, qualify, root}. root is "<cutout_id>-<slice>". owned_files lists paths relative to the slice
        workspace. tags is ["@<cutout_id>", "@<slice>"] since protocol 1 revision 2026-09-28d (["@<cutout_id>"]
        before it); every tag must hold for a scenario to run (W-RUN-1). acceptance_mode is "remote" and scenarios
        lists the names of the cutout's graded scenarios. qualify (since protocol 1 revision 2026-09-29d; absent before
        and when the course repository's slice API carries none) is {tag, local}, copied from the slice API's qualify
        object: tag is the Cucumber tag every scenario the agent writes for the slice carries ("@backend" or "@panel"),
        and local is true when those scenarios can also run away from Teach (W-QUAL-2).
      "<root>/<owned file>": >-
        The student's starting copy of each owned file: the course repository's stub at stubs/<owned file> when it has
        one (since 2026-09-28d), otherwise empty.
      "<root>/api/README.md": >-
        The instructor APIs the slice may call. Since protocol 1 revision 2026-09-29b, when Teach can run the course
        repository's bin/slice-api, that tool's --format markdown output, verbatim; otherwise, and before that
        revision, the course spec's instructor_apis lines, one per line.
      "<root>/api/slice-api.json": >-
        Optional, since protocol 1 revision 2026-09-29b. The course repository's bin/slice-api --format json output,
        verbatim, conforming to the JSON Schema grokit.slice-api/v1 that the course repository publishes at
        specs/schemas/slice-api.v1.json; this contract does not restate its fields. Teach writes it only after checking
        the output against that schema, and exactly when it writes the tool's README. Reach reads only the schema name
        and the ports' names (plus clock and logger, which every backend slice receives) and falls back to
        api/README.md when the file is absent or names another schema.
      "<root>/contract/README.md": The contract references for the slice, one per line, as given by the course spec.
      "<root>/qualify/kit/<path>": >-
        Since protocol 1 revision 2026-09-29d. One entry per element of the slice API's qualify.kit, at its run-directory
        path, holding the bytes of the course repository file it names (source). The kit is answer-free by the course
        repository's contract; Teach refuses to build the package when a kit source lies under a behaviours/ directory
        or is one of a cutout's owned paths.
      "<root>/qualify/features/.keep": Since 2026-09-29d, an empty file, so the agent's scenario folder exists.
      "<root>/qualify/step_definitions/.keep": Since 2026-09-29d, an empty file, so the agent's step folder exists.
    owned_file_split:
      backend: The cutout's owned_paths that end in ".rb".
      panel: The cutout's owned_paths that do not end in ".rb".
      verification: The cutout's evidence_paths when present; otherwise the slice is not built and Teach reports a warning.
    never_included: >-
      A cutout's reference_implementation, its regeneration prompt, its acceptance scenarios, its status, step or group,
      or any file that is not one of the entries above. Teach copies slice fields by allowlist, never by blocklist.
    reach_use: W-PROV-1.
  W-PKG-3:
    name: shape
    kind: shape
    built_by: teach
    entries:
      "<cutout_id>/shape.json": The signed Dovetail shape for the cutout's module.
      "<cutout_id>/shape.sig": The shape's signature, when Dovetail produced one.
      "<cutout_id>/brief.md": The design brief for the cutout.
      "dovetail/**": >-
        Since 2026-09-28d: the Dovetail shape checker that compiled the shapes, as written by dovetail checker export
        (dovetail/exe/dovetail, dovetail/lib/**, dovetail/VERSION). It runs on Ruby 2.6.10 and later with the standard
        library only.
    availability: >-
      Since 2026-09-28d Teach compiles modules/<module>/contract.rb from the course repository with Dovetail and signs
      shape.json with its active signing key (the key Reach receives in signing_public_keys), for every cutout whose
      module has a contract; a cutout whose module has none is skipped with a warning. Before 2026-09-28d the kind was
      built only for course-spec entries carrying a shape.
    reach_use: >-
      Unpacked into ~/.reach/vault/shape/. The shape for a slice workspace is vault/shape/<cutout_id>/shape.json; its
      brief is copied read-only into <workspace>/shape/brief.md. Reach runs the shipped checker with its own Ruby
      (ruby vault/shape/dovetail/exe/dovetail check ...) and falls back to a dovetail on the PATH only when the package
      carries none. Since 2026-09-28e the check runs on the whole panel the student's code lives in: a copy of
      vault/suite/reference_build/<module>/modules/<module>/panel with the slice's owned panel files laid over it, the
      same tree Teach's grading sandbox checks. A slice that owns no panel files has nothing to check. Without the
      suite, Reach checks the workspace's own panel directory.
  W-PKG-4:
    name: suite
    kind: suite
    built_by: teach
    entries:
      "features/**/*.feature": The acceptance feature files named by the student's cutouts' acceptance_features, at the same relative paths.
      reasons.yml: The plain-language failure reasons, when the course repository has one at features/reasons.yml.
      "features/step_definitions/**": >-
        Since 2026-09-28d: the course repository's shared step files (features/step_definitions/grokit_*.rb) and the
        step file of each module the student's cutouts belong to (features/step_definitions/<module>_steps.rb).
      "features/support/**": Since 2026-09-28d, the course repository's features/support/ directory.
      "reference_build/<module>/**": >-
        Since 2026-09-28e, one tree per module the student's cutouts belong to, each at reference_build/<module>/: the
        output of the course repository's bin/reference-build --module <module> --out <dir>, with every path the student
        owns in that module replaced by the course repository's stub at stubs/<path>, or removed when there is no stub.
        The paths the student owns are each slice's owned_file_split (W-PKG-2), so a panel slice's cutout keeps its
        reference backend and a backend slice's cutout keeps its reference panel. From 2026-09-28d to 2026-09-28e the
        trees were merged into reference_build/**, where the last module's app/ replaced the others', and every
        owned_path of a cutout was stubbed whatever the slice.
      Gemfile: Since 2026-09-28d, the course repository's features/Gemfile.
      Gemfile.lock: Since 2026-09-28d, the course repository's features/Gemfile.lock (Ruby 3.2 and later).
      Gemfile.ruby26.lock: Since 2026-09-28d, the course repository's features/Gemfile.ruby26.lock (Ruby 2.6 to 3.1).
      suite.yml: >-
        Since 2026-09-28d: {suite_version, fixture_version, modules}. suite_version is the course repository's commit
        (12 hex characters); fixture_version is the course repository's fixtures/VERSION, or null.
      "step_definitions/**": Reserved in 0.2.0 and never shipped; replaced by features/step_definitions/**.
      "support/**": Reserved in 0.2.0 and never shipped; replaced by features/support/**.
    availability: >-
      Built only when TEACH_GROKIT_ROOT points at the course repository and the named feature files exist; otherwise
      skipped with a warning.
    reach_use: >-
      Before protocol 1 revision 2026-09-29d, unpacked into ~/.reach/vault/suite/ and run by reach tips as W-RUN-1.
      Teach 0.10.0 and later build no suite package (the acceptance suite runs only on Teach), and Reach 0.11.0 and
      later neither fetch nor read one; its place is taken by the qualify kit (W-PKG-2) and W-QUAL.
  W-RUN-1:
    name: suite run directory
    since: 2026-09-28d
    applies_to: >-
      Teach's grading sandbox and the hidden run of a qualification (W-QUAL-3), from Teach's own copy; before
      protocol 1 revision 2026-09-29d also reach tips, from the vault.
    assemble:
      - Start from an empty directory.
      - Copy reference_build/<module>/** into it at the same relative paths, for the module of the slice's cutout.
      - Copy features/** (feature files, features/step_definitions/**, features/support/**) into features/.
      - Copy Gemfile, Gemfile.lock and Gemfile.ruby26.lock, and reasons.yml, into the directory root.
      - Copy each of the student's owned files for the slice over the path it names, replacing any stub.
    gems: >-
      BUNDLE_GEMFILE is the directory's Gemfile. The lockfile is Gemfile.ruby26.lock on Ruby 3.1 and earlier and
      Gemfile.lock on Ruby 3.2 and later; the runner copies the chosen lock to Gemfile.lock before bundling when they
      differ. When the suite carries no Gemfile, Reach falls back to its own gem set.
    command: >-
      bundle exec cucumber --format json --tags @<cutout_id> --tags @<slice>, run from the directory root, with
      REACH_CHROME naming a Chrome or Chromium binary when one is known and CUPRITE_NO_SANDBOX=1 inside a container.
    results: >-
      Every scenario in the JSON report is one result; it passed when no step failed. A scenario's failure category is
      its @category:<name> tag, or behaviour when it has none.
  W-PKG-5:
    name: submission
    kind: submission
    built_by: reach
    entries:
      manifest.json: >-
        {"schema": "reach.submission/v1", course, assignment, cutout_id, slice, owned_files, digests, reach_version,
        client_created_at, seal}. digests maps each owned file to its W-CONV-4 digest, or null when the file does not
        exist. seal (since 2026-09-28, absent from older Reach) is {guardrails_version, ledger_key: "teach" | "local",
        ledger_head, ledger_count, witnessed: {owned path: digest or null}, marks: {owned path: own | missing | corrupt
        | foreign | unmarked}, harness, sidecar_id, integrity_events}. Since protocol 1 revision 2026-09-29b the seal
        also carries hooked (true when the slice's ledger holds at least one session record), and harness falls back
        to the REACH_HARNESS environment value (claude-code, codex or antigravity) before "unknown". Teach assesses a
        seal whose hooked is false, or whose harness is antigravity or unknown with no session record in the ledger
        tail, as hookless: under its unhooked-harness policy "note" (the default) the unwitnessed files become one note
        instead of review reasons; under "review" they stay reasons naming the harness. A seal without hooked is
        assessed as before this revision.
      "files/<owned file>": One entry per owned file that exists, its bytes unchanged.
      ledger.jsonl: The last 2000 records of the slice's witness ledger (W-SEAL-2), verbatim; absent when the ledger is empty.
      "evidence/qualify/features/<path>": >-
        Since protocol 1 revision 2026-09-29d. The agent's scenario files for the slice (the workspace's
        qualify/features/**, .keep excluded), bytes unchanged, exactly as the passing qualification used them.
      "evidence/qualify/step_definitions/<path>": Since 2026-09-29d, the agent's step files (qualify/step_definitions/**), likewise.
      evidence/qualification.json: >-
        Since 2026-09-29d. The passing qualification record (W-QUAL-5) whose files_digest and tests_digest equal the
        submitted owned files and evidence files. Teach stores and lists every evidence entry with the submission and
        never grades one; a submission from an older Reach carries none.
    teach_checks:
      - manifest.cutout_id, manifest.slice and manifest.assignment equal the request body's cutout_id, slice and assignment.
      - Every files/ entry's path (without the files/ prefix) is in manifest.owned_files, and its digest equals manifest.digests for that path.
      - Every other entry is manifest.json, ledger.jsonl or under evidence/; since 2026-09-29d any other entry rejects the submission.
      - When the course spec is available, manifest.owned_files equals the W-PKG-2 owned_file_split for that cutout and slice.
      - A failed check rejects the submission with code invalid_request and reason "the package does not match the slice".
      - >-
        Provenance (W-SEAL-4) is assessed after the checks above and never rejects a submission; its verdict is stored
        on the submission for instructors and is not part of any receipt.
    file_list: The ingest receipt's file_list is the sorted list of files/ entry paths without the files/ prefix.
  W-PKG-6:
    name: hand bundle
    kind: hand_bundle
    built_by: reach
    entries:
      bundle.json: >-
        {"schema": "reach.hand/v1", trigger, summary, course, assignment, cutout_id, slice, attempts, files, plan, profile,
        client_created_at}. files maps each owned file to its text or null. attempts is the slice's recent attempt records.
        plan is the slice plan (reach.plan/v1) or null. profile is the student's saved profile fields, present only when
        the student agreed to include it; otherwise null. Reach 0.11.0 and later send reach.hand/v2 (W-PKG-6-v2);
        Teach 0.11.0 and later accept both.
  W-PKG-6-v2:
    name: hand bundle, version 2
    since: 2026-09-29d
    kind: hand_bundle
    built_by: reach
    entries:
      bundle.json: >-
        {"schema": "reach.hand/v2", hand_ref, originator, trigger, created_at, course, assignment, module, cutout_id,
        slice, task, attempts, code, tests, last_output, agent_summary, student_last_request, environment,
        contract_version, suite_version, plan, profile}. hand_ref is a UUID Reach makes for the hand. originator is
        agent (Reach raised it on the attempt ladder, W-QUAL-6) or student (the student asked for help). trigger is
        attempt_ladder, student_request or check_gate. task is {behaviour, plan_step, description}: the slice's
        behaviour, the plan step being worked, and the agent's one-line description of what it was attempting.
        attempts is {count, notice_from: 2, hand_at: 3, hard_stop: 10, history: [{n, at, passed, steps,
        files_digest}]}, the slice's qualifications since the last pass or instructor reply. code maps every owned file
        to its full text or null. tests maps every file under the workspace's qualify/features and
        qualify/step_definitions (.keep excluded) to its full text. last_output is {local: [plain lines], agent, stub,
        hidden} from the last qualification, the three row lists as W-API-QUALIFICATION returns them, the whole object
        cut to 65536 bytes of JSON. agent_summary is the agent's plain account of what failed and what it tried
        (at most 4000 bytes); student_last_request the student's last prompt in the slice (at most 4000 bytes) or
        null. environment is {reach_version, ruby_version, platform, harness, model or null}. contract_version and
        suite_version come from the slice API and the last qualification, or null. plan and profile as in W-PKG-6.
    size: The whole bundle.json is at most 196608 bytes; Reach drops last_output first, then cuts code and tests to their first 32768 bytes each, marking every cut with "[cut]".
  W-PKG-7:
    name: qualification
    since: 2026-09-29d
    kind: qualification
    built_by: reach
    entries:
      manifest.json: >-
        {"schema": "reach.qualification/v1", course, assignment, cutout_id, slice, owned_files, digests, tests,
        attempt, reach_version, client_created_at}. digests maps each owned file to its W-CONV-4 digest or null, as in
        W-PKG-5; tests maps each qualify/ path sent to its digest. attempt is the slice's attempt number (W-QUAL-6).
      "files/<owned file>": One entry per owned file that exists, its bytes unchanged.
      "qualify/features/<path>": Every file under the workspace's qualify/features (.keep excluded).
      "qualify/step_definitions/<path>": Every file under the workspace's qualify/step_definitions (.keep excluded).
    teach_checks:
      - The same manifest and file checks as W-PKG-5, and every qualify/ entry's digest equals manifest.tests.
      - At most 60 scenarios across the feature files and at most 512 KiB of qualify/ entries; more is invalid_request.
render:
  W-RENDER-1:
    name: course rules file
    rule: >-
      AGENTS.md, CLAUDE.md and GEMINI.md in a slice workspace hold the same text: "# Course rules for this workspace", a
      blank line, "You are helping a student with one slice of a course module. These rules come from the instructors
      and always apply.", a blank line, a numbered list ("1. ", "2. ", ...) of every directives.yml entry without an
      opcode whose id does not start with "G-CUTOUT-" followed by those whose id starts with
      "G-CUTOUT-<this slice's cutout_id>-", in file order, then the directive table (W-RENDER-2) when it is not empty,
      a blank line, then "Your files: <owned files joined by ', '>", "Slice: <cutout_id> (<slice>) - <behavior>" and
      "Due: <due>", each on its own line, ending with a newline.
  W-RENDER-2:
    name: directive table
    rule: >-
      A blank line, "## Course directives", a blank line, one row per directives.yml entry with an opcode whose slice is
      all or equals this slice; a blank line, "## Engineering directives", a blank line, one row per file in Reach's
      directives/ directory whose slice applies; a blank line, then the pointer sentence. A section with no rows is
      omitted. A row is "[<alias> · <OPCODE>]" padded to 20, the rule padded to 88, "reach directive <OPCODE>" padded to
      26, "⚙ " and the enforce value padded to 22, "⚡ " and the when list as "[a, b]", separated by single spaces.
provisioning:
  W-PROV-1:
    name: slice workspaces
    rule: >-
      For each entry in slices.json, Reach provisions ~/reach-work/deliverables/<course>/<assignment>/<root>/ (since
      protocol 1 revision 2026-09-29c; ~/reach-work/<course>/<assignment>/<root>/ before, and REACH_WORKSPACE_ROOT
      replaces ~/reach-work) from the archive entries under "<root>/", then writes README.md (Reach's template from the
      slice fields), the W-RENDER-1 files, shape/brief.md when a brief exists, .reach/slice.json (course, assignment,
      cutout_id, slice, kind = slice, behavior, due, owned_files, tags, package_version, and since 2026-09-29d
      scenarios and qualify) and .reach/delivered.json, and makes every file except the owned files read-only. Since
      2026-09-29d the qualify/features and qualify/step_definitions folders stay writable and are left out of
      delivered.json, like the owned files; qualify/kit stays read-only.
  W-PROV-2:
    name: never overwrite the student's work
    rule: >-
      When a newer workspace package arrives, Reach replaces read-only files and the marker, but keeps any owned file
      whose current digest differs from the digest it had when last delivered. It records each kept file in the sync
      summary.
routes:
  - id: W-API-ENROLL
    method: POST
    path: /api/v1/enroll
    auth: none (rate limited per IP)
    request:
      code: {type: string, minLength: 12, maxLength: 32}
      public_key_pem: {type: string, maxLength: 4096}
      reach_version: {type: string}
      platform: {type: string, enum: [macos, windows, linux], note: "Reach maps RbConfig host_os darwin -> macos, mswin|mingw|cygwin -> windows, anything else -> linux"}
      ruby_version: {type: string, note: RUBY_VERSION}
    response_200:
      install_id: string
      student_id: string
      course: {id: string, title: string, term: string, timezone: string}
      signing_public_keys: "[{key_id, pem}]"
      encryption_key: "{key_id, pem}"
      minimum_reach_version: string
      wire_contract_sha256: string
    errors: {400 invalid_request: "a bad, expired or used code, or a malformed body", 400 reach_outdated: "reach_version is below minimum_reach_version (the code is not used)", 429 rate_limited: "too many attempts"}
    notes: >-
      Spelled /api/v1/enroll since protocol 1 revision 2026-09-29c. Since the same revision Teach compares reach_version
      with its minimum_reach_version before it redeems the code, and refuses an older Reach with 400 reach_outdated
      and a message naming both versions, so the student can update Reach and enroll again with the same code. Teach 0.10.0 and later also answer the old
      /api/v1/enrol with the same handler, unlisted, so an installed older Reach can still enroll; Reach 0.10.0 and
      later post to /api/v1/enroll and retry once at /api/v1/enrol when a Teach older than 0.10.0 answers 404
      not_found.
  - id: W-API-STATUS
    method: GET
    path: /api/v1/status
    auth: install
    response_200:
      install_id: string
      student: {id: string, display_name: string, group: "string or null"}
      course: {id: "string or null"}
      current_assignment: "{id, due} or null"
      slices: "[{cutout_id, slice, assignment}]"
      packages: "[{kind, version, content_digest}] for the latest package of each kind that exists"
      outstanding_receipts: "[receipt_id]"
      server_time: W-CONV-3 timestamp
      signing_public_keys: "[{key_id, pem}]"
      encryption_key: "{key_id, pem}"
      minimum_reach_version: string
      wire_contract_sha256: string
      transcripts: >-
        Since protocol 1 revision 2026-09-29c. {kinds: [entry kinds W-API-TRANSCRIPT accepts], max_text_bytes: 131072}.
        Absent from an older Teach, which Reach reads as kinds [prompt].
  - id: W-API-PACKAGE
    method: GET
    path: /api/v1/packages/:kind
    auth: install
    request_headers:
      If-None-Match: The quoted content_digest of the newest package of this kind Reach has stored, when it has one.
    response_200: The envelope (W-ENV-1) of the latest package of that kind for this install's student, with ETag "<content_digest>" in double quotes.
    response_304: Empty body; the stored package is current.
    errors: {404 not_found: "no package of this kind has been built for the student yet"}
    reach_use: >-
      Reach stores the verified envelope at ~/.reach/packages/<kind>/<header.version>.pkg. A 404 is not an error; the
      kind has not been built yet.
  - id: W-API-SUBMIT
    method: POST
    path: /api/v1/submissions
    auth: install
    request_headers:
      Idempotency-Key: Required. A UUID Reach generates once per submission and reuses on every retry of it.
    request:
      cutout_id: {type: string, pattern: "^[a-z_]+\\.a[1-4](s[12])?$"}
      slice: {type: string, enum: [backend, panel, verification]}
      assignment: {type: string, enum: [A1, A2, A3, A4]}
      package: W-ENV-1 envelope, header.kind submission (W-PKG-5)
      client_created_at: W-CONV-3 timestamp
    response_200:
      submission_id: string
      state: "ingested | rejected"
      receipt: The signed ingest receipt (W-RCPT) when state is ingested.
      rejection: "{code, reason} when state is rejected"
    notes: >-
      Ingest is synchronous: the ingest receipt arrives in this response, so Reach announces "received" at once. A repeat
      with the same Idempotency-Key returns the original submission_id, state and receipt.
    errors: {403 not_released: "", 403 forbidden: "not the student's slice, or submissions disabled", 403 deadline_passed: "", 413 too_large: "body over 5 MB", 429 rate_limited: ""}
  - id: W-API-SUBMISSION
    method: GET
    path: /api/v1/submissions/:id
    auth: install
    response_200:
      submission: the submission record
      receipts: "[receipt bodies], oldest first"
      acknowledgments: >-
        Since protocol 1 revision 2026-09-30. [W-RCPT-4 acknowledgment bodies, each with linked_at added], oldest
        first; absent from an older Teach.
    reach_use: Polled no more often than every 30 seconds for a grade receipt, only while one is outstanding.
  - id: W-API-QUALIFY
    method: POST
    path: /api/v1/qualifications
    auth: install
    since: 2026-09-29d
    request_headers:
      Idempotency-Key: Required. A UUID Reach generates once per qualification and reuses on every retry of it.
    request:
      cutout_id: {type: string, pattern: "^[a-z_]+\\.a[1-4](s[12])?$"}
      slice: {type: string, enum: [backend, panel]}
      assignment: {type: string, enum: [A1, A2, A3, A4]}
      package: W-ENV-1 envelope, header.kind qualification (W-PKG-7)
      client_created_at: W-CONV-3 timestamp
    response_202: {qualification_id: string, status: pending}
    notes: >-
      Ungraded: a qualification makes no score, no receipt and no grade row, and never counts as a submission. Teach
      runs it in the grading sandbox (W-QUAL-3). A repeat with the same Idempotency-Key returns the original
      qualification_id and its current status.
    errors: {400 invalid_request: "a body, package or manifest outside W-PKG-7", 403 forbidden: "not the student's slice", 403 not_released: "", 413 too_large: "body over 2 MB", 429 rate_limited: "over TEACH_QUALIFY_LIMIT_PER_HOUR (default 12) per slice per hour, or 2 already pending or running for the student", 503 unavailable: "qualifications are switched off (TEACH_QUALIFY_DISABLE=1); Retry-After says when to try"}
  - id: W-API-QUALIFICATION
    method: GET
    path: /api/v1/qualifications/:id
    auth: install
    since: 2026-09-29d
    response_200:
      qualification_id: string
      status: "pending | running | done | failed_to_run"
      agent: "[{name, result: passed | failed | skipped, step, error}] once done: the agent's scenarios on the slice"
      stub: "[{name, result}] once done: the same scenarios with the starting copies in place of the owned files"
      hidden: "[{name, result, reason}] once done: the instructors' graded scenarios for the slice"
      suite_version: "string or null"
      finished_at: "W-CONV-3 timestamp or null"
      reason: "string or null: why a run could not run (failed_to_run only), in plain words"
    notes: >-
      step is the text of the scenario's first failing step as written in the agent's feature file, and error the
      class name of what it raised (for example Capybara::ElementNotFound or RuntimeError); both are null for a
      scenario that passed or was skipped. Teach never returns a failure message, step output, log, page text or file
      content from a qualification run, because the run directory holds course code the student does not own. reason
      on a hidden row is the category text from the course's reasons.yml, as on a grade receipt.
  - id: W-API-RECEIPTS
    method: GET
    path: /api/v1/receipts
    auth: install
    query: {since: "W-CONV-3 timestamp, optional", limit: "1-200, default 50", cursor: "a receipt_id, optional"}
    response_200: {receipts: "[receipt bodies], newest first"}
    reach_use: >-
      Since protocol 1 revision 2026-09-30, reach sync pages through this route (limit 200, at most 5 pages) and stores
      every receipt Reach does not already hold, after verifying it (W-RCPT-2), so a receipt Reach missed or lost is
      preserved on the student's machine too.
  - id: W-API-RECEIPT-ACK
    method: POST
    path: /api/v1/receipts/:receipt_id/acknowledgment
    auth: install
    since: 2026-09-30
    request_headers:
      Idempotency-Key: Required. The acknowledgment's ack_id, reused on every retry of it.
    request: The W-RCPT-4 acknowledgment body, signature included; its receipt_id equals the path's.
    response_200: {ack_id: string, receipt_id: string, linked_at: W-CONV-3 timestamp}
    notes: >-
      Teach links the acknowledgment to the receipt it names and keeps it beside that receipt for instructors. One
      acknowledgment per receipt per install: a repeat for a receipt this install already acknowledged answers 200
      with the stored ack_id and linked_at, and Reach adopts them. Teach checks, in order: the receipt exists (404
      not_found); it belongs to the install's student (403 forbidden); the body has exactly the W-RCPT-4 fields, its
      install_id is the authenticated install and its student_id, submission_id and receipt_kind match the stored
      receipt (400 invalid_request); the signature verifies with the install's public key (400 invalid_request);
      receipt_digest equals the W-CONV-4 digest of canonical_json of the receipt body Teach issued, signature included
      (409 conflict). A Teach that predates the route answers 404 not_found, and one whose operator switched
      acknowledgments off (TEACH_RECEIPT_ACKS_DISABLE=1) answers 403 forbidden; Reach keeps the acknowledgment pending
      in both cases and sends it on a later sync.
    errors:
      400 invalid_request: a field outside W-RCPT-4, a field that does not match the receipt or install, or a signature that does not verify
      403 forbidden: not the student's receipt, or acknowledgments are switched off on this Teach
      404 not_found: no receipt by that id
      409 conflict: receipt_digest does not match the receipt Teach issued
      429 rate_limited: over 120 acknowledgments per hour per install
  - id: W-API-HAND
    method: POST
    path: /api/v1/hands
    auth: install
    request_headers:
      Idempotency-Key: Required, as for submissions.
    request:
      cutout_id: string
      slice: {enum: [backend, panel, verification]}
      trigger: {enum: [attempt_gate, attempt_ladder, student_request, check_gate], note: "attempt_ladder since 2026-09-29d; attempt_gate is sent by Reach older than 0.11.0 only"}
      originator: {enum: [agent, student], required: false, note: "since 2026-09-29d; absent means student"}
      summary: {type: string, maxBytes: 2000}
      bundle: W-ENV-1 envelope, header.kind hand_bundle (W-PKG-6 or W-PKG-6-v2)
    response_200: {hand_id: string, state: string}
    notes: >-
      check_gate (since 2026-09-28) is raised by reach submit when reach check still reports findings on a second
      attempt. Since 2026-09-29d Teach keeps originator and the bundle's hand_ref with the hand and shows instructors
      the originator, the attempt count and history, the task, and the code and tests in full. An instructor's reply is
      what resets the slice's attempt ladder (W-QUAL-6).
  - id: W-API-HAND-STATUS
    method: GET
    path: /api/v1/hands/:id
    auth: install
    response_200: {state: string, reply: "object or null"}
  - id: W-API-INTEGRITY
    method: POST
    path: /api/v1/integrity
    auth: install
    request_headers:
      Idempotency-Key: Required, as for submissions.
    request:
      kind: {enum: [vault_tampered, corrupt_mark, foreign_mark, ledger_break, sidecar_conflict, enrolled, directive_dump]}
      detail: {type: string, maxBytes: 2000}
      cutout_id: {type: [string, "null"], required: false}
      slice: {type: [string, "null"], required: false}
      path: {type: [string, "null"], required: false}
      ledger_head: {type: [string, "null"], required: false}
      client_created_at: W-CONV-3 timestamp
    response_200: {event_id: string}
    notes: >-
      Since 2026-09-28. Teach stores the event against the install and student and shows it to instructors only. A
      Teach that predates the route answers 404 not_found, which Reach ignores (never retried, W-ERR-2). Reach sends
      kind enrolled once after every successful enrollment with detail {sidecar_id, prior_install_ids, platform}, so
      installs sharing a sidecar are linked on Teach. Kind directive_dump names a sweep of the private directives
      (three or more distinct within 300 seconds, or every one within an hour). A Reach of revision 2026-09-28b
      counted reads itself and sent the kind; since 2026-09-28c Teach counts the bodies it served (W-API-DIRECTIVE)
      and creates the event itself, at most one per install per hour, and Reach sends none. A Teach that predates
      the kind answers 400 invalid_request, which Reach ignores.
    errors: {429 rate_limited: "over 30 events per hour per install"}
  - id: W-API-DIRECTIVE
    method: GET
    path: /api/v1/directives/<OPCODE>
    auth: install
    query:
      cutout_id: {type: string, required: false}
      slice: {type: string, required: false}
    response_200: {opcode: string, alias: string, rule: string, body: string, digest: string}
    notes: >-
      Since protocol 1 revision 2026-09-28c. The body of one private directive, served for this one request and
      never stored on the install; Reach asks in quick mode (one attempt, two-second timeouts, no retries) and shows
      the table's one-line rule with M-DIRECTIVE-OFFLINE when it cannot. digest is SHA-256 over every row and body
      Teach currently holds, so a change of any directive is visible without a package rebuild. Teach records every
      served body (install, student, opcode, cutout_id, slice, time) and derives directive_dump events from that
      record; the query is covered by the request signature (W-SIG-1), so the cutout and slice are the install's own
      claim, signed. A Teach that predates the route answers 404 not_found; a revoked install is refused as for every
      route.
    errors:
      400 invalid_request: the opcode is not 3 to 10 capitals or digits
      404 not_found: no directive by that opcode
      429 rate_limited: over 60 bodies per hour per install
  - id: W-API-TRANSCRIPT
    method: POST
    path: /api/v1/transcripts
    auth: install
    request_headers:
      Idempotency-Key: >-
        Required. SHA-256 (W-CONV-4) of "<install_id>\n<session_id>\n<first seq>\n<last seq>" for the entries sent.
    request:
      session_id: {type: string, pattern: "^[A-Za-z0-9._:-]{1,128}$", note: "the harness's own session id"}
      harness: {enum: [claude-code, codex, hermes, unknown], note: "hermes since protocol 1 revision 2026-09-29e; a Reach sends hermes only to a Teach whose advertised wire_contract_sha256 equals its own, and unknown otherwise"}
      cutout_id: {type: [string, "null"], maxBytes: 128}
      slice: {type: [string, "null"], enum: [backend, panel, verification, null]}
      entries:
        type: array
        minItems: 1
        maxItems: 200
        items:
          common: >-
            seq (integer, 1 or more, strictly ascending within the array across every kind), at (W-CONV-3 timestamp
            of the capture, or of the harness transcript entry for reply, reasoning and action), kind. Each entry
            carries exactly the keys its kind lists, no others.
          kind: {enum: [prompt, reply, reasoning, action, code], note: "reply, reasoning, action and code since 2026-09-29c"}
          prompt:
            text: {type: [string, "null"], maxBytes: 131072, note: "null when the hook carried no prompt"}
            bytes: integer, the UTF-8 byte size of the whole prompt
            truncated: boolean, true when text holds only the first 131072 bytes
            digest: {type: [string, "null"], note: "W-CONV-4 of the whole prompt's UTF-8 bytes; null when text is null"}
            gate: {enum: [allowed, blocked]}
            note: {type: [string, "null"], maxBytes: 200}
          reply:
            text: "{type: [string, null], maxBytes: 131072}: one block of the AI's visible text, code blocks replaced by pointer lines (W-TRN-3)"
            bytes: integer
            truncated: boolean
            digest: "W-CONV-4 of the whole text as recorded (after code splitting); null when text is null"
            note: {type: [string, "null"], maxBytes: 200}
          reasoning:
            text: "{type: [string, null], maxBytes: 131072}: the model's reasoning where the harness stores it readably; null otherwise"
            bytes: integer
            truncated: boolean
            digest: {type: [string, "null"]}
            note: {type: [string, "null"], maxBytes: 200, note: "'reasoning not readable' when text is null"}
          action:
            tool: {type: string, minBytes: 1, maxBytes: 64}
            summary: {type: string, maxBytes: 2000, note: "the command, path, pattern or input the tool ran with"}
            note: {type: [string, "null"], maxBytes: 200, note: "'subagent' for a subagent's call"}
          code:
            category: {enum: [assignment, extracurricular]}
            scope: "{assignment, cutout_id, slice} (strings of 1 to 128 bytes, slice backend, panel or verification) for assignment; null for extracurricular"
            path: >-
              POSIX path relative to the slice workspace or the extracurricular folder, at most 512 bytes, 1 to 32
              segments, none empty, "." or "..", no leading "/", no backslash or control character. A chat snippet's
              path is snippets/<seq, at least 4 digits>-<n>.<extension>.
            origin: {enum: [ai_write, scan, chat_snippet]}
            deleted: boolean, true when a scan found the file gone (text null, bytes 0, digest null)
            binary: boolean, true when the file's first 8192 bytes hold a NUL byte (text null, digest of the file)
            text: {type: [string, "null"], maxBytes: 131072}
            bytes: integer, the file's whole size
            truncated: boolean
            digest: {type: [string, "null"]}
            note: {type: [string, "null"], maxBytes: 200}
            reply_seq: {type: [integer, "null"], note: "the reply a chat snippet was split from; required for chat_snippet"}
    response_200:
      session_id: string
      accepted: integer, entries appended by this request
      duplicates: integer, entries whose seq Teach already held
      last_seq: integer, the highest seq Teach holds for the session
      gaps: "[[from, to]] seq ranges this request found missing, possibly empty"
    notes: >-
      Since protocol 1 revision 2026-09-29. Reach captures every prompt the student submits in a course workspace
      through the harness's prompt hook (W-TRN-1), including prompts the gate blocks, and sends them with this route.
      Teach appends each new entry to the student's transcript for that session (Teach storage.transcripts) and never
      rewrites one. seq is Reach's per-session counter from 1; an entry whose seq is at or below Teach's last_seq is a
      duplicate and is skipped, which makes a repeated request harmless whatever its Idempotency-Key; an entry more
      than one above last_seq records the missing range as a gap in the transcript. Teach checks digest against text
      when truncated is false and answers 400 invalid_request when they differ. A Teach that predates the route answers
      404 not_found, and one whose operator switched transcripts off answers 403 forbidden; Reach keeps every entry
      queued in both cases and sends it later. Since revision 2026-09-29c the route also carries the AI's side of the
      session and the code it writes (W-TRN-3, W-TRN-4): Teach keeps every kind in the student's subcorpus (W-TRN-5),
      and Reach sends only the kinds GET /api/v1/status lists (W-TRN-2).
    errors:
      400 invalid_request: a field outside the schema, entries out of order, a digest that does not match its text, or an unsafe code path
      403 forbidden: transcripts are switched off on this Teach (TEACH_TRANSCRIPTS_DISABLE=1)
      413 too_large: the body is over 1 MiB, or storing it would take the student's subcorpus over its limit
      429 rate_limited: over 120 requests per hour per install
  - id: W-API-HEALTH
    method: GET
    path: /api/v1/health
    auth: none
    response_200: {status: "ok | degraded", database: boolean, blob_store: boolean}
receipts:
  W-RCPT-1:
    name: body
    fields:
      receipt_id: string
      kind: "ingest | grade | validation"
      submission_id: string
      student_id: string
      cutout_id: string
      slice: string
      assignment: string
      issued_at: W-CONV-3
      signing_key_id: string (new in protocol 1)
      received_at: ingest only
      content_digest: ingest only
      file_list: ingest only
      late: ingest only, boolean
      scenarios: "grade only, [{name, result: passed|failed|skipped, reason?}]"
      score: grade only, number 0-1
      suite_version: grade only
      fixture_version: grade only
      validated_by: validation only
      note: validation only
      supersedes: optional
      signature: W-CONV-5 base64
  W-RCPT-2:
    name: signature
    rule: W-CONV-6 by the key named in signing_key_id over canonical_json(body without the signature key).
  W-RCPT-3:
    name: what Reach shows
    rule: >-
      Received: slice, cutout_id, received_at in the student's local time as "%a %-d %b %-l:%M %P", receipt_id.
      Graded: passed = the number of scenarios whose result is "passed", total = the number of scenarios.
  W-RCPT-4:
    name: acknowledgment (receipt of a receipt)
    since: 2026-09-30
    fields:
      schema: '"reach.receipt-ack/v1"'
      ack_id: '"rack_" followed by 20 lowercase hexadecimal characters'
      receipt_id: the acknowledged receipt's receipt_id
      receipt_kind: the acknowledged receipt's kind
      submission_id: the acknowledged receipt's submission_id
      student_id: the acknowledged receipt's student_id
      install_id: the install that verified the receipt
      receipt_digest: W-CONV-4 digest of canonical_json(the receipt body as received, signature included)
      receipt_signing_key_id: the acknowledged receipt's signing_key_id
      acknowledged_at: W-CONV-3 timestamp
      reach_version: string
      signature: W-CONV-5 base64 of W-CONV-6 by the install's private key over canonical_json(body without the signature key)
    rule: >-
      Reach writes one acknowledgment for every receipt it verifies and stores, whichever route brought the receipt
      (the submit response, a grade poll, or a sync backfill), and never for a receipt that fails verification. It
      keeps the acknowledgment on disk beside the receipt with a local state of pending, linked (Teach answered 200;
      linked_at recorded), mismatch (Teach answered 409) or refused (Teach answered 400), and sends pending ones
      through W-API-RECEIPT-ACK. A new install acknowledges again with its own install_id. The pair, Teach's signed
      receipt and Reach's signed acknowledgment, proves on both machines that the receipt was issued and that the
      student's install received the same bytes.
errors:
  W-ERR-1:
    shape: '{"error": {"code": <code>, "message": <text>}, "request_id": <hex>}'
  W-ERR-2:
    codes:
      invalid_request: {status: 400, reach: "never retried; shown as the reason"}
      unauthenticated: {status: 401, reach: "never retried; M-AUTH-FAILED (clock or key)"}
      forbidden: {status: 403, reach: "never retried"}
      not_enrolled: {status: 403, reach: "never retried; the install is marked revoked; M-GATE-REVOKED"}
      revoked: {status: 403, reach: "never retried; the install is marked revoked; M-GATE-REVOKED"}
      not_released: {status: 403, reach: never retried}
      deadline_passed: {status: 403, reach: never retried}
      not_found: {status: 404, reach: "never retried"}
      conflict: {status: 409, reach: never retried}
      too_large: {status: 413, reach: never retried}
      rate_limited: {status: 429, reach: "retried after Retry-After seconds, within the retry budget"}
      internal: {status: 500, reach: retried}
      reach_outdated: {status: 400, reach: "never retried; the message names the Reach version and the minimum and is shown as the reason (since revision 2026-09-29c, at enrollment)"}
      unavailable: {status: 503, reach: "retried after Retry-After seconds, within the retry budget; since revision 2026-09-29d, sent when an operator has switched a feature off"}
    rule: Reach branches on error.code, never on the HTTP status alone, because five codes share 403.
compatibility:
  W-COMPAT-1:
    rule: >-
      Teach reports minimum_reach_version (default "0.2.0"). A Reach older than that blocks course work with
      M-REACH-OUTDATED and keeps working for enrollment, sync and status.
  W-COMPAT-2:
    rule: >-
      Teach reports wire_contract_sha256, the W-CONV-4 digest of the bytes of its specs/wire.yml. Reach computes the same
      digest of its own specs/wire.yml; reach doctor reports R-DOC-WIRE when they differ.
  W-COMPAT-3:
    rule: Protocol 1 does not interoperate with Reach 0.1.0 or Teach 0.1.0.
reach_client_safety:
  W-SAFE-1: {name: timeouts, rule: "connect 5 s, read 30 s, upload read 120 s; quick mode (hooks) connect 2 s, read 2 s, no retries"}
  W-SAFE-2: {name: rate limit, rule: "a token bucket of 20 requests per minute shared by every Reach process on the machine through ~/.reach/state/bucket.json under an exclusive file lock; Teach allows 30"}
  W-SAFE-3: {name: retries, rule: "at most 4 retries, exponential backoff with full jitter (1 s base, 30 s cap), Retry-After honoured up to 60 s; only codes W-ERR-2 marks retried, plus connection failures and timeouts; a fresh nonce and timestamp on every attempt"}
  W-SAFE-4: {name: circuit breaker, rule: "five consecutive failures open the breaker for 60 s; while open, calls raise Reach::Offline at once"}
  W-SAFE-5: {name: kill switch, rule: "REACH_OFFLINE=1 stops every network call"}
  W-SAFE-6: {name: polling, rule: "grade receipts no more often than every 30 s and hand replies no more often than every 60 s, only while one is outstanding"}
  W-SAFE-7: {name: logging, rule: "every request is logged to ~/.reach/logs/requests.jsonl with method, route, status, latency and retry count; never bodies, headers or keys"}
  W-SAFE-8: {name: integrity events, rule: "sent in quick mode with no retries and queued in the outbox when they fail; each distinct (kind, path, detail) is sent at most once per install"}
  W-SAFE-10: {name: qualifications, rule: "since 2026-09-29d: one POST per reach qualify that reaches the remote step, then GET /api/v1/qualifications/:id no more often than every 10 s and at most 36 times; still pending after that leaves the record pending_remote and a later reach qualify with unchanged files resumes polling the same id"}
  W-SAFE-11: {name: receipt acknowledgments, rule: "since 2026-09-30: no polling; one POST in normal mode right after a receipt is stored by reach submit or a grade poll, and reach sync sends at most 20 pending acknowledgments and reads at most 5 pages of W-API-RECEIPTS; a network failure, 403 or 404 keeps the acknowledgment pending"}
  W-SAFE-9: {name: transcripts, rule: "the prompt hook only writes the local spool and makes no network call; the turn-end hook sends in quick mode at most 3 requests and at most once every 60 s, the session-end hook sends in quick mode at most 3 requests without that spacing, and reach sync or reach transcript flush sends in normal mode at most 50 requests; each request carries at most 200 entries and 900000 bytes of JSON; a failure stops the flush and keeps every entry queued"}
transcripts:
  W-TRN-1:
    name: capture
    rule: >-
      Reach's prompt hook (UserPromptSubmit on Claude Code and Codex) runs in every course workspace. Before anything
      else it appends the prompt to ~/.reach/transcripts/<session_id>.jsonl (0600, directory 0700) with the next seq
      for that session and gate allowed or blocked by the gate's own verdict; an allowed prompt is also witnessed in the
      slice ledger as a prompt record {session, seq, digest}. A hook payload without a prompt is still recorded, with text null and a
      note. A prompt larger than 131072 bytes keeps its first 131072 bytes, cut on a character boundary, with truncated
      true; bytes and digest describe the whole prompt. Harnesses with no prompt hook (Antigravity) and conversations
      outside course folders are not captured. Since 2026-09-29c the course folders are every slice workspace under
      <workspace root>/deliverables/, the student's <workspace root>/extracurricular/ folder and the workspace root
      itself, each with its own hooks, and every spooled entry records its space (slice, extracurricular or root).
  W-TRN-2:
    name: delivery
    rule: >-
      Entries are sent oldest session first, in seq order, through W-API-TRANSCRIPT. Reach records the last_seq Teach
      returns as acknowledged and never sends an acknowledged entry again. The entries of a request Teach refuses with
      invalid_request or too_large are copied to ~/.reach/transcripts/<session_id>.rejected.jsonl and counted as
      acknowledged, so a malformed request cannot block the queue; every other refusal and every network failure
      leaves the queue as it was. Since 2026-09-29c Reach sends, per session, only the longest run of unacknowledged
      entries whose kinds GET /api/v1/status lists under transcripts.kinds ([prompt] when absent); the session waits at
      the first entry of another kind until Teach accepts it, and the other sessions go on.
  W-TRN-3:
    name: AI output
    rule: >-
      Since 2026-09-29c. At every PostToolUse write hook and at the end of every turn (Stop, and SessionEnd on Claude
      Code), Reach reads the harness's own session transcript (the hook payload's transcript_path) from where it last
      stopped and records, in file order, each block of the AI's visible text as a reply, each reasoning block as
      reasoning (text null with a note when the harness stores it unreadably), and each tool call as an action. Before
      a reply is recorded, every fenced code block in it is replaced by the line
      "[code <reply seq>.<n> -> <category root>/snippets/<seq, 4 digits>-<n>.<ext>]" and recorded as a code entry with
      origin chat_snippet, category root being deliverables/<assignment>/<cutout_id>-<slice> in a slice and
      extracurricular otherwise. Claude Code transcript entries are deduplicated by uuid; Codex rollouts by offset.
      Since 2026-09-29e, Hermes has no transcript_path: Reach records the prompt from the pre_llm_call payload's
      extra.user_message, the reply from the post_llm_call payload's extra.assistant_response, and each tool call as an
      action from the post_tool_call payload's tool_name and tool_input; Hermes hook payloads carry no reasoning, so a
      Hermes session records no reasoning entries.
  W-TRN-4:
    name: code
    rule: >-
      Since 2026-09-29c. After every AI write (PostToolUse on the write tools and apply_patch) Reach records each
      written file inside the session's slice owned files or the extracurricular folder as a code entry with origin
      ai_write, holding the whole file as it is after the write. At the end of every turn it compares the session's
      space (a slice's owned files; every file in the extracurricular folder except Reach's own rules and harness
      files and the .git, node_modules, vendor, .bundle and tmp directories) with the digests it last recorded, and
      records each changed or new file with origin scan and each vanished file as deleted. Category assignment carries
      the slice's scope; extracurricular carries none.
  W-TRN-5:
    name: subcorpus
    rule: >-
      Since 2026-09-29c. Teach keeps each student's subcorpus at TEACH_HOME/subcorpora/<course>/<student dir>/:
      chats/ (the per-session transcript, every kind in seq order, as .md and .jsonl), deliverables/<assignment>/
      <cutout_id>-<slice>/ and extracurricular/ (mirrors holding each file's latest version at the student's
      relative path, snippets included), and history/deliverables.jsonl and history/extracurricular.jsonl (every code
      entry with its content, append-only). Teach refuses a code path that would leave its category root or cross a
      symlink.
qualification:
  W-QUAL-1:
    name: what a qualification proves
    since: 2026-09-29d
    rule: >-
      Before a slice is submitted, the agent proves it with scenarios of its own: at least one scenario, tagged with
      the marker's qualify.tag, for every graded scenario name in the marker's scenarios (same name, exact text), plus
      any edge cases it chooses, under the workspace's qualify/features, with step files under qualify/step_definitions.
      They must pass on the slice, fail on the starting copies, and the instructors' graded scenarios must pass on
      Teach. The agent never reads the graded scenarios' steps; it has their names, the slice API and the qualify kit.
  W-QUAL-2:
    name: local steps (Reach)
    rule: >-
      reach qualify runs, in order, stopping at the first that fails: check (reach check reports nothing on the owned
      files), coverage (every graded name appears as a scenario name under qualify/features on a scenario carrying
      qualify.tag; a missing name is QF-UNCOVERED), and when qualify.local is true local_pass and local_stub. The local
      run directory holds qualify/kit/** at the same paths, the owned files over it, qualify/features/** under
      features/agent/ and qualify/step_definitions/** under features/step_definitions/; the command is bundle exec
      cucumber --format json --tags <qualify.tag> from its root, with gems as W-RUN-1. local_pass needs every scenario
      to pass (QF-LOCAL-FAIL names each that did not); local_stub runs again with the starting copies of the owned
      files (the workspace package's entries) in their place and needs every covered scenario to fail (QF-VACUOUS names
      each that passed).
  W-QUAL-3:
    name: Teach's runs
    rule: >-
      Teach runs three passes in its grading sandbox for one qualification, on its grading image for Ruby 4.0 only.
      agent: the course build the grading run uses (the module's library, fixtures and application for a backend
      slice; the module's reference build for a panel slice), the course repository's features/support/**, the
      agent's features under features/agent/ and its step files under features/step_definitions/, the owned files laid
      over; bundle exec cucumber --format json --tags <qualify.tag>. stub: the same with the course repository's
      stubs/<owned path> laid over instead (a path with no stub is removed). hidden: the graded run of W-RUN-1 exactly
      as grading runs it, including the panel shape check that fails every row with reason shape_violation. The run
      directory of the agent and stub passes never holds the course's feature files or module step files.
  W-QUAL-4:
    name: verdict
    rule: >-
      A qualification passes when every step of W-QUAL-2 passed, every agent row passed, every stub row whose name is a
      graded name failed (QF-VACUOUS otherwise), and every hidden row passed (QF-HIDDEN, shown with the scenario name
      and the plain reason only). An agent row that did not pass is QF-REMOTE-FAIL. A qualification whose remote step
      could not run (REACH_OFFLINE=1, Teach unreachable, 503, or still pending after W-SAFE-10) is pending_remote: not
      passed and not a failed attempt.
  W-QUAL-5:
    name: record
    rule: >-
      Reach writes {slice, attempt, at, files_digest, tests_digest, steps: {id: {ran, passed, rows}}, passed, pending,
      qualification_id} to .reach/qualification.json in the workspace, to the course record (kind qualification) and
      as a qualify ledger record. files_digest is the W-CONV-4 digest of canonical_json of {owned path: digest or null};
      tests_digest the same over the qualify/ paths sent. reach submit refuses unless the latest record passed and both
      digests equal the workspace's current ones (M-SUBMIT-UNQUALIFIED), and sends that record as
      evidence/qualification.json.
  W-QUAL-6:
    name: attempt ladder
    rule: >-
      Per slice, Reach counts failed qualifications since the last pass or the last instructor reply to the slice's
      open agent hand. 1: silent. 2: M-LADDER-NOTICE, which the agent tells the student before trying again. 3: Reach
      raises a W-PKG-6-v2 hand with originator agent and trigger attempt_ladder and shows M-LADDER-HAND; from then on
      reach qualify and writes to the owned files and qualify/ are refused with M-LADDER-ASK until reach attempts
      continue records the student's yes, which it accepts only when the transcript spool holds a prompt from the
      student captured after the hand was raised. 4 to 9: M-LADDER-CONTINUE before each try. 10: M-LADDER-STOPPED;
      reach qualify and those writes are refused until an instructor replies to the hand. A pass or an instructor's
      reply seen by reach sync or the hand poll resets the count to zero.
seal:
  W-SEAL-1:
    name: marks in files
    rule: >-
      Reach keeps a carrier line in every owned .rb and .svelte file: for Ruby, line 1 "# frozen_string_literal: true"
      and line 2 "# reach <cutout_id> <slice> " followed by the payload; for Svelte, line 1 "<!-- reach <cutout_id>
      <slice> " + payload + " -->". The payload is U+2060, then the mark's 64 bits most significant first as U+200B (0)
      or U+200C (1), then U+2060. Reach rewrites a file only when the carrier is absent or its payload is not the
      expected mark, never when it decodes to a different valid mark (a foreign mark is kept as evidence).
  W-SEAL-2:
    name: witness ledger
    rule: >-
      One JSON record per line per slice: {n, at, kind, ...fields, gv, prev, tag}. gv is the guardrails version whose
      ledger_key signed the record (null with a local key). prev is the previous record's tag ("" for n = 1). tag is
      HMAC-SHA256(ledger_key, canonical_json(record without tag)) as 64 hex characters. Kinds: session {harness},
      prompt {session, seq, digest} (the transcript entry it witnesses, W-TRN-1; since 2026-09-29, and fieldless
      before), write {path, before, after}, shell {command_digest, head}, check {changed, findings}, shape {findings},
      tips {passed, total, timed_out} (before 2026-09-29d), directive {opcode, tier}, plan {action}, checkpoint {n,
      note_digest, automatic}, restore {n}, mark_restored {path}, integrity {kind, path}, submit {manifest_digest},
      and since 2026-09-29d qualify {attempt, passed, pending, files_digest, tests_digest, qualification_id} and
      ladder {failed, action} where action is notice, hand, consent, stopped or reset.
  W-SEAL-3:
    name: vault manifest
    rule: >-
      At unpack Reach writes .manifest.json {entry: digest} beside the guardrails entries and recomputes it on every load;
      a mismatch is reported as integrity kind vault_tampered with the entry names and changes nothing the student sees;
      reach sync re-unpacks the signed package whenever the manifest disagrees.
  W-SEAL-4:
    name: Teach provenance verdict
    rule: >-
      For each submitted file: own when its payload decodes to the mark Teach computes for this install, foreign:<install>
      when it decodes to another install's mark for the same path, missing, corrupt, or unmarked for a kind Reach never
      stamps; witnessed when the submitted digest equals the last write.after for the path in the verified ledger tail.
      The ledger tail is verified record by record with the key derived from each record's gv; broken:<n> names the
      first record whose tag or prev fails; unverifiable when the manifest says ledger_key local; absent when no tail was
      sent. rules_current is whether seal.guardrails_version equals the latest guardrails package for the student. The
      summary is clean when every file is own and witnessed, the ledger is verified and the rules are current;
      otherwise review with the reasons listed.
