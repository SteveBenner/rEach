schema: rcorpus.kinds/v1
kinds:
  - kind: note
    required_fields: [text, at]
    description: A free-text note the student or the agent kept about the work.
  - kind: tip
    required_fields: [text, at]
    description: A tip kept for later, with the slice and source it came from when known.
  - kind: attempt
    required_fields: [finding_id, slice, resolved, at]
    description: One attempt at resolving a finding in a slice.
  - kind: receipt
    required_fields: [receipt_id, receipt_kind, at]
    description: A signed course-server receipt; its own kind is kept as receipt_kind.
  - kind: qualification
    required_fields: [slice, attempt, passed, at]
    description: One qualification run of a slice, pending or settled.
  - kind: source
    required_fields: [path, source_digest]
    description: One captured conversation turn or note the brain learned from.
  - kind: finding
    required_fields: [claim, evidence, source_id, source_digest]
    text_fields: [category, claim, evidence]
    novelty: { duplicate: 0.85, related: 0.5, scope: category }
    budget: { per_hour: 30, per_day: 150 }
    description: One durable thing the partner learned about the student or their work.
graph:
  node_kinds: [source, finding]
  relations: []
open: false
