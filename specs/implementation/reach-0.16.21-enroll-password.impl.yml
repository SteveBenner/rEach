schema: rstack.impl/v1
id: reach-0.16.21-enroll-password
component: reach
version: 0.16.21
wire_revision: 2026-10-01e
contract:
  - specs/wire.yml W-API-ENROLL (request.password, errors 400 password_required) and W-ENR-7 (awaiting_password, awaiting_password_again, Hermes, reach enroll)
  - specs/app.yml STD-ENROLL-PASSWORD
  - reach.spec.yml commands.enroll synopsis (--password-stdin)
counterpart: teach 0.17.0, blueprint teach/specs/implementation/teach-0.17.0-enroll-password.impl.yml; the two specs/wire.yml copies are byte-identical and must stay so
rules:
  - No code comments of any kind. No new test files. Ruby 2.6.10 syntax floor for everything under lib/ and exe/ (no endless methods, no pattern matching, no numbered block params, no hash shorthand).
  - Never write the password, or anything derived from it other than the salted SHA-256 below, to disk, logs, transcripts, the brain spool, error messages or hook output.
  - Do not edit specs/wire.yml, specs/app.yml or reach.spec.yml; they are final. Do not bump versions or edit CHANGELOG, FEATURES, README or TODO.
slices:
  - id: flow
    owns_paths: [lib/reach/enroll_flow.rb]
    build:
      - step_confirm on yes no longer calls register. When harness is "hermes" it returns M-ENR-PASSWORD-TERMINAL (command: Reach::Runtime.hook_command("enroll")) and leaves the flow in awaiting_confirm. Otherwise it writes state awaiting_password and returns M-ENR-ASK-PASSWORD.
      - step_move on yes writes state awaiting_password (keeping the pending key and fingerprint, which Reach::Enroll keeps on its own) and returns M-ENR-ASK-PASSWORD; no and other answers are unchanged.
      - New state awaiting_password, handled by step_password(flow, text) in the step case statement. password = text.to_s.strip. If password.length < 8 or > 256 return M-ENR-PASSWORD-SHORT and stay. Otherwise salt = SecureRandom.hex(16), store "password_salt" => salt and "password_sha256" => OpenSSL::Digest::SHA256.hexdigest(salt + password) in the flow, state awaiting_password_again, and return M-ENR-ASK-PASSWORD-AGAIN.
      - New state awaiting_password_again, handled by step_password_again(flow, text, now, harness). Compare SHA256(salt + text.strip) to the stored digest with a constant-time comparison (OpenSSL.fixed_length_secure_compare when defined, else Rack-style manual compare). On mismatch drop password_salt and password_sha256, state awaiting_password, return M-ENR-PASSWORD-MISMATCH. On match call register(flow, now, harness, password).
      - register gains a password argument and passes password: to Reach::Enroll.register_v2. Before every return from register, write the flow without password_salt and password_sha256 (or remove the flow file on success as today). enrollment_refused still returns to awaiting_username; device_move_pending still goes to awaiting_move.
      - RESTART_WORDS keep working from both new states and drop the digest. The restart check runs before the state dispatch today; keep that, so "cancel" typed as a password restarts rather than being taken as a password. Crisis matching also stays first.
      - ask(flow) (used by next_message and safe_ask) maps awaiting_password to M-ENR-ASK-PASSWORD and awaiting_password_again to M-ENR-ASK-PASSWORD-AGAIN.
      - On a 400 password_required from Teach (Reach::RemoteRefused code "password_required") return M-ENR-FAILED with the Teach message and return the flow to awaiting_password without the digest.
  - id: enroll-and-cli
    owns_paths: [lib/reach/enroll.rb, lib/reach/cli.rb]
    build:
      - Reach::Enroll.register_v2 takes password: (keyword, required). body_fields gains "password" => password. Nothing else in Reach stores it; save_pending must not store it.
      - cmd_enroll parses a boolean --password-stdin flag (parse_flags takes value flags; add the boolean the way other boolean flags are handled in cli.rb). It is listed in help as part of the --course-code line and in the usage line.
      - enroll_with_identity gets the password after the student id. Interactive (no --course-code, STDIN is a TTY): print M-ENR-ASK-PASSWORD, read with STDIN.noecho(&:gets) (require "io/console"), strip, re-ask on M-ENR-PASSWORD-SHORT; then print M-ENR-ASK-PASSWORD-AGAIN, read the same way, and on mismatch print M-ENR-PASSWORD-MISMATCH and start the password step over. Print a newline after each hidden read. With --password-stdin read one line from STDIN, strip, and exit 1 with M-ENR-PASSWORD-SHORT when it is out of range. Non-interactive without --password-stdin and STDIN not a TTY: warn "reach: enroll needs --password-stdin when it is not run in a terminal" and exit 1.
      - On RemoteRefused "password_required" warn the Teach message and exit 1.
      - finish_enroll prints M-ENR-PASSWORD-REMINDER after its existing output when the enrollment was shape v2.
      - Shape v1 (reach enroll <code>) is unchanged.
  - id: messages
    owns_paths: [locales/en-US.yml]
    build:
      - "M-ENR-ASK-PASSWORD: \"Last step: choose a password for rEach, at least 8 characters, and type it here. Write it down somewhere safe now; you will need it, and nobody can look it up for you. Only you and the course server get it, and the AI never sees what you type.\""
      - "M-ENR-ASK-PASSWORD-AGAIN: \"Please type the same password again, to make sure it is right.\""
      - "M-ENR-PASSWORD-SHORT: \"That password is too short. Please choose one with at least 8 characters (and no more than 256).\""
      - "M-ENR-PASSWORD-MISMATCH: \"The two passwords didn't match. Please choose your password again.\""
      - "M-ENR-PASSWORD-TERMINAL: \"To choose your password privately, finish enrolling in a terminal: run {command} enroll and answer its questions there. Your typing stays hidden and the AI never sees it.\""
      - "M-ENR-PASSWORD-REMINDER: \"Keep the password you chose written down somewhere safe.\""
      - M-ENR-DONE gets one extra sentence at its start or end saying to keep the password written down somewhere safe; keep every existing placeholder.
      - Place the new ids next to the other M-ENR-* ids. Every id must be referenced by code.
  - id: fixtures
    owns_paths: [tools/fake_teach/server.rb, tools/fake_teach/README.md, tools/platform_smoke/run.rb, tools/smoke/assignment_one.rb, docs/smoke-assignment-1.md, specs/implementation/platform-smoke.impl.yml]
    build:
      - fake_teach answers a shape v2 enroll whose password is missing or not 8 to 256 characters with 400 {"error":{"code":"password_required","message":"..."}} before it checks the course code; it never logs or stores the password.
      - Every scripted shape v2 enrollment (platform smoke step at tools/platform_smoke/run.rb around line 394, anything else found by grep for "--course-code") passes --password-stdin with a fixed test password on stdin. Shape v1 callers stay as they are.
      - fake_teach README example and docs/smoke-assignment-1.md step that enrolls mention the password step in one short clause.
acceptance:
  - ruby -c passes on every changed .rb file, and under docker image ruby:2.6.10-slim for lib/ and exe/.
  - ruby tools/platform_smoke/run.rb reports 0 failed (it installs from the committed tree, so commit on the branch first; never push).
  - "Driving reach gate enroll --harness claude-code in a scratch HOME against tools/fake_teach: code, username, id, yes, a 7-char password (M-ENR-PASSWORD-SHORT), a valid password, a different one (M-ENR-PASSWORD-MISMATCH), the password twice, then enrolled with M-ENR-DONE; the flow file never contains the password at any point (grep the scratch HOME for it after each step); --harness hermes at the confirm yes answers M-ENR-PASSWORD-TERMINAL."
  - echo password | reach enroll --course-code ... --username ... --student-id ... --password-stdin enrolls against fake_teach; without the flag and with stdin not a TTY it exits 1 with the stated warning.
  - grep -rn for the test password across the scratch HOME after enrollment finds nothing.
