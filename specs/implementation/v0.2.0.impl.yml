    depends_on: []
    deliverable: Reach's half of protocol 1 (specs/wire.yml), interoperating with Teach 0.2.0 end to end.
    detail:
      errors: "Add RemoteRefused per interface_contract. Keep every other class."
      paths: "Add the interface_contract helpers."
      messages: "Add rejection_fix and local_time. local_time uses Time.parse for timestamps and Date.strptime(value, '%Y-%m-%d') (require 'date') for dates; render dates via Date#strftime('%a %-d %b')."
      locales_en_us: |
        Rewrite locales/en-US.yml with schema, locale and failure_reasons unchanged, and exactly these messages and rejection_fixes:
          M-GATE-NOENROL: "rEach isn't connected to your course yet. Run reach enrol with the code your instructor gave you."
          M-GATE-NOGUARD: "Your course rules haven't arrived yet, so rEach can't start on course work. Run reach sync, and if that doesn't work, tell your instructor."
          M-GATE-OLDGUARD: "Your course rules have an update. Run reach sync to get it, then try again."
          M-GATE-REVOKED: "This computer's rEach was switched off by your instructor. Ask them for a new enrolment code."
          M-GATE-STALE: "rEach hasn't been able to check in with your course for over a day. Connect to the internet and run reach sync."
          M-REACH-OUTDATED: "This version of rEach ({version}) is too old for your course, which needs {minimum} or newer. Update rEach, then try again."
          M-AUTH-FAILED: "Your course server didn't accept rEach's signature. Check that your computer's clock is right, then run reach sync. If it keeps happening, tell your instructor."
          M-ENROL-REFUSED: "That enrolment code wasn't accepted. Check it's typed correctly, or ask your instructor for a new one."
          M-ENROL-DONE: "You're connected to {course}. rEach is fetching your course materials now."
          M-WRITE-OUTSIDE: "That file belongs to the course and can't be changed. Your work goes in {owned_files}."
          M-SHELL-BLOCKED: "That command would change files outside your slice, so rEach stopped it."
          M-SHAPE-VISIBLE: "The design you asked for would break how your panel fits with the others ({plain_reason}). Here are some ways to get close to it that fit."
          M-HAND-RAISED: "rEach got stuck on the same problem three times, so it asked your instructors for help. You'll see their answer here."
          M-SUBMIT-RECEIVED: "Your {slice} work for {cutout} was received at {time}. Receipt {receipt_id}."
          M-SUBMIT-PENDING: "Your submission hasn't been received yet. rEach will keep trying; keep your computer online."
          M-SUBMIT-REJECTED: "Your submission wasn't accepted: {reason}. {fix}"
          M-GRADED: "Your {slice} work for {cutout} was graded. {passed} of {total} checks passed."
          M-DEADLINE-24H: "{cutout} ({slice}) is due in 24 hours and hasn't been submitted yet."
          M-OFFLINE: "rEach can't reach the course server right now. You can keep working; submissions will be sent when you're back online."
          M-TIPS-INCOMPLETE: "The tips suite for this slice isn't complete yet, so rEach can't run it. Your instructors will publish it; run reach sync later."
        rejection_fixes:
          invalid_request: "Run reach sync, then try submitting again. If it still fails, ask rEach to raise a hand."
          forbidden: "Check that you're submitting your own slice for the current assignment."
          not_released: "This assignment hasn't been released yet."
          deadline_passed: "The window for resubmitting has closed; talk to your instructor."
          too_large: "Your files are larger than the course allows (5 MB)."
          default: "Try again in a few minutes. If it keeps failing, tell your instructor."
      wire: "Reach::Wire per interface_contract. The path is File.expand_path('../../specs/wire.yml', __dir__)."
      tarball: "W-TAR-1..5 exactly. Writer: Gem::Package::TarWriter into a StringIO wrapped by Zlib::GzipWriter, add_file(name, 0o644) per entry in order; binary strings (force_encoding ASCII-8BIT on read). Reader: detect gzip by the first two bytes, Gem::Package::TarReader, skip entry.directory?, refuse entry.symlink? and any typeflag other than '0' or \"\\0\" (regular) or '5' (directory), refuse names per W-TAR-2, count entries and bytes against W-TAR-4, raise Reach::VerificationFailed('reach: package archive rejected (<reason>)')."
      crypto: |
        Rewrite to W-CONV-2, W-CONV-6 and W-ENV-2..4. salt_length 32 on both sign_pss and verify_pss. canonical_json per W-CONV-2.
        seal(header:, plaintext:, recipient_public_key:, signer_private_key:):
          header = header.merge('content_digest' => digest_hex(plaintext)); aad = canonical_json(header);
          cipher aes-256-gcm, random_key, random_iv (12 bytes), auth_data = aad; wrapped = recipient.public_encrypt(key, OpenSSL::PKey::RSA::PKCS1_OAEP_PADDING);
          signature = sign_pss(signer, aad + digest_hex(ciphertext)); return {'header','wrapped_key','nonce','ciphertext','tag','signature'} with base64 fields.
        open_envelope(envelope, expected_kind:, expected_student_id:, recipient_private_key:, signer_public_key_for:) follows W-ENV-4 in order and raises Reach::VerificationFailed with a short reason at the first failure; the signer key is signer_public_key_for.call(header['signing_key_id']).
        sign_request(private_key, method:, target:, timestamp:, nonce:, body:) -> strict base64 of sign_pss over [method.upcase, target, timestamp, nonce, digest_hex(body.to_s)].join("\n").
      client: |
        Rewrite per W-AUTH-1..3 and W-SAFE-1..7.
        - Build the URI as the base URL (install teach_url, trailing '/' stripped) + path + ('?' + query_string when query is non-empty), query_string = URI.encode_www_form(query). The signed TARGET is path + the same '?query_string'. Never sign the base URL's own path prefix.
        - Headers on signed requests: X-Teach-Install, X-Teach-Timestamp (W-CONV-3), X-Teach-Nonce (SecureRandom.hex(16)), X-Teach-Signature. A fresh timestamp, nonce and signature on every attempt.
        - Content-Type application/json and Accept application/json on POST; Idempotency-Key when given.
        - Timeouts per W-SAFE-1 (quick mode: open 2, read 2, zero retries, and a bucket wait longer than 0.5 s raises Reach::Offline).
        - The shared token bucket (W-SAFE-2) in Paths.bucket_file: JSON {"tokens": Float, "updated_at": Float}; open with File::RDWR|File::CREAT, flock(File::LOCK_EX), refill at 20/60 tokens per second up to 20, take one, write, unlock; when empty, unlock, sleep the time until one token, and try again.
        - Retries per W-SAFE-3 on 408, 425, 429, 500, 502, 503, 504, on Errno::ECONNREFUSED/ECONNRESET/EHOSTUNREACH, Net::OpenTimeout, Net::ReadTimeout, SocketError, OpenSSL::SSL::SSLError, EOFError. Retry-After (integer seconds) is honoured up to 60 s.
        - Status < 400 (including 304) returns a Response. Any other status: parse the W-ERR-1 body; a code Reach never retries raises RemoteRefused(code, status, message); a retried code after the last attempt raises NetworkError.
        - The circuit breaker is per process (W-SAFE-4).
        - Log per W-SAFE-7 (append one JSON line; swallow logging failures).
        - REACH_OFFLINE=1 raises Reach::Offline before any work.
      packages: |
        Reach::Packages.new (no arguments; reads the install and key itself).
        - fetch(kind) -> :updated | :current | :absent. GET /api/v1/packages/<kind> with If-None-Match set to '"' + content_digest of the newest stored envelope + '"' when one exists. 304 -> :current. 404 not_found (RemoteRefused) -> :absent. 200 -> open the envelope fully (verify, decrypt, digest; W-KEY-4 key lookup, refreshing status once via Reach::Sync.refresh_status on an unknown key_id), then write the envelope JSON to packages/<kind>/<header.version>.pkg -> :updated. Never store an envelope that fails to open.
        - latest_version(kind) -> Integer or nil (from the .pkg file names); stored_envelope(kind, version) -> Hash; open(kind, version) -> [header, entries] (entries from Reach::Tarball.read); unpack(kind, version, into:) -> removes `into` and recreates it (mode 0700), writes every entry beneath it, returns `into`.
        - expected_student_id is install student_id; expected_kind is the kind.
      enrol: |
        W-API-ENROL. POST with Client.anonymous(teach_url): {code, public_key_pem (the new key's public PEM), reach_version (Reach::VERSION), platform (Enrol.platform), ruby_version (RUBY_VERSION)}.
        Write the private key (0600) only after a 200, then install.yml (0600) with the interface_contract keys. Paths.ensure_home! first.
      sync: |
        run:
          1. Enrol.current or raise Reach::Refused(M-GATE-NOENROL text).
          2. Submit.retry_outbox (count successes into outbox_sent); Hands retry of queued hands happens inside retry_outbox (both share the outbox).
          3. refresh_status. On Offline/NetworkError: state 'offline' and continue with stored packages. On RemoteRefused revoked/not_enrolled: state 'revoked', return at once.
          4. For each kind in guardrails, shape, workspace, suite that status.packages lists: Packages#fetch(kind) (skip when offline). Record each kind's newest stored version in packages.
          5. Guardrails.ensure_current; unpack the newest shape package into Paths.shape_vault_dir when its version changed (marker file .version inside the dir).
          6. Workspace.provision_from_package when a workspace package is stored.
          7. Hands.poll_replies (skip when offline).
          8. Return the summary; warnings collects one plain line per skipped or failed step.
        refresh_status(quick:): GET /api/v1/status via Client.for_install(quick:), write the cache with fetched_at, then Enrol.update! with signing_public_keys, encryption_key, minimum_reach_version, wire_contract_sha256, last_checked_at, revoked false.
      guardrails: |
        W-PKG-1 + W-RENDER-1. ensure_current unpacks the newest stored guardrails package into Paths.guardrails_vault_dir when the version marker (.version) differs. load reads directives.yml, course.yml, tips.yml (YAML.safe_load) and the version marker. render_rules builds W-RENDER-1 exactly (directives filtered as described there).
      workspace: |
        W-PKG-2, W-PROV-1, W-PROV-2.
        - provision_from_package: open the newest workspace package, read slices.json, and for each slice: target = Paths.workspace_path(course, assignment, cutout_id, slice)... use the root name from slices.json as the last segment (it equals "<cutout_id>-<slice>").
        - Write every entry under "<root>/" to the target (stripping the prefix). Before replacing a file, chmod it 0644. For an owned file that already exists and whose digest differs from its delivered digest, keep it and record it in kept_files.
        - README.md from DEFAULT_README with: cutout_id, slice, behavior, input (the contract_refs entry starting with "input ", without that prefix, or ""), output (likewise "output "), owned_files joined ", ", instructor_apis joined ", ", panel_slice.
        - write_rules_files; shape/brief.md copied from Paths.shape_vault_dir/<cutout_id>/brief.md when that file exists.
        - .reach/slice.json: {course, assignment, cutout_id, slice, kind: slice, behavior, due, owned_files, tags, package_version}.
        - .reach/delivered.json: {"readonly": {path: digest}, "owned": {path: digest}} computed after writing (readonly covers every file under the workspace except owned files, .reach/**, .claude/**, .codex/**, .mcp.json).
        - lock_down as 0.1.0 does, but also leave .reach/, .claude/, .codex/ and .mcp.json writable by Reach (chmod before rewrite).
        - Reach::Harness.configure_all(target) last, rescuing StandardError.
        - verify(ws) compares only the readonly map. changed_owned_files compares the owned map. state_word: 'graded' when Receipts.latest_for returns a grade receipt, 'received' for an ingest receipt, else 'in progress' when changed_owned_files is non-empty, else 'not started yet'.
      shape: "shape_path(ws) = File.join(Paths.shape_vault_dir, metadata(ws)['cutout_id'], 'shape.json'). When it does not exist return the no-shape result from interface_contract before running dovetail."
      suite: "Unpack the newest suite package into Paths.suite_vault_dir when its version changed (.version marker). Missing package or missing reference_build/ -> Reach::Refused(M-TIPS-INCOMPLETE text). The run directory copies reference_build/*, then features/, step_definitions/, support/ and reasons.yml when present, then the owned files. Tags come from metadata(ws)['tags']. Everything else stays as 0.1.0."
      submit: |
        W-PKG-5 + W-API-SUBMIT.
        - Preconditions as 0.1.0 (Gate.session(harness: 'cli'), Workspace.verify, visible shape findings block panel slices).
        - manifest.json and files/ entries -> Tarball.write -> Crypto.seal with header {schema teach.package/v1, kind submission, id "renv_" + SecureRandom.hex(10), version 1, course, assignment, student_id, created_at, signing_key_id: install_id, recipient_key_id: encryption_key.key_id}, recipient = encryption_key.pem, signer = install key.
        - body {cutout_id, slice, assignment, package, client_created_at}; Idempotency-Key SecureRandom.uuid; write the outbox entry {kind: 'submission', route, idempotency_key, body} before sending.
        - ingested: Receipts.verify! + store + corpus, delete the outbox entry, return the result. rejected (in the 200 body): delete the outbox entry, return it. RemoteRefused: delete the outbox entry, return {'state' => 'rejected', 'rejection' => {'code' => e.code, 'reason' => e.message}}. Offline/NetworkError: keep the outbox entry, return {'state' => 'queued'}.
        - retry_outbox replays every entry with its stored key (submissions and hands) and returns their results.
      receipts: |
        W-RCPT-1..3 and W-API-SUBMISSION. verify! uses W-KEY-4 over canonical_json(body without 'signature'). store writes receipts/<receipt_id>.json. wait returns a stored receipt of that kind for that submission at once, else polls GET /api/v1/submissions/<id> every 30 s (W-SAFE-6) until one verifies or timeout_s passes. announce renders M-SUBMIT-RECEIVED (slice, cutout: cutout_id, time: Messages.local_time(received_at), receipt_id) or M-GRADED (passed/total from scenarios) and sends the desktop notification as 0.1.0 does. Corpus writes use Reach::Corpus.new(Reach.ports).
      hands: |
        W-PKG-6 + W-API-HAND/W-API-HAND-STATUS. bundle.json per W-PKG-6; profile is Reach::Profile.load['fields'] when include_profile is true and defined?(Reach::Profile), else nil. Seal with header kind hand_bundle exactly like a submission. POST body {cutout_id, slice, trigger, summary (truncated to 2000 bytes on a character boundary), bundle}. Outbox entry kind 'hand'. poll_replies keeps hands/open.json as {hand_id => {'reply' => ..., 'polled_at' => ...}} and calls GET for a hand only when polled_at is at least 60 s old; it removes hands whose state is closed or resolved.
      status: |
        summary lines:
          "rEach <VERSION> · <course title> (<term>) · enrolled as <display_name> (<group>)"  (group and parentheses omitted when nil; "rEach <VERSION> · not connected to a course yet (run reach enrol <code>)" when not enrolled)
          "Current assignment: <id>, due <Messages.local_time(due)>" or "Current assignment: none"
          "Your slices:" then one line per workspace "  <cutout_id>  <slice>  <state_word>   shape: ok|<n> open|none   tips: not run|last recorded"
          "Receipts: <n> (latest <receipt_id>)" or "Receipts: 0"
          "Open hands: none" or "Open hands: <n>"
          "Course rules: v<version> (verified)   Connection: online|offline (last checked <n> min ago)"
    acceptance:
      - "ruby -c passes for every owned Reach file on /usr/bin/ruby AND in the ruby:2.6.10-slim container."
      - "Reach::Crypto round trip on BOTH Rubies: seal with a fresh key pair, open_envelope returns the same header and plaintext; flipping one byte of ciphertext, of the header (any field) or of the signature raises Reach::VerificationFailed; a Teach-sealed envelope produced by Teach::Crypto (ruby 4.0.6) opens under Reach (ruby 2.6 container) and a Reach-sealed envelope opens under Teach::Crypto."
      - "canonical_json of a nested Hash with non-ASCII strings, floats, nulls and arrays is byte-identical between Reach on Ruby 2.6.10 and Teach on Ruby 4.0.6 (compare the SHA-256 of the output)."
      - "End to end against a real Teach 0.2.0 process (see companion blueprint acceptance for the server setup), run once with /usr/bin/ruby and once in the ruby:2.6.10-slim container (--network host): Enrol.generate_and_register succeeds; Sync.run returns state ok, stores guardrails and workspace packages, provisions the slice workspace with its owned file writable and everything else read-only, and renders AGENTS.md/CLAUDE.md/GEMINI.md per W-RENDER-1; editing the owned file then Submit.submit(slice:) returns state ingested with a receipt that verifies and whose file_list names the owned file; Receipts.announce returns the M-SUBMIT-RECEIVED text; Hands.raise_hand returns a hand id and Hands.status returns state open; a GET /api/v1/receipts with query [['since', '2026-01-01T00:00:00Z'], ['limit', '10']] succeeds (proves query signing); replaying a captured signed request verbatim is refused 401 (proves the nonce); revoking the install in Teach then Sync.run returns state revoked and Enrol.revoked? is true."
      - "A second Sync.run after editing the owned file and rebuilding the workspace package in Teach keeps the edited owned file and lists it in kept_files."
      - "Status.summary prints without raising both enrolled and not enrolled."
      - "Write every verification script under your scratch directory. Leave nothing in either repository."
  - id: slice_experience
    owner: worker_experience
    owns_paths:
      - exe/reach (new; created by `git mv bin/reach exe/reach`, then edited)
      - lib/reach.rb
      - lib/reach/runtime.rb (new)
      - lib/reach/profile.rb (new)
      - lib/reach/greetings.rb (new)
      - lib/reach/hello.rb (new)
      - lib/reach/setup.rb (new)
      - lib/reach/cli.rb
      - lib/reach/gate.rb
      - lib/reach/harness.rb
      - lib/reach/mcp_bridge.rb
      - locales/greetings.en-US.yml (new)
      - skills/reach-assistant/SKILL.md (new)
      - skills/reach-course/SKILL.md
      - skills/reach-submit/SKILL.md
      - skills/reach-help/SKILL.md
      - agents/reach.md (new)
      - rules/reach.md (new)
      - hooks/hooks.json (new)
      - .mcp.json (new)
      - settings.json (new)
      - plugin.json (new)
      - .claude-plugin/plugin.json (new)
      - .claude-plugin/marketplace.json (new)
      - .codex-plugin/plugin.json
      - .agents/plugins/marketplace.json (new)
      - INSTALL.md (new)
      - AGENTS.md
      - docs/student-guide.md
      - reach.rplugin.yml
      - config.yml
    depends_on: []
    deliverable: rEach as a harness plugin for Claude Code, Cowork, Codex and Antigravity, with persona, greetings, interview profile, setup, hello, and the workspace-level harness configuration.
    detail:
      exe_reach: |
        `git mv bin/reach exe/reach`, then its body:
          #!/usr/bin/env ruby
          # SPDX-License-Identifier: MIT
          (compute rplugin_home as 0.1.0 does; require File.join(rplugin_home, 'lib', 'rplugin') only when RUBY_VERSION >= '3.3' and that file exists, rescuing LoadError, SyntaxError and StandardError)
          require_relative "../lib/reach"
          exit Plugin.run(ARGV)
        Keep the file executable (chmod 0755).
      lib_reach_rb: |
        Keep the VERSION constant and Plugin.run. Define `def self.ports` on module Reach per interface_contract. Require, in this order: errors, paths, messages, wire, tarball, crypto, client, packages, corpus, runtime, profile, greetings, enrol, guardrails, workspace, sync, gate, shape, attempts, suite, submit, receipts, hands, harness, hello, setup, mcp_bridge, status, cli.
      runtime: |
        Reach::Runtime per interface_contract.
        - The shim at Paths.home/bin/reach is exactly:
            #!/usr/bin/env ruby
            root = File.read(File.join(__dir__, "root")).strip
            load File.join(root, "exe", "reach")
          with Paths.home/bin/root holding Runtime.root. Mode 0755 on the shim. Write both only when content differs. Rescue everything.
        - hook_command: on Windows (RbConfig host_os =~ /mswin|mingw|cygwin/) join the parts wrapped in double quotes; elsewhere Shellwords.escape each part and join with spaces.
        - default_teach_url reads config.yml (YAML.safe_load) key teach.url.
      config_yml: "Add a top-level `teach: {url: null}` map, keeping schema and corpus."
      profile: |
        Reach::Profile per interface_contract. YAML at Paths.home/profile.yml written with mode 0600 (Paths.ensure_home! first). save(fields:, status:) validates: every key is in FIELDS (else raise Reach::Error listing the valid fields with dashes), every value is a String of at most 500 characters (strip it; an empty string removes the field), status is partial or complete; it merges into existing fields, sets started_at when absent, completed_at when status is complete, updated_at always. forget! deletes the file with File.delete (the student asked to delete their own data; nothing is kept) and returns true even when absent. load returns the not_started default when the file is absent or unreadable.
      greetings: "Reach::Greetings.text(id, **fields) loads locales/greetings.en-US.yml (verbatim.greetings_file) and interpolates {name} style fields exactly like Reach::Messages; unknown id raises Reach::Error."
      hello: |
        Reach::Hello.run(harness:, source:, format:, cwd:). Must finish in under 5 seconds and never raise.
        1. Runtime.ensure_shim!.
        2. Read the hook event JSON from STDIN when STDIN is not a TTY and format is 'hook' (source comes from its "source" field; cwd from its "cwd" field when present).
        3. harness: the argument, else 'codex' when ENV['PLUGIN_ROOT'] is set and ENV['CLAUDE_PROJECT_DIR'] is not, else 'claude-code' when ENV['CLAUDE_PLUGIN_ROOT'] or ENV['CLAUDE_PROJECT_DIR'] is set, else 'unknown'.
        4. When enrolled, not REACH_OFFLINE, and Sync.status_age_s is nil or over 21600: Sync.refresh_status(quick: true) rescuing everything.
        5. When cwd is inside a Workspace.current_slices path: Harness.configure_all(that path) rescuing everything.
        6. Choose the greeting (only when source is nil, 'startup' or 'clear'; for 'resume' and 'compact' choose none):
           - profile status not_started -> G-FIRST-RUN, plus banner G-BANNER-FIRST.
           - profile partial -> G-RESUME with name = Profile.preferred_name, or G-RESUME-NONAME.
           - profile complete and not enrolled -> G-NOT-ENROLLED (name).
           - profile complete and enrolled: slices = Workspace.current_slices for the cached current assignment (all of them when none cached); none -> G-RETURNING-PLAIN; one -> G-RETURNING (assignment id, due = Messages.local_time(due), slice, state = Workspace.state_word); several -> G-RETURNING-MANY with slices = "<slice> <state_word>" joined ", ".
           - When profile is complete, fields.course_answer is empty and Guardrails.course_question is present, append G-COURSE-QUESTION (question).
        7. Compose the context text:
             rEach session context (from reach hello)
             - You are rEach, the student's academic assistant. Load the reach-assistant skill for how to greet, interview and save.
             - Greeting for this session: open your first reply with exactly this text, then continue as it asks:
               <greeting, indented two spaces per line>
               (or, with no greeting: "- This session continues an earlier one. Do not greet again.")
             - Student profile: <status>; <each saved field as "field: value" on its own indented line, or "nothing saved yet">
             - Course: <course title> · <assignment and due> · <slices with state>   (or "- Course: not connected yet")
             - Course question: <question>   (only when Guardrails.course_question is present)
           For harness codex or unknown, and for format text, append a blank line and the full persona body (read from skills/reach-assistant/SKILL.md, front matter stripped).
        8. Output:
           - format 'hook': JSON {"hookSpecificOutput": {"hookEventName": "SessionStart", "additionalContext": <context>}} plus "systemMessage": <banner> when there is a banner.
           - format 'text': the context text.
           - format 'json': {"greeting_id", "greeting", "banner", "context"}.
        On any internal error, output the minimal context "rEach session context (from reach hello)\n- You are rEach, the student's academic assistant. Load the reach-assistant skill." in the requested format.
      setup: |
        Reach::Setup.run(harness:, source:, format:) returns [output, exit_code]. Steps:
        1. Ruby check (2.6.10 <= RUBY_VERSION < 4.1). Outside: exit 1 with one line per platform: macOS "Run setup with the built-in Ruby: /usr/bin/ruby ~/.reach/plugin/exe/reach setup"; Windows "Install Ruby 4.0 from https://rubyinstaller.org for this user only, then run setup again."; Linux "Install your distribution's Ruby (2.6.10 to 4.0.x), then run setup again.".
        2. Paths.ensure_home!; Runtime.ensure_shim!.
        3. source = the argument, else Runtime.root (a local marketplace: the repository itself).
        4. Harnesses: 'auto' means every one detected (claude-code when `claude` is on PATH or ~/.claude exists; codex when `codex` is on PATH or ~/.codex exists; antigravity when `agy` is on PATH or ~/.gemini exists). For each, run with Open3.capture3, 120 s timeout each, never through a shell:
           - claude-code with `claude` on PATH: `claude plugin marketplace add <source>`, then `claude plugin install reach@reach --scope user`. A marketplace add that fails because it already exists is fine (then run `claude plugin marketplace update reach`). Success line: "Claude: rEach installed. Start a new Claude session (or run /reload-plugins) to meet rEach."
             Without the CLI: "Claude app: open Customize › Plugins › Add › Add marketplace, paste this repository's link, then add rEach."
           - codex with `codex` on PATH: `codex plugin marketplace add <source>`, then `codex plugin add reach@reach`. Success line: "Codex: rEach installed. When Codex asks you to review rEach's start-up hook, choose to trust it; then start a new Codex session."
             Without the CLI: "Codex app: add this repository as a plugin marketplace, then add rEach from the Plugins directory."
           - antigravity: with `agy` on PATH run `agy plugin install <Runtime.root>`; otherwise link Runtime.root to ~/.gemini/config/plugins/reach and, when ~/.gemini/antigravity-cli exists, to ~/.gemini/antigravity-cli/plugins/reach (File.symlink; on Windows FileUtils.cp_r instead). An existing target that is not a symlink to Runtime.root is left alone with "blocked: <path> exists". Success line: "Antigravity: rEach installed. Start a new Antigravity session to meet rEach."
           - deepseek-tui or dsh: "DeepSeek Harness: rEach doesn't support it yet."
        5. The NEXT block (text format), always last:
             NEXT - say this to the student now, word for word:

             rEach is installed and ready.

             <G-FIRST-RUN, or the greeting Hello would choose when the profile is not not_started>

             Then run the interview in skills/reach-assistant/SKILL.md.
        6. exit 0 when at least one harness line is a success or a manual-steps line; 1 otherwise. format json returns {"harnesses": [{id, ok, message}], "next": <greeting>, "exit": n}.
      gate: |
        Keep 0.1.0 behaviour and add:
        - session and prompt run, in order: check_enrolled!, check_outdated! (Gem::Version.new(Reach::VERSION) < Gem::Version.new(install minimum_reach_version) -> M-REACH-OUTDATED with version and minimum), check_fresh! (Sync.status_age_s nil or over 86400 -> M-GATE-STALE), check_guardrails! (Guardrails.load, Refused -> M-GATE-NOGUARD; Guardrails.version lower than the cached status's guardrails package version -> M-GATE-OLDGUARD), check_has_workspace!. No network.
        - write(path: nil, patch: nil): when patch is given, the target paths are every path on lines beginning "*** Add File: ", "*** Update File: ", "*** Delete File: " or "*** Move to: " (text after the prefix, stripped), resolved against the current workspace (or Dir.pwd); every one must be an owned file, else M-WRITE-OUTSIDE. When path is given, 0.1.0 behaviour. Neither given: allow.
        - shell unchanged.
      harness: |
        - detect: claude (claude-code), codex (codex), agy (antigravity) on PATH, each with `<exe> --version` (a failing version call still counts as detected with version "unknown").
        - configure_all(ws): configure('claude-code', ws) and configure('codex', ws) always (they are files in the workspace, harmless when the harness is absent); returns the ids; rescues everything. GEMINI.md comes from Workspace.write_rules_files and needs nothing here.
        - claude-code: <ws>/.claude/settings.json (read-only after writing) =
            {"hooks": {
               "SessionStart": [{"hooks": [{"type": "command", "command": H("gate", "session", "--harness", "claude-code"), "timeout": 10}]}],
               "UserPromptSubmit": [{"hooks": [{"type": "command", "command": H("gate", "prompt"), "timeout": 10}]}],
               "PreToolUse": [{"matcher": "Write|Edit|MultiEdit|NotebookEdit", "hooks": [{"type": "command", "command": H("gate", "write"), "timeout": 10}]},
                              {"matcher": "Bash", "hooks": [{"type": "command", "command": H("gate", "shell"), "timeout": 10}]}],
               "PostToolUse": [{"matcher": "Write|Edit|MultiEdit", "hooks": [{"type": "command", "command": H("shape", "check", "--format", "agent"), "timeout": 60}]}],
               "Stop": [{"hooks": [{"type": "command", "command": H("attempts", "settle"), "timeout": 30}]}]},
             "permissions": {"deny": ["Read(<vault_dir>/**)", "Read(<keys_dir>/**)"]},
             "enableAllProjectMcpServers": true}
          where H(...) is Runtime.hook_command(...); and <ws>/.mcp.json = {"mcpServers": {"reach": {"command": Runtime.ruby_path, "args": [Runtime.shim_path, "mcp"]}}}. Drop 0.1.0's mcpServers key from settings.json.
        - codex: <ws>/.codex/config.toml (read-only) =
            sandbox_mode = "workspace-write"

            [sandbox_workspace_write]
            writable_roots = [<Paths.home>]
            network_access = true

            [mcp_servers.reach]
            command = <ruby_path>
            args = [<shim_path>, "mcp"]
          (TOML strings escaped as 0.1.0 does) and <ws>/.codex/hooks.json (read-only) = the same five hooks as Claude's, with PreToolUse matchers "apply_patch|Write|Edit" -> H("gate", "write") and "Bash|shell|exec_command" -> H("gate", "shell"), PostToolUse matcher "apply_patch|Write|Edit", and SessionStart H("gate", "session", "--harness", "codex").
        - launch(id, ws, initial_prompt:): Gate.session(harness: id) for workspace launches, Workspace.write_rules_files(ws), configure(id, ws), then exec in ws: claude-code -> ["claude", initial_prompt].compact; codex -> ["codex", initial_prompt].compact; antigravity -> "agy" when on PATH, else print "Open this folder in Antigravity: <ws>" and return 0. Never fall back to another harness.
      cli: |
        Keep every 0.1.0 command and its output, with these changes:
        - First thing in run: Runtime.ensure_shim! (rescue everything).
        - Usage lists the new commands below.
        - enrol <code> [--teach-url URL]: teach_url = flag || Runtime.default_teach_url; on success print Messages.text('M-ENROL-DONE', course: course title), then run Sync.run and print its summary like `sync` does. Reach::Refused prints its message, exit 1.
        - sync: print from the Sync.run summary: "Course rules: v<n> (verified)" when guardrails_version, one "Workspace: <path>" per workspace, "Kept your changes: <files>" when kept_files, "Sent <n> queued item(s)." when outbox_sent > 0, each warning, and M-OFFLINE when state is offline or M-GATE-REVOKED when revoked. Exit 0 for ok/offline, 2 for revoked.
        - submit: result = Submit.submit(slice:); ingested -> puts Receipts.announce(result['receipt']); rejected -> Messages.text('M-SUBMIT-REJECTED', reason: rejection['reason'], fix: Messages.rejection_fix(rejection['code'])) exit 1; queued -> M-SUBMIT-PENDING.
        - hand raise gains --include-profile (a bare flag) passed as include_profile: true.
        - attempts settle [--slice <basename>]: slice = flag, else the basename of the workspace containing Dir.pwd; prints JSON of Attempts.settle(slice:) ; exit 0 (also exit 0 outside a workspace, printing []).
        - gate write: reads the hook event from STDIN; patch = tool_input['command'] when tool_name is 'apply_patch' or that text begins with '*** Begin Patch'; path = --path or tool_input file_path/path/notebook_path; Gate.write(path:, patch:).
        - hello [--harness ID] [--format hook|text|json] [--source S]: puts Hello.run(...); always exit 0.
        - setup [--harness auto|claude-code|codex|antigravity] [--source S] [--format text|json]: prints output, exits with its code.
        - start [--harness ID]: launches the harness in Dir.pwd with initial prompt "Hi rEach" (no gate; this is outside course workspaces).
        - work [--harness ID] [--slice S]: as 0.1.0 but passes initial prompt "Hi rEach" and supports antigravity.
        - profile show [--format text|json] | save [--status partial|complete] [--<field-with-dashes> VALUE ...] | forget: text show prints "No profile yet." or one "field: value" line per saved field plus "Status: <status>"; save prints "Saved."; forget prints "Your profile is deleted."
        - doctor: one line per problem, exit 0 only when none. Checks: R-DOC-RUBY; R-DOC-SHIM (shim and root file present and root is a directory holding exe/reach); R-DOC-HARNESS (at least one harness detected); R-DOC-ENROL; R-DOC-KEYS (install.yml has signing_public_keys and encryption_key); R-DOC-GUARD; R-DOC-WS; R-DOC-CHROME; R-DOC-GEMS; R-DOC-NET (when enrolled and online: GET /api/v1/health through Client.anonymous with quick: true succeeds, and |status.server_time - status.fetched_at| is under 300 s); R-DOC-OUTBOX; R-DOC-OUTDATED; R-DOC-WIRE (cached status wire_contract_sha256, when present, equals Reach::Wire.digest); R-DOC-VERSION (VERSION equals the version in plugin.json, .claude-plugin/plugin.json, .claude-plugin/marketplace.json plugins[0], .codex-plugin/plugin.json and reach.rplugin.yml); R-DOC-PERSONA (skills/reach-assistant/SKILL.md body equals agents/reach.md body, and that body contains each line of the G-FIRST-RUN greeting from locales/greetings.en-US.yml, as the persona body quotes it). R-DOC-SDK and R-DOC-LINKS are removed (rplugin is optional).
      mcp_bridge: |
        Keep the seven tools and add: reach_hello {harness?} -> Hello.run(format: 'json'); reach_profile_show {} -> Profile.load; reach_profile_save {fields: object, status: string} -> Profile.save; reach_profile_forget {} -> {"forgotten": true}; reach_enrol {code: string, teach_url?: string} -> the enrol result plus the Sync.run summary; reach_sync {} -> Sync.run. reach_submit returns Submit.submit's Hash (plus 'announcement' => Receipts.announce(receipt) when ingested).
      skills: |
        - skills/reach-assistant/SKILL.md = verbatim.skill_front_matter + verbatim.persona_body.text.
        - agents/reach.md = verbatim.agent_front_matter + verbatim.persona_body.text.
        - skills/reach-course/SKILL.md: first line of the body becomes "Read AGENTS.md (the same rules are in CLAUDE.md and GEMINI.md), README.md and shape/brief.md first."; the rest unchanged.
        - skills/reach-submit/SKILL.md body becomes:
            Run `reach submit`. Most of the time the receipt comes back straight away; tell the student immediately what was received, the receipt number and the time.
            If submit says the work is queued, run `reach receipts wait --submission <id>` when you have an id, or `reach sync` when you are back online, and tell the student it has not been received yet.
            If submit says the work wasn't accepted, read the reason and the fix to the student in plain words.
            When a grade receipt arrives, show the scenario results in plain words.
        - skills/reach-help/SKILL.md: add a final line: "Include the student's saved profile only if they say yes: `reach hand raise --include-profile ...`."
      manifests: "Write every verbatim JSON file above exactly. .codex-plugin/plugin.json is replaced by verbatim.codex_plugin_json."
      rules_install_hooks_settings: "Write verbatim.rules_file, verbatim.install_md, verbatim.hooks_json, verbatim.mcp_json and verbatim.plugin_settings exactly."
      agents_md: "Insert, directly under the '# AGENTS.md: reach' heading line, a new paragraph: 'Asked to install rEach for a student? Follow INSTALL.md.' Change every `bin/reach` mention to `exe/reach` and state that rplugin is optional: Reach runs from a harness's own plugin copy, and rplugin install is one of several ways in."
      student_guide: |
        Rewrite docs/student-guide.md in the same plain voice, titled "# rEach: the student guide", with sections: Getting started (paste this repository's link into your AI app and ask it to install rEach; Cowork users add it under Customize › Plugins; then rEach introduces itself and asks a few questions; then enrol with your code), Every day (as 0.1.0, rEach wording), If something looks wrong (reach doctor), What rEach remembers about you (the profile: saved on your computer only, ask "what do you know about me?" or "forget my profile"; never sent to the course server unless you say yes when rEach asks for help), Privacy (0.1.0 text with rEach wording, plus: your profile stays on your computer).
      rplugin_manifest: "reach.rplugin.yml: version 0.2.0; contents.skills adds { id: reach-assistant, path: skills/reach-assistant/SKILL.md }; contents.agents becomes [{ id: reach, path: agents/reach.md }]; contents.scripts becomes [{ path: exe/reach }]; add contents.docs entry { path: INSTALL.md }. Keep everything else."
    acceptance:
      - "ruby -c passes for every owned Ruby file (exe/reach included) on /usr/bin/ruby AND in the ruby:2.6.10-slim container; every JSON file parses (ruby -rjson); every YAML file parses (YAML.safe_load)."
      - "In the ruby:2.6.10-slim container with a scratch REACH_HOME and no ~/.rplugin: `ruby exe/reach --help`, `ruby exe/reach hello --format text`, `ruby exe/reach profile save --status partial --preferred-name Dana`, `ruby exe/reach profile show`, `ruby exe/reach profile forget` all run, and hello's greeting changes from G-FIRST-RUN to G-RESUME (with Dana) after the save and back after the forget."
      - "`echo '{\"source\":\"startup\"}' | CLAUDE_PLUGIN_ROOT=$PWD ruby exe/reach hello` prints JSON whose hookSpecificOutput.additionalContext contains the G-FIRST-RUN text and whose systemMessage is G-BANNER-FIRST; with source resume it contains 'Do not greet again.'; with PLUGIN_ROOT set and no Claude variables the context also contains the persona body."
      - "Real plugin installs into scratch config homes, leaving the user's own untouched: CLAUDE_CONFIG_DIR=<scratch>/claude claude plugin marketplace add <reach repo> && CLAUDE_CONFIG_DIR=<scratch>/claude claude plugin install reach@reach --scope user succeed, and `CLAUDE_CONFIG_DIR=<scratch>/claude claude plugin details reach@reach` lists the reach-assistant skill, the reach agent, the SessionStart hook and the reach MCP server. CODEX_HOME=<scratch>/codex codex plugin marketplace add <reach repo> && CODEX_HOME=<scratch>/codex codex plugin add reach@reach succeed. Report the exact output of each, and anything Codex reports about hooks."
      - "`ruby exe/reach setup --harness claude-code --format json` run with CLAUDE_CONFIG_DIR=<scratch>/claude and REACH_HOME=<scratch>/reach-home ends with a NEXT greeting of G-FIRST-RUN and exit 0."
      - "Gate.write(patch:) with a patch touching one owned and one non-owned file raises GateBlocked M-WRITE-OUTSIDE; a patch touching only owned files returns nil (a scratch workspace with a hand-written .reach/slice.json is enough)."
      - "The MCP bridge answers initialize and tools/list over stdio and lists the 13 tools; tools/call reach_profile_save then reach_profile_show round-trips a field."
      - "`ruby exe/reach doctor` runs without raising (findings are expected on a machine that is not enrolled) and reports no R-DOC-VERSION or R-DOC-PERSONA finding."
      - "`~/.rplugin/bin/rplugin check reach` reports zero findings. Do NOT run `rplugin install`; the primary does that."
      - "Write every verification script under your scratch directory. Leave nothing in the repository."
shared_surfaces_resolved:
  - {path: VERSION, rule: "Owned by the primary; already 0.2.0 before the workers start."}
  - {path: CHANGELOG.md, rule: Owned by the primary.}
  - {path: TODO.md, rule: Owned by the primary.}
  - {path: README.md, rule: Owned by the primary.}
  - {path: reach.spec.yml, rule: Owned by the primary.}
  - {path: specs/app.yml, rule: Owned by the primary.}
  - {path: specs/wire.yml, rule: "Owned by the primary; normative; report defects, never edit."}
  - {path: specs/implementation/v0.2.0.impl.yml, rule: Owned by the primary.}
  - {path: .rproject/, rule: Owned by the primary.}
  - {path: TMP_AGENT_FILE_LOCKS.yml, rule: "The primary's lock manifest; do not edit or delete it."}
  - {path: lib/reach/corpus.rb and lib/reach/attempts.rb, rule: "Unchanged; nobody edits them."}
out_of_scope:
  - Building the tips suite's step definitions, support code or reference build (Teach reserves them for a later release).
  - Real Dovetail shapes (the course spec carries none yet).
  - Antigravity hooks (its hook format is undocumented; Antigravity relies on rules/reach.md, the skills and GEMINI.md).
  - DeepSeek Harness support.
  - rplugin-compat's Ruby 2.6 rewrite (Reach no longer needs it to run).
  - Publishing the repository publicly or to GitHub.
integration_steps_for_the_primary:
  - Read both workers' reports and every changed file; resolve anything reported as blocked by ownership.
  - Run both slices' acceptance again for real, including a fresh end-to-end with the experience slice's exe/reach driving the wire slice's code (enrol, sync, submit, hello greeting after enrolment).
  - rplugin install reach and rplugin doctor reach at zero findings.
  - Specs, VERSION, CHANGELOG, TODO, README; commit, tag v0.2.0 and push in both repositories.
