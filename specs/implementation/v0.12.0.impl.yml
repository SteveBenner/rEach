schema: impl-blueprint/v1
name: course alignment - login, modules, transfers, the student's own part, sandbox, pace, focus and support
versions:
  reach: 0.12.0
  teach: 0.12.0
recorded: '2026-09-30'
author: primary (Opus), for four Sonnet coding-workers running in parallel
draft_spec: docs/course-alignment-design.md (written first as TMP.md at the repository root; this blueprint is its implementable form)
repos:
  reach: /home/sven/github/foss/rEach
  teach: /home/sven/bitbucket/paterasai/teach
  grokit: /home/sven/bitbucket/paterasai/grokit
wire:
  file: specs/wire.yml, protocol 1 revision 2026-09-30b, byte-identical in both repos, ALREADY WRITTEN by the primary
  read_first:
    - "alignment: (the whole section at the end of the file: W-POL-1, W-CONSENT-1, W-ID-1..4, W-MOD-1..4, W-PART-1..3, W-SBX-1..3, W-PACE-1, W-SUP-1..3)"
    - W-API-STATUS (new fields modules, module_selection, transfer, policy_digest)
    - W-API-MODULES, W-API-MODULE-SELECT, W-API-TRANSFER, W-API-TRANSFER-STATUS
    - W-API-HAND (trigger wellbeing), W-API-INTEGRITY (kinds login_failed, identity_denied, outside_access)
    - W-PKG-1 course.yml (policy keys), W-PKG-5 part.json and its teach_checks
    - W-SAFE-12, W-COMPAT-4
  rule: No worker edits specs/wire.yml. If the wire is wrong or silent on something you need, implement the most literal reading, and list the gap in your report.

already_written_by_primary:
  - path: rEach/TMP.md (now docs/course-alignment-design.md)
    what: the draft spec, decisions and edge-case table
  - path: rEach/specs/wire.yml and teach/specs/wire.yml
    what: revision 2026-09-30b
  - path: teach/directives/pace.md, ownpart.md, coach.md, sandbox.md, focus.md, whoami.md
    what: the six new private directives (aliases U-Z). Do not edit their bodies.
  - path: teach/teach.spec.yml
    what: course_model.assignments[].student_part (A1-A4, four questions each) and course_model.policy_defaults
  - path: rEach/locales/en-US.yml
    what: every new message id listed under shared_contracts.messages, with its final text. Workers only read it.
  - path: rEach/locales/greetings.en-US.yml
    what: G-LOGIN
  - path: rEach/specs/implementation/v0.12.0.impl.yml
    what: this file

decisions:
  D1: extracurricular/ stays as it is (free build space, G-EXTRA-1/2 unchanged). PACE and the course-only half of FOCUS do not apply there; login, SANDBOX (outside the workspace root), the no-personal-advice half of FOCUS and the crisis response apply everywhere.
  D2: login is the enrolled student id typed by the student, then "Am I speaking with <display_name>?" and a yes. No PIN, no password. The id is not redacted from transcripts (Teach already knows it).
  D3: the student's own part is taken verbatim from the student's captured prompts, linked by session and seq, and verified by Teach against the transcript it holds; answers that echo an AI reply are flagged part_suspect for instructors only.
  D4: crisis gets the fixed support message (911 first, then 988, then the course's support line) printed by reach support, and an automatic wellbeing hand to the instructors. The agent never counsels.
  D4b: the support message begins with the boilerplate "If this is an emergency, call 911 now." (Sven, verbatim request).
  D5: web fetch and web search are refused in slices and the course root; extracurricular/ is unchanged.
  D6 (primary): login is enforced by the hook, never by the agent; every login-step prompt is blocked so the agent never sees the id or the yes.
  D7 (primary): commitments (module lock, transfer request) need a consent record captured by the hook (W-CONSENT-1); the agent can only relay the question.
  D8 (primary): the crisis safety net (W-SUP-3) runs before login so a logged-out student in crisis still gets the support message.
  D9 (primary): the student's part is carried only in part.json, never written into README.md (README.md is an owned file; rewriting it would invalidate the last qualification).
  D10 (primary): minimum_reach_version default becomes 0.12.0 on Teach.

requirement_trace:
  R1_time_gated_progression:
    prose: [D-PACE, G-PACE-1, D-SLICE (existing)]
    code:
      - reach W3 lib/reach/pace.rb + gate write/shell refusal M-GATE-NOT-CURRENT (W-PACE-1)
      - reach W4 lib/reach/next.rb anchor context each turn (M-ANCHOR)
  R2_own_part_before_submit:
    prose: [D-OWNPART, G-PART-1]
    code:
      - teach course_model student_part questions (primary) shipped in course.yml (W1)
      - reach W4 lib/reach/part.rb (reach part, reach part record), submit refusal M-SUBMIT-NO-PART, part.json
      - teach W1 part.json validation, part_verified, part_suspect (W-PART-3)
  R3_coaching:
    prose: [D-COACH, G-COACH-1]
    code:
      - reach W4 reach next (deterministic next step, M-NEXT-*), anchor context
  R4_sandbox:
    prose: [D-SANDBOX, G-SANDBOX-1]
    code:
      - reach W3 reach gate read (Read|Glob|Grep|NotebookRead|LS|WebFetch|WebSearch), shell outside-path refusal
      - reach W3 lib/reach/imports.rb (drag-and-drop copy into materials/)
      - reach W3 outside_access integrity event
  R5_R7_R8_focus:
    prose: [D-FOCUS, G-FOCUS-1, D-PACE]
    code:
      - reach W4 anchor context each turn so long side-chains keep the current step in view
  R6_corpus_limits:
    code:
      - teach policy limits (W1), reach W3 lib/reach/limits.rb, doctor R-DOC-LIMITS
  R9_no_life_advice:
    prose: [D-FOCUS, G-FOCUS-1, G-FOCUS-2]
    code:
      - reach W4 reach support (M-SUPPORT, wellbeing hand); reach W2 crisis safety net in the prompt hook (W-SUP-3)
      - teach W1 wellbeing hand trigger, listed first
  R10_identity_tags:
    code:
      - reach W2 student_id on every local record (W-ID-2); teach already keys by install and student
  R11_R12_login:
    prose: [D-WHOAMI, G-IDENT-1]
    code:
      - reach W2 lib/reach/login.rb state machine; W3 wires it into gate prompt/write/shell/read; W2 hello greeting G-LOGIN
      - teach W1 integrity kinds login_failed, identity_denied; minimum_reach_version 0.12.0
  R13_knows_modules:
    code:
      - teach W1 signed module records (W-MOD-1), instructor-mode record issued from slice assignments
      - reach W2 lib/reach/modules.rb, reach modules, status line; W3 gate M-GATE-NOT-YOUR-MODULE
  R14_781_choose_and_lock:
    code:
      - teach W1 policy module_selection student_choice, POST /api/v1/modules/selection, slice assignments for all assignments (W-MOD-3)
      - reach W2 reach modules choose with consent, locally sealed pending selection, stored signed record
  R15_teach_reassign:
    code:
      - teach W1 teach modules assign (+ admin route), W-MOD-3 remapping
  R16_transfer_request:
    prose: [D-WHOAMI, G-IDENT-1]
    code:
      - reach W2 reach transfer request with consent, polling, messages
      - teach W1 transfers table, routes, teach transfers list|show|approve|deny (+ admin routes)
  R17_edge_cases:
    doc: docs/course-alignment-design.md section 6 and this file's edge_cases section

global_constraints:
  - "NO COMMENTS in code, at all (AGENTS.md Part Q). Only shebangs and magic comments that a tool reads."
  - "NO TESTS, no spec files, no test fixtures, no test directories (AGENTS.md Part S). Verify by running the real code; keep any throwaway script in your scratchpad, never in either repository."
  - "Do not touch git: no add, no commit, no stash, no checkout, no reset."
  - "Reach runs on a Ruby 2.6.10 floor: no Hash#except (3.0), no Enumerable#filter_map (2.7), no Enumerable#tally (2.7), no endless methods, no pattern matching, no numbered block parameters, no `it`, no `...` argument forwarding, no Array#intersect?, no String#bytesplice. Use select + map, each_with_object and compact."
  - "Teach runs on Ruby 4.0.6 (PATH=$HOME/.rubies/ruby-4.0.6/bin:$PATH, BUNDLE_GEMFILE=<teach>/Gemfile, BUNDLE_PATH=<teach>/vendor/bundle, bundle exec)."
  - "American English in every message and identifier: enrollment, enroll, color, behavior (the existing codebase spells behaviour in Grokit paths; keep those paths as they are)."
  - Match the surrounding style exactly (module_function or class << self as the file already does, string hash keys, require_relative, frozen constants).
  - "Every student-facing sentence comes from rEach/locales/en-US.yml through Reach::Messages.text(id, **fields). Never inline a student-facing sentence in Ruby. If you need a message that is not there, use the closest one and report the gap."
  - Every network call from Reach goes through Reach::Client (it already has the limiter, retries, timeouts, breaker and REACH_OFFLINE kill switch, W-SAFE-1..5). Never create another HTTP client. Hooks never make network calls (W-SAFE-9, W-SAFE-12); they queue in the outbox.
  - Every new Teach route authenticates (authenticate_install! or authenticate_instructor!), enforces a rate limit profile, reads the body through read_body_limited!, validates with assert_only_keys!-style exact key sets, and records an audit entry for every state change.
  - Never delete a student's data. Records are appended or superseded, never edited in place, and old workspaces stay on disk.
  - "File ownership below is strict. A file listed under another worker's owns_paths is read-only for you. A file under shared_paths needs the lock protocol (shared_contracts.locking)."
  - When an existing behavior conflicts with this blueprint, follow the blueprint and report the conflict.

shared_contracts:
  locking:
    manifest: TMP_AGENT_FILE_LOCKS.yml at the root of the repo you are editing (rEach or teach)
    protocol:
      - Read the manifest before opening a shared file for write. If another agent_id holds the path, work on something else and come back; never edit a held file.
      - Append your entry {path (absolute), agent_id (your worker id, e.g. W2-identity), purpose, acquired_at (UTC ISO 8601)} and save.
      - Make your edits to that file in one short burst, then remove your entry immediately (delete the list item, do not blank it). Never remove another agent's entry. Never delete the manifest file.
      - Keep each shared-file edit small and self-contained (add a require line, a `when` branch, a method) so waiting peers are not blocked for long.
  worker_ids: [W1-teach, W2-identity, W3-sandbox, W4-part]
  reach_shared_paths:
    - lib/reach.rb (each worker adds only its own require_relative lines, right after require_relative "reach/receipt_acks")
    - lib/reach/cli.rb (each worker adds only its own `when` branches, cmd_* methods and help lines)
    - lib/reach/status.rb (each worker adds only its own *_line methods and one call each in the lines list)
    - lib/reach/sync.rb (each worker adds only its own begin/rescue block inside the `unless offline` block, after the receipt acknowledgment block)
  teach_shared_paths: []
  reach_module_apis:
    purpose: >-
      The exact Ruby APIs that cross worker boundaries. Implement yours exactly as written (names, arguments, return
      values, exceptions); call the others exactly as written even before they exist. The primary integrates and runs
      everything together at the end.
    Reach::Login:
      owner: W2-identity
      file: lib/reach/login.rb
      methods:
        "required?": "false when no install is enrolled; otherwise Reach::Policy.login['required'] != false (Teach turns it off course-wide with TEACH_LOGIN_REQUIRED=0 through the policy)."
        "evaluate(event:, harness:)": >-
          Pure decision, no writes. Returns a Hash {"action" => "pass" | "block", "message" => String or nil,
          "note" => "login" | "support" | nil, "context" => String or nil, "state" => the next login state Hash,
          "crisis" => true | false}. Implements W-SUP-3 first, then W-ID-1. For a confirmed, unexpired session returns
          action pass (with crisis true and context set when the prompt matched a crisis phrase).
        "commit!(decision, event:, harness:)": "Writes the next state, queues integrity events (login_failed at lockout, identity_denied at denial) and, when decision['crisis'] is true and the session is not confirmed, calls Reach::Support.queue_from_hook!(harness: harness, space: Reach::Gate.current_space). Never raises."
        "session_confirmed?(session_id)": true when that session's state is confirmed and not expired
        "any_active?": true when some session was confirmed within max_hours and no session was denied after that confirmation
        "require_active!": "raise Reach::Refused, Reach::Messages.text('M-LOGIN-NEEDED') unless !required? || any_active?"
        "consume_just_confirmed(session_id)": "true exactly once after a session became confirmed (the prompt after the yes), so the gate can hand the agent the full session context; false otherwise"
        "session_id(event)": "Reach::Transcript.resolve_session_id(event) (reuse, do not reimplement)"
        "student": "{'id' => enrolled student id, 'display_name' => from the cached status student.display_name, else install.yml, else nil, 'first_name' => first whitespace-separated word of display_name}"
    Reach::Consent:
      owner: W2-identity
      file: lib/reach/consent.rb
      methods:
        "ask!(kind:, subject:, message_id:, fields: {})": "Writes the pending question (W-CONSENT-1) and returns the exact question text Reach::Messages.text(message_id, **fields)."
        "observe(entry)": "Called by the prompt gate with the transcript entry just captured (Hash with session_id, seq, digest, text, gate). If a question is pending (<= 30 minutes old) and the text is a W-ID-4 yes or no, writes the answered record and clears the pending one. Returns the answered record or nil. Never raises."
        "take!(kind:, subject:)": "Returns the unused answered record whose kind matches, answer is yes, subject_digest matches digest(subject) and answered_at is <= 30 minutes old, marking it used; nil otherwise."
        "declined?(kind:, subject:)": "true when the latest answered record for that kind and subject is a no (<= 30 minutes old)"
        "digest(subject)": "Reach::Crypto.digest_hex(Reach::Crypto.canonical_json(subject))"
        "yes?(text) / no?(text)": W-ID-4 word lists (shared with Login)
    Reach::Modules:
      owner: W2-identity
      file: lib/reach/modules.rb
      methods:
        "current": the verified current signed record (Hash) or nil
        "module_ids": "Array of module ids in the current record, [] when none"
        "allows?(cutout_id)": "true when there is no current record (instructor mode before Teach issued one) or the cutout's module (cutout_id before the first '.') is in module_ids"
        "store!(record)": verify (W-MOD-2) and store as current when its version is higher than the stored one; always add to history; returns the record or raises Reach::VerificationFailed
        "refresh!(quick: false)": GET /api/v1/modules, store current and history, flush a pending selection; returns the response Hash; raises Reach::Offline / Reach::NetworkError through
        "choose!(modules)": the reach modules choose flow (see W2); returns {"state" => "asked" | "locked" | "queued" | "declined", "text" => message}
        "flush_pending!": sends a sealed pending selection whose consent is recorded; used by sync
    Reach::Transfer:
      owner: W2-identity
      file: lib/reach/transfer.rb
      methods:
        "request!(modules:, note: nil)": the reach transfer request flow; returns {"state" => "asked" | "sent" | "queued" | "declined" | "open" | "same", "text" => message}
        "current": the stored open request Hash or nil
        "poll!(quick: false)": at most every 60 s while pending (W-SAFE-12); on approved stores the module record through Reach::Modules.store! and returns M-TRANSFER-APPROVED text; on denied returns M-TRANSFER-DENIED text; else nil
    Reach::Policy:
      owner: W2-identity
      file: lib/reach/policy.rb
      methods:
        "all": "the policy Hash from the verified guardrails package's course.yml (keys login, limits, support, student_part, module_selection), with the W-POL-1 defaults for every missing key; {} sections never nil"
        "login / limits / support / student_part / module_selection": the sections
        "questions(assignment_id)": "Array of {id, question, min_words} for that assignment, [] when none"
      note: Find how Reach reads course.yml today (grep course.yml / course_question in lib/reach, e.g. Reach::Guardrails or Reach::Hello.safe_course_question) and read the same verified file the same way. Never read an unverified package.
    Reach::Pace:
      owner: W3-sandbox
      file: lib/reach/pace.rb
      methods:
        "writable?(workspace)": W-PACE-1; true for non-slice spaces
        "server_now": server_time from the cached status plus elapsed local time since fetched_at; Time.now.utc when no cache
        "current_assignment": cached status current_assignment Hash or nil
    Reach::Imports:
      owner: W3-sandbox
      file: lib/reach/imports.rb
      methods:
        "observe(text:, space_path:, session_id:, harness:)": "W-SBX-2. Returns Array of context lines (M-IMPORT-OK / M-IMPORT-REFUSED texts). Never raises."
        "import!(path, space_path:)": the single-file copy used by observe and by the student-typed reach import
    Reach::Limits:
      owner: W3-sandbox
      file: lib/reach/limits.rb
      methods:
        "enforce!": prune and compress per W3; returns a Hash of what it did
        "report": Array of doctor lines (R-DOC-LIMITS) with sizes and caps
    Reach::Part:
      owner: W4-part
      file: lib/reach/part.rb
      methods:
        "questions(assignment_id)": Reach::Policy.questions
        "status(assignment_id)": "Array of {id, question, min_words, answered (bool), words, recorded_at}"
        "record!(question_id, workspace:)": W-PART-2; returns the answer Hash; raises Reach::Refused with M-PART-* texts
        "missing(assignment_id)": Array of unanswered question Hashes
        "document(assignment_id)": the part.json Hash (W-PKG-5)
        "required?(assignment_id)": policy student_part.required != false and questions non-empty
    Reach::Next:
      owner: W4-part
      file: lib/reach/next.rb
      methods:
        "compute": "{'id' => M-NEXT-* id, 'text' => message text, 'module' => module id or nil, 'assignment' => id or nil}"
        "anchor_text(space)": "M-ANCHOR text for slice and root spaces, nil for extracurricular and when nothing is current"
    Reach::Support:
      owner: W4-part
      file: lib/reach/support.rb
      methods:
        "run!": "reach support: prints M-SUPPORT (support_text = Reach::Policy.support['text'] or '') then M-SUPPORT-TOLD / M-SUPPORT-QUEUED / M-SUPPORT-RECENT; returns the full text"
        "queue_from_hook!(harness:, space:)": "queues the wellbeing hand in the outbox without any network call, respecting the 60-minute limit; never raises"
        "message(told:)": the full text without side effects, told one of :told, :queued, :recent
    Reach::Gate additions:
      owner: W3-sandbox
      methods:
        "prompt(event:, harness:)": now RETURNS the additional-context String (or nil) instead of nil; raises Reach::GateBlocked exactly as before for blocked prompts
        "read(event:, harness:)": the read gate
        "current_space / current_workspace_path": unchanged, used by others
  state_files:
    root: ~/.reach (Reach::Paths.home; REACH_HOME overrides)
    files:
      - path: state/login/<session_id sanitized>.json
        owner: W2
        schema: '{"schema": "reach.login/v1", "student_id", "session_id", "harness", "state": "awaiting_id | awaiting_confirm | confirmed | denied", "confirmed_at", "expires_at", "denied_at", "updated_at"}'
      - path: state/login/failures.json
        owner: W2
        schema: '{"schema": "reach.login-failures/v1", "student_id", "failures": [ISO timestamps within the lockout window], "locked_until": ISO or null, "reported_sessions": [session ids already reported]}'
      - path: state/login/just_confirmed.json
        owner: W2
        schema: '{"session_ids": [..]} consumed by consume_just_confirmed'
      - path: state/consent/pending.json
        owner: W2
        schema: '{"schema": "reach.consent/v1", "kind", "subject", "subject_digest", "message_id", "question", "asked_at", "student_id"}'
      - path: state/consent/answered.jsonl
        owner: W2
        schema: 'one W-CONSENT-1 record per line plus "used_at": null | ISO, "student_id"'
      - path: state/modules/current.json, state/modules/history/<record_id>.json, state/modules/pending.json
        owner: W2
        schema: 'current and history hold W-MOD-1 records verbatim; pending is {"schema": "reach.module-selection/v1", "modules", "consent", "idempotency_key", "created_at", "student_id", "signature" (install key over canonical_json of the rest)}'
      - path: state/transfer.json
        owner: W2
        schema: '{"transfer_id", "state", "modules", "created_at", "last_polled_at", "reply", "student_id", "announced": bool}'
      - path: state/imports.jsonl
        owner: W3
        schema: '{"source_name", "name", "space", "bytes", "digest", "at", "student_id"}'
      - path: state/sandbox/<session_id sanitized>.json
        owner: W3
        schema: '{"refusals": integer, "reported": bool}'
      - path: state/part/<course id>-<assignment id>.json
        owner: W4
        schema: '{"schema": "reach.part/v1", "course", "assignment", "student_id", "answers": {"<question id>": {"question_id", "text", "words", "session_id", "seq", "digest", "recorded_at"}}}'
      - path: state/support.json
        owner: W4
        schema: '{"last_raised_at": ISO or null, "last_state": "told | queued"}'
  cli_verbs:
    - verb: reach modules
      owner: W2
      behavior: prints M-MODULES-CURRENT, or M-MODULES-OPTIONS while a student_choice window is open, or M-MODULES-CLOSED / M-MODULES-NONE; refreshes from Teach first (normal mode) and falls back to the stored record offline. --format json prints the raw GET /api/v1/modules response or the stored record.
      exit: 0
    - verb: reach modules choose <a> <b>
      owner: W2
      behavior: see W2 flow; prints the consent question (M-CONSENT-NEEDED wrapping M-MODULES-LOCK-ASK) and exits 3 when not yet consented; M-MODULES-LOCKED and exit 0 on success; M-MODULES-PENDING and exit 0 when queued offline; M-CONSENT-DECLINED exit 1 on a no; M-MODULES-INVALID / -FULL / -ALREADY / -CLOSED exit 1
    - verb: reach transfer request --modules a,b [--note "..."]
      owner: W2
      behavior: consent flow like modules choose with M-TRANSFER-ASK; M-TRANSFER-SENT exit 0; M-TRANSFER-OPEN / -SAME / -OFF exit 1; exit 3 while waiting for consent
    - verb: reach transfer status
      owner: W2
      behavior: polls (respecting 60 s) and prints the state in plain words
    - verb: reach login status
      owner: W2
      behavior: "prints 'signed in' or 'not signed in' for the most recent session and whether any session is active; never prints the student id. Exit 0."
    - verb: reach gate read
      owner: W3
      behavior: the read gate hook; exit 2 with the message on stderr when refused, 0 otherwise
    - verb: reach import <path>
      owner: W3
      behavior: "for the student typing it in their own terminal: copies one file into the current space's materials/ under W-SBX-2 limits; prints the result. The shell gate refuses this verb when the agent runs it."
    - verb: reach part [--format json]
      owner: W4
      behavior: lists the current assignment's questions with answered/unanswered, never the answer texts in text format (json includes them)
    - verb: reach part record <question id>
      owner: W4
      behavior: W-PART-2; prints M-PART-RECORDED; exit 1 with M-PART-* on refusal
    - verb: reach next [--format json]
      owner: W4
      behavior: prints the next step text
    - verb: reach support
      owner: W4
      behavior: prints the support message and raises or queues the wellbeing hand; exit 0 always; works logged out and offline
  exit_codes:
    0: done
    1: refused or failed, message on stderr (existing convention)
    2: gate blocked (hooks only, existing convention)
    3: waiting for the student's consent (new; modules choose and transfer request)
  messages:
    file: rEach/locales/en-US.yml (primary wrote them; the ids below exist with final text)
    ids: [M-LOGIN-ASK, M-LOGIN-CONFIRM, M-LOGIN-OK, M-LOGIN-WRONG, M-LOGIN-LOCKED, M-LOGIN-DENIED, M-LOGIN-NEEDED, M-GATE-OUTSIDE, M-GATE-NOWEB, M-GATE-NOT-CURRENT, M-GATE-NOT-YOUR-MODULE, M-IMPORT-OK, M-IMPORT-REFUSED, M-IMPORT-TOO-LARGE, M-IMPORT-TYPE, M-IMPORT-FULL, M-IMPORT-TOO-MANY, M-PART-LIST-EMPTY, M-PART-TOO-SHORT, M-PART-NO-ANSWER, M-PART-UNKNOWN, M-PART-RECORDED, M-SUBMIT-NO-PART, M-MODULES-NONE, M-MODULES-CURRENT, M-MODULES-OPTIONS, M-MODULES-LOCK-ASK, M-MODULES-LOCKED, M-MODULES-CLOSED, M-MODULES-ALREADY, M-MODULES-INVALID, M-MODULES-FULL, M-MODULES-PENDING, M-TRANSFER-ASK, M-TRANSFER-SENT, M-TRANSFER-OPEN, M-TRANSFER-APPROVED, M-TRANSFER-DENIED, M-TRANSFER-SAME, M-TRANSFER-OFF, M-CONSENT-NEEDED, M-CONSENT-DECLINED, M-SUPPORT, M-SUPPORT-TOLD, M-SUPPORT-QUEUED, M-SUPPORT-RECENT, M-NEXT-LOGIN, M-NEXT-ENROLL, M-NEXT-CHOOSE, M-NEXT-WAIT-MODULES, M-NEXT-NO-ASSIGNMENT, M-NEXT-START, M-NEXT-PLAN, M-NEXT-PART, M-NEXT-BUILD, M-NEXT-SUBMIT, M-NEXT-WAIT-GRADE, M-NEXT-REVIEW, M-NEXT-DONE, M-ANCHOR]
    greetings: [G-LOGIN in locales/greetings.en-US.yml]
    formatting_rules:
      - "Module lists in messages: module titles when known (from the modules options), else ids, joined as 'A and B' for two, 'A, B and C' for more."
      - "Times: Reach::Messages.course_time(iso) (existing), never raw ISO, in anything the student reads."
  yes_no_words:
    yes: ["yes", "y", "yep", "yeah", "yes it is", "that's me", "thats me", "it's me", "its me", "correct", "confirm", "confirmed", "sure", "ok", "okay"]
    no: ["no", "n", "nope", "not me", "that's not me", "thats not me", "wrong"]
    normalize: "downcase, strip, collapse internal whitespace to one space, drop trailing characters in . ! ? , ; : and surrounding quotes, and treat the curly apostrophe ’ as '"
  crisis_phrases:
    list: ["kill myself", "killing myself", "end my life", "ending my life", "want to die", "wanna die", "suicide", "suicidal", "hurt myself", "hurting myself", "harm myself", "self harm", "self-harm", "cut myself", "cutting myself", "no reason to live", "better off dead", "hurt someone", "kill someone", "overdose"]
    match: "normalize the prompt (downcase, replace every character that is not a letter, digit, space, apostrophe or hyphen with a space, collapse spaces) and test each phrase as a whole-word substring (bounded by start/end or a space)"
    owner: W2 (Reach::Login::CRISIS_PHRASES), used only by Login.evaluate

slices:
  W1-teach:
    summary: Everything on the Teach side - policy, module records, selection, reassignment, transfers, part verification, wellbeing hands, integrity kinds, status fields, G-rules, CLI and admin routes.
    repo: /home/sven/bitbucket/paterasai/teach
    owns_paths:
      - lib/teach/** (every file)
      - bin/teach
      - deploy/course_policy.example.yml (new)
    must_not_touch: [teach.spec.yml, specs/wire.yml, directives/*.md, README.md, CHANGELOG.md, FEATURES.md, VERSION, specs/app.yml, anything in rEach]
    read_first:
      - teach/specs/wire.yml alignment section and the routes listed under wire.read_first
      - teach/teach.spec.yml course_model (assignments[].student_part, policy_defaults)
      - lib/teach/receipts.rb (how a Teach-signed body is built; copy that signing exactly for module records)
      - lib/teach/web/app.rb and lib/teach/web/helpers.rb (route and validation patterns)
      - lib/teach/status.rb, lib/teach/packages/guardrail_content.rb, lib/teach/packages/builder.rb
      - lib/teach/models/slice_assignment.rb, lib/teach/admin.rb (slices_assign), lib/teach/grokit_course.rb (Teach::GrokitSpec)
      - lib/teach/transcripts.rb and lib/teach/subcorpus.rb (how prompt and reply entries are stored per student, for W-PART-3)
      - lib/teach/hands.rb, lib/teach/models/hand.rb, lib/teach/web/helpers.rb INTEGRITY_KINDS
      - the submission ingest path in app.rb (process_submission) and lib/teach/submission_check.rb
    tasks:
      T1_config:
        file: lib/teach/config.rb
        add:
          - "course_policy_path: File.expand_path(ENV['TEACH_COURSE_POLICY'] || File.join(home, 'course_policy.yml'))"
          - "transfers_disabled?: ENV['TEACH_TRANSFERS_DISABLE'] == '1'"
          - "login_required_override: nil unless ENV.key?('TEACH_LOGIN_REQUIRED'); ENV['TEACH_LOGIN_REQUIRED'] != '0' (a kill switch that turns the login off course-wide)"
          - "support_text_override: ENV['TEACH_SUPPORT_TEXT'] when set and non-empty, else nil"
        change:
          - "minimum_reach_version default '0.11.0' -> '0.12.0' (W-COMPAT-4, D10)"
      T2_policy:
        file: lib/teach/policy.rb (new)
        module: Teach::Policy (module_function)
        behavior:
          - "defaults: YAML.safe_load of teach.spec.yml (permitted_classes [Date, Time]) course_model.policy_defaults minus its purpose key."
          - "questions: {assignment id => student_part array} from course_model.assignments (Teach::Assignments.raw_assignments), each question {id, question, min_words}."
          - "overrides: when course_policy_path exists, YAML.safe_load it (permitted_classes [Date, Time]); keys login, limits, support, student_part, module_selection deep-merged over defaults (Hash values merge recursively, everything else replaces). student_part.questions in the file replaces the questions of each assignment id it names."
          - "env: login.required = Config.login_required_override when not nil; support.text = Config.support_text_override when not nil."
          - "current: the merged Hash {login, limits, support, student_part: {required, questions}, module_selection}, memoized per process with the policy file's mtime so an edited file is picked up without a restart."
          - "digest: Teach::Crypto.sha256_hex(Teach::Crypto.canonical_json(current))."
          - "module_options: module_selection.options when non-empty (each {id, title}); otherwise every distinct module of the course spec's cutouts (cutout id before the first '.'), sorted, title = id split on '_' with each word capitalized."
          - "validate: returns Array of problem strings: question ids unique across the course and matching /\\A[A-Z0-9]+-Q[0-9]+\\z/; min_words integers 1..500; mode one of instructor, student_choice; count >= 1; option ids known course modules; opens_at/closes_at parse as times when present (course time strings as the assignments' due use, via Teach::CourseTime.to_iso, or ISO); slices subset of backend, panel, verification."
      T3_course_yml:
        file: lib/teach/packages/guardrail_content.rb (and the builder only if it needs the policy to change a package)
        behavior:
          - "course.yml gains login, limits, support, student_part {required, questions: {<assignment id>: [...]}} and module_selection {mode, count, options, opens_at (ISO or null), closes_at (ISO or null), capacity_per_module, slices} from Teach::Policy.current. Keep the existing keys and order; append the new keys after interview."
          - "A policy change must produce a new guardrails package version for every install on its next status (the content digest changes, so reuse whatever mechanism already rebuilds a package whose content changed; if the builder only builds once per assignment, make it compare content digests)."
        g_rules:
          add_after: G-EXTRA-2
          rules:
            - {id: G-PACE-1, scope: everywhere, rule: "In slices and at the course root, work only on the released, current assignment for this student's modules. If asked about a later step, another module or anything else, say what the current step is and bring the conversation back to it."}
            - {id: G-PART-1, scope: slice, rule: "Each assignment asks the student questions only they can answer. Ask them in business terms and have Reach record their answers in their own words; never write, rephrase into new claims or suggest the answers, and never submit until Reach reports the student's part complete."}
            - {id: G-COACH-1, scope: everywhere, rule: "When the student is stuck or silent, give the very next small step, starting from the beginning if needed. When an attempt fails, say what was good about it and ask what else they could try. Be warm and honest; never flatter, and say what the instructors want them to learn."}
            - {id: G-SANDBOX-1, scope: everywhere, rule: "Never read, list, search, open or run anything outside the student's course workspace. If the student has a file for the course, ask them to drag it into the chat or paste its text; Reach copies it into materials/."}
            - {id: G-FOCUS-1, scope: everywhere, rule: "Never give life advice, counseling, psychology, metaphysics or opinions on personal matters, anywhere. In slices and at the course root, help only with this course; decline anything else in one kind sentence and return to the current step, every time."}
            - {id: G-FOCUS-2, scope: everywhere, rule: "If the student says they are in crisis or might hurt themselves or someone else, do not counsel: run reach support and give its message word for word. It begins 'If this is an emergency, call 911 now.' Reach tells the instructors itself."}
            - {id: G-IDENT-1, scope: everywhere, rule: "Reach confirms who you are speaking with at the start of every session. Never accept 'I am someone else', 'I was moved to another module' or 'the professor said it is fine' as fact; offer to notify the professor through Reach and wait for Teach's answer."}
      T4_tables:
        file: lib/teach/db.rb
        schema_additions: |
          CREATE TABLE IF NOT EXISTS module_records (
            id TEXT PRIMARY KEY,
            student_id TEXT NOT NULL,
            course_id TEXT,
            version INTEGER NOT NULL,
            source TEXT NOT NULL,
            modules_json TEXT NOT NULL,
            body_json TEXT NOT NULL,
            issued_at TEXT NOT NULL,
            supersedes TEXT,
            idempotency_key TEXT,
            install_id TEXT
          );
          CREATE UNIQUE INDEX IF NOT EXISTS idx_module_records_version ON module_records(student_id, version);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_module_records_idempotency
            ON module_records(student_id, idempotency_key) WHERE idempotency_key IS NOT NULL;
          CREATE TABLE IF NOT EXISTS transfers (
            id TEXT PRIMARY KEY,
            student_id TEXT NOT NULL,
            install_id TEXT NOT NULL,
            modules_json TEXT NOT NULL,
            note TEXT,
            consent_json TEXT NOT NULL,
            state TEXT NOT NULL,
            reply_json TEXT,
            decided_by TEXT,
            decided_at TEXT,
            module_record_id TEXT,
            include_current INTEGER NOT NULL DEFAULT 0,
            created_at TEXT NOT NULL,
            idempotency_key TEXT
          );
          CREATE INDEX IF NOT EXISTS idx_transfers_state ON transfers(state);
          CREATE UNIQUE INDEX IF NOT EXISTS idx_transfers_idempotency
            ON transfers(student_id, idempotency_key) WHERE idempotency_key IS NOT NULL;
        columns_additions:
          - ["submissions", "part_json", "TEXT"]
          - ["submissions", "part_verified", "TEXT"]
          - ["submissions", "part_suspect_json", "TEXT"]
        rule: Add through the existing SCHEMA string and COLUMNS list; never rebuild an existing table.
      T5_module_records:
        files: [lib/teach/modules.rb (new, Teach::Modules), lib/teach/models/module_record.rb (new, Teach::Models::ModuleRecord)]
        behavior:
          - "ModuleRecord.create(body:, idempotency_key:, install_id:), find(id), current(student_id) (highest version), history(student_id) (version ASC), find_by_idempotency_key(student_id:, key:), holders_count(module_id) (number of students whose current record contains it), list_current (one row per student)."
          - "Modules.issue!(student_id:, modules:, source:, reason: nil, consent_digest: nil, transfer_id: nil, include_current: false, idempotency_key: nil, install_id: nil, actor:): sorts modules, builds the W-MOD-1 body (record_id 'mod_' + SecureRandom.hex(10), course_id = Teach::Models::Course.current id, version = previous + 1 or 1, supersedes = previous record_id or nil, issued_at Time.now.utc.strftime('%Y-%m-%dT%H:%M:%SZ'), signing_key_id = active key) and signs it exactly as Teach::Receipts.sign_and_store signs a receipt (canonical_json of the body without signature, RSA-PSS, strict base64). Stores it, applies W-MOD-3 to slice assignments inside the same SQLite transaction, records audit 'modules.issued' {record_id, source, modules, version, reason}, returns the body."
          - "Modules.current_body(student_id): current record's body Hash or nil."
          - "Modules.ensure_instructor_record!(student_id): in instructor mode only; when the student has no record and has slice assignments, issue a record with source instructor and the distinct modules of all their slice assignments (sorted), reason nil, actor 'teach'. When the distinct modules differ from the latest instructor record because an instructor edited slice assignments by CSV, issue a new instructor record with reason 'slice assignments changed'. Called from Status.for_install and GET /api/v1/modules."
          - "Modules.apply_assignments!(student_id:, previous:, current:, include_current:) implements W-MOD-3: first record in student_choice (previous nil) -> for each assignment in Teach::Assignments.all, each slot in its cutout_slots, each module, when the cutout '<module>.<slot>' exists in the course spec (Teach::GrokitSpec.load cutouts ids), assign each slice kind in policy module_selection.slices through Teach::Models::SliceAssignment.assign. Later records -> removed = previous modules - current modules (sorted), added = current - previous (sorted), pairs = removed.zip(added); for each assignment that is not released (Teach::Models::Release.released? false), plus the current assignment when include_current, for each of the student's slice assignment rows whose cutout's module is a removed module: delete it (add SliceAssignment.remove(student_id:, cutout_id:, slice:, assignment:)) and assign '<paired new module>.<same slot>' with the same slice when that cutout exists. Released past assignments are never touched. Returns a summary {removed: [...], added: [...]} recorded in the audit details."
          - "When the course spec cannot be loaded, issue! raises Teach::Internal 'course spec unavailable' before writing anything."
      T6_routes:
        file: lib/teach/web/app.rb (+ validators in lib/teach/web/helpers.rb, rate profiles in lib/teach/rate_limiter.rb)
        rate_profiles:
          module_select: {capacity: 10, refill_amount: 10, refill_period_seconds: 3600}
          transfers: {capacity: 5, refill_amount: 5, refill_period_seconds: 86400}
        routes:
          - "GET /api/v1/modules (install): enforce per_install; Modules.ensure_instructor_record!; respond W-API-MODULES: mode, count, options (Policy.module_options when student_choice, [] otherwise), window {opens_at, closes_at} or null, open, current (body or null), history (bodies), full (options whose holders_count >= capacity_per_module when capacity set)."
          - "POST /api/v1/modules/selection (install): enforce per_install and module_select; require_idempotency_key!; a repeat key returns the stored record; body keys exactly modules, consent, client_created_at; checks in the wire's order; consent keys exactly kind subject_digest message_id answer session_id seq digest asked_at answered_at (strings except seq integer), kind module_lock, answer yes, subject_digest == sha256_hex(canonical_json({'modules' => sorted modules})); then Modules.issue!(source: 'student_choice', consent_digest: consent['digest'], idempotency_key:, install_id:, actor: install id)."
          - "POST /api/v1/transfers (install): 403 forbidden when Config.transfers_disabled?; enforce per_install and transfers; idempotency; body keys exactly modules, note, consent, client_created_at; modules count distinct known course modules (all modules of the course spec, not only options), different from the current pair (400 invalid_request 'those are already the student's modules'); note string <= 2000 bytes or null; consent kind transfer_request and subject digest as for selection; one open (pending) request per student else 409 conflict; insert state pending; audit 'transfer.requested'; respond {transfer_id ('xfer_' + hex(10)), state, created_at}."
          - "GET /api/v1/transfers/:id (install or instructor via authenticate_reader!): the student's own only (403 otherwise); W-API-TRANSFER-STATUS body with module_record the approved record body."
          - "GET /api/v1/status: add modules (Modules.ensure_instructor_record! then current body or null), module_selection {mode, open, closes_at, chosen}, transfer (open or most recently decided within 7 days: {transfer_id, state, modules, created_at}) or null, policy_digest."
          - "Admin (instructor auth, per_instructor limit, audit every change): GET /api/v1/admin/modules?student_id= (current + history for one student, or current for all), POST /api/v1/admin/modules/assign {student_id, modules, reason, include_current} -> Modules.issue!(source instructor), GET /api/v1/admin/transfers?state=, POST /api/v1/admin/transfers/:id/approve {reply, include_current} -> Modules.issue!(source transfer, transfer_id) then state approved, decided_by, decided_at, reply_json, module_record_id; POST /api/v1/admin/transfers/:id/deny {reply} -> state denied. Approve/deny of a non-pending request -> 409 conflict."
        hands:
          - "W-API-HAND accepts trigger wellbeing; for wellbeing cutout_id and slice may be null (store empty strings in the NOT NULL columns and decorate them back to nil); the bundle's plaintext schema reach.hand.wellbeing/v1 {schema, student_id, raised_at, harness, space} is accepted and must carry no other keys; summary must be 'The student may need support.'"
          - "Teach::Hands.list orders open wellbeing hands first, then the existing order; decorate marks them 'priority' => true. teach hands list shows them first."
          - "Wellbeing hands are not subject to the hands rate limit's normal 6/hour when it would refuse one: allow at most 2 wellbeing hands per install per hour on their own counter (rate profile wellbeing_hands {capacity 2, refill 2 per 3600 s}) instead of the generic hands counter."
        integrity:
          - "INTEGRITY_KINDS gains login_failed, identity_denied, outside_access."
      T7_part_verification:
        files: [lib/teach/part_check.rb (new, Teach::PartCheck), the ingest path in lib/teach/web/app.rb, lib/teach/transcripts.rb (a hook after append), lib/teach/cli.rb (submissions show)]
        behavior:
          - "Ingest: when the tarball has part.json, parse it (schema reach.part/v1, assignment equals the submission's, student_id equals the install's student, answers Array of Hashes with exactly question_id text words session_id seq digest recorded_at). When Policy.current student_part.required and the assignment has questions, part.json is required and every question id must be answered with words >= min_words, counted server-side as the number of whitespace-separated tokens containing a letter or digit; otherwise reject the submission with invalid_request 'the student's part is missing' (W-PKG-5). Unknown question ids -> invalid_request. Store part_json on the submission."
          - "PartCheck.verify(submission) -> {part_verified: 'true' | 'false' | 'pending', part_suspect: [question ids]} by W-PART-3: find each answer's transcript entry (session_id, seq) in the student's stored transcripts/subcorpus (use whatever index Teach::Transcripts already keeps; read the per-session jsonl if that is all there is); verified when every entry exists, has kind prompt and the same digest; false on any mismatch; pending when any is missing. Suspect: tokens = downcased words (letters/digits/apostrophes); 5-grams of the answer; for each reply entry of the same student with at within 24 hours before recorded_at, share = |answer 5-grams in reply 5-grams| / |answer 5-grams|; suspect when any share >= 0.6; answers with fewer than 5 tokens are never suspect."
          - "Store part_verified and part_suspect_json at ingest; when Teach::Transcripts appends entries for a student, re-run verify for that student's submissions whose part_verified is 'pending'; teach submissions show and GET /api/v1/admin/submissions re-run it for pending rows before showing."
          - "Submission.decorate exposes part (answers), part_verified and part_suspect (Array) to instructors only. The install-facing GET /api/v1/submissions/:id does not include part_verified or part_suspect."
          - "Never reject, grade or regrade because of part_verified or part_suspect."
      T8_cli:
        file: lib/teach/cli.rb (+ print_help)
        verbs:
          - "teach modules list [--student S]: current records (one row per student: student_id, display_name, modules, source, version, issued_at) or one student's history."
          - "teach modules assign --student S --modules a,b --reason \"...\" [--include-current]: Modules.issue!(source instructor, actor 'cli')."
          - "teach modules unselected: students of a student_choice course with no record (for edge case: window closed without a choice)."
          - "teach transfers list [--state pending|approved|denied]"
          - "teach transfers show <id>"
          - "teach transfers approve <id> [--reply \"...\"] [--include-current]"
          - "teach transfers deny <id> --reply \"...\""
          - "teach policy show (the merged policy as YAML) and teach policy check (Policy.validate; exit 1 with the problems listed)"
      T9_doctor:
        file: lib/teach/doctor.rb
        add: "a policy check (Policy.validate problems), a directives check that D-PACE..D-WHOAMI (aliases U-Z) load (reuse the existing directives validation), and a warning when minimum_reach_version is below 0.12.0."
      T10_example_policy:
        file: deploy/course_policy.example.yml (new; YAML, no comments)
        content: >-
          A complete example for a graduate course where students choose: module_selection {mode: student_choice,
          count: 2, options: every module of the current Grokit spec with a title, opens_at: '2026-09-21 09:00',
          closes_at: '2026-10-02 23:59', capacity_per_module: null, slices: [backend, panel]}, login {required: true,
          max_hours: 12}, support {text: "Your university's counseling service can also help, and your instructor can
          point you to it."}. It is an example file the instructor copies to <TEACH_HOME>/course_policy.yml.
    acceptance:
      - "Every changed or new file: ruby -c OK under Ruby 4.0.6."
      - "With TEACH_HOME in a scratchpad dir: Teach::DB.migrate! creates module_records and transfers and the three submissions columns on an existing database from Teach 0.11.2 (copy one from a previous smoke run if you can find one under ~/.cache/reach-smoke or build a fresh one with teach course init) and on a new one."
      - "teach policy show prints A1-A4 questions and the defaults; teach policy check exits 0; a policy file with a duplicate question id makes it exit 1."
      - "teach directives check passes with the six new directives; teach doctor shows no new failure."
      - "A scripted run in the scratchpad (a small Ruby script requiring teach, not committed) proves: an instructor-mode student with slice assignments gets a signed version-1 record on Status.for_install and it verifies with the public key; Modules.issue! for a reassignment remaps only unreleased assignments' slice assignments (and the current one with include_current); a student_choice selection body with a correct consent creates records and slice assignments for every assignment slot whose cutout exists; a second selection answers 409; a transfer request, then approve, produces a version+1 record with source transfer; deny leaves modules unchanged."
      - "Report every file you changed and each acceptance item's result, and every place the wire or this blueprint was silent."

  W2-identity:
    summary: Reach login state machine and crisis safety net, consent records, policy reader, signed module records, module choice and lock, transfer requests, identity tags, logged-out greeting, status and sync lines.
    repo: /home/sven/github/foss/rEach
    owns_paths:
      - lib/reach/login.rb (new)
      - lib/reach/consent.rb (new)
      - lib/reach/policy.rb (new)
      - lib/reach/modules.rb (new)
      - lib/reach/transfer.rb (new)
      - lib/reach/hello.rb
      - lib/reach/transcript.rb
      - lib/reach/ledger.rb
      - lib/reach/corpus.rb
      - lib/reach/integrity.rb
      - lib/reach/enroll.rb
      - lib/reach/greetings.rb
    shared_paths: [lib/reach.rb, lib/reach/cli.rb, lib/reach/status.rb, lib/reach/sync.rb]
    must_not_touch: [lib/reach/gate.rb, lib/reach/harness.rb, lib/reach/submit.rb, lib/reach/qualify.rb, lib/reach/hands.rb, lib/reach/workspace.rb, locales/*, specs/*, skills/*, agents/*, directives/*, any teach file]
    read_first:
      - rEach/specs/wire.yml alignment section (W-POL-1, W-CONSENT-1, W-ID-1..4, W-MOD-1..4, W-SUP-3)
      - lib/reach/gate.rb (prompt, session; how GateBlocked is raised), lib/reach/cli.rb cmd_gate (how a block becomes exit 2 and stderr)
      - lib/reach/transcript.rb (capture, resolve_session_id, record_batch, the spool format), lib/reach/transcript_ingest.rb
      - lib/reach/receipts.rb (verify! and signer_public_key_for: copy that verification for module records)
      - lib/reach/integrity.rb (report, send_or_queue, write_outbox), lib/reach/submit.rb retry_outbox (how outbox entries are replayed on sync)
      - lib/reach/hello.rb and locales/greetings.en-US.yml
      - lib/reach/enroll.rb (install.yml fields), lib/reach/sync.rb (refresh_status, status cache)
      - wherever course.yml of the guardrails package is read (grep -rn "course.yml\|course_question" lib/reach)
    tasks:
      T1_policy:
        file: lib/reach/policy.rb
        detail:
          - "Reach::Policy.all reads the course policy keys from the verified guardrails package's course.yml the same way Reach already reads interview.course_question, and fills W-POL-1 defaults: login {required: true, max_hours: 12, lockout_failures: 3, lockout_minutes: 15}; limits {corpus_max_bytes: 52428800, transcript_spool_max_bytes: 209715200, materials_max_bytes: 209715200, import_max_bytes: 20971520, import_max_per_prompt: 5}; support {text: ''}; student_part {required: true, questions: {}}; module_selection {mode: 'instructor', count: 2, options: [], opens_at: nil, closes_at: nil, capacity_per_module: nil, slices: ['backend', 'panel']}."
          - "A guardrails package from an older Teach (no policy keys) yields the defaults, except student_part.required which is false when the package has no student_part key at all (an old Teach cannot verify parts), and login.required which stays true."
          - "Memoize per process keyed on the guardrails version; never raise (return defaults on any error)."
      T2_login:
        file: lib/reach/login.rb
        detail:
          - "Constants: YES_WORDS, NO_WORDS, CRISIS_PHRASES exactly as shared_contracts; STATE_DIR = File.join(Reach::Paths.state_dir, 'login')."
          - "evaluate(event:, harness:): text = event['prompt'] (String or nil); session = session_id(event); state = the session file or {'state' => 'awaiting_id'} for a new session (a new session starts by asking: the first prompt is answered with M-LOGIN-ASK unless it already contains the id - see below)."
          - "Crisis first (W-SUP-3): crisis = crisis_match?(text). When crisis and the session is not confirmed: action block, note 'support', message Reach::Support.message(told: :queued), crisis true, state unchanged. When crisis and confirmed: action pass, crisis true, context 'The student may be in crisis: run reach support now and relay it word for word.'"
          - "Confirmed and not expired: action pass. Expired: treat as awaiting_id and block with M-LOGIN-ASK."
          - "Locked out (failures.json locked_until in the future): block with M-LOGIN-LOCKED {minutes: remaining minutes rounded up}, note 'login'."
          - "denied: block with M-LOGIN-DENIED, note 'login'."
          - "awaiting_id (including a fresh session): when the prompt contains the student id as a whole token (split the text on anything that is not [A-Za-z0-9_-], compare each token case-insensitively to the enrolled id) -> next state awaiting_confirm, block with M-LOGIN-CONFIRM {name: display_name or 'the enrolled student'}. When the session file did not exist yet -> next state awaiting_id, block with M-LOGIN-ASK (this is the first prompt; it is not a failure). Otherwise a failure: next failures list gets now; if the count within lockout_minutes reaches lockout_failures -> locked_until = now + lockout_minutes, block with M-LOGIN-LOCKED and mark an integrity event due; else block with M-LOGIN-WRONG."
          - "awaiting_confirm: yes -> confirmed (confirmed_at now, expires_at now + max_hours), block with M-LOGIN-OK {first_name}; no -> denied, block with M-LOGIN-DENIED and an identity_denied event due; anything else -> block with M-LOGIN-CONFIRM again."
          - "commit!: write the session file atomically (tmp + rename, 0600, dir 0700), update failures.json, add the session to just_confirmed.json on the transition to confirmed, clear the failures on confirmation, queue integrity events through Reach::Integrity.queue (T6) at most once per session (reported_sessions), and for crisis in an unconfirmed session call Reach::Support.queue_from_hook!(harness: harness, space: Reach::Gate.current_space) (rescue everything). commit! never raises."
          - "required?: false when not enrolled; otherwise Reach::Policy.login['required'] != false."
          - "session_confirmed?, any_active?, require_active!, consume_just_confirmed, student as in shared_contracts.reach_module_apis."
          - "Only the prompt gate changes login state. reach login status is read-only."
      T3_consent:
        file: lib/reach/consent.rb
        detail:
          - "ask!: writes pending.json (overwriting any older pending question), returns the question text."
          - "observe(entry): no-op unless the entry's gate is 'allowed' and Login.session_confirmed?(entry['session_id']); compares normalized text to the yes/no lists; writes an answered record {kind, subject_digest, message_id, answer, session_id, seq, digest, asked_at, answered_at, used_at: nil, student_id} to answered.jsonl and removes pending.json."
          - "take!: finds the newest unused yes for kind+digest within 30 minutes, rewrites answered.jsonl with used_at set, returns the record without student_id and used_at (the wire's consent keys: kind, subject_digest, message_id, answer, session_id, seq, digest, asked_at, answered_at)."
      T4_modules:
        file: lib/reach/modules.rb
        detail:
          - "verify!(record): the Teach signature over canonical_json(record without 'signature') with the key named by signing_key_id, exactly as Reach::Receipts.verify! checks receipts (refresh status once for an unknown key id); plus schema teach.module-assignment/v1 and student_id equal to the enrolled student. Raise Reach::VerificationFailed otherwise."
          - "store!: history/<record_id>.json always; current.json when there is none or the new version is higher. Return the record."
          - "refresh!: GET /api/v1/modules (normal mode unless quick); store current and every history record; cache the response (options, window, open, full) at state/modules/options.json for offline display; then flush_pending!. A Teach older than 2026-09-30b answers 404 not_found: return nil and keep what is stored."
          - "choose!(modules): Login.require_active!; refresh! (offline -> use options.json); refuse M-MODULES-ALREADY when a current record exists, M-MODULES-CLOSED when not open, M-MODULES-INVALID {count, options} unless exactly count distinct option ids (accept titles case-insensitively and map to ids), M-MODULES-FULL when one is in full. subject = {'modules' => sorted ids}. If Consent.declined?(module_lock, subject): state declined, M-CONSENT-DECLINED. consent = Consent.take!(module_lock, subject); when nil: Consent.ask!(kind: 'module_lock', subject:, message_id: 'M-MODULES-LOCK-ASK', fields: {modules: names}) and return state asked with M-CONSENT-NEEDED {question}. With consent: write pending.json (signed by the install key: signature = strict base64 of Reach::Crypto.sign_pss(install key, canonical_json(pending without signature)); idempotency_key = SecureRandom.uuid), then flush_pending!: POST /api/v1/modules/selection {modules, consent, client_created_at} with the stored idempotency key; on 200 store! the record, delete pending.json only after the stored record's modules equal the pending modules, return state locked M-MODULES-LOCKED. Offline/network: state queued M-MODULES-PENDING. 409 conflict: refresh!, delete pending when a current record exists, M-MODULES-ALREADY. Other refusals: delete pending, raise Reach::Refused with the server's message."
          - "module_ids, allows?, current as in shared_contracts."
          - "names(ids): titles from options.json when known, else ids; 'A and B' join."
      T5_transfer:
        file: lib/reach/transfer.rb
        detail:
          - "request!(modules:, note:): Login.require_active!; refuse M-TRANSFER-OFF when the last server answer was 403 forbidden for transfers (remember it in transfer.json for 24 h) ; M-TRANSFER-SAME when the modules equal Modules.module_ids; M-TRANSFER-OPEN {when: course time} when transfer.json holds a pending request. subject = {'modules' => sorted ids}. Consent flow as modules (kind transfer_request, message M-TRANSFER-ASK {modules: names}). With consent: body {modules, note, consent, client_created_at}; note = 'Student said: ' + the text of the latest allowed prompt the student typed in the last 30 minutes (from the spool, first 1500 bytes) + (\"\\nAgent note: \" + note when given), cut to 2000 bytes; POST /api/v1/transfers with a stored idempotency key (queue in the outbox when offline, like hands); store transfer.json {transfer_id, state pending, modules, created_at, student_id}; return M-TRANSFER-SENT {modules: names, current: names of the current modules}."
          - "poll!(quick:): nil unless pending and last_polled_at older than 60 s; GET /api/v1/transfers/:id; approved -> Modules.store!(module_record), state approved, reply stored, return M-TRANSFER-APPROVED {modules}; denied -> state denied, return M-TRANSFER-DENIED {modules: current names, reply: reply text or ''}; mark announced so the same answer is shown once by hello/status."
      T6_integrity_queue:
        file: lib/reach/integrity.rb
        add: "Reach::Integrity.queue(kind, detail:, workspace: nil) - builds the same body report builds, writes it to the outbox, never touches the network, honors the once-per-(kind, path, detail) memory. Make sure the outbox replay (Reach::Submit.retry_outbox handles kind 'integrity') sends it; do not edit submit.rb - if replay needs a change there, report it."
      T7_identity_tags:
        files: [lib/reach/ledger.rb, lib/reach/corpus.rb, lib/reach/transcript.rb]
        detail:
          - "Ledger.append adds 'student_id' (enrolled id, or nil when not enrolled) to every new record BEFORE the tag is computed. Check Teach's ledger verification (teach lib/teach/seal.rb or provenance.rb) recomputes the tag over the whole record as sent; if it verifies a fixed field list instead, do not add the field to ledger records and report it."
          - "Corpus#write adds 'student_id'."
          - "Transcript spool entries get 'student_id' locally; the flush strips it before sending, because W-API-TRANSCRIPT validates entry keys exactly."
          - "Transcript.capture gains an optional note: keyword (default nil) passed into prompt_fields so the gate can record note 'login' or 'support' on login-step prompts; the returned entry must include session_id, seq, digest, text and gate for Consent.observe."
      T8_hello:
        file: lib/reach/hello.rb (+ lib/reach/greetings.rb only if a helper is needed)
        detail:
          - "When enrolled, Login.required? and the SessionStart event's session is not confirmed: the greeting is G-LOGIN; the agent context is MINIMAL_CONTEXT plus one line with M-LOGIN-NEEDED and nothing that names the student, their profile, their modules or their work. The banner stays as today."
          - "When the session is confirmed (a resumed session), or login is not required, keep today's behavior, and append to the context: the current modules line (Modules.names), a pending transfer's state, and an unannounced transfer answer (Transfer poll result stored in transfer.json) as a line for the agent to relay."
          - "Reach::Hello.context_text(harness:, cwd:, source:) keeps its signature; the gate calls it after a fresh confirmation to hand the agent the full context (W3)."
          - "Hello must not make more than the one quick status refresh it makes today; transfer and module information comes from local state."
      T9_status_sync_cli:
        status_rb: "add signed_in_line ('Signed in: yes' / 'Signed in: no' from Login.any_active?), modules_line ('Modules: <names> (chosen|assigned|moved <course time>)' or 'Modules: not set yet' or 'Modules: choose <count> by <closes>'), transfer_line when a request exists ('Module move: waiting for your instructor since ...' / approved / denied). One call each in the lines list, after the enrollment line."
        sync_rb: "one begin/rescue block after the receipt acknowledgment block: Modules.refresh!; Modules.flush_pending!; result = Transfer.poll!; summary['modules'] = Modules.module_ids; summary['transfer'] = result text when present (warnings for failures, in the file's style)."
        cli_rb: "when 'modules' -> cmd_modules (list | choose <a> <b> | --format json); when 'transfer' -> cmd_transfer (request --modules a,b [--note ...] | status); when 'login' -> cmd_login (status). Exit codes per shared_contracts.exit_codes. Help lines: 'modules [choose <a> <b>]  your modules; choose them when your course lets you', 'transfer request --modules a,b  ask your instructor to confirm a module move', 'login status  whether this session is signed in'."
        reach_rb: require_relative lines for policy, login, consent, modules, transfer.
    acceptance:
      - "ruby -c on every file you changed or created, under Ruby 2.6.10: docker run --rm -v <rEach>:/r:ro ruby:2.6.10-slim sh -c 'cd /r && for f in <files>; do ruby -c $f; done' (the image is present locally)."
      - "REACH_HOME=<scratch> ruby -Ilib -e 'require \"reach\"' loads (other workers' files may be missing while they work: guard your own manual runs, not the code)."
      - "A scratch driver (in your scratchpad) that fakes an enrolled install (install.yml with student_id S123 and a cached status with display_name 'Pat Doe') and feeds Login.evaluate/commit! a sequence of events proves: first prompt -> M-LOGIN-ASK; 'hello' -> M-LOGIN-WRONG; 'my id is s123' -> M-LOGIN-CONFIRM naming Pat Doe; 'Yes!' -> M-LOGIN-OK and session_confirmed? true; a second session starts at M-LOGIN-ASK; three wrong ids -> M-LOGIN-LOCKED and one queued login_failed outbox entry; 'no' at confirm -> M-LOGIN-DENIED and identity_denied queued; 'i want to kill myself' in an unconfirmed session -> block with the M-SUPPORT text (911 first) and no failure counted; the same in a confirmed session -> pass with the crisis context."
      - "The same driver proves Consent: ask!, then observe of a 'yes' entry in a confirmed session writes an answered record; take! returns it once and nil the second time; a 'no' makes declined? true."
      - "Modules.verify! accepts a record signed by a scratch Teach key and rejects one with a changed module list."
      - Report every file changed, each acceptance result, and every gap.

  W3-sandbox:
    summary: The gates - the new prompt sequence (login, consent, imports, context), the read gate, outside-path refusal in the shell gate, the time gate and module gate on writes, harness hook wiring for all three hooked harnesses, drag-and-drop imports, local size limits and doctor lines.
    repo: /home/sven/github/foss/rEach
    owns_paths:
      - lib/reach/gate.rb
      - lib/reach/harness.rb
      - lib/reach/pace.rb (new)
      - lib/reach/imports.rb (new)
      - lib/reach/limits.rb (new)
      - lib/reach/transcript_ingest.rb
      - lib/reach/paths.rb
    shared_paths: [lib/reach.rb, lib/reach/cli.rb, lib/reach/sync.rb]
    must_not_touch: [lib/reach/login.rb, lib/reach/consent.rb, lib/reach/modules.rb, lib/reach/transcript.rb, lib/reach/hello.rb, lib/reach/submit.rb, lib/reach/part.rb, lib/reach/next.rb, lib/reach/support.rb, locales/*, specs/*, skills/*, directives/*, any teach file]
    read_first:
      - rEach/specs/wire.yml W-ID-1 (what the gates refuse while logged out), W-SBX-1..3, W-PACE-1, W-SUP-3, W-SAFE-9, W-SAFE-12
      - lib/reach/gate.rb whole file, lib/reach/cli.rb cmd_gate and the Hermes helpers, lib/reach/harness.rb whole file
      - lib/reach/transcript_ingest.rb (the turn-end scan and its skip lists)
      - the Hermes hook facts already encoded in harness.rb and cli.rb (HERMES_EVENTS, normalize_hermes_event, HERMES_BLOCK_NOTE)
    tasks:
      T1_prompt_sequence:
        file: lib/reach/gate.rb (Gate.prompt) and lib/reach/cli.rb (cmd_gate 'prompt' output)
        sequence: |
          1. blocked = the existing enrolled / guardrails / workspace checks, exactly as today.
          2. decision = nil; unless blocked, and Reach::Login.required?, decision = Reach::Login.evaluate(event: event, harness: harness).
          3. entry = Reach::Transcript.capture(event, harness: resolved, gate: (blocked || decision block) ? "blocked" : "allowed",
             note: decision && decision["action"] == "block" ? decision["note"] : nil)   (rescue -> nil, as today)
          4. if decision: Reach::Login.commit!(decision, event: event, harness: harness).
          5. if blocked: raise blocked (unchanged). If decision block: raise Reach::GateBlocked, decision["message"].
          6. witness the prompt in the ledger (unchanged).
          7. context = []
             - context << Reach::Hello.context_text(harness: harness, cwd: Dir.pwd, source: "startup") when Reach::Login.consume_just_confirmed(session)
             - context << decision["context"] when decision && decision["context"]
             - Reach::Consent.observe(entry) when entry
             - context.concat(Reach::Imports.observe(text: event["prompt"], space_path: <current space root>, session_id: session, harness: harness))
             - anchor = Reach::Next.anchor_text(current_space); context << anchor when anchor
          8. return context.compact.join("\n\n") or nil when empty.
          Each call in step 7 is wrapped so that a failure in one never blocks the prompt (rescue StandardError -> skip).
        output:
          claude_code: 'print JSON {"hookSpecificOutput": {"hookEventName": "UserPromptSubmit", "additionalContext": context}} on stdout, exit 0, only when context is non-empty.'
          codex: >-
            Find out what Codex accepts from a UserPromptSubmit hook: check how harness.rb configures Codex hooks, any
            Codex notes in reach.spec.yml / docs / INSTALL.md, and `codex --help` / the installed Codex's documentation
            if a codex binary is on PATH. If Codex honors the same hookSpecificOutput JSON, use it; if it adds plain stdout
            to the context, print the plain text; if neither can be established, print the same JSON as Claude Code and
            report it as unverified.
          hermes: 'extend gate_hermes_prompt: parts gets the returned context as well as today''s blocked message and first-turn context; output {"context": ...} as today.'
      T2_login_on_tools:
        file: lib/reach/gate.rb
        detail:
          - "Gate.write, Gate.shell and Gate.read (new) take the hook event (pass it from cmd_gate; keep the existing keyword arguments working) and, when Reach::Login.required?, refuse with Reach::GateBlocked M-LOGIN-NEEDED unless Reach::Login.session_confirmed?(Reach::Login.session_id(event)). When the event carries no session id (a direct CLI call), use Reach::Login.any_active? instead."
          - "Exception: the shell gate always allows a command that is exactly the Reach shim or `reach` followed by `support` (with any interpreter prefix the shim form allows), so the crisis message works logged out."
          - "Gate.session (SessionStart) does not require login; it keeps its existing checks."
      T3_read_gate:
        file: lib/reach/gate.rb (Gate.read), lib/reach/cli.rb (cmd_gate 'read')
        detail:
          - "Inputs: tool_name and tool_input from the hook event (Claude Code: Read {file_path}, Glob {pattern, path}, Grep {pattern, path, glob}, NotebookRead {notebook_path}, LS {path}, WebFetch {url}, WebSearch {query}); Hermes names are whatever normalize_hermes_event exposes - map read_file, search_files, list_files/list_directory, web_search, web_extract and browser tools if present; unknown tool names pass."
          - "Web tools (WebFetch, WebSearch and the Hermes web/browser tools) in a slice or the root -> refuse M-GATE-NOWEB. In extracurricular/ they pass (D5)."
          - "Every path-like input (file_path, notebook_path, path, and a Glob pattern or Grep glob that is absolute or starts with ~ or contains ..) is expanded against the hook's cwd and resolved through symlinks with File.realpath when it exists (else realpath of the nearest existing parent + the rest). Refuse M-GATE-OUTSIDE when it is not inside the workspace root (Reach::Paths workspace root, i.e. REACH_WORKSPACE_ROOT or ~/reach-work - use the existing helper that gate.rb uses for spaces). ~/.reach is outside and is always refused. A Grep or Glob with no path searches the cwd and passes."
          - "Each refusal increments state/sandbox/<session>.json refusals; on the third, queue integrity outside_access {session_id, tool, count} through Reach::Integrity.queue (W-SBX-3), once per session."
          - "The existing Claude Code permissions deny of the vault and keys dirs stays."
      T4_shell_outside:
        file: lib/reach/gate.rb (check_segment! and helpers)
        detail:
          - "For every command segment (after the existing splitting and subshell refusal): argv[0] may be any program; every other token that is path-like (starts with /, ~, ./, ../, contains '/', or equals '..') or is an option value of the form --x=<path-like>, and every redirect target, is resolved as in T3 against the current directory; refuse M-GATE-OUTSIDE when outside the workspace root. Allowed exceptions: /dev/null, /dev/stdout, /dev/stderr, the Reach shim path and ~/.reach/bin/reach (as argv[0] or argv[1] after a ruby interpreter), and the Ruby interpreter paths the shim form already allows."
          - "cd, pushd and popd to a target outside the root are refused. Tokens containing $HOME, ${HOME}, $PWD-relative escapes or backticks are already refused as substitutions by the existing test; keep that."
          - "`reach import` run by the agent (the shim followed by import) is refused with M-GATE-OUTSIDE."
          - "Count refusals and queue outside_access as in T3."
          - "Keep every existing refusal (git, inline interpreter code, vault reads) unchanged; these are additions."
      T5_time_and_module_gate:
        files: [lib/reach/pace.rb, lib/reach/gate.rb]
        detail:
          - "Pace.writable?(workspace): meta = Reach::Workspace.metadata(workspace); status = the cached status (the same cache Reach::Sync writes); true when there is no cache (first run offline); false when meta assignment != status current_assignment id; false when server_now >= Time.parse(current_assignment due); true otherwise. server_now = Time.parse(status server_time) + (Time.now - Time.parse(status fetched_at)), falling back to Time.now.utc."
          - "Gate.write and the shell gate's owned-file write path in a slice: after the existing owned-file checks pass, refuse M-GATE-NOT-CURRENT unless Pace.writable?, and refuse M-GATE-NOT-YOUR-MODULE {modules: Reach::Modules.names(Reach::Modules.module_ids)} unless Reach::Modules.allows?(meta cutout_id). Qualify scenario files (qualify/features, qualify/step_definitions) follow the same rule."
          - "extracurricular/ and the root are outside both gates."
      T6_harness_hooks:
        file: lib/reach/harness.rb
        detail:
          - "Claude Code settings for every space kind: PreToolUse gains hook_entry('Read|Glob|Grep|NotebookRead|LS|WebFetch|WebSearch', h('gate', 'read', '--harness', 'claude-code'), 10). Keep the existing entries and order; add read after shell."
          - "Pass --harness to gate write and gate shell entries as well if they do not have it, so the gate knows the harness."
          - "Codex: add whatever read-like tool hooks Codex supports to codex_hooks_content (if Codex only exposes shell and apply_patch, the shell gate covers reads; say so in the report). If the Codex config supports turning web search off per project, set it off for slice and root spaces."
          - "Hermes: add the read gate to hermes_hooks_content for Hermes read/search/web tools (pre_tool_call with a matcher, following the existing entries' form)."
          - "Existing workspaces get the new settings through the existing refresh at session start (hello configure_workspace); verify that path covers all three harnesses."
      T7_imports:
        file: lib/reach/imports.rb (+ cli.rb 'import' verb for the student's own terminal)
        detail:
          - "Path extraction from the prompt text: file:// URIs (percent-decoded), single- or double-quoted absolute paths, unquoted absolute POSIX paths with backslash-escaped spaces (as Claude Code and terminals paste a dragged file), ~/ paths, and Windows drive paths (C:\\... ) on Windows only. Keep only paths that exist, are regular files, are not symlinks, and are outside the workspace root (a path already inside is skipped silently)."
          - "Limits from Reach::Policy.limits: at most import_max_per_prompt files (the rest -> one M-IMPORT-REFUSED with M-IMPORT-TOO-MANY), each <= import_max_bytes (M-IMPORT-TOO-LARGE with max in MB), extension in txt md csv tsv json yml yaml pdf png jpg jpeg gif webp xlsx docx pptx (case-insensitive; M-IMPORT-TYPE), and the space's materials/ total after the copy <= materials_max_bytes (M-IMPORT-FULL)."
          - "Copy into <space root>/materials/ (dir 0700), file 0600, name = basename sanitized to [A-Za-z0-9._-] (spaces to -), unique with -2, -3 ... before the extension. Stream the copy (IO.copy_stream), never load the whole file into memory."
          - "Record {source_name (basename only, never the full source path), name, space, bytes, digest, at, student_id} in state/imports.jsonl, an 'import' ledger record in a slice, and a transcript action entry through Reach::TranscriptIngest.record_action or Reach::Transcript.record (kind action, tool 'reach import', summary 'imported <name>, <bytes> bytes, sha256 <first 12 hex>')."
          - "Return M-IMPORT-OK {name} / M-IMPORT-REFUSED {source_name, reason} lines. Never raise."
          - "The student-typed `reach import <path>`: same checks, prints the plain result; refuses when there is no current space."
      T8_scan_skip:
        file: lib/reach/transcript_ingest.rb
        detail: "The turn-end course-record scan skips <space root>/materials/ (only at the space root, not every directory named materials)."
      T9_limits:
        file: lib/reach/limits.rb (+ doctor lines through cli.rb, + one sync block)
        detail:
          - "Corpus: only Reach's own JSONL fallback files (Reach::Corpus writes JSONL when no corpus port is available; find the path). When their total exceeds corpus_max_bytes, drop the oldest note and tip records first (rewrite files atomically), never receipt, qualification, attempt or anything tagged part; stop when under the cap. With a corpus port nothing is pruned; report the port as managing its own size."
          - "Transcript spool: when ~/.reach/transcripts totals more than transcript_spool_max_bytes, gzip (Zlib::GzipWriter) the oldest session files whose every entry Teach has acknowledged (read each session's .state.json acknowledged seq) into ~/.reach/transcripts/archive/<name>.jsonl.gz and remove the original only after the gzip is written and verified readable. Never touch a session with unacknowledged entries. Never delete an archive."
          - "materials/: nothing is pruned; imports refuse when full."
          - "Limits.report -> lines 'R-DOC-LIMITS corpus <MB> of <cap MB>', 'transcripts ...', 'materials <space>: ...' with a WARNING prefix when a size is above its cap after enforcement."
          - "Run Limits.enforce! from reach sync (one begin/rescue block, after W2's block) and show Limits.report in reach doctor (find where doctor lines are produced in cli.rb and add them there)."
      T10_paths:
        file: lib/reach/paths.rb
        add: "login_state_dir, consent_dir, modules_state_dir, part_state_dir, sandbox_state_dir, imports_file, transcripts_archive_dir - each under state_dir or transcripts_dir as in shared_contracts.state_files; the other workers may use these helpers or build the same paths with File.join(Reach::Paths.state_dir, ...)."
    acceptance:
      - "ruby -c under Ruby 2.6.10 (docker ruby:2.6.10-slim) for every file you touched."
      - "A scratch driver feeding hook JSON on stdin to `ruby exe/reach gate read|shell|write|prompt --harness claude-code` inside a scratch REACH_HOME with a faked enrolled install, workspace root and a confirmed login session file (write it directly in the driver) proves: Read of /etc/passwd -> exit 2 M-GATE-OUTSIDE; Read of a file in the slice -> 0; Glob with pattern /home/** -> refused; WebFetch in a slice -> M-GATE-NOWEB, in extracurricular -> 0; `cat ../../../../etc/hosts` -> refused; `ls materials` -> 0; `ruby ~/.reach/bin/reach support` logged out -> 0; any tool with an unconfirmed session -> M-LOGIN-NEEDED; three outside refusals -> one outside_access outbox entry."
      - "A prompt event whose text contains a quoted absolute path to a scratch .csv file outside the root copies it into materials/ with an import record and returns M-IMPORT-OK in the additionalContext JSON; a .exe is refused with M-IMPORT-TYPE."
      - "Pace: with a cached status whose current assignment differs from the slice's, a write to an owned file -> M-GATE-NOT-CURRENT; with server_time past due -> refused; otherwise allowed."
      - "Limits.enforce! on a scratch spool over a tiny cap gzips only acknowledged sessions."
      - Report every file changed, each acceptance result, what Codex and Hermes support you could and could not establish, and every gap.

  W4-part:
    summary: The student's own part (reach part, record, the submit gate, part.json), reach next and the per-turn anchor, reach support and the wellbeing hand, the login requirement on submit and qualify, and the skill text the agent reads.
    repo: /home/sven/github/foss/rEach
    owns_paths:
