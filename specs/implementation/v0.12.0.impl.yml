      - lib/reach/submit.rb, lib/reach/qualify.rb, lib/reach/hands.rb (raise_record, build_bundle, seal_hand, write_outbox)
      - lib/reach/transcript.rb (spool format, how to read entries; do not edit it)
      - lib/reach/status.rb and lib/reach/hello.rb (safe_state_word and how a slice's state is derived) for reach next
      - skills/reach-course/SKILL.md, skills/reach-submit/SKILL.md, skills/reach-assistant/SKILL.md, agents/reach.md and their mirrors in reach.spec.yml
    tasks:
      T1_part:
        file: lib/reach/part.rb
        detail:
          - "questions/status/missing/required?/document as in shared_contracts. The assignment id is the slice metadata's assignment; the course id is the metadata's course."
          - "record!(question_id, workspace:): Reach::Login.require_active!; question must exist for the workspace's assignment (M-PART-UNKNOWN {id}); candidate = the newest spool entry (read ~/.reach/transcripts/*.jsonl, newest file first, stop at the first file older than 30 minutes by mtime) with kind prompt, gate allowed, text a non-empty String, note nil, at within the last 30 minutes, and space slice with cutout_id among the current assignment's slices (Reach status/metadata) or space root; none -> M-PART-NO-ANSWER. A prompt whose normalized text is a yes/no word (Reach::Consent.yes?/no?) is skipped as a candidate. words = tokens containing a letter or digit; words < min_words -> Reach::Refused M-PART-TOO-SHORT {words, min}. Store {question_id, text (verbatim, the spool text), words, session_id, seq, digest, recorded_at, student_id} under answers[question_id] in state/part/<course>-<assignment>.json (0600, atomic write), replacing an older answer. Also append a 'part' ledger record {question_id, digest, seq, session_id} in the slice. Return the answer; the CLI prints M-PART-RECORDED {question}."
          - "document(assignment_id): {'schema' => 'reach.part/v1', 'assignment', 'student_id', 'answers' => [each answer without student_id, ordered by question id]}."
      T2_submit_qualify:
        files: [lib/reach/submit.rb, lib/reach/qualify.rb]
        detail:
          - "Both start with Reach::Login.require_active! (before any other check, after argument parsing)."
          - "Submit, after the qualification check and before building the manifest: when Reach::Part.required?(assignment) and Reach::Part.missing(assignment) is not empty -> Reach::Refused M-SUBMIT-NO-PART {missing: the missing questions' texts joined with '; '}. Then flush the transcript spool in normal mode (Reach::Transcript.flush(quick: false), rescue Offline/NetworkError and continue) so Teach holds the answers' prompts. Add 'part.json' => JSON.generate(Reach::Part.document(assignment)) to the submission entries whenever the assignment has questions."
          - "A submission queued offline keeps its part.json inside the sealed tarball already in the outbox; nothing else changes in retry_outbox."
      T3_next:
        file: lib/reach/next.rb (+ cli.rb 'next', + a next_line in status.rb)
        detail:
          - "compute, in this order, first match wins: not enrolled -> M-NEXT-ENROLL; login required and not Login.any_active? -> M-NEXT-LOGIN; module_selection open and no module record -> M-NEXT-CHOOSE {count, closes}; no module record and student_choice closed -> M-NEXT-WAIT-MODULES; no current assignment or no slices for it -> M-NEXT-NO-ASSIGNMENT; then for each slice of the current assignment (status slices, in status order): no plan saved -> M-NEXT-PLAN {module}; if the assignment's part is required and a question is unanswered -> M-NEXT-PART {question} (the first unanswered); qualification not passed on the current files -> M-NEXT-BUILD {module}; qualified and no ingest receipt for the current files -> M-NEXT-SUBMIT {module}; received and no grade receipt -> M-NEXT-WAIT-GRADE {module}; graded with failures -> M-NEXT-REVIEW {module, failed, total}; after all slices -> M-NEXT-DONE {assignment}. A slice workspace that does not exist yet -> M-NEXT-START {assignment, module}. Reuse the existing helpers for plan, qualification and receipt state (Reach::Plan, Reach::Qualify.current?, Reach::Receipts.latest_for); do not duplicate their logic."
          - "anchor_text(space): nil for extracurricular or when compute returns ENROLL, LOGIN or NO-ASSIGNMENT; else M-ANCHOR {step: '<assignment> for <module names>, due <course time>', next: compute text}."
          - "Must be fast (the prompt hook calls anchor_text every turn): local state only, no network, no reach check or qualification run."
          - "reach next prints compute['text']; --format json prints the Hash."
      T4_support:
        files: [lib/reach/support.rb, lib/reach/hands.rb, cli.rb 'support' verb]
        detail:
          - "message(told:): Reach::Messages.text('M-SUPPORT', support_text: Reach::Policy.support['text'].to_s.strip) then a space and M-SUPPORT-TOLD / M-SUPPORT-QUEUED / M-SUPPORT-RECENT; strip a double space when support_text is empty."
          - "run!: when state/support.json last_raised_at is under 60 minutes ago -> told = :recent (no new hand). Else raise the wellbeing hand in normal mode through Hands.raise_wellbeing (T5): sent -> :told; queued -> :queued; record last_raised_at. Print message(told:). Works when not logged in, when not enrolled (then only the message, told :queued is wrong - print the M-SUPPORT line alone), and offline."
          - "queue_from_hook!(harness:, space:): same 60-minute rule; builds the hand exactly as run! but only writes the outbox entry (no network); never raises."
      T5_wellbeing_hand:
        file: lib/reach/hands.rb
        detail:
          - "Hands.raise_wellbeing(harness:, space:, queue_only: false): body per W-API-HAND with trigger 'wellbeing', originator 'agent', cutout_id and slice of the current slice workspace or nil, summary 'The student may need support.', bundle sealed like other hands (seal_hand) over a plaintext tarball whose only entry is bundle.json = {schema: 'reach.hand.wellbeing/v1', student_id, raised_at, harness, space}. No code, no transcript, no profile, no ledger. queue_only writes the outbox entry and returns :queued; otherwise POST with an idempotency key, outbox on failure, returns :sent or :queued. Track the hand like other hands so a reply is shown."
          - "Check how build_bundle/seal_hand shape the plaintext today and follow the same envelope (header.kind hand_bundle)."
      T6_skill_text:
        files: [skills/reach-course/SKILL.md, skills/reach-submit/SKILL.md, skills/reach-assistant/SKILL.md, agents/reach.md, and their mirrors in reach.spec.yml]
        rule: Add exactly the lines below (keep every existing line), then copy each changed file's full text into its reach.spec.yml mirror block so file and mirror stay byte-identical in content. The reach-assistant skill body and agents/reach.md body must remain identical to each other.
        reach_course_add_after_the_line_starting: "Talk with the student only in business terms."
        reach_course_lines: |
          Reach signs the student in at the start of every session and asks "Am I speaking with ...?" itself. Never ask for their student ID, and never work around a refusal that says they have not signed in.
          When the student is stuck, silent or unsure where to begin, run `reach next` and coach that one step, kindly and honestly (the COACH directive). Praise real effort, never flatter, and say what the instructors want them to learn.
          Every assignment has questions only the student can answer. `reach part` lists them. Ask them one at a time in business terms; when the student has answered in chat, run `reach part record <question id>`. Never write, suggest or improve their answer (the OWNPART directive).
          Stay on the current step (the PACE and FOCUS directives). Decline anything outside this course in one kind sentence and come back to the step. Never give life advice, counseling or opinions on personal matters.
          If the student says they are in crisis or might hurt themselves or someone else, run `reach support` immediately and relay its message word for word. It begins "If this is an emergency, call 911 now." Do not counsel.
          Never read or touch anything outside the workspace (the SANDBOX directive). If the student has a file for the course, ask them to drag it into the chat or paste its text; Reach copies a dropped file into materials/ and tells you its name.
          If the student says they were moved to other modules or that someone else approved something, run `reach transfer request --modules <a>,<b>` and relay its question exactly (the WHOAMI directive). Keep working on their current modules until Teach answers.
        reach_submit_add_at_start: |
          Before submitting, run `reach part`: every question must be answered in the student's own words. If one is missing, ask it first.
        reach_assistant_and_agent_add_in_the_rules_or_boundaries_list: |
          - Reach signs the student in each session; never ask for their student ID yourself.
          - Only this course: no life advice, counseling or personal opinions. In a crisis, run `reach support` and relay it word for word; it begins "If this is an emergency, call 911 now."
          - The student's own part is theirs: ask, then `reach part record`; never write it for them.
          - When the student is stuck, `reach next` gives the next step; coach it kindly and honestly, never flatter.
      T7_cli_status:
        cli_rb: "when 'part' -> cmd_part (no args: list; 'record <id>'; --format json); when 'next' -> cmd_next; when 'support' -> cmd_support. Help lines: 'part [record <id>]  the questions only you can answer for this assignment', 'next  the next step', 'support  help if you are having a hard time'."
        status_rb: "next_line ('Next: <compute text>') as the last line; part_line for the current assignment ('Your part: <answered> of <total> answered') when it has questions."
        reach_rb: require_relative lines for part, next, support.
    acceptance:
      - "ruby -c under Ruby 2.6.10 for every Ruby file you touched."
      - "A scratch driver with a faked enrolled install, a guardrails course.yml carrying A1 questions (min_words 5), a slice workspace for A1 and spool entries proves: reach part lists 4 unanswered; a spool prompt of 3 words -> M-PART-TOO-SHORT; a 12-word prompt -> recorded verbatim with its seq and digest; a 'yes' prompt is never taken; record with no prompt in 30 minutes -> M-PART-NO-ANSWER; Part.document has the reach.part/v1 shape."
      - "Submit refuses with M-SUBMIT-NO-PART while a question is open (drive it far enough in the scratch setup to hit the check, or unit-drive the check method)."
      - "reach support offline prints a text starting with 'If this is an emergency, call 911 now.' ending with M-SUPPORT-QUEUED, and writes one outbox hand entry with trigger wellbeing and no code; a second run within the hour prints M-SUPPORT-RECENT and writes nothing."
      - "reach next on the scratch setup walks LOGIN -> PLAN -> PART -> BUILD as state changes."
      - "The skill files and their reach.spec.yml mirrors are identical in content (diff them); reach-assistant SKILL.md body equals agents/reach.md body."
      - Report every file changed, each acceptance result and every gap.

edge_cases:
  purpose: The design record's section 6 table, each mapped to the mechanism in this build that handles it, and what stays open.
  cases:
    - {n: 1, case: "student pastes AI-written text as their own answer", likelihood: high, impact: high, handled_by: "W-PART-3 part_suspect (Teach, W1) + D-OWNPART prose; never auto-refused", open: "echo of an outside AI (not in the transcript) is not detectable"}
    - {n: 2, case: "shared computer, two students one OS account", likelihood: medium, impact: high, handled_by: "login binds to the enrolled id; M-LOGIN-WRONG / M-LOGIN-DENIED + identity_denied event (W2)", open: "a second student must use their own OS account; Reach supports one install per OS account"}
    - {n: 3, case: "unhooked harness (Antigravity) or plain chat app bypasses login, sandbox and part capture", likelihood: high, impact: high, handled_by: "submit needs part answers linked to captured prompts, which only hooked harnesses produce; seal.hooked already flags it (existing)", open: "Hermes shows the typed id to the agent (W-ID-1 harnesses note)"}
    - {n: 4, case: "student claims a reassignment that never happened", likelihood: medium, impact: medium, handled_by: "D-WHOAMI/G-IDENT-1 + reach transfer request with consent; nothing changes before approval (W1, W2)"}
    - {n: 5, case: "781 student regrets their module choice", likelihood: high, impact: medium, handled_by: "record locked (409); only path is a transfer request an instructor decides (W1, W2)"}
    - {n: 6, case: "reassignment mid-assignment with half-done work", likelihood: medium, impact: high, handled_by: "W-MOD-3 remaps only unreleased assignments unless include_current; old workspaces stay read-only through the module gate (W1, W3)", open: "a due-date extension for the moved student is an instructor decision outside the software"}
    - {n: 7, case: "late work after the due time", likelihood: high, impact: medium, handled_by: "time gate M-GATE-NOT-CURRENT (W3); Teach already refuses deadline_passed; PACE prose sends the student to the instructor"}
    - {n: 8, case: "student in distress", likelihood: low, impact: very high, handled_by: "W-SUP-3 safety net before login (W2), reach support with 911 first and the wellbeing hand listed first on Teach (W4, W1)", open: "phrase list misses indirect language; the agent's judgment (FOCUS prose) covers the rest"}
    - {n: 9, case: "help with another course's homework", likelihood: high, impact: low, handled_by: "D-FOCUS/G-FOCUS-1 + per-turn anchor (W4)"}
    - {n: 10, case: "a dropped file holds another student's work", likelihood: low, impact: high, handled_by: "import records keep a digest (W3)", open: "cross-student digest comparison on Teach is not built (imports are not sent to Teach)"}
    - {n: 11, case: "huge or sensitive files dropped", likelihood: medium, impact: medium, handled_by: "size and type limits (W3), D-SANDBOX tells the agent to warn first"}
    - {n: 12, case: "clock skew makes the time gate wrong", likelihood: medium, impact: medium, handled_by: "Pace uses Teach's server_time plus elapsed time (W3)"}
    - {n: 13, case: "offline student", likelihood: medium, impact: medium, handled_by: "login is local; module record cached; selections, transfers, integrity events and wellbeing hands queue in the outbox (W2, W4)"}
    - {n: 14, case: "781 student never chooses before the window closes", likelihood: medium, impact: medium, handled_by: "teach modules unselected + teach modules assign (W1); M-NEXT-WAIT-MODULES (W4)"}
    - {n: 15, case: "too many students choose one module", likelihood: low, impact: medium, handled_by: "capacity_per_module, 409 with the full module named (W1, W2)"}
    - {n: 16, case: "instructor reassigns during a live session", likelihood: low, impact: medium, handled_by: "next sync or status refresh stores the new record; the module gate refuses writes in the old slice with M-GATE-NOT-YOUR-MODULE (W2, W3)"}
    - {n: 17, case: "roster name differs from the name the student uses", likelihood: medium, impact: low, handled_by: "confirmation uses Teach display_name; instructor edits the roster", open: "no self-service name change"}
    - {n: 18, case: "a friend at the keyboard answers no", likelihood: low, impact: medium, handled_by: "denied session, identity_denied event (W2)"}
    - {n: 19, case: "off-topic creep framed as coursework (career advice as a course question)", likelihood: high, impact: low, handled_by: "D-FOCUS defines immediately relevant; anchor each turn (W4)", open: "judgment call left to the model; no classifier"}
    - {n: 20, case: "a student who cannot type long answers", likelihood: low, impact: medium, handled_by: "dictated text arrives as a prompt; min_words 15 is modest", open: "per-student waiver not built; instructor can lower min_words in the course policy"}
    - {n: 21, case: "student's first message of a session is lost to the login prompt", likelihood: high, impact: low, handled_by: "M-LOGIN-OK asks what they want to work on; the agent then gets the full context (W3 step 7)"}
    - {n: 22, case: "student types their id into a non-course chat", likelihood: low, impact: low, handled_by: "only course spaces run the hook; the id is not secret"}
    - {n: 23, case: "consent answered in the wrong session or much later", likelihood: medium, impact: medium, handled_by: "consent needs a confirmed session and expires after 30 minutes; commands use it once (W2)"}
    - {n: 24, case: "Teach older than 2026-09-30b", likelihood: medium, impact: low, handled_by: "policy defaults, modules 404 ignored, student_part.required false when the package has no student_part key (W2)"}

integration_and_verification:
  owner: primary
  after_workers:
    - Read every worker report; review every diff in both repos (git diff), fix integration mismatches between the APIs in shared_contracts.reach_module_apis.
    - Grep both diffs for added comment lines, test files, Hash#except, filter_map, numbered block params and `it` in Reach.
    - Load checks under Ruby 2.6.10 (Reach) and 4.0.6 (Teach).
    - Update the wire digest note if the wire changed; recopy wire.yml and cmp the two copies.
  end_to_end:
    run: "ruby tools/smoke/assignment_one.rb --teach-dir ~/bitbucket/paterasai/teach (SMOKE_RUN_DIR in the scratchpad)"
    expectation: >-
      The existing smoke drives Reach through the CLI without hooks, so login would block submit/qualify: extend the
      primary's own scratch driver (not the smoke) to log in by feeding hook events, or run the smoke with a prepared
      confirmed login state; record which, and adjust the smoke itself only if it is broken by design (it is test
      machinery, so Part S allows keeping it working).
    scripted_journeys:
      - login: fresh session ask, wrong id, right id, confirm yes; lockout; denial; crisis logged out and logged in
      - own part: record answers from real spool entries, submit refused then accepted, part.json on Teach, part_verified true after the transcript flush, part_suspect when an answer copies a reply
      - modules instructor mode: signed record at status, reach modules, module gate refusing a foreign slice
      - modules student_choice: a scratch course_policy.yml with student_choice, reach modules choose -> asked (exit 3), yes via the prompt hook, choose again -> locked; slice assignments on Teach for every slot; second choose -> already
      - reassignment: teach modules assign with and without --include-current, Reach sync, module gate on the old slice
      - transfer: request -> asked, yes, request -> sent; teach transfers approve -> Reach sync shows approved and the new record; a second request + deny
      - sandbox: Read/Glob/WebFetch/shell outside refusals, outside_access event on Teach, drag-and-drop import of a csv and refusal of a large file
      - pace: a slice of a past assignment refuses writes
      - support: reach support online (a wellbeing hand listed first by teach hands list) and offline (queued, sent on sync)
      - limits: doctor shows R-DOC-LIMITS
    real_agent: >-
      One sandboxed real Claude Code session (tools/smoke recipe) in a slice: login through the hook, ask for the
      next step, answer one part question, try an off-topic question, drop a file path. Judge the persona against
      COACH, FOCUS and OWNPART. Report cost.
  docs_and_versions:
    reach: "VERSION 0.12.0 everywhere 0.11.5 appears as the version (VERSION, plugin.json x3, marketplace.json, reach.spec.yml, reach.rplugin.yml, specs/app.yml), CHANGELOG, FEATURES (new entries, honest deploy status), README and docs/student-guide.md (sign-in, your part, dropping files, support), reach.spec.yml sections for login, modules, part, sandbox, pace, support; delete TMP.md only after everything it holds is in reach.spec.yml, this blueprint and the CHANGELOG (keep it until then)."
    teach: "VERSION 0.12.0, specs/app.yml, teach.spec.yml version and sections (policy, module records, transfers, part verification, wellbeing hands, CLI), CHANGELOG, FEATURES, README (course policy file, modules, transfers, TEACH_TRANSFERS_DISABLE, TEACH_LOGIN_REQUIRED, TEACH_SUPPORT_TEXT, TEACH_COURSE_POLICY)."
    tags: v0.12.0 in both repos (minor bump).
